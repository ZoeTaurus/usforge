          FX.confetti(P.x, P.y - 12, 20); FX.debris(P.x, P.y - 12, 16, bodyColors(P), P.y);
          comic('POP!', P.x, P.y - 36, { scale: 2 });
          ghostOut(C, P.x, P.y - 4, 0.4);
        }
      }
      if (then === 'faint' && t > gather + 0.8 && !done) {
        done = true; fxLie(P, -P.face); Sound.play('thud'); ghostOut(C, P.x, P.y - 4, 0.4);
      }
      if (then === 'melt' && t > gather + 0.3) {
        const k = clamp((t - gather - 0.3) / 1.2, 0, 1);
        f.variant = 'green'; f.sy = 1 - k * 0.85; f.sx = 1 + k * 0.7;
        if (k >= 1 && !done) { done = true; ghostOut(C, P.x, P.y, 0.2); }
      }
      for (const b of bugs) {
        if (b.delay > 0) { b.delay -= dt; continue; }
        b.a += b.sp * dt;
        let cx = P.x + (P.fx.dx || 0), cy = P.y - 12 + (P.fx.dy || 0);
        if (then === 'carrySide') cy = P.y - 2;
        const tx = cx + Math.cos(b.a) * b.r * (then === 'carrySide' ? 1.3 : 1);
        const ty = cy + Math.sin(b.a) * b.r * (then === 'carrySide' ? 0.1 : 0.8) + Math.sin(t * 9 + b.phase) * 2 + (then === 'carryUp' ? -8 : 0);
        const k = Math.min(1, dt * (t < gather ? 3 : 12));
        b.x += (tx - b.x) * k; b.y += (ty - b.y) * k;
        if (done && then !== 'carryUp' && then !== 'carrySide') { b.y -= 30 * dt; }
      }
    },
    draw(t) {
      const fr = Math.floor(t * 12) % 2 ? '1' : '2';
      for (const b of bugs) if (b.delay <= 0) spr(crit + fr, b.x, b.y, { anchor: 'c', flip: Math.cos(b.a) < 0 });
    },
  };
};

// ---------------------------------------------------------------- fight (cartoon dust cloud)
DFX.fight = (C) => {
  const { P, o} = C;
  const foe = o.foe || 'goose';
  const fsz = sprSize(foe);
  const fromDir = o.from === 'left' ? -1 : o.from === 'obj' ? 0 : 1;
  let fx0 = C.obj && fromDir === 0 ? C.obj.x + C.obj.w / 2 : P.x + fromDir * 120;
  if (C.obj && o.hideObj !== false) C.obj.hidden = true;
  const bits = [];
  const syms = ['★', '@', '#', '!', '$', '%', '&', '*', '?'];
  let cloud = false, over = false;
  Sound.play(o.sfx || 'honk');
  if (o.text) comic(o.text, fx0, P.y - fsz.h - 12, { scale: 2 });
  return {
    dur: 4,
    update(dt, t) {
      const f = P.fx;
      if (t < 0.45) { f.expr = 'scared'; this.fx = lerp(fx0, P.x + (fromDir || 1) * 8, ease.inQuad(t / 0.45)); return; }
      if (!cloud) { cloud = true; f.hidden = true; FX.shake(3, 1.6); }
      if (t < 2.1) {
        if (Math.random() < dt * 14) {
          const a = rand(TAU);
          bits.push({ kind: Math.random() < 0.55 ? 'sym' : 'limb', s: choice(syms), x: P.x + Math.cos(a) * rand(10, 16), y: P.y - 12 + Math.sin(a) * rand(6, 11), t: 0, a, c: choice([PAL.W, PAL.y, PAL.r]) });
          if (Math.random() < 0.5) Sound.play(choice(['bonk', 'honk', 'poof', 'yelp', o.sfx || 'bonk']));
        }
        for (const b of bits) b.t += dt;
        for (let i = bits.length - 1; i >= 0; i--) if (bits[i].t > 0.25) bits.splice(i, 1);
      } else if (!over) {
        over = true; f.hidden = false; fxLie(P, -1);
        FX.dust(P.x, P.y, 10, '#c0cbdc');
        comic(o.win || 'K.O.!', P.x, P.y - 34, { scale: 2, color: PAL.r, shadow: PAL.K });
        Sound.play('thud');
        ghostOut(C, P.x, P.y - 4, 0.5);
        this.fx = P.x + 18;
      }
    },
    draw(t) {
      if (!cloud) { spr(foe, this.fx === undefined ? fx0 : this.fx, P.y, { anchor: 'bc', flip: (fromDir || 1) > 0 }); return; }
      if (!over) {
        for (let i = 0; i < 7; i++) {
          const a = i / 7 * TAU + t * 3;
          circle(P.x + Math.cos(a) * 9 + rand(-1, 1), P.y - 12 + Math.sin(a) * 6 + rand(-1, 1), 7 + (i % 2), '#c0cbdc');
        }
        circle(P.x, P.y - 12, 9, '#ffffff');
        for (const b of bits) {
          if (b.kind === 'sym') text(b.s, b.x, b.y - 4, { color: b.c, outline: PAL.K });
          else {
            const lx = b.x + Math.cos(b.a) * 3, ly = b.y + Math.sin(b.a) * 3;
            line(b.x, b.y, lx + Math.cos(b.a) * 4, ly + Math.sin(b.a) * 4, Math.random() < 0.5 ? pcol(P)[3] : (o.limbColor || '#ffffff'));
          }
        }
      } else {
        spr(foe, this.fx, P.y, { anchor: 'bc', flip: false });
        if (o.smug !== false) text('HMPH', this.fx + 2, P.y - fsz.h - 10, { font: 'small', color: PAL.W, outline: PAL.K });
      }
    },
  };
};

// ---------------------------------------------------------------- melt
DFX.melt = (C) => {
  const { P, o } = C;
  const puddle = o.puddle || '#63c74d';
  let melted = false;
  Sound.play(o.sfx || 'squish');
  return {
    dur: 4,
    update(dt, t) {
      const f = P.fx;
      f.expr = t < 0.5 ? (o.expr || 'sick') : 'sick';
      if (t > 0.3) f.variant = o.variant === undefined ? 'green' : o.variant;
      if (t > 0.8) {
        const k = clamp((t - 0.8) / 1.4, 0, 1);
        f.sy = 1 - k * 0.9; f.sx = 1 + k * 0.8; f.dx = Math.sin(t * 8) * (1 - k);
        if (Math.random() < dt * 10) FX.add({ type: 'px', x: P.x + rand(-6, 6), y: P.y - 14 * (1 - k), vy: 20, grav: 200, life: 0.4, color: puddle, floor: P.y - 1 });
        this.pw = 4 + k * 10;
        if (k >= 1 && !melted) {
          melted = true; f.hidden = true; Sound.play('glug');
          comic(o.text || 'BLORP', P.x, P.y - 22, { color: PAL.l, scale: 1 });
          ghostOut(C, P.x, P.y - 2, 0.6);
        }
      }
    },
    drawBehind() {
      if (this.pw) { ellipse(P.x, P.y - 1, this.pw, 2, puddle); ellipse(P.x - 2, P.y - 1, this.pw * 0.5, 1, '#ffffff'); }
    },
    drawTop(t) {
      if (o.licker) {
        const side = o.lickSide || -P.face;
        const k = Math.min(1, t / 0.5);
        const dx = P.x + side * (46 - 22 * ease.outCubic(k));
        spr(o.licker, dx, P.y, { anchor: 'bc', flip: side > 0 });
        if (t > 0.5 && Math.floor(t * 8) % 2 === 0) {
          const tx = P.x + side * 6;
          rect(Math.min(tx, dx - side * 20), P.y - 16, Math.abs(dx - side * 20 - tx), 4, '#f6757a');
          if (Math.random() < 0.2) Sound.play('squish');
        }
      }
    },
    draw(t) {
      if (melted) {
        const blink = Math.floor(t * 3) % 4 === 0;
        px(P.x - 2, P.y - 2, blink ? puddle : PAL.W); px(P.x + 2, P.y - 2, blink ? puddle : PAL.W);
        if (!blink) { px(P.x - 2, P.y - 2, PAL.W); px(P.x - 1, P.y - 2, PAL.K); px(P.x + 2, P.y - 2, PAL.W); px(P.x + 3, P.y - 2, PAL.K); }
      }
    },
  };
};

// ---------------------------------------------------------------- stone / gold statue
DFX.stone = (C) => {
  const { P, o} = C;
  const mat = o.material || 'stone';
  let done = false;
  Sound.play(mat === 'gold' ? 'sparkle' : 'crunch');
  return {
    dur: 4.2,
    update(dt, t) {
      P.fx.expr = o.expr || 'shock';
      P.fx.hidden = true;
      if (t > 1.5 && !done) {
        done = true;
        Sound.play(mat === 'gold' ? 'coin' : 'thud');
        comic(o.text || (mat === 'gold' ? 'BLING!' : 'STONED'), P.x, P.y - 32, { scale: 2, color: mat === 'gold' ? PAL.y : PAL.G });
        ghostOut(C, P.x, P.y - 10, 1.2);
      }
      if (mat === 'gold' && done && Math.random() < dt * 6) FX.icon('p_star_small', P.x + rand(-6, 6), P.y - rand(2, 18), { vy: 0, life: 0.4 });
      if (o.pigeon && t > 2 && !this.pg) { this.pg = { x: P.x - 120, y: P.y - 80 }; Sound.play('coo'); }
      if (this.pg) { this.pg.x = lerp(this.pg.x, P.x, dt * 4); this.pg.y = lerp(this.pg.y, P.y - 21, dt * 4); }
    },
    draw(t) {
      const k = clamp((t - 0.3) / 1.2, 0, 1);
      const expr = P.fx.expr;
      const c1 = pCanvas(P, 'stand', expr, null), c2 = pCanvas(P, 'stand', expr, mat);
      const x = Math.round(P.x - c1.width / 2), y = Math.round(P.y - c1.height);
      const cut = Math.round(c1.height * (1 - k));
      const g = Gfx.g;
      if (cut > 0) g.drawImage(c1, 0, 0, c1.width, cut, x, y, c1.width, cut);
      if (cut < c1.height) g.drawImage(c2, 0, cut, c2.width, c2.height - cut, x, y + cut, c2.width, c2.height - cut);
      if (k > 0 && k < 1) rect(x, y + cut, c1.width, 1, mat === 'gold' ? PAL.W : PAL.G);
      if (this.pg) spr('pigeon1', this.pg.x, this.pg.y, { anchor: 'bc' });
      if (done) rect(P.x - 7, P.y - 1, 14, 2, mat === 'gold' ? '#d77643' : '#5a6988');
    },
  };
};

// ---------------------------------------------------------------- bonk (projectile to the head)
DFX.bonk = (C) => {
  const { P, o} = C;
  const count = o.count || 1;
  const prop = o.prop || 'rock';
  const s = objCenter(C);
  const start = o.from === 'above' ? { x: P.x + (o.fx || 0), y: World.cam.y - 10 } : o.from === 'left' ? { x: World.cam.x - 10, y: P.y - 30 } : o.from === 'right' ? { x: World.cam.x + W + 10, y: P.y - 30 } : { x: s.x + (o.sx || 0), y: s.y + (o.sy || 0) };
  const T = o.T || 0.5;
  const shots = [];
  for (let i = 0; i < count; i++) shots.push({ t0: (o.delay || 0.2) + i * (o.gap || 0.18), hit: false, x: start.x, y: start.y, dx: rand(-6, 6) * (count > 1 ? 1 : 0) });
  let down = false, lastHit = 0;
  if (o.sfxPre) Sound.play(o.sfxPre);
  return {
    dur: shots[shots.length - 1].t0 + T + 2.6,
    update(dt, t) {
      const f = P.fx;
      if (!down) f.expr = t > 0.1 ? 'shock' : 'normal';
      for (const sh of shots) {
        if (t < sh.t0) continue;
        const k = (t - sh.t0) / T;
        const hx = P.x + sh.dx * 0.3, hy = P.y - 16;
        if (!sh.hit) {
          if (o.path === 'boomerang') {
            const out = Math.sin(Math.min(1, k) * Math.PI);
            sh.x = lerp(start.x, hx, Math.min(1, k)) + out * (o.throwDir || P.face) * 90;
            sh.y = lerp(start.y, hy, Math.min(1, k)) - out * 25;
          } else if (o.path === 'arc') {
            sh.x = lerp(start.x, hx, Math.min(1, k));
            sh.y = lerp(start.y, hy, Math.min(1, k)) - Math.sin(Math.min(1, k) * Math.PI) * (o.arc || 30);
          } else {
            sh.x = lerp(start.x, hx, Math.min(1, k)); sh.y = lerp(start.y, hy, ease.inQuad(Math.min(1, k)));
          }
          sh.rot = t * 14;
          if (k >= 1) {
            sh.hit = true; lastHit = t;
            sh.vx = rand(-60, 60); sh.vy = -120;
            Sound.play(o.sfx || 'bonk');
            FX.shake(count > 1 ? 2 : 4, 0.2);
            if (count === 1 || Math.random() < 0.4) comic(o.text || 'BONK!', hx + rand(-6, 6), hy - 14, { scale: count > 1 ? 1 : 2 });
            FX.icon('p_star', hx, hy - 4, { vx: rand(-30, 30), vy: -40, life: 0.5 });
            f.expr = 'pain';
            f.dx = -P.face * 2;
          }
        } else {
          sh.vy += 500 * dt; sh.x += sh.vx * dt; sh.y += sh.vy * dt; sh.rot += 10 * dt;
          if (sh.y > P.y - 2) { sh.y = P.y - 2; sh.vy *= -0.3; sh.vx *= 0.6; }
        }
      }
      const allHit = shots.every((s2) => s2.hit);
      if (allHit && !down) {
        const k = (t - lastHit);
        f.expr = 'dizzy';
        f.rot = Math.sin(k * 6) * 0.25 * Math.min(1, k * 3);
        if (k > 0.9) {
          down = true; fxLie(P, -P.face); Sound.play('thud'); FX.dust(P.x, P.y, 5);
          ghostOut(C, P.x, P.y - 4, 0.4);
          this.downT = t;
        }
      }
    },
    draw(t) {
      for (const sh of shots) if (t >= sh.t0) spr(prop, sh.x, sh.y, { anchor: 'c', rot: o.noSpin ? 0 : sh.rot });
      if (!down && shots.every((s2) => s2.hit)) starsAround(P.x, P.y - 22, t);
      if (down && o.bump !== false) starsAround(P.x - P.face * 8, P.y - 8, t, 3, 6);
    },
  };
};

// ---------------------------------------------------------------- wave (tsunami, avalanche, stampede)
DFX.wave = (C) => {
  const { P, o} = C;
  const kind = o.kind || 'water';
  let dir = o.dir || (o.from === 'left' ? 1 : -1);
  let front = dir > 0 ? World.cam.x - 60 : World.cam.x + W + 60;
  const src = o.fromObj && C.obj ? C.obj.x + C.obj.w / 2 : null;
  if (src !== null) { dir = P.x > src ? 1 : -1; front = src; }
  const speed = o.speed || 170;
  let caught = false;
  const clowns = [];
  if (kind === 'clowns') for (let i = 0; i < 26; i++) clowns.push({ off: i * 9 + rand(0, 5), bob: rand(TAU), look: randomLook() });
  Sound.play(kind === 'snow' ? 'rumble' : kind === 'clowns' ? 'honk' : 'splash');
  if (o.text) comic(o.text, P.x, P.y - 34, { scale: 2 });
  return {
    dur: o.dur || 4.2,
    update(dt, t) {
      const f = P.fx;
      f.expr = 'scared';
      if (t < (o.pre || 0.5)) { P.face = -dir; FX.shake(1, 0.1); return; }
      front += speed * dir * dt;
      if (!caught && (dir > 0 ? front > P.x - 4 : front < P.x + 4)) {
        caught = true; Sound.play(kind === 'snow' ? 'crash' : kind === 'clowns' ? 'honk' : 'splash'); FX.shake(5, 0.5);
        if (kind === 'clowns') { P.fx.sy = 0.14; P.fx.sx = 1.9; P.fx.expr = 'dead'; ghostOut(C, P.x, P.y - 4, 1.3); }
      }
      if (caught && kind !== 'clowns') {
        P.x = front - dir * 12; f.rot += 12 * dt; f.dy = -10 + Math.sin(t * 7) * 4;
        if ((P.x - World.cam.x < -30 || P.x - World.cam.x > W + 30) && !this.gone) { this.gone = true; f.hidden = true; }
      }
      if (kind === 'clowns' && Math.random() < dt * 6) Sound.play('honk');
    },
    draw(t) {
      if (kind === 'water') {
        const x = front;
        for (let i = 0; i < 90; i += 3) {
          const hx = x - dir * i;
          const h = Math.max(0, 70 - i * 0.6 + Math.sin(i * 0.3 + t * 8) * 3);
          rect(hx - 1, P.y - h, 3, h + 30, i < 12 ? '#2ce8f5' : '#0099db');
          if (i < 12) rect(hx - 1, P.y - h, 3, 3, '#ffffff');
        }
        for (let i = 0; i < 8; i++) circle(x + dir * rand(0, 6), P.y - 70 + i * 3 + rand(-2, 2), 3, '#ffffff');
      } else if (kind === 'snow') {
        for (let i = 0; i < 110; i += 4) {
          const hx = front - dir * i;
          const h = 60 - i * 0.2 + Math.sin(i * 0.5 + t * 5) * 5;
          rect(hx - 2, P.y - h, 5, h + 20, i % 8 ? '#ffffff' : '#c0cbdc');
        }
        for (let i = 0; i < 6; i++) circle(front + dir * 3, P.y - rand(0, 60), rand(2, 5), '#ffffff');
      } else if (kind === 'clowns') {
        for (const c of clowns) {
          const cx = front - dir * c.off;
          if (src !== null && (cx - src) * dir < 0) continue; // still inside the car
          const bob = Math.abs(Math.sin(t * 16 + c.bob)) * 3;
          spr('clown', cx, P.y - bob, { anchor: 'bc', flip: dir < 0 });
        }
        if (src !== null && C.obj) C.obj.shakeT = 0.05;
      }
    },
  };
};

// ---------------------------------------------------------------- disintegrate
DFX.disintegrate = (C) => {
  const { P, o } = C;
  const T = o.T || 1.6;
  const pre = o.pre || 0.3;
  const c = pCanvas(P, 'stand', o.expr || 'shock', o.variant || null);
  const img = c.getContext('2d').getImageData(0, 0, c.width, c.height).data;
  const x0 = Math.round(P.x - c.width / 2), y0 = Math.round(P.y - c.height);
  let lastRow = -1;
  const wind = o.dir || -P.face;
  if (o.sfx) Sound.play(o.sfx);
  if (o.text) comic(o.text, P.x, P.y - 32, { scale: 2 });
  return {
    dur: pre + T + 1.6,
    update(dt, t) {
      P.fx.hidden = true;
      const k = clamp((t - pre) / T, 0, 1);
      const row = Math.floor(k * c.height);
      for (let r = lastRow + 1; r <= row && r < c.height; r++) {
        for (let x = 0; x < c.width; x++) {
          const i = (r * c.width + x) * 4;
          if (img[i + 3] === 0) continue;
          FX.add({ type: 'px', x: x0 + x, y: y0 + r, vx: wind * rand(20, 70), vy: rand(-30, 5), life: rand(0.6, 1.3), color: rgbToHex(img[i], img[i + 1], img[i + 2]), drag: 0.5 });
        }
        if (r % 3 === 0) Sound.play('tick');
      }
      lastRow = row;
      if (k >= 1 && !this.end) { this.end = true; if (o.ghost) ghostOut(C, P.x, P.y - 4, 0.2); }
    },
    draw(t) {
      const k = clamp((t - pre) / T, 0, 1);
      const cut = Math.floor(k * c.height);
      if (cut < c.height) Gfx.g.drawImage(c, 0, cut, c.width, c.height - cut, x0, y0 + cut, c.width, c.height - cut);
      if (o.beam && t < pre + T) {
        const s = objCenter(C);
        const col = Math.floor(t * 20) % 2 ? '#e43b44' : '#ff0044';
        line(s.x, s.y, P.x, P.y - 12, col); line(s.x, s.y + 1, P.x, P.y - 11, '#ffffff');
      }
    },
  };
};

// ---------------------------------------------------------------- jump out of your skin
DFX.skinjump = (C) => {
  const { P, o} = C;
  let jumped = false;
  const sk = { x: P.x, y: P.y, vy: 0, vx: 0 };
  Sound.play('gasp');
  comic('!', P.x, P.y - 30, { scale: 2, color: PAL.r });
  return {
    dur: 3.6,
    update(dt, t) {
      const f = P.fx;
      if (t < 0.45) { f.expr = 'scared'; f.dx = Math.sin(t * 80); return; }
      if (!jumped) {
        jumped = true; sk.vy = -230; sk.vx = -P.face * 30;
        Sound.play('scream'); Sound.play('boing');
        comic(o.text || 'EEEEK!', P.x, P.y - 40, { scale: 2 });
        f.dx = 0;
      }
      const k = clamp((t - 0.45) / 0.4, 0, 1);
      f.sy = 1 - k * 0.86; f.sx = 1 + k * 0.5; f.expr = 'dead';
      sk.vy += 600 * dt; sk.y += sk.vy * dt; sk.x += sk.vx * dt;
      if (sk.y > P.y) { sk.y = P.y; sk.vy = 0; sk.vx = -P.face * 160; }
    },
    draw(t) {
      if (jumped) spr('skeleton', sk.x, sk.y - (sk.vy === 0 ? Math.abs(Math.sin(t * 20)) * 3 : 0), { anchor: 'bc', flip: P.face > 0 });
    },
  };
};

// ---------------------------------------------------------------- UFO abduction
DFX.abduct = (C) => {
  const { P, o} = C;
  const ufo = { x: World.cam.x - 30, y: 14 };
  const tx = P.x, ty = Math.max(14, P.y - 90);
  let beam = false, taken = false;
  Sound.play('beam');
  const y0 = P.y;
  return {
    dur: 4.4,
    update(dt, t) {
      const f = P.fx;
      if (t < 0.9) { const k = ease.outCubic(t / 0.9); ufo.x = lerp(World.cam.x - 30, tx, k); ufo.y = lerp(10, ty, k); f.expr = 'look_up'; return; }
      if (!beam) { beam = true; Sound.play('beam'); comic(o.text || 'BZZZWOOM', P.x, ty + 20, { color: PAL.l }); }
      if (!taken) {
        const k = clamp((t - 1.1) / 1.4, 0, 1);
        f.dy = -(y0 - ty - 6) * ease.inQuad(k); f.rot = Math.sin(t * 3) * 0.6; f.pose = 'armsup'; f.expr = 'scared';
        f.sx = f.sy = 1 - k * 0.5;
        if (k >= 1) { taken = true; f.hidden = true; Sound.play('pop'); this.tt = t; }
      } else {
        const k = t - this.tt;
        if (k > 0.4) { ufo.x += 400 * dt; ufo.y -= 120 * dt; if (!this.zip) { this.zip = true; Sound.play('rise', 0.4); } }
        if (k > 1.0 && !this.shoe) {
          this.shoe = true;
          FX.add({ type: 'spr', sprite: 'shoe_' + P.look.shoes, x: tx, y: World.cam.y - 10, vy: 60, grav: 300, life: 2, floor: P.y - 2, bounce: 0.3, spin: true, vr: 8, fade: false });
        }
      }
    },
    draw(t) {
      if (beam && !taken) {
        const g = Gfx.g;
        for (let y = ufo.y + 6; y < P.y; y += 1) {
          const w = 5 + (y - ufo.y) * 0.22;
          dither(ufo.x - w, y, w * 2, 1, (Math.floor(y + t * 30) % 6 < 3) ? '#fee761' : '#ffffff', 6);
        }
      }
      spr(Math.floor(t * 10) % 2 ? 'ufo1' : 'ufo2', ufo.x, ufo.y + 8, { anchor: 'bc' });
    },
  };
};

// ---------------------------------------------------------------- vibrate (too much coffee)
DFX.vibrate = (C) => {
  const { P, o} = C;
  const T = o.T || 1.4;
  let zoom = false, gone = false;
  Sound.play('buzz');
  return {
    dur: T + 2.4,
    update(dt, t) {
      const f = P.fx;
      if (t < T) {
        const a = (t / T) * 3;
        f.dx = rand(-a, a); f.dy = rand(-a / 2, a / 2); f.expr = 'shock';
        if (Math.random() < dt * 20) Sound.play('tick');
        if (Math.random() < dt * 10) FX.add({ type: 'line', x: P.x + rand(-8, 8), y: P.y - rand(0, 18), vx: rand(-50, 50), vy: 0, life: 0.1, color: PAL.W });
        return;
      }
      if (o.then === 'dust') {
        if (!gone) { gone = true; f.hidden = true; crumble(P, P.x, P.y); ghostOut(C, P.x, P.y - 4, 0.3); }
        return;
      }
      if (!zoom) { zoom = true; Sound.play('whoosh'); comic(o.text || 'ZOOOM!', P.x, P.y - 30, { scale: 2 }); f.pose = 'run'; f.dx = 0; f.dy = 0; }
      if (!gone) {
        P.x += P.face * 520 * dt;
        FX.add({ type: 'line', x: P.x - P.face * 6, y: P.y - rand(2, 16), vx: P.face * 300, vy: 0, life: 0.15, color: PAL.W });
        if (Math.random() < dt * 30) FX.add({ type: 'puff', x: P.x - P.face * 8, y: P.y - 2, life: 0.4, size: 2, grow: 3, color: '#c0cbdc' });
        if (P.x - World.cam.x < -30 || P.x - World.cam.x > W + 30) { gone = true; f.hidden = true; this.gt = t; Sound.play('crash'); FX.shake(3, 0.3); }
      }
    },
    draw(t) {
      if (gone && this.gt && t - this.gt > 0.5 && t - this.gt < 2) {
        const x = P.face > 0 ? World.cam.x + W - 14 : World.cam.x + 14;
        if (!this.d) { this.d = true; Sound.play('ding'); }
        spr(Math.floor(t * 8) % 2 ? 'p_star' : 'p_star_small', x, P.y - 40, { anchor: 'c' });
      }
    },
  };
};

// ---------------------------------------------------------------- teleport fail (legs out of the floor)
DFX.telefail = (C) => {
  const { P, o } = C;
  let arrived = false;
  const tx = o.dx ? P.x + o.dx : P.x;
  Sound.play('teleport');
  return {
    dur: 3.8,
    update(dt, t) {
      const f = P.fx;
      if (t < 0.7) { f.alpha = 1 - t / 0.7; f.expr = 'happy'; if (Math.random() < dt * 30) FX.add({ type: 'px', x: P.x + rand(-6, 6), y: P.y - rand(0, 20), vy: -40, life: 0.3, color: choice([PAL.c, PAL.W, PAL.V]) }); return; }
      if (!arrived) {
        arrived = true; f.alpha = 1; P.x = tx;
        f.rot = Math.PI; f.dy = 11; f.clipY = P.y; f.expr = 'dead';
        Sound.play('thud'); FX.dust(P.x, P.y, 6);
        comic(o.text || '95% ARRIVED', P.x, P.y - 30, { scale: 1, color: PAL.c });
        ghostOut(C, P.x, P.y, 1.2);
      }
      f.dx = (t < 2.2) ? Math.sin(t * 20) * 1.2 : 0;
    },
  };
};

// ---------------------------------------------------------------- nuke (mushroom cloud)
DFX.nuke = (C) => {
  const { P, o} = C;
  let boom = false;
  const cx = P.x;
  Sound.play('alarm');
  return {
    dur: 5.4,
    update(dt, t) {
      const f = P.fx;
      if (t < 0.9) { f.expr = t > 0.4 ? 'scared' : 'normal'; if (C.obj) C.obj.shakeT = 0.1; return; }
      if (!boom) {
        boom = true; f.hidden = true;
        FX.flash('#ffffff', 0.9); FX.shake(10, 2.2); FX.hitstop(0.12);
        Sound.play('bigboom');
        FX.debris(cx, P.y - 10, 40, bodyColors(P).concat(['#feae34', '#e43b44']), P.y, { speed: 220 });
        ghostOut(C, cx, P.y - 10, 2.2, { sprite: 'ghost_soot', text: 'OOPS' });
        this.bt = t;
      }
      if (t - this.bt < 2.5 && Math.random() < dt * 20) FX.add({ type: 'px', x: World.cam.x + rand(W), y: World.cam.y - 2, vy: rand(10, 25), vx: rand(-5, 5), life: 3, color: choice(['#5a6988', '#8b9bb4', '#3a4466']) });
    },
    draw(t) {
      if (!boom) return;
      const k = clamp((t - this.bt) / 2.2, 0, 1);
      const e = ease.outCubic(k);
      const top = P.y - 20 - e * 110;
      // stem
      for (let y = top + 10; y < P.y; y += 3) {
        const w = 6 + (P.y - y) * 0.08 + Math.sin(y * 0.3 + t * 5) * 1.5;
        rect(cx - w, y, w * 2, 3, (Math.floor(y / 3) % 2) ? '#feae34' : '#f77622');
      }
      // cap
      const r = 10 + e * 34;
      for (let i = 0; i < 9; i++) {
        const a = i / 9 * TAU + t * 0.6;
        circle(cx + Math.cos(a) * r * 0.75, top + Math.sin(a) * r * 0.3, r * 0.42, i % 2 ? '#e43b44' : '#f77622');
      }
      circle(cx, top - r * 0.1, r * 0.55, '#feae34');
      circle(cx - r * 0.2, top - r * 0.25, r * 0.25, '#fee761');
      // ground ring
      ellipse(cx, P.y, 20 + e * 120, 3 + e * 4, '#be4a2f');
      const rr = e * 260;
      ring(cx, P.y - 10, rr, 'rgba(255,255,255,0.5)');
    },
  };
};

// ---------------------------------------------------------------- head-first into the ground
DFX.drill = (C) => {
  const { P, o } = C;
  const mode = o.mode || 'dive';
  let stuck = false;
  const y0 = P.y;
  if (mode === 'jackhammer') Sound.play('drill');
  return {
    dur: mode === 'jackhammer' ? 3.8 : 3.6,
    update(dt, t) {
      const f = P.fx;
      if (mode === 'jackhammer') {
        f.expr = 'shock'; f.clipY = y0; f.pose = 'armsup';
        f.dx = rand(-1.5, 1.5);
        f.dy = Math.min(24, Math.max(0, t - 0.3) * 12);
        if (Math.random() < dt * 20) FX.add({ type: 'px', x: P.x + rand(-6, 6), y: y0 - 1, vx: rand(-60, 60), vy: rand(-80, -20), grav: 300, life: 0.5, color: choice(['#8b9bb4', '#5a6988', '#b86f50']) });
        if (f.dy >= 24 && !stuck) { stuck = true; ghostOut(C, P.x, y0, 0.4); comic(o.text || 'DRRRRRT', P.x, y0 - 20, { scale: 1 }); }
        return;
      }
      // dive: flip and plant head-first
      if (t < 0.6) {
        const k = t / 0.6;
        f.rot = Math.PI * ease.inQuad(k); f.dy = -40 * Math.sin(k * Math.PI) ; f.expr = 'scared'; f.pose = 'jump';
        return;
      }
      if (!stuck) {
        stuck = true; f.rot = Math.PI; f.dy = 12; f.clipY = y0; f.expr = 'dead'; f.pose = 'stand';
        Sound.play('thud'); FX.shake(4, 0.3); FX.dust(P.x, y0, 8, o.dust || '#ead4aa');
        comic(o.text || 'THUNK', P.x, y0 - 30, { scale: 2 });
        ghostOut(C, P.x, y0, 1.0);
      }
      f.dx = (t < 2) ? Math.sin(t * 22) * 1 : 0;
    },
  };
};

// ---------------------------------------------------------------- rolled up in a giant snowball
DFX.snowball = (C) => {
  const { P, o} = C;
  const dir = o.dir || 1;
  let bx = dir > 0 ? World.cam.x - 40 : World.cam.x + W + 40, r = 14, rot = 0, got = false;
  Sound.play('rumble');
  return {
    dur: 3.6,
    update(dt, t) {
      const f = P.fx;
      f.expr = 'scared';
      if (t < 0.4) { P.face = -dir; return; }
      bx += dir * 160 * dt; r += 8 * dt; rot += dir * (160 / r) * dt;
      if (!got && Math.abs(bx - P.x) < r) { got = true; f.hidden = true; Sound.play('thud'); comic(o.text || 'FWUMP', P.x, P.y - 40, { scale: 2 }); }
    },
    draw() {
      const cy = P.y - r;
      circle(bx, cy, r, '#ffffff');
      circle(bx - r * 0.3, cy - r * 0.3, r * 0.5, '#ffffff');
      ellipse(bx + r * 0.2, cy + r * 0.5, r * 0.7, r * 0.3, '#c0cbdc');
      for (let i = 0; i < 5; i++) { const a = rot + i * 1.3; px(bx + Math.cos(a) * r * 0.7, cy + Math.sin(a) * r * 0.7, '#8b9bb4'); }
      if (got) {
        const a = rot - Math.PI / 2;
        const c = pCanvas(P, 'armsup', 'scared');
        spr(null, bx + Math.cos(a) * (r + 2), cy + Math.sin(a) * (r + 2), { canvas: c, anchor: 'c', rot: a + Math.PI / 2 });
      }
    },
  };
};

// ---------------------------------------------------------------- deflate (zip around like a balloon)
DFX.deflate = (C) => {
  const { P, o} = C;
  const pts = [];
  for (let i = 0; i < 7; i++) pts.push({ x: World.cam.x + rand(30, W - 30), y: rand(30, P.y - 20) });
  pts.push({ x: P.x + rand(-30, 30), y: P.y });
  let landed = false;
  const x0 = P.x, y0 = P.y;
  Sound.play('deflate');
  comic(o.text || 'PSSSSSHHT', P.x, P.y - 30, { scale: 1, color: PAL.W });
  return {
    dur: 4,
    update(dt, t) {
      const f = P.fx;
      if (t < 0.3) { f.expr = 'pain'; return; }
      const T = 2.0, k = clamp((t - 0.3) / T, 0, 1);
      if (k < 1) {
        const seg = k * (pts.length);
        const i = Math.floor(seg), fr = seg - i;
        const a = i === 0 ? { x: x0, y: y0 - 10 } : pts[i - 1], b = pts[Math.min(i, pts.length - 1)];
        const nx = lerp(a.x, b.x, ease.inOutQuad(fr)), ny = lerp(a.y, b.y, ease.inOutQuad(fr));
        f.rot = Math.atan2(ny - (P.y + f.dy), nx - P.x) + Math.PI / 2;
        P.x = nx; f.dy = ny - y0;
        f.sx = f.sy = 1 - k * 0.45; f.expr = 'scared';
        if (Math.random() < dt * 30) FX.add({ type: 'puff', x: P.x, y: y0 + f.dy, life: 0.3, size: 1, grow: 2, color: '#ffffff' });
      } else if (!landed) {
        landed = true; f.dy = 0; f.rot = 0; f.sy = 0.15; f.sx = 1.5; f.expr = 'dead';
        Sound.play('splat'); FX.dust(P.x, y0, 5);
        ghostOut(C, P.x, y0 - 2, 0.4);
      }
    },
  };
};

// ---------------------------------------------------------------- pile (clone overload)
DFX.pile = (C) => {
  const { P, o} = C;
  const clones = [];
  const N = o.n || 40;
  let collapsed = false;
  return {
    dur: 5,
    multi: o.multi || 101,
    update(dt, t) {
      P.fx.expr = t < 0.5 ? 'happy' : 'scared';
      const want = Math.min(N, Math.floor(Math.pow(t / 2.2, 1.5) * N));
      while (clones.length < want) {
        const i = clones.length;
        const row = Math.floor(i / 5), col = i % 5;
        const cl = { look: randomLook(), x: P.x + (col - 2) * 7 + rand(-2, 2), y: P.y - row * 9 - rand(0, 3), rot: rand(-0.6, 0.6), vx: 0, vy: 0, flip: Math.random() < 0.5 };
        clones.push(cl);
        FX.dust(cl.x, cl.y - 8, 2, '#ffffff');
        Sound.play('poof');
        if (i % 6 === 0) comic('+1', cl.x, cl.y - 20, { scale: 1, color: PAL.l, life: 0.5 });
      }
      if (t > 2.6 && !collapsed) {
        collapsed = true;
        FX.shake(6, 0.6); Sound.play('crash');
        P.fx.sy = 0.15; P.fx.sx = 1.8; P.fx.expr = 'dead';
        for (const cl of clones) { cl.vx = rand(-120, 120); cl.vy = rand(-160, -40); }
        comic('+' + (o.multi || 101) + ' DEATHS', P.x, P.y - 70, { scale: 2, color: PAL.r, life: 2 });
        for (let i = 0; i < 8; i++) ghostOut(C, P.x + rand(-60, 60), P.y - rand(0, 20), 0.4 + i * 0.1);
      }
      if (collapsed) {
        for (const cl of clones) {
          cl.vy += 500 * dt; cl.x += cl.vx * dt; cl.y += cl.vy * dt; cl.rot += cl.vx * 0.02 * dt * 5;
          if (cl.y > P.y) { cl.y = P.y; cl.vy = 0; cl.vx *= 0.8; cl.rot = Math.PI / 2 * sign(cl.rot || 1); }
        }
      }
    },
    draw() {
      for (const cl of clones) {
        const c = playerVariant(cl.look, 'armsup', collapsed ? 'dead' : 'happy', null, cl.flip);
        spr(null, cl.x, cl.y - 9, { canvas: c, anchor: 'c', rot: cl.rot });
      }
    },
  };
};

// ---------------------------------------------------------------- squeeze (a hug that goes too far)
DFX.squeeze = (C) => {
  const { P, o } = C;
  let released = false;
  const col = o.armColor || '#733e39';
  Sound.play(o.sfx || 'gasp');
  comic(o.text || 'HUGGIES!', P.x, P.y - 34, { scale: 1, color: PAL.q });
  return {
    dur: 3.8,
    update(dt, t) {
      const f = P.fx;
      if (t < 0.6) { f.expr = 'happy'; if (Math.random() < dt * 8) FX.icon('p_heart', P.x + rand(-8, 8), P.y - 22, { vy: -25, life: 0.6 }); return; }
      if (t < 1.8) {
        const k = (t - 0.6) / 1.2;
        f.expr = k > 0.4 ? 'pain' : 'shock';
        f.sx = 1 - k * 0.7; f.sy = 1 + k * 0.35;
        if (Math.random() < dt * 6) Sound.play('squish');
        return;
      }
      if (!released) {
        released = true; Sound.play('boing');
        comic('SQUEAK', P.x, P.y - 40, { scale: 1 });
        this.rt = t;
        ghostOut(C, P.x, P.y - 6, 0.6);
      }
      const k = clamp((t - this.rt) / 0.35, 0, 1);
      f.rot = -P.face * (Math.PI / 2) * ease.outBounce(k);
      f.dy = 2 * k; f.expr = 'dead';
    },
    draw(t) {
      if (t > 0.3 && !released) {
        const k = clamp((t - 0.3) / 0.4, 0, 1);
        const w = lerp(16, 5 + P.fx.sx * 4, clamp((t - 0.6) / 1.2, 0, 1));
        const reach = w * k;
        rect(P.x - reach - 2, P.y - 13, 3, 3, col); rect(P.x + reach - 1, P.y - 13, 3, 3, col);
        rect(P.x - reach - 2, P.y - 9, 3, 3, col); rect(P.x + reach - 1, P.y - 9, 3, 3, col);
      }
    },
  };
};

// ---------------------------------------------------------------- portal loop
DFX.portalLoop = (C) => {
  const { P, o} = C;
  const topY = (World.zone.ceiling || 10) + 8;
  const floorY = P.y;
  let y = P.y - 10, vy = 0, loops = 0, burnt = false;
  const px0 = P.x;
  Sound.play('teleport');
  return {
    dur: 5,
    update(dt, t) {
      const f = P.fx;
      f.hidden = true;
      if (t < 0.4) return;
      if (!burnt) {
        vy += 900 * dt; y += vy * dt;
        if (y > floorY + 6) { y = topY; loops++; Sound.play('teleport'); if (loops > 3) Sound.play('fire'); }
        if (loops > 3) FX.fire(P.x, y - 8, 6, 2);
        if (loops >= 6) {
          burnt = true; FX.flash('#fee761', 0.2); Sound.play('explode');
          FX.burst(P.x, y - 10, 30, { type: 'fire', speed: 100, life: 0.6, drag: 3, size: 3 });
          comic(o.text || 'TERMINAL VELOCITY', P.x, 60, { scale: 1 });
          ghostOut(C, P.x, floorY - 4, 0.5, { sprite: 'ghost_soot' });
        }
      }
    },
    draw(t) {
      const pulse = Math.floor(t * 8) % 2;
      ellipse(px0, floorY, 10, 2, pulse ? '#0099db' : '#2ce8f5');
      ellipse(px0, floorY, 7, 1, '#181425');
      ellipse(px0, topY, 10, 2, pulse ? '#f77622' : '#feae34');
      ellipse(px0, topY, 7, 1, '#181425');
      if (!burnt && t > 0.4) {
        const g = Gfx.g;
        g.save(); g.beginPath(); g.rect(World.cam.x - 10, topY, W + 20, floorY - topY); g.clip();
        const c = pCanvas(P, 'armsup', 'scared', loops > 3 ? 'sunburn' : null);
        spr(null, P.x, y - 9, { canvas: c, anchor: 'c', rot: t * 6 });
        g.restore();
      }
    },
  };
};

// ---------------------------------------------------------------- age (grow old instantly)
DFX.age = (C) => {
  const { P, o } = C;
  const old = Object.assign({}, P.look, { hair: 5, id: P.look.id + 'old' });
  let stage = 0;
  Sound.play('clock');
  comic(o.text || 'YEAR 3000', P.x, P.y - 36, { scale: 2, color: PAL.c });
  return {
    dur: 4.4,
    update(dt, t) {
      const f = P.fx;
      if (t > 0.6 && stage === 0) { stage = 1; P.look = old; Sound.play('twang'); }
      if (t > 1.4 && stage === 1) { stage = 2; f.rot = -P.face * 0.25; f.dy = 1; f.expr = 'blink'; Sound.play('cough'); }
      if (t > 2.3 && stage === 2) { stage = 3; f.hidden = true; Sound.play('crunch'); ghostOut(C, P.x, P.y - 6, 0.6); }
      if (t > 3.0 && stage === 3) { stage = 4; FX.debris(P.x, P.y - 10, 30, ['#ffffff', '#c0cbdc', '#8b9bb4'], P.y, { speed: 40 }); Sound.play('poof'); }
    },
    draw() {
      if (stage >= 1 && stage < 3) {
        // beard + cane
        rect(P.x + P.face * 1 - 2, P.y - 12, 5, 3, '#c0cbdc');
        line(P.x + P.face * 7, P.y - 10, P.x + P.face * 8, P.y, '#733e39');
      }
      if (stage === 3) spr('skeleton', P.x, P.y, { anchor: 'bc', flip: P.face < 0 });
      if (stage >= 4) ashPile(P.x, P.y, 14);
    },
  };
};

// ---------------------------------------------------------------- vehicle (stuck to the windscreen)
DFX.vehicle = (C) => {
  const { P, o} = C;
  const name = o.sprite || 'bus';
  const sz = sprSize(name);
  const dir = o.dir || 1;
  let vx = World.cam.x + (dir > 0 ? -sz.w - 10 : W + 10), stuck = false;
  const speed = o.speed || 320;
  Sound.play(o.sfx || 'horn');
  return {
    dur: 3.4,
    update(dt, t) {
      const f = P.fx;
      if (t < 0.4) { P.face = -dir; f.expr = 'scared'; return; }
      vx += dir * speed * dt;
      const front = dir > 0 ? vx + sz.w : vx;
      if (!stuck && (dir > 0 ? front >= P.x - 4 : front <= P.x + 4)) {
        stuck = true; Sound.play('splat'); FX.shake(5, 0.3); FX.hitstop(0.07);
        comic(o.text || 'SPLAT!', P.x, P.y - 30, { scale: 2 });
        f.sx = 0.3; f.sy = 1.1; f.expr = 'dead'; f.pose = 'armsup';
      }
      if (stuck) { P.x = front + dir * 1; f.dy = -(o.stickY || 6); }
    },
    draw() { spr(name, vx, P.y + 1, { anchor: 'bl', flip: dir < 0 }); },
  };
};

// ---------------------------------------------------------------- drag (tentacle / fishing line pulls you in)
DFX.drag = (C) => {
  const { P, o} = C;
  const dir = o.dir || 1;
  const waterX = o.waterX !== undefined ? o.waterX : P.x + dir * 70;
  const kind = o.kind || 'tentacle';
  let grabbed = false, splashed = false;
  const x0 = P.x;
  Sound.play(kind === 'line' ? 'twang' : 'rumble');
  if (o.text) comic(o.text, P.x, P.y - 34, { scale: 2 });
  return {
    dur: 4.2,
    update(dt, t) {
      const f = P.fx;
      if (t < 0.8) { f.expr = kind === 'line' ? 'happy' : 'scared'; return; }
      if (!grabbed) { grabbed = true; Sound.play('yelp'); f.expr = 'scared'; f.pose = 'armsup'; }
      const k = clamp((t - 0.8) / 0.9, 0, 1);
      P.x = lerp(x0, waterX, ease.inQuad(k));
      f.rot = dir * k * 1.4;
      f.dy = -Math.sin(k * Math.PI) * 20 + (k >= 1 ? 30 : 0);
      if (k >= 1 && !splashed) {
        splashed = true; f.hidden = true; Sound.play('splash');
        FX.burst(waterX, P.y, 20, { type: 'px', colors: ['#ffffff', '#2ce8f5', '#0099db'], speed: 120, angle: -Math.PI / 2, spread: 0.8, grav: 300, life: 0.8 });
        comic('SPLOOSH', waterX, P.y - 30, { color: PAL.c });
        ghostOut(C, waterX, P.y, 0.9);
      }
      if (splashed && Math.random() < dt * 4) { FX.icon('p_bubble', waterX + rand(-4, 4), P.y + 2, { vy: -10, life: 0.5 }); Sound.play('bubble'); }
    },
    draw(t) {
      if (splashed) return;
      if (kind === 'tentacle' && t > 0.2) {
        const k = clamp((t - 0.2) / 0.6, 0, 1);
        const tipX = lerp(waterX, P.x, k), tipY = lerp(P.y + 10, P.y - 10, k);
        for (let i = 0; i <= 14; i++) {
          const u = i / 14;
          const x = lerp(waterX, tipX, u) + Math.sin(u * 5 + t * 6) * 4;
          const y = lerp(P.y + 12, tipY, u) - Math.sin(u * Math.PI) * 18;
          circle(x, y, 3.5 - u * 2, '#b55088');
          if (i % 3 === 0) px(x, y + 1, '#f6757a');
        }
      } else if (kind === 'line') {
        const rodX = x0 + dir * 4, rodY = P.y - 12;
        line(rodX, rodY, rodX + dir * 12, rodY - 10, '#733e39');
        line(rodX + dir * 12, rodY - 10, waterX, P.y + 4, '#c0cbdc');
      }
    },
  };
};

// ---------------------------------------------------------------- custom one-offs
DFX.custom = (C) => C.o.make(C);

// Draw any canvas using the player's current transform (for skeleton swaps etc.)
function drawAsPlayer(c, P) {
  const f = P.fx;
  spr(null, P.x + f.dx, P.y + f.dy - c.height / 2 + (f.sy !== 1 ? (1 - f.sy) * c.height / 2 : 0), { canvas: c, anchor: 'c', rot: f.rot, sx: f.sx, sy: f.sy });
}

// ---------------------------------------------------------------- grab (a monster arm drags you into a hole)
DFX.grab = (C) => {
  const { P, o, obj } = C;
  const hx = obj.x + (o.hx === undefined ? obj.w / 2 : o.hx), hy = obj.y + (o.hy || -3);
  const armCol = o.armColor || '#68386c';
  const x0 = P.x;
  let grabbed = false, gone = false;
  let reach = 0;
  return {
    dur: 4.4,
    update(dt, t) {
      const f = P.fx;
      if (t < 0.6) { f.expr = t > 0.3 ? 'shock' : 'normal'; return; }
      if (!grabbed) {
        reach = clamp((t - 0.6) / 0.3, 0, 1);
        if (reach >= 1) { grabbed = true; this.gt = t; Sound.play('yelp'); f.expr = 'scared'; f.pose = 'armsup'; comic(o.text || 'GRAB!', P.x, P.y - 30, { scale: 1 }); }
        return;
      }
      if (!gone) {
        const k = clamp((t - this.gt) / 0.45, 0, 1);
        P.x = lerp(x0, hx, ease.inQuad(k));
        f.rot = sign(hx - x0 || 1) * k * 1.5; f.dy = k * 8;
        reach = 1;
        if (k >= 1) { gone = true; f.hidden = true; this.goneT = t; obj.shakeT = 1.3; Sound.play('chomp'); comic(o.text2 || 'CHOMP CHOMP', hx, obj.y - obj.h - 8, { scale: 1 }); }
        return;
      }
      const k = t - this.goneT;
      if (k < 1.2 && Math.random() < dt * 6) Sound.play(choice(['chomp', 'crunch']));
      if (k > 1.4 && !this.burp) {
        this.burp = true; Sound.play('burp');
        comic('BURP', hx, obj.y - obj.h - 6, { color: PAL.l });
        FX.add({ type: 'spr', sprite: 'shoe_' + P.look.shoes, x: hx, y: hy - 2, vx: sign(x0 - hx || 1) * 70, vy: -150, grav: 420, life: 2.2, bounce: 0.3, floor: P.deathY || obj.y - 1, vr: 10, spin: true, fade: false });
        ghostOut(C, hx, hy, 0.4);
      }
    },
    drawBehind(t) {
      // darkness under the furniture + glowing eyes
      dither(hx - 10, hy - 5, 20, 5, '#181425', 12);
      if (!gone || t - this.goneT < 1.3) {
        const blink = Math.floor(t * 3) % 5 === 0;
        if (!blink) { px(hx - 3, hy - 3, '#fee761'); px(hx + 2, hy - 3, '#fee761'); }
      }
    },
    draw() {
      if (reach > 0 && !gone) {
        const tx = lerp(hx, P.x, reach), ty = lerp(hy - 2, P.y - 10, reach);
        const n = 10;
        for (let i = 0; i <= n; i++) {
          const u = i / n;
          const x = lerp(hx, tx, u), y = lerp(hy - 2, ty, u) - Math.sin(u * Math.PI) * 4;
          rect(x - 1, y - 1, 3, 3, armCol);
        }
        rect(tx - 2, ty - 3, 5, 5, armCol);
        px(tx - 3, ty - 3, '#ffffff'); px(tx + 3, ty - 3, '#ffffff'); px(tx, ty - 4, '#ffffff');
      }
    },
  };
};

// ---------------------------------------------------------------- slip (banana peel / soap)
DFX.slip = (C) => {
  const { P, o } = C;
  let vy = -170, y = 0, landed = false;
  const dir = P.face;
  Sound.play('slip');
  comic(o.text || 'WHOOPS!', P.x, P.y - 32, { scale: 1 });
  return {
    dur: 3.3,
    update(dt, t) {
      const f = P.fx;
      if (landed) return;
      vy += 900 * dt; y += vy * dt;
      P.x += dir * 55 * dt;
      f.rot = -dir * Math.min(Math.PI / 2, t * 6);
      f.dy = Math.min(4, y);
      f.expr = 'shock'; f.pose = 'fall';
      if (y >= 4 && t > 0.15) {
        landed = true; f.dy = 4; f.rot = -dir * Math.PI / 2; f.expr = 'dead'; f.pose = 'stand';
        Sound.play('thud'); Sound.play('bonk'); FX.shake(3, 0.25); FX.dust(P.x - dir * 8, P.y, 5);
        comic('CRACK', P.x - dir * 10, P.y - 20, { scale: 1, color: PAL.W });
        ghostOut(C, P.x, P.y - 4, 0.5);
      }
    },
    draw(t) { if (landed) starsAround(P.x - dir * 8, P.y - 8, t, 3, 6); },
  };
};

// ---------------------------------------------------------------- plummet (climb up high, fall down)
DFX.plummet = (C) => {
  const { P, o } = C;
  const y0 = P.y, x0 = P.x;
  const topY = C.obj && o.topY !== undefined ? C.obj.y + o.topY : P.y - 90;
  const tx = C.obj && o.tx !== undefined ? C.obj.x + o.tx : P.x;
  let phase = 'up', vy = 0;
  return {
    dur: 4.2,
    update(dt, t) {
      const f = P.fx;
      if (phase === 'up') {
        const k = clamp(t / (o.climbT || 1.0), 0, 1);
        P.x = lerp(x0, tx, k); P.y = lerp(y0, topY, ease.inOutQuad(k));
        f.pose = Math.floor(t * 8) % 2 ? 'armsup' : 'jump'; f.expr = 'happy';
        if (k >= 1) { phase = 'hang'; this.ht = t; f.pose = 'stand'; comic(o.text || 'CRACK!', P.x, P.y - 30, { scale: 1, color: PAL.W }); Sound.play('crack'); }
      } else if (phase === 'hang') {
        f.expr = 'shock';
        if (t - this.ht > (o.hang || 0.6)) { phase = 'fall'; Sound.play('whistle', 0.9); }
      } else if (phase === 'fall') {
        vy += 900 * dt; P.y += vy * dt; f.pose = 'armsup'; f.expr = 'scared';
        if (o.headfirst) f.rot = Math.min(Math.PI, f.rot + dt * 9);
        if (P.y >= y0) {
          P.y = y0; phase = 'down'; this.dt0 = t;
          if (o.headfirst) { f.rot = Math.PI; f.dy = 12; f.clipY = y0; f.expr = 'dead'; f.pose = 'stand'; Sound.play('thud'); }
          else { f.sy = 0.2; f.sx = 1.8; f.expr = 'dead'; f.pose = 'stand'; Sound.play('splat'); }
          FX.shake(5, 0.4); FX.dust(P.x, P.y, 10, o.dust || '#c0cbdc');
          comic(o.text2 || 'SPLAT!', P.x, P.y - 24, { scale: 2 });
          ghostOut(C, P.x, P.y - 4, 0.5);
        }
      } else if (phase === 'down' && o.headfirst) {
        f.dx = (t - this.dt0 < 1.4) ? Math.sin(t * 22) * 1 : 0;
      }
    },
  };
};

// ---------------------------------------------------------------- meteor (up into orbit, back down on fire)
DFX.meteor = (C) => {
  const { P, o } = C;
  const y0 = P.y;
  let phase = 'up', mx = P.x, my = -40;
  Sound.play('boing'); Sound.play('rise', 1);
  comic(o.text || 'TO SPACE!', P.x, P.y - 30, { scale: 2 });
  return {
    dur: 5,
    update(dt, t) {
      const f = P.fx;
      if (phase === 'up') {
        P.y -= 700 * dt; f.pose = 'armsup'; f.expr = 'scared';
        if (P.y < World.cam.y - 40) { phase = 'wait'; this.wt = t; f.hidden = true; }
      } else if (phase === 'wait') {
        if (t - this.wt > 1.0) { phase = 'down'; mx = P.x - 60; my = World.cam.y - 30; Sound.play('whistle', 0.7); Sound.play('fire'); }
      } else if (phase === 'down') {
        mx += 90 * dt; my += 300 * dt;
        FX.fire(mx, my, 6, 4); FX.smoke(mx - 4, my - 4, 1, '#5a6988');
        if (my >= y0 - 6) {
          phase = 'crater'; P.x = mx; P.y = y0;
          f.hidden = false; f.variant = 'char'; f.expr = 'whiteeyes'; f.rot = Math.PI / 2 * 0.9; f.dy = 5;
          FX.flash('#fee761', 0.2); FX.shake(8, 0.6); Sound.play('explode');
          FX.debris(mx, y0 - 4, 30, ['#733e39', '#b86f50', '#3e8948', '#63c74d'], y0, { speed: 180 });
          comic('KRAKOOM!', mx, y0 - 40, { scale: 2 });
          ghostOut(C, mx, y0 - 6, 0.6, { sprite: 'ghost_soot' });
        }
      }
      if (phase === 'crater' && Math.random() < dt * 6) FX.smoke(P.x + rand(-6, 6), y0 - 4, 1, '#5a6988');
    },
    drawBehind() {
      if (phase === 'crater') { ellipse(P.x, y0 + 1, 16, 4, '#3e2731'); ellipse(P.x, y0, 12, 2, '#181425'); }
    },
    draw(t) {
      if (phase === 'down') {
        const c = pCanvas(P, 'armsup', 'scared', 'sunburn');
        spr(null, mx, my - 9, { canvas: c, anchor: 'c', rot: t * 10 });
      }
    },
  };
};

// ---------------------------------------------------------------- belly slide (with penguins, off a cliff)
DFX.bellyslide = (C) => {
  const { P, o } = C;
  const dir = o.dir || 1;
  let v = 30, gone = false;
  const pals = [];
  for (let i = 0; i < 4; i++) pals.push({ off: -14 - i * 12, bob: rand(TAU) });
  Sound.play('whoosh');
  return {
    dur: 4.2,
    update(dt, t) {
      const f = P.fx;
      f.rot = dir * Math.PI / 2; f.dy = 3; f.expr = t < 1 ? 'happy' : 'scared'; f.flip = dir < 0;
      if (gone) return;
      v = Math.min(420, v + dt * 260);
      P.x += dir * v * dt;
      if (Math.random() < dt * 30) FX.add({ type: 'px', x: P.x - dir * 8, y: P.y - 1, vx: -dir * rand(20, 60), vy: rand(-40, -10), grav: 200, life: 0.4, color: '#ffffff' });
      if (P.x - World.cam.x > W + 20 || P.x - World.cam.x < -20) {
        gone = true; f.hidden = true; this.gt = t;
        Sound.play('splash');
        setTimeout(() => Sound.play('chomp'), 600);
      }
    },
    draw(t) {
      for (const p of pals) {
        const x = P.x + dir * p.off;
        if (!gone || this.gt && t - this.gt < 0.3) spr('penguin', x, P.y - 3, { anchor: 'bc', rot: dir * Math.PI / 2, flip: dir < 0 });
      }
      if (gone && t - this.gt > 0.6 && t - this.gt < 2.4) {
        const ex = dir > 0 ? World.cam.x + W - 40 : World.cam.x + 40;
        text('SPLASH...', ex, 100, { font: 'big', align: 'center', color: PAL.c, outline: PAL.K });
        if (t - this.gt > 1.1) text('...CHOMP.', ex, 114, { font: 'big', align: 'center', color: PAL.r, outline: PAL.K });
      }
    },
  };
};

// ---------------------------------------------------------------- shrink (then stepped on)
DFX.shrink = (C) => {
  const { P, o } = C;
  const src = objCenter(C);
  let small = false, landed = false, bootY = -60;
  const sz = sprSize('boot');
  Sound.play('laser');
  return {
    dur: 4.2,
    update(dt, t) {
      const f = P.fx;
      if (t < 0.5) { f.expr = 'shock'; return; }
      if (t < 1.2) { const k = (t - 0.5) / 0.7; f.sx = f.sy = 1 - 0.8 * ease.inOutQuad(k); f.expr = 'scared'; if (!this.s) { this.s = true; Sound.play('pop'); comic('tiny!', P.x, P.y - 20, { scale: 1, color: PAL.c }); } return; }
      if (!small) { small = true; f.sx = f.sy = 0.2; Sound.play('whistle', 0.9); }
      if (!landed) {
        bootY += 360 * dt;
        if (bootY >= P.y - sz.h) {
          bootY = P.y - sz.h; landed = true;
          f.sx = 0.6; f.sy = 0.05; f.expr = 'dead';
          Sound.play('thud'); FX.shake(5, 0.35); FX.dust(P.x - 16, P.y, 5); FX.dust(P.x + 16, P.y, 5);
          comic(o.text || 'SQUISH', P.x, P.y - 44, { scale: 2 });
          ghostOut(C, P.x, P.y - 2, 0.5);
        }
      }
    },
    draw(t) {
      if (t < 0.5) { const col = Math.floor(t * 20) % 2 ? '#2ce8f5' : '#ffffff'; line(src.x + 12, src.y - 8, P.x, P.y - 10, col); }
      if (small) {
        const bx = P.x - 6;
        if (bootY > -50) spr('boot', bx, bootY + sz.h, { anchor: 'bc' });
        if (!landed) shadowAt(P.x, P.y, Math.min(20, (bootY + 60) / 8), 6);
      }
    },
  };
};

<script>
// ONE MILLION DEATHS - interactive objects
// Each object type: name, sprite | draw(o, t), actions [{label, death}], touch (death id),
// touchBox, solidTop, blockX/blocking, init/update/reset hooks.
'use strict';

const OBJ = {};
function defObj(name, def) { OBJ[name] = def; return def; }
const act = (label, death) => ({ label, death });

// small helpers
function objShake(o) { return o.shakeT > 0 ? Math.round(rand(-1, 1)) : 0; }
function tickShake(o, dt) { if (o.shakeT > 0) o.shakeT -= dt; }
function sprObj(o, name, dx = 0, dy = 0, opts = {}) {
  const s = sprSize(name);
  spr(name, o.x + dx + objShake(o), o.y - s.h + dy, Object.assign({ flip: o.flip }, opts));
}

// ================================================================ generic / shared
// The Grim Reaper runs a toll booth at the end of each zone. Pay in unique deaths.
defObj('toll', {
  name: 'DEATH', w: 34, h: 44, z: 1,
  blocking(o, W) { return !W.tollPaid(W.nextZone()); },
  init(o, zone) { o.blockX = 30; o.state.bump = 0; },
  update(o, dt, W) {
    const need = TOLLS[W.nextZone()] || 0;
    const paid = W.tollPaid(W.nextZone());
    o.state.arm = approach(o.state.arm || 0, paid ? 1 : 0, dt * 2);
    const P = W.P;
    if (!paid && W.mode === 'play' && P.x > o.x + o.blockX - 8 && P.x < o.x + o.blockX + 2) {
      o.state.bump -= dt;
      if (o.state.bump <= 0) {
        o.state.bump = 3;
        W.say('DEATH TOLL: ' + need + ' UNIQUE DEATHS. YOU HAVE ' + Game.foundCount() + '.', 2.6, { x: o.x + 12, y: o.y - 34 });
        Sound.play('denied');
      }
    }
  },
  draw(o, t) {
    const need = TOLLS[World.nextZone()] || 0;
    const paid = World.tollPaid(World.nextZone());
    const bob = Math.floor(t * 2) % 2;
    if (o.def.door) {
      spr(paid ? 'frontdoor_open' : 'frontdoor', o.x + 22, o.y - 42);
      spr(bob ? 'reaper1' : 'reaper2', o.x + 2, o.y - 22);
      spr('scythe', o.x - 6, o.y - 32);
    } else {
      // booth
      rect(o.x + 2, o.y - 40, 26, 40, '#3e2731');
      rect(o.x + 4, o.y - 38, 22, 36, '#733e39');
      rect(o.x + 6, o.y - 34, 18, 14, '#181425');
      spr(bob ? 'reaper1' : 'reaper2', o.x + 8, o.y - 38, {});
      rect(o.x + 2, o.y - 20, 26, 3, '#b86f50');
      rect(o.x, o.y - 44, 30, 5, '#a22633'); rect(o.x, o.y - 44, 30, 1, '#e43b44');
      // barrier arm
      const a = -o.state.arm * 1.3;
      const g = Gfx.g;
      g.save(); g.translate(o.x + 28, o.y - 14); g.rotate(a);
      for (let i = 0; i < 26; i += 4) rect(i, -1, 4, 3, (i / 4) % 2 ? '#ffffff' : '#e43b44');
      g.restore();
      rect(o.x + 26, o.y - 16, 4, 16, '#5a6988');
    }
    // sign
    const sx = o.x + (o.def.door ? 2 : 4), sy = o.y - (o.def.door ? 64 : 62);
    rect(sx, sy, 34, 15, '#ead4aa'); rect(sx, sy, 34, 1, '#ffffff'); rect(sx, sy + 14, 34, 1, '#b86f50');
    rect(sx + 16, sy + 15, 2, o.def.door ? 5 : 3, '#733e39');
    text('TOLL', sx + 17, sy + 2, { font: 'small', align: 'center', color: '#a22633' });
    text(paid ? 'PAID' : need + '☠', sx + 17, sy + 8, { font: 'small', align: 'center', color: paid ? '#3e8948' : '#181425' });
  },
});

  name: 'TRAMPOLINE', sprite: 'trampoline', solidTop: { x: 2, y: 2, w: 34 },
  actions: [act('Do a triple backflip', 'backflip')],
  update(o, dt, W) {
    if (W.P && W.P.onGround) o.state.count = 0;
    if (o.state.squish > 0) o.state.squish -= dt;
  },
  onLand(o, P, W) {
    if (W.mode !== 'play') return false;
    o.state.count = (o.state.count || 0) + 1;
    o.state.squish = 0.15;
    if (o.state.count >= 6) { o.state.count = 0; W.startDeath('trampoline', o); return true; }
    P.vy = -(250 + o.state.count * 62);
    P.onGround = false; P.bounced = true;
    Sound.play('boing');
    if (o.state.count >= 3) FX.pop(['HIGHER!', 'WAY TOO HIGH!', 'UH OH!'][o.state.count - 3], P.x, P.y - 30, { scale: 1 });
    return true;
  },
  draw(o) {
    const sq = o.state.squish > 0 ? 2 : 0;
    spr('trampoline', o.x, o.y - 14 + sq);
  },
});

// The finale's star: shared by the Afterlife zone and the ending scene.
function drawMillionMachine(x, y, t, count, power) {
  const top = y - 86;
  // chimney puffing little ghosts
  rect(x + 70, top - 4, 12, 26, '#733e39'); rect(x + 68, top - 6, 16, 4, '#3e2731');
  // body
  rect(x + 8, top + 18, 80, 68, '#b86f50'); rect(x + 8, top + 18, 80, 3, '#e4a672');
  for (let yy = top + 26; yy < y - 4; yy += 10) for (let xx = x + 12; xx < x + 86; xx += 12) px(xx, yy, '#733e39');
  rect(x + 8, y - 6, 80, 6, '#3e2731');
  // hopper on the left
  rect(x, top + 24, 12, 22, '#8b9bb4'); rect(x - 2, top + 22, 16, 3, '#c0cbdc');
  // counter display
  rect(x + 16, top + 26, 64, 16, '#181425');
  const digits = String(Math.min(9999999, Math.floor(count))).padStart(7, '0');
  for (let i = 0; i < 7; i++) {
    rect(x + 18 + i * 9, top + 28, 8, 12, '#3a0e16');
    text(digits[i], x + 22 + i * 9, top + 30, { align: 'center', color: '#ff0044' });
  }
  text('DEATHS', x + 48, top + 44, { font: 'small', align: 'center', color: '#3e2731' });
  // gauges
  for (let i = 0; i < 3; i++) {
    const gx = x + 26 + i * 22, gy = top + 60;
    circle(gx, gy, 6, '#ead4aa'); ring(gx, gy, 6, '#3e2731');
    const a = -Math.PI * 0.75 + (Math.sin(t * (2 + i) + i) * 0.5 + 0.5 + power) * Math.PI * 0.8;
    line(gx, gy, gx + Math.cos(a) * 5, gy + Math.sin(a) * 5, '#a22633');
  }
  // lights
  for (let i = 0; i < 6; i++) circle(x + 18 + i * 12, top + 76, 2, Math.floor(t * (3 + power * 20) + i) % 3 === 0 ? '#fee761' : '#be4a2f');
  // big lever
  const la = -0.5 + power * 1.2;
  rect(x + 88, top + 40, 6, 10, '#3a4466');
  line(x + 91, top + 45, x + 91 + Math.sin(la) * 24, top + 45 - Math.cos(la) * 24, '#8b9bb4');
  circle(x + 91 + Math.sin(la) * 24, top + 45 - Math.cos(la) * 24, 3, '#e43b44');
  // sign
  rect(x + 14, top + 2, 56, 14, '#fee761'); rect(x + 14, top + 2, 56, 1, '#ffffff');
  text('MILLION', x + 42, top + 3, { font: 'small', align: 'center', color: '#a22633' });
  text('MACHINE', x + 42, top + 9, { font: 'small', align: 'center', color: '#a22633' });
}

function paintSkyGradient(g, cols) { gradientV(0, 0, W, H, cols, g, 4); }

function drawClouds(t, cx, o = {}) {
  const n = o.n || 6;
  for (let i = 0; i < n; i++) {
    const par = 0.08 + (i % 3) * 0.05;
    const span = W + 160;
    const x = ((i * 137 + t * (o.speed || 3) * (1 + i % 2)) - cx * par) % span;
    const xx = x < 0 ? x + span : x;
    const y = (o.y || 16) + (i * 23) % (o.h || 50);
    const w = 18 + (i * 7) % 16;
    const c1 = o.c1 || '#ffffff', c2 = o.c2 || '#c0cbdc';
    ellipse(xx - 80, y + 2, w, 3, c2);
    ellipse(xx - 80, y, w - 3, 3, c1);
    ellipse(xx - 84, y - 3, w * 0.5, 3, c1);
    ellipse(xx - 72, y - 2, w * 0.35, 3, c1);
  }
}

function paintSkyline(w, baseY, col, winCol, seed, hMin = 30, hMax = 80) {
  const r = mulberry32(seed);
  let x = 0;
  while (x < w) {
    const bw = 16 + Math.floor(r() * 28), bh = hMin + Math.floor(r() * (hMax - hMin));
    rect(x, baseY - bh, bw, bh + 40, col);
    if (r() < 0.3) rect(x + Math.floor(bw / 2) - 1, baseY - bh - 8, 2, 8, col);
    for (let wy = baseY - bh + 4; wy < baseY - 4; wy += 6) for (let wx = x + 3; wx < x + bw - 3; wx += 5) if (r() < 0.35) rect(wx, wy, 2, 3, winCol);
    x += bw + Math.floor(r() * 4);
  }
}

function paintFacade(x, w, top, o) {
  const bot = 150;
  rect(x, top, w, bot - top, o.body);
  if (o.brick) for (let y = top + 2; y < bot; y += 4) for (let bx = x + ((y / 4) % 2) * 4; bx < x + w - 2; bx += 8) rect(bx, y, 6, 1, o.brick);
  rect(x, top, w, 3, o.trim || '#3e2731'); rect(x, top + 3, w, 1, 'rgba(0,0,0,0.25)');
  if (o.windows) {
    const [cols, rows, ww, wh] = o.windows;
    const gapX = Math.floor((w - cols * ww) / (cols + 1));
    for (let r2 = 0; r2 < rows; r2++) for (let c = 0; c < cols; c++) {
      const wx = x + gapX + c * (ww + gapX), wy = top + 10 + r2 * (wh + 9);
      if (wy + wh > (o.shopTop || bot - 40)) continue;
      rect(wx - 1, wy - 1, ww + 2, wh + 2, o.frame || '#ead4aa');
      rect(wx, wy, ww, wh, o.glass || '#0099db');
      rect(wx, wy, ww, 2, o.glass2 || '#2ce8f5');
      rect(wx - 2, wy + wh + 1, ww + 4, 1, o.frame || '#ead4aa');
    }
  }
}

      for (let x = 820; x < 900; x += 8) { rect(x, 151, 3, 1, '#5a6988'); rect(x + 4, 152, 3, 1, '#5a6988'); }
    });
    return [{ canvas: far, p: 0.3 }, { canvas: c, p: 1 }];
  },
};

// ================================================================ AFTERLIFE
ZONES.heaven = {
  id: 'heaven', name: 'THE AFTERLIFE', short: 'HEAVEN', subtitle: 'YOU CAN STILL DIE HERE. SOMEHOW.',
  width: 1000, ground: 150, music: 'heaven', spawn: 30, ghostly: true, edgeDeath: 'edge',
  objects: [
    { type: 'gates', x: 20 },
    { type: 'harp', x: 110 },
    { type: 'cherub', x: 160 },
    { type: 'fluffycloud', x: 200, y: 142 },
    { type: 'halostand', x: 270 },
    { type: 'stairway', x: 320 },
    { type: 'deathdesk', x: 450 },
    { type: 'millionmachine', x: 600 },
  ],
  drawSky(t, cx) {
    Gfx.g.drawImage(this._sky, 0, 0);
    // god rays
    for (let i = 0; i < 5; i++) {
      const x = 40 + i * 70 - cx * 0.05;
      for (let y = 0; y < 150; y += 2) dither(x + y * 0.35, y, 14, 2, '#ffffff', 2);
    }
    drawClouds(t, cx, { n: 7, y: 20, h: 90, c2: '#fee761', speed: 4 });
  },
  build(z) {
    z._sky = makeCanvas(W, H);
    withCtx(z._sky.getContext('2d'), (g) => paintSkyGradient(g, ['#2ce8f5', '#c0cbdc', '#fee761', '#f6757a']));
    const c = makeCanvas(z.width, H);
    withCtx(c.getContext('2d'), () => {
      // cloud floor
      rect(0, 150, z.width, 30, '#ffffff');
      for (let x = 0; x < z.width; x += 18) { circle(x + 9, 150, 10, '#ffffff'); circle(x + 4, 156, 7, '#c0cbdc'); }
      rect(0, 148, z.width, 2, '#ffffff');
      for (let x = 0; x < z.width; x += 5) px(x, 160 + (x * 7) % 18, '#c0cbdc');
      // background cloud banks
      for (let x = 0; x < z.width; x += 40) { circle(x + 20, 142, 16, '#ffffff'); circle(x + 4, 146, 10, '#ffffff'); }
      // a sign at the end of everything
      rect(960, 118, 2, 32, '#8b9bb4'); rect(930, 106, 62, 14, '#ffffff'); rect(930, 106, 62, 2, '#c0cbdc');
      text('EDGE OF', 961, 107, { font: 'small', align: 'center', color: '#a22633' });
      text('EVERYTHING', 961, 113, { font: 'small', align: 'center', color: '#a22633' });
      rect(996, 120, 4, 60, '#fee761');
    });
    return [{ canvas: c, p: 1 }];
  },
  drawFront(t, cx) {
    // little cherub ghosts drifting about
    for (let i = 0; i < 3; i++) {
      const x = ((i * 300 + t * 12) % 1100) - 50, y = 40 + i * 22 + Math.sin(t * 2 + i) * 6;
      spr('ghost', x, y, { alpha: 0.6 }); spr('halo', x + 5, y - 3, { alpha: 0.6 });
    }
  },
};

</script>
<script>
// ONE MILLION DEATHS - the playable world: player, camera, objects, deaths
'use strict';

const GRAVITY = 620;
const JUMP_V = 215;
const RUN_SPEED = 82;

const World = {
  zone: null,
  zoneId: null,
  objs: [],
  P: null,
  cam: { x: 0, y: 0 },
  camFocus: null,
  t: 0,
  mode: 'play', // play | menu | dying | card | transition
  menu: null,
  fx: null,
  fxT: 0,
  death: null,
  deathId: null,
  deathObj: null,
  bubble: null,
  ghosts: [],
  decals: [],
  near: null,
  idleT: 0,
  jumpTimes: [],
  dirTimes: [],
  lastDir: 0,
  trans: null,
  toast: null,
  sayT: 0,
  paused: false,

  // ------------------------------------------------------------ zones
  enterZone(id, from) {
    const z = ZONES[id];
    if (!z) return;
    this.zoneId = id;
    this.zone = z;
    if (!z._built) { z.layers = z.build ? z.build(z) : []; z._built = true; }
    this.objs = z.objects.map((def, i) => makeObj(def, i, z));
    this.ghosts = [];
    this.decals = [];
    FX.clear();
    let x = z.spawn || 24;
    if (from === 'left') x = 14;
    else if (from === 'right') x = z.width - 14;
    Game.save.zone = id;
    Game.save.unlocked[id] = true;
    Game.persist();
    if (!this.P || !this.P.alive) this.newPlayer(x);
    else { this.P.x = x; this.P.y = z.ground; this.P.vx = 0; this.P.vy = 0; }
    this.snapCamera();
    Music.play(z.music || 'play');
    this.mode = 'play';
    this.showToast(z.name, z.subtitle || '', 2.4);
  },

  zoneIndex(id = this.zoneId) { return ZONE_ORDER.indexOf(id); },
  nextZone() { return ZONE_ORDER[this.zoneIndex() + 1] || null; },
  prevZone() { return ZONE_ORDER[this.zoneIndex() - 1] || null; },
  tollPaid(zoneId) { return Game.foundCount() >= (TOLLS[zoneId] || 0); },

  // ------------------------------------------------------------ player
  newPlayer(x) {
    const z = this.zone;
    this.P = {
      x, y: z.ground, vx: 0, vy: 0, w: 8, h: 16, face: 1, onGround: true, alive: true,
      look: randomLook(), born: this.t, walkT: 0, blinkT: rand(2, 4), coyote: 0, jumpBuf: 0,
      fx: freshPlayerFx(), hidden: false, spawnT: 0.6,
      name: Game.currentName(),
    };
    this.idleT = 0;
    this.jumpTimes = [];
    this.dirTimes = [];
  },

  snapCamera() {
    this.cam.x = clamp(this.P.x - W / 2, 0, Math.max(0, this.zone.width - W));
    this.cam.y = 0;
  },

  // ------------------------------------------------------------ update
  update(dt) {
    this.t += dt;
    if (FX.hitstopT > 0) { FX.hitstopT -= dt; FX.update(dt * 0.05); return; }
    if (this.toast) { this.toast.t += dt; if (this.toast.t > this.toast.dur) this.toast = null; }
    if (this.bubble) { this.bubble.t += dt; if (this.bubble.t > this.bubble.dur) this.bubble = null; }

    switch (this.mode) {
      case 'play': this.updatePlay(dt); break;
      case 'menu': this.updateMenu(dt); break;
      case 'dying': this.updateDying(dt); break;
      case 'card': UI.updateCard(dt); break;
      case 'transition': this.updateTransition(dt); break;
    }
    for (const o of this.objs) {
      if (o.shakeT > 0) o.shakeT -= dt;
      if (o.type.update) o.type.update(o, dt, this);
    }
    this.updateGhosts(dt);
    FX.update(dt);
    this.updateCamera(dt);
  },

  updatePlay(dt) {
    const P = this.P;
    if (Input.pressed.pause) { Game.openPause(); return; }
    if (Input.pressed.dex) { Game.openDex('play'); return; }
    this.updatePlayer(dt);
    this.checkMetaDeaths(dt);
    if (this.mode !== 'play') return;
    // find nearest interactable
    this.near = null;
    let best = 1e9;
    for (const o of this.objs) {
      if (!o.actions || !o.actions.length || o.hidden) continue;
      const pad = o.type.reach === undefined ? 8 : o.type.reach;
      if (P.x < o.x - pad || P.x > o.x + o.w + pad) continue;
      if (P.y < o.y - o.h - 30 || P.y > o.y + 26) continue;
      const d = Math.abs(P.x - (o.x + o.w / 2));
      if (d < best) { best = d; this.near = o; }
    }
    if (this.near && (Input.pressed.action || (Input.mouse.clicked && this.clickedObj(this.near)))) {
      this.openMenu(this.near);
      return;
    }
    // touch hazards
    const px0 = P.x - P.w / 2, px1 = P.x + P.w / 2, py0 = P.y - P.h, py1 = P.y;
    for (const o of this.objs) {
      if (o.hidden) continue;
      const tb = o.touchBox;
      if (!tb) continue;
      if (o.type.touchIf && !o.type.touchIf(o, P, this)) continue;
      const bx = o.x + tb.x, by = o.y - o.h + tb.y;
      if (px1 > bx && px0 < bx + tb.w && py1 > by && py0 < by + tb.h) {
        const id = typeof o.touch === 'function' ? o.touch(o, this) : o.touch;
        if (id) { this.startDeath(id, o); return; }
      }
    }
  },

  clickedObj(o) {
    const m = Input.mouse;
    const wx = m.x + this.cam.x, wy = m.y + this.cam.y;
    return wx >= o.x - 4 && wx <= o.x + o.w + 4 && wy >= o.y - o.h - 4 && wy <= o.y + 4;
  },

  updatePlayer(dt) {
    const P = this.P, z = this.zone;
    const grav = GRAVITY * (z.gravity || 1);
    let dir = (Input.held.right ? 1 : 0) - (Input.held.left ? 1 : 0);
    if (P.spawnT > 0) { P.spawnT -= dt; }
    const accel = P.onGround ? 1100 : 700;
    if (dir) {
      P.vx = approach(P.vx, dir * RUN_SPEED, accel * dt);
      if (dir !== P.face) this.noteDirChange();
      P.face = dir;
    } else P.vx = approach(P.vx, 0, (P.onGround ? 1200 : 400) * dt);

    if (Input.pressed.jump) P.jumpBuf = 0.14;
    if (P.onGround) P.coyote = 0.1; else P.coyote -= dt;
    if (P.jumpBuf > 0 && P.coyote > 0) {
      P.vy = -JUMP_V * (z.jumpMul || 1);
      P.onGround = false; P.coyote = 0; P.jumpBuf = 0;
      Sound.play('jump');
      this.noteJump();
    }
    P.jumpBuf -= dt;
    if (!Input.held.jump && P.vy < -70 && !P.bounced) P.vy += grav * 1.2 * dt;
    P.vy = Math.min(P.vy + grav * dt, 420);

    // horizontal move + blockers
    let nx = P.x + P.vx * dt;
    for (const o of this.objs) {
      if (o.blockX === undefined || o.hidden) continue;
      if (o.type.blocking && !o.type.blocking(o, this)) continue;
      const bx = o.x + o.blockX;
      if (P.x <= bx && nx > bx - P.w / 2) nx = bx - P.w / 2;
    }
    const canLeft = !!this.prevZone() && z.exitLeft !== false;
    const canRight = !!this.nextZone() && z.exitRight !== false;
    if (nx < 4 && !canLeft) nx = 4;
    if (nx > z.width - 4 && !canRight && !z.edgeDeath) nx = z.width - 4;
    P.x = nx;

    // vertical move + ground/platforms
    const oldY = P.y;
    P.y += P.vy * dt;
    let landed = false;
    if (P.vy >= 0) {
      for (const o of this.objs) {
        if (!o.solidTop || o.hidden) continue;
        const top = o.y - o.h + (o.solidTop.y || 0);
        const x0 = o.x + (o.solidTop.x || 0), x1 = x0 + (o.solidTop.w || o.w);
        if (P.x + 3 > x0 && P.x - 3 < x1 && oldY <= top + 1 && P.y >= top) {
          P.y = top; landed = true;
          if (o.type.onLand && o.type.onLand(o, P, this)) return;
          break;
        }
      }
      if (!landed && P.y >= z.ground) { P.y = z.ground; landed = true; }
    }
    if (landed) {
      if (!P.onGround && P.vy > 150) { Sound.play('land'); FX.dust(P.x, P.y, 3); }
      P.vy = 0; P.bounced = false;
    }
    P.onGround = landed;

    // walking animation & idle tracking
    if (Math.abs(P.vx) > 5 && P.onGround) {
      const before = Math.floor(P.walkT * 8);
      P.walkT += dt;
      if (Math.floor(P.walkT * 8) !== before && Math.floor(P.walkT * 8) % 2 === 0) Sound.play('step');
    } else P.walkT = 0;
    P.blinkT -= dt;
    if (P.blinkT < -0.12) P.blinkT = rand(2, 5);
    if (dir || Input.pressed.jump || Input.pressed.action) this.idleT = 0; else this.idleT += dt;

    // zone exits
    if (z.edgeDeath && P.x >= z.width - 3) { this.startDeath(z.edgeDeath, null); return; }
    if (P.x >= z.width - 2 && canRight) this.beginTransition(this.nextZone(), 'left');
    else if (P.x <= 2 && canLeft) this.beginTransition(this.prevZone(), 'right');
  },

  noteJump() {
    const now = this.t;
    this.jumpTimes.push(now);
    this.jumpTimes = this.jumpTimes.filter((t) => now - t < 12);
  },
  noteDirChange() {
    const now = this.t;
    this.dirTimes.push(now);
    this.dirTimes = this.dirTimes.filter((t) => now - t < 3);
  },

  checkMetaDeaths() {
    const P = this.P;
    if (this.idleT > 40) { this.startDeath('boredom', null); return; }
    if (this.jumpTimes.length >= 30) { this.jumpTimes = []; this.startDeath('cardio', null); return; }
    if (this.dirTimes.length >= 16 && P.onGround) { this.dirTimes = []; this.startDeath('dizzy', null); return; }
    const K = ['ArrowUp', 'ArrowUp', 'ArrowDown', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'ArrowLeft', 'ArrowRight', 'KeyB', 'KeyA'];
    if (Input.typedSeq(K)) { Input.clearTyped(); this.startDeath('konami', null); return; }
    if (Input.pressedCodes.has('KeyF')) { this.startDeath('press_f', null); return; }
  },

  // ------------------------------------------------------------ interaction menu
  openMenu(o) {
    const items = o.actions.map((a) => ({ label: a.label, death: a.death, run: a.run, done: !!(a.death && Game.save.found[a.death]) }));
    items.push({ label: 'Nevermind', death: null });
    this.menu = { obj: o, items, sel: 0, t: 0 };
    this.mode = 'menu';
    this.P.vx = 0;
    Sound.play('blip');
  },

  updateMenu(dt) {
    const m = this.menu;
    m.t += dt;
    const n = m.items.length;
    if (Input.pressed.up || Input.pressed.left) { m.sel = (m.sel + n - 1) % n; Sound.play('blip'); }
    if (Input.pressed.down || Input.pressed.right) { m.sel = (m.sel + 1) % n; Sound.play('blip'); }
    if (Input.pressed.back || Input.pressed.pause) { this.closeMenu(); Sound.play('back'); return; }
    const box = UI.menuRect(m);
    if (Input.mouse.moved || Input.mouse.clicked) {
      for (let i = 0; i < n; i++) {
        const r = UI.menuItemRect(box, i);
        if (Input.hoverIn(r.x, r.y, r.w, r.h)) {
          if (m.sel !== i && Input.mouse.moved) Sound.play('blip');
          m.sel = i;
          if (Input.mouse.clicked) { this.chooseMenu(i); return; }
        }
      }
      if (Input.mouse.clicked && !Input.hoverIn(box.x, box.y, box.w, box.h)) { this.closeMenu(); return; }
    }
    if (m.t > 0.1 && (Input.pressed.confirm || Input.pressed.action)) this.chooseMenu(m.sel);
  },

  chooseMenu(i) {
    const m = this.menu;
    const it = m.items[i];
    if (it.run) { this.menu = null; this.mode = 'play'; it.run(m.obj, this); return; }
    if (!it.death) { this.closeMenu(); Sound.play('back'); return; }
    Sound.play('select');
    this.menu = null;
    this.startDeath(it.death, m.obj);
  },

  closeMenu() { this.menu = null; this.mode = 'play'; },

  // ------------------------------------------------------------ dying
  startDeath(id, obj) {
    if (this.mode === 'dying' || this.mode === 'card') return;
    const d = DEATHS[id];
    if (!d) { console.warn('unknown death', id); this.mode = 'play'; return; }
    const P = this.P;
    this.mode = 'dying';
    this.death = d;
    this.deathId = id;
    this.deathObj = obj;
    this.fx = null;
    this.fxT = 0;
    this.camFocus = null;
    P.vx = 0;
    P.fx = freshPlayerFx();
    P.deathX = P.x;
    this.lifeLen = this.t - P.born;
    // walk/hop to the object's "stage mark" before the gag starts
    const mark = d.at && obj ? { x: obj.x + d.at[0], y: d.at[1] === undefined ? P.y : obj.y + d.at[1] } : null;
    this.pre = { t: 0, mark, fromX: P.x, fromY: P.y, dur: mark ? 0.35 : 0 };
    if (mark && d.face) P.face = d.face;
    else if (obj && !d.keepFace) P.face = (obj.x + obj.w / 2) >= P.x ? 1 : -1;
    this.sayT = d.say ? 1.0 : 0;
    if (d.say) this.say(d.say, 1.1);
  },

  say(str, dur = 1.2, who = null) {
    this.bubble = { str, t: 0, dur, who };
    Sound.play('talk');
  },

  updateDying(dt) {
    const P = this.P;
    const pre = this.pre;
    if (pre && pre.t < pre.dur) {
      pre.t += dt;
      const k = Math.min(1, pre.t / pre.dur);
      if (pre.mark) {
        P.x = lerp(pre.fromX, pre.mark.x, k);
        P.y = lerp(pre.fromY, pre.mark.y, k) - Math.sin(k * Math.PI) * 10;
        P.fx.pose = 'jump';
      }
      if (k >= 1) { P.fx.pose = null; P.y = pre.mark ? pre.mark.y : P.y; }
      return;
    }
    if (this.sayT > 0) { this.sayT -= dt; if (this.sayT > 0) return; }
    if (!P.onGround && !this.fx && P.y < this.zone.ground && !(pre && pre.mark)) {
      // let them land first
      P.vy = Math.min(P.vy + GRAVITY * dt, 400);
      P.y = Math.min(P.y + P.vy * dt, this.groundAt(P.x));
      if (P.y >= this.groundAt(P.x)) P.onGround = true;
      return;
    }
    if (!this.fx) {
      const d = this.death;
      const maker = DFX[d.fx];
      if (!maker) { console.warn('missing fx', d.fx); this.finishDeath(); return; }
      if (d.noHelmet) P.fx.noHelmet = true;
      this.fx = maker({ P, obj: this.deathObj, o: d.o || {}, W: this, id: this.deathId, death: d });
      this.fxT = 0;
    }
    this.fxT += dt;
    this.fx.update(dt, this.fxT);
    if (this.fxT >= (this.fx.dur || 3) || this.fx.done) this.finishDeath();
  },

  groundAt(x) {
    return this.zone.ground;
  },

  finishDeath() {
    const id = this.deathId;
    const res = Game.recordDeath(id, this.lifeLen, this.fx && this.fx.multi);
    this.mode = 'card';
    UI.openCard(id, res, this.P, this.lifeLen);
  },

  respawn() {
    const P = this.P;
    const d = this.death;
    let x = P.deathX === undefined ? this.zone.spawn : P.deathX;
    // step away from whatever just killed us
    if (this.deathObj && this.deathObj.touchBox) {
      const o = this.deathObj;
      const left = o.x + o.touchBox.x - 10, right = o.x + o.touchBox.x + o.touchBox.w + 10;
      x = (x - left < right - x || right > this.zone.width - 10) ? left : right;
    }
    if (d && d.respawnX !== undefined && this.deathObj) x = this.deathObj.x + d.respawnX;
    x = clamp(x, 12, this.zone.width - 12);
    for (const o of this.objs) if (o.blockX !== undefined && (!o.type.blocking || o.type.blocking(o, this))) x = Math.min(x, o.x + o.blockX - 8);
    this.fx = null;
    this.death = null;
    this.deathObj = null;
    this.ghosts = [];
    this.decals = [];
    this.camFocus = null;
    FX.clear();
    for (const o of this.objs) { o.hidden = false; if (o.type.reset) o.type.reset(o); }
    this.newPlayer(x);
    this.mode = 'play';
    FX.burst(x, this.zone.ground - 8, 14, { type: 'spr', sprite: 'p_star_small', speed: 50, life: 0.6, drag: 3 });
    FX.dust(x, this.zone.ground, 6, '#ffffff');
    Sound.play('respawn');
  },

  // ------------------------------------------------------------ ghosts
  ghost(x, y, o = {}) {
    this.ghosts.push(Object.assign({ x, y, t: 0, delay: 0, speed: 16, halo: true, flip: this.P ? this.P.face < 0 : false }, o));
    Sound.play('rise', 1.4);
  },
  updateGhosts(dt) {
    for (const g of this.ghosts) {
      if (g.delay > 0) { g.delay -= dt; continue; }
      g.t += dt;
      g.y -= g.speed * dt;
    }
  },
  drawGhosts() {
    for (const g of this.ghosts) {
      if (g.delay > 0) continue;
      const k = Math.min(1, g.t / 0.4);
      const sway = Math.sin(g.t * 4) * 3;
      const alpha = Math.min(0.85, k) * (g.t > 2.2 ? Math.max(0, 1 - (g.t - 2.2)) : 1);
      spr(g.sprite || 'ghost', g.x + sway, g.y, { anchor: 'bc', alpha, flip: g.flip });
      if (g.halo) spr('halo', g.x + sway, g.y - 15 + Math.sin(g.t * 6), { anchor: 'bc', alpha });
      if (g.text && alpha > 0.3) text(g.text, g.x + sway, g.y - 26, { font: 'small', align: 'center', color: PAL.W, outline: PAL.K });
    }
  },

  // ------------------------------------------------------------ transitions
  beginTransition(to, from) {
    if (this.mode === 'transition') return;
    this.mode = 'transition';
    this.trans = { to, from, t: 0, swapped: false };
    Sound.play('door');
  },
  updateTransition(dt) {
    const tr = this.trans;
    tr.t += dt;
    if (tr.t > 0.35 && !tr.swapped) {
      tr.swapped = true;
      this.enterZone(tr.to, tr.from);
      this.mode = 'transition';
    }
    if (tr.t > 0.7) { this.mode = 'play'; this.trans = null; }
  },

  showToast(title, sub = '', dur = 2.5) { this.toast = { title, sub, t: 0, dur }; },

  // ------------------------------------------------------------ camera
  updateCamera(dt) {
    const z = this.zone, P = this.P;
    let tx;
    if (this.camFocus) tx = this.camFocus.x - W / 2;
    else if (this.mode === 'dying' || this.mode === 'card') {
      // hold still while the gag plays, but keep the start of it in view
      if (this.fx) return;
      tx = P.x - W / 2;
    } else tx = P.x - W / 2 + P.face * 18;
    tx = clamp(tx, 0, Math.max(0, z.width - W));
    this.cam.x += (tx - this.cam.x) * Math.min(1, dt * (this.camFocus ? 3 : 5));
    if (Math.abs(tx - this.cam.x) < 0.2) this.cam.x = tx;
  },

  // ------------------------------------------------------------ draw
  draw() {
    const g = Gfx.g;
    const z = this.zone;
    const [sx, sy] = FX.offset();
    const cx = Math.round(this.cam.x) - sx, cy = Math.round(this.cam.y) - sy;
    // background layers
    if (z.drawSky) z.drawSky(this.t, cx);
    for (const L of z.layers) g.drawImage(L.canvas, -Math.round(cx * L.p) + (L.x || 0), (L.y || 0) - cy);
    g.save();
    g.translate(-cx, -cy);
    if (z.drawBack) z.drawBack(this.t, cx, this);
    for (const dcl of this.decals) dcl.draw(dcl);
    const objs = this.objs.slice().sort((a, b) => (a.z || 0) - (b.z || 0));
    for (const o of objs) if (!o.hidden && (o.z || 0) < 5) drawObj(o, this.t);
    if (this.fx && this.fx.drawBehind) this.fx.drawBehind(this.fxT);
    this.drawPlayer();
    for (const o of objs) if (!o.hidden && (o.z || 0) >= 5) drawObj(o, this.t);
    if (this.fx && this.fx.draw) this.fx.draw(this.fxT);
    if (z.drawFront) z.drawFront(this.t, cx, this);
    this.drawGhosts();
    FX.draw();
    if (this.fx && this.fx.drawTop) this.fx.drawTop(this.fxT);
    g.restore();
    if (z.drawOverlay) z.drawOverlay(this.t, cx, this);
    if (this.fx && this.fx.drawScreen) this.fx.drawScreen(this.fxT);
    FX.drawPops(cx, cy);
    UI.drawWorldUI(this, cx, cy);
    FX.drawFlash();
    if (this.mode === 'card') UI.drawCard();
    if (this.mode === 'transition' || (this.trans && this.trans.t < 0.7)) {
      const t = this.trans ? this.trans.t : 1;
      const k = t < 0.35 ? t / 0.35 : 1 - (t - 0.35) / 0.35;
      dither(0, 0, W, H, '#181425', Math.round(clamp(k, 0, 1) * 16));
    }
  },

  drawPlayer() {
    const P = this.P;
    if (!P || P.hidden || P.fx.hidden) return;
    const f = P.fx;
    let pose = f.pose, expr = f.expr;
    if (!pose) {
      if (this.mode === 'dying' || this.mode === 'card') pose = 'stand';
      else if (!P.onGround) pose = P.vy < 0 ? 'jump' : 'fall';
      else if (Math.abs(P.vx) > 5) pose = Math.floor(P.walkT * 8) % 4 === 1 ? 'walk1' : Math.floor(P.walkT * 8) % 4 === 3 ? 'walk2' : 'stand';
      else pose = 'stand';
    }
    if (!expr) expr = P.blinkT < 0 ? 'blink' : 'normal';
    const breathe = pose === 'stand' && this.mode === 'play' && Math.abs(P.vx) < 5 && Math.floor(this.t * 1.5) % 2 === 1 ? 1 : 0;
    const flip = f.flip === undefined ? P.face < 0 : f.flip;
    const c = playerVariant(P.look, pose, expr, f.variant, flip, breathe);
    let alpha = f.alpha;
    if (P.spawnT > 0 && Math.floor(P.spawnT * 20) % 2 === 0) alpha = 0.4;
    const cxp = P.x + f.dx, cyp = P.y + f.dy - c.height / 2;
    const g = Gfx.g;
    if (f.clipY !== undefined && f.clipY !== null) {
      g.save(); g.beginPath(); g.rect(this.cam.x - 50, -200, W + 100, f.clipY + 200); g.clip();
    }
    if (this.zone.ghostly && alpha === 1) alpha = 0.8;
    spr(null, cxp, cyp + (f.sy !== 1 ? (1 - f.sy) * c.height / 2 : 0), { canvas: c, anchor: 'c', rot: f.rot, sx: f.sx, sy: f.sy, alpha });
    if (f.overlay) f.overlay(cxp, cyp, c);
    if (this.zone.helmet && !f.noHelmet && !f.rot && f.sx === 1 && f.sy === 1) {
      const hx = cxp + (flip ? -1 : 1), hy = cyp - 4 + breathe;
      const g2 = Gfx.g;
      g2.globalAlpha = 0.25; circle(hx, hy, 8, '#2ce8f5'); g2.globalAlpha = 1;
      ring(hx, hy, 8, '#c0cbdc');
      px(hx - 4, hy - 5, '#ffffff'); px(hx - 5, hy - 4, '#ffffff'); px(hx - 3, hy - 6, '#ffffff');
    }
    if (this.zone.ghostly && !f.rot) spr('halo', cxp, cyp - 12 + Math.sin(this.t * 4), { anchor: 'bc' });
    if (f.clipY !== undefined && f.clipY !== null) g.restore();
  },
};

function freshPlayerFx() {
  return { pose: null, expr: null, variant: null, rot: 0, sx: 1, sy: 1, dx: 0, dy: 0, alpha: 1, hidden: false, flip: undefined, overlay: null, clipY: null };
}

// ---------------------------------------------------------------- objects
function makeObj(def, i, zone) {
  const type = OBJ[def.type];
  if (!type) { console.warn('unknown object', def.type); return { type: {}, x: 0, y: 0, w: 1, h: 1, hidden: true }; }
  const size = type.sprite ? sprSize(type.sprite) : { w: type.w || 10, h: type.h || 10 };
  const o = {
    id: def.type + i, def, type, x: def.x, y: def.y === undefined ? zone.ground : def.y,
    w: type.w || size.w, h: type.h || size.h, z: def.z === undefined ? (type.z || 0) : def.z,
    flip: !!def.flip, t: rand(10), state: {}, hidden: false,
    actions: def.actions || type.actions || null,
    touch: def.touch || type.touch || null,
    solidTop: type.solidTop || null,
    blockX: type.blockX,
    name: def.name || type.name,
  };
  if (o.touch) o.touchBox = type.touchBox || { x: 0, y: 0, w: o.w, h: o.h };
  if (type.init) type.init(o, zone);
  return o;
}

function drawObj(o, t) {
  const ty = o.type;
  if (ty.draw) { ty.draw(o, t); return; }
  if (ty.sprite) spr(ty.sprite, o.x + objShake(o), o.y - o.h, { flip: o.flip });
}

<script>

    if (Wd.bubble) this.drawBubble(Wd, cx, cy);
    // menu
    if (Wd.mode === 'menu' && Wd.menu) this.drawMenu(Wd.menu);
    // HUD
    if (Wd.mode !== 'card') this.drawHUD(Wd);

  drawHUD(Wd) {
