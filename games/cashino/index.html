    Font.draw('Z: SPIN', x + 31, y + 12, { f: 's', c: C.gray, a: 'c' });
    Font.draw('▲▼: BET', x + 31, y + 20, { f: 's', c: C.gray, a: 'c' });
    Font.draw('Z WHILE', x + 31, y + 32, { f: 's', c: C.slate, a: 'c' });
    Font.draw('SPINNING:', x + 31, y + 39, { f: 's', c: C.slate, a: 'c' });
    Font.draw('STOP', x + 31, y + 46, { f: 's', c: C.slate, a: 'c' });
  }
}

// ---- js/games/blackjack.js
'use strict';
// =====================================================================
//  CASHINO - blackjack. 6-deck shoe, dealer stands on 17, blackjack
//  pays 3:2, double on any two, one split. Luck can save you from a
//  bust or push the dealer over 21.
// =====================================================================

const BJ_TABLES = {
  main: { name: 'BLACKJACK', min: gems(5), max: gems(2000), felt: C.felt, feltD: C.forest, feltL: C.feltL, dealer: 'dealerF' },
  high: { name: 'HIGH LIMIT BLACKJACK', min: gems(500), max: gems(200000), felt: C.grape, feltD: C.plum, feltL: C.violet, dealer: 'dealerF2' },
  diamond: { name: 'DIAMOND BLACKJACK', min: gems(50000), max: gems(200000000), felt: C.navy, feltD: C.ink, feltL: C.cobalt, dealer: 'dealerF2' },
};

const BJ = {
  // player draw: luck may swap a card that would bust (or a weak double) for a better one
  drawPlayer(shoe, cards) {
    let c = shoe.pop();
    if (U.rand() < Luck.q()) {
      const alt = shoe.pop();
      const score = x => { const v = Cards.bj(cards.concat([x])).total; return v > 21 ? -1 : v; };
      if (score(alt) > score(c)) { shoe.splice(U.int(0, shoe.length), 0, c); c = alt; } else shoe.splice(U.int(0, shoe.length), 0, alt);
    }
    return c;
  },
  // dealer draw: luck prefers the card that is worse for the dealer
  drawDealer(shoe, cards) {
    let c = shoe.pop();
    if (U.rand() < Luck.q()) {
      const alt = shoe.pop();
      const score = x => { const v = Cards.bj(cards.concat([x])).total; return v > 21 ? 100 : -v; };
      if (score(alt) > score(c)) { shoe.splice(U.int(0, shoe.length), 0, c); c = alt; } else shoe.splice(U.int(0, shoe.length), 0, alt);
    }
    return c;
  },
  // works for raw cards and for TableCards (which wrap the card in .c)
  isPair(h) {
    if (h.cards.length !== 2) return false;
    const a = h.cards[0].c || h.cards[0], b = h.cards[1].c || h.cards[1];
    return Math.min(10, a.r) === Math.min(10, b.r);
  },
};

class BlackjackScene extends GameScene {
  constructor(obj) {
    const tb = BJ_TABLES[obj.cfg] || BJ_TABLES.main;
    super(obj, tb.name);
    this.tb = tb;
    this.shoe = Cards.deck(6);
    this.bet = 0;
    State.lastBet = State.lastBet || {};
    this.lastBet = State.lastBet['bj:' + obj.cfg] || 0;
    this.hands = []; this.dealer = [];
    this.phase = 'bet';
    this.active = 0;
    this.dealerSpr = Spr.char(LOOKS[tb.dealer] || LOOKS.dealer).d[0];
    this.labels = [];
    this.build();
  }

  canLeave() { return this.phase === 'bet' && this.bet === 0; }
  leave() {
    if (this.phase === 'bet' && this.bet > 0) { this.bet = 0; Snd.play('chips'); return; }
    super.leave();
  }

  build() {
    const g = this.ui;
    g.clear();
    if (this.phase === 'bet') {
      const chips = chipSet(this.tb.min, this.tb.max, 5);
      chips.forEach((v, i) => g.add({ x: 6 + i * 26, y: 154, w: 24, h: 24, value: v, draw: drawChipBtn, onPress: () => this.addChip(v), sound: 'chip', enabled: State.money >= this.bet + v && this.bet + v <= this.tb.max }));
      g.add({ x: 212, y: 160, w: 42, h: 13, label: 'CLEAR', font: 's', onPress: () => { this.bet = 0; this.build(); }, sound: 'chips', enabled: this.bet > 0 });
      const rebet = this.bet === 0 && this.lastBet >= this.tb.min && this.lastBet <= State.money;
      this.dealBtn = g.add({ x: 258, y: 157, w: 56, h: 17, label: rebet ? 'REBET' : 'DEAL', style: 'red', onPress: () => this.startRound(), enabled: this.bet >= this.tb.min || rebet });
      g.focus = this.bet > 0 || rebet ? this.dealBtn : g.items[0];
    } else if (this.phase === 'play') {
      const h = this.hands[this.active];
      const canDouble = h.cards.length === 2 && State.money >= h.bet && !h.splitAces;
      const canSplit = this.hands.length === 1 && BJ.isPair(h) && State.money >= h.bet;
      const hit = g.add({ x: 176, y: 160, w: 32, h: 15, label: 'HIT', style: 'green', onPress: () => this.act('hit') });
      g.add({ x: 211, y: 160, w: 38, h: 15, label: 'STAND', style: 'red', onPress: () => this.act('stand') });
      g.add({ x: 252, y: 160, w: 30, h: 15, label: 'x2', font: 'm', onPress: () => this.act('double'), enabled: canDouble });
      g.add({ x: 285, y: 160, w: 31, h: 15, label: 'SPLIT', font: 's', onPress: () => this.act('split'), enabled: canSplit });
      g.focus = Cards.bj(h.cards).total >= 17 ? g.items[1] : hit;
    }
  }

  addChip(v) {
    if (this.bet + v > this.tb.max) { this.say('TABLE MAX IS ' + U.moneyShort(this.tb.max), C.cherry); Snd.play('error'); return; }
    if (this.bet + v > State.money) { this.say('NOT ENOUGH GEMS', C.cherry); Snd.play('error'); return; }
    this.bet += v;
    this.build();
  }

  act(a) { if (this.resolve) { const r = this.resolve; this.resolve = null; this.phase = 'deal'; this.build(); r(a); } }
  waitAction() { this.phase = 'play'; this.build(); return new Promise(res => { this.resolve = res; }); }

  // ---------------------------------------------------------- layout
  handX(i) { return this.hands.length === 1 ? 160 : i === 0 ? 104 : 216; }
  targetFor(list, cx, y, i) { const n = list.length, sp = 14; return { x: Math.round(cx - ((n - 1) * sp + 22) / 2 + i * sp), y }; }
  async relayout(dur = 0.2) {
    const ps = [];
    this.dealer.forEach((c, i) => { const t = this.targetFor(this.dealer, 160, 60, i); ps.push(this.tl.tween(c, t, dur)); });
    this.hands.forEach((h, hi) => h.cards.forEach((c, i) => { const t = this.targetFor(h.cards, this.handX(hi), 108, i); ps.push(this.tl.tween(c, t, dur)); }));
    await Promise.all(ps);
  }
  async give(list, card, up, cx, y) {
    const tc = new TableCard(card, 268, 20, false);
    list.push(tc);
    Snd.play('card');
    const t = this.targetFor(list, cx, y, list.length - 1);
    // slide the others over
    list.forEach((c, i) => { if (c !== tc) { const tt = this.targetFor(list, cx, y, i); this.tl.tween(c, tt, 0.18); } });
    await this.tl.tween(tc, t, 0.24, 'outQuad');
    if (up) await tc.flip(this.tl);
    return tc;
  }
  dealPlayer(hi) { const h = this.hands[hi]; return this.give(h.cards, BJ.drawPlayer(this.shoe, h.cards.map(c => c.c)), true, this.handX(hi), 108); }
  dealDealer(up, lucky = true) { const cards = this.dealer.map(c => c.c); return this.give(this.dealer, lucky ? BJ.drawDealer(this.shoe, cards) : this.shoe.pop(), up, 160, 60); }

  label(text, x, y, c) { this.labels.push({ text, x, y, c, t: 0 }); }

  // ---------------------------------------------------------- the round
  async startRound() {
    if (this.phase !== 'bet') return;
    if (this.bet === 0) this.bet = Math.min(this.lastBet, State.money);
    if (this.bet < this.tb.min || this.bet > State.money) { Snd.play('error'); return; }
    this.lastBet = this.bet; State.lastBet['bj:' + this.obj.cfg] = this.bet;
    State.take(this.bet);
    this.phase = 'deal'; this.build();
    this.labels = [];
    if (this.shoe.length < 60) { this.say('SHUFFLING A FRESH SHOE...', C.lav); this.shoe = Cards.deck(6); await this.tl.wait(0.8); }
    this.hands = [{ cards: [], bet: this.bet, done: false }];
    this.dealer = [];
    this.active = 0;
    await this.give(this.hands[0].cards, this.shoe.pop(), true, 160, 108);
    await this.dealDealer(true, false);
    await this.give(this.hands[0].cards, this.shoe.pop(), true, 160, 108);
    await this.dealDealer(false, false);
    if (this.dead) return;
    const dv = Cards.bj(this.dealer.map(c => c.c)), pv = Cards.bj(this.hands[0].cards.map(c => c.c));
    const dealerBJ = dv.total === 21, playerBJ = pv.total === 21;
    if (dealerBJ || playerBJ) {
      await this.tl.wait(0.3);
      await this.dealer[1].flip(this.tl);
      await this.settle();
      return;
    }
    for (let hi = 0; hi < this.hands.length; hi++) {
      this.active = hi;
      const h = this.hands[hi];
      while (!h.done) {
        if (Cards.bj(h.cards.map(c => c.c)).total >= 21 || h.splitAces) { h.done = true; break; }
        const a = await this.waitAction();
        if (this.dead) return;
        if (a === 'hit') {
          await this.dealPlayer(hi);
          if (Cards.bj(h.cards.map(c => c.c)).total > 21) { h.done = true; h.bust = true; Snd.play('lose'); this.label('BUST', this.handX(hi), 100, C.cherry); }
        } else if (a === 'stand') h.done = true;
        else if (a === 'double') {
          State.take(h.bet); h.bet *= 2; h.doubled = true;
          Snd.play('chips');
          await this.dealPlayer(hi);
          if (Cards.bj(h.cards.map(c => c.c)).total > 21) { h.bust = true; Snd.play('lose'); this.label('BUST', this.handX(hi), 100, C.cherry); }
          h.done = true;
        } else if (a === 'split') {
          State.take(h.bet);
          Snd.play('chips');
          const second = h.cards.pop();
          const nh = { cards: [second], bet: h.bet, done: false, split: true };
          h.split = true;
          if (h.cards[0].c.r === 1) { h.splitAces = true; nh.splitAces = true; }
          this.hands.push(nh);
          await this.relayout();
          await this.dealPlayer(0);
          await this.dealPlayer(1);
        }
      }
    }
    // dealer's turn (only if someone is still standing)
    await this.dealer[1].flip(this.tl);
    if (this.hands.some(h => !h.bust)) {
      while (Cards.bj(this.dealer.map(c => c.c)).total < 17) {
        await this.tl.wait(0.35);
        await this.dealDealer(true);
        if (this.dead) return;
      }
    }
    await this.settle();
  }

  async settle() {
    await this.tl.wait(0.35);
    const dv = Cards.bj(this.dealer.map(c => c.c));
    const dealerBJ = dv.total === 21 && this.dealer.length === 2;
    let bet = 0, pay = 0;
    this.hands.forEach((h, hi) => {
      const pv = Cards.bj(h.cards.map(c => c.c));
      const natural = pv.total === 21 && h.cards.length === 2 && !h.split;
      let p = 0, text, c;
      if (natural && !dealerBJ) { p = h.bet * 2.5; text = 'BLACKJACK!'; c = C.yellow; }
      else if (natural && dealerBJ) { p = h.bet; text = 'PUSH'; c = C.silver; }
      else if (dealerBJ) { p = 0; text = 'DEALER BLACKJACK'; c = C.cherry; }
      else if (h.bust) { p = 0; text = 'BUST'; c = C.cherry; }
      else if (dv.total > 21) { p = h.bet * 2; text = 'DEALER BUSTS!'; c = C.lime; }
      else if (pv.total > dv.total) { p = h.bet * 2; text = 'WIN!'; c = C.lime; }
      else if (pv.total === dv.total) { p = h.bet; text = 'PUSH'; c = C.silver; }
      else { p = 0; text = 'LOSE'; c = C.cherry; }
      bet += h.bet; pay += p;
      this.labels = this.labels.filter(l => l.x !== this.handX(hi));
      this.label(text, this.handX(hi), 98, c);
    });
    pay = Math.round(pay);
    this.finish('blackjack', bet, pay, 160, 110, { quiet: true });
    if (pay === 0) Snd.play('lose');
    await this.tl.wait(1.6);
    if (this.dead) return;
    // sweep the cards away
    const all = this.dealer.concat(...this.hands.map(h => h.cards));
    Snd.play('card');
    await Promise.all(all.map((c, i) => this.tl.tween(c, { x: 30, y: 18 }, 0.25, 'inQuad', i * 0.02)));
    this.dealer = []; this.hands = []; this.labels = [];
    this.bet = this.lastBet <= State.money ? 0 : 0;
    this.phase = 'bet';
    this.build();
  }

  update(dt) {
    if (super.update(dt)) return;
    for (const l of this.labels) l.t += dt;
    this.ui.update(dt);
    if (this.phase === 'bet') for (const b of this.ui.items) if (b.value) b.enabled = State.money >= this.bet + b.value && this.bet + b.value <= this.tb.max;
  }

  draw() {
    const tb = this.tb, t = this.t;
    // back wall
    R(0, 0, W, 56, C.ink);
    for (let x = 0; x < W; x += 16) { R(x + 7, 13, 2, 38, C.night); }
    R(0, 50, W, 1, C.gold);
    sprS(this.dealerSpr, 144, 2, 2);
    // shoe & discard
    R(252, 30, 30, 20, C.woodD); R(252, 30, 30, 2, C.wood); R(256, 22, 22, 10, C.crimson); R(257, 23, 20, 1, C.red);
    R(38, 34, 24, 16, C.ink); for (let i = 0; i < 4; i++) R(40, 46 - i * 2, 20, 2, i % 2 ? C.crimson : C.wine);
    // limits placard
    box(88, 36, 44, 13, C.night, C.gold);
    Font.draw(U.moneyShort(tb.min) + '-' + U.moneyShort(tb.max), 110, 40, { c: C.lemon, f: 's', a: 'c' });
    // table
    R(0, 52, W, 6, C.woodL); R(0, 52, W, 1, C.lemon); R(0, 57, W, 1, C.woodD);
    R(0, 58, W, H - 58, tb.felt);
    dither(0, 58, W, 3, tb.feltD);
    Font.draw('BLACKJACK PAYS 3 TO 2', 160, 91, { c: C.gold, f: 's', a: 'c' });
    Font.draw('DEALER MUST STAND ON 17', 160, 98, { c: tb.feltL, f: 's', a: 'c' });
    circO(160, 156, 13, tb.feltL); circO(160, 156, 12, tb.feltL);
    // dealer chip tray on the rail
    R(132, 53, 56, 5, C.ink); for (let i = 0; i < 7; i++) R(134 + i * 8, 54, 6, 3, [C.white, C.red, C.blue, C.green, C.ink, C.violet, C.yellow][i]);
    // cards
    for (const c of this.dealer) c.draw();
    this.hands.forEach((h, hi) => { for (const c of h.cards) c.draw(); });
    // totals
    if (this.dealer.length) {
      const up = this.dealer.filter(c => c.up).map(c => c.c);
      if (up.length) { const v = Cards.bj(up); this.totalTag(v.total + (this.dealer.every(c => c.up) ? '' : '+'), this.dealer[0].x - 14, 71, true); }
    }
    this.hands.forEach((h, hi) => {
      if (!h.cards.length) return;
      const v = Cards.bj(h.cards.map(c => c.c));
      this.totalTag((v.soft && v.total < 21 ? 'S' : '') + v.total, h.cards[0].x - 14, 119, false, this.phase === 'play' && hi === this.active);
      if (this.hands.length > 1) chipStack(h.bet, this.handX(hi) + 30, 150, 5);
    });
    // bet
    if (this.hands.length <= 1) {
      const amt = this.hands.length ? this.hands[0].bet : this.bet;
      if (amt) { chipStack(amt, 160, 158, 6); Font.draw(U.moneyShort(amt), 180, 152, { c: C.yellow, f: 's', ol: C.ink }); }
      else if (this.phase === 'bet') Font.draw('PLACE BET', 160, 154, { c: tb.feltL, f: 's', a: 'c' });
    }
    // labels
    for (const l of this.labels) {
      const k = Math.min(1, l.t * 5);
      Font.draw(l.text, l.x, l.y - 6 * Ease.outBack(k) + 6, { c: l.c, a: 'c', ol: C.ink });
    }
    if (this.phase === 'bet') {
      Font.draw('TAP CHIPS TO BET', 70, 147, { c: tb.feltL, f: 's', a: 'c' });
    }
    this.ui.draw();
    this.drawTop();
    this.fx.draw();
    UI.drawPops(this, 1 / 60);
    this.drawMsg(122);
  }

  totalTag(text, x, y, dealer, active) {
    const w = Font.width(text, 's') + 6;
    box(Math.round(x - w / 2), y, w, 9, active ? C.yellow : C.ink, active ? C.white : C.gold);
    Font.draw(text, x, y + 2, { c: active ? C.ink : C.white, f: 's', a: 'c' });
  }
}

GAMES.blackjack = obj => new BlackjackScene(obj);
GAME_INFO.blackjack = cfg => { const tb = BJ_TABLES[cfg] || BJ_TABLES.main; return { name: tb.name, limits: U.moneyShort(tb.min) + '-' + U.moneyShort(tb.max) }; };

// ---- js/games/roulette.js
'use strict';
// =====================================================================
//  CASHINO - European roulette (single zero). The wheel is rendered
//  per pixel; the ball is animated so it lands in the chosen pocket.
// =====================================================================

const RL_TABLES = {
  main: { name: 'ROULETTE', min: gems(1), max: gems(5000), felt: C.felt, feltL: C.feltL, feltD: C.forest },
  high: { name: 'HIGH LIMIT ROULETTE', min: gems(100), max: gems(500000), felt: C.grape, feltL: C.violet, feltD: C.plum },
  diamond: { name: 'DIAMOND ROULETTE', min: gems(10000), max: gems(500000000), felt: C.navy, feltL: C.cobalt, feltD: C.ink },
};

const RL = {
  WHEEL: [0, 32, 15, 19, 4, 21, 2, 25, 17, 34, 6, 27, 13, 36, 11, 30, 8, 23, 10, 5, 24, 16, 33, 1, 20, 14, 31, 9, 22, 18, 29, 7, 28, 12, 35, 3, 26],
  RED: new Set([1, 3, 5, 7, 9, 12, 14, 16, 18, 19, 21, 23, 25, 27, 30, 32, 34, 36]),
  color(n) { return n === 0 ? 'green' : this.RED.has(n) ? 'red' : 'black'; },
  wins(spot, n) {
    if (spot[0] === 'n') return +spot.slice(1) === n;
    if (n === 0) return false;
    switch (spot) {
      case 'red': return this.RED.has(n);
      case 'black': return !this.RED.has(n);
      case 'odd': return n % 2 === 1;
      case 'even': return n % 2 === 0;
      case 'low': return n <= 18;
      case 'high': return n >= 19;
      case 'd1': return n <= 12;
      case 'd2': return n >= 13 && n <= 24;
      case 'd3': return n >= 25;
      case 'c1': return n % 3 === 1;
      case 'c2': return n % 3 === 2;
      case 'c3': return n % 3 === 0;
    }
    return false;
  },
  mult(spot) { return spot[0] === 'n' ? 36 : spot[0] === 'd' || spot[0] === 'c' ? 3 : 2; },
  payout(bets, n) { let p = 0; for (const s in bets) if (this.wins(s, n)) p += bets[s] * this.mult(s); return p; },
};

class RouletteScene extends GameScene {
  constructor(obj) {
    const tb = RL_TABLES[obj.cfg] || RL_TABLES.main;
    super(obj, tb.name);
    this.tb = tb;
    this.bets = {}; this.undo = [];
    State.lastBet = State.lastBet || {};
    this.last = State.lastBet['rl:' + obj.cfg] || null;
    this.chips = chipSet(tb.min, tb.max, 5);
    this.chip = this.chips[0];
    this.hist = [];
    this.wa = 0; this.ball = null; this.result = null; this.resultT = 0;
    this.cx = 54; this.cy = 68; this.R = 44;
    this.wheelCv = Gfx.canvas(this.R * 2 + 1, this.R * 2 + 1);
    this.img = this.wheelCv.getContext('2d').createImageData(this.R * 2 + 1, this.R * 2 + 1);
    this.buf = new Uint32Array(this.img.data.buffer);
    this.prepWheel();
    this.cells = [];
    this.build();
  }

  prepWheel() {
    const D = this.R * 2 + 1;
    this.lr = new Float32Array(D * D); this.la = new Float32Array(D * D);
    for (let j = 0; j < D; j++) for (let i = 0; i < D; i++) {
      const dx = i - this.R, dy = j - this.R;
      this.lr[j * D + i] = Math.sqrt(dx * dx + dy * dy);
      this.la[j * D + i] = Math.atan2(dy, dx);
    }
    const u = Gfx.u32;
    this.col = {
      red: u(C.red), redD: u(C.crimson), black: u(C.ink), blackD: u(C.black), green: u(C.green), greenD: u(C.felt),
      fret: u(C.silver), gold: u(C.gold), goldL: u(C.lemon), goldD: u(C.bronze), wood: u(C.wood), woodD: u(C.woodD), woodL: u(C.woodL),
      track: u('#5a331b'), trackL: u('#6d3f22'), cone: u(C.woodL), coneD: u(C.wood), clear: 0,
    };
  }

  canLeave() { return !this.busy && !Object.keys(this.bets).length; }
  leave() {
    if (!this.busy && Object.keys(this.bets).length) { this.popChip(); return; }
    super.leave();
  }

  total() { let t = 0; for (const k in this.bets) t += this.bets[k]; return t; }

  build() {
    const g = this.ui;
    g.clear();
    this.cells = [];
    const X0 = 104, Y0 = 20, CW = 14, CH = 12;
    const cell = (spot, x, y, w, h, label, bg) => {
      const b = g.add({ x, y, w, h, spot, label, bg, draw: (bt, f) => this.drawCell(bt, f), onPress: () => this.place(spot), silent: true });
      this.cells.push(b);
      return b;
    };
    cell('n0', X0, Y0, 12, CH * 3, '0', C.green);
    for (let c = 0; c < 12; c++) for (let r = 0; r < 3; r++) {
      const n = c * 3 + (3 - r);
      cell('n' + n, X0 + 12 + c * CW, Y0 + r * CH, CW, CH, String(n), RL.RED.has(n) ? C.red : C.ink);
    }
    for (let r = 0; r < 3; r++) cell('c' + (3 - r), X0 + 12 + 12 * CW, Y0 + r * CH, 16, CH, '2:1', null);
    ['1ST 12', '2ND 12', '3RD 12'].forEach((l, i) => cell('d' + (i + 1), X0 + 12 + i * 4 * CW, Y0 + 3 * CH, 4 * CW, 11, l, null));
    [['low', '1-18'], ['even', 'EVEN'], ['red', '◆'], ['black', '◆'], ['odd', 'ODD'], ['high', '19-36']].forEach(([s, l], i) => cell(s, X0 + 12 + i * 2 * CW, Y0 + 3 * CH + 11, 2 * CW, 11, l, s === 'red' ? C.red : s === 'black' ? C.ink : null));
    // chips
    this.chips.forEach((v, i) => g.add({ x: 106 + i * 26, y: 90, w: 24, h: 24, value: v, draw: (b, f) => { drawChipBtn(b, f); if (this.chip === v) { const cx = b.x + b.w / 2; P(cx, b.y - 3, C.yellow); R(cx - 1, b.y - 4, 3, 1, C.yellow); } }, onPress: () => { this.chip = v; }, sound: 'chip' }));
    this.spinBtn = g.add({ x: 246, y: 90, w: 68, h: 22, label: 'SPIN', style: 'red', onPress: () => this.spin() });
    g.add({ x: 106, y: 124, w: 40, h: 13, label: 'UNDO', font: 's', onPress: () => this.popChip(), silent: true });
    g.add({ x: 150, y: 124, w: 40, h: 13, label: 'CLEAR', font: 's', onPress: () => { if (this.busy) return; this.bets = {}; this.undo = []; Snd.play('chips'); } });
    g.add({ x: 194, y: 124, w: 44, h: 13, label: 'REBET', font: 's', onPress: () => this.rebet() });
    g.add({ x: 242, y: 124, w: 72, h: 13, label: 'x2 DOUBLE', font: 's', onPress: () => this.doubleUp() });
    g.focus = g.items.find(b => b.spot === 'red');
  }

  place(spot) {
    if (this.busy) return;
    const v = this.chip;
    if (this.total() + v > this.tb.max) { Snd.play('error'); this.say('TABLE MAX ' + U.moneyShort(this.tb.max), C.cherry); return; }
    if (this.total() + v > State.money) { Snd.play('error'); this.say('NOT ENOUGH GEMS', C.cherry); return; }
    this.bets[spot] = (this.bets[spot] || 0) + v;
    this.undo.push([spot, v]);
    Snd.play('chip');
  }
  popChip() {
    if (this.busy || !this.undo.length) return;
    const [s, v] = this.undo.pop();
    this.bets[s] -= v;
    if (this.bets[s] <= 0) delete this.bets[s];
    Snd.play('chip');
  }
  rebet() {
    if (this.busy || !this.last) return;
    let sum = 0; for (const k in this.last) sum += this.last[k];
    if (sum > State.money) { Snd.play('error'); this.say('NOT ENOUGH GEMS TO REBET', C.cherry); return; }
    this.bets = Object.assign({}, this.last);
    this.undo = Object.entries(this.bets);
    Snd.play('chips');
  }
  doubleUp() {
    if (this.busy) return;
    const t = this.total();
    if (!t) { this.rebet(); return; }
    if (t * 2 > State.money || t * 2 > this.tb.max) { Snd.play('error'); this.say('CAN NOT DOUBLE THAT', C.cherry); return; }
    for (const k in this.bets) { this.undo.push([k, this.bets[k]]); this.bets[k] *= 2; }
    Snd.play('chips');
  }

  async spin() {
    if (this.busy) return;
    const bet = this.total();
    if (!bet) { if (this.last) { this.rebet(); if (this.total()) return this.spin(); } Snd.play('error'); this.say('PLACE A BET ON THE TABLE FIRST', C.cherry); return; }
    if (bet > State.money) { Snd.play('error'); this.say('NOT ENOUGH GEMS', C.cherry); return; }
    this.busy = true;
    this.last = Object.assign({}, this.bets);
    State.lastBet['rl:' + this.obj.cfg] = this.last;
    State.take(bet);
    this.result = null;
    const bets = this.bets;
    const n = Luck.pick(() => U.int(0, 36), x => RL.payout(bets, x));
    // choreograph the wheel and the ball
    const TL = 4.2, TW = 6.5;
    const w0 = this.wa, A = U.range(10, 14);
    const wheelAt = t => w0 + A * Ease.outQuad(Math.min(1, t / TW));
    const idx = RL.WHEEL.indexOf(n), seg = TAU / 37;
    const target = wheelAt(TL) + (idx + 0.5) * seg;
    const b0 = U.range(0, TAU);
    let delta = ((b0 - target) % TAU + TAU) % TAU + TAU * 4;
    this.ball = { t: 0, TL, TW, wheelAt, b0, delta, idx, seg, r: this.R - 6, a: b0, lastTick: 0, landed: false };
    Snd.play('ball');
    while (this.ball && !this.ball.landed) { await this.tl.wait(0.05); if (this.dead) return; }
    await this.tl.wait(0.6);
    this.result = n; this.resultT = 0;
    this.hist.unshift(n); if (this.hist.length > 10) this.hist.pop();
    const pay = RL.payout(bets, n);
    this.win = this.finish('roulette', bet, pay, 54, 68);
    await this.tl.wait(1.4);
    this.bets = {}; this.undo = [];
    this.busy = false;
  }

  update(dt) {
    if (this.busy && Input.pressed('b')) Input.eat('b');
    if (super.update(dt)) return;
    this.resultT += dt;
    const b = this.ball;
    if (b && !b.landed) {
      b.t += dt;
      this.wa = b.wheelAt(b.t);
      const k = Math.min(1, b.t / b.TL);
      b.a = b.b0 - b.delta * Ease.outCubic(k);
      // radius: roll on the track, then spiral in with bounces
      const outer = this.R - 6, inner = 27;
      if (k < 0.62) b.r = outer;
      else {
        const q = (k - 0.62) / 0.38;
        b.r = outer - (outer - inner) * Ease.outQuad(q) - Math.abs(Math.sin(q * 18)) * 4 * (1 - q);
        if (Math.floor(q * 18 / Math.PI) !== b.lastB) { b.lastB = Math.floor(q * 18 / Math.PI); Snd.play('clack'); }
      }
      const speed = b.delta * (1 - k) * 3 / b.TL;
      b.lastTick += dt * Math.min(20, speed * 1.2);
      if (b.lastTick > 1) { b.lastTick = 0; if (k < 0.62) Snd.play('ball'); }
      if (k >= 1) { b.landed = true; Snd.play('thud'); }
    } else if (b && b.landed) {
      b.t += dt;
      this.wa = b.wheelAt(b.t);
      b.a = this.wa + (b.idx + 0.5) * b.seg;
      b.r = 27;
      if (b.t > b.TW) { this.wa += dt * 0.25; }
    } else this.wa += dt * 0.25;
    this.ui.update(dt);
  }

  // ------------------------------------------------------------ drawing
  drawWheel() {
    const D = this.R * 2 + 1, buf = this.buf, lr = this.lr, la = this.la, col = this.col, wa = this.wa, seg = TAU / 37;
    const winIdx = this.result !== null ? RL.WHEEL.indexOf(this.result) : -1;
    const blink = Math.floor(this.resultT * 6) % 2 === 0;
    for (let p = 0; p < D * D; p++) {
      const r = lr[p];
      if (r > this.R + 0.5) { buf[p] = 0; continue; }
      const a = la[p];
      let c;
      if (r > this.R - 3) c = (a < -0.6 && a > -2.4) ? col.woodL : r > this.R - 1 ? col.woodD : col.wood;
      else if (r > 36) c = r > 39 ? col.trackL : col.track;
      else if (r > 34.5) c = col.gold;
      else if (r > 23) {
        let loc = (a - wa) / seg; loc = ((loc % 37) + 37) % 37;
        const i = Math.floor(loc), fr = loc - i;
        if (fr < 0.1) c = col.fret;
        else {
          const n = RL.WHEEL[i];
          const dark = r < 26;
          if (i === winIdx && blink) c = col.goldL;
          else c = n === 0 ? (dark ? col.greenD : col.green) : RL.RED.has(n) ? (dark ? col.redD : col.red) : (dark ? col.blackD : col.black);
        }
      } else if (r > 21.5) c = col.gold;
      else if (r > 9) {
        let q = ((a - wa) * 4 / Math.PI) % 1; if (q < 0) q += 1;
        c = q < 0.12 ? col.goldD : (r > 19 ? col.coneD : col.cone);
      } else if (r > 7) c = col.goldD;
      else {
        let q = ((a - wa) * 2 / Math.PI) % 1; if (q < 0) q += 1;
        c = (q < 0.2 && r > 2) ? col.goldD : r < 2.5 ? col.goldL : col.gold;
      }
      buf[p] = c;
    }
    this.wheelCv.getContext('2d').putImageData(this.img, 0, 0);
    ctx.drawImage(this.wheelCv, this.cx - this.R, this.cy - this.R);
    const b = this.ball;
    if (b) {
      const bx = this.cx + Math.cos(b.a) * b.r, by = this.cy + Math.sin(b.a) * b.r;
      circ(bx, by, 1, C.white); P(bx - 1, by - 1, C.white); P(bx + 1, by + 1, C.silver);
    }
  }

  drawCell(b, f) {
    const has = this.bets[b.spot];
    const hit = this.result !== null && RL.wins(b.spot, this.result) && this.resultT < 3;
    if (b.bg) R(b.x, b.y, b.w, b.h, b.bg);
    if (hit && Math.floor(this.resultT * 6) % 2 === 0) R(b.x, b.y, b.w, b.h, C.yellow);
    box(b.x, b.y, b.w + 1, b.h + 1, null, C.white);
    P(b.x, b.y, C.white); P(b.x + b.w, b.y + b.h, C.white);
    if (b.label === '◆') diamond(b.x + b.w / 2, b.y + 5, 3, b.spot === 'red' ? C.cherry : C.charcoal);
    else Font.draw(b.label, b.x + b.w / 2 + 1, b.y + Math.floor((b.h - 5) / 2), { c: hit ? C.ink : C.white, f: 's', a: 'c', sp: b.label.length > 3 ? 0 : 1 });
    if (has) chipStack(has, b.x + b.w / 2, b.y + b.h / 2 + 1, 4, 5);
    if (f) { box(b.x - 1, b.y - 1, b.w + 3, b.h + 3, null, C.yellow); if (Math.floor(this.t * 4) % 2) box(b.x - 2, b.y - 2, b.w + 5, b.h + 5, null, C.yellow); }
  }

  draw() {
    const tb = this.tb;
    R(0, 0, W, H, tb.felt);
    dither(0, 13, W, H - 13, tb.feltD, 1);
    R(0, 13, W, H - 13, tb.felt);
    for (let y = 16; y < H; y += 8) for (let x = (y % 16 ? 4 : 0); x < 100; x += 8) P(x, y, tb.feltD);
    // wheel bowl
    circ(this.cx + 2, this.cy + 3, this.R + 3, C.black);
    circ(this.cx, this.cy, this.R + 3, C.woodD);
    this.drawWheel();
    // result + history
    const ry = 118;
    if (this.result !== null) {
      const c = RL.color(this.result);
      const bg = c === 'red' ? C.red : c === 'black' ? C.ink : C.green;
      circ(30, ry + 10, 10, C.white); circ(30, ry + 10, 9, bg);
      Font.draw(String(this.result), 31, ry + 7, { c: C.white, a: 'c' });
      Font.draw(c.toUpperCase(), 44, ry + 4, { c: C.white, f: 's' });
      if (this.result) Font.draw(this.result % 2 ? 'ODD' : 'EVEN', 44, ry + 11, { c: C.lav, f: 's' });
    } else Font.draw(this.busy ? 'NO MORE BETS!' : 'PLACE YOUR BETS', 54, ry + 7, { c: C.lemon, f: 's', a: 'c' });
    // history strip
    Font.draw('LAST', 4, 146, { c: C.lemon, f: 's' });
    this.hist.forEach((n, i) => {
      const c = RL.color(n), x = 24 + i * 15, y = 144;
      box(x, y, 14, 10, c === 'red' ? C.red : c === 'black' ? C.ink : C.green, i === 0 ? C.yellow : C.white);
      Font.draw(String(n), x + 7, y + 3, { c: C.white, f: 's', a: 'c' });
    });
    // info
    Font.draw('BET ' + U.moneyShort(this.total()), 106, 144, { c: C.yellow });
    Font.draw('LIMIT ' + U.moneyShort(tb.max), 106, 156, { c: tb.feltL, f: 's' });
    Font.draw('NUMBER 35:1   DOZEN/COLUMN 2:1   OUTSIDE 1:1', 106, 167, { c: tb.feltL, f: 's' });
    this.ui.draw();
    this.drawTop();
    this.fx.draw();
    UI.drawPops(this, 1 / 60);
    this.drawMsg(152);
  }
}

GAMES.roulette = obj => new RouletteScene(obj);

// ---- js/games/poker.js
'use strict';
// =====================================================================
//  CASHINO - video poker, Jacks or Better (9/6 full pay).
//  Deal five, hold what you like, draw. Luck may improve the draw.
// =====================================================================

const VP_CFG = {
  penny: { name: 'POKER PAL', denoms: [25, 100] },
  main: { name: 'VIDEO POKER', denoms: [gems(1), gems(5), gems(25)] },
  high: { name: 'ROYAL POKER', denoms: [gems(100), gems(1000), gems(10000)] },
};

const VP = {
  HANDS: [
    ['ROYAL FLUSH', [250, 500, 750, 1000, 4000]],
    ['STRAIGHT FLUSH', [50, 100, 150, 200, 250]],
    ['4 OF A KIND', [25, 50, 75, 100, 125]],
    ['FULL HOUSE', [9, 18, 27, 36, 45]],
    ['FLUSH', [6, 12, 18, 24, 30]],
    ['STRAIGHT', [4, 8, 12, 16, 20]],
    ['3 OF A KIND', [3, 6, 9, 12, 15]],
    ['TWO PAIR', [2, 4, 6, 8, 10]],
    ['JACKS OR BETTER', [1, 2, 3, 4, 5]],
  ],
  // returns index into HANDS or -1
  evaluate(cards) {
    const rs = cards.map(c => c.r).sort((a, b) => a - b);
    const flush = cards.every(c => c.s === cards[0].s);
    const counts = {};
    for (const r of rs) counts[r] = (counts[r] || 0) + 1;
    const groups = Object.entries(counts).map(([r, n]) => [+r, n]).sort((a, b) => b[1] - a[1] || b[0] - a[0]);
    const uniq = groups.length === 5;
    let straight = false, royal = false;
    if (uniq) {
      if (rs[4] - rs[0] === 4) straight = true;
      if (rs[0] === 1 && rs[1] === 10 && rs[4] === 13) { straight = true; royal = true; }
    }
    if (straight && flush) return royal ? 0 : 1;
    if (groups[0][1] === 4) return 2;
    if (groups[0][1] === 3 && groups[1][1] === 2) return 3;
    if (flush) return 4;
    if (straight) return 5;
    if (groups[0][1] === 3) return 6;
    if (groups[0][1] === 2 && groups[1][1] === 2) return 7;
    if (groups[0][1] === 2 && (groups[0][0] >= 11 || groups[0][0] === 1)) return 8;
    return -1;
  },
  pay(idx, coins) { return idx < 0 ? 0 : this.HANDS[idx][1][coins - 1]; },
  // draw replacements for non-held cards from the rest of the deck
  draw(deck, hand, held) {
    const d = deck.slice();
    U.shuffle(d);
    let k = 0;
    return hand.map((c, i) => (held[i] ? c : d[k++]));
  },
};

class PokerScene extends GameScene {
  constructor(obj) {
    const cfg = VP_CFG[obj.cfg] || VP_CFG.main;
    super(obj, cfg.name);
    this.cfg = cfg;
    State.lastBet = State.lastBet || {};
    const saved = State.lastBet['vp:' + obj.cfg] || {};
    this.denom = cfg.denoms.includes(saved.denom) ? saved.denom : cfg.denoms[0];
    this.coins = saved.coins || 5;
    this.phase = 'deal'; // 'deal' (waiting to deal) | 'hold' | 'busy'
    this.cards = [];
    this.held = [false, false, false, false, false];
    this.result = -1; this.winAmt = 0;
    this.build();
  }

  canLeave() { return this.phase === 'deal'; }
  get bet() { return this.denom * this.coins; }

  build() {
    const g = this.ui;
    g.clear();
    this.cardBtns = [0, 1, 2, 3, 4].map(i => g.add({ x: 68 + i * 38, y: 78, w: 32, h: 44, i, draw: () => {}, onPress: () => this.toggle(i), silent: true, enabled: this.phase === 'hold' }));
    const hold = this.phase === 'hold';
    g.add({ x: 8, y: 156, w: 52, h: 15, label: 'BET ONE', font: 's', onPress: () => { this.coins = this.coins % 5 + 1; this.saveBet(); }, sound: 'coin', enabled: !hold });
    g.add({ x: 64, y: 156, w: 52, h: 15, label: 'BET MAX', font: 's', onPress: () => { this.coins = 5; this.saveBet(); this.deal(); }, enabled: !hold });
    g.add({ x: 120, y: 156, w: 60, h: 15, label: 'CREDIT ' + U.moneyShort(this.denom), font: 's', onPress: () => { const d = this.cfg.denoms; this.denom = d[(d.indexOf(this.denom) + 1) % d.length]; this.saveBet(); this.build(); }, enabled: !hold });
    this.mainBtn = g.add({ x: 236, y: 153, w: 78, h: 19, label: hold ? 'DRAW' : 'DEAL', style: 'red', onPress: () => (hold ? this.drawCards() : this.deal()) });
    g.focus = this.mainBtn;
  }
  saveBet() { State.lastBet['vp:' + this.obj.cfg] = { denom: this.denom, coins: this.coins }; }

  toggle(i) {
    if (this.phase !== 'hold') return;
    this.held[i] = !this.held[i];
    Snd.play(this.held[i] ? 'blip' : 'move');
  }

  async deal() {
    if (this.phase !== 'deal') return;
    if (State.money < this.bet) { Snd.play('error'); this.say('NOT ENOUGH GEMS - LOWER THE BET', C.cherry); return; }
    State.take(this.bet);
    this.phase = 'busy'; this.build();
    this.result = -1; this.winAmt = 0;
    this.deck = Cards.deck(1);
    const hand = this.deck.splice(0, 5);
    this.held = [false, false, false, false, false];
    this.cards = hand.map((c, i) => new TableCard(c, 68 + i * 38, 78, false, 'l'));
    for (const tc of this.cards) { await tc.flip(this.tl, 0.14); if (this.dead) return; }
    this.result = VP.evaluate(hand);
    this.phase = 'hold'; this.build();
    this.ui.focus = this.cardBtns[0];
  }

  async drawCards() {
    if (this.phase !== 'hold') return;
    this.phase = 'busy'; this.build();
    const hand = this.cards.map(c => c.c), held = this.held.slice(), coins = this.coins;
    const final = Luck.pick(() => VP.draw(this.deck, hand, held), h => VP.pay(VP.evaluate(h), coins));
    for (let i = 0; i < 5; i++) {
      if (held[i]) continue;
      const tc = this.cards[i];
      await tc.flip(this.tl, 0.12);
      tc.c = final[i];
      await tc.flip(this.tl, 0.14);
      if (this.dead) return;
    }
    this.result = VP.evaluate(final);
    const pay = VP.pay(this.result, coins) * this.denom;
    this.winAmt = this.finish('poker', this.bet, pay, 160, 100, { jackpot: this.result === 0 });
    if (pay > 0) this.flashT = 2;
    this.phase = 'deal'; this.build();
  }

  update(dt) {
    if (super.update(dt)) return;
    if (this.phase === 'hold') for (const ch of Input.typed) if ('12345'.includes(ch)) this.toggle(+ch - 1);
    if (this.phase === 'deal' && Input.repeat('up')) { this.coins = Math.min(5, this.coins + 1); Snd.play('coin'); this.saveBet(); }
    if (this.phase === 'deal' && Input.repeat('down')) { this.coins = Math.max(1, this.coins - 1); Snd.play('move'); this.saveBet(); }
    this.flashT = Math.max(0, (this.flashT || 0) - dt);
    this.ui.update(dt);
  }

  draw() {
    R(0, 0, W, H, C.navy);
    dither(0, 13, W, H, C.cobalt, 0);
    R(0, 13, W, H - 13, C.navy);
    // pay table
    const px = 12, py = 16, cw = 36;
    R(px - 2, py - 2, 300, 9 * 7 + 4, C.cobalt);
    R(px + 102 + (this.coins - 1) * cw, py - 2, cw - 2, 9 * 7 + 4, C.crimson);
    VP.HANDS.forEach(([name, pays], i) => {
      const y = py + i * 7;
      const hit = this.result === i && (this.phase !== 'deal' || this.winAmt > 0);
      const c = hit ? (Math.floor(this.t * 6) % 2 ? C.white : C.yellow) : C.yellow;
      Font.draw(name, px, y, { c, f: 's' });
      pays.forEach((p, k) => Font.draw(String(p), px + 102 + k * cw + cw - 6, y, { c: k === this.coins - 1 ? C.white : c, f: 's', a: 'r' }));
    });
    // cards
    if (!this.cards.length) {
      for (let i = 0; i < 5; i++) spr(Spr.cardBack('l', C.cobalt), 68 + i * 38, 78);
    }
    this.cards.forEach((c, i) => {
      const f = this.ui.focus === this.cardBtns[i] && this.phase === 'hold';
      c.draw(0, this.held[i] ? -3 : 0);
      if (f) box(c.x - 2, 76 + (this.held[i] ? -3 : 0), 36, 48, null, Math.floor(this.t * 4) % 2 ? C.yellow : C.white);
      if (this.held[i]) Font.draw('HELD', c.x + 16, 126, { c: C.yellow, a: 'c', ol: C.ink });
      else if (this.phase === 'hold') Font.draw(String(i + 1), c.x + 16, 127, { c: C.sky, f: 's', a: 'c' });
    });
    // status line
    const name = this.result >= 0 ? VP.HANDS[this.result][0] : '';
    if (this.phase === 'hold') Font.draw(name ? name + '!' : 'CHOOSE CARDS TO HOLD', W / 2, 136, { c: name ? C.lime : C.white, a: 'c' });
    else if (this.phase === 'deal' && this.cards.length) Font.draw(this.winAmt > 0 ? name + '  WIN ' + U.money(this.winAmt) : 'GAME OVER', W / 2, 136, { c: this.winAmt > 0 ? C.yellow : C.cherry, a: 'c', ol: C.ink });
    else if (this.phase === 'deal') Font.draw('PRESS DEAL', W / 2, 136, { c: C.white, a: 'c' });
    Font.draw('BET ' + this.coins + ' x ' + U.moneyShort(this.denom) + ' = ' + U.moneyShort(this.bet), 208, 145, { c: C.lemon, f: 's', a: 'c' });
    this.ui.draw();
    this.drawTop();
    this.fx.draw();
    UI.drawPops(this, 1 / 60);
    this.drawMsg(128);
  }
}

GAMES.poker = obj => new PokerScene(obj);
GAME_INFO.poker = cfg => { const c = VP_CFG[cfg] || VP_CFG.main; return { name: c.name, limits: U.moneyShort(c.denoms[0]) + '-' + U.moneyShort(c.denoms[c.denoms.length - 1] * 5) }; };

// ---- js/games/plinko.js
'use strict';
// =====================================================================
//  CASHINO - plinko. Drop balls down a peg triangle; they land in
//  multiplier slots. Paths are binomial; luck can re-roll a path.
// =====================================================================

const PLINKO_CFG = {
  jr: { name: 'PLINKO JR', min: 10, max: gems(10), rows: 10 },
  main: { name: 'PLINKO', min: gems(1), max: gems(250), rows: 12 },
  gold: { name: 'PLINKO GOLD', min: gems(100), max: gems(50000), rows: 12 },
  diamond: { name: 'DIAMOND PLINKO', min: gems(10000), max: gems(20000000), rows: 12 },
};
const PLINKO_MULTS = {
  10: {
    LOW: [8.5, 3, 1.4, 1.1, 1, 0.5, 1, 1.1, 1.4, 3, 8.5],
    MED: [21, 5, 2, 1.3, 0.6, 0.4, 0.6, 1.3, 2, 5, 21],
    HIGH: [72, 10, 3, 0.9, 0.3, 0.2, 0.3, 0.9, 3, 10, 72],
  },
  12: {
    LOW: [10, 3, 1.6, 1.3, 1.1, 1, 0.5, 1, 1.1, 1.3, 1.6, 3, 10],
    MED: [32, 11, 4, 2, 1.1, 0.6, 0.3, 0.6, 1.1, 2, 4, 11, 32],
    HIGH: [160, 24, 8, 2, 0.7, 0.2, 0.2, 0.2, 0.7, 2, 8, 24, 160],
  },
};

const PlinkoMath = {
  path(rows) { const p = []; for (let i = 0; i < rows; i++) p.push(U.rand() < 0.5 ? 1 : 0); return p; },
  slot(path) { return path.reduce((a, b) => a + b, 0); },
};

class PlinkoScene extends GameScene {
  constructor(obj) {
    const cfg = PLINKO_CFG[obj.cfg] || PLINKO_CFG.main;
    super(obj, cfg.name);
    this.cfg = cfg;
    this.rows = cfg.rows;
    State.lastBet = State.lastBet || {};
    this.risk = State.lastBet['plinko-risk:' + obj.cfg] || 'MED';
    this.bp = new BetPicker('plinko:' + obj.cfg, cfg.min, cfg.max);
    this.bp.fit();
    this.balls = [];
    this.hist = [];
    this.pegFlash = new Map();
    this.slotBump = new Array(this.rows + 1).fill(0);
    this.sx = this.rows === 10 ? 13 : 11; this.sy = this.rows === 10 ? 11 : 9;
    this.cx = 160; this.top = 28;
    this.holdT = 0;
    this.build();
  }
  get mults() { return PLINKO_MULTS[this.rows][this.risk]; }
  canLeave() { return this.balls.length === 0; }

  build() {
    const g = this.ui;
    g.clear();
    this.bet = addBetButtons(this, this.bp, 4, 36);
    ['LOW', 'MED', 'HIGH'].forEach((r, i) => g.add({ x: 4 + i * 26, y: 66, w: 24, h: 13, label: r, font: 's', style: this.risk === r ? 'gold' : 'std', onPress: () => this.setRisk(r), sound: 'move' }));
    this.dropBtn = g.add({ x: 4, y: 88, w: 76, h: 22, label: 'DROP!', style: 'red', onPress: () => this.drop(), silent: true });
    g.add({ x: 4, y: 114, w: 76, h: 13, label: 'DROP 5', font: 's', onPress: () => { for (let i = 0; i < 5; i++) this.tl.after(i * 0.12, () => this.drop()); }, silent: true });
    g.focus = this.dropBtn;
  }
  setRisk(r) {
    if (this.balls.length) { Snd.play('error'); this.say('WAIT FOR THE BALLS TO LAND', C.cherry); return; }
    this.risk = r; State.lastBet['plinko-risk:' + this.obj.cfg] = r; this.build(); this.ui.focus = this.ui.items.find(b => b.label === r);
  }

  pegPos(row, j) { return { x: this.cx + (j - (row + 2) / 2) * this.sx, y: this.top + row * this.sy }; }
  slotX(k) { return this.cx + (k - this.rows / 2) * this.sx; }

  drop() {
    const bet = this.bp.value;
    if (State.money < bet) { Snd.play('error'); this.say(State.money < this.cfg.min ? 'NOT ENOUGH GEMS' : 'LOWER YOUR BET', C.cherry); this.bp.fit(); return; }
    if (this.balls.length >= 14) return;
    State.take(bet);
    const mults = this.mults;
    const path = Luck.pick(() => PlinkoMath.path(this.rows), p => mults[PlinkoMath.slot(p)]);
    this.balls.push({ path, bet, mults, seg: -1, t: 0, x: this.cx + U.range(-1, 1), y: this.top - 14, off: 0, c: U.pick([C.yellow, C.pink, C.cyan, C.lime, C.tang]) });
    Snd.play('blip');
  }

  update(dt) {
    if (super.update(dt)) return;
    // hold to keep dropping
    if (Input.isDown('a') && this.ui.focus === this.dropBtn) { this.holdT += dt; if (this.holdT > 0.35) { this.holdT = 0.2; this.drop(); } } else this.holdT = 0;
    if (Input.repeat('up')) { this.bp.up(); Snd.play('move'); }
    if (Input.repeat('down')) { this.bp.down(); Snd.play('move'); }
    for (const [k, v] of this.pegFlash) { if (v - dt <= 0) this.pegFlash.delete(k); else this.pegFlash.set(k, v - dt); }
    for (let i = 0; i < this.slotBump.length; i++) this.slotBump[i] = Math.max(0, this.slotBump[i] - dt * 4);
    const segT = 0.14;
    for (const b of this.balls) {
      b.t += dt;
      if (b.seg === -1) {
        // falling onto the first peg
        const k = Math.min(1, b.t / 0.22);
        b.y = this.top - 14 + 11 * Ease.inQuad(k);
        if (k >= 1) { b.seg = 0; b.t = 0; this.hitPeg(b, 0); }
        continue;
      }
      if (b.seg < this.rows) {
        const k = Math.min(1, b.t / segT);
        const from = b.off, to = b.off + (b.path[b.seg] ? 1 : -1);
        const x0 = this.cx + from * this.sx / 2, x1 = this.cx + to * this.sx / 2;
        const y0 = this.top + b.seg * this.sy - 3, y1 = this.top + (b.seg + 1) * this.sy - 3;
        b.x = U.lerp(x0, x1, k);
        b.y = U.lerp(y0, y1, k) - Math.sin(k * Math.PI) * 4;
        if (k >= 1) {
          b.off = to; b.seg++; b.t = 0;
          if (b.seg < this.rows) this.hitPeg(b, b.seg);
        }
      } else {
        // drop into the slot
        const k = Math.min(1, b.t / 0.12);
        b.y = this.top + this.rows * this.sy - 3 + k * 8;
        if (k >= 1 && !b.done) { b.done = true; this.land(b); }
      }
    }
    this.balls = this.balls.filter(b => !b.done);
    this.ui.update(dt);
  }

  hitPeg(b, row) {
    const j = Math.round(b.off / 2 + (row + 2) / 2);
    this.pegFlash.set(row + ':' + j, 0.25);
    Snd.play('peg', row);
  }

  land(b) {
    const k = PlinkoMath.slot(b.path);
    const m = b.mults[k];
    this.slotBump[k] = 1;
    this.hist.unshift(m); if (this.hist.length > 12) this.hist.pop();
    const pay = Math.round(b.bet * m);
    const x = this.slotX(k), y = this.top + this.rows * this.sy + 8;
    if (m >= 10) this.finish('plinko', b.bet, pay, x, y, { jackpot: m >= 100 });
    else {
      const paid = State.boost(pay, b.bet, this.key);
      State.give(paid);
      State.settle('plinko', b.bet, paid);
      if (paid > b.bet) { Snd.play('winSmall'); this.fx.text('+' + U.moneyShort(paid), x, y - 10, C.lemon, { f: 's' }); this.fx.fly(x, y, 250, 5, 2); }
      else Snd.play('ping', 300 + m * 300);
    }
  }

  multColor(m) { return m >= 100 ? C.red : m >= 10 ? C.orange : m >= 3 ? C.tang : m >= 1.2 ? C.yellow : m >= 1 ? C.lime : C.sky; }

  draw() {
    // background
    R(0, 0, W, H, C.night);
    for (let i = 0; i < 20; i++) { alpha(0.1); circ((i * 67) % W, 30 + (i * 41) % 150, 4 + i % 5, [C.pink, C.cyan, C.yellow, C.lilac][i % 4]); alpha(1); }
    // board
    const bw = (this.rows + 3) * this.sx;
    box(this.cx - bw / 2 - 6, this.top - 18, bw + 12, this.rows * this.sy + 36, C.ink, C.violet);
    for (let row = 0; row < this.rows; row++) {
      for (let j = 0; j < row + 3; j++) {
        const p = this.pegPos(row, j);
        const f = this.pegFlash.get(row + ':' + j);
        if (f) { circ(p.x, p.y, 2, C.yellow); } else { circ(p.x, p.y, 1, C.silver); P(p.x - 1, p.y - 1, C.white); }
      }
    }
    // slots
    const mults = this.mults, sy = this.top + this.rows * this.sy + 4;
    mults.forEach((m, k) => {
      const x = this.slotX(k), bump = this.slotBump[k];
      const y = sy + Math.round(bump * 3);
      const c = this.multColor(m);
      R(x - this.sx / 2 + 1, y, this.sx - 2, 12, bump > 0.5 ? C.white : c);
      R(x - this.sx / 2 + 1, y + 11, this.sx - 2, 1, C.ink);
      const lab = String(m).replace(/^0\./, '.');
      Font.draw(lab, x + (lab.length > 2 ? 1 : 0), y + 4, { c: C.ink, f: 's', a: 'c', sp: lab.length > 3 ? 0 : 1 });
    });
    // balls
    for (const b of this.balls) { circ(b.x, b.y, 2, b.c); P(b.x - 1, b.y - 1, C.white); }
    // left panel
    Font.draw(this.cfg.name, 42, 17, { c: C.lemon, f: 's', a: 'c' });
    Font.draw('RISK', 42, 58, { c: C.gray, f: 's', a: 'c' });
    Font.draw('HOLD Z TO', 42, 132, { c: C.slate, f: 's', a: 'c' });
    Font.draw('KEEP DROPPING', 42, 139, { c: C.slate, f: 's', a: 'c' });
    Font.draw('LUCK ' + Luck.level() + '%', 42, 152, { c: C.lime, f: 's', a: 'c' });
    // right panel: history
    Font.draw('LAST', 282, 17, { c: C.gray, f: 's', a: 'c' });
    this.hist.forEach((m, i) => { const c = this.multColor(m); box(262, 24 + i * 11, 40, 10, C.ink, c); Font.draw(m + 'x', 282, 27 + i * 11, { c, f: 's', a: 'c' }); });
    this.bet.draw();
    this.ui.draw();
    this.drawTop();
    this.fx.draw();
    UI.drawPops(this, 1 / 60);
    this.drawMsg(160);
  }
}
