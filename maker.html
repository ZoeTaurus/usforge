<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maker · UsForge</title>
<meta name="description" content="A Lazy Studios maker and their games on UsForge.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='4' y='4' width='8' height='8' rx='1.5' fill='%234d8cf7' transform='rotate(45 8 8)'/%3E%3C/svg%3E">
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0a0c11"><link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800;900&family=Geist+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="style.css?v=37">
<script>/* THEME_BOOT */try{var m=localStorage.getItem('usforge-theme')||'auto',h=new Date().getHours();document.documentElement.dataset.theme=m==='auto'?(h>=7&&h<19?'light':'dark'):m}catch(e){}</script>
<script src="site.js?v=30"></script>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="mark" href="./"><span class="spark"></span>UsForge</a>
    <nav><a href="./">Games</a><a href="add.html">Share your game</a><a href="upload.html">Upload</a><a href="credits.html">Credits</a><a class="nav-support" href="support.html" data-support hidden>Support ♥</a><span data-theme-switch></span></nav>
  </header>

  <section class="maker-hero" id="hero"></section>

  <section class="shelf" id="topShelf" hidden>
    <div class="shelf-head"><h2 id="gamesTitle">Games</h2><span class="shelf-note" id="gamesNote"></span></div>
    <div class="grid" id="games"></div>
  </section>

  <section class="devsec" id="devShelf" hidden>
    <div class="devsec-head"><h2><span class="spark" aria-hidden="true"></span>In development</h2></div>
    <div class="grid" id="dev"></div>
  </section>

  <section class="crew">
    <div class="shelf-head"><h2>The rest of the crew</h2><a class="shelf-note" href="credits.html">Credits →</a></div>
    <div class="crew-row" id="crew"></div>
  </section>

  <footer class="foot">
    <span>UsForge · by Lazy Studios</span>
    <a href="./">Back to the games →</a>
  </footer>
</div>

<script src="embers.js?v=20"></script>
<script src="eggs.js?v=20"></script>
<script>
(() => {
  const $ = id => document.getElementById(id), U = window.UsForge;
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const hue = s => [...s].reduce((h, c) => (h * 31 + c.charCodeAt(0)) % 360, 7);
  const n = (v, one, many) => `${v.toLocaleString()} ${v === 1 ? one : many}`;

  const want = (new URLSearchParams(location.search).get('n') || '').toLowerCase();
  let games = [], stats = null, profiles = {};
  const prof = name => profiles[Object.keys(profiles).find(k => k.toLowerCase() === String(name).toLowerCase())] || {};
  const avatar = (name, cls = 'initial', extra = '') => { const e = prof(name).emoji; return `<span class="${cls}${e ? ' emoji' : ''}"${extra} aria-hidden="true">${esc(e || name[0])}</span>`; };
  const cover = g => g.cover ? `<img src="${esc(g.cover)}" alt="" loading="lazy">` : `<div class="blank" style="--h:${hue(g.title)}">${esc(g.title.split(/\s+/).slice(0, 2).map(w => w[0]).join('').toUpperCase())}</div>`;
  const P = g => stats?.plays[g.slug] || 0, S = g => stats?.stokes[g.slug] || 0;
  const card = (g, i) => `<article class="gcard${g.dev ? ' devcard' : ''}" style="--i:${i}">
      <a class="card tilt" data-cover href="play.html?g=${encodeURIComponent(g.slug)}"><div class="cover${g.pixel ? ' pixel' : ''}">${cover(g)}${g.dev ? `<span class="tag dev">${g.build ? 'Early build' : 'Coming soon'}</span>` : `<span class="tag live-tag" data-live="${esc(g.slug)}" hidden></span>`}<span class="glint" aria-hidden="true"></span></div></a>
      <div class="meta"><b>${esc(g.title)}</b>
        ${stats && !g.dev ? `<span class="counts"><span>▶ ${P(g).toLocaleString()}</span><span class="${U.stoked(g.slug) ? 'is-mine' : ''}">${U.FLAME} ${S(g).toLocaleString()}</span></span>` : ''}
</div>
    </article>`;

  function paint() {
    const known = U.TEAM.find(p => p.name.toLowerCase() === want);
    const mine = games.filter(g => g.author.toLowerCase() === want);
    const person = known || (mine.length ? { name: mine[0].author, roles: ['Maker'] } : null);
    if (!person) { $('hero').innerHTML = `<div><h1>Who’s that?</h1><p class="maker-quote">There’s no maker by that name. <a href="credits.html">See the crew</a>.</p></div>`; return; }
    document.title = `${person.name} · UsForge`;
    const done = mine.filter(g => !g.dev), dev = mine.filter(g => g.dev);
    const plays = done.reduce((t, g) => t + P(g), 0), stokes = done.reduce((t, g) => t + S(g), 0);
    const best = stats && done.length > 1 ? [...done].sort((a, b) => P(b) - P(a))[0] : null;
    const first = done.length ? Math.min(...done.map(g => g.added || Infinity)) : 0;
    $('hero').innerHTML = `
      ${avatar(person.name)}
      <div>
        <span class="eyebrow">Lazy Studios</span>
        <h1>${esc(person.name)}</h1>
        <div class="roles">${person.roles.map((r, i) => `<span class="role${i < (person.lead || 0) ? ' lead' : ''}"${r === 'Potato' ? ' data-potato title="Click me" style="cursor:pointer"' : ''}>${esc(r)}</span>`).join('')}</div>
        <div class="stats">
          <div class="stat"><b>${done.length}</b><span>${done.length === 1 ? 'Game' : 'Games'}</span></div>
          ${stats ? `<div class="stat"><b>${plays.toLocaleString()}</b><span>Plays</span></div><div class="stat"><b>${stokes.toLocaleString()}</b><span>Stokes</span></div>` : ''}
          ${dev.length ? `<div class="stat"><b>${dev.length}</b><span>In development</span></div>` : ''}
        </div>
        ${prof(person.name).bio ? `<p class="maker-bio">${esc(prof(person.name).bio)}</p>` : ''}
        ${prof(person.name).fav && games.find(g => g.slug === prof(person.name).fav) ? `<p class="maker-quote">Favorite game on UsForge: <a href="play.html?g=${encodeURIComponent(prof(person.name).fav)}">${esc(games.find(g => g.slug === prof(person.name).fav).title)}</a></p>` : ''}
        ${best && P(best) ? `<p class="maker-quote">Most played: <a href="play.html?g=${encodeURIComponent(best.slug)}">${esc(best.title)}</a> (${n(P(best), 'play', 'plays')}).</p>` : ''}
        ${!done.length && !dev.length ? `<p class="maker-quote">No games on UsForge yet. The first one is coming soon.</p>` : ''}
      </div>`;
    $('topShelf').hidden = !done.length;
    $('gamesTitle').textContent = `${person.name}’s games`;
    $('gamesNote').textContent = first && isFinite(first) ? `first one added ${new Date(first * 1000).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' })}` : '';
    $('games').innerHTML = done.map(card).join('');
    U.paintLive();
    $('devShelf').hidden = !dev.length;
    $('dev').innerHTML = dev.map(card).join('');
    $('crew').innerHTML = U.TEAM.filter(p => p !== known).map(p => {
      const theirs = games.filter(g => g.author.toLowerCase() === p.name.toLowerCase()), c = theirs.filter(g => !g.dev).length, d = theirs.length - c;
      return `<a class="crew-card tilt" href="maker.html?n=${encodeURIComponent(p.name)}">${avatar(p.name)}<span class="crew-name">${esc(p.name)}</span><span class="crew-role">${esc(p.roles[0])}</span><span class="crew-n">${n(c, 'game', 'games')}${d ? ` · ${d} in dev` : ''}</span></a>`;
    }).join('');
  }
  const gamesP = fetch('games.json', { cache: 'no-cache' }).then(r => r.json()).catch(() => []);
  gamesP.then(l => { games = l; paint(); });
  Promise.all([gamesP, U.stats()]).then(([, s]) => { if (s) { stats = s; paint(); } });
  Promise.all([gamesP, fetch('profiles.json', { cache: 'no-cache' }).then(r => r.ok ? r.json() : {}).catch(() => ({}))]).then(([, p]) => { profiles = p || {}; paint(); });
})();
</script>
</body>
</html>
