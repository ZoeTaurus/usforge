<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Snack Squad Showdown</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Pixelify+Sans:wght@500;600;700&display=swap">
<style>
:root{--bg:#05080d;--card:#0a1420;--ink:#cdeeff;--accent:#00e5ff;--accent2:#2979ff;--danger:#ff3860;--line:#123a52;--sky1:#001d3d;--sky2:#003566;--ground:#062138}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#05080d;--card:#0a1420;--ink:#cdeeff;--line:#123a52;--sky1:#001d3d;--sky2:#003566;--ground:#062138}}
:root[data-theme="dark"]{--bg:#05080d;--card:#0a1420;--ink:#cdeeff;--line:#123a52;--sky1:#001d3d;--sky2:#003566;--ground:#062138}
*{box-sizing:border-box}
@keyframes bgShift{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-14px) rotate(4deg)}}
@keyframes popIn{from{transform:scale(0.6);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes drift1{0%,100%{transform:translate(-5%,-5%) scale(1)}50%{transform:translate(14%,10%) scale(1.3)}}
@keyframes drift2{0%,100%{transform:translate(8%,4%) scale(1.15)}50%{transform:translate(-14%,-10%) scale(0.85)}}
@keyframes drift3{0%,100%{transform:translate(0,10%) scale(1)}50%{transform:translate(-10%,-14%) scale(1.35)}}
@keyframes hueSpin{0%{filter:blur(55px) hue-rotate(0deg) saturate(1.3)}50%{filter:blur(55px) hue-rotate(180deg) saturate(1.6)}100%{filter:blur(55px) hue-rotate(360deg) saturate(1.3)}}
@keyframes twinkle{0%,100%{opacity:0.15}50%{opacity:0.6}}
html{background:#000308}
body{margin:0;color:var(--ink);font-family:'Fredoka','Segoe UI',system-ui,sans-serif;min-height:100vh;display:flex;justify-content:center;padding:16px;
  position:relative;overflow-x:hidden;isolation:isolate;
  text-shadow:-1.5px -1.5px 0 #000,1.5px -1.5px 0 #000,-1.5px 1.5px 0 #000,1.5px 1.5px 0 #000,0 0 2px #000;
  background:linear-gradient(120deg,#000308,#001d3d,#00293d,#000814,#001d3d);background-size:400% 400%;animation:bgShift 16s ease infinite}
.bgfx{position:fixed;inset:-15%;z-index:-2;overflow:hidden;animation:hueSpin 22s ease-in-out infinite;pointer-events:none}
.bgfx i{position:absolute;border-radius:50%;opacity:0.55}
.bgfx .b1{width:42vw;height:42vw;top:-12%;left:-10%;background:#00e5ff;animation:drift1 13s ease-in-out infinite}
.bgfx .b2{width:36vw;height:36vw;top:5%;right:-14%;background:#2979ff;animation:drift2 16s ease-in-out infinite}
.bgfx .b3{width:44vw;height:44vw;bottom:-18%;left:18%;background:#00b4d8;animation:drift3 19s ease-in-out infinite}
.bgfx .b4{width:32vw;height:32vw;bottom:-12%;right:2%;background:#0466c8;animation:drift1 21s ease-in-out infinite reverse}
.bgfx .b5{width:28vw;height:28vw;top:32%;left:38%;background:#48cae4;animation:drift2 15s ease-in-out infinite reverse}
.bgfx .b6{width:24vw;height:24vw;top:60%;right:28%;background:#0096c7;animation:drift3 17s ease-in-out infinite reverse}
.sparkle{position:fixed;inset:0;z-index:-1;pointer-events:none;
  background-image:radial-gradient(#7fdfff 1px,transparent 1.5px),radial-gradient(#7fdfff 1px,transparent 1.5px),radial-gradient(#7fdfff 1.5px,transparent 2px);
  background-size:120px 120px,180px 180px,240px 240px;background-position:0 0,60px 90px,30px 150px;animation:twinkle 3.5s ease-in-out infinite}
#app{width:100%;max-width:960px;position:relative;z-index:1}
h1{text-align:center;font-size:1.35em;margin:6px 0 14px;letter-spacing:0.5px;color:var(--ink);text-shadow:0 0 10px #00e5ff88,-1.5px -1.5px 0 #000,1.5px -1.5px 0 #000,-1.5px 1.5px 0 #000,1.5px 1.5px 0 #000}
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px;margin-bottom:10px;box-shadow:0 0 22px #00e5ff22,0 10px 26px #0007;animation:popIn 0.35s ease}
.charRow{display:flex;flex-wrap:wrap;gap:8px}
.charBtn{flex:1 1 28%;min-width:96px;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:8px 4px;text-align:center;cursor:pointer;font-size:0.74em;color:var(--ink);
  transition:transform .15s ease,box-shadow .15s ease,border-color .15s ease}
.charBtn:hover{border-color:var(--accent-c,var(--accent));transform:translateY(-4px) scale(1.04);box-shadow:0 0 18px #00e5ff55,0 10px 16px #0005}
.prev{image-rendering:pixelated;width:56px;height:56px;filter:drop-shadow(0 3px 3px #0005)}
button.act{padding:13px;border:none;border-radius:14px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#000814;font-weight:700;cursor:pointer;font-size:1em;width:100%;
  box-shadow:0 5px 0 #023e8a,0 0 20px #00e5ff55,0 8px 14px #0006;transition:transform .1s,box-shadow .1s;font-family:inherit}
button.act:active{transform:translateY(3px);box-shadow:0 2px 0 #023e8a}
.center{text-align:center}
.gold{color:var(--accent);font-weight:700;text-shadow:0 0 6px #00e5ff66,-1.5px -1.5px 0 #000,1.5px -1.5px 0 #000,-1.5px 1.5px 0 #000,1.5px 1.5px 0 #000}
.vowTimerWrap{background:#00142099;border-radius:8px;height:12px;overflow:hidden;margin-top:10px;border:1px solid #00e5ff44}
.vowTimerBar{height:100%;background:linear-gradient(90deg,#00e5ff,#ff1744);transition:width 1s linear}
.vowRow{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;margin-top:4px}
.vowCard{flex:1 1 26%;min-width:180px;background:linear-gradient(160deg,#0d1b2e,#06101c);border:3px solid #00e5ff;border-radius:22px;padding:22px 14px;text-align:center;cursor:pointer;
  box-shadow:0 0 26px #00e5ff44,0 10px 22px #0009;transition:transform .15s ease,box-shadow .15s ease,border-color .15s ease;position:relative;overflow:hidden;animation:popIn .35s ease}
.vowCard::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 50% -10%,#00e5ff33,transparent 65%);pointer-events:none}
.vowCard:hover{transform:translateY(-8px) scale(1.04);box-shadow:0 0 40px #ff174477,0 16px 26px #000b;border-color:#ff1744}
.vowIcon{font-size:2.8em;margin-bottom:8px;filter:drop-shadow(0 0 10px #00e5ff88)}
.vowName{font-weight:700;font-size:1.2em;margin-bottom:12px;color:#cdeeff}
.vowPro{color:#4dffb0;font-weight:700;margin-bottom:6px;font-size:0.95em}
.vowCon{color:#ff5252;font-weight:700;font-size:0.95em}
.gfx-simple .bgfx,.gfx-simple .sparkle{display:none!important}
.gfx-simple{background:var(--bg)!important;animation:none!important}
.gfx-simple .card,.gfx-simple .charBtn,.gfx-simple .vowCard,.gfx-simple .gfxCard{box-shadow:none!important;animation:none!important;transition:none!important}
.gfx-simple h1{text-shadow:none!important}
.gfx-simple button.act,.gfx-simple button.small{box-shadow:none!important}
.gfx-epic{animation-duration:6s!important}
.gfx-epic .bgfx{opacity:1;animation-duration:9s!important;filter:blur(45px) saturate(1.8)!important}
.gfx-epic .sparkle{animation-duration:1.6s!important;opacity:1}
.gfx-epic .card,.gfx-epic .vowCard,.gfx-epic .gfxCard.active{box-shadow:0 0 44px #00e5ff77,0 14px 30px #000c!important}
.gfx-epic h1{text-shadow:0 0 18px #00e5ffcc,0 2px 0 var(--line)!important}
.gfx-epic button.act{box-shadow:0 5px 0 #023e8a,0 0 34px #00e5ffaa,0 8px 14px #0006!important}
.gfxCard{flex:1 1 26%;min-width:170px;background:linear-gradient(160deg,#0d1b2e,#06101c);border:3px solid #00e5ff;border-radius:20px;padding:20px 12px;text-align:center;cursor:pointer;
  box-shadow:0 0 22px #00e5ff33;transition:transform .15s,box-shadow .15s}
.gfxCard:hover{transform:translateY(-6px) scale(1.03);box-shadow:0 0 32px #00e5ff77}
.gfxCard.active{border-color:#4dffb0;box-shadow:0 0 30px #4dffb077}
.gfxIcon{font-size:2.4em;margin-bottom:8px}
canvas#cv{width:100%;background:linear-gradient(var(--sky1),var(--sky2));border-radius:14px;display:block;touch-action:none;cursor:crosshair;image-rendering:pixelated;box-shadow:inset 0 0 0 3px #00e5ff33,0 0 24px #00e5ff33,0 6px 16px #0007}
.hud{display:flex;justify-content:space-between;font-size:0.9em;margin-bottom:4px;font-weight:600;color:var(--ink)}
.upgRow{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);color:var(--ink)}
.upgRow:last-child{border-bottom:none}
button.small{padding:7px 14px;border:none;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#000814;cursor:pointer;font-size:0.85em;font-weight:600;font-family:inherit;box-shadow:0 3px 0 #023e8a}
.hint{font-size:0.72em;text-align:center;opacity:0.85;margin-top:6px;color:var(--ink)}
.floats{position:relative;height:64px;margin-bottom:-10px}
.floats span{position:absolute;font-size:2em;animation:floaty 3.4s ease-in-out infinite}
.outline-text{text-shadow:-1.5px -1.5px 0 #000,1.5px -1.5px 0 #000,-1.5px 1.5px 0 #000,1.5px 1.5px 0 #000,0 0 3px #000}
#battleWrap{position:relative}
.fsbtn{position:absolute;top:10px;right:10px;z-index:5;width:34px;height:34px;border:none;border-radius:8px;background:#00e5ff33;color:#cdeeff;font-size:1.1em;cursor:pointer;line-height:1;border:1px solid #00e5ff55}
.chatBtn{position:absolute;top:10px;right:52px;z-index:20;width:34px;height:34px;border:none;border-radius:8px;background:#00e5ff33;color:#cdeeff;font-size:1.1em;cursor:pointer;line-height:1;border:1px solid #00e5ff55}
.pauseBtn{position:absolute;top:10px;right:94px;z-index:5;width:34px;height:34px;border:none;border-radius:8px;background:#00e5ff33;color:#cdeeff;font-size:1.1em;cursor:pointer;line-height:1;border:1px solid #00e5ff55}
.pauseOverlay{display:none;position:absolute;inset:0;z-index:15;background:#000c;flex-direction:column;align-items:center;justify-content:center;border-radius:14px}
.pauseBox{background:#0a1420;border:2px solid #00e5ff;border-radius:16px;padding:24px 28px;text-align:center;box-shadow:0 0 30px #00e5ff55;min-width:220px}
.pauseBox h2{margin:0 0 14px;color:#cdeeff}
.chatPanel{display:none;flex-direction:column;position:absolute;top:52px;right:10px;z-index:20;width:240px;max-width:70vw;height:260px;background:#050b12ee;border:2px solid #00e5ff55;border-radius:12px;overflow:hidden;box-shadow:0 8px 24px #000a}
.chatMessages{flex:1;overflow-y:auto;padding:8px;font-size:0.78em;display:flex;flex-direction:column;gap:4px}
.chatMsg{padding:4px 7px;border-radius:8px;background:#0a1420;word-break:break-word}
.chatMsg.sys{background:#1a0d0d;color:#ffd54f}
.chatInputRow{display:flex;border-top:1px solid #00e5ff33}
.chatInputRow input{flex:1;background:#0a1420;border:none;color:#cdeeff;padding:8px;font-size:0.8em;font-family:inherit;outline:none}
.chatInputRow button{border:none;background:#00e5ff;color:#000814;padding:0 12px;cursor:pointer;font-weight:700}
#battleWrap:fullscreen{background:#000308;display:flex;flex-direction:column;justify-content:center;align-items:stretch;border-radius:0;max-width:100vw;padding:20px}
#battleWrap:fullscreen canvas#cv{width:100%;height:80vh;max-height:80vh;object-fit:contain}
#battleWrap:fullscreen .hud,#battleWrap:fullscreen .hint{color:#cdeeff;flex:0 0 auto}

/* ===== PIXEL UI OVERHAUL: everything blocky, everything pixel-fonted ===== */
*{font-family:'Pixelify Sans','Fredoka',sans-serif!important}
h1,p,span,div,small,b,strong,label{letter-spacing:0.3px}
h1,.card,.charBtn,.vowCard,.gfxCard,.upgRow,.chatPanel,.chatMessages,.chatMsg,.pauseBox,
button.act,button.small,.fsbtn,.chatBtn,.pauseBtn,.chatInputRow input,input,textarea,
.vowTimerWrap,canvas#cv,.prev{border-radius:0!important}
.card,.vowCard,.gfxCard,.pauseBox,.chatPanel{box-shadow:5px 5px 0 #000,0 0 0 2px #00e5ff55!important;image-rendering:pixelated}
.charBtn{box-shadow:4px 4px 0 #000!important}
.charBtn:hover{box-shadow:6px 6px 0 #000!important;transform:translate(-2px,-2px)!important}
button.act{box-shadow:4px 4px 0 #000!important;border:2px solid #000!important}
button.act:active{transform:translate(4px,4px)!important;box-shadow:0 0 0 #000!important}
button.small{box-shadow:3px 3px 0 #000!important;border:2px solid #000!important}
button.small:active{transform:translate(3px,3px)!important;box-shadow:0 0 0 #000!important}
input,textarea{border:2px solid #00e5ff55!important}
.gfxIcon,.vowIcon{image-rendering:pixelated}
img,canvas,.prev{image-rendering:pixelated;image-rendering:crisp-edges}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#00e5ff88;border:2px solid #000}
::-webkit-scrollbar-track{background:#0a1420}
</style>
</head>
<body>
<div class="bgfx"><i class="b1"></i><i class="b2"></i><i class="b3"></i><i class="b4"></i><i class="b5"></i><i class="b6"></i></div>
<div class="sparkle"></div>
<div id="app"></div>
<script>
const W=1120,H=520,GY=420,GRAV=0.6,JUMPV=-11.5,SPD=3.3,PS=4;
function band(y,x0,x1,c){const a=[];for(let x=x0;x<=x1;x++)a.push([x,y,c]);return a;}
function col_(x,y0,y1,c){const a=[];for(let y=y0;y<=y1;y++)a.push([x,y,c]);return a;}
function dots(pts,c){return pts.map(p=>[p[0],p[1],c]);}
const E14=[[4,5,'#222'],[9,5,'#222']];
const CHARS = {
  noodle:{name:"Noodle",hp:32,atk:6,range:150,cd:55,desc:"Slurp Strike: quick double slash",passive:"Quick Reflexes: 12% dodge chance",dance:"wiggle",
    main:"#f2c14e",shade:"#c98f2e",outline:"#7a5a1a",size:14,
    decor:[...E14,...dots([[5,2],[7,2],[9,3]],'#fff176'),[6,7,'#7a5a1a']]},
  mochi:{name:"Mochi",hp:46,atk:3,range:40,cd:70,desc:"Squish Shield: blocks the next hit",passive:"Squishy: takes 15% less damage",dance:"bounce",
    main:"#f8d7e6",shade:"#e3a9c4",outline:"#b97a99",size:14,
    decor:[...E14,...dots([[3,7],[10,7]],'#f4a6c6'),[6,8,'#c98a9a']]},
  rice:{name:"Rice Ball",hp:36,atk:4,range:42,cd:75,desc:"Onigiri Heal: restores HP",passive:"Nourished: slowly regenerates HP",dance:"bounce",
    main:"#fdfaf1",shade:"#e5ddc5",outline:"#3a2a1a",size:14,
    decor:[...E14,...band(6,2,11,'#1a1206'),[6,8,'#c0392b']]},
  dumpling:{name:"Dumpling",hp:52,atk:8,range:150,cd:65,desc:"Ground Pound: heavy melee smash",passive:"Thick Skin: reflects 10% damage taken",dance:"wiggle",
    main:"#f0d3a0",shade:"#c9a35c",outline:"#7a5a2a",size:14,
    decor:[...E14,...dots([[4,3],[6,2],[9,3]],'#8a6a3a'),[6,8,'#6a4a1a']]},
  taco:{name:"Taco",hp:28,atk:6,range:260,cd:60,desc:"Salsa Bomb: ranged projectile",passive:"Spicy Kick: 20% crit chance on attacks",dance:"spin",
    main:"#e8b04d",shade:"#b9812c",outline:"#6a4a1a",size:14,
    decor:[...E14,...band(3,2,11,'#4caf50'),...dots([[4,5],[9,5]],'#e74c3c')]},
  boba:{name:"Bubble Tea",hp:34,atk:4,range:150,cd:40,desc:"Boba Barrage: fast hits + lifesteal",passive:"Caffeine Rush: 15% faster cooldown",dance:"shimmy",
    main:"#c9a0dc",shade:"#9a6bb0",outline:"#5a3a70",size:14,
    decor:[...E14,...col_(7,0,3,'#333'),...dots([[3,10],[5,10],[7,10],[9,10]],'#1a0f08')]},
  springroll:{name:"Spring Roll",hp:30,atk:6,range:70,cd:50,desc:"Roll Dash: dash-strike + dodge",passive:"Crispy Evasion: brief i-frames after being hit",dance:"spin",
    main:"#e0b45a",shade:"#a9793a",outline:"#6a4a1a",size:14,
    decor:[...E14,...dots([[3,3],[4,4],[5,5],[6,6],[7,7]],'#8a5a1a'),...dots([[5,9],[8,10]],'#4caf50')]},
  popcorn:{name:"Popcorn",hp:26,atk:4,range:220,cd:65,desc:"Popcorn Barrage: triple projectile burst",passive:"Popping Off: 25% chance for a bonus shot",dance:"bounce",
    main:"#fff3d0",shade:"#e8d9a0",outline:"#8a7a4a",size:14,
    decor:[...col_(3,8,12,'#c0392b'),...col_(6,8,12,'#c0392b'),...col_(9,8,12,'#c0392b'),...dots([[5,1],[6,1],[7,1],[8,1]],'#fffff0'),...E14]},
  eggtart:{name:"Egg Tart",hp:38,atk:7,range:150,cd:100,desc:"Custard Cannon: massive single nuke",passive:"Custard Core: heals a sliver on every hit",dance:"wiggle",
    main:"#f5c95a",shade:"#c99a2e",outline:"#8a5a1a",size:14,
    decor:[...E14,...band(2,4,9,'#ffe082'),...dots([[2,11],[5,11],[8,11],[11,11]],'#8a5a1a')]},
  sushi:{name:"Sushi",hp:29,atk:5,range:240,cd:60,desc:"Nigiri Throw: ranged crit-chance projectile",passive:"Precision Cuts: 20% crit chance on ability",dance:"spin",
    main:"#f2b6a0",shade:"#d99080",outline:"#8a4a30",size:14,
    decor:[...E14,...band(6,2,11,'#1a0f06'),...band(2,4,9,'#ff8a65')]},
  dango:{name:"Dango",hp:33,atk:5,range:150,cd:80,desc:"Skewer Combo: 3-hit melee flurry",passive:"Sweet Tooth: heals a bit on every hit",dance:"bounce",
    main:"#ffe0e9",shade:"#f0a8bf",outline:"#b97a99",size:14,
    decor:[...E14,...band(1,3,10,'#8bc98c'),...band(9,3,10,'#f48fb1'),...col_(6,12,13,'#8a5a1a')]},
  churro:{name:"Churro",hp:31,atk:6,range:170,cd:55,desc:"Cinnamon Whip: pulls the boss in",passive:"Sugar Coated: 30% faster basic-attack cooldown",dance:"wiggle",
    main:"#d9a066",shade:"#a97840",outline:"#6a4a1a",size:14,
    decor:[...E14,...col_(3,2,11,'#a97840'),...col_(9,2,11,'#a97840')]},
  matcha:{name:"Matcha",hp:37,atk:5,range:190,cd:85,desc:"Zen Pulse: applies a poison DOT",passive:"Calming Aura: takes 10% less damage",dance:"shimmy",
    main:"#8bc98c",shade:"#5e9c5f",outline:"#2e5c2f",size:14,
    decor:[...E14,...band(2,3,10,'#c8f0c8'),...dots([[4,9],[9,9]],'#2e5c2f')]},
  pretzel:{name:"Pretzel",hp:44,atk:6,range:150,cd:70,desc:"Twist Lock: stuns the boss briefly",passive:"Iron Grip: 10% chance to stun on taking a hit",dance:"wiggle",
    main:"#c99a5a",shade:"#a06f34",outline:"#5a3a1a",size:14,
    decor:[...E14,...dots([[3,3],[4,4],[9,4],[10,3]],'#5a3a1a'),[6,8,'#5a3a1a']]},
  macaron:{name:"Macaron",hp:30,atk:6,range:220,cd:65,desc:"Sweet Burst: AoE hit that heals you",passive:"Lucky Sprinkles: 15% dodge chance",dance:"bounce",
    main:"#f8bbd0",shade:"#e191ae",outline:"#a85a78",size:14,
    decor:[...E14,...band(6,2,11,'#fff5f8'),[6,8,'#e191ae']]},
  ramen:{name:"Ramen",hp:50,atk:7,range:160,cd:70,desc:"Broth Splash: heavy wide melee hit",passive:"Second Wind: survives a fatal hit once, at 1 HP",dance:"shimmy",
    main:"#f5deb3",shade:"#d9b978",outline:"#7a5a2a",size:14,
    decor:[...E14,...band(3,3,10,'#e8942a'),...dots([[4,9],[8,9]],'#c0392b')]},
  wonton:{name:"Wonton",hp:30,atk:5,range:150,cd:65,desc:"Silk Wrap: melee hit with a chance to stun",passive:"Slippery Wrap: 10% dodge chance",dance:"bounce",
    main:"#fff3d0",shade:"#e8d9a0",outline:"#8a7a4a",size:14,
    decor:[...E14,...dots([[4,3],[6,2],[9,3]],'#e8d9a0'),[6,8,'#8a5a3a']]},
  croissant:{name:"Croissant",hp:27,atk:5,range:230,cd:60,desc:"Buttery Slice: ranged crescent projectile",passive:"Flaky Layers: fully absorbs the first hit each fight",dance:"wiggle",
    main:"#f0c987",shade:"#c99a5a",outline:"#8a5a1a",size:14,
    decor:[...E14,...dots([[3,3],[5,2],[7,2],[9,3]],'#c99a5a')]},
  baguette:{name:"Baguette",hp:42,atk:7,range:170,cd:75,desc:"Bread Bonk: long-reach heavy melee",passive:"Day-Old Crust: reflects 15% damage taken",dance:"spin",

function shapeInside(shape,size,x,y){
  const cx=size/2, cy=size/2+0.5, r=size/2-1, dx=x-cx+0.5;
  if(shape==='oval'){ const dy=(y-cy+0.5)*1.55; return Math.sqrt(dx*dx+dy*dy)<=r; }
  if(shape==='tall'){ const dy=(y-cy+0.5)*0.75; return Math.sqrt(dx*dx+dy*dy)<=r*0.95; }
  if(shape==='teardrop'){ const dy=(y-cy+0.5)*1.05; const shrink=Math.max(0,(y-size*0.32)/size)*0.55; return Math.sqrt(dx*dx+dy*dy)<=r*(1-shrink); }
  if(shape==='blocky'){ const dy=(y-cy+0.5)*1.05; return Math.max(Math.abs(dx),Math.abs(dy))<=r*0.86; }
  if(shape==='pot'){ const dy=(y-cy+0.5)*1.08; const body=Math.sqrt(dx*dx+dy*dy)<=r;
    const spout=y>size*0.32&&y<size*0.5&&x>=size-5; const handle=y>size*0.35&&y<size*0.62&&x<=1;
    return body||spout||handle; }
  if(shape==='wingy'){ const dy=(y-cy+0.5)*1.08; const body=Math.sqrt(dx*dx+dy*dy)<=r;
    const wing=y>size*0.3&&y<size*0.62&&(x<3||x>size-4);
    return body||wing; }
  if(shape==='bottle'){ if(y<size*0.22) return Math.abs(dx)<=r*0.32;
    const dy=(y-cy+0.5-size*0.05)*1.05; return Math.sqrt(dx*dx+dy*dy)<=r*0.92; }
  if(shape==='cone'){ const rowR=r*(0.12+0.92*(y/size)); return Math.abs(dx)<=rowR; }
  if(shape==='bowl'){ if(y<size*0.3) return false;
    const dy=(y-cy+0.5)*1.35; return Math.sqrt(dx*dx+dy*dy)<=r; }
  if(shape==='pepper'){ if(y<size*0.12) return Math.abs(dx)<=1;
    const yy=Math.min(1,(y-size*0.12)/(size*0.88)); const rowR=r*Math.sin(Math.PI*yy)*1.2;
    return Math.abs(dx)<=rowR; }
  if(shape==='icecream'){ if(y<size*0.56){ const dy=(y-size*0.26)*1.1; return Math.sqrt(dx*dx+dy*dy)<=r*0.95; }
    const yy=(y-size*0.56)/(size*0.44); const rowR=r*0.85*(1-yy); return Math.abs(dx)<=rowR && rowR>0.4; }
  const dy=(y-cy+0.5)*1.08; return Math.sqrt(dx*dx+dy*dy)<=r;
}
function bEyes(size,color){ const ey=Math.round(size*0.42); return [[Math.round(size*0.32),ey,color],[Math.round(size*0.62),ey,color]]; }
function buildSprite(size,main,shade,outline,decor,shape){
  const cv=document.createElement('canvas'); cv.width=cv.height=size*PS;
  const ctx=cv.getContext('2d'); ctx.imageSmoothingEnabled=false;
  const sh=shape||'circle';
  const inside=[];
  for(let y=0;y<size;y++){ inside.push([]); for(let x=0;x<size;x++) inside[y].push(shapeInside(sh,size,x,y)); }
  const grid=[];
  for(let y=0;y<size;y++){grid.push([]);for(let x=0;x<size;x++){
    if(!inside[y][x]){ grid[y].push(null); continue; }
    const edge = x===0||y===0||x===size-1||y===size-1||!inside[y-1][x]||!inside[y+1][x]||!inside[y][x-1]||!inside[y][x+1];
    grid[y].push(edge?outline:(y>size*0.62?shade:main));
  }}
  decor.forEach(([x,y,c])=>{if(y>=0&&y<size&&x>=0&&x<size&&inside[y][x]) grid[y][x]=c;});
  for(let y=0;y<size;y++)for(let x=0;x<size;x++) if(grid[y][x]){ctx.fillStyle=grid[y][x];ctx.fillRect(x*PS,y*PS,PS,PS);}
  return cv;
}

function toggleSfx(){ SFX_ON=!SFX_ON; try{ localStorage.setItem('sqs_sfx',SFX_ON?'1':'0'); }catch(e){} if(SFX_ON) ensureAudio(); if(S.screen==='settings') render(); }
function beep(freq,dur,type,vol,glide){
  if(!SFX_ON) return; ensureAudio(); if(!actx) return;
  const t=actx.currentTime;
  const osc=actx.createOscillator(), gain=actx.createGain();
  osc.type=type||'square'; osc.frequency.setValueAtTime(freq,t);
  if(glide) osc.frequency.exponentialRampToValueAtTime(Math.max(20,glide),t+dur);
  gain.gain.setValueAtTime(vol||0.14,t);
  gain.gain.exponentialRampToValueAtTime(0.001,t+dur);
  osc.connect(gain); gain.connect(actx.destination);
  osc.start(t); osc.stop(t+dur);
}

function doShake(mag,dur){ mag=mag*Math.min(1.3,gfxScale()); if(mag>shake.mag){shake.mag=mag;} shake.dur=Math.max(shake.dur,dur); }
function burst(x,y,color,n,speed,size){
  const n2=Math.max(1,Math.round(n*gfxScale()));
  for(let i=0;i<n2;i++){ const a=Math.random()*Math.PI*2, sp=speed*(0.5+Math.random());
    parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-1,life:24+Math.random()*10,color,size:size||3}); }
}
function slash(x,y,color,big,type){ slashes.push({x,y,life:14,color,big:!!big,type:type||'arc'}); }
function ring(x,y,color,startR){ rings.push({x,y,r:(startR||34)*(GFX==='simple'?0.7:(GFX==='epic'?1.35:1)),color,alpha:0.9}); }
function aoeHit(x,y,color,radius){ ring(x,y,color,radius||70); burst(x,y,color,20,4,5); }
function royalWave(x,y,waves,gap){
  for(let i=0;i<waves;i++) setTimeout(()=>{ if(S.screen!=='battle') return;
    ring(x,y,i%2===0?'#ffd54f':'#fff',80+i*40); burst(x,y,'#ffd54f',18,5+i,5); doShake(10+i*3,14);
  },i*gap);
}

function projSplash(x,y,shape){
  const fx=PROJ_FX[shape]; if(!fx){ burst(x,y,'#fff',10,3,4); ring(x,y,'#fff',30); return; }
  fx.splash.forEach((c,i)=>burst(x,y,c,7,2.5+i*0.5,4));
  ring(x,y,fx.glow||fx.splash[0],44);
}

function findAccountKey(u){ return Object.keys(ACCOUNTS).find(k=>k.toLowerCase()===u.toLowerCase()); }
function doRegister(){
  const u=document.getElementById('regUser').value.trim();
  const p=document.getElementById('regPass').value;
  const p2=document.getElementById('regPass2').value;
  const err=document.getElementById('regError');
  if(!u){ err.textContent='Please enter a username.'; return; }
  if(findAccountKey(u)){ err.textContent='That username is already taken.'; return; }
  if(p.length<4){ err.textContent='Password must be at least 4 characters.'; return; }
  if(p!==p2){ err.textContent='Passwords do not match.'; return; }
  ACCOUNTS[u]=p; saveAccounts(); setCurrentUser(u); sfxClick();
  S.screen='title'; render();
}

function doImport(){
  const raw=document.getElementById('importCode').value.trim();
  const err=document.getElementById('importError');
  try{
    const data=JSON.parse(decodeURIComponent(atob(raw)));
    if(!data.u||typeof data.p!=='string'){ err.textContent='Invalid code.'; return; }
    ACCOUNTS[data.u]=data.p; saveAccounts();
    if(data.s){ STATS[data.u]=data.s; saveStats(); }
    setCurrentUser(data.u);
    sfxClick(); S.screen='title'; render();
  }catch(e){ err.textContent='Invalid or corrupted code.'; }

let previewRaf=null, previewT=0, previewParts=[], previewShake=0;
function startPreview(){
  previewT=0; previewParts=[]; previewShake=0;
  if(previewRaf) cancelAnimationFrame(previewRaf);
  previewLoop();
}
function previewLoop(){
  if(S.screen!=='settings'){ previewRaf=null; return; }
  const cv=document.getElementById('gfxPreview');
  if(!cv){ previewRaf=requestAnimationFrame(previewLoop); return; }
  const ctx=cv.getContext('2d');
  previewT++;
  const gs=gfxScale();
  if(previewT%50===0){
    const n=Math.max(1,Math.round(10*gs));
    for(let i=0;i<n;i++){ const a=Math.random()*Math.PI*2, sp=2*(0.5+Math.random());
      previewParts.push({x:150,y:70,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:30,color:'#00e5ff'}); }
    previewShake=GFX==='simple'?2:(GFX==='epic'?16:6);
  }
  if(previewShake>0.3) previewShake*=0.9; else previewShake=0;
  ctx.clearRect(0,0,300,140);
  ctx.save();
  ctx.translate((Math.random()-0.5)*previewShake,(Math.random()-0.5)*previewShake);
  ctx.fillStyle='#03101c'; ctx.fillRect(-20,-20,340,180);
  const pulseAmt=GFX==='simple'?0:(GFX==='epic'?0.18:0.08);
  const pulse=1+Math.sin(previewT*0.1)*pulseAmt;
  ctx.save();
  if(GFX==='epic'){ ctx.shadowColor='#00e5ff'; ctx.shadowBlur=30; }
  ctx.fillStyle='#00e5ff'; ctx.beginPath(); ctx.arc(150,70,28*pulse,0,Math.PI*2); ctx.fill();
  ctx.restore();
  for(let i=previewParts.length-1;i>=0;i--){ const pt=previewParts[i]; pt.x+=pt.vx; pt.y+=pt.vy; pt.vy+=0.08; pt.life--;
    if(pt.life<=0){ previewParts.splice(i,1); continue; }
    ctx.globalAlpha=pt.life/30; ctx.fillStyle=pt.color; ctx.fillRect(pt.x-2,pt.y-2,4,4); ctx.globalAlpha=1; }
  ctx.restore();
  ctx.fillStyle='#cdeeff'; ctx.font='12px sans-serif'; ctx.textAlign='center'; strokeFill(ctx,'Live Preview — '+GFX.toUpperCase(),150,130);
  previewRaf=requestAnimationFrame(previewLoop);
}

      ctx.beginPath(); ctx.arc(x,y-f.h/2,rr,0,Math.PI*2); ctx.stroke(); }
    ctx.globalAlpha=1;
    if(Math.random()<0.5){ const ang=Math.random()*Math.PI*2, rr=f.w*0.6+Math.random()*10;
      parts.push({x:x+Math.cos(ang)*rr,y:(y-f.h/2)+Math.sin(ang)*rr,vx:0,vy:-0.6-Math.random()*0.6,life:26,color:'#ffd54f',size:2+Math.random()*2}); }
    ctx.restore();
  }
  if(f===P && P.atkGlowTimer>0){ ctx.globalAlpha=0.35*(P.atkGlowTimer/16); ctx.fillStyle=P.atkGlowColor; ctx.beginPath(); ctx.arc(x,y-f.h/2,f.w*0.7,0,Math.PI*2); ctx.fill(); ctx.globalAlpha=1; }
  if(f.flash>0){ ctx.globalAlpha=0.5*(f.flash/10); ctx.fillStyle='#fff'; ctx.fillRect(x-f.w/2,y-f.h,f.w,f.h); ctx.globalAlpha=1; }
}
function draw(){
  const cv=document.getElementById('cv'); if(!cv) return; const ctx=cv.getContext('2d'); ctx.imageSmoothingEnabled=false; window.cvctx=ctx;
  ctx.clearRect(0,0,W,H);
  ctx.save(); ctx.translate(shake.x,shake.y);
  ctx.fillStyle=MAP.sky2; ctx.fillRect(0,0,W,GY);
  const BLK=PS*2;
  function pxRect(x,y,w,h,color){ ctx.fillStyle=color;
    const x0=Math.floor(x/BLK)*BLK, y0=Math.floor(y/BLK)*BLK;
    for(let py=y0;py<y+h;py+=BLK) for(let px=x0;px<x+w;px+=BLK) ctx.fillRect(px,py,BLK,BLK); }
  function pxCircle(cx,cy,r,color){ ctx.fillStyle=color;
    const x0=Math.floor((cx-r)/BLK)*BLK, y0=Math.floor((cy-r)/BLK)*BLK;
    for(let py=y0;py<=cy+r;py+=BLK) for(let px=x0;px<=cx+r;px+=BLK){
      const dx=(px+BLK/2)-cx, dy=(py+BLK/2)-cy;
      if(dx*dx+dy*dy<=r*r) ctx.fillRect(px,py,BLK,BLK);
    } }
  function pxTri(x0,y0,x1,y1,x2,y2,color){ ctx.fillStyle=color;
    const minX=Math.floor(Math.min(x0,x1,x2)/BLK)*BLK, maxX=Math.max(x0,x1,x2);
    const minY=Math.floor(Math.min(y0,y1,y2)/BLK)*BLK, maxY=Math.max(y0,y1,y2);
    const sign=(ax,ay,bx,by,cx,cy)=>(ax-cx)*(by-cy)-(bx-cx)*(ay-cy);
    for(let py=minY;py<=maxY;py+=BLK) for(let px=minX;px<=maxX;px+=BLK){
      const cx=px+BLK/2, cy=py+BLK/2;
      const d1=sign(cx,cy,x0,y0,x1,y1), d2=sign(cx,cy,x1,y1,x2,y2), d3=sign(cx,cy,x2,y2,x0,y0);
      const hasNeg=(d1<0)||(d2<0)||(d3<0), hasPos=(d1>0)||(d2>0)||(d3>0);
      if(!(hasNeg&&hasPos)) ctx.fillRect(px,py,BLK,BLK);
    } }
  (MAP.bg||[]).forEach(o=>{
    const span=W+160, raw=(o.x*W + frameCount*(o.drift||0)) % span;
    const driftX = o.drift ? ((raw+span)%span)-80 : o.x*W;
    if(o.t==='rect') pxRect(driftX,o.y*H,o.w*W,o.h*H,o.c);
    else if(o.t==='circle') pxCircle(driftX,o.y*H,o.r*W,o.c);
    else if(o.t==='tri') pxTri(driftX,(o.y+o.h)*H,driftX+(o.w/2)*W,o.y*H,driftX+o.w*W,(o.y+o.h)*H,o.c);
  });
  ctx.fillStyle=MAP.ground;
  ctx.fillRect(0,GY,W,H-GY);
  ctx.fillStyle='#00000022';
  for(let gx=-((frameCount*0.3)%40);gx<W;gx+=40) ctx.fillRect(gx,GY+6,22,3);
  ctx.fillStyle='#ffffff14'; ctx.fillRect(0,GY,W,3);
  pools.forEach(pl=>{ ctx.globalAlpha=Math.max(0,pl.life/260)*0.55; ctx.fillStyle='#6a4a1a'; ctx.beginPath(); ctx.ellipse(pl.x,GY+4,pl.r,10,0,0,Math.PI*2); ctx.fill(); ctx.globalAlpha=1; });
  if(B.breath){ const lo=Math.min(B.x,B.x+B.breath.dir*B.breath.len), len=B.breath.len;
    ctx.globalAlpha=Math.max(0,B.breath.timer/22)*0.75;
    const grad=ctx.createLinearGradient(lo,0,lo+len,0); grad.addColorStop(0,'#ff7043'); grad.addColorStop(1,'#ffab6600');
    ctx.fillStyle=grad; ctx.fillRect(lo,GY-14,len,18); ctx.globalAlpha=1; }
  drawFighter(P);
  const origBY=B.y; B.y+=(B.bob||0);
  if(B.enraged){ ctx.save(); ctx.shadowColor='#ff1744'; ctx.shadowBlur=GFX==='simple'?6:(GFX==='epic'?36:20); drawFighter(B); ctx.restore(); } else drawFighter(B);
  B.y=origBY;
  bProj.forEach(bp=>{
    const sh=bp.shape||'circle'; ctx.fillStyle=bp.color||'#7a5c3a';
    if(sh==='drop'){ ctx.beginPath(); ctx.arc(bp.x,bp.y,6,0.3,Math.PI*1.85); ctx.lineTo(bp.x,bp.y-9); ctx.closePath(); ctx.fill(); }
    else if(sh==='fruit'){ ctx.beginPath(); ctx.arc(bp.x,bp.y,7,0,Math.PI*2); ctx.fill(); ctx.fillStyle='#4caf50'; ctx.fillRect(bp.x-1,bp.y-9,2,4); }
    else { ctx.beginPath(); ctx.arc(bp.x,bp.y,7,0,Math.PI*2); ctx.fill(); }
  });
  rings.forEach(r=>{ctx.globalAlpha=Math.max(0,r.alpha); ctx.strokeStyle=r.color; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(r.x,r.y,r.r,0,Math.PI*2); ctx.stroke(); ctx.globalAlpha=1;});
  slashes.forEach(s=>{const a=s.life/14; ctx.globalAlpha=a; ctx.strokeStyle=s.color; ctx.lineWidth=s.big?6:3; ctx.lineCap='round';
    const type=s.type||'arc', rr=s.big?30:20;
    if(type==='arc'){ ctx.beginPath(); ctx.arc(s.x,s.y,rr,-0.9,0.9); ctx.stroke(); }
    else if(type==='cross'){ ctx.beginPath(); ctx.moveTo(s.x-rr,s.y-rr); ctx.lineTo(s.x+rr,s.y+rr); ctx.moveTo(s.x+rr,s.y-rr); ctx.lineTo(s.x-rr,s.y+rr); ctx.stroke(); }
    else if(type==='spiral'){ ctx.beginPath(); for(let t=0;t<Math.PI*3;t+=0.35){ const rad=(t/(Math.PI*3))*rr; const px=s.x+Math.cos(t*2.2)*rad, py=s.y+Math.sin(t*2.2)*rad; if(t===0) ctx.moveTo(px,py); else ctx.lineTo(px,py); } ctx.stroke(); }
    else if(type==='wave'){ ctx.beginPath(); for(let i=-rr;i<=rr;i+=4){ const py=s.y+Math.sin((i+s.x)*0.35)*7; if(i===-rr) ctx.moveTo(s.x+i,py); else ctx.lineTo(s.x+i,py); } ctx.stroke(); }
    else if(type==='zigzag'){ ctx.beginPath(); ctx.moveTo(s.x-rr,s.y-rr*0.6); ctx.lineTo(s.x-rr*0.2,s.y-rr*0.1); ctx.lineTo(s.x-rr*0.5,s.y+rr*0.15); ctx.lineTo(s.x+rr,s.y+rr*0.6); ctx.stroke(); }
    else if(type==='star'){ const spikes=6,r1=rr,r2=rr*0.42; ctx.beginPath(); for(let i=0;i<spikes*2;i++){ const rad=i%2===0?r1:r2, ang=(Math.PI/spikes)*i-Math.PI/2; const px=s.x+Math.cos(ang)*rad, py=s.y+Math.sin(ang)*rad; if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py); } ctx.closePath(); ctx.stroke(); }
    ctx.globalAlpha=1;});
  parts.forEach(pt=>{ctx.globalAlpha=Math.max(0,pt.life/30); ctx.fillStyle=pt.color; ctx.fillRect(pt.x-pt.size/2,pt.y-pt.size/2,pt.size,pt.size); ctx.globalAlpha=1;});
  proj.forEach(p=>{
    const sh=p.shape||'circle', fx=PROJ_FX[sh];
    if(fx && fx.glow){ ctx.globalAlpha=0.35; ctx.fillStyle=fx.glow; ctx.beginPath(); ctx.arc(p.x,p.y,11,0,Math.PI*2); ctx.fill(); ctx.globalAlpha=1; }
    ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(Math.sin((p.age||0)*0.25)*0.3);
    ctx.fillStyle=p.color||'#e74c3c';
    if(sh==='triangle'){ ctx.beginPath(); ctx.moveTo(0,-7); ctx.lineTo(-6,5); ctx.lineTo(6,5); ctx.closePath(); ctx.fill();
      ctx.fillStyle='#fff59d'; ctx.beginPath(); ctx.arc(-1,-1,2,0,Math.PI*2); ctx.fill(); }
    else if(sh==='oval'){ ctx.beginPath(); ctx.ellipse(0,0,8,5,0,0,Math.PI*2); ctx.fill(); ctx.fillStyle='#1a0f06'; ctx.fillRect(-7,-1,14,2); ctx.fillStyle='#ffffff88'; ctx.beginPath(); ctx.arc(-2,-2,1.5,0,Math.PI*2); ctx.fill(); }
    else if(sh==='crescent'){ ctx.beginPath(); ctx.arc(0,0,7,0.3,Math.PI*1.6); ctx.arc(3,0,5,Math.PI*1.6,0.3,true); ctx.fill();
      ctx.fillStyle='#8a5a1a55'; ctx.beginPath(); ctx.arc(-1,2,3,0,Math.PI*2); ctx.fill(); }
    else if(sh==='kernel'){ ctx.beginPath(); ctx.arc(0,0,5,0,Math.PI*2); ctx.fill(); ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(-1,-1,2,0,Math.PI*2); ctx.fill(); }
    else if(sh==='chip'){ ctx.beginPath(); ctx.moveTo(-7,-5); ctx.lineTo(7,-5); ctx.lineTo(0,7); ctx.closePath(); ctx.fill();
      ctx.fillStyle='#c0392b99'; ctx.beginPath(); ctx.arc(0,-1,1.6,0,Math.PI*2); ctx.fill(); }
    else { ctx.beginPath(); ctx.arc(0,0,6,0,Math.PI*2); ctx.fill(); }
    ctx.restore();
  });
  pops.forEach(pp=>{ctx.globalAlpha=Math.max(0,pp.life/40);ctx.fillStyle=pp.color;ctx.font='bold 15px Pixelify Sans, monospace';ctx.textAlign='center';strokeFill(ctx,pp.text,pp.x,pp.y);ctx.globalAlpha=1;});
  ctx.restore();
  ctx.font='12px sans-serif'; ctx.textAlign='left';
  const cc=CHARS[S.char].main;
  barAt(ctx,20,14,180,10,P.hp/P.maxhp,'#66d98f','#2e9e5b'); ctx.fillStyle='#cdeeff'; strokeFill(ctx,P.hp+'/'+P.maxhp,20,38);
  barAt(ctx,W-200,14,180,10,B.hp/B.maxhp,'#ff7a5c','#c0392b'); ctx.fillStyle='#cdeeff'; strokeFill(ctx,B.hp+'/'+B.maxhp,W-200,38);
  ctx.textAlign='center'; ctx.fillStyle='#cdeeff';
  strokeFill(ctx,P.cd>0?'Ability charging...':'Ability Ready!',W/2,20);
  if(P.godMode){ ctx.fillStyle='#ffd54f'; ctx.font='bold 13px Pixelify Sans, monospace'; strokeFill(ctx,'👑 GOD MODE',W/2,70); }
  if(P.flyMode){ ctx.fillStyle='#00e5ff'; ctx.font='bold 13px Pixelify Sans, monospace'; strokeFill(ctx,'🕊️ FREE FLY',W/2,P.godMode?90:70); }
  if(P.opFun){ ctx.fillStyle='#4dffb0'; ctx.font='bold 13px Pixelify Sans, monospace'; strokeFill(ctx,'🔁 OP FUN',W/2,(P.godMode?20:0)+(P.flyMode?90:70)); }
  ctx.fillStyle='#00142099'; ctx.fillRect(W/2-40,26,80,6);
  ctx.fillStyle=cc; ctx.fillRect(W/2-40,26,80*(1-P.cd/P.cdMax),6);
  const ultReady=P.ult>=P.ultMax;
  ctx.fillStyle=ultReady?'#ffd54f':'#cdeeff';
  strokeFill(ctx,ultReady?'★ ULTIMATE READY — Press G!':'Ultimate charging',W/2,50);
  ctx.fillStyle='#00142099'; ctx.fillRect(W/2-60,55,120,7);
  ctx.fillStyle=ultReady?'#ffd54f':'#00e5ff'; ctx.fillRect(W/2-60,55,120*(P.ult/P.ultMax),7);
  if(flashA>0){ ctx.fillStyle='#fff'; ctx.globalAlpha=flashA; ctx.fillRect(0,0,W,H); ctx.globalAlpha=1; }
  if(P.qte){
    ctx.fillStyle='#000a'; ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#ff1744'; ctx.textAlign='center'; ctx.font='bold 46px Pixelify Sans, monospace';
    strokeFill(ctx,'PRESS '+P.qte.key.toUpperCase()+'!',W/2,H/2-14,5);
    ctx.fillStyle='#fff'; ctx.font='bold 16px Pixelify Sans, monospace'; strokeFill(ctx,'Escape the grip!',W/2,H/2+16);
    ctx.fillStyle='#fff3'; ctx.fillRect(W/2-120,H/2+30,240,16);
    ctx.fillStyle='#ff1744'; ctx.fillRect(W/2-120,H/2+30,240*(P.qte.timeLeft/P.qte.maxTime),16);
  }
  if(winSeq){
    const t=winSeq.t;
    if(t>=95){
      const local=Math.min(1,(t-95)/18);
      const overshoot=local<1?1+Math.sin(local*Math.PI)*0.15:1;
      const scale=(0.3+local*0.7)*overshoot;

      ctx.textAlign='center'; ctx.font='bold 58px Pixelify Sans, monospace';
      ctx.shadowColor='#00e5ff'; ctx.shadowBlur=24;

      ctx.restore();

        strokeFill(ctx,'+'+winSeq.goldEarned+' Stat Points ⭐',W/2,H*0.36+46);

        ctx.font='bold 30px Pixelify Sans, monospace'; ctx.textAlign='center';
        ctx.shadowColor=rc; ctx.shadowBlur=18; ctx.fillStyle=rc;
        strokeFill(ctx,'RANK '+winSeq.rank,W/2,H*0.36+82);

      const ang=(i/lineCount)*Math.PI*2+t*0.025;
      const innerR=45+cp*15, outerR=innerR+170+Math.sin(t*0.3+i)*22;

      ctx.lineTo(cx+Math.cos(ang)*outerR,cy+Math.sin(ang)*outerR); ctx.stroke();
    }

      ctx.globalAlpha=0.28*cp; ctx.strokeStyle=tint; ctx.lineWidth=4;
      ctx.beginPath(); ctx.arc(cx,cy,rr,0,Math.PI*2); ctx.stroke(); ctx.globalAlpha=1;
    }
    const scale=1+cp*2.7, pw=P.w*scale, ph=P.h*scale;
    ctx.save();
    if(cp>0.25){ ctx.shadowColor=tint; ctx.shadowBlur=(GFX==='simple'?12:(GFX==='epic'?55:32))*cp; }
    ctx.drawImage(P.sprite,cx-pw/2,cy+ph*0.2-ph,pw,ph);
    ctx.restore();
    if(t>14){
      const tp=Math.min(1,(t-14)/24);
      ctx.save(); ctx.globalAlpha=tp; ctx.textAlign='center';
      ctx.font='bold '+Math.round(26+tp*8)+'px Pixelify Sans, monospace';
      ctx.shadowColor=tint; ctx.shadowBlur=18;
      ctx.fillStyle='#fff'; strokeFill(ctx,CHARS[S.char].name.toUpperCase()+' IS POWERING UP!',cx,H*0.13,4);
      ctx.restore();
    }
    if(t>=68){
      const fp=Math.min(1,(t-68)/14);
      ctx.save(); ctx.globalAlpha=Math.max(0,1-fp*0.6); ctx.textAlign='center';
      ctx.font='bold 34px Pixelify Sans, monospace'; ctx.fillStyle=tint; ctx.shadowColor='#fff'; ctx.shadowBlur=20;
      strokeFill(ctx,'ULTIMATE UNLEASHED!',cx,H*0.24,4);
      ctx.restore();
    }
  }
}
function barAt(ctx,x,y,w,h,pct,c1,c2){
  ctx.fillStyle='#0003'; ctx.fillRect(x,y,w,h);
  const g=ctx.createLinearGradient(x,0,x+w,0); g.addColorStop(0,c2||c1); g.addColorStop(1,c1);
  ctx.fillStyle=g; ctx.fillRect(x,y,w*Math.max(0,pct),h);
}

}
function buy(stat){const cost=20+S.upg[stat]*15; if(S.gold<cost) return; sfxClick(); S.gold-=cost; S.upg[stat]++; render();}

function overHTML(){
