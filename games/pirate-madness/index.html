// ---------- effects ----------
const FX = {
  spark(w, x, y, n = 6, col = PAL.white, spd = 2) {
    for (let i = 0; i < n; i++) { const a = rnd(Math.PI * 2), s = rnd(0.5, spd); w.fx.push({ t: 'p', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 0.5, life: irnd(10, 20), col, g: 0.05 }); }
  },
  dust(w, x, y, n = 4, col = PAL.beige) {
    for (let i = 0; i < n; i++) w.fx.push({ t: 'dust', x: x + rnd(-4, 4), y: y + rnd(-2, 1), vx: rnd(-0.4, 0.4), vy: rnd(-0.4, -0.1), life: irnd(14, 24), col, r: rnd(1, 2.5) });
  },
  text(w, x, y, str, col = PAL.white, big = false) {
    w.fx.push({ t: 'text', x: x + rnd(-3, 3), y, vy: -1.1, life: big ? 60 : 40, str: String(str), col, big });
  },
  ring(w, x, y, r0, r1, life, col) { w.fx.push({ t: 'ring', x, y, r0, r1, life, max: life, col }); },
  star(w, x, y, n = 5, col = PAL.yellow) {
    for (let i = 0; i < n; i++) { const a = i / n * Math.PI * 2; w.fx.push({ t: 'star', x, y, vx: Math.cos(a) * 1.4, vy: Math.sin(a) * 1.4, life: 20, col }); }
  },
  splash(w, x, y, n = 8) {
    for (let i = 0; i < n; i++) w.fx.push({ t: 'p', x: x + rnd(-3, 3), y, vx: rnd(-1, 1), vy: rnd(-2.2, -0.8), life: irnd(14, 22), col: i % 2 ? PAL.white : PAL.cyan, g: 0.15, floor: y + 2 });
  },
  poof(w, x, y, col = PAL.lgray) {
    for (let i = 0; i < 10; i++) { const a = rnd(Math.PI * 2), s = rnd(0.3, 1.4); w.fx.push({ t: 'dust', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s * 0.6 - 0.3, life: irnd(18, 30), col, r: rnd(2, 4) }); }
  },
  heal(w, x, y) {
    for (let i = 0; i < 8; i++) w.fx.push({ t: 'plus', x: x + rnd(-8, 8), y: y + rnd(-10, 2), vx: 0, vy: -rnd(0.3, 0.8), life: irnd(20, 36), col: i % 2 ? PAL.lgreen : PAL.white });
  },
  note(w, x, y, col = PAL.yellow) { w.fx.push({ t: 'note', x, y, vx: rnd(-0.4, 0.4), vy: -0.6, life: 40, col }); },
  afterimage(w, actor) { w.fx.push({ t: 'ghost', x: actor.x, y: actor.y, z: actor.z || 0, spr: actor.currentSprite(), life: 12, col: actor.ghostCol || PAL.cyan }); },
  slash(w, owner, ang, r, spread, life, col = PAL.white, rev = false, thick = 4) {
    w.fx.push({ t: 'slash', owner, ang, r, spread, life, max: life, col, rev, thick });
  },
  bolt(w, x, y) { w.fx.push({ t: 'bolt', x, y, life: 12, seed: Math.random() * 1000 }); },
};

function updateFx(w) {
  const out = [];
  for (const f of w.fx) {
    f.life--;
    if (f.life <= 0) continue;
    if (f.vx !== undefined) { f.x += f.vx; f.y += f.vy; }
    if (f.g) { f.vy += f.g; if (f.floor !== undefined && f.y > f.floor) { f.y = f.floor; f.vy *= -0.3; f.vx *= 0.6; } }
    if (f.t === 'dust') { f.vx *= 0.92; f.vy *= 0.92; }
    if (f.t === 'text') { f.vy *= 0.92; }
    out.push(f);
  }
  w.fx = out;
}

function drawFx(g, w, cam, layer) {
  for (const f of w.fx) {
    const x = Math.round(f.x - cam.x), y = Math.round(f.y - cam.y);
    switch (f.t) {
      case 'p': g.fillStyle = f.col; g.fillRect(x, y, f.life > 6 ? 2 : 1, f.life > 6 ? 2 : 1); break;
      case 'dust': { const r = f.r * (f.life / 24); g.fillStyle = f.col; if (r > 1.5) pcircle(g, x, y, r, f.col); else g.fillRect(x, y, 1, 1); break; }
      case 'star': { g.fillStyle = f.col; g.fillRect(x, y - 1, 1, 3); g.fillRect(x - 1, y, 3, 1); break; }
      case 'plus': { g.fillStyle = f.col; g.fillRect(x, y - 1, 1, 3); g.fillRect(x - 1, y, 3, 1); break; }
      case 'note': drawText(g, '♪', x, y, f.col, { shadow: PAL.black }); break;
      case 'ring': { const t = 1 - f.life / f.max; const r = lerp(f.r0, f.r1, easeOut(t)); pring(g, x, y, r, f.col); if (t < 0.5) pring(g, x, y, r - 1, f.col); break; }
      case 'ghost': { if (f.spr) { g.globalAlpha = f.life / 24; drawSprite(g, silhouette(f.spr, f.col), x, y - f.z); g.globalAlpha = 1; } break; }
      case 'slash': {
        const o = f.owner; if (!o) break;
        const t = 1 - f.life / f.max;
        const cx = Math.round(o.x - cam.x), cy = Math.round(o.y - 7 - (o.z || 0) - cam.y);
        const half = f.spread;
        const sweep = easeOut(Math.min(1, t * 1.6));
        let a0 = f.ang - half, a1 = f.ang - half + half * 2 * sweep;
        if (f.rev) { a0 = f.ang + half; a1 = f.ang + half - half * 2 * sweep; }
        const tail = Math.max(0, sweep - 0.55) * half * 2;
        const s0 = f.rev ? a0 - tail : a0 + tail;
        const th = Math.max(1, f.thick * (1 - t * 0.7));
        parc(g, cx, cy, f.r - th, f.r, Math.min(s0, a1), Math.max(s0, a1), f.col);
        parc(g, cx, cy, f.r - th - 1, f.r - th, Math.min(s0, a1), Math.max(s0, a1), PAL.lblue);
        break;
      }
      case 'bolt': {
        const r = mulberry32(f.seed | 0);
        let bx = x, by = y - 120;
        g.fillStyle = f.life > 6 ? PAL.white : PAL.cyan;
        while (by < y) { const nx = bx + Math.round((r() - 0.5) * 8), ny = by + 6; pline(g, bx, by, nx, ny, g.fillStyle); pline(g, bx + 1, by, nx + 1, ny, PAL.lblue); bx = nx; by = ny; }
        pcircle(g, x, y, 6 - f.life / 3, PAL.white);
        break;
      }
      case 'text': {
        const big = f.big;
        drawText(g, f.str, x, y, f.col, { align: 'center', outline: PAL.black, scale: big ? 1 : 1 });
        break;
      }
    }
  }
}

// ---------- Actor ----------
let ACTOR_ID = 1;
class Actor {
  constructor(x, y, charId) {
    this.id = ACTOR_ID++;
    this.x = x; this.y = y; this.z = 0; this.vz = 0;
    this.charId = charId; this.F = charId ? getChar(charId) : null;
    this.w = 8; this.h = 5; this.bodyR = 6; this.height = 16;
    this.facing = 1; this.aim = { x: 1, y: 0 };
    this.kvx = 0; this.kvy = 0;
    this.hp = 100; this.maxHp = 100;
    this.team = 'neutral';
    this.flash = 0; this.flashCol = PAL.white; this.iframes = 0; this.stun = 0;
    this.moving = false; this.animT = 0; this.t = 0;
    this.speed = 1.2;
    this.state = 'idle'; this.stateT = 0;
    this.dead = false; this.ko = false;
    this.shadowW = 11;
    this.weapon = null;
  }
  get alive() { return !this.dead && !this.ko && this.hp > 0; }
  tick() {
    this.t++;
    if (this.flash > 0) this.flash--;
    if (this.iframes > 0) this.iframes--;
    if (this.stun > 0) this.stun--;
  }
  move(w, dx, dy, opts) {
    const n = Math.max(1, Math.ceil(Math.max(Math.abs(dx), Math.abs(dy))));
    const sx = dx / n, sy = dy / n;
    let hitX = false, hitY = false;
    const mo = this.moveOpts;
    for (let i = 0; i < n; i++) {
      if (sx && !hitX) {
        if (this.noclip || !w.map.blocked(this.x + sx - this.w / 2, this.y - this.h, this.w, this.h, mo)) this.x += sx; else hitX = true;
      }
      if (sy && !hitY) {
        if (this.noclip || !w.map.blocked(this.x - this.w / 2, this.y + sy - this.h, this.w, this.h, mo)) this.y += sy; else hitY = true;
      }
    }
    // corner nudge: slide around small obstacles
    if (opts && opts.nudge) {
      if (hitY && !sx && Math.abs(dy) > 0.2) this.nudge(w, 'x', sign(dy));
      if (hitX && !sy && Math.abs(dx) > 0.2) this.nudge(w, 'y', sign(dx));
    }
    return { hitX, hitY };
  }
  nudge(w, axis, d) {
    for (let k = 1; k <= 6; k++) for (const s of [-1, 1]) {
      const ox = axis === 'x' ? s * k : 0, oy = axis === 'y' ? s * k : 0;
      const tx = axis === 'x' ? 0 : d, ty = axis === 'y' ? 0 : d;
      if (!w.map.blocked(this.x + ox + tx - this.w / 2, this.y + oy + ty - this.h, this.w, this.h) && !w.map.blocked(this.x + ox - this.w / 2, this.y + oy - this.h, this.w, this.h)) {
        if (axis === 'x') this.move(w, s * 0.8, 0); else this.move(w, 0, s * 0.8);
        return;
      }
    }
  }
  applyKnock(w) {
    if (Math.abs(this.kvx) > 0.05 || Math.abs(this.kvy) > 0.05) {
      const r = this.move(w, this.kvx, this.kvy);
      if (r.hitX) this.kvx *= -0.3; if (r.hitY) this.kvy *= -0.3;
      this.kvx *= 0.8; this.kvy *= 0.8;
    } else { this.kvx = 0; this.kvy = 0; }
  }
  wading(w) { const m = w.map.matAtPx(this.x, this.y - 1); return MATS[m] && MATS[m].wade && this.z < 2; }
  // returns true if damage applied
  hurt(w, dmg, fx, fy, kb = 2, opts = {}) {
    if (!this.alive || this.iframes > 0 || this.invuln) return false;
    if (this.guard && this.guard(w, dmg, fx, fy, opts)) return false;
    dmg = Math.max(1, Math.round(dmg * (this.dmgTaken || 1)));
    this.hp -= dmg;
    this.flash = 8; this.flashCol = PAL.white;
    const a = angTo(fx, fy, this.x, this.y);
    const k = kb * (this.kbResist !== undefined ? this.kbResist : 1);
    this.kvx += Math.cos(a) * k; this.kvy += Math.sin(a) * k;
    this.iframes = this.hurtIframes || 6;
    this.onHurt && this.onHurt(w, dmg, opts);
    const col = this.team === 'enemy' ? (opts.crit ? PAL.yellow : PAL.white) : PAL.red2;
    FX.text(w, this.x, this.y - this.height - 4, dmg, col);
    FX.spark(w, this.x, this.y - 7, 5, this.team === 'enemy' ? PAL.yellow : PAL.red2);
    if (this.hp <= 0) {
      if (this.isPlayer && w.noDeath) this.hp = 1;
      else { this.hp = 0; this.onDown(w, opts); }
    }
    return true;
  }
  heal(w, n) {
    if (this.dead) return;
    const before = this.hp;
    this.hp = Math.min(this.maxHp, this.hp + n);
    const got = Math.round(this.hp - before);
    if (got > 0) { FX.text(w, this.x, this.y - this.height - 4, '+' + got, PAL.lgreen); FX.heal(w, this.x, this.y); }
  }
  onDown(w) { this.dead = true; }
  currentSprite() {
    if (!this.F) return null;
    const set = this.facing >= 0 ? this.F.R : this.F.L;
    if (this.ko) return set.ko[0];
    if (this.stun > 0 && this.state === 'hurt') return set.hurt[0];
    if (this.pose === 'attack') return set.attack[0];
    if (this.moving) return set.walk[Math.floor(this.animT / 7) % 4];
    const cyc = (this.t + this.id * 37) % 200;
    if (cyc > 190) return set.idle[2];
    return set.idle[Math.floor(this.t / 40) % 2];
  }
  drawShadow(g, cam) {
    if (this.noShadow) return;
    const s = shadowSpr(this.shadowW * (this.z > 0 ? Math.max(0.5, 1 - this.z / 40) : 1));
    g.drawImage(s, Math.round(this.x - cam.x - s.ax), Math.round(this.y - cam.y - s.ay));
  }
  draw(g, cam, w) {
    const spr = this.currentSprite();
    if (!spr) return;
    const x = Math.round(this.x - cam.x), y = Math.round(this.y - cam.y - this.z);
    const opts = {};
    if (this.flash > 0) opts.flash = this.flashCol;
    if (this.alpha !== undefined) opts.alpha = this.alpha;
    if (this.drawBehind) this.drawBehind(g, x, y, w);
    if (w && this.wading(w)) {
      g.save(); g.beginPath(); g.rect(x - 20, y - 40, 40, 37); g.clip();
      drawSprite(g, spr, x, y + 2, opts);
      g.restore();
      const ph = Math.floor((this.t / 10) % 2);
      g.fillStyle = PAL.white; g.fillRect(x - 5 - ph, y - 1, 3, 1); g.fillRect(x + 3 + ph, y - 1, 3, 1);
      g.fillStyle = PAL.cyan; g.fillRect(x - 2, y, 5, 1);
    } else {
      drawSprite(g, spr, x, y, opts);
    }
    if (this.drawFront) this.drawFront(g, x, y, w);
  }
  drawHpBar(g, cam) {
    if (this.hp >= this.maxHp || this.hp <= 0 || this.hideHp) return;
    const x = Math.round(this.x - cam.x - 7), y = Math.round(this.y - cam.y - this.height - 7 - this.z);
    g.fillStyle = PAL.black; g.fillRect(x - 1, y - 1, 16, 4);
    g.fillStyle = PAL.dpurple; g.fillRect(x, y, 14, 2);
    g.fillStyle = this.team === 'enemy' ? PAL.red2 : PAL.green;
    g.fillRect(x, y, Math.max(1, Math.round(14 * this.hp / this.maxHp)), 2);
  }
}

// ---------- Player ----------
const COMBO = [
  { dur: 17, hitAt: 3, active: 5, chainAt: 7, r: 21, spread: 1.05, dmg: 10, kb: 2.2, hitstop: 2, shake: 0, lunge: 1.4, rev: false },
  { dur: 17, hitAt: 3, active: 5, chainAt: 7, r: 21, spread: 1.05, dmg: 11, kb: 2.4, hitstop: 2, shake: 0, lunge: 1.4, rev: true },
  { dur: 26, hitAt: 6, active: 6, chainAt: 99, r: 25, spread: 1.4, dmg: 19, kb: 4.8, hitstop: 5, shake: 3, lunge: 2.4, rev: false },
];
const SKILLS = [
  { id: 'whirl', name: 'Whirlwind', cost: 30, key: 'L', desc: 'Spin and slash everything around you.' },
  { id: 'dash', name: 'Gale Dash', cost: 25, key: 'I', desc: 'Dash through enemies, cutting them down.' },
  { id: 'tide', name: 'Tidebreaker', cost: 50, key: 'O', desc: 'Leap and slam, unleashing a tidal shockwave.' },
];

class Player extends Actor {
  constructor(x, y) {
    super(x, y, G.save && G.save.flags.hatEarned ? 'captainHat' : 'captain');
    this.team = 'ally'; this.isPlayer = true; this.name = G.save ? G.save.capName : 'Rook';
    this.refreshStats();
    this.hp = this.maxHp;
    this.sp = 60; this.maxSp = 100;
    this.combo = 0; this.comboReset = 0; this.atkQueued = false;
    this.rollCd = 0; this.skill = null;
    this.hurtIframes = 60;
    this.weapon = 'cutlass';
    this.stepT = 0;
    this.shadowW = 11;
  }
  refreshStats() {
    const up = (G.save && G.save.upgrades) || {};
    this.maxHp = 100 + 25 * (up.coat || 0);
    this.atkMul = 1 + 0.22 * (up.blade || 0);
    this.speed = 1.35 + 0.12 * (up.boots || 0);
    if (this.hp > this.maxHp) this.hp = this.maxHp;
  }
  aimDir() {
    const a = this.aim;
    // snap to 8 directions
    const ang = Math.round(Math.atan2(a.y, a.x) / (Math.PI / 4)) * (Math.PI / 4);
    return { x: Math.cos(ang), y: Math.sin(ang), ang };
  }
  update(w) {
    this.tick();
    if (this.comboReset > 0 && --this.comboReset === 0) this.combo = 0;
    if (this.rollCd > 0) this.rollCd--;
    this.sp = Math.min(this.maxSp, this.sp + 0.1);
    if (this.dead || this.hp <= 0) { this.deadT = (this.deadT || 0) + 1; this.ko = true; return; }
    const ctrl = w.playerControl();
    // never stay trapped inside a solid (e.g. placed there by a cutscene): step out to the nearest free spot
    if (ctrl && !this.noclip && w.map.blocked(this.x - this.w / 2, this.y - this.h, this.w, this.h)) { const sp = w.findFree(this.x, this.y, this.w, this.h); this.x = sp.x; this.y = sp.y; }
    const ax = ctrl ? Input.axis() : { x: 0, y: 0 };
    if (ax.x || ax.y) { this.aim = { x: ax.x, y: ax.y }; }
    this.pose = null;
    switch (this.state) {
      case 'hurt': {
        this.stateT--; this.applyKnock(w);
        if (this.stateT <= 0) this.state = 'idle';
        break;
      }
      case 'idle': case 'move': {
        if (ctrl) {
          if (Input.pressed('interact') && w.interactTarget && !w.inCombat) { w.doInteract(); break; }
          if (Input.pressed('attack')) { this.startAttack(w, this.combo); break; }
          if (Input.pressed('dodge') && this.rollCd <= 0) { this.startRoll(w, ax); break; }
          if (Input.pressed('skill1')) { if (this.startSkill(w, 0)) break; }
          if (Input.pressed('skill2')) { if (this.startSkill(w, 1)) break; }
          if (Input.pressed('skill3')) { if (this.startSkill(w, 2)) break; }
        }
        const sp = this.speed * (this.wading(w) ? 0.72 : 1);
        this.moving = !!(ax.x || ax.y);
        if (this.moving) {
          this.move(w, ax.x * sp, ax.y * sp, { nudge: true });
          if (ax.x) this.facing = sign(ax.x);
          this.animT++;
          if (++this.stepT % 16 === 0) { FX.dust(w, this.x, this.y, 1, this.wading(w) ? PAL.white : PAL.beige); if (this.wading(w)) AudioSys.sfx('splash'); }
        } else this.animT = 0;
        this.applyKnock(w);
        break;
      }
      case 'attack': this.updAttack(w, ctrl, ax); break;
      case 'roll': this.updRoll(w); break;
      case 'skill': this.updSkill(w, ctrl, ax); break;
      case 'script': { this.applyKnock(w); break; }
    }
  }
  startAttack(w, n) {
    if (n > 2) n = 0;
    this.state = 'attack'; this.stateT = 0; this.combo = n; this.atkQueued = false;
    const d = this.aimDir();
    this.atkDir = d;
    if (Math.abs(d.x) > 0.1) this.facing = sign(d.x);
    const C = COMBO[n];
    this.kvx += d.x * C.lunge; this.kvy += d.y * C.lunge;
    AudioSys.sfx(n === 2 ? 'slash2' : 'slash');
    FX.slash(w, this, d.ang, C.r, C.spread, 10, n === 2 ? PAL.yellow : PAL.white, C.rev, n === 2 ? 5 : 4);
  }
  updAttack(w, ctrl, ax) {
    const C = COMBO[this.combo];
    this.stateT++;
    this.pose = this.stateT < C.dur - 4 ? 'attack' : null;
    if (ctrl && Input.pressed('attack')) this.atkQueued = true;
    if (ctrl && Input.pressed('dodge') && this.rollCd <= 0 && this.stateT > 4) { this.startRoll(w, ax); return; }
    if (this.stateT === C.hitAt) {
      const d = this.atkDir;
      w.addAttack({ owner: this, team: 'ally', shape: 'arc', x: this.x + d.x * 3, y: this.y - 7 + d.y * 3, r: C.r + 2, a: d.ang, spread: C.spread + 0.2, life: C.active, dmg: C.dmg * this.atkMul, kb: C.kb, hitstop: C.hitstop, shake: C.shake, follow: true, sfx: this.combo === 2 ? 'hitHeavy' : 'hit' });
    }
    if (ax.x || ax.y) this.move(w, ax.x * 0.25, ax.y * 0.25);
    this.applyKnock(w);
    if (this.stateT >= C.chainAt && this.atkQueued && this.combo < 2) { this.startAttack(w, this.combo + 1); return; }
    if (this.stateT >= C.dur) {
      this.state = 'idle';
      this.combo = this.combo >= 2 ? 0 : this.combo + 1;
      this.comboReset = 24;
      if (this.atkQueued) { this.startAttack(w, this.combo); }
    }
  }
  startRoll(w, ax) {
    let d = (ax && (ax.x || ax.y)) ? ax : { x: this.facing, y: 0 };
    const l = Math.hypot(d.x, d.y) || 1;
    this.rollDir = { x: d.x / l, y: d.y / l };
    if (Math.abs(this.rollDir.x) > 0.1) this.facing = sign(this.rollDir.x);
    this.state = 'roll'; this.stateT = 0; this.iframes = Math.max(this.iframes, 14);
    AudioSys.sfx('dodge'); FX.dust(w, this.x, this.y, 4);
  }
  updRoll(w) {
    this.stateT++;
    const s = lerp(3.3, 1.1, this.stateT / 18);
    this.move(w, this.rollDir.x * s, this.rollDir.y * s, { nudge: true });
    if (this.stateT % 4 === 0) FX.dust(w, this.x, this.y, 1);
    this.moving = true; this.animT += 2;
    if (this.stateT >= 18) { this.state = 'idle'; this.rollCd = 10; this.kvx = this.rollDir.x * 0.8; this.kvy = this.rollDir.y * 0.8; }
  }
  skillUnlocked(i) { return G.save && G.save.skills && G.save.skills[SKILLS[i].id]; }
  startSkill(w, i) {
    if (!this.skillUnlocked(i)) return false;
    const S = SKILLS[i];
    if (this.sp < S.cost) { AudioSys.sfx('deny'); FX.text(w, this.x, this.y - 24, 'Need SP!', PAL.lblue); return true; }
    this.sp -= S.cost;
    this.state = 'skill'; this.skill = S.id; this.stateT = 0;
    const d = this.aimDir(); this.skDir = d; if (Math.abs(d.x) > 0.1) this.facing = sign(d.x);
    this.skHits = new Set();
    if (S.id === 'whirl') { AudioSys.sfx('whirl'); }
    if (S.id === 'dash') { AudioSys.sfx('dash'); this.dashFrom = { x: this.x, y: this.y }; this.iframes = Math.max(this.iframes, 22); }
    if (S.id === 'tide') { AudioSys.sfx('charge'); this.iframes = Math.max(this.iframes, 30); }
    w.onPlayerSkill && w.onPlayerSkill(S.id);
    return true;
  }
  updSkill(w, ctrl, ax) {
    this.stateT++;
    const t = this.stateT;
    if (this.skill === 'whirl') {
      this.pose = 'attack';
      this.facing = (Math.floor(t / 3) % 2) ? 1 : -1;
      if (ax.x || ax.y) this.move(w, ax.x * 0.9, ax.y * 0.9, { nudge: true });
      if (t === 3 || t === 15 || t === 27) {
        w.addAttack({ owner: this, team: 'ally', shape: 'circle', x: this.x, y: this.y - 7, r: 28, life: 4, dmg: 12 * this.atkMul, kb: 3.2, hitstop: 2, shake: 1, follow: true, sfx: 'hit' });
        FX.slash(w, this, t * 0.5, 26, Math.PI, 10, PAL.white, false, 4);
        FX.slash(w, this, t * 0.5 + Math.PI, 26, Math.PI, 10, PAL.lblue, false, 3);
        if (t > 3) AudioSys.sfx('slash');
      }
      if (t >= 36) { this.state = 'idle'; }
    } else if (this.skill === 'dash') {
      this.pose = 'attack';
      const d = this.skDir;
      if (t <= 3) { this.z = 0; }
      else if (t <= 13) {
        const px0 = this.x, py0 = this.y;
        this.move(w, d.x * 7, d.y * 7);
        FX.afterimage(w, this);
        w.addAttack({ owner: this, team: 'ally', shape: 'line', x: px0, y: py0 - 7, x2: this.x, y2: this.y - 7, r: 10, life: 2, dmg: 22 * this.atkMul, kb: 3.5, hitstop: 3, shake: 2, hits: this.skHits, sfx: 'hitHeavy' });
      } else if (t === 14) { FX.dust(w, this.x, this.y, 6); FX.slash(w, this, d.ang, 22, 1.2, 10, PAL.cyan, false, 4); }
      if (t >= 24) this.state = 'idle';
    } else if (this.skill === 'tide') {
      this.pose = t > 18 ? 'attack' : null;
      if (t <= 14) { this.z = Math.sin(t / 14 * Math.PI / 2) * 20; }
      else if (t <= 18) { this.z = 20 * (1 - (t - 14) / 4); }
      if (t === 18) {
        this.z = 0;
        AudioSys.sfx('slam'); w.shake = Math.max(w.shake, 7); w.hitstop = Math.max(w.hitstop, 4);
        w.addAttack({ owner: this, team: 'ally', shape: 'ring', x: this.x, y: this.y - 4, r: 10, r1: 64, th: 12, life: 16, dmg: 32 * this.atkMul, kb: 5.5, hitstop: 4, shake: 0, hits: this.skHits, sfx: 'hitHeavy' });
        FX.ring(w, this.x, this.y - 2, 6, 64, 18, PAL.cyan); FX.ring(w, this.x, this.y - 2, 4, 48, 16, PAL.white);
        FX.splash(w, this.x, this.y, 16); FX.dust(w, this.x, this.y, 10, PAL.lgray);
      }
      if (t >= 36) this.state = 'idle';
    }
    this.applyKnock(w);
  }
  hurt(w, dmg, fx, fy, kb, opts) {
    const ok = super.hurt(w, dmg, fx, fy, kb, opts);
    if (ok) {
      AudioSys.sfx('hurt');
      w.shake = Math.max(w.shake, 3); w.hitstop = Math.max(w.hitstop, 3);
      if (this.state !== 'skill' || this.skill !== 'tide') { this.state = 'hurt'; this.stateT = 10; this.stun = 10; this.z = 0; }
      w.flashRed = 8;
    }
    return ok;
  }
  onDown(w) { this.ko = true; this.state = 'dead'; this.deadT = 0; w.onPlayerDown(); }
  currentSprite() {
    if (this.state === 'roll') {
      const set = this.facing >= 0 ? this.F.R : this.F.L;
      return set.idle[0];
    }
    return super.currentSprite();
  }
  draw(g, cam, w) {
    if (this.state === 'roll') {
      const set = this.facing >= 0 ? this.F.R : this.F.L;
      const spr = set.idle[0];
      const k = Math.floor(this.stateT / 3) % 4;
      const x = Math.round(this.x - cam.x), y = Math.round(this.y - cam.y);
      drawRot(g, this.iframes > 0 && this.stateT % 4 < 2 ? silhouette(spr, PAL.lblue) : spr, x, y - 9, k * Math.PI / 2 * this.facing, spr.width / 2, spr.height / 2 + 2);
      return;
    }
    // blink while invulnerable after being hit
    if (this.iframes > 0 && this.state !== 'skill' && this.state !== 'roll' && this.t % 6 < 3 && this.hp > 0 && !this.ko) return;
    super.draw(g, cam, w);
  }
  drawFront(g, x, y) {
    // weapon in hand
    if (this.ko) return;
    const spr = weaponSpr(this.weapon);
    const f = this.facing;
    if (this.state === 'attack' || (this.state === 'skill' && this.skill !== 'tide')) {
      let ang;
      if (this.state === 'attack') {
        const C = COMBO[this.combo], t = clamp(this.stateT / (C.hitAt + C.active), 0, 1);
        const d = this.atkDir.ang;
        const sw = C.spread * 1.1;
        ang = C.rev ? d + sw - sw * 2 * easeOut(t) : d - sw + sw * 2 * easeOut(t);
      } else if (this.skill === 'whirl') ang = this.stateT * 0.9;
      else ang = this.skDir.ang;
      drawRot(g, spr, x, y - 8, ang, 2, 3);
    } else if (this.state === 'skill' && this.skill === 'tide') {
      const up = this.stateT < 18;
      drawRot(g, spr, x + f * 2, y - 10, up ? -Math.PI / 2 - f * 0.4 : Math.PI / 2 * f + (f < 0 ? Math.PI : 0) * 0 + (f > 0 ? 0 : Math.PI), 2, 3);
    } else {
      // resting: blade pointing down-back
      const bob = this.moving ? (Math.floor(this.animT / 7) % 2) : 0;
      if (f > 0) drawRot(g, spr, x + 5, y - 6 - bob, 1.25, 2, 3);
      else drawRot(g, spr, x - 5, y - 6 - bob, Math.PI - 1.25, 2, 3, true);
    }
  }
}

// ---------- NPC ----------
class NPC extends Actor {
  constructor(def) {
    super(def.x * TS, def.y * TS, def.char);
    this.npcId = def.id; this.name = def.name || '???'; this.def = def;
    this.team = 'neutral';
    this.facing = def.face || 1;
    this.home = { x: this.x, y: this.y };
    this.wander = def.wander || 0; this.wanderT = irnd(60, 200); this.target = null;
    this.speed = 0.45;
    this.solidActor = true;
    this.seated = def.seated;
  }
  update(w) {
    this.tick();
    if (this.talking || this.scripted) { this.moving = false; if (this.walkTo) this.stepWalk(w); return; }
    if (this.walkTo) { this.stepWalk(w); return; }
    if (this.wander && !this.seated) {
      if (this.target) {
        const dx = this.target.x - this.x, dy = this.target.y - this.y, d = Math.hypot(dx, dy);
        if (d < 1.5 || this.wanderT-- <= 0) { this.target = null; this.moving = false; this.wanderT = irnd(90, 260); }
        else { const r = this.move(w, dx / d * this.speed, dy / d * this.speed); this.moving = true; this.animT++; if (Math.abs(dx) > 0.5) this.facing = sign(dx); if (r.hitX && r.hitY) this.target = null; }
      } else if (--this.wanderT <= 0) {
        const R = this.wander * TS;
        this.target = { x: this.home.x + rnd(-R, R), y: this.home.y + rnd(-R, R) };
        this.wanderT = 200;
      }
    }
  }
  stepWalk(w) {
    const t = this.walkTo;
    const dx = t.x - this.x, dy = t.y - this.y, d = Math.hypot(dx, dy);
    const sp = t.speed || 0.9;
    if (d <= sp || (t.stuck || 0) > 45) { this.x = t.x; this.y = t.y; this.walkTo = null; this.moving = false; return; }
    if (t.best === undefined || d < t.best - 0.4) { t.best = d; t.stuck = 0; } else t.stuck = (t.stuck || 0) + 1;
    if (this.noclip || t.noclip) { this.x += dx / d * sp; this.y += dy / d * sp; }
    else this.move(w, dx / d * sp, dy / d * sp);
    this.moving = true; this.animT++;
    if (Math.abs(dx) > 0.3) this.facing = sign(dx);
  }
}

// ---------- Projectile ----------
class Projectile {
  constructor(o) {
    Object.assign(this, { x: 0, y: 0, z: 6, vx: 0, vy: 0, r: 3, dmg: 8, kb: 2, team: 'enemy', life: 120, kind: 'ball', pierce: false, fly: false, dead: false, t: 0 }, o);
    this.hits = new Set();
  }
  update(w) {
    this.t++;
    if (this.kind === 'bomb' || this.kind === 'flask' || this.kind === 'lob') {
      // arcing lob towards target point
      const p = Math.min(1, this.t / this.dur);
      this.x = lerp(this.sx, this.tx, p); this.y = lerp(this.sy, this.ty, p);
      this.z = Math.sin(p * Math.PI) * this.arc;
      if (p >= 1) { this.explode(w); this.dead = true; }
      return;
    }
    this.x += this.vx; this.y += this.vy;
    if (this.homing && this.target && this.target.alive) {
      const a = angTo(this.x, this.y, this.target.x, this.target.y - 7), s = Math.hypot(this.vx, this.vy);
      const cur = Math.atan2(this.vy, this.vx);
      const na = cur + clamp(angDiff(cur, a), -this.homing, this.homing);
      this.vx = Math.cos(na) * s; this.vy = Math.sin(na) * s;
    }
    if (--this.life <= 0) { this.dead = true; this.onEnd && this.onEnd(w, this); return; }
    if (!this.fly) {
      const m = w.map.matAtPx(this.x, this.y);
      if ((MATS[m].solid && !MATS[m].water) || w.map.blocked(this.x - 1, this.y - 1, 2, 2) && !MATS[m].water) {
        this.dead = true; FX.spark(w, this.x, this.y - this.z, 4, PAL.lgray, 1.2); this.onEnd && this.onEnd(w, this); return;
      }
    }
    for (const a of w.actors) {
      if (!a.alive || a.team === this.team || a.team === 'neutral' || this.hits.has(a) || a === this.owner) continue;
      if (dist(this.x, this.y - this.z, a.x, a.y - 7) <= this.r + a.bodyR) {
        this.hits.add(a);
        if (this.onHitActor) this.onHitActor(w, a, this);
        else if (a.hurt(w, this.dmg, this.x - this.vx * 3, this.y - this.vy * 3, this.kb, { source: this.owner })) { AudioSys.sfx('hit'); w.onDealt && w.onDealt(this.owner, a, this.dmg); }
        if (!this.pierce) { this.dead = true; this.onEnd && this.onEnd(w, this); return; }
      }
    }
  }
  explode(w) {
    if (this.onLand) { this.onLand(w, this); return; }
    AudioSys.sfx('explode'); w.shake = Math.max(w.shake, 4);
    FX.poof(w, this.x, this.y, PAL.dgray); FX.spark(w, this.x, this.y - 4, 10, PAL.orange, 2.5); FX.ring(w, this.x, this.y - 2, 4, this.blast || 24, 12, PAL.orange);
    w.addAttack({ owner: this.owner, team: this.team, shape: 'circle', x: this.x, y: this.y - 4, r: this.blast || 24, life: 3, dmg: this.dmg, kb: 4, hitstop: 3, shake: 2 });
  }
  drawShadow(g, cam) { if (this.z > 1) { const s = shadowSpr(6); g.drawImage(s, Math.round(this.x - cam.x - s.ax), Math.round(this.y - cam.y - s.ay)); } }
  draw(g, cam) {
    const x = Math.round(this.x - cam.x), y = Math.round(this.y - cam.y - this.z);
    if (this.drawFn) { this.drawFn(g, x, y, this); return; }
    switch (this.kind) {
      case 'ball': pcircle(g, x, y, 2.5, PAL.black); pcircle(g, x, y, 1.6, this.col || PAL.dgray); px(g, x - 1, y - 1, PAL.lgray); break;
      case 'bullet': pcircle(g, x, y, 2, PAL.black); pcircle(g, x, y, 1, this.col || PAL.yellow); break;
      case 'bomb': { pcircle(g, x, y, 3.5, PAL.black); pcircle(g, x, y, 2.5, PAL.navy); px(g, x - 1, y - 1, PAL.dgray); const f = this.t % 6 < 3; px(g, x + 2, y - 4, f ? PAL.yellow : PAL.orange); break; }
      case 'dart': pline(g, x - this.vx, y - this.vy, x, y, PAL.lgreen); px(g, x, y, PAL.white); break;
      case 'orb': pcircle(g, x, y, 3.5, this.col2 || PAL.dlav); pcircle(g, x, y, 2.2, this.col || PAL.lav); px(g, x - 1, y - 1, PAL.white); break;
      case 'knife': { const a = Math.atan2(this.vy, this.vx); pline(g, x - Math.cos(a) * 4, y - Math.sin(a) * 4, x + Math.cos(a) * 2, y + Math.sin(a) * 2, PAL.white); px(g, x - Math.round(Math.cos(a) * 4), y - Math.round(Math.sin(a) * 4), PAL.purple); break; }
      case 'fire': pcircle(g, x, y, 3.2 + (this.t % 4 < 2 ? 0.5 : 0), PAL.orange); pcircle(g, x, y, 1.8, PAL.yellow); break;
      case 'wave': { const a = Math.atan2(this.vy, this.vx); parc(g, x, y, 5, 8, a - 0.9, a + 0.9, this.col || PAL.lav); break; }
      case 'swordwave': { const a = Math.atan2(this.vy, this.vx); parc(g, x, y, 7, 12, a - 1.1, a + 1.1, PAL.cyan); parc(g, x, y, 9, 11, a - 0.8, a + 0.8, PAL.white); break; }
      case 'flask': pcircle(g, x, y, 2.5, PAL.black); pcircle(g, x, y, 1.6, this.col || PAL.lgreen); px(g, x, y - 3, PAL.beige); break;
      case 'lob': pcircle(g, x, y, 3, PAL.black); pcircle(g, x, y, 2, this.col || PAL.lgreen); break;
      case 'feather': pline(g, x - 3, y, x + 3, y, PAL.white); px(g, x, y - 1, PAL.lgray); break;
      default: pcircle(g, x, y, 2, PAL.white);
    }
  }
}

// ---------- Pickup ----------
class Pickup {
  constructor(x, y, kind, value) {
    this.x = x; this.y = y; this.z = 4; this.vz = rnd(1.5, 2.6); this.vx = rnd(-1, 1); this.vy = rnd(-0.6, 0.6);
    this.kind = kind; this.value = value; this.t = 0; this.dead = false; this.life = 900;
  }
  update(w) {
    this.t++;
    if (this.z > 0 || this.vz > 0) { this.z += this.vz; this.vz -= 0.18; if (this.z <= 0) { this.z = 0; this.vz = Math.abs(this.vz) > 0.8 ? -this.vz * 0.45 : 0; } }
    this.x += this.vx; this.y += this.vy; this.vx *= 0.9; this.vy *= 0.9;
    if (w.map.blocked(this.x - 2, this.y - 2, 4, 4)) { this.x -= this.vx * 2; this.y -= this.vy * 2; this.vx = 0; this.vy = 0; }
    const p = w.player;
    if (p && p.alive && this.t > 20) {
      const d = dist(this.x, this.y, p.x, p.y - 4);
      if (d < 48) { const a = angTo(this.x, this.y, p.x, p.y - 4), s = 2.6 * (1 - d / 60) + 0.6; this.x += Math.cos(a) * s; this.y += Math.sin(a) * s; }
      if (d < 7) { this.collect(w); }
    }
    if (--this.life <= 0) this.dead = true;
  }
  collect(w) {
    this.dead = true;
    if (this.kind === 'coin') { G.save.gold += this.value; AudioSys.sfx('coin'); FX.text(w, this.x, this.y - 10, '+' + this.value, PAL.gold); }
    else if (this.kind === 'heart') { w.player.heal(w, this.value); AudioSys.sfx('heart'); }
    else if (this.kind === 'sp') { w.player.sp = Math.min(w.player.maxSp, w.player.sp + this.value); AudioSys.sfx('heart'); FX.text(w, this.x, this.y - 10, '+SP', PAL.cyan); }
  }
  drawShadow(g, cam) { const s = shadowSpr(6); g.drawImage(s, Math.round(this.x - cam.x - s.ax), Math.round(this.y - cam.y - s.ay)); }
  draw(g, cam) {
    if (this.life < 120 && this.t % 8 < 4) return;
    const x = Math.round(this.x - cam.x), y = Math.round(this.y - cam.y - this.z - 3);
    if (this.kind === 'coin') {
      const f = Math.floor(this.t / 6) % 4, w = [4, 3, 1, 3][f];
      g.fillStyle = PAL.black; g.fillRect(x - Math.ceil(w / 2) - 1, y - 3, w + 2, 7); g.fillRect(x - Math.ceil(w / 2), y - 4, w, 9);
      g.fillStyle = PAL.gold; g.fillRect(x - Math.ceil(w / 2), y - 3, w, 7);
      g.fillStyle = PAL.yellow; g.fillRect(x - Math.ceil(w / 2), y - 3, Math.max(1, w - 2), 2);
    } else if (this.kind === 'heart') {
      drawText(g, '♥', x - 2, y - 4, PAL.red2, { outline: PAL.black });
    } else if (this.kind === 'sp') {
      pcircle(g, x, y, 3, PAL.black); pcircle(g, x, y, 2, PAL.cyan); px(g, x - 1, y - 1, PAL.white);
    }
  }
}

const CREATURES = {};
function creature(kind) {
  if (CREATURES[kind]) return CREATURES[kind];
  const mk = CREATURE_ART[kind];

  const R = frames.map(c => { c.ax = c.ax !== undefined ? c.ax : c.width / 2; c.ay = c.ay !== undefined ? c.ay : c.height - 1; return c; });
  const L = R.map(c => { const f = flipCanvasH(c); f.ax = c.width - c.ax; f.ay = c.ay; return f; });
  return CREATURES[kind] = { R, L };
}
function crabFrame(f, pal, big) {
  const b = new PixelBuf(22, 16);
  const [main, dark, light] = pal;
  // legs
  const lo = f ? 1 : 0;
  for (let i = 0; i < 3; i++) {
    b.line(6 - i * 2, 10, 3 - i * 2, 14 - (i + lo) % 2, dark);
    b.line(15 + i * 2, 10, 18 + i * 2, 14 - (i + 1 - lo) % 2, dark);
  }
  b.ellipse(11, 9, 7.5, 4.2, main); b.ellipse(11, 8, 6, 2.6, light); b.hline(5, 17, 12, dark);
  // eyes
  b.vline(8, 3, 6, dark); b.vline(14, 3, 6, dark);
  b.set(8, 2, PAL.black); b.set(14, 2, PAL.black); b.set(8, 1, PAL.white); b.set(14, 1, PAL.white);
  // claws
  const cy = f ? 4 : 5;
  b.circle(2.5, cy + 1, 2.4, main); b.circle(19.5, cy + 1, 2.4, main);
  b.set(1, cy - 1, main); b.set(3, cy - 1, main); b.set(2, cy - 1, 0); b.set(20, cy - 1, 0); b.set(19, cy - 1, main); b.set(21, cy - 1, main);
  b.line(4, 8, 6, 9, dark); b.line(18, 8, 16, 9, dark);
  if (big) { b.set(9, 7, PAL.beige); b.set(13, 8, PAL.beige); b.set(12, 6, PAL.lgray); }
  b.outline(PAL.black);
  const c = b.toCanvas(); c.ax = 11; c.ay = 15; return c;
}

// ---------- Enemy ----------
class Enemy extends Actor {
  constructor(x, y, type, opts = {}) {
    const def = ENEMY_DEFS[type];
    super(x, y, def.char || null);
    this.def = def; this.type = type; this.name = def.name;
    this.team = 'enemy';
    const diff = opts.diff || 1;
    this.maxHp = this.hp = Math.round(def.hp * (def.ai === 'boss' ? (0.8 + diff * 0.1) : diff));
    this.dmg = def.dmg * (0.7 + diff * 0.3);
    this.speed = def.speed * (opts.speedMul || 1);
    this.bodyR = def.bodyR || 6; this.height = def.height || 18;
    if (def.w) this.w = def.w; if (def.h) this.h = def.h;
    this.kbResist = def.kbResist !== undefined ? def.kbResist : 1;
    this.shadowW = def.shadow || (def.big ? 22 : 11);
    this.weapon = def.weapon;
    this.aggro = opts.aggro !== undefined ? opts.aggro : false;
    this.home = { x, y };
    this.cd = irnd(30, 80);
    this.state = 'idle'; this.stateT = 0;
    this.fly = !!def.fly; this.moveOpts = this.fly ? { fly: true } : undefined;
    if (def.alpha) this.alpha = def.alpha;
    this.isBoss = def.ai === 'boss';
    if (this.isBoss) {
      this.bossF = def.big && def.char ? getCharBig(def.char) : null;
      this.hurtIframes = 4;
      this.phase = 1;
    }
    if (def.sprite) { this.cre = creature(def.sprite); }
    if (def.prop) { this.propSpr = propSprite(def.prop, 0); this.noKnock = true; }
    this.wanderT = irnd(30, 120);
    this.strafe = Math.random() < 0.5 ? 1 : -1;
    this.spawnT = opts.spawnFx ? 20 : 0;
    this.dropMul = opts.noDrop ? 0 : 1;
  }
  currentSprite() {
    if (this.propSpr) return this.propSpr;
    if (this.cre) {
      const set = this.facing >= 0 ? this.cre.R : this.cre.L;
      const n = set.length;
      const fr = this.moving || this.def.sprite === 'wisp' ? Math.floor(this.t / (this.def.sprite === 'wisp' ? 6 : 8)) % n : 0;
      return set[fr];
    }
    if (this.bossF) {
      const F = this.bossF, set = this.facing >= 0 ? F.R : F.L;
      if (this.defeated) return set.hurt[0];
      if (this.pose === 'attack') return set.attack[0];
      if (this.moving) return set.walk[Math.floor(this.animT / 8) % 4];
      return set.idle[Math.floor(this.t / 40) % 2];
    }
    if (this.defeated) { const set = this.facing >= 0 ? this.F.R : this.F.L; return set.hurt[0]; }
    return super.currentSprite();
  }
  target(w) {
    let best = null, bd = 1e9;
    for (const a of w.actors) {
      if (a.team !== 'ally' || !a.alive || a.untargetable) continue;
      const d = dist(this.x, this.y, a.x, a.y) * (a.isPlayer ? 0.85 : 1) * (a.taunt ? 0.5 : 1);
      if (d < bd) { bd = d; best = a; }
    }
    return best;
  }
  update(w) {
    this.tick();
    this.pose = null;
    if (this.spawnT > 0) { this.spawnT--; return; }
    if (this.dying) { this.dieT++; if (this.dieT > (this.isBoss ? 70 : 14)) this.finishDeath(w); else if (this.isBoss && this.dieT % 8 === 0) { FX.poof(w, this.x + rnd(-14, 14), this.y - rnd(0, 30), PAL.lgray); FX.spark(w, this.x + rnd(-10, 10), this.y - rnd(4, 30), 8, PAL.orange, 2.5); AudioSys.sfx('explode'); w.shake = Math.max(w.shake, 3); } return; }
    if (this.defeated) { this.moving = false; return; }
    if (this.poison > 0) { this.poison--; if (this.poison % 30 === 0) { this.hurt(w, 3, this.x, this.y, 0, { poison: true }); this.flashCol = PAL.lgreen; } }
    if (this.slowT > 0) this.slowT--;
    if (this.stun > 0 && !this.isBoss) { this.applyKnock(w); this.moving = false; return; }
    if ((w.cutscene || w.dialog) && !this.isBoss && this.state !== 'charge') { this.moving = false; this.applyKnock(w); if (this.state === 'windup') this.state = 'chase'; return; }
    if (w.dialog) { this.moving = false; return; }
    const tgt = this.target(w);
    this.tgt = tgt;
    if (!this.aggro && tgt && (dist(this.x, this.y, tgt.x, tgt.y) < (this.def.aggroR || 96))) { this.aggro = true; if (!this.isBoss) FX.text(w, this.x, this.y - this.height - 6, '!', PAL.yellow); }
    const ai = ENEMY_AI[this.def.ai];

  }
  spd() { return this.speed * (this.slowT > 0 ? 0.5 : 1); }
  stepToward(w, tx, ty, s) {

  }
  wanderHome(w) {
    if (--this.wanderT <= 0) { this.wtx = this.home.x + rnd(-40, 40); this.wty = this.home.y + rnd(-30, 30); this.wanderT = irnd(90, 200); }

  }
  hurt(w, dmg, fx, fy, kb, opts = {}) {
    if (this.spawnT > 0 || this.dying || this.defeated) return false;
    const ok = super.hurt(w, dmg, fx, fy, kb, opts);
    if (ok) {
      this.aggro = true;
      if (!this.isBoss && this.state === 'windup' && dmg > 14) { this.state = 'recover'; this.stateT = 20; }
      if (!this.isBoss) this.stun = Math.max(this.stun, 8);

    }
    return ok;
  }
  onDown(w) {
    if (this.def.noDeath) { this.defeated = true; this.hp = 1; this.invuln = true; this.mv = null; this.markers = []; w.onEnemyDefeated && w.onEnemyDefeated(this); return; }
    this.dying = true; this.dieT = 0; this.invuln = true;
    AudioSys.sfx(this.isBoss ? 'explode' : 'poof');

  }
  finishDeath(w) {
    this.dead = true;

    const [g0, g1] = this.def.gold || [1, 3];
    let gold = Math.round(irnd(g0, g1) * this.dropMul);
    const coins = [];
    while (gold > 0) { const v = gold >= 10 ? 5 : 1; coins.push(v); gold -= v; if (coins.length > 30) break; }
    for (const v of coins) w.addEnt(new Pickup(this.x, this.y - 4, 'coin', v));
    if (this.dropMul && Math.random() < (this.isBoss ? 1 : 0.22)) w.addEnt(new Pickup(this.x, this.y - 4, 'heart', 22));
    if (this.dropMul && Math.random() < 0.12) w.addEnt(new Pickup(this.x, this.y - 4, 'sp', 25));
    G.save.stats.kills = (G.save.stats.kills || 0) + 1;
    w.onEnemyDefeated && w.onEnemyDefeated(this);
  }
  draw(g, cam, w) {
    if (this.spawnT > 0) { if (this.spawnT % 4 < 2) return; }
    if (this.dying && !this.isBoss) { this.flash = 2; this.flashCol = PAL.white; }
    if (this.isBoss && this.dying && this.dieT % 6 < 3) { this.flash = 1; this.flashCol = PAL.white; }
    // telegraph flash during windup
    if (this.state === 'windup' && this.stateT % 8 < 3 && !this.flash) { this.flash = 1; this.flashCol = this.teleCol || PAL.red2; }
    if (this.phaseOut) this.alpha = 0.35; else if (this.def.alpha) this.alpha = this.def.alpha;
    super.draw(g, cam, w);
    if (this.state === 'windup' && this.stateT > (this.windMax || 20) - 10 && !this.isBoss) drawText(g, '!', Math.round(this.x - cam.x) - 1, Math.round(this.y - cam.y - this.height - 12), PAL.yellow, { outline: PAL.black });
  }
  drawFront(g, x, y) {
    if (!this.weapon || this.dying || this.defeated) return;
    const spr = weaponSpr(this.weapon);
    const f = this.facing, big = !!this.bossF;

    if (this.swingT > 0) {
      const t = 1 - this.swingT / this.swingMax;

      drawRot(g, spr, x, hy, ang, 2, 3);
    } else if (this.state === 'windup') {
      drawRot(g, spr, x - f * 2, hy - 2, f > 0 ? -2.2 : -0.9, 2, 3);
    } else if (this.weapon === 'rifle') {
      drawRot(g, spr, x + f * 2, hy + 1, this.aimA !== undefined ? this.aimA : (f > 0 ? 0 : Math.PI), 3, 3, f < 0 && this.aimA === undefined);
    } else {

    }

  drawBehind(g, x, y, w) {

    }

  }
  swing(w, ang, r, spread, dmg, kb, opts = {}) {

  }
  shoot(w, ang, o = {}) {

    return p;
  }
}

// ---------- AI behaviours ----------
const ENEMY_AI = {
  none(w, e) { e.moving = false; e.kvx *= 0.5; e.kvy *= 0.5; },
  melee(w, e, tgt) {
    if (!e.aggro || !tgt) return e.wanderHome(w);
    const d = dist(e.x, e.y, tgt.x, tgt.y);
    if (e.cd > 0) e.cd--;
    switch (e.state) {
      case 'idle': case 'chase': {
        e.state = 'chase';
        const range = e.def.range || 20;
        const canAtk = w.tokenFree(e, tgt);
        // surround the target: each enemy prefers its own angle slot; wait further out without a token
        const slotA = (e.id * 2.39996) % (Math.PI * 2);
        const want = canAtk ? range - 4 : range + 16;
        const gx = tgt.x + Math.cos(slotA) * want, gy = tgt.y + Math.sin(slotA) * want * 0.7;
        if (dist(e.x, e.y, gx, gy) > 3) e.stepToward(w, gx, gy, e.spd() * (canAtk ? 1 : 0.7));
        else { e.moving = false; }
        e.facing = sign(tgt.x - e.x) || e.facing;
        if (d <= range + 6 && e.cd <= 0 && canAtk) { e.state = 'windup'; e.stateT = e.windMax = e.def.windup || 22; e.facing = sign(tgt.x - e.x) || e.facing; e.moving = false; }
        break;
      }
      case 'windup': {
        e.moving = false;
        if (--e.stateT <= 0) {
          const a = angTo(e.x, e.y - 7, tgt.x, tgt.y - 7);
          e.kvx += Math.cos(a) * 1.6; e.kvy += Math.sin(a) * 1.6;
          e.swing(w, a, e.def.reach || 22, 1.1, e.dmg, 2.6);
          e.state = 'recover'; e.stateT = 26; e.cd = irnd(40, 90);
        }
        break;
      }
      case 'recover': { e.moving = false; if (--e.stateT <= 0) e.state = 'chase'; break; }
    }
  },
  brute(w, e, tgt) {
    if (!e.aggro || !tgt) return e.wanderHome(w);
    const d = dist(e.x, e.y, tgt.x, tgt.y);
    if (e.cd > 0) e.cd--;
    if (e.state === 'windup') {
      e.moving = false; e.teleCol = PAL.orange;
      if (--e.stateT <= 0) {
        AudioSys.sfx('slam'); w.shake = Math.max(w.shake, 4);
        const a = angTo(e.x, e.y, tgt.x, tgt.y);
        const sx = e.x + Math.cos(a) * 12, sy = e.y + Math.sin(a) * 8;
        w.addAttack({ owner: e, team: 'enemy', shape: 'circle', x: sx, y: sy - 4, r: 24, life: 4, dmg: e.dmg, kb: 4.5, hitstop: 4, shake: 2 });
        FX.ring(w, sx, sy, 4, 26, 14, PAL.beige); FX.dust(w, sx, sy, 8, PAL.lgray);
        e.swingT = e.swingMax = 10; e.swingA = a;
        e.state = 'recover'; e.stateT = 40; e.cd = irnd(60, 100);
      }
      return;
    }
    if (e.state === 'recover') { e.moving = false; if (--e.stateT <= 0) e.state = 'chase'; return; }
    e.state = 'chase';
    if (d > 24) e.stepToward(w, tgt.x, tgt.y, e.spd()); else e.moving = false;
    if (d < 34 && e.cd <= 0 && w.tokenFree(e, tgt)) { e.state = 'windup'; e.stateT = e.windMax = 36; e.facing = sign(tgt.x - e.x) || e.facing; }
  },
  ranged(w, e, tgt) {
    if (!e.aggro || !tgt) return e.wanderHome(w);
    const d = dist(e.x, e.y, tgt.x, tgt.y);
    if (e.cd > 0) e.cd--;
    e.aimA = angTo(e.x, e.y - 8, tgt.x, tgt.y - 7);
    if (e.state === 'windup') {
      e.moving = false; e.aimLine = true; e.facing = sign(tgt.x - e.x) || e.facing;
      if (--e.stateT <= 0) {
        e.aimLine = false;
        const kind = e.def.proj || 'bullet';
        if (kind === 'dart') { for (const o of [-0.18, 0, 0.18]) e.shoot(w, e.aimA + o, { kind: 'dart', vx: Math.cos(e.aimA + o) * 2.8, vy: Math.sin(e.aimA + o) * 2.8, dmg: e.dmg * 0.7, onHitActor: (ww, a, p) => { if (a.hurt(ww, p.dmg, p.x, p.y, 1)) { a.poison = 150; AudioSys.sfx('hit'); } } }); AudioSys.sfx('pew'); }
        else { e.shoot(w, e.aimA, { vx: Math.cos(e.aimA) * 2.6, vy: Math.sin(e.aimA) * 2.6 }); AudioSys.sfx('gun'); FX.spark(w, e.x + Math.cos(e.aimA) * 12, e.y - 8 + Math.sin(e.aimA) * 12, 4, PAL.yellow, 1.5); }
        e.kvx -= Math.cos(e.aimA) * 1.2; e.kvy -= Math.sin(e.aimA) * 1.2;
        e.state = 'recover'; e.stateT = 20; e.cd = irnd(70, 130) * (e.def.rate || 1);
      }
      return;
    }
    if (e.state === 'recover') { e.moving = false; if (--e.stateT <= 0) e.state = 'chase'; return; }
    e.state = 'chase';
    const pref = e.def.pref || 84;
    if (d > pref + 24) e.stepToward(w, tgt.x, tgt.y, e.spd());
    else if (d < pref - 30) { const a = angTo(tgt.x, tgt.y, e.x, e.y); e.stepToward(w, e.x + Math.cos(a) * 10, e.y + Math.sin(a) * 10, e.spd()); }
    else { const a = angTo(tgt.x, tgt.y, e.x, e.y) + Math.PI / 2 * e.strafe; e.stepToward(w, e.x + Math.cos(a) * 10, e.y + Math.sin(a) * 10, e.spd() * 0.5); if (Math.random() < 0.01) e.strafe *= -1; }
    e.facing = sign(tgt.x - e.x) || e.facing;
    if (e.cd <= 0 && d < 150 && w.map.los(e.x, e.y - 6, tgt.x, tgt.y - 6)) { e.state = 'windup'; e.stateT = e.windMax = 34; e.moving = false; }
  },
  bomber(w, e, tgt) {
    if (!e.aggro || !tgt) return e.wanderHome(w);
    const d = dist(e.x, e.y, tgt.x, tgt.y);
    if (e.cd > 0) e.cd--;
    if (e.state === 'windup') {
      e.moving = false;
      if (--e.stateT <= 0) {
        const tx = tgt.x + tgt.kvx * 10 + rnd(-8, 8), ty = tgt.y + tgt.kvy * 10 + rnd(-6, 6);
        if (e.def.stink) e.lob(w, tx, ty, { kind: 'lob', col: PAL.lgreen, dmg: e.dmg * 0.6, onLand: (ww, p) => { poisonCloud(ww, p.x, p.y, 'enemy', e.dmg * 0.25, p); } });
        else e.lob(w, tx, ty);
        e.swingT = e.swingMax = 8; e.swingA = -Math.PI / 2;
        e.state = 'recover'; e.stateT = 24; e.cd = irnd(80, 130);
      }
      return;
    }
    if (e.state === 'recover') { e.moving = false; if (--e.stateT <= 0) e.state = 'chase'; return; }
    e.state = 'chase';
    if (d > 110) e.stepToward(w, tgt.x, tgt.y, e.spd());
    else if (d < 60) { const a = angTo(tgt.x, tgt.y, e.x, e.y); e.stepToward(w, e.x + Math.cos(a) * 10, e.y + Math.sin(a) * 10, e.spd()); }
    else e.moving = false;
    e.facing = sign(tgt.x - e.x) || e.facing;
    if (e.cd <= 0 && d < 130) { e.state = 'windup'; e.stateT = e.windMax = 24; }
  },
  charger(w, e, tgt) {
    if (!e.aggro || !tgt) return e.wanderHome(w);
    if (e.cd > 0) e.cd--;
    const d = dist(e.x, e.y, tgt.x, tgt.y);
    if (e.state === 'windup') {
      e.moving = (e.stateT % 6 < 3); e.animT++;
      if (e.stateT % 8 === 0) FX.dust(w, e.x - e.facing * 6, e.y, 2);
      if (--e.stateT <= 0) { e.state = 'charge'; e.stateT = 50; e.chA = angTo(e.x, e.y, tgt.x, tgt.y); e.facing = sign(Math.cos(e.chA)) || e.facing; AudioSys.sfx('dash'); e.chHits = new Set(); }
      return;
    }
    if (e.state === 'charge') {
      const s = 3.3;
      const r = e.move(w, Math.cos(e.chA) * s, Math.sin(e.chA) * s);
      e.moving = true; e.animT += 2;
      w.addAttack({ owner: e, team: 'enemy', shape: 'circle', x: e.x, y: e.y - 6, r: e.bodyR + 4, life: 1, dmg: e.dmg, kb: 4, hitstop: 3, hits: e.chHits });
      if (e.t % 4 === 0) FX.dust(w, e.x, e.y, 1);
      if (r.hitX || r.hitY) { e.state = 'stunned'; e.stateT = 50; w.shake = Math.max(w.shake, 3); AudioSys.sfx('hitHeavy'); FX.star(w, e.x, e.y - 14, 4); }
      else if (--e.stateT <= 0) { e.state = 'recover'; e.stateT = 30; }
      return;
    }
    if (e.state === 'stunned' || e.state === 'recover') { e.moving = false; if (--e.stateT <= 0) { e.state = 'chase'; e.cd = irnd(40, 80); } return; }
    e.state = 'chase';
    if (d > 60) e.stepToward(w, tgt.x, tgt.y, e.spd()); else e.moving = false;
    if (e.cd <= 0 && d < 120) { e.state = 'windup'; e.stateT = e.windMax = 34; e.facing = sign(tgt.x - e.x) || e.facing; }
  },
  crab(w, e, tgt) {
    if (!e.aggro || !tgt) {
      // sideways scuttle
      if (--e.wanderT <= 0) { e.wdir = Math.random() < 0.5 ? -1 : 1; e.wanderT = irnd(40, 120); }
      if (e.wanderT > 30 && dist(e.x, e.y, e.home.x, e.home.y) < 60) { e.move(w, (e.wdir || 1) * 0.5, 0); e.moving = true; } else e.moving = false;
      return;
    }
    if (e.cd > 0) e.cd--;
    const d = dist(e.x, e.y, tgt.x, tgt.y);
    if (e.state === 'windup') { e.moving = false; if (--e.stateT <= 0) { const a = angTo(e.x, e.y, tgt.x, tgt.y); e.swing(w, a, 18, 1.2, e.dmg, 2); if (e.def.zap) { FX.bolt(w, e.x, e.y); } e.state = 'recover'; e.stateT = 22; e.cd = irnd(40, 80); } return; }
    if (e.state === 'recover') { e.moving = false; if (--e.stateT <= 0) e.state = 'chase'; return; }
    e.state = 'chase';
    if (d > 16) { const s = e.spd(); const dx = tgt.x - e.x, dy = tgt.y - e.y; e.move(w, sign(dx) * s, sign(dy) * s * 0.6 * (Math.abs(dy) > 3 ? 1 : 0)); e.moving = true; }
    else e.moving = false;
    if (d < 22 && e.cd <= 0) { e.state = 'windup'; e.stateT = e.windMax = 16; }
  },
  floater(w, e, tgt) {
    e.z = 6 + Math.sin(e.t * 0.08) * 3;
    if (!e.aggro || !tgt) { e.wanderHome(w); return; }
    if (e.cd > 0) e.cd--;
    const d = dist(e.x, e.y, tgt.x, tgt.y);
    const a = angTo(tgt.x, tgt.y, e.x, e.y) + 0.02 * e.strafe * e.t % 6.28;
    const tx = tgt.x + Math.cos(a) * 60, ty = tgt.y + Math.sin(a) * 50;
    e.stepToward(w, tx, ty, e.spd() * 0.7);
    if (e.cd <= 0 && d < 140) {
      const aa = angTo(e.x, e.y - 8, tgt.x, tgt.y - 7);
      e.shoot(w, aa, { kind: 'orb', vx: Math.cos(aa) * 1.5, vy: Math.sin(aa) * 1.5, z: e.z + 8, col: PAL.cyan, col2: PAL.sky, homing: 0.02, target: tgt, fly: true, dmg: e.dmg, life: 180 });
      AudioSys.sfx('zap'); e.cd = irnd(80, 140);
    }
  },
  ghost(w, e, tgt) {
    // melee that phases in and out (invulnerable while faded)
    e.phaseT = (e.phaseT || irnd(0, 200)) + 1;
    const cyc = e.phaseT % 260;
    e.phaseOut = cyc > 200;
    e.invuln = e.phaseOut;
    e.z = 3 + Math.sin(e.t * 0.07) * 2;
    ENEMY_AI.melee(w, e, tgt);
  },
  assassin(w, e, tgt) {
    if (!e.aggro || !tgt) return e.wanderHome(w);
    if (e.cd > 0) e.cd--;
    const d = dist(e.x, e.y, tgt.x, tgt.y);
    if (e.state === 'windup') { e.moving = false; if (--e.stateT <= 0) { e.state = 'dash'; e.stateT = 10; e.dA = angTo(e.x, e.y, tgt.x, tgt.y); e.dHits = new Set(); AudioSys.sfx('dash'); } return; }
    if (e.state === 'dash') {
      const x0 = e.x, y0 = e.y;
      e.move(w, Math.cos(e.dA) * 5.5, Math.sin(e.dA) * 5.5);
      FX.afterimage(w, e);
      w.addAttack({ owner: e, team: 'enemy', shape: 'line', x: x0, y: y0 - 7, x2: e.x, y2: e.y - 7, r: 8, life: 1, dmg: e.dmg, kb: 3, hitstop: 3, hits: e.dHits });
      if (--e.stateT <= 0) { e.state = 'recover'; e.stateT = 34; e.cd = irnd(70, 110); }
      return;
    }
    if (e.state === 'recover') { e.moving = false; if (--e.stateT <= 0) e.state = 'chase'; return; }
    e.state = 'chase';
    if (d > 70) e.stepToward(w, tgt.x, tgt.y, e.spd());
    else { const a = angTo(tgt.x, tgt.y, e.x, e.y) + Math.PI / 2 * e.strafe; e.stepToward(w, e.x + Math.cos(a) * 10, e.y + Math.sin(a) * 10, e.spd() * 0.8); }
    if (e.cd <= 0 && d < 90 && w.tokenFree(e, tgt)) { e.state = 'windup'; e.stateT = e.windMax = 18; e.facing = sign(tgt.x - e.x) || e.facing; }
  },
  boss(w, e, tgt) {
    if (!tgt) { e.moving = false; return; }
    if (!e.aggro) e.aggro = true;
    if (e.mv) {
      const done = BOSS_MOVES[e.mv.name](w, e, tgt, e.mvT++, e.mv.o);
      if (done) { e.mv = null; e.cd = (e.def.rest || 36) * (e.phase2 ? 0.6 : 1); e.markers = []; }
      return;
    }
    const d = dist(e.x, e.y, tgt.x, tgt.y);
    if (d > 60) e.stepToward(w, tgt.x, tgt.y, e.spd() * 0.8);
    else if (d < 28) { const a = angTo(tgt.x, tgt.y, e.x, e.y); e.stepToward(w, e.x + Math.cos(a) * 8, e.y + Math.sin(a) * 8, e.spd() * 0.6); }
    else e.moving = false;
    e.facing = sign(tgt.x - e.x) || e.facing;
    if (--e.cd <= 0) {
      const moves = e.def.moves.filter(m => !(m[0] === 'summon' && w.countEnemies() - 1 >= (m[2].max || 3)));
      const tot = moves.reduce((s, m) => s + m[1], 0);
      let r = Math.random() * tot, pick = moves[0];
      for (const m of moves) { r -= m[1]; if (r <= 0) { pick = m; break; } }
      if (e.lastMv === pick[0] && moves.length > 1 && Math.random() < 0.6) { const alt = moves.filter(m => m[0] !== pick[0]); pick = alt[Math.floor(Math.random() * alt.length)]; }
      e.lastMv = pick[0];
      e.mv = { name: pick[0], o: pick[2] }; e.mvT = 0; e.mvData = {};
    }
  },
};

// poison puddle helper
function poisonCloud(w, x, y, team, dps, src) {
  AudioSys.sfx('splash');
  const cloud = { x, y, r: 20, life: 240, team, dps, t: 0 };
  w.hazards.push(cloud);
  FX.poof(w, x, y, PAL.lgreen);
}

// ---------- Boss move library ----------
// each returns true when finished; t = frames since move start
const BOSS_MOVES = {
  slashCombo(w, e, tgt, t, o) {
    const D = e.mvData;
    if (t === 0) { D.i = 0; D.t = 0; }
    const n = o.n || 3;
    const d = dist(e.x, e.y, tgt.x, tgt.y);
    if (D.phase !== 'swing') {
      if (d > (o.r || 30) - 6 && D.t < 60) { e.stepToward(w, tgt.x, tgt.y, e.spd() * 1.4); D.t++; return false; }
      D.phase = 'swing'; D.t = 0; e.state = 'windup'; e.stateT = 14;
    }
    D.t++;
    e.moving = false;
    const wind = D.i === 0 ? 16 : 10;
    if (D.t === wind) {
      const a = angTo(e.x, e.y - 10, tgt.x, tgt.y - 7);
      e.kvx += Math.cos(a) * 2.2; e.kvy += Math.sin(a) * 2.2;
      e.facing = sign(Math.cos(a)) || e.facing;
      e.swing(w, a, o.r || 30, 1.2, e.dmg, 3.2, { col: PAL.red2 });
      e.state = 'attack';
    }
    if (D.t >= wind + 12) { D.i++; D.t = 0; e.state = 'windup'; if (D.i >= n) { e.state = 'idle'; return true; } }
    return false;
  },
  punchCombo(w, e, tgt, t, o) {
    const D = e.mvData;
    if (t === 0) { D.i = 0; D.t = 0; }
    const d = dist(e.x, e.y, tgt.x, tgt.y);
    if (D.phase !== 'go') { if (d > 26 && D.t < 60) { e.stepToward(w, tgt.x, tgt.y, e.spd() * 1.5); D.t++; return false; } D.phase = 'go'; D.t = 0; }
    D.t++; e.moving = false;
    if (D.t === 10) {
      const a = angTo(e.x, e.y - 10, tgt.x, tgt.y - 7);
      e.kvx += Math.cos(a) * 2.6; e.kvy += Math.sin(a) * 2.6; e.pose = 'attack'; e.facing = sign(Math.cos(a)) || e.facing;
      w.addAttack({ owner: e, team: 'enemy', shape: 'arc', x: e.x, y: e.y - 12, r: 26, a, spread: 0.8, life: 4, dmg: e.dmg, kb: 3.5, hitstop: 3, follow: true });
      AudioSys.sfx('punch'); FX.ring(w, e.x + Math.cos(a) * 20, e.y - 12 + Math.sin(a) * 20, 2, 8, 8, PAL.white);
    }
    if (D.t < 16 && D.t > 8) e.pose = 'attack';
    if (D.t >= 18) { D.i++; D.t = 0; if (D.i >= (o.n || 3)) return true; }
    return false;
  },
  charge(w, e, tgt, t, o) {
    const D = e.mvData;
    if (t === 0) { e.state = 'windup'; e.stateT = 30; D.hits = new Set(); FX.text(w, e.x, e.y - e.height - 8, '!!', PAL.red2); AudioSys.sfx('charge'); }
    if (t < 34) { e.moving = t % 6 < 3; if (t % 6 === 0) FX.dust(w, e.x, e.y, 2); D.a = angTo(e.x, e.y, tgt.x, tgt.y); e.facing = sign(Math.cos(D.a)) || e.facing; return false; }
    if (t === 34) { e.state = 'attack'; AudioSys.sfx('dash'); }
    if (t < 34 + 46) {
      const s = o.spd || 3.6;
      const r = e.move(w, Math.cos(D.a) * s, Math.sin(D.a) * s);
      e.moving = true; e.animT += 2; e.pose = 'attack';
      if (t % 3 === 0) FX.afterimage(w, e);
      w.addAttack({ owner: e, team: 'enemy', shape: 'circle', x: e.x, y: e.y - 10, r: e.bodyR + 6, life: 1, dmg: e.dmg * 1.1, kb: 5, hitstop: 4, shake: 2, hits: D.hits });
      if (r.hitX || r.hitY) { w.shake = Math.max(w.shake, 5); AudioSys.sfx('hitHeavy'); FX.star(w, e.x, e.y - e.height, 5); D.stun = 40; return BOSS_MOVES._stun(w, e, D); }
      return false;
    }
    e.state = 'idle';
    return true;
  },
  _stun(w, e, D) { e.state = 'idle'; e.moving = false; e.cd = 60; return true; },
  slam(w, e, tgt, t, o) {
    const D = e.mvData;
    const R = o.r || 60;
    if (t === 0) { D.tx = tgt.x; D.ty = tgt.y; D.sx = e.x; D.sy = e.y; e.state = 'windup'; e.markers = [{ x: tgt.x, y: tgt.y, r: 26 }]; AudioSys.sfx('charge'); }
    if (t < 16) { e.moving = false; e.z = 0; return false; }
    if (t < 44) {
      const p = (t - 16) / 28;
      e.x = lerp(D.sx, D.tx, p); e.y = lerp(D.sy, D.ty, p); e.z = Math.sin(p * Math.PI) * 40;
      e.invuln = true; e.noShadow = false;
      return false;
    }
    if (t === 44) {
      e.z = 0; e.invuln = false; e.markers = [];
      AudioSys.sfx('slam'); w.shake = Math.max(w.shake, 8); w.hitstop = Math.max(w.hitstop, 3);
      w.addAttack({ owner: e, team: 'enemy', shape: 'ring', x: e.x, y: e.y - 4, r: 8, r1: R, th: 12, life: 18, dmg: e.dmg * 1.2, kb: 5.5, hitstop: 3 });
      w.addAttack({ owner: e, team: 'enemy', shape: 'circle', x: e.x, y: e.y - 6, r: 22, life: 3, dmg: e.dmg * 1.4, kb: 6, hitstop: 4 });
      FX.ring(w, e.x, e.y - 2, 6, R, 20, PAL.beige); FX.ring(w, e.x, e.y - 2, 4, R * 0.7, 16, PAL.white); FX.dust(w, e.x, e.y, 14, PAL.lgray);
      e.state = 'attack'; e.pose = 'attack';
    }
    if (t < 70) { e.moving = false; return false; }
    e.state = 'idle';
    return true;
  },
  hop(w, e, tgt, t, o) { return BOSS_MOVES.slam(w, e, tgt, t, o); },
  anchorSpin(w, e, tgt, t, o) {
    const D = e.mvData;
    if (t === 0) { e.state = 'windup'; D.hits = new Set(); AudioSys.sfx('charge'); FX.text(w, e.x, e.y - e.height - 8, 'SPIN!', PAL.orange); }
    if (t < 24) { e.moving = false; return false; }
    if (t < 24 + 110) {
      if ((t - 24) % 24 === 0) D.hits = new Set();
      e.stepToward(w, tgt.x, tgt.y, e.spd() * 0.9);
      e.facing = ((t >> 2) % 2) ? 1 : -1;
      e.state = 'attack'; e.pose = 'attack';
      e.swingT = 2; e.swingMax = 10; e.swingA = t * 0.5;
      w.addAttack({ owner: e, team: 'enemy', shape: 'circle', x: e.x, y: e.y - 10, r: 34, life: 1, dmg: e.dmg * 0.8, kb: 4.5, hitstop: 2, hits: D.hits });
      if (t % 8 === 0) { AudioSys.sfx('slash'); FX.slash(w, e, t * 0.5, 32, Math.PI * 0.8, 8, PAL.salmon, false, 4); }
      return false;
    }
    if (t < 170) { e.moving = false; e.state = 'recover'; return false; }
    e.state = 'idle';
    return true;
  },
  summon(w, e, tgt, t, o) {
    if (t === 0) { e.state = 'windup'; FX.text(w, e.x, e.y - e.height - 8, o.cry || 'GET THEM!', PAL.yellow); AudioSys.sfx('crowd'); }
    if (t === 30) {
      for (let i = 0; i < (o.n || 2); i++) {
        const a = rnd(Math.PI * 2);
        const x = e.x + Math.cos(a) * 44, y = e.y + Math.sin(a) * 30;
        const sp = w.findFree(x, y, 10, 5);
        const m = new Enemy(sp.x, sp.y, pick(o.types), { aggro: true, diff: w.diff, spawnFx: true, noDrop: false });
        m.dropMul = 0.3;
        w.addEnt(m); FX.poof(w, sp.x, sp.y - 6, PAL.lgray);
      }
    }
    if (t < 50) { e.moving = false; return false; }
    e.state = 'idle';
    return true;
  },
  volley(w, e, tgt, t, o) {
    const D = e.mvData;
    if (t === 0) { e.state = 'windup'; D.a = angTo(e.x, e.y, tgt.x, tgt.y); }
    if (t < 26) { e.moving = false; D.a = angTo(e.x, e.y - 12, tgt.x, tgt.y - 7); e.aimA = D.a; return false; }
    if (t === 26 || (e.phase2 && t === 50)) {
      const n = o.n || 5, spread = o.spread || 1;
      for (let i = 0; i < n; i++) {
        const a = D.a + (n > 1 ? (i / (n - 1) - 0.5) * spread : 0);
        const kind = o.kind === 'lob2' ? 'lob' : (o.kind || 'bullet');
        const spd = o.spd || 2.4;
        e.shoot(w, a, { kind, vx: Math.cos(a) * spd, vy: Math.sin(a) * spd, dmg: e.dmg * 0.8, col: o.col, col2: o.col2, fly: kind === 'orb', life: 200, r: kind === 'orb' ? 4 : 3 });
      }
      AudioSys.sfx(o.kind === 'fire' ? 'fire' : o.kind === 'orb' ? 'ghost' : 'gun');
      e.state = 'attack'; e.pose = 'attack';
    }
    if (t < (e.phase2 ? 70 : 50)) { e.moving = false; return false; }
    e.state = 'idle';
    return true;
  },
  bombard(w, e, tgt, t, o) {
    const n = o.n || 5;
    if (t === 0) { e.state = 'windup'; }
    if (t > 10 && t <= 10 + n * 8 && (t - 10) % 8 === 0) {
      const tx = tgt.x + rnd(-40, 40), ty = tgt.y + rnd(-30, 30);
      const sp = w.findFree(tx, ty, 4, 4);
      if (o.poison) e.lob(w, sp.x, sp.y, { kind: 'lob', col: o.col || PAL.lgreen, dur: 46, arc: 44, dmg: e.dmg * 0.8, onLand: (ww, p) => { const i = e.markers ? e.markers.findIndex(m => m.x === sp.x && m.y === sp.y) : -1; if (i >= 0) e.markers.splice(i, 1); ww.addAttack({ owner: e, team: 'enemy', shape: 'circle', x: p.x, y: p.y - 3, r: 16, life: 3, dmg: p.dmg, kb: 2 }); poisonCloud(ww, p.x, p.y, 'enemy', e.dmg * 0.2, p); } });
      else e.lob(w, sp.x, sp.y, { dur: 46, arc: 44 });
      e.pose = 'attack';
    }
    if (t < 20 + n * 8 + 30) { e.moving = false; return false; }
    e.state = 'idle';
    return true;
  },
  cannons(w, e, tgt, t, o) {
    const D = e.mvData;
    const n = o.n || 6;
    if (t === 0) {
      FX.text(w, e.x, e.y - e.height - 8, 'FIRE!', PAL.red2); AudioSys.sfx('bell');
      D.spots = [];
      for (let i = 0; i < n; i++) { const sp = w.findFree(tgt.x + rnd(-70, 70), tgt.y + rnd(-50, 50), 4, 4); D.spots.push({ x: sp.x, y: sp.y, r: 20, t: -i * 6 }); }
      e.markers = D.spots;
      e.state = 'windup';
    }
    for (const s of D.spots) s.t++;
    for (const s of D.spots) if (s.t === 50) {
      AudioSys.sfx('explode'); w.shake = Math.max(w.shake, 4);
      FX.poof(w, s.x, s.y, PAL.dgray); FX.spark(w, s.x, s.y - 3, 10, PAL.orange, 2.5); FX.ring(w, s.x, s.y, 4, 22, 12, PAL.orange);
      w.addAttack({ owner: e, team: 'enemy', shape: 'circle', x: s.x, y: s.y - 3, r: 20, life: 3, dmg: e.dmg, kb: 4, hitstop: 3 });
    }
    e.markers = D.spots.filter(s => s.t < 50);
    e.moving = false;
    if (t < 50 + n * 6 + 10) return false;
    e.state = 'idle'; e.markers = [];
    return true;
  },
  strikes(w, e, tgt, t, o) {
    const D = e.mvData;
    if (t === 0) { D.spots = []; e.state = 'windup'; }
    if (t % 14 === 0 && D.spots.length < (o.n || 5)) { const sp = { x: tgt.x + rnd(-20, 20), y: tgt.y + rnd(-14, 14), r: 16, t: 0 }; D.spots.push(sp); }
    for (const s of D.spots) {
      s.t++;
      if (s.t === 40) { FX.bolt(w, s.x, s.y); AudioSys.sfx('thunder'); w.shake = Math.max(w.shake, 3); w.addAttack({ owner: e, team: 'enemy', shape: 'circle', x: s.x, y: s.y - 3, r: 16, life: 3, dmg: e.dmg * 0.9, kb: 3, hitstop: 3 }); }
    }
    e.markers = D.spots.filter(s => s.t < 40);
    e.moving = false;
    if (t < 14 * (o.n || 5) + 50) return false;
    e.markers = []; e.state = 'idle';
    return true;
  },
  clawSnap(w, e, tgt, t, o) {
    const D = e.mvData;
    if (t === 0) { D.n = 0; }
    const d = dist(e.x, e.y, tgt.x, tgt.y);
    if (!D.go) { if (d > 36 && t < 70) { e.stepToward(w, tgt.x, tgt.y, e.spd() * 1.3); return false; } D.go = true; D.t = 0; e.state = 'windup'; }
    D.t++; e.moving = false;
    if (D.t === 16) {
      const a = angTo(e.x, e.y - 10, tgt.x, tgt.y - 7);
      w.addAttack({ owner: e, team: 'enemy', shape: 'arc', x: e.x, y: e.y - 10, r: 38, a, spread: 0.9, life: 4, dmg: e.dmg, kb: 4, hitstop: 3 });
      FX.slash(w, e, a, 34, 0.9, 8, PAL.orange, D.n % 2 === 1, 5); AudioSys.sfx('clang');
      e.state = 'attack';
    }
    if (D.t >= 28) { D.t = 0; D.n++; e.state = 'windup'; if (D.n >= 3) { e.state = 'idle'; return true; } }
    return false;
  },
  bubbles(w, e, tgt, t, o) {
    if (t === 0) e.state = 'windup';
    if (t > 20 && t % 6 === 0 && t < 20 + (o.n || 8) * 6) {
      const a = angTo(e.x, e.y, tgt.x, tgt.y) + rnd(-0.6, 0.6);
      e.shoot(w, a, { kind: 'orb', vx: Math.cos(a) * 1.3, vy: Math.sin(a) * 1.3, col: PAL.lblue, col2: PAL.sky, life: 220, dmg: e.dmg * 0.7, fly: true, r: 4 });
      AudioSys.sfx('splash');
    }
    if (t < 20 + (o.n || 8) * 6 + 20) { e.moving = false; return false; }
    e.state = 'idle';
    return true;
  },
  bellyRoll(w, e, tgt, t, o) { return BOSS_MOVES.charge(w, e, tgt, t, { spd: 3.4 }); },
  steam(w, e, tgt, t, o) {
    if (t === 0) { e.state = 'windup'; FX.text(w, e.x, e.y - e.height - 8, 'VENTING!', PAL.lgray); AudioSys.sfx('charge'); }
    if (t < 30) { e.moving = false; return false; }
    if (t < 110) {
      if (t % 10 === 0) { FX.poof(w, e.x + rnd(-30, 30), e.y + rnd(-20, 10), PAL.white); AudioSys.sfx('fire'); }
      if (t % 20 === 0) { e.mvData.hits = new Set(); }
      w.addAttack({ owner: e, team: 'enemy', shape: 'circle', x: e.x, y: e.y - 8, r: 44, life: 1, dmg: e.dmg * 0.5, kb: 3, hitstop: 1, hits: e.mvData.hits || (e.mvData.hits = new Set()) });
      e.moving = false; return false;
    }
    e.state = 'idle';
    return true;
  },
  teleSlash(w, e, tgt, t, o) {
    const D = e.mvData;
    if (t === 0) { e.state = 'windup'; FX.poof(w, e.x, e.y - 8, e.def.char === 'ghostcap' ? PAL.cyan : PAL.lav); AudioSys.sfx('dodge'); D.n = 0; }
    if (t === 10) {
      const a = rnd(Math.PI * 2);
      const sp = w.findFree(tgt.x + Math.cos(a) * 30, tgt.y + Math.sin(a) * 22, e.w, e.h);
      e.x = sp.x; e.y = sp.y; FX.poof(w, e.x, e.y - 8, e.def.char === 'ghostcap' ? PAL.cyan : PAL.lav);
      e.facing = sign(tgt.x - e.x) || e.facing;
    }
    if (t < 10) { e.alpha = 0.3; e.invuln = true; return false; }
    e.alpha = e.def.alpha; e.invuln = false;
    if (t === 24) {
      const a = angTo(e.x, e.y - 10, tgt.x, tgt.y - 7);
      e.kvx += Math.cos(a) * 3; e.kvy += Math.sin(a) * 3;
      e.swing(w, a, e.bossF ? 32 : 24, 1.2, e.dmg, 3.5, { col: e.def.char === 'ghostcap' ? PAL.cyan : PAL.lav });
    }
    if (t < 44) { e.moving = false; return false; }
    e.state = 'idle';
    return true;
  },
  knifeFan(w, e, tgt, t, o) {
    if (t === 0) e.state = 'windup';
    if (t === 20 || t === 36) {
      const base = angTo(e.x, e.y - 12, tgt.x, tgt.y - 7) + (t === 36 ? 0.12 : 0);
      const n = o.n || 7;
      for (let i = 0; i < n; i++) { const a = base + (i / (n - 1) - 0.5) * 1.2; e.shoot(w, a, { kind: 'knife', vx: Math.cos(a) * 3, vy: Math.sin(a) * 3, dmg: e.dmg * 0.6 }); }
      AudioSys.sfx('slash'); e.pose = 'attack';
    }
    if (t < 56) { e.moving = false; return false; }
    e.state = 'idle';
    return true;
  },
  smoke(w, e, tgt, t, o) {
    if (t === 0) { AudioSys.sfx('poof'); for (let i = 0; i < 4; i++) FX.poof(w, e.x + rnd(-20, 20), e.y + rnd(-10, 10), PAL.dgray); e.invuln = true; e.alpha = 0.15; }
    if (t === 40) { const sp = w.findFree(tgt.x + rnd(-80, 80), tgt.y + rnd(-50, 50), e.w, e.h); e.x = sp.x; e.y = sp.y; FX.poof(w, e.x, e.y - 8, PAL.dgray); }
    if (t < 50) { e.moving = false; return false; }
    e.invuln = false; e.alpha = e.def.alpha;
    return BOSS_MOVES.knifeFan(w, e, tgt, t - 50, o) || false;
  },
  darkWave(w, e, tgt, t, o) {
    const D = e.mvData;
    if (t === 0) { e.state = 'windup'; FX.text(w, e.x, e.y - e.height - 8, 'DROWN!', PAL.purple); AudioSys.sfx('wave'); }
    if (t === 30 || (e.phase2 && t === 60)) {
      const base = angTo(e.x, e.y, tgt.x, tgt.y);
      for (let k = -1; k <= 1; k++) {
        const a = base + k * 0.4;
        e.shoot(w, a, { kind: 'wave', vx: Math.cos(a) * 2.2, vy: Math.sin(a) * 2.2, dmg: e.dmg * 0.9, pierce: true, fly: true, r: 8, life: 140, col: PAL.purple, kb: 4 });
      }
      e.pose = 'attack'; w.shake = Math.max(w.shake, 3);
    }
    if (t < (e.phase2 ? 80 : 50)) { e.moving = false; return false; }
    e.state = 'idle';
    return true;
  },
};

class Crew extends Actor {
  constructor(id, x, y, opts = {}) {
    const def = CREW_DEFS[id];
    super(x, y, def.char);
    this.crewId = id; this.def = def; this.name = def.name;
    this.team = 'ally'; this.isCrew = true; this.guest = !!opts.guest;
    const up = (G.save && G.save.upgrades) || {};
    this.maxHp = this.hp = Math.round(def.hp * (1 + 0.15 * (up.drill || 0)));
    const recruits = (G.save && G.save.crew) ? G.save.crew.length : 1;
    this.dmgMul = (0.55 + 0.035 * recruits) * (1 + 0.12 * (up.drill || 0)) * (def.power || 1);
    this.speed = def.speed; this.weapon = def.weapon;
    this.cd = irnd(20, 50); this.spCd = Math.round(def.specialCd * rnd(0.35, 0.8));
    this.hurtIframes = 20; this.kbResist = def.taunt ? 0.4 : 0.8;
    this.taunt = def.taunt;
    this.slot = opts.slot || 0;
    this.stuckT = 0; this.combo = 0;
    this.buffT = 0; this.buffAtk = 1; this.buffSpd = 1;
  }
  get atk() { return this.dmgMul * (this.buffT > 0 ? this.buffAtk : 1); }
  update(w) {
    this.tick();
    this.pose = null;
    if (this.buffT > 0) this.buffT--;
    if (this.ko) {
      this.moving = false;
      if (!w.inCombat) { this.koT = (this.koT || 0) + 1; if (this.koT > 60) this.revive(w, 0.5); }
      return;
    }
    if (this.hp <= 0) return;
    if (this.poison > 0) { this.poison--; if (this.poison % 30 === 0) this.hurt(w, 2, this.x, this.y, 0); }
    if (this.act) { const done = this.act(w, this.actT++); if (done) this.act = null; this.applyKnock(w); return; }
    if (this.walkTo) { NPC.prototype.stepWalk.call(this, w); this.applyKnock(w); return; }
    if (this.frozen || w.cutscene) { this.moving = false; this.applyKnock(w); if (w.cutscene && !this.frozen) this.followLeader(w, true); return; }
    if (this.cd > 0) this.cd--;
    if (this.spCd > 0) this.spCd--;
    const p = w.player;
    const tgt = w.inCombat ? this.pickTarget(w) : null;
    if (tgt) this.fight(w, tgt);
    else this.followLeader(w);
    if (w.inCombat && this.spCd <= 0 && CREW_SPECIALS[this.crewId] && CREW_SPECIALS[this.crewId].ready(w, this)) {
      this.spCd = this.def.specialCd;
      FX.text(w, this.x, this.y - 40, this.def.special + '!', this.def.col); // above the damage numbers
      this.act = CREW_SPECIALS[this.crewId].run.bind(null, this); this.actT = 0;
    }
    this.applyKnock(w);
  }
  pickTarget(w) {
    const p = w.player;
    let best = null, bd = 1e9;
    for (const a of w.actors) {
      if (a.team !== 'enemy' || !a.alive || a.phaseOut) continue;
      if (dist(a.x, a.y, p.x, p.y) > 190) continue;
      const d = dist(this.x, this.y, a.x, a.y) + (a === this.lastTgt ? -20 : 0);
      if (d < bd) { bd = d; best = a; }
    }
    this.lastTgt = best;
    return best;
  }
  slotPos(w) {
    const p = w.player;
    const f = p.facing || 1;
    const i = this.slot;
    const row = Math.floor(i / 3), col = i % 3;
    return { x: p.x - f * (20 + row * 15) + (col - 1) * 4 * f, y: p.y + (col - 1) * 13 - 1 };
  }
  followLeader(w, gentle) {
    const p = w.player;
    const s = this.slotPos(w);
    const d = dist(this.x, this.y, s.x, s.y);
    const dp = dist(this.x, this.y, p.x, p.y);
    if (!gentle && dp > 230) { this.teleportNear(w); return; }
    if (d > 6) {
      const sp = Math.min(p.speed * 1.18, this.speed * (d > 40 ? 1.35 : 1)) * (this.buffT > 0 ? this.buffSpd : 1);
      const before = { x: this.x, y: this.y };
      this.stepTo(w, s.x, s.y, sp);
      if (Math.hypot(this.x - before.x, this.y - before.y) < 0.2) this.stuckT++; else this.stuckT = 0;
      if (this.stuckT > 50 && !gentle) { this.teleportNear(w); this.stuckT = 0; }
    } else { this.moving = false; this.facing = p.facing; }
  }
  teleportNear(w) {
    const p = w.player;
    const s = this.slotPos(w);
    const sp = w.findFree(s.x, s.y, this.w, this.h);
    this.x = sp.x; this.y = sp.y; this.stuckT = 0;
    FX.poof(w, this.x, this.y - 6, PAL.white);
  }
  stepTo(w, tx, ty, s) {
    const dx = tx - this.x, dy = ty - this.y, d = Math.hypot(dx, dy);
    if (d < 0.5) { this.moving = false; return; }
    const r = this.move(w, dx / d * Math.min(s, d), dy / d * Math.min(s, d));
    if (r.hitX && Math.abs(dy) > 1) this.move(w, 0, sign(dy) * s);
    if (r.hitY && Math.abs(dx) > 1) this.move(w, sign(dx) * s, 0);
    this.moving = true; this.animT++;
    if (Math.abs(dx) > 0.4) this.facing = sign(dx);
  }
  fight(w, tgt) {
    const def = this.def;
    const d = dist(this.x, this.y, tgt.x, tgt.y);
    const sp = this.speed * (this.buffT > 0 ? this.buffSpd : 1);
    if (def.style === 'melee') {
      const off = ((this.slot % 3) - 1) * 8;
      if (d > def.range) this.stepTo(w, tgt.x - sign(tgt.x - this.x) * 10, tgt.y + off * 0.5, sp * 1.1);
      else { this.moving = false; this.facing = sign(tgt.x - this.x) || this.facing; }
      if (d <= def.range + 6 && this.cd <= 0) { CREW_ATTACKS[this.crewId](w, this, tgt); this.cd = Math.round(def.cd * rnd(0.85, 1.2) / (this.buffT > 0 ? this.buffSpd : 1)); }
    } else {
      const pref = def.pref || 90;
      if (d > pref + 30) this.stepTo(w, tgt.x, tgt.y, sp);
      else if (d < pref - 35) { const a = angTo(tgt.x, tgt.y, this.x, this.y); this.stepTo(w, this.x + Math.cos(a) * 12, this.y + Math.sin(a) * 12, sp); }
      else { this.moving = false; }
      this.facing = sign(tgt.x - this.x) || this.facing;
      if (def.style === 'healer' && this.tryHeal(w)) return;
      if (this.cd <= 0 && d < 170 && w.map.los(this.x, this.y - 6, tgt.x, tgt.y - 6)) { CREW_ATTACKS[this.crewId](w, this, tgt); this.cd = Math.round(def.cd * rnd(0.85, 1.2) / (this.buffT > 0 ? this.buffSpd : 1)); }
    }
  }
  tryHeal(w) {
    if (this.healCd > 0) { this.healCd--; return false; }
    let best = null, br = 0.68;
    for (const a of w.actors) {
      if (a.team !== 'ally' || !a.alive || a.isTurret) continue;
      const r = a.hp / a.maxHp;
      if (r < br && dist(this.x, this.y, a.x, a.y) < 150) { br = r; best = a; }
    }
    if (!best) return false;
    this.healCd = 70;
    this.pose = 'attack';
    const heal = Math.round(24 * (1 + 0.1 * (G.save.upgrades.drill || 0)));
    const pj = new Projectile({ kind: 'flask', col: PAL.lgreen, sx: this.x, sy: this.y - 4, tx: best.x, ty: best.y, x: this.x, y: this.y, dur: 32, arc: 22, team: 'ally', owner: this,
      onLand: (ww, p) => { AudioSys.sfx('heal'); FX.ring(ww, p.x, p.y, 2, 16, 12, PAL.lgreen); for (const a of ww.actors) if (a.team === 'ally' && a.alive && dist(a.x, a.y, p.x, p.y) < 20) a.heal(ww, heal); } });
    w.addEnt(pj);
    return true;
  }
  hurt(w, dmg, fx, fy, kb, opts) {
    const ok = super.hurt(w, dmg, fx, fy, kb, opts);
    if (ok) { this.act = null; this.stun = 6; }
    return ok;
  }
  // parry (Silas): some hits just glance off his blade, and close attackers get knocked back
  guard(w, dmg, fx, fy, opts) {
    if (!this.def.parry || opts.poison || this.stun > 0 || Math.random() >= this.def.parry) return false;
    const a = angTo(this.x, this.y - 7, fx, fy - 7);
    this.iframes = 12; this.facing = sign(Math.cos(a)) || this.facing;
    this.swingFx(w, a, 16, 0.8, PAL.cyan);
    FX.spark(w, this.x + Math.cos(a) * 8, this.y - 8 + Math.sin(a) * 8, 8, PAL.white, 2.2);
    FX.text(w, this.x, this.y - this.height - 4, 'PARRY!', PAL.cyan);
    AudioSys.sfx('clang');
    const src = opts.source;
    if (src && src.team === 'enemy' && src.alive && !src.isBoss && dist(src.x, src.y, this.x, this.y) < 40) {
      src.kvx += Math.cos(a) * 3; src.kvy += Math.sin(a) * 3; src.stun = Math.max(src.stun || 0, 24);
    }
    return true;
  }
  onDown(w) {
    this.ko = true; this.hp = 0; this.koT = 0; this.act = null;
    FX.text(w, this.x, this.y - 24, 'KO!', PAL.lgray); AudioSys.sfx('hurt');
  }
  revive(w, frac) {
    this.ko = false; this.hp = Math.max(1, Math.round(this.maxHp * frac)); this.koT = 0; this.iframes = 40;
    FX.heal(w, this.x, this.y); FX.text(w, this.x, this.y - 24, 'Back up!', PAL.lgreen);
  }
  drawFront(g, x, y) {
    if (this.ko || !this.weapon) return;
    const spr = weaponSpr(this.weapon);
    const f = this.facing;
    if (this.swingT > 0) {
      const t = 1 - this.swingT / this.swingMax;
      const ang = this.swingA - 1.1 + 2.2 * easeOut(t);
      drawRot(g, spr, x, y - 8, ang, 2, 3);
      this.swingT--;
    } else if (this.weapon === 'rifle' || this.weapon === 'staff' || this.weapon === 'fiddle') {
      const a = this.aimA !== undefined && this.pose === 'attack' ? this.aimA : (f > 0 ? -0.25 : Math.PI + 0.25);
      drawRot(g, spr, x + f * 2, y - 9, a, 3, 3, Math.cos(a) < 0);
    } else {
      if (f > 0) drawRot(g, spr, x + 5, y - 6, 1.25, 2, 3);
      else drawRot(g, spr, x - 5, y - 6, Math.PI - 1.25, 2, 3, true);
    }
  }
  swingFx(w, ang, r, spread, col) {
    this.swingT = this.swingMax = 9; this.swingA = ang; this.pose = 'attack';
    FX.slash(w, this, ang, r, spread, 8, col || PAL.white, Math.random() < 0.5, 3);
  }
  hit(w, shape, o) {
    w.addAttack(Object.assign({ owner: this, team: 'ally', shape, life: 3, kb: 2.2, hitstop: 1, follow: false, sfx: 'hit' }, o));
  }
}

// ---------- basic attacks ----------
const CREW_ATTACKS = {
  silas(w, c, t) {
    const a = angTo(c.x, c.y - 7, t.x, t.y - 7);
    c.facing = sign(Math.cos(a)) || c.facing;
    const n = (c.combo = (c.combo + 1) % 3);
    c.act = (ww, k) => {
      // lightning triple slash (7 frames apart so each one lands)
      if (k === 1 || k === 8 || k === 15) {
        const s = (k - 1) / 7, last = s === 2;
        c.swingFx(ww, a + [0, 0.35, -0.35][s], 24, 1.2, last ? PAL.cyan : PAL.white); AudioSys.sfx(last ? 'slash2' : 'slash');
        c.hit(ww, 'arc', { x: c.x, y: c.y - 7, r: 28, a, spread: 1.25, dmg: (last ? 14 : 10) * c.atk, kb: last ? 4 : 2, hitstop: last ? 3 : 1, follow: true });
        c.kvx += Math.cos(a) * 1.4; c.kvy += Math.sin(a) * 1.4;
      }
      // every third attack ends with a flying sword wave that cuts through a whole line
      if (n === 2 && k === 20) {
        ww.addEnt(new Projectile({ x: c.x + Math.cos(a) * 10, y: c.y - 1 + Math.sin(a) * 10, z: 8, vx: Math.cos(a) * 4.2, vy: Math.sin(a) * 4.2, kind: 'swordwave', team: 'ally', dmg: 18 * c.atk, owner: c, life: 40, pierce: true, fly: true, r: 10, kb: 3.5 }));
        FX.slash(ww, c, a, 26, 1.4, 10, PAL.cyan, false, 4); AudioSys.sfx('whirl');
      }
      c.pose = 'attack';
      return k >= (n === 2 ? 26 : 20);
    };
    c.actT = 0;
  },
  mira(w, c, t) {
    c.pose = 'attack'; c.aimA = angTo(c.x, c.y, t.x, t.y);
    const pj = new Projectile({ kind: 'flask', col: PAL.magenta, sx: c.x, sy: c.y - 4, tx: t.x + rnd(-4, 4), ty: t.y + rnd(-3, 3), x: c.x, y: c.y, dur: 34, arc: 24, team: 'ally', owner: c,
      onLand: (ww, p) => { poisonCloud(ww, p.x, p.y, 'ally', 5 * c.atk, p); } });
    w.addEnt(pj); AudioSys.sfx('pew');
  },
  bruno(w, c, t) {
    const a = angTo(c.x, c.y - 7, t.x, t.y - 7);
    c.facing = sign(Math.cos(a)) || c.facing;
    const n = (c.combo = (c.combo + 1) % 3);
    c.act = (ww, k) => {
      c.pose = 'attack';
      if (k === 3) {

class Turret extends Actor {
  constructor(x, y, owner) {
    super(x, y, null);
    this.team = 'ally'; this.isTurret = true; this.owner = owner;
    this.maxHp = this.hp = 70; this.life = 840; this.cd = 20; this.bodyR = 6; this.height = 12; this.shadowW = 14;
    this.untargetable = false; this.aimA = 0;
  }
  update(w) {
    this.tick();
    if (--this.life <= 0 || this.hp <= 0) { this.dead = true; FX.poof(w, this.x, this.y - 6, PAL.lgray); return; }
    let best = null, bd = 150;
    for (const a of w.actors) if (a.team === 'enemy' && a.alive) { const d = dist(this.x, this.y, a.x, a.y); if (d < bd) { bd = d; best = a; } }
    if (best) {
      this.aimA = angTo(this.x, this.y - 8, best.x, best.y - 7);
      if (--this.cd <= 0) {
        const a = this.aimA;
        w.addEnt(new Projectile({ x: this.x + Math.cos(a) * 8, y: this.y + Math.sin(a) * 8, z: 8, vx: Math.cos(a) * 3.6, vy: Math.sin(a) * 3.6, kind: 'ball', team: 'ally', dmg: 13 * (this.owner ? this.owner.atk : 1), kb: 3, owner: this, life: 70 }));
        AudioSys.sfx('shoot'); FX.spark(w, this.x + Math.cos(a) * 10, this.y - 8 + Math.sin(a) * 10, 4, PAL.orange, 1.6); this.cd = 46;
      }
    }
  }
  onDown(w) { this.dead = true; FX.poof(w, this.x, this.y - 6, PAL.lgray); }
  currentSprite() { return null; }
  draw(g, cam) {
    const x = Math.round(this.x - cam.x), y = Math.round(this.y - cam.y);
    prect(g, x - 7, y - 5, 14, 5, PAL.black); prect(g, x - 6, y - 5, 12, 4, PAL.brown); prect(g, x - 6, y - 5, 12, 1, PAL.tan);
