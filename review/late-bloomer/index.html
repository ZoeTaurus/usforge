function enterMap(name, x, y, dir) {
  game.map = name;
  player.place(x, y, dir);
  const map = MAPS[name];
  rebuildSolid(map);
  if (name === 'home') {
    cat.enterHome();
    if (game.mail.length && game.flags.mailHintDay !== game.day) {
      game.flags.mailHintDay = game.day;
      toast('You have mail! The mailbox is by the road.', 'letter');
    }
  }
  camera.snap();
  critters.reset();
  updateMusic();
}

function updateMusic() {
  if (!game) return;
  Sound.playMusic(isNight() || game.weather === 'rain' ? 'night' : 'day');
  Sound.setRain(game.weather === 'rain' && MAPS[game.map].outdoor && UI.scene === 'play');
}

function useWarp(w) {
  if (w.shop && !shopOpen()) {
    player.bump();
    Sound.play('error');
    return say("The door's locked. A sign reads: \"Open 8 AM to 6 PM. -Mabel\"");
  }
  if (w.door) Sound.play('door');
  transition(() => enterMap(w.to, w.tx * TS + 8, w.ty * TS + 12, w.dir));
}

// ---------------------------------------------------------------------------
// Objectives (a gentle tutorial, then the long-term goal)
// ---------------------------------------------------------------------------
const OBJECTIVES = [
  { text: 'Clear the weeds and rocks in the garden', done: () => game.stats.cleared >= 5 },
  { text: 'Till some soil with the hoe', done: () => countSoil(s => s.tilled) >= 3 },
  { text: "Plant Rose's daisy seeds", hint: true, done: () => game.stats.planted >= 1 },
  { text: 'Water the seeds with the can', hint: true, done: () => countSoil(s => s.plant && s.wet) >= 1 },
  { text: "Buy seeds at Mabel's shop (walk east into town)", done: () => !!game.flags.boughtSomething },
  { text: 'Go to bed when the day is done', done: () => game.day >= 2 },
];
function countSoil(fn) { let n = 0; for (const row of game.soil) for (const s of row) if (s && fn(s)) n++; return n; }

function objectiveText() {
  if (game.objective < OBJECTIVES.length) {
    const o = OBJECTIVES[game.objective];
    return o.text + (o.hint ? (Input.touchMode ? ' (B switches items)' : ' (X or 1-9 switches items)') : '');
  }
  const s = game.maxStars;
  if (s >= 5) return game.flags.ending ? 'Enjoy your garden, Walter' : 'Sleep, and see what tomorrow brings';
  return 'Grow the garden to ' + '★'.repeat(s + 1) + ' (beauty ' + STAR_THRESHOLDS[s + 1] + ')';
}

function updateObjectives() {
  // By day 4 Walter knows the ropes; drop the tutorial and show the real goal.
  if (game.objective < OBJECTIVES.length && (game.day >= 4 || game.flags.ending)) { game.objective = OBJECTIVES.length; return; }
  if (game.objective < OBJECTIVES.length && OBJECTIVES[game.objective].done()) {
    game.objective++;
    Sound.play('select');
    UI.objectiveFlash = 2;
    // skip any later steps that are already complete
    while (game.objective < OBJECTIVES.length && OBJECTIVES[game.objective].done()) game.objective++;
  }
}

// ---------------------------------------------------------------------------
// Ending
// ---------------------------------------------------------------------------
function startEnding() {
  game.flags.endingPending = false;
  game.visitors = [
    { who: 'mabel', x: 17, y: 17, ending: true, name: 'Mabel', line: 'Take a bow, Walter. You earned it.' },
    { who: 'pemberton', x: 19, y: 17, ending: true, name: 'Mrs. Pemberton', line: 'Do not expect me to say it twice.' },
    { who: 'timmy', x: 21, y: 17, ending: true, name: 'Timmy', line: 'Can I name a flower? I wanna name one Captain Petals.' },
  ];
  enterMap('home', 19 * TS + 8, 15 * TS + 12, 'down');
  rebuildSolid(MAPS.home);
  say(ENDING_SCENE, {
    then: () => {
      game.flags.ending = true;
      openEndingCard(() => {
        game.visitors = [];
        rebuildSolid(MAPS.home);
        saveGame();
      });
    },
  });
}

// ---- src/entities.js ----
'use strict';
// Walter, the camera, Biscuit the cat, particles and ambient critters.

const DIRV = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };

function boxFree(map, x, y) {
  const x0 = Math.floor((x - 5) / TS), x1 = Math.floor((x + 4) / TS);
  const y0 = Math.floor((y - 5) / TS), y1 = Math.floor((y - 1) / TS);
  for (let ty = y0; ty <= y1; ty++) for (let tx = x0; tx <= x1; tx++) if (isSolidTile(map, tx, ty)) return false;
  return true;
}

// ---------------------------------------------------------------------------
// Walter
// ---------------------------------------------------------------------------
const player = {
  x: 0, y: 0, dir: 'down', moving: false, walkT: 0, frame: 0,
  action: null, sitting: null, seatFrom: null, warpCooldown: 0, stepT: 0, idleT: 0,

  place(x, y, dir) {
    this.x = x; this.y = y; this.dir = dir || 'down';
    this.action = null; this.sitting = null; this.moving = false; this.warpCooldown = 0.35;
  },
  footTile() { return { x: Math.floor(this.x / TS), y: Math.floor((this.y - 3) / TS) }; },
  targetTile() {
    const f = this.footTile(), d = DIRV[this.dir];
    const x = f.x + d[0], y = f.y + d[1];
    return { x, y, px: x * TS + 8, py: y * TS + 10 };
  },
  speed() {
    let s = 46;
    if (game.upgrades.slippers) s *= 1.3;
    if (game.energy < 10) s *= 0.75;
    return s;
  },

  startAction(kind, fire) {
    const dur = { hoe: 0.36, water: 0.44, plant: 0.3, pull: 0.3 }[kind] || 0.3;
    this.action = { kind, t: 0, dur, fire, fired: false };
    this.moving = false;
  },

  sit(o) {
    const def = OBJ_TYPES[o.type] || decoType(o.id) || {};
    const fw = def.fw || 1;
    this.seatFrom = { x: this.x, y: this.y, dir: this.dir };
    this.sitting = o;
    o.sitting = true;
    this.x = o.x * TS + fw * 8;
    this.y = o.y * TS + 12;
    this.dir = 'down';
    this.sitT = 0;
    bark(pick(['Ahh. That\'s the stuff.', 'Just resting my eyes...', 'A fine spot to sit a spell.']));
  },
  stand() {
    if (!this.sitting) return;
    this.sitting.sitting = false;
    this.sitting = null;
    if (this.seatFrom) { this.x = this.seatFrom.x; this.y = this.seatFrom.y; this.dir = this.seatFrom.dir; }
  },
  bump() {
    const d = DIRV[this.dir];
    this.x -= d[0] * 4; this.y -= d[1] * 4;
    this.warpCooldown = 0.6;
  },

  update(dt) {
    if (this.warpCooldown > 0) this.warpCooldown -= dt;
    if (this.action) {
      const a = this.action;
      a.t += dt;
      if (!a.fired && a.t >= a.dur * 0.45) { a.fired = true; a.fire(); }
      if (a.t >= a.dur) this.action = null;
      return;
    }
    const inp = Input.move();
    if (this.sitting) {
      this.sitT += dt;
      gainEnergy(dt / REAL_SEC_PER_GAME_MIN / 1.5);
      if (this.sitT > 1.6 && Math.random() < dt * 0.6) spawnZ(this.x + 3, this.y - 24);
      if ((inp.x || inp.y) && this.sitT > 0.25) this.stand();
      return;
    }
    this.moving = !!(inp.x || inp.y);
    if (this.moving) {
      if (Math.abs(inp.x) > Math.abs(inp.y)) this.dir = inp.x > 0 ? 'right' : 'left';
      else if (inp.y) this.dir = inp.y > 0 ? 'down' : 'up';
      const len = Math.hypot(inp.x, inp.y) || 1;
      const sp = this.speed() * dt;
      this.tryMove(inp.x / len * sp, 0);
      this.tryMove(0, inp.y / len * sp);
      this.walkT += dt;
      this.frame = Math.floor(this.walkT * (game.upgrades.slippers ? 7 : 5.5)) % 4;
      this.stepT += dt;
      if (this.stepT > 0.36) { this.stepT = 0; Sound.play('step'); }
      this.idleT = 0;
    } else {
      this.walkT = 0; this.frame = 0; this.idleT += dt;
    }
    this.checkWarps();
  },

  tryMove(dx, dy) {
    const map = MAPS[game.map];
    const nx = this.x + dx, ny = this.y + dy;
    if (boxFree(map, nx, ny)) { this.x = nx; this.y = ny; return; }
    // corner assist: slide around edges when nearly lined up with a gap
    const step = Math.max(Math.abs(dx), Math.abs(dy));
    for (let k = 1; k <= 7; k++) {
      for (const s of [-1, 1]) {
        const ox = dy ? s * k : 0, oy = dx ? s * k : 0;
        if (boxFree(map, nx + ox, ny + oy) && boxFree(map, this.x + Math.sign(ox) * step, this.y + Math.sign(oy) * step)) {
          this.x += Math.sign(ox) * step; this.y += Math.sign(oy) * step;
          return;
        }
      }
    }
  },

  checkWarps() {
    if (this.warpCooldown > 0 || UI.transition) return;
    const map = MAPS[game.map];
    const f = this.footTile();
    for (const w of map.warps) {
      if (f.x >= w.x && f.x < w.x + w.w && f.y >= w.y && f.y < w.y + w.h) {
        this.warpCooldown = 0.5;
        useWarp(w);
        return;
      }
    }
  },

  depth() { return this.sitting ? this.y + 6 : this.y; },

  draw(ctx, cam) {
    const X = Math.round(this.x) - 8 - cam.x, Y = Math.round(this.y) - 23 - cam.y;
    // soft shadow
    ctx.fillStyle = 'rgba(20,30,20,0.28)';
    ctx.fillRect(X + 3, Y + 22, 10, 2); ctx.fillRect(X + 4, Y + 24, 8, 1);
    if (this.sitting) {
      ctx.drawImage(SPR.walter.sit, X, Y - 6);
      return;
    }
    const a = this.action;
    let spr = SPR.walter[this.dir][this.moving ? this.frame : 0];
    let dip = 0;
    if (a && (a.kind === 'plant' || a.kind === 'pull')) dip = a.t < a.dur * 0.5 ? 1 : 2;
    if (a && a.kind === 'hoe' && a.t > a.dur * 0.4) dip = 1;
    const toolBehind = a && this.dir === 'up';
    if (toolBehind) this.drawTool(ctx, X, Y);
    ctx.drawImage(spr, X, Y + dip);
    if (a && !toolBehind) this.drawTool(ctx, X, Y);
  },

  drawTool(ctx, X, Y) {
    const a = this.action, p = a.t / a.dur;
    const item = a.kind === 'water' ? 'can' : a.kind === 'hoe' ? 'hoe' : null;
    if (!item) return;
    let spr = item === 'can' ? ITEMS.can.icon() : SPR.item.hoe;
    let tx = X, ty = Y;
    const raised = p < 0.42;
    if (this.dir === 'right') { tx += 9; ty += raised ? 0 : 8; }
    else if (this.dir === 'left') { tx -= 9; ty += raised ? 0 : 8; spr = flipCache(spr); }
    else if (this.dir === 'down') { tx += 2; ty += raised ? 2 : 10; }
    else { tx += 0; ty += raised ? -6 : -2; }
    if (item === 'can') { ty = Y + 9; if (this.dir === 'down') ty = Y + 12; if (this.dir === 'up') ty = Y + 2; }
    ctx.drawImage(spr, tx, ty);
  },
};

const _flipCache = new Map();
function flipCache(spr) {
  let f = _flipCache.get(spr);
  if (!f) { f = flipX(spr); _flipCache.set(spr, f); }
  return f;
}

// ---------------------------------------------------------------------------
// Camera
// ---------------------------------------------------------------------------
const camera = {
  x: 0, y: 0, fx: 0, fy: 0,
  target() {
    const map = MAPS[game.map];
    let tx = player.x - W / 2, ty = player.y - 14 - H / 2;
    const mw = map.w * TS, mh = map.h * TS;
    tx = mw <= W ? (mw - W) / 2 : clamp(tx, 0, mw - W);
    ty = mh <= H ? (mh - H) / 2 : clamp(ty, 0, mh - H);
    return [tx, ty];
  },
  snap() { const [tx, ty] = this.target(); this.fx = tx; this.fy = ty; this.x = Math.round(tx); this.y = Math.round(ty); },
  update(dt) {
    const [tx, ty] = this.target();
    const k = 1 - Math.exp(-dt * 9);
    this.fx += (tx - this.fx) * k; this.fy += (ty - this.fy) * k;
    if (Math.abs(tx - this.fx) < 0.2) this.fx = tx;
    if (Math.abs(ty - this.fy) < 0.2) this.fy = ty;
    this.x = Math.round(this.fx); this.y = Math.round(this.fy);
  },
};

// ---------------------------------------------------------------------------
// Biscuit the cat
// ---------------------------------------------------------------------------
const cat = {
  x: 7 * TS + 8, y: 7 * TS + 12, state: 'sleep', t: 0, gx: 0, gy: 0, face: 1, anim: 0, placed: false,
  enterHome() {
    if (!this.placed) { this.placed = true; this.x = 7 * TS + 8; this.y = 8 * TS + 12; this.state = 'sleep'; this.t = 4; }
  },
  isAt(px0, py0) { return game.map === 'home' && Math.abs(this.x - px0) < 12 && Math.abs(this.y - 4 - py0) < 12; },
  tileIs(x, y) { return game.map === 'home' && Math.floor(this.x / TS) === x && Math.floor((this.y - 3) / TS) === y; },
  update(dt) {
    if (game.map !== 'home') return;
    this.t -= dt; this.anim += dt;
    if (this.state === 'walk') {
      const dx = this.gx - this.x, dy = this.gy - this.y, d = Math.hypot(dx, dy);
      if (d < 1.5) { this.state = Math.random() < 0.5 ? 'sit' : 'sleep'; this.t = 4 + Math.random() * 8; return; }
      const sp = 20 * dt;
      const nx = this.x + dx / d * sp, ny = this.y + dy / d * sp;
      if (!boxFree(MAPS.home, nx, ny)) { this.state = 'sit'; this.t = 2; return; }
      this.x = nx; this.y = ny; this.face = dx >= 0 ? 1 : -1;
      if (this.t < -12) { this.state = 'sit'; this.t = 3; }
      return;
    }
    if (this.t <= 0) {
      if (isNight() && Math.random() < 0.7) { this.state = 'sleep'; this.t = 10; return; }
      for (let tries = 0; tries < 8; tries++) {
        const gx = this.x + (Math.random() * 2 - 1) * 70, gy = this.y + (Math.random() * 2 - 1) * 50;
        const tx = Math.floor(gx / TS), ty = Math.floor(gy / TS);
        if (tx < 1 || ty < 1 || tx > 30 || ty > 20) continue;
        if (isSolidTile(MAPS.home, tx, ty) || tileAt(MAPS.home, tx, ty) === '~') continue;
        this.gx = tx * TS + 8; this.gy = ty * TS + 12; this.state = 'walk'; this.t = 0;
        return;
      }
      this.t = 3;
    }
  },
  draw(ctx, cam) {
    if (game.map !== 'home') return;
    let spr;
    if (this.state === 'walk') {
      const f = Math.floor(this.anim * 6) % 2;
      spr = this.face > 0 ? (f ? SPR.cat.walkB : SPR.cat.walkA) : (f ? SPR.cat.walkBL : SPR.cat.walkAL);
    } else spr = this.state === 'sleep' ? SPR.cat.sleep : SPR.cat.sit;
    const X = Math.round(this.x) - 8 - cam.x, Y = Math.round(this.y) - 15 - cam.y;
    ctx.fillStyle = 'rgba(20,30,20,0.25)';
    ctx.fillRect(X + 3, Y + 14, 10, 2);
    ctx.drawImage(spr, X, Y);
    if (this.state === 'sleep' && Math.random() < 0.004) spawnZ(this.x + 2, this.y - 10, true);
  },
};

function petCat() {
  cat.state = 'sit'; cat.t = 5;
  cat.face = player.x < cat.x ? -1 : 1;
  Sound.play('meow');
  for (let i = 0; i < 3; i++) particles.push({ type: 'heart', x: cat.x - 4 + i * 4, y: cat.y - 14, vx: (i - 1) * 6, vy: -18 - i * 4, life: 1.2 + i * 0.1, max: 1.3 });
  if (!game.flags.catToday) {
    game.flags.catToday = true;
    const got = gainEnergy(5);
    floatText(cat.x, cat.y - 22, '+' + got + ' energy', '#ffc6e2');
    bark('Biscuit purrs like a little engine.');
  } else bark(pick(['Biscuit blinks at Walter slowly. That means "I love you" in cat.', 'Biscuit headbutts Walter\'s shin.', 'Mrrp.']));
}

// ---------------------------------------------------------------------------
// Particles & floating text
// ---------------------------------------------------------------------------
const particles = [];
const PART_COLS = {
  dirt: [PAL.d, PAL.D, PAL.n], water: [PAL.i, PAL.w, PAL.I], leaf: [PAL.g, PAL.l, PAL.G], twig: [PAL.b, PAL.B, PAL.n],
  stone: [PAL['3'], PAL['4'], PAL['2']], seed: [PAL.N, PAL.n, PAL.d], spark: [PAL.Y, PAL['1'], PAL.y], petal: [PAL.V, PAL.v, PAL['6'], PAL.Y, PAL.U],
};

function burst(x, y, type, n) {
  for (let i = 0; i < n; i++) {
    const cols = PART_COLS[type];
    const p = { type, x: x + (Math.random() * 8 - 4), y, col: cols[i % cols.length], life: 0.6 + Math.random() * 0.4 };
    if (type === 'water') { p.vx = Math.random() * 30 - 15; p.vy = -10 - Math.random() * 25; p.g = 160; }
    else if (type === 'spark') { p.vx = Math.random() * 30 - 15; p.vy = -20 - Math.random() * 30; p.g = -10; }
    else { p.vx = Math.random() * 50 - 25; p.vy = -35 - Math.random() * 35; p.g = 200; }
    p.max = p.life;
    particles.push(p);
  }
}

function floatText(x, y, text, color) {
  particles.push({ type: 'text', x, y, vx: 0, vy: -14, text, col: color || '#fff', life: 1.6, max: 1.6 });
}

function spawnZ(x, y, small) {
  particles.push({ type: 'zzz', x, y, vx: 5 + Math.random() * 4, vy: -9, life: 1.8, max: 1.8, small });
}

function spawnCelebration() {
  for (let i = 0; i < 26; i++) {
    particles.push({ type: 'petal', screen: true, x: Math.random() * W, y: -10 - Math.random() * 60, vx: 8 + Math.random() * 14, vy: 16 + Math.random() * 18, col: pick(PART_COLS.petal), life: 5, max: 5, sway: Math.random() * 6 });
  }
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    if (p.type === 'petal') { p.x += (p.vx + Math.sin(p.life * 3 + p.sway) * 10) * dt; p.y += p.vy * dt; continue; }
    p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.g) p.vy += p.g * dt;
    if (p.type === 'smoke') { p.vx += (Math.random() - 0.5) * 8 * dt; }
  }
}

function drawParticles(ctx, cam, screenLayer) {
  for (const p of particles) {
    if (!!p.screen !== !!screenLayer) continue;
    const X = Math.round(p.x - (screenLayer ? 0 : cam.x)), Y = Math.round(p.y - (screenLayer ? 0 : cam.y));
    const fade = p.life / p.max;
    switch (p.type) {
      case 'text': {
        if (fade < 0.25 && Math.floor(p.life * 20) % 2) break;
        drawText(ctx, p.text, X, Y, p.col, { align: 'center', outline: '#2b1e2f' });
        break;
      }
      case 'heart': ctx.drawImage(SPR.item.heart, X - 3, Y - 3); break;
      case 'zzz': {
        if (p.small) { px(ctx, X, Y, '#e6f0ff'); px(ctx, X + 1, Y, '#e6f0ff'); px(ctx, X + 1, Y + 1, '#e6f0ff'); px(ctx, X, Y + 2, '#e6f0ff'); px(ctx, X + 1, Y + 2, '#e6f0ff'); }
        else drawText(ctx, 'z', X, Y, '#e6f0ff', { outline: '#2b1e2f' });
        break;
      }
      case 'smoke': {
        const s = p.size + (1 - fade) * 3;
        ctx.globalAlpha = 0.55 * fade;
        rect(ctx, X - (s >> 1), Y - (s >> 1), s, s, '#d9d4de');
        ctx.globalAlpha = 1;
        break;
      }
      case 'petal': rect(ctx, X, Y, 2, 1, p.col); px(ctx, X + (Math.floor(p.life * 4) % 2), Y + 1, p.col); break;
      case 'splash': px(ctx, X - 1, Y, '#cfe4ff'); px(ctx, X + 1, Y, '#cfe4ff'); px(ctx, X, Y - 1, '#cfe4ff'); break;
      default: rect(ctx, X, Y, p.type === 'water' ? 1 : 2, p.type === 'water' ? 2 : 1, p.col);
    }
  }
}

// ---------------------------------------------------------------------------
// Ambient critters: butterflies, bees, fireflies, birds. More beauty = more life.
// ---------------------------------------------------------------------------
const BUTTERFLY_COLS = [[PAL.o, PAL.k], [PAL['6'], PAL['4']], [PAL.X, PAL.x], [PAL.y, PAL.J], [PAL.V, PAL.v]];

const critters = {
  list: [], rainDrops: [], smokeT: 0, chirpT: 5,
  reset() { this.list = []; },
  flowerSpots() {
    const spots = [];
    if (game.map !== 'home') return spots;
    for (let y = 0; y < game.soil.length; y++) for (let x = 0; x < game.soil[y].length; x++) {
      const s = game.soil[y][x];
      if (s && s.plant && PLANTS[s.plant.id].kind === 'flower' && plantStage(s.plant) === 'mature' && !s.plant.wilted) spots.push([x * TS + 8, y * TS + 4, s.plant.id]);
    }
    return spots;
  },
  desired() {
    const map = MAPS[game.map];
    const want = { butterfly: 0, bee: 0, firefly: 0, bird: 0 };
    if (!map.outdoor) return want;
    const night = darkness() > 0.4;
    const b = game.map === 'home' ? beauty() : null;
    const rain = game.weather === 'rain';
    if (game.map === 'home') {
      if (!night && !rain) {
        want.butterfly = Math.min(12, Math.floor(b.total / 15));
        want.bee = Math.min(8, Math.floor(b.blooming / 5));
        want.bird = game.decos.filter(d => d.id === 'birdbath' || d.id === 'birdhouse').length;
      }
      if (night) want.firefly = Math.min(18, 2 + Math.floor(b.total / 14));
    } else {
      if (!night && !rain) want.butterfly = 3;
      if (night) want.firefly = 6;
    }
    return want;
  },
  update(dt) {
    const map = MAPS[game.map];
    const want = this.desired();
    const counts = { butterfly: 0, bee: 0, firefly: 0, bird: 0 };
    for (const c of this.list) counts[c.type]++;
    const spots = this.flowerSpots();
    for (const type of Object.keys(want)) {
      if (counts[type] < want[type] && Math.random() < dt * 2) this.list.push(this.spawn(type, spots, map));
    }
    for (let i = this.list.length - 1; i >= 0; i--) {
      const c = this.list[i];
      c.t += dt;
      if (counts[c.type] > want[c.type] && c.leaving === undefined) { c.leaving = true; counts[c.type]--; }
      this.move(c, dt, spots, map);
      if (c.dead) this.list.splice(i, 1);
    }
    // chimney smoke in the morning and evening
    if (game.map === 'home') {
      const h = game.minutes / 60;
      if ((h < 9 || h > 17) && (this.smokeT -= dt) < 0) {
        this.smokeT = 0.5 + Math.random() * 0.5;
        particles.push({ type: 'smoke', x: 3 * TS + 71, y: 2 * TS + 2, vx: 3, vy: -8, life: 3, max: 3, size: 2 + (Math.random() * 2 | 0) });
      }
      // birdsong on nice days
      if (!isNight() && game.weather !== 'rain' && (this.chirpT -= dt) < 0) {
        this.chirpT = 3 + Math.random() * (beauty().total > 60 ? 5 : 12);
        Sound.play('chirp');
      }
    }
    // rain
    if (game.weather === 'rain' && map.outdoor) {
      while (this.rainDrops.length < 90) this.rainDrops.push({ x: Math.random() * (W + 40), y: Math.random() * H, s: 150 + Math.random() * 60 });
      for (const r of this.rainDrops) {
        r.y += r.s * dt; r.x -= r.s * 0.25 * dt;
        if (r.y > H) {
          if (Math.random() < 0.3) particles.push({ type: 'splash', screen: true, x: r.x, y: H - Math.random() * H * 0.9, life: 0.18, max: 0.18, vx: 0, vy: 0 });
          r.y = -4; r.x = Math.random() * (W + 40);
        }
      }
    } else this.rainDrops.length = 0;
  },
  spawn(type, spots, map) {
    const mw = map.w * TS, mh = map.h * TS;
    const edge = () => {
      const side = Math.random() * 4 | 0;
      return side === 0 ? [camera.x - 10, camera.y + Math.random() * H] : side === 1 ? [camera.x + W + 10, camera.y + Math.random() * H] : side === 2 ? [camera.x + Math.random() * W, camera.y - 10] : [camera.x + Math.random() * W, camera.y + H * 0.8];
    };
    const c = { type, t: Math.random() * 10, vx: 0, vy: 0 };
    if (type === 'butterfly') {
      [c.x, c.y] = edge(); c.col = pick(BUTTERFLY_COLS); c.rest = 0;
      if (game.map === 'home' && Math.random() < 0.6 && spots.length) { const s = pick(spots); c.x = s[0] + (Math.random() * 60 - 30); c.y = s[1] - 30; }
    } else if (type === 'bee') {
      const s = spots.length ? pick(spots) : [mw / 2, mh / 2];
      c.x = s[0]; c.y = s[1]; c.home = s;
    } else if (type === 'firefly') {
      c.x = camera.x + Math.random() * W; c.y = camera.y + Math.random() * H; c.phase = Math.random() * 6;
    } else if (type === 'bird') {
      const ds = game.decos.filter(d => d.id === 'birdbath' || d.id === 'birdhouse');
      const d = ds[this.list.filter(l => l.type === 'bird').length % Math.max(1, ds.length)] || ds[0];
      c.perch = d ? [d.x * TS + 8, d.y * TS + (d.id === 'birdbath' ? 3 : -2)] : [mw / 2, mh / 2];
      [c.x, c.y] = edge(); c.state = 'fly'; c.col = pick([PAL.x, PAL.r, PAL.o]);
    }
    return c;
  },
  move(c, dt, spots, map) {
    if (c.type === 'butterfly') {
      if (c.leaving) { c.vy -= 10 * dt; c.y += c.vy * dt; c.x += Math.sin(c.t * 3) * 10 * dt; if (c.y < camera.y - 20) c.dead = true; return; }
      if (c.rest > 0) { c.rest -= dt; return; }
      if (!c.goal || Math.hypot(c.goal[0] - c.x, c.goal[1] - c.y) < 3) {
        if (c.goal && Math.random() < 0.5) c.rest = 0.8 + Math.random() * 1.5;
        c.goal = spots.length && Math.random() < 0.8 ? pick(spots).slice(0, 2) : [c.x + Math.random() * 120 - 60, c.y + Math.random() * 80 - 40];
        if (spots.length) { c.goal[0] += Math.random() * 6 - 3; }
      }
      const dx = c.goal[0] - c.x, dy = c.goal[1] - c.y, d = Math.hypot(dx, dy) || 1;
      c.x += (dx / d * 22 + Math.sin(c.t * 5) * 14) * dt;
      c.y += (dy / d * 22 + Math.cos(c.t * 7) * 18) * dt;
    } else if (c.type === 'bee') {
      if (c.leaving) { c.y -= 30 * dt; if (c.y < camera.y - 10) c.dead = true; return; }
      if (Math.random() < dt * 0.3 && spots.length) c.home = pick(spots);
      c.x += ((c.home[0] + Math.sin(c.t * 3.1) * 9) - c.x) * dt * 2.5 + Math.sin(c.t * 23) * 0.4;
      c.y += ((c.home[1] - 2 + Math.cos(c.t * 2.3) * 5) - c.y) * dt * 2.5 + Math.cos(c.t * 19) * 0.4;
    } else if (c.type === 'firefly') {
      if (c.leaving) { c.fade = (c.fade || 1) - dt; if (c.fade <= 0) c.dead = true; }
      c.x += Math.sin(c.t * 0.7 + c.phase) * 6 * dt;
      c.y += Math.cos(c.t * 0.5 + c.phase * 2) * 5 * dt;
    } else if (c.type === 'bird') {
      if (c.leaving) { c.state = 'fly'; c.x += 50 * dt; c.y -= 30 * dt; if (c.y < camera.y - 20) c.dead = true; return; }
      if (c.state === 'fly') {
        const dx = c.perch[0] - c.x, dy = c.perch[1] - c.y, d = Math.hypot(dx, dy);
        if (d < 2) { c.state = 'perch'; c.t = 0; return; }
        c.x += dx / d * 45 * dt; c.y += dy / d * 45 * dt + Math.sin(c.t * 12) * 0.3;
      } else if (c.t > 6 + Math.random() * 20) {
        c.state = 'hop'; c.t = 0;
      } else if (c.state === 'hop' && c.t > 0.3) c.state = 'perch';
    }
  },
  draw(ctx, cam) {
    for (const c of this.list) {
      const X = Math.round(c.x - cam.x), Y = Math.round(c.y - cam.y);
      if (c.type === 'butterfly') {
        const open = c.rest > 0 ? Math.floor(c.t * 2) % 3 !== 0 : Math.floor(c.t * 12) % 2 === 0;
        const [w1, w2] = c.col;
        vline(ctx, X, Y - 1, 3, PAL.k);
        if (open) { rect(ctx, X - 2, Y - 2, 2, 2, w1); rect(ctx, X + 1, Y - 2, 2, 2, w1); px(ctx, X - 2, Y, w2); px(ctx, X + 2, Y, w2); px(ctx, X - 1, Y, w1); px(ctx, X + 1, Y, w1); }
        else { rect(ctx, X - 1, Y - 2, 1, 2, w1); rect(ctx, X + 1, Y - 2, 1, 2, w1); }
      } else if (c.type === 'bee') {
        px(ctx, X, Y, PAL.y); px(ctx, X + 1, Y, PAL.k); px(ctx, X + 2, Y, PAL.y);
        if (Math.floor(c.t * 20) % 2) { px(ctx, X + 1, Y - 1, PAL['2']); }
      } else if (c.type === 'firefly') {
        const glow = (Math.sin(c.t * 2.2 + c.phase) + 1) / 2 * (c.fade === undefined ? 1 : c.fade);
        if (glow > 0.35) {
          px(ctx, X, Y, glow > 0.7 ? '#fbffb0' : '#d8ef6a');
          if (glow > 0.75) { ctx.globalAlpha = 0.45; px(ctx, X - 1, Y, '#d8ef6a'); px(ctx, X + 1, Y, '#d8ef6a'); px(ctx, X, Y - 1, '#d8ef6a'); px(ctx, X, Y + 1, '#d8ef6a'); ctx.globalAlpha = 1; }
        }
      } else if (c.type === 'bird') {
        const hop = c.state === 'hop' ? -2 : 0;
        const flap = c.state === 'fly' && Math.floor(c.t * 14) % 2;
        rect(ctx, X - 2, Y - 2 + hop, 4, 3, c.col);
        px(ctx, X + 2, Y - 3 + hop, c.col); px(ctx, X + 3, Y - 3 + hop, PAL.o); px(ctx, X + 2, Y - 3 + hop, PAL.k);
        px(ctx, X - 3, Y - 1 + hop, PAL.k);
        if (c.state === 'fly') { hline(ctx, X - 2, Y - 3 - (flap ? 2 : 0), 3, c.col); }
      }
    }
  },
  drawRain(ctx) {
    ctx.fillStyle = 'rgba(190,215,245,0.7)';
    for (const r of this.rainDrops) { ctx.fillRect(Math.round(r.x), Math.round(r.y), 1, 3); ctx.fillRect(Math.round(r.x) - 1, Math.round(r.y) + 3, 1, 1); }
  },
};

// ---- src/ui.js ----
'use strict';
// Everything drawn on top of the world: HUD, dialogue, menus, the shop, title and
// story screens, and the dithered screen transition.

const UI = {
  scene: 'title',
  stack: [],
  toasts: [],
  transition: null,
  itemFlash: 0, objectiveFlash: 0,
  barkMsg: null, barkT: 0,
  hits: [],
  push(win) { this.stack.push(win); },
  pop(win) { const i = this.stack.indexOf(win); if (i >= 0) this.stack.splice(i, 1); },
  top() { return this.stack[this.stack.length - 1]; },
  closeAll() { this.stack.length = 0; },
  modal() { return this.stack.length > 0 || !!this.transition; },
  // Pointer regions registered while drawing; clicks go to the last match.
  hit(x, y, w, h, fn) { this.hits.push({ x, y, w, h, fn }); },
  hovered(x, y, w, h) { const p = Input.pointer; return p.active && p.x >= x && p.x < x + w && p.y >= y && p.y < y + h; },
  click(gx, gy) {
    for (let i = this.hits.length - 1; i >= 0; i--) {
      const r = this.hits[i];
      if (gx >= r.x && gx < r.x + r.w && gy >= r.y && gy < r.y + r.h) { r.fn(); return true; }
    }
    return false;
  },
};

const VOICE = { Walter: 170, Mabel: 330, 'Mrs. Pemberton': 262, Timmy: 520, Radio: 660 };
const PORTRAITS = {
  Walter: () => SPR.walter.down[0], Mabel: () => SPR.npc.mabel, 'Mrs. Pemberton': () => SPR.npc.pemberton, Timmy: () => SPR.npc.timmy,
};

// ---------------------------------------------------------------------------
// Dialogue, questions, barks and toasts
// ---------------------------------------------------------------------------
function say(lines, opts) {
  if (typeof lines === 'string') lines = [lines];
  const list = lines.map(l => (Array.isArray(l) ? { who: l[0], text: l[1] } : { who: null, text: l }));
  UI.push(new DialogueBox(list, opts || {}));
}

function ask(question, options, cb, def) {
  UI.push(new ChoiceBox(question, options, cb, def || 0));
}

function bark(text) { UI.barkMsg = text; UI.barkT = 2.2 + text.length * 0.035; }

function toast(text, icon) {
  UI.toasts.push({ text, icon, t: 0, life: 4.2 });
  if (UI.toasts.length > 3) UI.toasts.shift();
}

const DLG = { x: 6, y: H - 52, w: W - 12, h: 48 };

class DialogueBox {
  constructor(lines, opts) { this.lines = lines; this.opts = opts; this.i = 0; this.chars = 0; this.t = 0; this.prep(); }
  prep() {
    const L = this.lines[this.i];
    this.portrait = L.who && PORTRAITS[L.who] ? PORTRAITS[L.who]() : null;
    const textW = DLG.w - 16 - (this.portrait ? 38 : 0);
    this.wrapped = wrapText(L.text, textW);
    this.total = this.wrapped.reduce((s, l) => s + l.length, 0);
    this.chars = 0;
  }
  advance() {
    if (this.chars < this.total) { this.chars = this.total; return; }
    this.i++;
    if (this.i >= this.lines.length) {
      UI.pop(this);
      Sound.play('blip');
      if (this.opts.then) this.opts.then();
      return;
    }
    this.prep();
  }
  update(dt) {
    this.t += dt;
    const L = this.lines[this.i];
    if (this.chars < this.total) {
      const before = Math.floor(this.chars);
      this.chars = Math.min(this.total, this.chars + dt * 55);
      if (Math.floor(this.chars) > before && (before % 2 === 0)) Sound.play('text', VOICE[L.who] || 420);
    }
    if (Input.pressed('action') || Input.pressed('back')) this.advance();
  }
  draw(ctx) {
    const L = this.lines[this.i];
    drawPanel(ctx, DLG.x, DLG.y, DLG.w, DLG.h);
    UI.hit(0, 0, W, H, () => this.advance());
    let tx = DLG.x + 9;
    if (this.portrait) {
      rect(ctx, DLG.x + 7, DLG.y + 7, 34, 34, '#c9dbb3');
      rect(ctx, DLG.x + 7, DLG.y + 7, 34, 1, PAL.k);
      ctx.save();
      ctx.beginPath(); ctx.rect(DLG.x + 8, DLG.y + 8, 32, 32); ctx.clip();
      ctx.drawImage(this.portrait, 0, 0, 16, 16, DLG.x + 8, DLG.y + 8, 32, 32);
      ctx.restore();
      tx += 38;
    }
    if (L.who) {
      const nw = textWidth(L.who) + 10;
      drawTag(ctx, DLG.x + 8, DLG.y - 9, nw, 13, UI_COL.accent);
      drawText(ctx, L.who, DLG.x + 13, DLG.y - 7, '#fff');
    }
    let left = Math.floor(this.chars);
    this.wrapped.forEach((line, i) => {
      if (left <= 0) return;
      const shown = line.slice(0, left);
      left -= line.length;
      drawText(ctx, shown, tx, DLG.y + 8 + i * 11, UI_COL.ink);
    });
    if (this.chars >= this.total && Math.floor(this.t * 3) % 2 === 0) {
      const ax = DLG.x + DLG.w - 14, ay = DLG.y + DLG.h - 12;
      hline(ctx, ax, ay, 5, UI_COL.red); hline(ctx, ax + 1, ay + 1, 3, UI_COL.red); px(ctx, ax + 2, ay + 2, UI_COL.red);
    }
  }
}

class ChoiceBox {
  constructor(q, options, cb, def) { this.q = q; this.options = options; this.cb = cb; this.sel = def; this.wrapped = wrapText(q, DLG.w - 18); this.t = 0; }
  choose(i) { UI.pop(this); Sound.play(i < 0 ? 'back' : 'select'); if (this.cb) this.cb(i); }
  update(dt) {
    this.t += dt;
    if (Input.repeat('up')) { this.sel = (this.sel + this.options.length - 1) % this.options.length; Sound.play('blip'); }
    if (Input.repeat('down')) { this.sel = (this.sel + 1) % this.options.length; Sound.play('blip'); }
    if (Input.pressed('action')) this.choose(this.sel);
    else if (Input.pressed('back')) this.choose(-1);
  }
  draw(ctx) {
    drawPanel(ctx, DLG.x, DLG.y, DLG.w, DLG.h);
    this.wrapped.slice(0, 3).forEach((l, i) => drawText(ctx, l, DLG.x + 9, DLG.y + 8 + i * 11, UI_COL.ink));
    const ow = Math.max(...this.options.map(o => textWidth(o))) + 26;
    const oh = this.options.length * 13 + 10;
    const ox = W - ow - 8, oy = DLG.y - oh - 2;
    drawPanel(ctx, ox, oy, ow, oh);
    this.options.forEach((o, i) => {
      const ry = oy + 5 + i * 13;
      if (UI.hovered(ox + 4, ry, ow - 8, 13) && Input.pointer.moved) this.sel = i;
      UI.hit(ox + 4, ry, ow - 8, 13, () => this.choose(i));
      if (i === this.sel) {
        rect(ctx, ox + 5, ry + 1, ow - 10, 11, '#f7dc8a');
        drawText(ctx, '▶', ox + 8 + (Math.floor(this.t * 4) % 2), ry + 3, UI_COL.red);
      }
      drawText(ctx, o, ox + 17, ry + 3, UI_COL.ink);
    });
  }
}

function drawToasts(ctx, dt) {
  let y = 4;
  for (let i = UI.toasts.length - 1; i >= 0; i--) {
    const t = UI.toasts[i];
    t.t += dt;
    if (t.t > t.life) { UI.toasts.splice(i, 1); continue; }
  }
  for (const t of UI.toasts) {
    const slide = Math.min(1, t.t * 5), out = Math.max(0, (t.t - t.life + 0.4) / 0.4);
    const lines = wrapText(t.text, 112);
    const w = Math.max(...lines.map(l => textWidth(l))) + 24, h = lines.length * 10 + 5;
    const x = Math.round(W / 2 - w / 2), yy = Math.round(y - (1 - slide) * 20 - out * 20);
    drawTag(ctx, x, yy, w, h, UI_COL.paper, PAL.k);
    hline(ctx, x + 1, yy + h - 2, w - 2, UI_COL.paperDark);
    const icon = t.icon === 'star' ? SPR.item.starOn : t.icon === 'letter' ? SPR.item.letter : SPR.item.coin;
    ctx.drawImage(icon, x + 5, yy + 3);
    lines.forEach((l, i) => drawText(ctx, l, x + 17, yy + 3 + i * 10, UI_COL.ink));
    y += h + 3;
  }
}

function drawBark(ctx) {
  if (!UI.barkMsg || UI.barkT <= 0) return;
  const lines = wrapText(UI.barkMsg, 150);
  const w = Math.max(...lines.map(l => textWidth(l))) + 10, h = lines.length * 10 + 6;
  let x = Math.round(player.x - camera.x - w / 2), y = Math.round(player.y - camera.y - 34 - h);
  x = clamp(x, 4, W - w - 4); y = clamp(y, 40, H - h - 30);
  drawTag(ctx, x, y, w, h, '#fffaf0', PAL.k);
  const tailX = clamp(Math.round(player.x - camera.x), x + 4, x + w - 5);
  if (y + h < player.y - camera.y - 20) { px(ctx, tailX, y + h, PAL.k); px(ctx, tailX - 1, y + h - 1, '#fffaf0'); px(ctx, tailX, y + h - 1, '#fffaf0'); }
  lines.forEach((l, i) => drawText(ctx, l, x + 5, y + 3 + i * 10, UI_COL.ink));
}

const HOTBAR_PAGE = 9;
function drawHotbar(ctx) {
  const inv = game.inv;
  const selIdx = Math.max(0, inv.findIndex(e => e.id === game.sel));
  const page = Math.floor(selIdx / HOTBAR_PAGE), pages = Math.ceil(inv.length / HOTBAR_PAGE);
  const slots = inv.slice(page * HOTBAR_PAGE, page * HOTBAR_PAGE + HOTBAR_PAGE);
  const n = slots.length;
  const bw = n * 19 + 7 + (pages > 1 ? 16 : 0);
  const x0 = Math.round(W / 2 - bw / 2), y0 = H - 26;
  drawPanel(ctx, x0, y0, bw, 25, 'dark');
  slots.forEach((e, i) => {
    const sx = x0 + 4 + i * 19, sy = y0 + 4;
    const sel = e.id === game.sel;
    drawSlot(ctx, sx, sy, sel);
    ctx.drawImage(ITEMS[e.id].icon(), sx + 1, sy + 1);
    if (ITEMS[e.id].kind !== 'tool') drawText(ctx, String(e.n), sx + 17, sy + 12, '#fff', { font: FONT_SMALL, align: 'right', outline: PAL.k });
    if (e.id === 'can') {
      const f = game.water / game.canCap;
      rect(ctx, sx + 2, sy + 15, 14, 2, '#34507a');
      rect(ctx, sx + 2, sy + 15, Math.round(14 * f), 2, PAL.i);
    }
    const key = String(i + 1);
    if (!Input.touchMode) drawText(ctx, key, sx + 2, sy + 1, sel ? UI_COL.red : '#7a5d4c', { font: FONT_SMALL });
    UI.hit(sx, sy, 18, 18, () => { game.sel = e.id; UI.itemFlash = 1.6; Sound.play('blip'); });
  });
  if (pages > 1) {
    const ax = x0 + bw - 14, ay = y0 + 6;
    drawText(ctx, '▶', ax + 2, ay + 2, UI_COL.gold);
    drawText(ctx, (page + 1) + '/' + pages, ax, ay + 11, '#cbbfd0', { font: FONT_SMALL });
    UI.hit(ax - 2, y0, 16, 25, () => { game.sel = inv[((page + 1) % pages) * HOTBAR_PAGE].id; UI.itemFlash = 1.6; Sound.play('blip'); });
  }
  // item name above the bar
  if (UI.itemFlash > 0) {
    const it = ITEMS[game.sel];
    let label = it.name;
    if (game.sel === 'can') label += ' (' + game.water + '/' + game.canCap + ')';
    ctx.globalAlpha = Math.min(1, UI.itemFlash * 2);
    drawText(ctx, label, W / 2, y0 - 11, '#fff', { align: 'center', outline: PAL.k });
    ctx.globalAlpha = 1;
  }
}

// Tile cursor and decoration ghost, drawn in world space.
function drawTargetCursor(ctx, cam) {
  if (UI.modal() || player.action || player.sitting) return;
  const t = player.targetTile();
  const map = MAPS[game.map];
  const it = ITEMS[selectedItem()];
  let show = false;
  if (game.map === 'home') {
    if (tillable(t.x, t.y)) show = true;
    if (decoAt(t.x, t.y) || cat.isAt(t.px, t.py)) show = true;
    if (it.kind === 'deco') {
      const a = decoAnchor(t.x, t.y, it.deco);
      if (a) {
        const dt = decoType(it.deco);
        const spr = dt.spr();
        ctx.globalAlpha = 0.6;
        ctx.drawImage(spr, a.x * TS + dt.fw * 8 - spr.width / 2 - cam.x, (a.y + dt.fh) * TS - spr.height - cam.y);
        ctx.globalAlpha = 1;
        if (it.deco === 'sprinkler') {
          ctx.globalAlpha = 0.25; rect(ctx, (a.x - 1) * TS - cam.x, (a.y - 1) * TS - cam.y, 48, 48, PAL.i); ctx.globalAlpha = 1;
        }
        return;
      }
      show = true;
    }
  }
  const o = objectAt(map, t.x, t.y);
  if (o && OBJ_TYPES[o.type].act) show = true;
  if (game.visitors.some(v => v.x === t.x && v.y === t.y)) show = true;
  if (selectedItem() === 'can' && tileAt(map, t.x, t.y) === '~') show = true;
  if (!show) return;
  const X = t.x * TS - cam.x, Y = t.y * TS - cam.y;
  const p = Math.floor(game.clock * 3) % 2;
  const col = '#fffaf0';
  // corner brackets with a dark outline
  for (const [cx, cy, sx, sy] of [[X - p, Y - p, 1, 1], [X + 15 + p, Y - p, -1, 1], [X - p, Y + 15 + p, 1, -1], [X + 15 + p, Y + 15 + p, -1, -1]]) {
    const hx = sx > 0 ? cx : cx - 3, vy = sy > 0 ? cy : cy - 3;
    rect(ctx, hx - 0, cy - 1, 5, 3, PAL.k); rect(ctx, cx - 1, vy - 0, 3, 5, PAL.k);
    hline(ctx, sx > 0 ? cx : cx - 3, cy, 4, col); vline(ctx, cx, sy > 0 ? cy : cy - 3, 4, col);
  }
}

// ---------------------------------------------------------------------------
// Screen transition (ordered-dither fade through black)
// ---------------------------------------------------------------------------
const DITHER = [];
function buildDither() {
  for (let lvl = 0; lvl <= 16; lvl++) {
    const c = makeCanvas(8, 8);
    for (let y = 0; y < 8; y++) for (let x = 0; x < 8; x++) if (BAYER4[((y >> 1) & 3) * 4 + ((x >> 1) & 3)] < lvl) px(c.ctx, x, y, '#140f18');
    DITHER.push(c);
  }
}
function transition(mid, opts) {
  const dur = opts && opts.slow ? 0.7 : 0.32;
  UI.transition = { t: 0, dur, mid, phase: 'out', hold: opts && opts.slow ? 0.35 : 0.05 };
}
function updateTransition(dt) {
  const tr = UI.transition;
  if (!tr) return;
  tr.t += dt;
  if (tr.phase === 'out' && tr.t >= tr.dur) {
    tr.phase = 'hold'; tr.t = 0;
    const fn = tr.mid; tr.mid = null;
    if (fn) fn();
  } else if (tr.phase === 'hold' && tr.t >= tr.hold) { tr.phase = 'in'; tr.t = 0; }
  else if (tr.phase === 'in' && tr.t >= tr.dur) UI.transition = null;
}
function drawTransition(ctx) {
  const tr = UI.transition;
  if (!tr) return;
  const f = tr.phase === 'out' ? tr.t / tr.dur : tr.phase === 'hold' ? 1 : 1 - tr.t / tr.dur;
  const lvl = clamp(Math.round(f * 16), 0, 16);
  if (lvl >= 16) { rect(ctx, 0, 0, W, H, '#140f18'); return; }
  if (lvl <= 0) return;
  ctx.fillStyle = ctx.createPattern(DITHER[lvl], 'repeat');
  ctx.fillRect(0, 0, W, H);
}

// Mabel's shop
// ---------------------------------------------------------------------------
const SHOP_TABS = ['Seeds', 'Decor', 'Supplies', 'Sell'];

function shopEntries(tab) {
  const out = [];
  if (tab === 0) {
    for (const id of Object.keys(PLANTS)) out.push({ kind: 'seed', id, item: 'seed_' + id, name: PLANTS[id].name + ' Seeds', price: PLANTS[id].seed, unlock: PLANTS[id].unlock, desc: describePlant(id), icon: () => ITEMS['seed_' + id].icon() });
  } else if (tab === 1) {
    for (const id of Object.keys(DECOR)) out.push({ kind: 'deco', id, item: 'deco_' + id, name: DECOR[id].name, price: DECOR[id].price, unlock: DECOR[id].unlock, desc: DECOR[id].desc + ' Beauty +' + DECOR[id].beauty + '.', icon: () => ITEMS['deco_' + id].icon() });
  } else if (tab === 2) {
    const icons = { fertilizer: () => SPR.item.fertilizer, sprinkler: () => SPR.item.sprinkler, bigcan: () => SPR.item.goldcan, slippers: () => SPR.item.slippers, vitamins: () => SPR.item.vitamins };
    for (const id of Object.keys(SUPPLIES)) {
      const s = SUPPLIES[id];
      out.push({ kind: 'supply', id, item: id === 'fertilizer' || id === 'sprinkler' ? id : null, name: s.name, price: s.price, unlock: s.unlock, once: s.once, desc: s.desc, icon: icons[id] });
    }
  } else {
    const crops = game.inv.filter(e => ITEMS[e.id].kind === 'crop');
    if (crops.length > 1) out.push({ kind: 'sellall', name: 'Sell everything', price: crops.reduce((s, e) => s + ITEMS[e.id].sell * e.n, 0), desc: 'Sell all of your vegetables at once.', icon: () => SPR.item.coin });
    for (const e of crops) out.push({ kind: 'sell', item: e.id, name: ITEMS[e.id].name, price: ITEMS[e.id].sell, desc: ITEMS[e.id].desc, icon: () => ITEMS[e.id].icon() });
  }
  return out;
}

function describePlant(id) {
  const P = PLANTS[id];
  if (P.kind === 'flower') return P.desc + ' Blooms in ' + P.days + ' days. Beauty +' + P.beauty + '.';
  return P.desc + ' Ready in ' + P.days + ' days. Sells for $' + P.sell + '.';
}

function owned(e) {
  if (e.kind === 'supply' && e.once) return !!game.upgrades[e.id];
  if (e.item) return invCount(e.item);
  return 0;
}

class ShopWindow {
  constructor() { this.tab = 0; this.sel = 0; this.scroll = 0; this.t = 0; this.msg = null; this.msgT = 0; this.holdT = 0; }
  entries() { return shopEntries(this.tab); }
  setTab(t) { this.tab = (t + SHOP_TABS.length) % SHOP_TABS.length; this.sel = 0; this.scroll = 0; Sound.play('blip'); }
  flash(msg) { this.msg = msg; this.msgT = 2.2; }
  close() { UI.pop(this); Sound.play('back'); if (game.map === 'shop') bark(pick(['Thanks, Mabel!', 'Much obliged.', 'See you soon, Mabel.'])); }
  buy(e) {
    if (!e) return;
    if (e.kind === 'sell' || e.kind === 'sellall') return this.sell(e);
    if (e.unlock > game.maxStars) { Sound.play('error'); return this.flash('Mabel: "That comes in once your garden has ' + '★'.repeat(e.unlock) + '."'); }
    if (e.once && game.upgrades[e.id]) { Sound.play('error'); return this.flash('You already have that.'); }
    if (game.money < e.price) { Sound.play('error'); return this.flash("Not enough money. Mabel won't take IOUs."); }
    game.money -= e.price;
    game.flags.boughtSomething = true;
    if (e.kind === 'seed' || e.kind === 'deco' || e.item) addItem(e.item, 1);
    else if (e.id === 'bigcan') { game.upgrades.bigcan = true; game.canCap = 30; game.water = 30; }
    else if (e.id === 'slippers') game.upgrades.slippers = true;
    else if (e.id === 'vitamins') { game.upgrades.vitamins = true; game.maxEnergy += 40; game.energy += 40; }
    Sound.play('coin');
    this.flash('Bought ' + e.name + '.');
  }
  sell(e) {
    if (e.kind === 'sellall') {
      let total = 0;
      for (const it of game.inv.slice()) if (ITEMS[it.id].kind === 'crop') { total += ITEMS[it.id].sell * it.n; removeItem(it.id, it.n); }
      addMoney(total);
      Sound.play('coin');
      this.flash('Sold everything for $' + total + '.');
      this.sel = 0;
      return;
    }
    if (!invCount(e.item)) return;
    removeItem(e.item, 1);
    addMoney(e.price);
    Sound.play('coin');
    this.flash('Sold ' + e.name + ' for $' + e.price + '.');
    const n = this.entries().length;
    if (this.sel >= n) this.sel = Math.max(0, n - 1);
  }
  update(dt) {
    this.t += dt; this.msgT -= dt;
    const list = this.entries();
    if (Input.pressed('left') || Input.pressed('prev')) this.setTab(this.tab - 1);
    if (Input.pressed('right') || Input.pressed('next')) this.setTab(this.tab + 1);
    if (list.length) {
      if (Input.repeat('up')) { this.sel = (this.sel + list.length - 1) % list.length; Sound.play('blip'); }
      if (Input.repeat('down')) { this.sel = (this.sel + 1) % list.length; Sound.play('blip'); }
    }
    this.sel = clamp(this.sel, 0, Math.max(0, list.length - 1));
    // hold-to-buy only after the key that opened the shop has been let go
    if (!Input.held('action')) this.armed = true;
    if (Input.pressed('action')) { this.buy(list[this.sel]); this.holdT = 0; }
    else if (this.armed && Input.held('action')) {
      this.holdT += dt;
      if (this.holdT > 0.45) { this.holdT -= 0.12; this.buy(this.entries()[this.sel]); }
    } else this.holdT = 0;
    if (Input.pressed('back') || Input.pressed('menu')) this.close();
  }
  draw(ctx) {
    const X = 8, Y = 6, Wd = W - 16, Hd = H - 12;
    UI.hit(0, 0, W, H, () => {});
    drawPanel(ctx, X, Y, Wd, Hd);
    drawText(ctx, "Mabel's Seeds & Supplies", X + 10, Y + 8, UI_COL.accent);
    const money = '$' + fmtMoney(game.money);
    ctx.drawImage(SPR.item.coin, X + Wd - 22 - textWidth(money), Y + 8);
    drawText(ctx, money, X + Wd - 12, Y + 8, UI_COL.ink, { align: 'right' });
    // tabs
    let tx = X + 8;
    SHOP_TABS.forEach((name, i) => {
      const tw = textWidth(name) + 12, on = i === this.tab;
      drawTag(ctx, tx, Y + 20, tw, 13, on ? UI_COL.accent : UI_COL.paperDark, on ? PAL.k : '#b39b73');
      drawText(ctx, name, tx + 6, Y + 23, on ? '#fff' : UI_COL.inkSoft);
      UI.hit(tx, Y + 20, tw, 13, () => this.setTab(i));
      tx += tw + 3;
    });
    drawText(ctx, '←→ tabs', X + Wd - 12, Y + 23, '#b39b73', { align: 'right' });
    // list
    const list = this.entries();
    const LX = X + 7, LY = Y + 37, LW = 150, rowH = 18, rows = 6;
    rect(ctx, LX, LY, LW, rows * rowH + 2, '#eadbb4');
    if (this.sel < this.scroll) this.scroll = this.sel;
    if (this.sel >= this.scroll + rows) this.scroll = this.sel - rows + 1;
    if (!list.length) drawText(ctx, this.tab === 3 ? 'No vegetables to sell.' : 'Nothing here.', LX + 8, LY + 8, UI_COL.inkSoft);
    list.slice(this.scroll, this.scroll + rows).forEach((e, k) => {
      const i = this.scroll + k, ry = LY + 1 + k * rowH;
      const locked = e.unlock > game.maxStars;
      const sel = i === this.sel;
      if (UI.hovered(LX, ry, LW, rowH) && Input.pointer.moved) this.sel = i;
      UI.hit(LX, ry, LW, rowH, () => { if (this.sel === i) this.buy(e); else { this.sel = i; Sound.play('blip'); } });
      if (sel) { rect(ctx, LX, ry, LW, rowH, '#f7dc8a'); rect(ctx, LX, ry, 2, rowH, UI_COL.red); }
      const icon = e.icon();
      if (locked) { ctx.globalAlpha = 0.35; ctx.drawImage(icon, LX + 3, ry + 1); ctx.globalAlpha = 1; }
      else ctx.drawImage(icon, LX + 3, ry + 1);
      const name = locked ? '???' : e.name;
      drawText(ctx, name.length > 17 ? name.slice(0, 16) + '.' : name, LX + 22, ry + 5, locked ? '#9d8a73' : UI_COL.ink);
      const priceStr = e.kind === 'supply' && e.once && game.upgrades[e.id] ? 'owned' : '$' + e.price;
      drawText(ctx, priceStr, LX + LW - 4, ry + 5, locked ? '#9d8a73' : game.money >= e.price || e.kind === 'sell' || e.kind === 'sellall' ? UI_COL.accent : UI_COL.red, { align: 'right' });
    });
    if (list.length > rows) {
      const sbH = rows * rowH, th = Math.max(8, sbH * rows / list.length), ty = LY + 1 + (sbH - th) * (this.scroll / (list.length - rows));
      rect(ctx, LX + LW + 1, LY + 1, 2, sbH, '#d8c49a'); rect(ctx, LX + LW + 1, Math.round(ty), 2, Math.round(th), UI_COL.wood);
    }
    // details
    const e = list[this.sel];
    const DX = LX + LW + 8, DW = X + Wd - DX - 8;
    if (e) {
      const locked = e.unlock > game.maxStars;
      rect(ctx, DX, LY, 36, 36, '#eadbb4');
      const icon = e.icon();
      ctx.save();
      if (locked) ctx.globalAlpha = 0.35;
      ctx.drawImage(icon, 0, 0, 16, 16, DX + 2, LY + 2, 32, 32);
      ctx.restore();
      const nameLines = wrapText(locked ? 'Coming soon' : e.name, DW - 42);
      nameLines.slice(0, 2).forEach((l, i) => drawText(ctx, l, DX + 41, LY + 3 + i * 10, UI_COL.ink));
      const have = owned(e);
      if (e.kind !== 'sellall') drawText(ctx, e.kind === 'supply' && e.once ? (have ? 'Owned' : 'One-time upgrade') : 'You have: ' + (e.kind === 'sell' ? invCount(e.item) : have), DX + 41, LY + 25, UI_COL.inkSoft);
      const desc = locked ? 'Mabel is expecting a shipment once your garden reaches ' + '★'.repeat(e.unlock) + '.' : e.desc;
      wrapText(desc, DW).slice(0, 5).forEach((l, i) => drawText(ctx, l, DX, LY + 42 + i * 10, UI_COL.inkSoft));
      // buy button
      const label = e.kind === 'sell' ? 'Sell 1 for $' + e.price : e.kind === 'sellall' ? 'Sell all for $' + e.price : locked ? 'Locked' : e.once && game.upgrades[e.id] ? 'Owned' : 'Buy for $' + e.price;
      const bw = textWidth(label) + 16, bx = DX, by = LY + rows * rowH - 14;
      const can = !locked && !(e.once && game.upgrades[e.id]) && (e.kind === 'sell' || e.kind === 'sellall' || game.money >= e.price);
      const hov = UI.hovered(bx, by, bw, 15);
      drawTag(ctx, bx, by, bw, 15, can ? (hov ? UI_COL.accentLight : UI_COL.accent) : '#b8a888', PAL.k);
      drawText(ctx, label, bx + 8, by + 4, '#fff');
      UI.hit(bx, by, bw, 15, () => this.buy(e));
    }
    // footer
    const help = Input.touchMode ? 'A: buy   B: close' : 'Z: buy (hold for more)   X: close';
    if (this.msgT > 0) drawText(ctx, this.msg, X + 10, Y + Hd - 16, UI_COL.red);
    else drawText(ctx, help, X + 10, Y + Hd - 16, '#9d8a73');
    // close box
    const clx = X + Wd - 16, cly = Y + Hd - 18;
    drawTag(ctx, clx, cly, 12, 12, UI_COL.red, PAL.k);
    drawText(ctx, 'x', clx + 4, cly + 1, '#fff');
    UI.hit(clx - 2, cly - 2, 16, 16, () => this.close());
  }
}

class MenuWindow {
  constructor(title, items) { this.title = title; this.items = items; this.sel = 0; this.t = 0; }
  update(dt) {
    this.t += dt;
    const n = this.items().length;
    if (Input.repeat('up')) { this.sel = (this.sel + n - 1) % n; Sound.play('blip'); }
    if (Input.repeat('down')) { this.sel = (this.sel + 1) % n; Sound.play('blip'); }
    if (Input.pressed('action')) this.choose(this.sel);
    else if (Input.pressed('back') || Input.pressed('menu')) { UI.pop(this); Sound.play('back'); }
  }
  choose(i) { const it = this.items()[i]; Sound.play('select'); it.fn(this); }
  draw(ctx) {
    const items = this.items();
    const w = 150, h = items.length * 14 + 30;
    const x = Math.round(W / 2 - w / 2), y = Math.round(H / 2 - h / 2);
    rect(ctx, 0, 0, W, H, 'rgba(20,15,24,0.55)');
    UI.hit(0, 0, W, H, () => {});
    drawPanel(ctx, x, y, w, h);
    drawText(ctx, this.title, x + w / 2, y + 8, UI_COL.accent, { align: 'center' });
    items.forEach((it, i) => {
      const ry = y + 21 + i * 14;
      if (UI.hovered(x + 6, ry, w - 12, 14) && Input.pointer.moved) this.sel = i;
      UI.hit(x + 6, ry, w - 12, 14, () => this.choose(i));
      if (i === this.sel) { rect(ctx, x + 6, ry, w - 12, 13, '#f7dc8a'); drawText(ctx, '▶', x + 10 + (Math.floor(this.t * 4) % 2), ry + 3, UI_COL.red); }
      drawText(ctx, it.label, x + 22, ry + 3, UI_COL.ink);
    });
  }
}

class EndingCard {
  constructor(cb) { this.cb = cb; this.t = 0; this.i = 0; }

    this.t += dt;

  }

    if (this.i < ENDING_CARD.length) { this.i++; this.t = 0; Sound.play('blip'); return; }

    for (let y = 0; y < 110; y++) {
      const f = y / 110 * (bands.length - 1), i = Math.floor(f), frac = f - i;
      for (let x = 0; x < W; x++) px(ctx, x, y, bayer(x, y) < frac ? bands[Math.min(i + 1, bands.length - 1)] : bands[i]);

const title = {
  t: 0, sel: 0, confirm: false, logo: null, sub: null, flowers: [],
  enter() {
    this.saved = hasSave();
    this.t = 0; this.sel = this.saved ? 1 : 0; this.confirm = false;
    if (!this.logo) {
      this.logo = bigText('Late Bloomer', '#fff4dc', 3, '#2b1e2f');
      this.flowers = [];
      const ids = ['daisy', 'tulip', 'poppy', 'lavender', 'rose', 'hydrangea', 'daisy', 'tulip', 'lavender', 'poppy', 'rose', 'daisy'];
      ids.forEach((id, i) => this.flowers.push({ id, x: 6 + i * 26 + (i % 2) * 4, y: 146 + (i % 3) * 6 }));
    }
  },
  items() {
    const list = [{ label: 'New game', fn: () => this.newGame() }];
    if (this.saved) list.push({ label: 'Continue', fn: () => this.cont() });
    list.push({ label: 'How to play', fn: () => openHelp() });
    return list;
  },
  newGame() {
    if (this.saved && !this.confirm) {
      ask('Start a new garden? Your saved garden will be lost.', ['Keep my garden', 'Start over'], c => { if (c === 1) { this.confirm = true; this.newGame(); } });
      return;
    }
    deleteSave();
    newGame();
    transition(() => startIntro());
  },
  cont() {
    if (!loadGame()) { toast('Could not load the save.', 'letter'); return; }
    transition(() => { UI.scene = 'play'; enterMap(game.map, game.px, game.py, game.dir); });
  },
  update(dt) {
    this.t += dt;
    if (UI.stack.length) return;

'use strict';
// Keyboard, mouse, gamepad and on-screen touch controls, all mapped to a small set
// of actions: up/down/left/right, action, back, menu, next, prev, slot1-9, mute.

const KEYMAP = {
  ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down', ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right',
  KeyZ: 'action', Space: 'action', Enter: 'action', NumpadEnter: 'action', KeyE: 'action', KeyJ: 'action',
  KeyX: 'back', Backspace: 'back', KeyK: 'back',
  Escape: 'menu', KeyP: 'menu',
  Tab: 'next', KeyC: 'next', BracketRight: 'next',
  KeyQ: 'prev', BracketLeft: 'prev',
  KeyM: 'mute',
};
for (let i = 1; i <= 9; i++) { KEYMAP['Digit' + i] = 'slot' + i; KEYMAP['Numpad' + i] = 'slot' + i; }

const Input = {
  down: new Set(),        // held key codes
  edges: new Set(),       // actions pressed this frame
  holdT: {}, repT: {},
  pointer: { x: -1, y: -1, active: false, moved: false },
  clicks: [],
  touchMode: false,
  touch: { dir: { x: 0, y: 0 }, a: false, b: false, ptrs: new Map(), layout: null },
  pad: { prev: [], axes: [0, 0], held: new Set() },

  held(action) {
    for (const code of this.down) if (KEYMAP[code] === action) return true;
    if (action === 'action' && this.touch.a) return true;
    if (action === 'back' && this.touch.b) return true;
    if (this.pad.held.has(action)) return true;
    const m = this.move();
    if (action === 'up' && m.y < -0.5) return true;
    if (action === 'down' && m.y > 0.5) return true;
    if (action === 'left' && m.x < -0.5) return true;
    if (action === 'right' && m.x > 0.5) return true;
    return false;
  },
  pressed(action) {
    if (this.edges.has(action)) { this.edges.delete(action); return true; }
    return false;
  },
  // Pressed, then auto-repeats while held (menus).
  repeat(action) {
    if (this.pressed(action)) { this.repT[action] = 0.34; return true; }
    if (this.held(action) && this.holdT[action] > 0 && this.repT[action] !== undefined) {
      if (this.holdT[action] >= this.repT[action]) { this.repT[action] += 0.1; return true; }
    }
    return false;
  },
  synth(action) { this.edges.add(action); },

  move() {
    let x = 0, y = 0;
    for (const code of this.down) {
      const a = KEYMAP[code];
      if (a === 'left') x -= 1; else if (a === 'right') x += 1; else if (a === 'up') y -= 1; else if (a === 'down') y += 1;
    }
    x += this.touch.dir.x + this.pad.axes[0];
    y += this.touch.dir.y + this.pad.axes[1];
    return { x: clamp(x, -1, 1), y: clamp(y, -1, 1) };
  },

  update(dt) {
    this.pollPad();
    for (const a of ['up', 'down', 'left', 'right', 'action', 'back']) {
      if (this.held(a)) this.holdT[a] = (this.holdT[a] || 0) + dt;
      else { this.holdT[a] = 0; this.repT[a] = undefined; }
    }
  },
  endFrame() { this.edges.clear(); this.pointer.moved = false; },

  pollPad() {
    const pads = navigator.getGamepads ? navigator.getGamepads() : [];
    const gp = pads && Array.from(pads).find(p => p && p.connected);
    this.pad.held = new Set();
    if (!gp) { this.pad.axes = [0, 0]; return; }
    const map = { 0: 'action', 1: 'back', 2: 'next', 3: 'prev', 4: 'prev', 5: 'next', 8: 'menu', 9: 'menu', 12: 'up', 13: 'down', 14: 'left', 15: 'right' };
    const now = gp.buttons.map(b => b.pressed);
    for (const [i, a] of Object.entries(map)) {
      if (now[i]) { this.pad.held.add(a); if (!this.pad.prev[i]) { this.edges.add(a); Sound.unlock(); this.touchMode = false; } }
    }
    this.pad.prev = now;
    const ax = gp.axes[0] || 0, ay = gp.axes[1] || 0;
    this.pad.axes = [Math.abs(ax) > 0.3 ? ax : 0, Math.abs(ay) > 0.3 ? ay : 0];
    let dx = this.pad.held.has('left') ? -1 : this.pad.held.has('right') ? 1 : 0;
    let dy = this.pad.held.has('up') ? -1 : this.pad.held.has('down') ? 1 : 0;
    if (dx || dy) this.pad.axes = [dx, dy];
    // stick flicks count as presses for menus
    const stickDir = ay < -0.6 ? 'up' : ay > 0.6 ? 'down' : ax < -0.6 ? 'left' : ax > 0.6 ? 'right' : null;
    if (stickDir && stickDir !== this.pad.lastStick) this.edges.add(stickDir);
    this.pad.lastStick = stickDir;
  },

  // ---- DOM wiring ----------------------------------------------------------
  attach(canvas) {
    window.addEventListener('keydown', e => {
      const a = KEYMAP[e.code];
      Sound.unlock();
      if (!a) return;
      e.preventDefault();
      this.touchMode = false;
      if (!e.repeat) {
        this.edges.add(a === 'next' && e.shiftKey ? 'prev' : a);
        this.down.add(e.code);
      }
    });
    window.addEventListener('keyup', e => { this.down.delete(e.code); });
    window.addEventListener('blur', () => { this.down.clear(); this.touch.ptrs.clear(); this.touch.a = this.touch.b = false; this.touch.dir = { x: 0, y: 0 }; });

    const toGame = e => {
      const r = canvas.getBoundingClientRect();
      const sx = (e.clientX - r.left) * (canvas.width / r.width), sy = (e.clientY - r.top) * (canvas.height / r.height);
      return { sx, sy, gx: (sx - view.gx) / view.scale, gy: (sy - view.gy) / view.scale };
    };
    canvas.addEventListener('pointerdown', e => {
      Sound.unlock();
      canvas.focus();
      const p = toGame(e);
      if (e.pointerType === 'touch') this.touchMode = true;
      try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* not supported */ }
      if (this.touchMode && this.touchStart(e.pointerId, p.sx, p.sy)) { e.preventDefault(); return; }
      this.pointer.x = p.gx; this.pointer.y = p.gy; this.pointer.active = e.pointerType === 'mouse';
      if (p.gx >= 0 && p.gy >= 0 && p.gx < W && p.gy < H) this.clicks.push([p.gx, p.gy]);
      else if (UI.scene === 'intro' || (UI.stack.length && UI.top() instanceof DialogueBox)) this.edges.add('action');
      e.preventDefault();
    });
    canvas.addEventListener('pointermove', e => {
      const p = toGame(e);
      if (this.touch.ptrs.has(e.pointerId)) { this.touchMove(e.pointerId, p.sx, p.sy); return; }
      if (e.pointerType === 'mouse') { this.pointer.x = p.gx; this.pointer.y = p.gy; this.pointer.active = true; this.pointer.moved = true; }
    });
    const end = e => { this.touchEnd(e.pointerId); if (e.pointerType !== 'mouse') this.pointer.active = false; };
    canvas.addEventListener('pointerup', end);
    canvas.addEventListener('pointercancel', end);
    canvas.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') this.pointer.active = false; });
    canvas.addEventListener('wheel', e => {
      e.preventDefault();
      if (UI.scene === 'play' && !UI.modal()) this.edges.add(e.deltaY > 0 ? 'next' : 'prev');
      else this.edges.add(e.deltaY > 0 ? 'down' : 'up');
    }, { passive: false });
    canvas.addEventListener('contextmenu', e => e.preventDefault());
  },

  // ---- on-screen controls ---------------------------------------------------
  touchStart(id, sx, sy) {
    const L = this.touch.layout;
    if (!L) return false;
    const d = (b) => Math.hypot(sx - b.cx, sy - b.cy);
    if (d(L.dpad) < L.dpad.r * 1.35) { this.touch.ptrs.set(id, 'dpad'); this.touchMove(id, sx, sy); return true; }
    if (d(L.a) < L.a.r * 1.3) { this.touch.ptrs.set(id, 'a'); this.touch.a = true; this.edges.add('action'); return true; }
    if (d(L.b) < L.b.r * 1.3) { this.touch.ptrs.set(id, 'b'); this.touch.b = true; this.edges.add('back'); return true; }
    return false;
  },
  touchMove(id, sx, sy) {
    if (this.touch.ptrs.get(id) !== 'dpad') return;
    const L = this.touch.layout.dpad;
    const dx = sx - L.cx, dy = sy - L.cy, dist = Math.hypot(dx, dy);
    if (dist < L.r * 0.22) { this.touch.dir = { x: 0, y: 0 }; return; }
    const nx = dx / dist, ny = dy / dist;
    const prev = this.touch.dir;
    const dir = { x: Math.abs(nx) > 0.42 ? Math.sign(nx) : 0, y: Math.abs(ny) > 0.42 ? Math.sign(ny) : 0 };
    if (dir.x !== prev.x || dir.y !== prev.y) {
      // new direction counts as a press for menus
      if (dir.y < 0 && prev.y >= 0) this.edges.add('up');
      if (dir.y > 0 && prev.y <= 0) this.edges.add('down');
      if (dir.x < 0 && prev.x >= 0 && !dir.y) this.edges.add('left');
      if (dir.x > 0 && prev.x <= 0 && !dir.y) this.edges.add('right');
    }
    this.touch.dir = dir;
  },
  touchEnd(id) {
    const k = this.touch.ptrs.get(id);
    if (!k) return;
    this.touch.ptrs.delete(id);
    if (k === 'dpad') this.touch.dir = { x: 0, y: 0 };
    if (k === 'a') this.touch.a = false;
    if (k === 'b') this.touch.b = false;
  },

  layoutTouch(cw, ch) {
    const unit = Math.max(2, Math.round(Math.min(cw, ch) / 120));
    const portrait = ch > cw * 1.15;
    const below = portrait ? ch - (view.gy + view.gh) : 0;
    const r = 24 * unit;
    let cy, dcx, acx;
    if (portrait && below > r * 2.4) {
      cy = view.gy + view.gh + below * 0.46;
      dcx = cw * 0.26; acx = cw * 0.74;
    } else {
      cy = ch - r - unit * 8;
      dcx = r + unit * 10; acx = cw - r - unit * 10;
    }
    this.touch.layout = {
      unit,
      dpad: { cx: dcx, cy, r },
      a: { cx: acx + 13 * unit, cy: cy - 10 * unit, r: 12 * unit },
      b: { cx: acx - 13 * unit, cy: cy + 10 * unit, r: 12 * unit },
      overlay: !(portrait && below > r * 2.4),
    };
  },

  drawTouch(sctx) {
    const L = this.touch.layout;
    if (!L || !this.touchMode) return;
    sctx.save();
    sctx.imageSmoothingEnabled = false;
    sctx.globalAlpha = L.overlay ? 0.7 : 1;
    const u = L.unit, d = this.touch.dir;
    const pad = d.y < 0 ? ART.dpad.up : d.y > 0 ? ART.dpad.down : d.x < 0 ? ART.dpad.left : d.x > 0 ? ART.dpad.right : ART.dpad.none;
    sctx.drawImage(pad, Math.round(L.dpad.cx - 24 * u), Math.round(L.dpad.cy - 24 * u), 48 * u, 48 * u);
    sctx.drawImage(ART.btnA[this.touch.a ? 1 : 0], Math.round(L.a.cx - 12 * u), Math.round(L.a.cy - 12 * u), 24 * u, 24 * u);
    sctx.drawImage(ART.btnB[this.touch.b ? 1 : 0], Math.round(L.b.cx - 12 * u), Math.round(L.b.cy - 12 * u), 24 * u, 24 * u);
    if (!L.overlay) {
      // pixel-font hint, drawn at 1x then scaled like everything else
      if (!this.hintCanvas) {
        const msg = 'Turn your phone sideways for a bigger garden';
        this.hintCanvas = makeCanvas(textWidth(msg) + 2, 11);
        drawText(this.hintCanvas.ctx, msg, 1, 1, '#7a6a80');
      }
      const hs = Math.max(1, Math.floor(u * 0.6)), hc = this.hintCanvas;
      sctx.drawImage(hc, Math.round(sctx.canvas.width / 2 - hc.width * hs / 2), Math.round(sctx.canvas.height - hc.height * hs - u * 6), hc.width * hs, hc.height * hs);
    }
    sctx.restore();
  },
};

// ---- src/main.js ----
'use strict';
// Boot, main loop, world rendering and presenting the 320x180 buffer on screen.

const screenCanvas = document.getElementById('screen');
const sctx = screenCanvas.getContext('2d');
const buf = makeCanvas(W, H), ctx = buf.ctx;
const lightLayer = makeCanvas(W, H);
const view = { gx: 0, gy: 0, gw: W, gh: H, scale: 1 };
const LIGHTS = {};

// ---------------------------------------------------------------------------
// Sizing: largest integer scale that fits, falling back to a fractional one on
// small screens so the game still fills a phone.
// ---------------------------------------------------------------------------
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  const r = screenCanvas.getBoundingClientRect();
  const cw = Math.max(1, Math.round(r.width * dpr)), ch = Math.max(1, Math.round(r.height * dpr));
  if (screenCanvas.width !== cw || screenCanvas.height !== ch) { screenCanvas.width = cw; screenCanvas.height = ch; }
  const portrait = ch > cw * 1.15;
  const availH = portrait ? ch * 0.62 : ch;
  const s = Math.min(cw / W, availH / H);
  const si = Math.floor(s);
  const scale = si >= 1 && si / s > 0.8 ? si : s;
  view.scale = scale;
  view.gw = Math.round(W * scale); view.gh = Math.round(H * scale);
  view.gx = Math.round((cw - view.gw) / 2);
  view.gy = portrait ? Math.round(Math.min(ch * 0.06, Math.max(0, availH - view.gh))) : Math.round((ch - view.gh) / 2);
  Input.layoutTouch(cw, ch);
}

// ---------------------------------------------------------------------------
// Light stamps: dithered radial falloff, so even the lighting is pixelated.
// ---------------------------------------------------------------------------
function makeLight(r, color) {
  const c = makeCanvas(r * 2, r * 2), x = c.ctx;
  for (let y = 0; y < r * 2; y++) for (let xx = 0; xx < r * 2; xx++) {
    const d = Math.hypot(xx - r + 0.5, y - r + 0.5) / r;
    if (d >= 1) continue;
    const a = 1 - d;
    const q = Math.min(3, Math.floor(a * 3 + bayer(xx, y))) / 3;
    if (q <= 0) continue;
    x.globalAlpha = q;
    px(x, xx, y, color);
  }
  return c;
}
function buildLights() {
  for (const r of [8, 14, 20, 24, 36]) { LIGHTS['cut' + r] = makeLight(r, '#000'); LIGHTS['glow' + r] = makeLight(r, '#ffc766'); }
  LIGHTS.moon = makeLight(14, '#b8e8ff');
}

// ---------------------------------------------------------------------------
// World rendering
// ---------------------------------------------------------------------------
function soilMask(x, y) {
  const t = (xx, yy) => { const s = soilAt(xx, yy); return s && s.tilled ? 1 : 0; };
  return t(x, y - 1) | (t(x + 1, y) << 1) | (t(x, y + 1) << 2) | (t(x - 1, y) << 3);
}

function drawWorld() {
  const map = MAPS[game.map], cam = camera;
  rect(ctx, 0, 0, W, H, map.indoor ? '#140f18' : '#2f5c35');
  // ground layer (clip to the visible part)
  const sx = Math.max(0, cam.x), sy = Math.max(0, cam.y);
  const sw = Math.min(map.w * TS - sx, W), sh = Math.min(map.h * TS - sy, H);
  ctx.drawImage(map.ground, sx, sy, sw, sh, sx - cam.x, sy - cam.y, sw, sh);

  const tx0 = Math.max(0, Math.floor(cam.x / TS)), ty0 = Math.max(0, Math.floor(cam.y / TS));
  const tx1 = Math.min(map.w - 1, Math.floor((cam.x + W) / TS)), ty1 = Math.min(map.h - 1, Math.floor((cam.y + H) / TS));

  // water sparkle
  if (map.outdoor) {
    for (let y = ty0; y <= ty1; y++) for (let x = tx0; x <= tx1; x++) {
      if (map.tiles[y][x] !== '~') continue;
      for (let k = 0; k < 2; k++) {
        const ph = (game.clock * 0.6 + hash2(x, y, k)) % 1;
        if (ph > 0.5) continue;
        const X = x * TS + 3 + ((hash2(x, y, k + 4) * 10) | 0) - cam.x, Y = y * TS + 5 + ((hash2(x, y, k + 9) * 8) | 0) - cam.y;
        hline(ctx, X, Y, ph < 0.25 ? 3 : 2, PAL.i);
      }
    }
  }

  // wall hangings and floor rugs
  for (const o of map.objects) {
    const def = OBJ_TYPES[o.type];
    if (!def.wall && !def.ground) continue;
    const spr = def.spr(o);
    const X = o.x * TS + (def.px || 0) - cam.x, Y = o.y * TS + (def.py || 0) - cam.y;
    if (def.sky) rect(ctx, X + 2, Y + 2, 20, 12, skyColor());
    if (def.ground) ctx.drawImage(spr, o.x * TS + (def.fw * TS - spr.width) / 2 - cam.x, o.y * TS + (def.fh * TS - spr.height) / 2 - cam.y);
    else ctx.drawImage(spr, X, Y);
  }

  const draws = [];
  // garden soil and plants
  if (game.map === 'home') {
    for (let y = ty0; y <= ty1 + 2 && y < map.h; y++) for (let x = tx0; x <= tx1; x++) {
      const s = soilAt(x, y);
      if (!s) continue;
      const X = x * TS - cam.x, Y = y * TS - cam.y;
      if (s.tilled) {
        ctx.drawImage(ART.soil[s.wet ? 'wet' : 'dry'][soilMask(x, y)], X, Y);
        if (s.wet && hash2(x, y, game.day) < 0.5) { px(ctx, X + 4, Y + 6, '#7a5a48'); px(ctx, X + 11, Y + 11, '#7a5a48'); }
      }
      if (s.debris) draws.push({ d: (y + 1) * TS - 3, spr: SPR.plant[s.debris], x: X, y: Y });
      if (s.plant) {
        const spr = plantSprite(s.plant);
        const sway = plantStage(s.plant) === 'mature' && PLANTS[s.plant.id].kind === 'flower' && !s.plant.wilted && Math.sin(game.clock * 1.4 + x * 0.9 + y * 1.3) > 0.85 ? 1 : 0;
        draws.push({ d: (y + 1) * TS - 2, spr, x: X + sway, y: Y + TS - spr.height });
        if (s.plant.fert && Math.floor(game.clock * 2 + x) % 5 === 0) draws.push({ d: (y + 1) * TS - 1, fn: () => px(ctx, X + 3 + ((game.clock * 7) | 0) % 10, Y + 4, PAL.Y) });
      }
    }
    for (const d of game.decos) {
      const t = decoType(d.id), spr = t.spr();
      draws.push({ d: (d.y + t.fh) * TS, spr, x: d.x * TS + t.fw * 8 - spr.width / 2 - cam.x, y: (d.y + t.fh) * TS - spr.height - cam.y });
    }
    for (const v of game.visitors) {
      const spr = SPR.npc[v.who];
      draws.push({ d: (v.y + 1) * TS, spr, x: v.x * TS - cam.x, y: (v.y + 1) * TS - spr.height - 2 - cam.y + (Math.floor(game.clock * 2 + v.x) % 2) });
    }
  }
  // map objects
  for (const o of map.objects) {
    const def = OBJ_TYPES[o.type];
    if (def.wall || def.ground) continue;
    const spr = def.spr(o);
    const bx = o.x * TS + def.fw * 8, by = (o.y + def.fh) * TS;
    let X = Math.round(bx - spr.width / 2 - cam.x), Y = by - spr.height - cam.y;
    if (def.npc) Y += Math.floor(game.clock * 1.5 + o.x) % 2 - 2;
    draws.push({ d: by - (o.type === 'bed' ? 20 : 0), spr, x: X, y: Y });
    if (def.bang && def.bang()) draws.push({ d: by + 1, spr: SPR.item.bang, x: bx - 2 - cam.x, y: Y - 10 + Math.round(Math.sin(game.clock * 5)) });
  }
  draws.push({ d: player.depth(), fn: () => player.draw(ctx, cam) });
  if (game.map === 'home') draws.push({ d: cat.y, fn: () => cat.draw(ctx, cam) });

  draws.sort((a, b) => a.d - b.d);
  for (const dr of draws) {
    if (dr.fn) dr.fn();
    else ctx.drawImage(dr.spr, Math.round(dr.x), Math.round(dr.y));
  }

  drawTargetCursor(ctx, cam);
  drawParticles(ctx, cam, false);
  drawLighting(map);
  critters.draw(ctx, cam);
  if (game.weather === 'rain' && map.outdoor) critters.drawRain(ctx);
  drawParticles(ctx, cam, true);
}

function skyColor() {
  const h = game.minutes / 60;
  if (h >= 20.5 || h < 5.5) return '#1b1d3a';
  if (h >= 18.5) return '#e0785f';
  if (h < 7) return '#f4b38a';
  return game.weather === 'rain' ? '#8a96a8' : '#9fd0e8';
}

function drawLighting(map) {
  const h = game.minutes / 60;
  if (!map.outdoor) {
    if (isNight()) { ctx.fillStyle = 'rgba(255,160,80,0.08)'; ctx.fillRect(0, 0, W, H); }
    return;
  }
  // weather & golden-hour tints
  if (game.weather === 'rain') { ctx.fillStyle = 'rgba(50,62,96,0.22)'; ctx.fillRect(0, 0, W, H); }
  else if (game.weather === 'cloud') { ctx.fillStyle = 'rgba(90,92,112,0.12)'; ctx.fillRect(0, 0, W, H); }
  if (h < 7.5) { ctx.fillStyle = 'rgba(255,170,100,' + ((7.5 - h) / 1.5 * 0.16).toFixed(3) + ')'; ctx.fillRect(0, 0, W, H); }
  if (h > 16.5 && h < 20.5) { const a = (1 - Math.abs(h - 18.3) / 2) * 0.2; if (a > 0) { ctx.fillStyle = 'rgba(255,130,80,' + a.toFixed(3) + ')'; ctx.fillRect(0, 0, W, H); } }
  const dark = darkness();
  if (dark <= 0.02) return;
  const L = lightLayer.ctx, cam = camera;
  L.globalCompositeOperation = 'source-over';
  L.clearRect(0, 0, W, H);
  L.fillStyle = 'rgba(16,18,48,' + dark.toFixed(3) + ')';
  L.fillRect(0, 0, W, H);
  L.globalCompositeOperation = 'destination-out';
  const lights = [];
  const add = (x, y, r, glow) => lights.push([x - cam.x, y - cam.y, r, glow]);
  for (const o of map.objects) {
    const def = OBJ_TYPES[o.type];
    if (def.light) add(o.x * TS + def.light.dx, o.y * TS + TS + def.light.dy, 36, true);
    if (o.type === 'house' || o.type === 'housePemberton' || o.type === 'houseBlue') {
      const bx = o.x * TS, by = (o.y + 4) * TS - 80;
      add(bx + 24, by + 54, 20, true); add(bx + 79, by + 54, 20, true);
    }
    if (o.type === 'shop') { const bx = o.x * TS, by = (o.y + 4) * TS - 80; add(bx + 26, by + 55, 24, true); add(bx + 86, by + 55, 24, true); }
  }
  if (game.map === 'home') {
    for (const d of game.decos) if (d.id === 'lamp') add(d.x * TS + 8, d.y * TS - 2, 36, true);
    for (let y = 0; y < game.soil.length; y++) for (let x = 0; x < game.soil[y].length; x++) {
      const s = game.soil[y][x];
      if (s && s.plant && s.plant.id === 'moonflower' && plantStage(s.plant) === 'mature' && !s.plant.wilted) lights.push([x * TS + 8 - cam.x, y * TS + 6 - cam.y, 14, 'moon']);
    }
  }
  if (dark > 0.3) lights.push([player.x - cam.x, player.y - 10 - cam.y, 24, false]);
  for (const [x, y, r] of lights) { if (x < -r || y < -r || x > W + r || y > H + r) continue; L.drawImage(LIGHTS['cut' + r], Math.round(x - r), Math.round(y - r)); }
  L.globalCompositeOperation = 'source-over';
  ctx.drawImage(lightLayer, 0, 0);
  // warm glow on top
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = dark * 0.45;
  for (const [x, y, r, glow] of lights) {
    if (!glow) continue;
    const stamp = glow === 'moon' ? LIGHTS.moon : LIGHTS['glow' + r];
    ctx.drawImage(stamp, Math.round(x - stamp.width / 2), Math.round(y - stamp.height / 2));
  }
  ctx.restore();
}

// ---------------------------------------------------------------------------
// Update
// ---------------------------------------------------------------------------
function updateWorld(dt) {
  const beforeHour = hourOf();
  game.minutes += dt / REAL_SEC_PER_GAME_MIN;
  if (hourOf() !== beforeHour) {
    updateMusic();
    if (hourOf() === 24 && !game.flags.midnightWarned) { game.flags.midnightWarned = true; bark(TEXT.lateNight); game.flags.sleptLate = true; }
  }
  if (game.minutes >= PASS_OUT) { passOut(); return; }

  if (Input.pressed('menu')) return openPause();
  if (Input.pressed('back') || Input.pressed('next')) cycleSelection(1);
  if (Input.pressed('prev')) cycleSelection(-1);
  for (let i = 1; i <= 9; i++) {
    if (Input.pressed('slot' + i)) {
      const selIdx = Math.max(0, game.inv.findIndex(e => e.id === game.sel));
      const page = Math.floor(selIdx / HOTBAR_PAGE);
      const e = game.inv[page * HOTBAR_PAGE + i - 1];
      if (e) { game.sel = e.id; UI.itemFlash = 1.6; Sound.play('blip'); }
    }
  }
  if (Input.pressed('action')) {
    if (player.sitting) player.stand();
    else if (!player.action) doAction();
  }
  player.update(dt);
  cat.update(dt);
  camera.update(dt);
  updateObjectives();
  game.px = player.x; game.py = player.y; game.dir = player.dir;
}

let lastT = 0;
function frame(now) {
  const dt = Math.min(0.05, Math.max(0, (now - lastT) / 1000));
  lastT = now;
  update(dt);
  render(dt);
  requestAnimationFrame(frame);
}

function update(dt) {
  Input.update(dt);
  for (const [gx, gy] of Input.clicks) UI.click(gx, gy);
  Input.clicks.length = 0;
  Sound.update();
  if (Input.pressed('mute')) { Sound.setMusic(!Sound.musicOn); saveSettings(); toast(Sound.musicOn ? 'Music on' : 'Music off', 'star'); }
  UI.itemFlash = Math.max(0, UI.itemFlash - dt);
  UI.objectiveFlash = Math.max(0, UI.objectiveFlash - dt);
  UI.barkT -= dt;

  if (UI.transition) updateTransition(dt);
  else if (UI.stack.length) UI.top().update(dt);
  else if (UI.scene === 'title') title.update(dt);
  else if (UI.scene === 'intro') intro.update(dt);
  else if (UI.scene === 'play') updateWorld(dt);

  if (UI.scene === 'play' && game) {
    game.clock += dt;
    updateParticles(dt);
    critters.update(dt);
    if (UI.stack.length || UI.transition) camera.update(dt);
  }
  Input.endFrame();
}

function render(dt) {
  UI.hits = [];
  if (UI.scene === 'title') title.draw(ctx);
  else if (UI.scene === 'intro') intro.draw(ctx);
  else if (UI.scene === 'play' && game) {
    drawWorld();
    const covered = UI.stack.some(w => w instanceof SummaryWindow || w instanceof EndingCard);
    if (!covered) {
      drawHUD(ctx, dt);
      drawBark(ctx);
    }
  }
  for (const w of UI.stack) w.draw(ctx);
  const fullCard = UI.stack.some(w => w instanceof SummaryWindow || w instanceof EndingCard);
  if (UI.scene === 'play' && !fullCard) drawToasts(ctx, dt);
  drawTransition(ctx);
  present();
}

function present() {
  sctx.imageSmoothingEnabled = false;
  sctx.fillStyle = '#140f18';
  sctx.fillRect(0, 0, screenCanvas.width, screenCanvas.height);
  sctx.drawImage(buf, 0, 0, W, H, view.gx, view.gy, view.gw, view.gh);
  Input.drawTouch(sctx);
}

// ---------------------------------------------------------------------------
// Boot
// ---------------------------------------------------------------------------
function boot(hotData) {
  buildArt();
  defineItems();
  buildMaps();
  buildDither();
  buildLights();
  loadSettings();
  Input.attach(screenCanvas);
  window.addEventListener('resize', resize);
  if (window.ResizeObserver) new ResizeObserver(resize).observe(screenCanvas);
  resize();
  showTitle();
  // Resume a hot-reloaded session (artifact viewer) or restore after a refresh.
  if (hotData && hotData.save && loadGame(hotData.save)) {
    UI.scene = 'play';
    enterMap(game.map, game.px, game.py, game.dir);
  }
  const hot = window.claude && window.claude.hot;
  if (hot && hot.snapshot) {
    try { hot.snapshot(() => ({ save: game && UI.scene === 'play' ? JSON.stringify(Object.assign({}, game, { clock: undefined })) : null })); } catch (e) { /* optional */ }
  }
  // keep the day's progress if the tab is closed mid-day
  document.addEventListener('visibilitychange', () => { if (document.hidden && game && UI.scene === 'play' && !UI.transition) saveGame(); });
  screenCanvas.focus();
  requestAnimationFrame(t => { lastT = t; frame(t); });
  window.LB = { get game() { return game; }, player, UI, Input, MAPS, doAction, endDay, enterMap, beauty, checkStars, addItem, openShop, newGame, saveGame, loadGame };
}

(function start() {
  const hot = window.claude && window.claude.hot;
  if (hot && hot.ready) hot.ready(boot);
  else boot((hot && hot.data) || {});
})();

</script>
