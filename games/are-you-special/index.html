<title>Are You Special</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: one centred column. A "crowd" panel (live count, real-world comparison, 10-step log meter) sits above each question card. */
:root {
  --bg: #eceef6;
  --paper: #ffffff;
  --ink: #1a1d3a;
  --muted: #5d6286;
  --line: #d5d8ea;
  --accent: #d6336c;
  --accent-soft: #fbe3ec;
  --gold: #b27a00;
  --gold-soft: #fff1cf;
  --panel: #1a1d3a;
  --panel-ink: #f3f4ff;
  --panel-muted: #a9addb;
  --panel-line: #33375e;
  --display: "Bricolage Grotesque", "Avenir Next", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12142a; --paper: #1c1f3c; --ink: #eef0ff; --muted: #a2a6cc; --line: #33375e;
    --accent: #ff6b9a; --accent-soft: #3d1f37; --gold: #f5b83d; --gold-soft: #3a3020;
    --panel: #262a52; --panel-ink: #f3f4ff; --panel-muted: #a9addb; --panel-line: #3d4270; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12142a; --paper: #1c1f3c; --ink: #eef0ff; --muted: #a2a6cc; --line: #33375e;
  --accent: #ff6b9a; --accent-soft: #3d1f37; --gold: #f5b83d; --gold-soft: #3a3020;
  --panel: #262a52; --panel-ink: #f3f4ff; --panel-muted: #a9addb; --panel-line: #3d4270; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 17px/1.5 var(--body); }
.wrap { max-width: 680px; margin: 0 auto; padding-inline: 16px; padding-block: 24px 56px; display: grid; gap: 18px; }

header { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.brand { font: 800 1.3rem/1 var(--display); letter-spacing: -0.02em; background: none; border: 0; color: var(--ink); padding: 0; cursor: pointer; }
.brand span { color: var(--accent); }
.hdr-right { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.lang { font: 500 0.8rem var(--body); color: var(--ink); background: var(--paper); border: 1px solid var(--line); border-radius: 999px; padding: 5px 10px; cursor: pointer; }
.lang:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
:lang(zh) .hero h1, :lang(zh) .q, :lang(zh) .big, :lang(zh) .verdict { letter-spacing: 0; }
:lang(zh) .hero h1 { line-height: 1.05; }
.qcount { font: 500 0.78rem var(--mono); color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
.link { background: none; border: 0; color: var(--muted); font: 500 0.78rem var(--mono); text-transform: uppercase; letter-spacing: .04em; cursor: pointer; padding: 4px 0; text-decoration: underline; text-underline-offset: 3px; }
.link:hover { color: var(--accent); }

/* crowd panel */
.crowd { background: var(--panel); color: var(--panel-ink); border-radius: 18px; padding: 20px 20px 18px; display: grid; gap: 14px; position: relative; overflow: hidden; }
.crowd .label { font: 600 0.7rem var(--mono); text-transform: uppercase; letter-spacing: 0.1em; color: var(--panel-muted); }
.big { font: 800 clamp(2.3rem, 10vw, 4.2rem)/0.95 var(--display); letter-spacing: -0.035em; font-variant-numeric: tabular-nums; word-break: break-word; }
.sub { display: flex; justify-content: space-between; gap: 6px 14px; flex-wrap: wrap; align-items: baseline; }
.compare { color: var(--panel-muted); font-size: 0.95rem; min-width: 0; }
.compare b { color: var(--panel-ink); }
.odds { font: 600 0.95rem var(--mono); color: var(--accent); white-space: nowrap; }
.rank { justify-self: start; font: 600 0.72rem var(--mono); text-transform: uppercase; letter-spacing: .08em; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--panel-line); color: var(--panel-ink); }

.meter { display: grid; grid-template-columns: repeat(10, 1fr); gap: 3px; }
.seg { height: 10px; border-radius: 3px; background: var(--panel-line); position: relative; overflow: hidden; }
.seg i { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--accent); transition: width .7s cubic-bezier(.2,.8,.2,1); }
.seg:last-child i { background: var(--gold); }
.ticks { display: grid; grid-template-columns: repeat(10, 1fr); gap: 3px; font: 500 0.62rem var(--mono); color: var(--panel-muted); text-align: right; margin-top: 4px; }
.ticks span:last-child { color: var(--gold); font-weight: 600; }

/* question card */
.card { background: var(--paper); border: 1px solid var(--line); border-radius: 16px; padding: 22px 20px; display: grid; gap: 16px; }
.cat { justify-self: start; font: 600 0.7rem var(--mono); text-transform: uppercase; letter-spacing: .1em; color: var(--accent); }
.q { font: 800 clamp(1.4rem, 5.5vw, 1.9rem)/1.12 var(--display); letter-spacing: -0.02em; text-wrap: balance; margin: -8px 0 0; }
.hint { color: var(--muted); font-size: 0.92rem; margin: -8px 0 0; }
.opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.opt { font: 700 1rem var(--body); color: var(--ink); background: var(--bg); border: 2px solid transparent; border-radius: 11px; padding: 11px 12px; text-align: left; cursor: pointer; display: grid; grid-template-columns: auto 1fr; align-items: center; column-gap: 10px; row-gap: 6px; transition: border-color .15s, transform .1s, opacity .2s; }
.opt .key { font: 600 0.72rem var(--mono); color: var(--muted); border: 1px solid var(--line); border-radius: 5px; min-width: 22px; padding-inline: 3px; height: 22px; display: grid; place-items: center; }
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt:active:not(:disabled) { transform: scale(.98); }
.opt:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.opt:disabled { cursor: default; opacity: .5; }
.opt.picked { opacity: 1; border-color: var(--accent); background: var(--accent-soft); }
.bar { grid-column: 1 / -1; display: flex; align-items: center; gap: 8px; font: 500 0.75rem var(--mono); color: var(--muted); }
.bar s { flex: 1; height: 5px; border-radius: 3px; background: var(--line); position: relative; overflow: hidden; text-decoration: none; }
.bar s i { position: absolute; inset: 0 auto 0 0; background: var(--muted); border-radius: 3px; }
.picked .bar s i { background: var(--accent); }

.feedback { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; border-top: 1px dashed var(--line); padding-top: 14px; }
.feedback p { margin: 0; min-width: 0; flex: 1 1 260px; }
.tag { display: inline-block; font: 600 0.68rem var(--mono); text-transform: uppercase; letter-spacing: .08em; padding: 2px 8px; border-radius: 999px; margin-right: 6px; vertical-align: 2px; background: var(--bg); color: var(--muted); }
.tag.rare { background: var(--accent-soft); color: var(--accent); }
.tag.ultra { background: var(--gold-soft); color: var(--gold); }

.btn { font: 700 1rem var(--body); background: var(--ink); color: var(--paper); border: 0; border-radius: 999px; padding: 12px 22px; cursor: pointer; }
.btn:hover { background: var(--accent); color: #fff; }
.btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.btn.ghost { background: transparent; color: var(--ink); border: 2px solid var(--line); }
.btn.ghost:hover { border-color: var(--accent); }
.kbd { font: 500 0.75rem var(--mono); color: var(--muted); }

.progress { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--muted); transition: width .3s; }

/* intro */
.hero { display: grid; gap: 18px; }
.hero h1 { font: 800 clamp(2.8rem, 14vw, 5.4rem)/0.88 var(--display); letter-spacing: -0.045em; margin: 0; text-wrap: balance; }
.hero h1 em { font-style: normal; color: var(--accent); }
.hero p { max-width: 54ch; margin: 0; }
.goal { display: flex; gap: 16px; align-items: center; background: var(--gold-soft); border-radius: 14px; padding: 16px; flex-wrap: wrap; }
.goal strong { font: 800 1.7rem/1.1 var(--display); color: var(--gold); }
.goal span { min-width: 0; flex: 1 1 260px; font-size: 0.95rem; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.best { font: 500 0.85rem var(--mono); color: var(--muted); }
.ladder { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
.ladder li { display: grid; grid-template-columns: minmax(7.5em, 34%) 1fr; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 0.95rem; }
.ladder li:last-child { border-bottom: 0; }
.ladder .lo { font: 600 0.85rem var(--mono); color: var(--accent); }
.ladder li:last-child .lo { color: var(--gold); }
h3 { margin: 0; font: 800 1.2rem var(--display); letter-spacing: -.01em; }

/* end */
.verdict { font: 800 clamp(1.8rem, 8vw, 3rem)/1 var(--display); letter-spacing: -0.03em; margin: 0; text-wrap: balance; }
.verdict.win { color: var(--gold); }
.list { list-style: none; margin: 0; padding: 0; display: grid; }
.list li { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.list li:last-child { border-bottom: 0; }
.list .lq { color: var(--muted); font-size: 0.85rem; grid-column: 1 / -1; }
.list .la { font-weight: 700; min-width: 0; }
.list .lp { font: 600 0.85rem var(--mono); color: var(--accent); white-space: nowrap; }
.note { font-size: 0.82rem; color: var(--muted); margin: 0; }
.share { width: 100%; font: 500 0.85rem var(--mono); padding: 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); resize: none; }
.toast { font: 500 0.8rem var(--mono); color: var(--accent); }

#confetti { position: fixed; inset: 0; pointer-events: none; width: 100%; height: 100%; z-index: 10; }

.pop { animation: pop .45s cubic-bezier(.2,1.6,.4,1); }
@keyframes pop { from { transform: scale(.94); } to { transform: none; } }
.slide { animation: slide .35s ease-out; }
@keyframes slide { from { opacity: .3; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .pop, .slide { animation: none; } .seg i, .progress i { transition: none; } }
</style>

const RANK_AT = [1, 10, 100, 1e3, 1e4, 1e5, 1e6, 1e7, 1e8, 1e9, 1e10]; // 1-in-N thresholds for each rank title
const COMPARE_AT = [4e9, 1.4e9, 3.3e8, 6.5e7, 8e6, 1e6, 8e4, 1e4, 1e3, 50, 11, 2, 1, 0]; // people counts for each comparison
const LADDER_AT = [10, 1e3, 1e6, 1e9, 1e10];

function pickLang() {
  try { const s = localStorage.getItem("ays-lang"); if (LANGS[s]) return s; } catch (e) {}
  const nav = (navigator.language || "en").slice(0, 2).toLowerCase();
  return LANGS[nav] ? nav : "en";
}
let lang = pickLang();
const L = () => LANGS[lang];
const U = () => L().ui;

function nf(x, maxFrac) { return x.toLocaleString(L().locale, { maximumFractionDigits: maxFrac }); }
function scaled(x) { return nf(x, x >= 10 ? 0 : 1); }
const words = n => L().words(n);
const oneIn = p => L().oneIn(words(Math.max(1, 1 / p)));
const peopleText = n => L().people(n);
const pctText = p => p >= .0001 ? (p).toLocaleString(L().locale, { style: "percent", maximumFractionDigits: p >= .01 ? 0 : 2 }) : U().under;
const rankOf = p => U().ranks[RANK_AT.filter(r => 1 / p >= r).length - 1];
const compareOf = n => U().compare[COMPARE_AT.findIndex(c => n >= c)];

// Question text in the current language, falling back to English.
function qText(qi) {
  const B = BANK[qi], t = L().q[B.q];
  return {
    q: t ? t[0] : B.q,
    hint: t ? (t[1] || "") : (B.hint || ""),
    o: B.o.map(([label], i) => (t && t[2] && t[2][i]) || L().common[label] || label),
  };
}

// Leaderboard: fewest questions needed to reach 1 in 10 billion, so lower is better.
function sendScoreToUsForge(score) {
  // only when running inside UsForge's page; does nothing when the game is opened on its own
  if (window.parent === window) return;
  if (!Number.isFinite(score) || score <= 0 || score >= 1e12) return;
  try {
    window.parent.postMessage({ usforge: 'score', score: Math.round(score), unit: 'questions', order: 'low' }, '*');
  } catch (e) {}
}

let state, best = null, shown = EARTH;
try { best = JSON.parse(localStorage.getItem("ays-best-10b")); } catch (e) {}

const $ = s => document.querySelector(s);
const app = $("#app");
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function tagOf(p) {
  const t = U().tags;
  if (p === NS) return `<span class="tag">${t[0]}</span>`;
  if (p < .01) return `<span class="tag ultra">${t[1]}</span>`;
  if (p < .06) return `<span class="tag rare">${t[2]}</span>`;
  if (p < .2) return `<span class="tag rare">${t[3]}</span>`;
  return `<span class="tag">${t[4]}</span>`;
}

const keyOf = i => String(i + 1);
const typed = { buf: "", timer: 0 };

function newGame() {
  state = { deck: shuffle(BANK.map((_, i) => i)), i: 0, p: 1, answers: [], phase: "q", picked: null };
  shown = EARTH;
  render();
}

function crowdHTML(p) {
  const n = EARTH * p;
  const lvl = Math.log10(1 / p);
  let segs = "", ticks = "";
  for (let k = 0; k < 10; k++) {
    segs += `<div class="seg"><i style="width:${Math.max(0, Math.min(1, lvl - k)) * 100}%"></i></div>`;
    ticks += `<span>${U().ticks[k]}</span>`;
  }
  return `<section class="crowd" aria-live="polite">
    <div class="label">${U().crowdLabel}</div>
    <div class="big" id="bigcount">${peopleText(shown)}</div>
    <div class="sub"><span class="compare">${U().thatIs(compareOf(n))}</span><span class="odds">${p === 1 ? U().everyone : U().youAre(oneIn(p))}</span></div>
    <div>
      <div class="meter" role="img" aria-label="${esc(oneIn(p))}">${segs}</div>
      <div class="ticks" aria-hidden="true">${ticks}</div>
    </div>
    <span class="rank">${rankOf(p)}</span>
  </section>`;
}

// Count the big number down smoothly, on a log scale so big drops still feel readable.
function animateCount(to) {
  const el = $("#bigcount"); if (!el) return;
  const from = shown; shown = to;
  if (reduced || from === to) { el.textContent = peopleText(to); return; }
  const a = Math.log(Math.max(from, .1)), b = Math.log(Math.max(to, .1)), t0 = performance.now(), dur = 900;
  el.classList.remove("pop"); void el.offsetWidth; el.classList.add("pop");
  (function step(t) {
    const k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3);
    el.textContent = peopleText(k === 1 ? to : Math.exp(a + (b - a) * e));
    if (k < 1 && document.body.contains(el)) requestAnimationFrame(step);
  })(t0);
}

function langPicker() {
  const opts = Object.entries(LANGS).map(([k, v]) => `<option value="${k}" ${k === lang ? "selected" : ""}>${v.name}</option>`).join("");
  return `<select class="lang" id="lang" aria-label="${U().language}">${opts}</select>`;
}

function brandHTML(tag) {
  const b = U().brand;
  return tag === "h1" ? `${b[0]}<em>${b[1]}</em>${b[2]}` : `${b[0]}<span>${b[1]}</span>${b[2]}`;
}

function header(right) {
  return `<header><button class="brand" id="home">${brandHTML()}</button><div class="hdr-right">${right}${langPicker()}</div></header>`;
}

function wireHeader() {
  $("#lang").onchange = e => {
    lang = e.target.value;
    try { localStorage.setItem("ays-lang", lang); } catch (err) {}
    render();

}

function renderIntro() {
  const ladder = LADDER_AT.map((n, i) => `<li><span class="lo">${oneIn(1 / n)}</span><span>${U().ladder[i]}</span></li>`).join("");
  app.innerHTML = `
    <header><span></span><div class="hdr-right">${langPicker()}</div></header>
    <section class="hero slide">
      <h1>${brandHTML("h1")}</h1>
      <p>${U().intro}</p>
      <div class="goal"><strong>${U().goalBig}</strong><span>${U().goalText}</span></div>
      <div class="row">
        <button class="btn" id="start">${U().start}</button>
        ${best ? `<span class="best">${U().best(best)}</span>` : ""}
      </div>
    </section>
    <section class="card slide">
      <h3>${U().ladderTitle}</h3>
      <ul class="ladder">${ladder}</ul>
      <p class="note">${U().note(BANK.length)}</p>
    </section>`;
  wireHeader();
  $("#start").onclick = newGame;
  $("#start").focus();
}

function renderQuestion() {
  const qi = state.deck[state.i], B = BANK[qi], T = qText(qi);
  const done = state.phase === "fb";
  const opts = B.o.map(([, p], idx) => {
    const cls = done && state.picked === idx ? "opt picked" : "opt";
    const bar = done ? `<span class="bar"><s><i style="width:${p === NS ? 0 : Math.max(2, p * 100)}%"></i></s>${p === NS ? "–" : pctText(p)}</span>` : "";
    return `<button class="${cls}" data-i="${idx}" ${done ? "disabled" : ""}><span class="key">${keyOf(idx)}</span><span>${esc(T.o[idx])}</span>${bar}</button>`;
  }).join("");

  let fb = "";
  if (done) {
    const p = B.o[state.picked][1];
    const reached = state.p <= 1 / TARGET;
    const out = state.i + 1 >= state.deck.length;
    const msg = p === NS ? U().fbNS
      : p < .2 ? U().fbRare(pctText(p), esc(T.o[state.picked]), words(1 / p))
      : U().fbCommon(pctText(p));
    fb = `<div class="feedback"><p>${tagOf(p)}${msg}</p><button class="btn" id="next">${reached ? U().seeResults : out ? U().finish : U().nextQ}</button></div>`;
  }

  const n = state.deck.length;
  app.innerHTML = `
    ${header(`<span class="qcount">${U().qOf(state.i + 1, n)}</span><button class="link" id="quit">${U().endGame}</button>`)}
    ${crowdHTML(state.p)}
    <section class="card ${done ? "" : "slide"}">
      <div class="progress" aria-hidden="true"><i style="width:${(state.i / n) * 100}%"></i></div>
      <span class="cat">${U().cats[B.c]}</span>
      <h2 class="q">${esc(T.q)}</h2>
      ${T.hint ? `<p class="hint">${esc(T.hint)}</p>` : ""}
      <div class="opts">${opts}</div>
      ${fb}
    </section>`;

  wireHeader();
  $("#home").onclick = () => { state = null; render(); };
  $("#quit").onclick = () => { state.phase = "end"; render(); };
  if (!done) {
    app.querySelectorAll(".opt").forEach(b => b.onclick = () => answer(+b.dataset.i));
  } else {
    $("#next").onclick = next;
    $("#next").focus({ preventScroll: true });
    animateCount(EARTH * state.p);
  }
}

function answer(idx) {
  if (state.phase !== "q") return;
  const qi = state.deck[state.i];
  const p = BANK[qi].o[idx][1];
  state.picked = idx;
  if (p !== NS) state.p *= p;
  state.answers.push({ qi, oi: idx, p });
  state.phase = "fb";
  render();
}

function next() {
  if (state.p <= 1 / TARGET || state.i + 1 >= state.deck.length) { state.phase = "end"; return render(); }
  state.i++; state.phase = "q"; state.picked = null;
  render();
}

function renderEnd() {
  const won = state.p <= 1 / TARGET;
  const used = state.answers.length;
  let newBest = false;
  if (won && !state.scored) {
    state.scored = true;
    sendScoreToUsForge(used);
    if (!best || used < best) {
      best = used; newBest = state.newBest = true;
      try { localStorage.setItem("ays-best-10b", JSON.stringify(best)); } catch (e) {}
    }
  }
  newBest = newBest || state.newBest;
  const n = EARTH * state.p;
  shown = n;
  const verdict = won ? U().verdictWin : used === 0 ? U().verdictNone : U().verdictStill(peopleText(n));
  const counted = state.answers.filter(a => a.p !== NS).sort((a, b) => a.p - b.p);
  const rows = counted.map(a => {
    const T = qText(a.qi);
    return `<li><span class="lq">${esc(T.q)}</span><span class="la">${esc(T.o[a.oi])}</span><span class="lp">${pctText(a.p)}</span></li>`;
  }).join("");
  const shareText = won && counted.length
    ? U().shareWin(oneIn(state.p), used, qText(counted[0].qi).o[counted[0].oi], pctText(counted[0].p))
    : U().shareLose(oneIn(state.p));

  app.innerHTML = `
    ${header(`<span class="qcount">${U().answered(used)}</span>`)}
    ${crowdHTML(state.p)}
    <section class="card slide">
      <h2 class="verdict ${won ? "win" : ""}">${won ? U().winHead : ""}${verdict}</h2>
      <p style="margin:0">${won ? U().reached(used, newBest, best) : U().stopped(oneIn(state.p), rankOf(state.p))}</p>
      <div class="row"><button class="btn" id="again">${U().again}</button><button class="btn ghost" id="copy">${U().copy}</button><span class="toast" id="toast" aria-live="polite"></span></div>
      <textarea class="share" id="sharetext" rows="2" readonly hidden>${esc(shareText)}</textarea>
    </section>
    <section class="card slide">
      <h3>${U().listTitle}</h3>
      <ul class="list">${rows || `<li><span class="la">${U().noAnswers}</span></li>`}</ul>
      <p class="note">${U().disclaimer}</p>
    </section>`;
  wireHeader();
  $("#home").onclick = () => { state = null; render(); };
  $("#again").onclick = newGame;
  $("#copy").onclick = () => {
    const done = () => { $("#toast").textContent = U().copied; };
    const fallback = () => { const t = $("#sharetext"); t.hidden = false; t.select(); $("#toast").textContent = U().copyFallback; };
    try { navigator.clipboard.writeText(shareText).then(done, fallback); } catch (e) { fallback(); }
  };
  $("#again").focus({ preventScroll: true });
  if (won && !state.celebrated) { state.celebrated = true; confetti(); }
}

function confetti() {
  if (reduced) return;
  const c = $("#confetti"), ctx = c.getContext("2d");
  c.hidden = false;
  const W = c.width = innerWidth * devicePixelRatio, H = c.height = innerHeight * devicePixelRatio;
  const css = getComputedStyle(document.documentElement);
  const cols = ["--accent", "--gold", "--ink", "--muted"].map(v => css.getPropertyValue(v).trim());
  const bits = Array.from({ length: 160 }, () => ({
    x: W / 2 + (Math.random() - .5) * W * .3, y: H * .35, vx: (Math.random() - .5) * 18 * devicePixelRatio, vy: (-Math.random() * 16 - 6) * devicePixelRatio,
    r: Math.random() * Math.PI, vr: (Math.random() - .5) * .3, s: (5 + Math.random() * 6) * devicePixelRatio, col: cols[Math.floor(Math.random() * cols.length)],
  }));
  const t0 = performance.now();
  (function frame(t) {
    ctx.clearRect(0, 0, W, H);
    for (const b of bits) {
      b.vy += .45 * devicePixelRatio; b.vx *= .99; b.x += b.vx; b.y += b.vy; b.r += b.vr;
      ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.r); ctx.fillStyle = b.col; ctx.fillRect(-b.s / 2, -b.s / 4, b.s, b.s / 2); ctx.restore();
    }
    if (t - t0 < 3500) requestAnimationFrame(frame); else { ctx.clearRect(0, 0, W, H); c.hidden = true; }
  })(t0);
}

document.addEventListener("keydown", e => {
  if (!state || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.target && e.target.id === "lang") return;
  if (state.phase === "q" && /^[0-9]$/.test(e.key)) {
    // Two-digit answers: typing "1" waits briefly in case "10", "11" or "12" follows.
    const len = BANK[state.deck[state.i]].o.length;
    clearTimeout(typed.timer);
    const buf = typed.buf + e.key;
    const n = +buf;
    if (n < 1 || n > len) { typed.buf = ""; return; }
    if (n * 10 > len) { typed.buf = ""; answer(n - 1); return; }
    typed.buf = buf;
    typed.timer = setTimeout(() => { typed.buf = ""; answer(n - 1); }, 600);
  } else if (state.phase === "fb" && e.key === "Enter" && document.activeElement?.id !== "next") {
    next();
  }
});

function render() {
  document.documentElement.lang = L().locale;
  if (!state) renderIntro();
  else if (state.phase === "end") renderEnd();
  else renderQuestion();
  if (state && state.phase === "q") window.scrollTo({ top: 0 });
}

window.claude?.hot?.snapshot?.(() => ({ state, best }));
const validState = s => s && Array.isArray(s.deck) && Number.isInteger(s.deck[0]) && s.answers.every(a => Number.isInteger(a.qi));
const start = d => { if (d && validState(d.state)) { state = d.state; shown = EARTH * state.p; } render(); };
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
