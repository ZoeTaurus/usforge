<script>/* THEME_BOOT */try{var m=localStorage.getItem('usforge-theme')||'auto',h=new Date().getHours();document.documentElement.dataset.theme=m==='auto'?(h>=7&&h<19?'light':'dark'):m}catch(e){}</script>

<div class="wrap">
  <header class="top">

    <span class="eyebrow">404</span>

<script>
document.getElementById('lucky').onclick = async () => {
  try { const g = (await (await fetch('/games.json')).json()).filter(x => !x.url && x.build !== false); location.href = '/play.html?g=' + encodeURIComponent(g[Math.floor(Math.random() * g.length)].slug); }
  catch (e) { location.href = '/'; }
};
</script>
