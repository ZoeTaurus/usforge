<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Terra Scripta</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&display=swap"
    />
<style>
/* Terra Scripta: a cartographer's desk at night. Iron-gall dark surround,
   parchment map, brass for writing the world, verdigris for recording it,
   vermilion for where the two disagree. */

:root {
  color-scheme: dark;
  --night: #13161d;
  --night-2: #1a1e27;
  --night-3: #232834;
  --line: #333a4a;
  --line-soft: #272d3a;
  --parchment: #e8dab9;
  --parchment-dim: #b7ab90;
  --parchment-faint: #867d6a;
  --paper: #f1e6cb;
  --paper-deep: #e2d2ac;
  --ink: #3b2a1e;
  --ink-soft: #6b5641;
  --brass: #c9a45c;
  --brass-light: #e6c887;
  --brass-deep: #8a6a30;
  --verdigris: #5fa192;
  --verdigris-light: #a4dccd;
  --vermilion: #dd5638;
  --ink-violet: #8e80e2;
  --ink-violet-deep: #4f3f96;
  --display: 'IM Fell English SC', 'IM Fell English', Georgia, 'Times New Roman', serif;
  --serif: 'IM Fell English', Georgia, 'Times New Roman', serif;
  --sans: 'Alegreya Sans', 'Gill Sans', 'Trebuchet MS', system-ui, sans-serif;
  --gutter: 16px;
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

html {
  height: 100%;
  padding-block: env(safe-area-inset-top, 0px) env(safe-area-inset-bottom, 0px);
}

body {
  height: 100%;
  margin: 0;
  background: var(--night);
  background-image: radial-gradient(ellipse at 50% 40%, #1c2130 0%, var(--night) 70%);
  color: var(--parchment);
  font-family: var(--sans);
  font-size: 15px;
  line-height: 1.4;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

[hidden] {
  display: none !important;
}

button {
  font: inherit;
  color: inherit;
}

:focus-visible {
  outline: 2px solid var(--brass-light);
  outline-offset: 2px;
}

.app {
  height: 100%;
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  grid-template-rows: auto minmax(0, 1fr) auto;
  gap: 10px;
  padding-inline: var(--gutter);
  padding-block: 8px 10px;
}

/* ------------------------------------------------------------------ top bar */

.topbar {
  display: flex;
  align-items: center;
  gap: 14px;
  min-height: 40px;
}

.brand {
  font-family: var(--display);
  font-size: 23px;
  letter-spacing: 0.05em;
  color: var(--brass-light);
  white-space: nowrap;
}

.chapter-name {
  flex: 1;
  min-width: 0;
  font-family: var(--serif);
  font-style: italic;
  font-size: 17px;
  color: var(--parchment-dim);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.top-actions {
  display: flex;
  gap: 8px;
}

.icon-btn {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  border: 1px solid var(--line);
  background: var(--night-2);
  display: grid;
  place-items: center;
  cursor: pointer;
  transition: border-color 0.15s, color 0.15s;
}

.icon-btn:hover {
  border-color: var(--brass);
  color: var(--brass-light);
}

.icon-btn svg {
  width: 20px;
  height: 20px;
}

/* --------------------------------------------------------------------- desk */

.desk {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 290px;
  gap: 16px;
  min-height: 0;
}

.map-wrap {
  position: relative;
  min-width: 0;
  min-height: 0;
  display: grid;
  place-items: center;
  overflow: hidden;
  padding: 8px;
}

.map-frame {
  position: relative;
  line-height: 0;
  border-radius: 3px;
  box-shadow:
    0 0 0 1px #0b0a08,
    0 0 0 5px #3a2a19,
    0 0 0 6px #6b5025,
    0 22px 50px rgba(0, 0, 0, 0.6);
}

#map {
  display: block;
  touch-action: none;
  cursor: pointer;
  border-radius: 2px;
}

.app[data-view='map'] #map {
  cursor: crosshair;
}

.app[data-view='map'] #map.walking {
  cursor: pointer;
}

.hint {
  position: absolute;
  top: 10px;
  left: 50%;
  transform: translateX(-50%);
  width: min(560px, calc(100% - 20px));
  display: flex;
  gap: 10px;
  align-items: flex-start;
  padding: 10px 12px 10px 16px;
  background: linear-gradient(180deg, var(--paper), var(--paper-deep));
  color: var(--ink);
  border-radius: 4px;
  border-left: 4px solid var(--brass-deep);
  box-shadow: 0 10px 24px rgba(0, 0, 0, 0.45);
  font-family: var(--serif);
  font-size: 16px;
  line-height: 1.35;
  z-index: 2;
  animation: hint-in 0.35s ease-out;
}

.hint p {
  margin: 0;
  flex: 1;
  text-wrap: pretty;
}

.hint b {
  font-family: var(--sans);
  font-weight: 700;
  font-size: 0.92em;
}

.hint-close {
  border: 0;
  background: transparent;
  color: var(--ink-soft);
  font-size: 22px;
  line-height: 1;
  cursor: pointer;
  padding: 0 2px;
}

@keyframes hint-in {
  from {
    opacity: 0;
    transform: translate(-50%, -6px);
  }
}

/* Zoom and centre, only while the map is out. */
.map-controls {
  position: absolute;
  right: 22px;
  bottom: 22px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  z-index: 2;
}

.app[data-view='world'] .map-controls {
  display: none;
}

.map-ctl {
  width: 38px;
  height: 38px;
  display: grid;
  place-items: center;
  border-radius: 8px;
  border: 1px solid rgba(92, 64, 30, 0.7);
  background: linear-gradient(180deg, var(--paper), var(--paper-deep));
  color: var(--ink);
  cursor: pointer;
  box-shadow: 0 4px 10px rgba(0, 0, 0, 0.35);
}

.map-ctl svg {
  width: 22px;
  height: 22px;
}

.map-ctl:hover {
  border-color: var(--brass-deep);
  color: #000;
}

/* Talking to someone: a slip of paper at the foot of the view. */
.dialogue {
  position: absolute;
  left: 50%;
  bottom: 18px;
  transform: translateX(-50%);
  width: min(600px, calc(100% - 24px));
  padding: 14px 18px 12px;
  background: linear-gradient(180deg, var(--paper), var(--paper-deep));
  color: var(--ink);
  border-radius: 6px;
  border-top: 4px solid var(--brass-deep);
  box-shadow: 0 14px 34px rgba(0, 0, 0, 0.55);
  z-index: 3;
  animation: dialogue-in 0.25s ease-out;
}

.dialogue .who {
  margin: 0 0 4px;
  font-family: var(--display);
  font-size: 18px;
  color: var(--brass-deep);
}

.dialogue .where {
  margin-left: 8px;
  font-family: var(--serif);
  font-style: italic;
  font-size: 14px;
  color: var(--ink-soft);
}

.dialogue .said {
  margin: 0 0 10px;
  font-family: var(--serif);
  font-size: 17px;
  line-height: 1.4;
  text-wrap: pretty;
}

.dialogue .choices {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  justify-content: flex-end;
}

.dialogue .choices button {
  border: 1px solid var(--brass-deep);
  background: #fbf3df;
  color: var(--ink);
  border-radius: 6px;
  padding: 7px 14px;
  font-family: var(--sans);
  font-weight: 600;
  font-size: 14px;
  cursor: pointer;
}

.dialogue .choices button:first-child {
  background: var(--ink);
  color: var(--paper);
  border-color: var(--ink);
}

.dialogue .choices button kbd {
  margin-right: 6px;
  font-family: var(--sans);
  font-size: 11px;
  opacity: 0.7;
}

@keyframes dialogue-in {
  from {
    opacity: 0;
    transform: translate(-50%, 8px);
  }
}

/* ------------------------------------------------------------------ journal */

.journal {
  display: flex;
  flex-direction: column;
  gap: 12px;
  min-height: 0;
}

.journal h2 {
  margin: 0 0 8px;
  font-family: var(--display);
  font-weight: 400;
  font-size: 15px;
  letter-spacing: 0.08em;
  color: var(--brass);
}

.gauges,
.objectives,
.notes {
  background: var(--night-2);
  border: 1px solid var(--line-soft);
  border-radius: 8px;
  padding: 12px 14px;
}

.gauges {
  display: grid;
  gap: 10px;
}

.gauge-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: 5px;
}

.gauge-label {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--parchment-faint);
}

.gauge-value {
  font-variant-numeric: tabular-nums;
  font-weight: 500;
}

.bar {
  height: 9px;
  border-radius: 5px;
  background: #0d0f14;
  box-shadow: inset 0 0 0 1px #262b37;
  overflow: hidden;
}

.bar-fill {
  height: 100%;
  width: 50%;
  border-radius: 5px;
  transition: width 0.2s linear;
}

.bar-fill.ink {
  background: linear-gradient(90deg, var(--ink-violet-deep), var(--ink-violet));
}

.bar-fill.world {
  background: linear-gradient(90deg, var(--verdigris), var(--brass));
}

.bar-fill.world.low {
  background: linear-gradient(90deg, #7a2a1a, var(--vermilion));
}

.gauge.flash .bar {
  animation: bar-flash 0.5s ease 2;
}

@keyframes bar-flash {
  50% {
    box-shadow: inset 0 0 0 1px var(--vermilion), 0 0 10px rgba(221, 86, 56, 0.6);
  }
}

.gauge-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.gauge.small {
  display: flex;
  flex-direction: column;
  gap: 3px;
}

.hearts {
  display: flex;
  gap: 2px;
  font-size: 17px;
  line-height: 1;
  color: var(--vermilion);
}

.hearts .empty {
  color: #3a3f4c;
}

.lies {
  font-size: 20px;
  line-height: 1;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  color: var(--parchment-dim);
}

.lies.bad {
  color: var(--vermilion);
}

.tear-timer {
  margin: 0;
  font-family: var(--serif);
  font-style: italic;
  font-size: 15px;
  color: var(--vermilion);
}

.tear-timer.urgent {
  animation: pulse 0.8s ease-in-out infinite;
}

@keyframes pulse {
  50% {
    opacity: 0.45;
  }
}

.objectives ul {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  gap: 8px;
}

.objectives li {
  display: grid;
  grid-template-columns: 18px 1fr;
  gap: 8px;
  align-items: start;
}

.objectives .mark {
  width: 16px;
  height: 16px;
  margin-top: 2px;
  border: 1.5px solid var(--brass);
  border-radius: 50%;
}

.objectives li.done .mark {
  background: var(--verdigris);
  border-color: var(--verdigris);
  box-shadow: inset 0 0 0 3px var(--night-2);
}

.objectives li.done .label {
  color: var(--parchment-faint);
  text-decoration: line-through;
  text-decoration-color: rgba(134, 125, 106, 0.6);
}

.objectives li.fresh {
  animation: fresh 1.2s ease-out;
}

@keyframes fresh {
  from {
    background: rgba(201, 164, 92, 0.25);
  }
}

.objectives .label {
  font-weight: 500;
  text-wrap: pretty;
}

.objectives .status {
  display: block;
  font-size: 13px;
  font-style: italic;
  color: var(--parchment-faint);
}

.notes {
  flex: 1;
  min-height: 90px;
  display: flex;
  flex-direction: column;
}

.notes ol {
  list-style: none;
  margin: 0;
  padding: 0 4px 0 0;
  overflow-y: auto;
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
  gap: 6px;
  font-size: 13.5px;
  line-height: 1.35;
  color: var(--parchment-dim);
  scrollbar-width: thin;
  scrollbar-color: var(--line) transparent;
}

.notes li {
  position: relative;
  padding-left: 14px;
}

.notes li::before {
  content: '';
  position: absolute;
  left: 0;
  top: 0.5em;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--parchment-faint);
}

.notes li.good::before {
  background: var(--verdigris);
}

.notes li.bad::before,
.notes li.warn::before {
  background: var(--vermilion);
}

.notes li.event::before {
  background: var(--brass);
}

.notes li.tremor {
  font-family: var(--serif);
  font-style: italic;
  font-size: 14px;
}

.notes li.tremor::before {
  background: transparent;
  border: 1.5px solid var(--brass);
}

.notes li.bad {
  color: #f0b3a3;
}

/* --------------------------------------------------------------------- tray */

.tray {
  display: flex;
  gap: 12px;
  align-items: stretch;
  justify-content: space-between;
  flex-wrap: wrap;
}

.tools,
.tray-actions {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}

.tool,
.tray-btn {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  min-width: 66px;
  padding: 7px 9px 5px;
  border-radius: 9px;
  border: 1px solid var(--line);
  background: var(--night-2);
  color: var(--parchment-dim);
  cursor: pointer;
  font-size: 12.5px;
  font-weight: 500;
  line-height: 1.1;
  transition: border-color 0.12s, color 0.12s, background 0.12s;
}

.tool svg,
.tray-btn svg {
  width: 24px;
  height: 24px;
}

.tool .key,
.tray-btn .key {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.06em;
  color: var(--parchment-faint);
}

.tool .cost {
  position: absolute;
  top: 3px;
  right: 5px;
  font-size: 10px;
  font-weight: 700;
  color: var(--ink-violet);
}

.tool:hover,
.tray-btn:hover {
  border-color: var(--brass-deep);
  color: var(--parchment);
}

.tool[aria-pressed='true'] {
  border-color: var(--brass);
  color: var(--brass-light);
  background: linear-gradient(180deg, #2c2717, #1e1b13);
  box-shadow: inset 0 0 0 1px rgba(201, 164, 92, 0.35);
}

.tool.record[aria-pressed='true'],
.tray-btn.record {
  border-color: var(--verdigris);
  color: var(--verdigris-light);
}

.tool.record[aria-pressed='true'] {
  background: linear-gradient(180deg, #17302b, #13211f);
  box-shadow: inset 0 0 0 1px rgba(95, 161, 146, 0.35);
}

.tool.new {
  animation: tool-new 0.9s ease-in-out 4;
}

@keyframes tool-new {
  50% {
    box-shadow: 0 0 0 3px rgba(230, 200, 135, 0.55);
    border-color: var(--brass-light);
  }
}

/* Out in the world the brushes stay in the pack: only the map and the quill are at hand. */
.app[data-view='world'] .tools,
.app[data-view='world'] #btnBrush {
  display: none;
}

.app[data-view='map'] .tray-hint {
  display: none;
}

.tray-hint {
  flex: 1;
  min-width: 0;
  margin: 0;
  align-self: center;
  font-family: var(--serif);
  font-style: italic;
  font-size: 16px;
  color: var(--parchment-faint);
}

.tray-btn.talk {
  min-width: 110px;
  border-color: #e6b84a;
  color: #f6dfa4;
  background: linear-gradient(180deg, #3a2f17, #261f10);
  animation: talk-in 0.25s ease-out;
}

@keyframes talk-in {
  from {
    opacity: 0;
    transform: translateY(4px);
  }
}

.travels {
  margin: 8px 0 0;
  font-size: 12.5px;
  color: var(--parchment-dim);
}

.objectives .giver {
  display: block;
  font-size: 12px;
  font-style: italic;
  color: var(--brass);
}

.tray-btn.map-toggle {
  min-width: 104px;
  border-color: var(--brass);
  color: var(--brass-light);
  background: linear-gradient(180deg, #2c2717, #1e1b13);
  box-shadow: inset 0 0 0 1px rgba(201, 164, 92, 0.3);
}

.tray-btn.map-toggle:hover {
  color: #fff3d6;
  border-color: var(--brass-light);
}

.tray-btn.map-toggle[aria-pressed='true'] {
  background: linear-gradient(180deg, #3a3220, #282214);
}

/* ------------------------------------------------------------------ overlay */

.overlay {
  position: fixed;
  inset: 0;
  z-index: 10;
  display: grid;
  place-items: center;
  padding: 16px;
  background: rgba(8, 9, 13, 0.72);
  backdrop-filter: blur(3px);
  overflow-y: auto;
}

.card {
  width: min(720px, 100%);
  max-height: calc(100% - 8px);
  overflow-y: auto;
  padding: 28px 32px 26px;
  border-radius: 6px;
  color: var(--ink);
  background:
    radial-gradient(ellipse at 20% 10%, rgba(255, 255, 255, 0.35), transparent 60%),
    radial-gradient(ellipse at 90% 100%, rgba(120, 84, 40, 0.18), transparent 55%),
    linear-gradient(180deg, var(--paper), var(--paper-deep));
  box-shadow:
    0 0 0 1px #0b0a08,
    0 0 0 6px #3a2a19,
    0 0 0 7px #6b5025,
    0 30px 70px rgba(0, 0, 0, 0.6);
}

.card h1 {
  margin: 0;
  font-family: var(--display);
  font-weight: 400;
  font-size: clamp(38px, 7vw, 60px);
  line-height: 1;
  letter-spacing: 0.02em;
  text-wrap: balance;
}

.card h2 {
  margin: 0 0 6px;
  font-family: var(--display);
  font-weight: 400;
  font-size: clamp(26px, 4.5vw, 34px);
  line-height: 1.1;
  text-wrap: balance;
}

.card h3 {
  margin: 18px 0 8px;
  font-family: var(--display);
  font-weight: 400;
  font-size: 18px;
  letter-spacing: 0.06em;
  color: var(--brass-deep);
}

.card p {
  margin: 0 0 12px;
  max-width: 62ch;
  text-wrap: pretty;
}

.card .lede {
  font-family: var(--serif);
  font-size: 19px;
  line-height: 1.4;
  color: var(--ink);
}

.card .eyebrow {
  margin: 0 0 6px;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--brass-deep);
}

.card code {
  font-size: 0.92em;
  background: rgba(59, 42, 30, 0.08);
  padding: 1px 5px;
  border-radius: 3px;
}

.tagline {
  margin: 10px 0 18px;
  font-family: var(--serif);
  font-style: italic;
  font-size: 20px;
  color: var(--ink-soft);
}

.chapters {
  list-style: none;
  margin: 0 0 16px;
  padding: 0;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 10px;
}

.chapter-card {
  width: 100%;
  height: 100%;
  display: grid;
  grid-template-columns: 34px 1fr;
  gap: 4px 10px;
  align-content: start;
  text-align: left;
  padding: 12px 12px 12px 10px;
  border-radius: 5px;
  border: 1px solid rgba(59, 42, 30, 0.25);
  background: rgba(255, 250, 235, 0.45);
  color: var(--ink);
  cursor: pointer;
  transition: background 0.15s, border-color 0.15s, transform 0.15s;
}

.chapter-card:hover:not(:disabled) {
  background: rgba(255, 250, 235, 0.8);
  border-color: var(--brass-deep);
  transform: translateY(-1px);
}

.chapter-card:disabled {
  cursor: not-allowed;
  opacity: 0.5;
}

.chapter-card .numeral {
  grid-row: span 2;
  font-family: var(--display);
  font-size: 26px;
  line-height: 1;
  color: var(--brass-deep);
  text-align: center;
}

.chapter-card .title {
  font-family: var(--display);
  font-size: 18px;
  line-height: 1.1;
}

.chapter-card .blurb {
  font-size: 13.5px;
  line-height: 1.3;
  color: var(--ink-soft);
}

.chapter-card .state {
  grid-column: 2;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: #3f7f70;
}

.chapter-card .state.locked {
  color: var(--ink-soft);
}

.endless-card {

    const w = this.world;
    const e = this.explorer;
    let cx = 0;
    let cy = 0;
    for (const i of tiles) {
      cx += w.xOf(i) + 0.5;
      cy += w.yOf(i) + 0.5;
    }
    cx /= tiles.length;
    cy /= tiles.length;
    const seen = tiles.some((i) => w.visible[i]);
    const lies = tiles.some((i) => w.mismatch(i));
    const visibleFromAfar = kind === 'lightning' || kind === 'burn' || opts.always;
    if (seen || visibleFromAfar) {
      this.say(text, 'event', 'ev:' + kind);
    } else if (lies) {
      const d = Math.hypot(cx - e.x, cy - e.y);
      const where = d < 3 ? 'close by' : `to the ${compass(cx - e.x, cy - e.y)}`;
      this.say(`Your map shivers. Something has changed ${where}.`, 'tremor', 'tremor:' + kind);
    }
    if (lies && !seen) this.addFx({ type: 'tremor', x: cx, y: cy });

    this.time += dt;
    const w = this.world;
    w.time = this.time;

    this.growWorld();
    this.explorer.update(dt, this);
    this.reachTarget();
    this.updateVision();
    this.tileEffects(dt);

    this.rivers.update(dt);

    if (this.mismatchCount === 0 && this.integrity > 0) this.integrity = Math.min(100, this.integrity + 0.25 * dt);

      this.computeTremors();
    }

    this.stats.farthest = Math.max(this.stats.farthest, Math.hypot(e.x - this.start.x - 0.5, e.y - this.start.y - 0.5));

    if (this.explorer.hp <= 0) {
      if (this.cfg.respawn) this.respawn();
      else this.lose('fallen');
    }
    else if (this.integrity <= 0) this.lose('unraveled');
    else if (!this.chapter.endless && !this.victoryLocked && this.objectives.length && this.objectives.every((o) => o.done || o.optional)) {
      this.win();
    }
  }

  // Walking over to something to use: use it on arrival.
  reachTarget() {
    const e = this.explorer;
    const t = e.interactWith;
    if (!t) return;
    const p = targetPos(t);
    const d = Math.hypot(p.x - e.x, p.y - e.y);
    if (d <= REACH) {
      e.interactWith = null;
      e.path = null;
      interact(this, t);
    } else if (!e.path) {
      // Villagers wander: follow them.
      const i = this.world.at(p.x, p.y);
      if (i < 0 || !e.planTo(this.world, i)) e.interactWith = null;
    }
  }

  // Knocked down in an endless world: kind folk carry you to the nearest town you know.
  respawn() {
    const w = this.world;
    const e = this.explorer;
    let best = null;
    let bd = Infinity;
    for (const f of w.featuresOf('town')) {
      if (!f.tiles.some((i) => w.map[i] !== T.BLANK)) continue;
      const d = Math.hypot(f.cx - e.x, f.cy - e.y);
      if (d < bd) {
        bd = d;
        best = f;
      }
    }
    this.stats.falls++;
    if (best) {
      e.x = best.cx;
      e.y = best.cy;
      e.rescue(w);
    }
    e.hp = e.maxHp;
    e.path = null;
    e.farGoal = null;
    e.interactWith = null;
    e.invuln = 3;
    for (const c of this.creatures.list) if (c.kind === 'wraith' && Math.hypot(c.x - e.x, c.y - e.y) < 8) this.creatures.kill(c, 'banished');
    this.ink = Math.floor(this.ink / 2);
    this.say(`You fall… and wake in ${best ? best.name : 'a stranger’s bed'}, patched up by kind folk. Half your ink is gone.`, 'bad');
    this.addFx({ type: 'respawn', x: e.x, y: e.y });
  }

  updateVision() {
    const w = this.world;
    const e = this.explorer;
    const target = e.visionRadius(w);
    e.vision += (target - e.vision) * 0.2;
    if (Math.abs(target - e.vision) < 0.02) e.vision = target;
    for (const i of this.visibleList) w.visible[i] = 0;
    this.visibleList = w.tilesInRadius(e.x, e.y, e.vision);
    for (const i of this.visibleList) {
      w.visible[i] = 1;
      if (w.map[i] === T.BLANK) {
        w.setMap(i, w.real[i]);
        w.chartedAt[i] = this.time;
      } else if (w.mismatch(i)) {
        w.known[i] = 1;
      }
    }
  }

  tileEffects(dt) {
    const w = this.world;
    const e = this.explorer;
    const i = e.tile(w);
    for (const f of w.features) if (f.kind === 'inkwell' && f.cooldown > 0) f.cooldown -= dt;
    const f = w.featureAt(i);

      if (gain > 2) {

        f.cooldown = 45;
        this.say(`The ${f.name} refills your inkwell (+${Math.round(gain)}).`, 'good');

      }

const ROOFS = ['#b5492f', '#5d6b7a', '#b9934f', '#6f7f45', '#8e3b2e', '#7a5a3a'];

const WALLS = ['#efe5cc', '#e8dcc0', '#dccaa6', '#cfc8bb', '#f1e8d6', '#e3d3b1'];
const HOUSE_WIDTHS = [0.33, 0.35, 0.37];

// --------------------------------------------------------------- placement

function regionPine(x, y) {
  return hash01(x >> 2, y >> 2, 77) < 0.45;
}

// Props for one tile: { kind, v (variant), x, y (foot, world coords), k (scale) }.
function tileProps(world, i) {
  const x = world.xOf(i);
  const y = world.yOf(i);
  const h = (k) => hash01(x, y, 500 + k);
  const out = [];
  switch (world.real[i]) {
    case T.FOREST: {
      const spots = [
        [0.18, 0.34],
        [0.52, 0.26],
        [0.84, 0.38],
        [0.32, 0.62],
        [0.7, 0.66],
        [0.14, 0.92],
        [0.5, 0.95],
        [0.86, 0.9],
      ];
      const pines = regionPine(x, y);
      spots.forEach(([u, v], k) => {
        if (h(k) < 0.12) return;
        const pine = pines ? h(20 + k) < 0.8 : h(20 + k) < 0.2;
        out.push({
          kind: pine ? 'pine' : 'oak',
          v: Math.floor(h(30 + k) * 3),
          x: x + u + (h(40 + k) - 0.5) * 0.12,
          y: y + v + (h(50 + k) - 0.5) * 0.08,
          k: 0.85 + 0.3 * h(60 + k),
        });
      });
      break;
    }
    case T.GRASS:
      if (world.scorch[i]) {
        if (h(1) < 0.3) out.push({ kind: 'stump', v: 0, x: x + 0.3 + 0.4 * h(2), y: y + 0.4 + 0.4 * h(3), k: 1 });
        break;
      }
      if (h(1) < 0.08) out.push({ kind: 'bush', v: Math.floor(h(2) * 3), x: x + 0.2 + 0.6 * h(3), y: y + 0.3 + 0.6 * h(4), k: 0.8 + 0.4 * h(5) });
      if (h(6) < 0.05) out.push({ kind: 'rock', v: Math.floor(h(7) * 3), x: x + 0.2 + 0.6 * h(8), y: y + 0.3 + 0.6 * h(9), k: 0.8 + 0.5 * h(10) });
      if (h(11) < 0.025) out.push({ kind: regionPine(x, y) ? 'pine' : 'oak', v: Math.floor(h(12) * 3), x: x + 0.3 + 0.4 * h(13), y: y + 0.4 + 0.5 * h(14), k: 1 });
      break;
    case T.TOWN:
      for (const house of townHouses(x, y)) {
        let wi = 0;
        HOUSE_WIDTHS.forEach((wv, k) => {
          if (Math.abs(wv - house.w) < Math.abs(HOUSE_WIDTHS[wi] - house.w)) wi = k;
        });
        out.push({ kind: 'house', v: house.style * 3 + wi, x: x + house.u, y: y + house.v, k: 1 });
      }
      for (const yard of townYards(x, y)) {
        if (yard.kind === 'garden') continue;
        out.push({ kind: yard.kind, v: 0, x: x + yard.u, y: y + yard.v, k: 1 });
      }
      break;
    case T.MOUNTAIN:
      if (h(1) < 0.4) out.push({ kind: 'peak', v: Math.floor(h(2) * 4), x: x + 0.5 + (h(3) < 0.5 ? -0.3 : 0.3), y: y + 0.55, k: 0.6 + 0.15 * h(4) });
      out.push({ kind: 'peak', v: Math.floor(h(5) * 4), x: x + 0.5 + (h(6) - 0.5) * 0.2, y: y + 0.98, k: 0.88 + 0.28 * h(7) });
      break;
    case T.TOWER: {
      const f = world.featureAt(i);
      const name = f ? f.name : '';
      const v = /stone|origin/i.test(name) ? 2 : /light/i.test(name) ? 0 : 1;
      out.push({ kind: 'tower', v, x: x + 0.5, y: y + 0.78, k: 1 });
      break;
    }
    case T.LAIR:
      out.push({ kind: 'lair', v: Math.floor(h(1) * 2), x: x + 0.5, y: y + 0.92, k: 0.85 + 0.15 * h(2) });
      break;
    case T.INKWELL:
      out.push({ kind: 'quillpost', v: 0, x: x + 0.78, y: y + 0.62, k: 1 });
      break;
    case T.CACHE: {
      const f = world.featureAt(i);
      out.push({ kind: 'chest', v: f && f.opened ? 1 : 0, x: x + 0.5, y: y + 0.66, k: 1.3 });
      break;
    }
    case T.SIGNPOST:
      out.push({ kind: 'signpost', v: 0, x: x + 0.5, y: y + 0.66, k: 1.2 });
      break;
    case T.SHRINE: {
      const f = world.featureAt(i);
      out.push({ kind: 'shrine', v: f && f.spent ? 1 : 0, x: x + 0.5, y: y + 0.6, k: 1.5 });
      break;
    }
    default:
      break;
  }
  return out;
}

// ----------------------------------------------------------------- drawing
// Each function draws with the prop's foot at (fx, fy); s is the tile size.

function shadow(c, fx, fy, rx, ry, a = 0.25) {
  c.fillStyle = `rgba(20, 30, 10, ${a})`;
  c.beginPath();
  c.ellipse(fx + rx * 0.15, fy, rx, ry, 0, 0, PI * 2);
  c.fill();
}

function pine(c, fx, fy, s, v) {
  const tall = [0.5, 0.44, 0.56][v];
  shadow(c, fx, fy, s * 0.13, s * 0.04);
  c.fillStyle = '#5b3b22';
  c.fillRect(fx - s * 0.014, fy - s * 0.07, s * 0.028, s * 0.07);
  const tiers = 3;
  for (let k = 0; k < tiers; k++) {
    const base = fy - s * 0.05 - (k * s * tall) / 4.2;
    const width = s * (0.15 - k * 0.035);
    const top = base - s * tall * 0.42;
    c.fillStyle = ['#2c5534', '#2f5a36', '#33603a'][v];
    c.beginPath();
    c.moveTo(fx - width, base);
    c.lineTo(fx, top);
    c.lineTo(fx + width, base);
    c.closePath();
    c.fill();
    c.fillStyle = 'rgba(120, 170, 100, 0.35)';
    c.beginPath();
    c.moveTo(fx, top);
    c.lineTo(fx - width, base);
    c.lineTo(fx - width * 0.3, base);
    c.closePath();
    c.fill();
  }
}

function oak(c, fx, fy, s, v) {
  const r = s * [0.1, 0.09, 0.115][v];
  shadow(c, fx, fy, s * 0.16, s * 0.045);
  c.fillStyle = '#5b3b22';
  c.beginPath();
  c.moveTo(fx - s * 0.02, fy);
  c.lineTo(fx - s * 0.012, fy - s * 0.17);
  c.lineTo(fx + s * 0.012, fy - s * 0.17);
  c.lineTo(fx + s * 0.02, fy);
  c.closePath();
  c.fill();
  const cy = fy - s * 0.24;
  const blobs = [
    [-0.7, 0.15, 0.85],
    [0.7, 0.2, 0.85],
    [0, -0.45, 0.9],
    [0, 0.1, 1],
  ];
  c.fillStyle = '#2f5a30';
  for (const [dx, dy, k] of blobs) {
    c.beginPath();
    c.arc(fx + dx * r, cy + dy * r + r * 0.12, r * k, 0, PI * 2);
    c.fill();
  }
  c.fillStyle = ['#43763c', '#4a7d3f', '#3e6f38'][v];
  for (const [dx, dy, k] of blobs) {
    c.beginPath();
    c.arc(fx + dx * r - r * 0.08, cy + dy * r, r * k * 0.88, 0, PI * 2);
    c.fill();
  }
  c.fillStyle = 'rgba(160, 200, 110, 0.55)';
  c.beginPath();
  c.arc(fx - r * 0.35, cy - r * 0.45, r * 0.35, 0, PI * 2);
  c.fill();
}

function bush(c, fx, fy, s, v) {
  shadow(c, fx, fy, s * 0.07, s * 0.02);
  const r = s * 0.045;
  c.fillStyle = ['#3d6b37', '#47753b', '#5b7f3c'][v];
  for (const [dx, dy] of [
    [-0.8, -0.6],
    [0.8, -0.6],
    [0, -1.1],
  ]) {
    c.beginPath();
    c.arc(fx + dx * r, fy + dy * r, r, 0, PI * 2);
    c.fill();
  }
  if (v === 2) {
    c.fillStyle = '#d24a4a';
    for (const [dx, dy] of [
      [-0.6, -0.9],
      [0.5, -1.2],
      [0.9, -0.5],
    ]) {
      c.beginPath();
      c.arc(fx + dx * r, fy + dy * r, Math.max(1, s * 0.008), 0, PI * 2);
      c.fill();
    }
  }
}

function rock(c, fx, fy, s, v) {
  shadow(c, fx, fy, s * 0.07, s * 0.02, 0.3);
  const w = s * [0.06, 0.08, 0.05][v];
  c.fillStyle = '#8c877c';
  c.beginPath();
  c.moveTo(fx - w, fy);
  c.quadraticCurveTo(fx - w * 1.05, fy - w * 0.9, fx - w * 0.2, fy - w * 1.1);
  c.quadraticCurveTo(fx + w * 0.9, fy - w * 1.05, fx + w, fy);
  c.closePath();
  c.fill();
  c.fillStyle = '#b4afa3';
  c.beginPath();
  c.ellipse(fx - w * 0.3, fy - w * 0.7, w * 0.4, w * 0.22, -0.3, 0, PI * 2);
  c.fill();
}

function stump(c, fx, fy, s) {
  c.fillStyle = '#3a2a1c';
  c.fillRect(fx - s * 0.03, fy - s * 0.05, s * 0.06, s * 0.05);
  c.fillStyle = '#6b5236';
  c.beginPath();
  c.ellipse(fx, fy - s * 0.05, s * 0.03, s * 0.012, 0, 0, PI * 2);
  c.fill();
}

function house(c, fx, fy, s, v) {
  const style = Math.floor(v / 3);
  const w = s * HOUSE_WIDTHS[v % 3];
  const hw = s * 0.19;
  const rh = s * 0.17;
  const o = s * 0.025;
  shadow(c, fx + s * 0.03, fy - s * 0.02, w * 0.62, s * 0.06, 0.3);
  // Walls.
  c.fillStyle = WALLS[style];
  c.fillRect(fx - w / 2, fy - hw, w, hw);
  c.fillStyle = 'rgba(0, 0, 0, 0.12)';
  c.fillRect(fx + w * 0.15, fy - hw, w * 0.35, hw);
  c.fillStyle = '#8a8070';
  c.fillRect(fx - w / 2, fy - s * 0.022, w, s * 0.022);
  if (style === 2 || style === 5) {
    c.strokeStyle = '#5a4030';
    c.lineWidth = Math.max(1, s * 0.012);
    c.beginPath();
    c.moveTo(fx - w / 2, fy - hw * 0.55);
    c.lineTo(fx + w / 2, fy - hw * 0.55);
    for (const k of [-0.5, -0.17, 0.17, 0.5]) {
      c.moveTo(fx + w * k, fy - hw);
      c.lineTo(fx + w * k, fy - s * 0.022);
    }
    c.stroke();
  }
  // Door and windows.
  const dx = fx + (style % 2 ? -w * 0.18 : w * 0.12);
  c.fillStyle = '#5a3a22';
  c.beginPath();
  c.moveTo(dx - s * 0.026, fy - s * 0.022);
  c.lineTo(dx - s * 0.026, fy - s * 0.1);
  c.arc(dx, fy - s * 0.1, s * 0.026, PI, 0);
  c.lineTo(dx + s * 0.026, fy - s * 0.022);
  c.closePath();
  c.fill();
  c.fillStyle = '#f3d27a';
  c.strokeStyle = '#5a4030';
  c.lineWidth = Math.max(1, s * 0.008);
  for (const wx of [fx - w * 0.36, fx + w * 0.33]) {
    if (Math.abs(wx - dx) < s * 0.06) continue;
    c.fillRect(wx - s * 0.022, fy - hw * 0.72, s * 0.044, s * 0.044);
    c.strokeRect(wx - s * 0.022, fy - hw * 0.72, s * 0.044, s * 0.044);
  }
  // Roof: the near slope, the ridge, and a sliver of the far slope.
  const eave = fy - hw + s * 0.006;
  const ridge = fy - hw - rh;
  c.fillStyle = ROOFS_DARK[style];
  c.beginPath();
  c.moveTo(fx - w / 2 + o * 0.4, ridge + s * 0.01);
  c.lineTo(fx - w / 2 + o, ridge - s * 0.045);
  c.lineTo(fx + w / 2 - o, ridge - s * 0.045);
  c.lineTo(fx + w / 2 - o * 0.4, ridge + s * 0.01);
  c.closePath();
  c.fill();
  c.fillStyle = ROOFS[style];
  c.beginPath();
  c.moveTo(fx - w / 2 - o, eave);
  c.lineTo(fx - w / 2 + o * 0.4, ridge);
  c.lineTo(fx + w / 2 - o * 0.4, ridge);
  c.lineTo(fx + w / 2 + o, eave);
  c.closePath();
  c.fill();
  c.strokeStyle = 'rgba(0, 0, 0, 0.18)';
  c.lineWidth = Math.max(1, s * 0.007);
  c.beginPath();
  for (let k = 1; k < 4; k++) {
    const yy = ridge + ((eave - ridge) * k) / 4;
    const inset = (o * 1.4 * (4 - k)) / 4;
    c.moveTo(fx - w / 2 - o + inset, yy);
    c.lineTo(fx + w / 2 + o - inset, yy);
  }
  c.stroke();
  c.strokeStyle = 'rgba(255, 255, 255, 0.25)';
  c.beginPath();
  c.moveTo(fx - w / 2 + o * 0.4, ridge);
  c.lineTo(fx + w / 2 - o * 0.4, ridge);
  c.stroke();
  // Chimney.
  if (style !== 2) {
    const cx = fx + (style % 2 ? w * 0.25 : -w * 0.22);
    c.fillStyle = '#8a6a52';
    c.fillRect(cx - s * 0.018, ridge - s * 0.07, s * 0.036, s * 0.075);
    c.fillStyle = '#5a4030';
    c.fillRect(cx - s * 0.022, ridge - s * 0.075, s * 0.044, s * 0.012);
  }
}

function peak(c, fx, fy, s, v) {
  const hgt = s * [1.0, 0.85, 1.12, 0.92][v];
  const half = s * [0.62, 0.56, 0.6, 0.66][v];
  const ax = fx + s * [0.04, -0.08, 0.1, -0.02][v];
  const ay = fy - hgt;
  c.fillStyle = 'rgba(20, 30, 10, 0.25)';
  c.beginPath();
  c.ellipse(fx + s * 0.08, fy - s * 0.02, half * 1.05, s * 0.08, 0, 0, PI * 2);
  c.fill();
  // Light face and shadowed face, split by a ridge line.
  const mx = ax + (fx - ax) * 0.25 + s * 0.06;
  c.fillStyle = '#b6ac9a';
  c.beginPath();
  c.moveTo(fx - half, fy);
  c.lineTo(fx - half * 0.55, fy - hgt * 0.42);
  c.lineTo(ax - s * 0.1, ay + hgt * 0.22);
  c.lineTo(ax, ay);
  c.lineTo(mx, fy);
  c.closePath();
  c.fill();
  c.fillStyle = '#7c7064';
  c.beginPath();
  c.moveTo(mx, fy);
  c.lineTo(ax, ay);
  c.lineTo(ax + s * 0.14, ay + hgt * 0.3);
  c.lineTo(fx + half * 0.6, fy - hgt * 0.38);
  c.lineTo(fx + half, fy);
  c.closePath();
  c.fill();
  // Snow.
  c.fillStyle = '#f3f1ea';
  c.beginPath();
  c.moveTo(ax, ay);
  c.lineTo(ax - s * 0.1, ay + hgt * 0.22);
  c.lineTo(ax - s * 0.05, ay + hgt * 0.19);
  c.lineTo(ax - s * 0.01, ay + hgt * 0.27);
  c.lineTo(ax + s * 0.05, ay + hgt * 0.2);
  c.lineTo(ax + s * 0.1, ay + hgt * 0.24);
  c.lineTo(ax + s * 0.14, ay + hgt * 0.3);
  c.closePath();
  c.fill();
  c.fillStyle = 'rgba(160, 175, 200, 0.5)';
  c.beginPath();
  c.moveTo(ax, ay);
  c.lineTo(ax + s * 0.14, ay + hgt * 0.3);
  c.lineTo(ax + s * 0.1, ay + hgt * 0.24);
  c.lineTo(ax + s * 0.05, ay + hgt * 0.2);
  c.closePath();
  c.fill();
  // Strata and the grassy foot.
  c.strokeStyle = 'rgba(70, 60, 50, 0.35)';
  c.lineWidth = Math.max(1, s * 0.01);
  c.beginPath();
  for (let k = 1; k <= 3; k++) {
    const yy = ay + hgt * (0.35 + k * 0.15);
    c.moveTo(ax - half * k * 0.18, yy);
    c.lineTo(ax + half * k * 0.12, yy + s * 0.03);
  }
  c.stroke();
  c.fillStyle = 'rgba(110, 140, 80, 0.55)';
  c.beginPath();
  c.moveTo(fx - half, fy);
  c.quadraticCurveTo(fx - half * 0.5, fy - hgt * 0.16, fx, fy - hgt * 0.08);
  c.quadraticCurveTo(fx + half * 0.5, fy - hgt * 0.14, fx + half, fy);
  c.closePath();
  c.fill();
}

function tower(c, fx, fy, s, v) {
  shadow(c, fx + s * 0.08, fy, s * 0.24, s * 0.06, 0.3);
  if (v === 2) {
    // The Origin Stone: a standing stone with glowing letters.
    c.fillStyle = '#4b4658';
    c.beginPath();
    c.moveTo(fx - s * 0.13, fy);
    c.lineTo(fx - s * 0.1, fy - s * 0.7);
    c.quadraticCurveTo(fx, fy - s * 0.86, fx + s * 0.09, fy - s * 0.72);
    c.lineTo(fx + s * 0.13, fy);
    c.closePath();
    c.fill();
    c.fillStyle = 'rgba(0, 0, 0, 0.2)';
    c.fillRect(fx + s * 0.02, fy - s * 0.7, s * 0.11, s * 0.7);
    c.strokeStyle = '#9ed8ff';
    c.lineWidth = Math.max(1.5, s * 0.012);
    c.beginPath();
    for (let k = 0; k < 5; k++) {
      const yy = fy - s * (0.15 + k * 0.11);
      c.moveTo(fx - s * 0.05, yy);
      c.lineTo(fx + s * 0.02, yy - s * 0.04);
      c.lineTo(fx + s * 0.05, yy);
    }
    c.stroke();
    return;
  }
  const H = s * (v === 0 ? 1.3 : 1.05);
  const b = s * 0.17;
  const t = s * 0.12;
  c.save();
  c.beginPath();
  c.moveTo(fx - b, fy);
  c.lineTo(fx - t, fy - H);
  c.lineTo(fx + t, fy - H);
  c.lineTo(fx + b, fy);
  c.closePath();
  c.clip();
  c.fillStyle = v === 0 ? '#f2ede2' : '#aaa293';
  c.fillRect(fx - b, fy - H, b * 2, H);
  if (v === 0) {
    c.fillStyle = '#b8412c';
    for (let k = 0; k < 3; k++) c.fillRect(fx - b, fy - H * (0.2 + k * 0.28), b * 2, H * 0.13);
  } else {
    c.strokeStyle = 'rgba(70, 60, 50, 0.35)';
    c.lineWidth = Math.max(1, s * 0.008);
    c.beginPath();
    for (let yy = fy - s * 0.06; yy > fy - H; yy -= s * 0.07) {
      c.moveTo(fx - b, yy);
      c.lineTo(fx + b, yy);
    }
    c.stroke();
  }
  c.fillStyle = 'rgba(0, 0, 0, 0.18)';
  c.fillRect(fx + s * 0.03, fy - H, b, H);
  c.restore();
  c.fillStyle = '#4a3324';
  c.beginPath();
  c.moveTo(fx - s * 0.03, fy);
  c.lineTo(fx - s * 0.03, fy - s * 0.09);
  c.arc(fx, fy - s * 0.09, s * 0.03, PI, 0);
  c.lineTo(fx + s * 0.03, fy);
  c.fill();
  const top = fy - H;
  if (v === 0) {
    c.fillStyle = '#3b3a38';
    c.fillRect(fx - t * 1.4, top - s * 0.02, t * 2.8, s * 0.035);
    c.fillStyle = '#ffe08a';
    c.fillRect(fx - t * 0.8, top - s * 0.13, t * 1.6, s * 0.11);
    c.strokeStyle = '#3b3a38';
    c.lineWidth = Math.max(1, s * 0.01);
    c.strokeRect(fx - t * 0.8, top - s * 0.13, t * 1.6, s * 0.11);
    c.fillStyle = '#8e2f22';
    c.beginPath();
    c.moveTo(fx - t, top - s * 0.13);
    c.quadraticCurveTo(fx, top - s * 0.28, fx + t, top - s * 0.13);
    c.closePath();
    c.fill();
  } else {
    c.fillStyle = '#9a9283';
    for (let k = -2; k <= 2; k++) c.fillRect(fx + k * t * 0.5 - t * 0.18, top - s * 0.06, t * 0.36, s * 0.06);
    c.strokeStyle = '#4a3324';
    c.lineWidth = Math.max(1, s * 0.012);
    c.beginPath();
    c.moveTo(fx, top - s * 0.05);
    c.lineTo(fx, top - s * 0.28);
    c.stroke();
    c.fillStyle = '#b5492f';
    c.beginPath();
    c.moveTo(fx, top - s * 0.28);
    c.lineTo(fx + s * 0.12, top - s * 0.24);
    c.lineTo(fx, top - s * 0.2);
    c.fill();
  }
}

function lair(c, fx, fy, s, v) {
  const w = s * 0.5;
  const hgt = s * (v ? 0.5 : 0.42);
  shadow(c, fx + s * 0.05, fy, w * 1.05, s * 0.07, 0.35);
  c.fillStyle = '#5a4b47';
  c.beginPath();
  c.moveTo(fx - w, fy);
  c.quadraticCurveTo(fx - w * 0.9, fy - hgt * 0.8, fx - w * 0.3, fy - hgt);
  c.quadraticCurveTo(fx + w * 0.4, fy - hgt * 1.1, fx + w * 0.8, fy - hgt * 0.5);

    drawFog(f, px, py, tp);
    f.setTransform(1, 0, 0, 1, 0, 0);
    f.globalCompositeOperation = 'destination-out';
    const d = tp * 0.55;
    const side = (x0, y0, x1, y1) => {
      const g = f.createLinearGradient(x0, y0, x1, y1);
      g.addColorStop(0, 'rgba(0,0,0,0.95)');
      g.addColorStop(1, 'rgba(0,0,0,0)');
      f.fillStyle = g;
      f.fillRect(0, 0, tp, tp);
    };
    const corner = (cx, cy) => {
      const g = f.createRadialGradient(cx, cy, 0, cx, cy, d);
      g.addColorStop(0, 'rgba(0,0,0,0.95)');
      g.addColorStop(1, 'rgba(0,0,0,0)');
      f.fillStyle = g;
      f.fillRect(0, 0, tp, tp);
    };
    if (a.n) side(0, 0, 0, d);
    if (a.s) side(0, tp, 0, tp - d);
    if (a.w) side(0, 0, d, 0);
    if (a.e) side(tp, 0, tp - d, 0);
    if (a.nw && !a.n && !a.w) corner(0, 0);
    if (a.ne && !a.n && !a.e) corner(tp, 0);
    if (a.sw && !a.s && !a.w) corner(0, tp);
    if (a.se && !a.s && !a.e) corner(tp, tp);
    f.globalCompositeOperation = 'source-over';
    ctx.drawImage(this.fogTile, 0, 0, tp, tp, px, py, tp, tp);
  }

  piece(px, py) {
    const key = `${px},${py}`;
    let c = this.pieces.get(key);
    if (c) {
      this.pieces.delete(key);
      this.pieces.set(key, c);
      return c;
    }
    const w = this.game.world;
    const tp = this.tp;
    const x0 = px * PIECE;
    const y0 = py * PIECE;
    c = document.createElement('canvas');
    c.width = PIECE * tp;
    c.height = PIECE * tp;
    const ctx = c.getContext('2d');
    ctx.translate(-x0 * tp, -y0 * tp);
    ctx.fillStyle = this.paperFill(ctx);
    ctx.fillRect(x0 * tp, y0 * tp, PIECE * tp, PIECE * tp);
    // Most of an endless map is blank: hatch it in one go, then ink what's known.
    let known = false;
    for (let y = y0 - 1; y <= y0 + PIECE && !known; y++) {
      for (let x = x0 - 1; x <= x0 + PIECE; x++) {
        if (w.inside(x, y) && w.map[w.idx(x, y)] !== T.BLANK) {
          known = true;
          break;
        }
      }
    }
    if (!known) fogArea(ctx, x0 * tp, y0 * tp, PIECE * tp, PIECE * tp, tp);
    else for (let y = y0; y < y0 + PIECE; y++) for (let x = x0; x < x0 + PIECE; x++) this.paintTile(ctx, x, y);
    this.pieces.set(key, c);
    if (this.pieces.size > (this.pieceCap || 40)) this.pieces.delete(this.pieces.keys().next().value);
    return c;
  }

  // Repaint tiles whose claims changed, in the pieces we're keeping.
  syncPieces() {
    const w = this.game.world;
    if (!w.dirtyMap.size) return;
    for (const i of w.dirtyMap) {
      const x = w.xOf(i);
      const y = w.yOf(i);
      const key = `${Math.floor(x / PIECE)},${Math.floor(y / PIECE)}`;
      const c = this.pieces.get(key);
      if (!c) continue;
      const ctx = c.getContext('2d');
      ctx.setTransform(1, 0, 0, 1, -Math.floor(x / PIECE) * PIECE * this.tp, -Math.floor(y / PIECE) * PIECE * this.tp);
      this.paintTile(ctx, x, y);
    }
    w.dirtyMap.clear();
  }

  // ------------------------------------------------------------ coordinates

  // Where the camera would sit to centre the explorer, before panning and clamping.
  centred() {
    const e = this.game.explorer;
    return { x: e.x * this.tp - this.sheet.w / 2, y: e.y * this.tp - this.sheet.h / 2 };
  }

  clampCam(x, y) {
    const w = this.game.world;
    if (!w.flat) return { x, y };
    const maxX = Math.max(0, w.w * this.tp - this.sheet.w);
    const maxY = Math.max(0, w.h * this.tp - this.sheet.h);
    return { x: Math.max(0, Math.min(maxX, x)), y: Math.max(0, Math.min(maxY, y)) };
  }

  cameraTarget() {
    const c = this.centred();
    return this.clampCam(c.x + this.pan.x, c.y + this.pan.y);
  }

  snapCamera() {
    if (!this.game) return;
    const t = this.cameraTarget();
    this.cam.x = t.x;
    this.cam.y = t.y;
  }

  // Slide the map. Moves from where the camera actually is, and keeps the
  // offset no larger than the map's edges allow, so dragging back responds at once.
  panBy(dx, dy) {
    if (!this.scroll) return;
    const cur = this.cameraTarget();
    const c = this.centred();
    const t = this.clampCam(cur.x + dx, cur.y + dy);
    this.pan.x = t.x - c.x;
    this.pan.y = t.y - c.y;
    this.snapCamera();
  }

  recentre() {
    this.pan = { x: 0, y: 0 };
  }

  // An endless map fills the whole view: nothing of the land shows around it.
  get covers() {
    return !!this.game && !this.game.world.flat;
  }

  get panned() {
    return Math.hypot(this.pan.x, this.pan.y) > this.tp * 2;
  }

  // Zoom in (+1) or out (-1) a step, keeping the point under (ax, ay) still.
  zoomBy(step, ax = this.cw / 2, ay = this.ch / 2) {
    const levels = this.levels();
    const cur = this.tp / this.dpr;
    let k = 0;
    for (let j = 0; j < levels.length; j++) if (Math.abs(levels[j] - cur) < Math.abs(levels[k] - cur)) k = j;
    const next = Math.max(0, Math.min(levels.length - 1, k + step));
    if (next === k) return false;
    const wx = (ax - this.sheet.x + this.cam.x) / this.tp;
    const wy = (ay - this.sheet.y + this.cam.y) / this.tp;
    this.zoomCss = levels[next];
    this.layout(this.cw, this.ch, this.dpr);
    const c = this.centred();
    const t = this.clampCam(wx * this.tp - (ax - this.sheet.x), wy * this.tp - (ay - this.sheet.y));
    this.pan.x = t.x - c.x;
    this.pan.y = t.y - c.y;
    this.snapCamera();
    return true;
  }

  // Canvas pixel -> map tile coordinates.
  toTile(cx, cy) {
    const px = cx - this.sheet.x + this.cam.x;
    const py = cy - this.sheet.y + this.cam.y;
    return { x: Math.floor(px / this.tp), y: Math.floor(py / this.tp), fx: px / this.tp, fy: py / this.tp };
  }

  inside(cx, cy) {
    const s = this.sheet;
    return cx >= s.x && cy >= s.y && cx <= s.x + s.w && cy <= s.y + s.h;
  }

  // Tile range in view, with a margin.
  view(m = 1) {
    const tp = this.tp;
    return {
      x0: Math.floor(this.cam.x / tp) - m,
      y0: Math.floor(this.cam.y / tp) - m,
      x1: Math.floor((this.cam.x + this.sheet.w) / tp) + m,
      y1: Math.floor((this.cam.y + this.sheet.h) / tp) + m,
    };
  }

  inView(x, y, m = 2) {
    const v = this.view(m);
    return x >= v.x0 && y >= v.y0 && x <= v.x1 && y <= v.y1;
  }

  // ----------------------------------------------------------------- frame

  // `t` is how far the map has been unrolled (0 = put away, 1 = open).
  render(ctx, now, dt, t, effects, hover) {
    const g = this.game;
    if (!g || !this.tp || t <= 0) return;
    this.syncPieces();
    const target = this.cameraTarget();
    const k = Math.min(1, dt * 6);
    this.cam.x += (target.x - this.cam.x) * k;
    this.cam.y += (target.y - this.cam.y) * k;
    const ease = 1 - (1 - t) ** 3;
    const s = this.sheet;
    const lift = (1 - ease) * (s.h * 0.6 + 40 * this.dpr);
    const tilt = (1 - ease) * 0.06;
    ctx.save();
    ctx.globalAlpha = Math.min(1, t * 1.6);
    ctx.translate(s.x + s.w / 2, s.y + s.h / 2 + lift);
    ctx.rotate(tilt);
    ctx.translate(-(s.x + s.w / 2), -(s.y + s.h / 2));

    // The sheet itself, with a drop shadow and a worn edge. The shadow is a
    // few stacked rectangles: a real blur this size costs too much every frame.
    const d = this.dpr;
    if (!this.covers || t < 1) {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.13)';
      for (let j = 1; j <= 5; j++) {
        const e = j * 5 * d;
        ctx.fillRect(s.x - 4 * d - e, s.y - 4 * d - e + 10 * d, s.w + 8 * d + e * 2, s.h + 8 * d + e * 2);
      }
    }
    ctx.fillStyle = INK.paperDeep;
    ctx.fillRect(s.x - 4 * d, s.y - 4 * d, s.w + 8 * d, s.h + 8 * d);
    ctx.strokeStyle = 'rgba(92, 64, 30, 0.8)';
    ctx.lineWidth = 2 * d;
    ctx.strokeRect(s.x - 4 * d, s.y - 4 * d, s.w + 8 * d, s.h + 8 * d);

    ctx.save();
    ctx.beginPath();
    ctx.rect(s.x, s.y, s.w, s.h);
    ctx.clip();
    ctx.translate(Math.round(s.x - this.cam.x), Math.round(s.y - this.cam.y));
    const tp = this.tp;
    const px0 = Math.floor(this.cam.x / (PIECE * tp));
    const py0 = Math.floor(this.cam.y / (PIECE * tp));
    const px1 = Math.floor((this.cam.x + s.w) / (PIECE * tp));
    const py1 = Math.floor((this.cam.y + s.h) / (PIECE * tp));
    this.pieceCap = Math.max(40, (px1 - px0 + 1) * (py1 - py0 + 1) + 12);
    for (let py = py0; py <= py1; py++) {
      for (let px = px0; px <= px1; px++) ctx.drawImage(this.piece(px, py), px * PIECE * tp, py * PIECE * tp);
    }
    this.drawNewInk(ctx);
    this.drawRifts(ctx, now);
    this.drawLabels(ctx);
    this.drawPins(ctx, now);
    this.drawTremors(ctx, now);
    this.drawLies(ctx, now);
    this.drawObjectiveMarkers(ctx, now);
    this.drawSight(ctx, now);
    this.drawCaravans(ctx, now);
    this.drawWraiths(ctx);
    this.drawPath(ctx);
    this.drawExplorer(ctx, now);
    effects.draw(ctx, this.tp, now, { onMap: true, minPx: this.dpr });
    if (hover) this.drawCursor(ctx, hover);
    ctx.restore();
    // Age at the edges of the visible sheet.
    const vg = ctx.createRadialGradient(s.x + s.w / 2, s.y + s.h / 2, Math.min(s.w, s.h) * 0.42, s.x + s.w / 2, s.y + s.h / 2, Math.hypot(s.w, s.h) * 0.62);
    vg.addColorStop(0, 'rgba(90, 60, 25, 0)');
    vg.addColorStop(1, 'rgba(90, 60, 25, 0.26)');
    ctx.fillStyle = vg;
    ctx.fillRect(s.x, s.y, s.w, s.h);
    ctx.restore();
    if (this.scroll && t >= 1) this.drawOffscreenHints(ctx);
  }

  drawNewInk(ctx) {
    const g = this.game;
    const w = g.world;
    const tp = this.tp;
    for (const i of g.visibleList) {
      const age = g.time - w.chartedAt[i];
      if (age < 0 || age > 0.6) continue;
      ctx.fillStyle = `rgba(232, 218, 185, ${0.85 * (1 - age / 0.6)})`;
      ctx.fillRect(w.xOf(i) * tp, w.yOf(i) * tp, tp, tp);
    }
  }

  drawRifts(ctx, now) {
    const w = this.game.world;
    const tp = this.tp;
    for (const i of w.rifts) {
      if (w.map[i] !== T.RIFT || !this.inView(w.xOf(i), w.yOf(i))) continue;
      const x = (w.xOf(i) + 0.5) * tp;
      const y = (w.yOf(i) + 0.5) * tp;
      const p = 0.5 + 0.5 * Math.sin(now * 2.2 + hash01(i, 3, 5) * 6);
      const g = ctx.createRadialGradient(x, y, tp * 0.1, x, y, tp * (0.8 + p * 0.25));
      g.addColorStop(0, `rgba(146, 87, 234, ${0.22 + p * 0.18})`);
      g.addColorStop(1, 'rgba(146, 87, 234, 0)');
      ctx.fillStyle = g;
      ctx.fillRect(x - tp, y - tp, tp * 2, tp * 2);
    }
  }

  drawLabels(ctx) {
    const g = this.game;
    const w = g.world;
    const tp = this.tp;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const label = (text, x, y, size, italic = false, color = INK.ink) => {
      ctx.font = italic ? `italic ${size}px "IM Fell English", Georgia, serif` : `${size}px ${DISPLAY_FONT}`;
      ctx.lineWidth = Math.max(2, size * 0.28);
      ctx.strokeStyle = 'rgba(232, 218, 185, 0.85)';
      ctx.strokeText(text, x, y);
      ctx.fillStyle = color;
      ctx.fillText(text, x, y);
    };
    const small = tp < 11 * this.dpr;
    for (const f of w.features) {
      if (!this.inView(f.cx, f.cy, 4)) continue;
      if (!f.tiles.some((i) => w.map[i] !== T.BLANK)) continue;
      const top = f.top;
      if (f.kind === 'town') label(f.name, f.cx * tp, top * tp - tp * 0.32, Math.max(10 * this.dpr, tp * 0.62));
      else if (small) continue;
      else if (f.kind === 'tower') label(f.name, f.cx * tp, (top + 1) * tp + tp * 0.34, Math.max(9, tp * 0.46), true);
      else if (f.kind === 'lair' && f.alive) label(f.name, f.cx * tp, top * tp - tp * 0.3, Math.max(9, tp * 0.46), true, INK.red);
      else if (f.kind === 'inkwell') label(f.name, f.cx * tp, (top + 1) * tp + tp * 0.3, Math.max(8, tp * 0.38), true);
      else if (f.kind === 'shrine') label('Wayshrine', f.cx * tp, (top + 1) * tp + tp * 0.3, Math.max(8, tp * 0.38), true);
    }
    for (const l of g.chapter.labels || []) {
      if (w.map[w.idx(l.x, l.y)] === T.BLANK) continue;
      label(l.text, (l.x + 0.5) * tp, (l.y + 0.5) * tp, Math.max(9, tp * (l.size || 0.5)), true, l.water ? INK.water : INK.ink);
    }
  }

  // The explorer's own marks.
  drawPins(ctx, now) {
    const tp = this.tp;
    for (const p of this.game.pins) {
      if (!this.inView(p.x, p.y, 3)) continue;
      drawFlag(ctx, (p.x + 0.5) * tp, (p.y + 0.5) * tp, Math.max(14 * this.dpr, tp * 0.9), now + p.n);
    }
  }

  drawTremors(ctx, now) {
    const g = this.game;
    const tp = this.tp;
    for (const t of g.tremors) {
      const cx = t.x * tp;
      const cy = t.y * tp;
      const R = t.r * tp;
      const speed = 0.5 + t.urgency * 1.8;
      const color = mixColor(SEPIA, VERMILION, t.urgency);
      ctx.lineWidth = Math.max(1.5, tp * (0.06 + t.urgency * 0.05));
      for (let k = 0; k < 3; k++) {
        const ph = (now * speed + k / 3) % 1;
        const r = R * (0.3 + 0.7 * ph);
        ctx.strokeStyle = color;
        ctx.globalAlpha = (1 - ph) * (0.28 + 0.6 * t.urgency);
        ctx.beginPath();
        for (let a = 0; a <= PI2 + 0.01; a += 0.2) {
          const rr = r * (1 + 0.06 * Math.sin(a * 7 + now * 4 + k));
          const px = cx + Math.cos(a) * rr;
          const py = cy + Math.sin(a) * rr;
          if (a === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        }
        ctx.stroke();
      }
      ctx.globalAlpha = 0.55 + 0.45 * Math.sin(now * (3 + t.urgency * 6)) ** 2;
      ctx.font = `${Math.max(12, tp * 0.8)}px ${DISPLAY_FONT}`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = color;
      ctx.fillText('?', cx, cy);
      ctx.globalAlpha = 1;
    }
  }

  strainArc(ctx, x, y, r, frac, now) {
    ctx.lineWidth = Math.max(2, this.tp * 0.09);
    ctx.strokeStyle = 'rgba(40, 20, 10, 0.35)';
    ctx.beginPath();
    ctx.arc(x, y, r, 0, PI2);
    ctx.stroke();
    const urgent = frac > 0.7;
    ctx.strokeStyle = urgent && Math.sin(now * 14) > 0 ? '#ffb199' : UI.vermilion;
    ctx.beginPath();
    ctx.arc(x, y, r, -Math.PI / 2, -Math.PI / 2 + PI2 * Math.min(1, frac));
    ctx.stroke();
  }

  // Contradictions the explorer can see or has seen.
  drawLies(ctx, now) {
    const g = this.game;
    const w = g.world;
    const tp = this.tp;
    const max = g.cfg.strainMax;
    const lies = [];
    for (const i of w.lies) if ((w.known[i] || w.visible[i]) && this.inView(w.xOf(i), w.yOf(i))) lies.push(i);
    if (!lies.length) return;
    ctx.save();
    ctx.setLineDash([tp * 0.18, tp * 0.12]);
    ctx.lineWidth = Math.max(1.5, tp * 0.07);
    ctx.strokeStyle = UI.vermilion;
    ctx.lineDashOffset = -now * tp * 0.6;
    for (const i of lies) ctx.strokeRect(w.xOf(i) * tp + tp * 0.08, w.yOf(i) * tp + tp * 0.08, tp * 0.84, tp * 0.84);
    ctx.restore();
    for (const i of lies) {
      const frac = w.strain[i] / max;
      if (frac < 0.2) continue;
      this.strainArc(ctx, (w.xOf(i) + 0.5) * tp, (w.yOf(i) + 0.5) * tp, tp * 0.26, frac, now);
    }
  }

  drawObjectiveMarkers(ctx, now) {
    const g = this.game;
    const w = g.world;
    const tp = this.tp;
    for (const o of g.objectives) {
      const t = objectiveTarget(o, w);
      if (!t) continue;
      const x = t.x * tp;
      const y = t.y * tp;
      const bob = Math.sin(now * 3) * tp * 0.08;
      const r = tp * (t.r + 0.1 * Math.sin(now * 2));
      ctx.strokeStyle = 'rgba(201, 164, 92, 0.8)';
      ctx.lineWidth = Math.max(1.5, tp * 0.06);
      ctx.setLineDash([tp * 0.2, tp * 0.14]);
      ctx.beginPath();
      ctx.arc(x, y, r, 0, PI2);
      ctx.stroke();
      ctx.setLineDash([]);
      drawPin(ctx, x, (t.top - (t.labelAbove ? 1.25 : 0.62)) * tp + bob, tp);
    }
  }

  // How far the explorer can see from here: the reach of the Quill.
  drawSight(ctx, now) {
    const e = this.game.explorer;
    const tp = this.tp;
    ctx.save();
    ctx.setLineDash([tp * 0.25, tp * 0.18]);
    ctx.lineDashOffset = now * tp * 0.3;
    ctx.strokeStyle = 'rgba(95, 161, 146, 0.75)';
    ctx.lineWidth = Math.max(1.5, tp * 0.05);
    ctx.beginPath();
    ctx.arc(e.x * tp, e.y * tp, e.vision * tp, 0, PI2);
    ctx.stroke();
    ctx.restore();
  }

  drawExplorer(ctx, now) {
    const e = this.game.explorer;
    const tp = this.tp;
    const x = e.x * tp;
    const y = e.y * tp;
    const pulse = 0.5 + 0.5 * Math.sin(now * 3);
    ctx.fillStyle = `rgba(201, 164, 92, ${0.25 + 0.2 * pulse})`;
    ctx.beginPath();
    ctx.arc(x, y, tp * (0.55 + 0.1 * pulse), 0, PI2);
    ctx.fill();
    // A compass-rose marker: "you are here".
    ctx.save();
    ctx.translate(x, y);
    const r = Math.max(5, tp * 0.36);
    ctx.fillStyle = '#3b2a1e';
    ctx.beginPath();
    for (let k = 0; k < 8; k++) {
      const a = (k / 8) * PI2 - Math.PI / 2;
      const rr = k % 2 ? r * 0.38 : r;
      if (k) ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);
      else ctx.moveTo(Math.cos(a) * rr, Math.sin(a) * rr);
    }
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = UI.vermilion;
    ctx.beginPath();
    ctx.arc(0, 0, r * 0.28, 0, PI2);
    ctx.fill();
    ctx.restore();
  }

  drawWraiths(ctx) {
    const tp = this.tp;
    for (const c of this.game.creatures.list) {
      if (c.kind !== 'wraith') continue;
      const a = c.alive ? Math.min(1, 1 - Math.max(0, c.born)) : Math.max(0, c.dying / 0.6);
      drawWraith(ctx, c.x * tp, (c.y + Math.sin(c.phase * 2.2) * 0.08) * tp, tp * 1.1, c.phase, a);
    }
  }

  drawCaravans(ctx, now) {
    const tp = this.tp;
    for (const c of this.game.creatures.list) {
      if (c.kind !== 'caravan' || c.arrived) continue;
      const x = c.x * tp;
      const y = c.y * tp;
      ctx.fillStyle = '#3b2a1e';
      ctx.strokeStyle = INK.paper;
      ctx.lineWidth = Math.max(1, tp * 0.06);
      ctx.beginPath();
      ctx.rect(x - tp * 0.3, y - tp * 0.18, tp * 0.6, tp * 0.36);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = INK.paper;
      ctx.beginPath();
      ctx.arc(x - tp * 0.15, y + tp * 0.2, tp * 0.08, 0, PI2);
      ctx.arc(x + tp * 0.15, y + tp * 0.2, tp * 0.08, 0, PI2);
      ctx.fill();
      if (c.stuck) {
        ctx.fillStyle = UI.vermilion;
        ctx.font = `bold ${Math.max(12, tp * 0.8)}px ${DISPLAY_FONT}`;
        ctx.textAlign = 'center';
        ctx.fillText('!', x, y - tp * 0.6 + Math.sin(now * 8) * tp * 0.05);
      }
    }
  }

  drawPath(ctx) {
    const e = this.game.explorer;
    const w = this.game.world;

  drawRifts(ctx, now, x0, x1, y0, y1) {
    const w = this.game.world;
    const tp = this.tp;
    for (let y = y0; y <= y1; y++) {
      for (let x = x0; x <= x1; x++) {
        const i = w.idx(x, y);
        if (i < 0 || w.real[i] !== T.RIFT) continue;
        const cx = (x + 0.5) * tp;
        const cy = (y + 0.5) * tp;
        const p = 0.5 + 0.5 * Math.sin(now * 2.2 + hash01(i, 3, 5) * 6);
        const grad = ctx.createRadialGradient(cx, cy, tp * 0.1, cx, cy, tp * (0.75 + p * 0.2));
        grad.addColorStop(0, `rgba(146, 87, 234, ${0.3 + p * 0.2})`);
        grad.addColorStop(1, 'rgba(146, 87, 234, 0)');
        ctx.fillStyle = grad;
        ctx.fillRect(cx - tp, cy - tp, tp * 2, tp * 2);
        ctx.fillStyle = `rgba(225, 205, 255, ${0.5 + 0.4 * p})`;
        for (let k = 0; k < 4; k++) {
          const a = now * (1.2 + k * 0.3) + hash01(i, k, 9) * 6;
          ctx.beginPath();
          ctx.arc(cx + Math.cos(a) * tp * 0.3, cy + Math.sin(a * 1.3) * tp * 0.25 - ((now * 0.4 + k * 0.25) % 1) * tp * 0.3, Math.max(1, tp * 0.012), 0, PI2);
          ctx.fill();
        }
      }
    }
  }

  // Ground just written into being glows with fresh ink for a moment.
  drawFreshInk(ctx, now) {
    const g = this.game;
    const w = g.world;
    const tp = this.tp;
    for (const [i, t0] of this.written) {
      const age = g.time - t0;
      if (age > 2.2 || age < 0) {
        this.written.delete(i);
        continue;
      }
      const a = 1 - age / 2.2;
      const cx = (w.xOf(i) + 0.5) * tp;
      const cy = (w.yOf(i) + 0.5) * tp;
      const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, tp * 0.75);
      grad.addColorStop(0, `rgba(255, 226, 150, ${0.45 * a})`);
      grad.addColorStop(1, 'rgba(255, 226, 150, 0)');
      ctx.fillStyle = grad;
      ctx.fillRect(cx - tp, cy - tp, tp * 2, tp * 2);
      ctx.fillStyle = `rgba(255, 240, 190, ${a})`;
      for (let k = 0; k < 5; k++) {
        const ph = (age * 0.8 + hash01(i, k, 11)) % 1;
        ctx.beginPath();
        ctx.arc(cx + (hash01(i, k, 12) - 0.5) * tp * 0.8, cy + (0.3 - ph) * tp * 0.8, Math.max(1, tp * 0.012), 0, PI2);
        ctx.fill();
      }
    }
  }

  // Where the land contradicts the map, mark the ground.
  drawLieOutlines(ctx, now) {
    const g = this.game;
    const w = g.world;
    const tp = this.tp;
    ctx.save();
    ctx.setLineDash([tp * 0.08, tp * 0.06]);
    ctx.lineDashOffset = -now * tp * 0.2;
    ctx.lineWidth = Math.max(2, tp * 0.025);
    for (const i of g.visibleList) {
      if (!w.mismatch(i)) continue;
      const pulse = 0.5 + 0.5 * Math.sin(now * 4 + i);
      ctx.strokeStyle = `rgba(221, 86, 56, ${0.55 + 0.4 * pulse})`;
      ctx.beginPath();
      ctx.roundRect(w.xOf(i) * tp + tp * 0.05, w.yOf(i) * tp + tp * 0.05, tp * 0.9, tp * 0.9, tp * 0.08);
      ctx.stroke();
    }
    ctx.restore();
  }

  drawObjectiveGlow(ctx, now) {
    const g = this.game;
    const tp = this.tp;
    for (const o of g.objectives) {
      const t = objectiveTarget(o, g.world);
      if (!t) continue;
      const r = tp * (t.r + 0.25 + 0.05 * Math.sin(now * 2));
      ctx.strokeStyle = 'rgba(230, 200, 135, 0.7)';
      ctx.lineWidth = Math.max(2, tp * 0.02);
      ctx.setLineDash([tp * 0.1, tp * 0.07]);
      ctx.beginPath();
      ctx.ellipse(t.x * tp, (t.y + 0.15) * tp, r, r * 0.6, 0, 0, PI2);
      ctx.stroke();
      ctx.setLineDash([]);
    }
  }

  drawPath(ctx, now) {
    const e = this.game.explorer;
    const w = this.game.world;
    if (!e.path || !e.path.length) return;
    const tp = this.tp;
    // Footsteps leading the way.
    ctx.fillStyle = 'rgba(59, 42, 30, 0.35)';
    let px = e.x;
    let py = e.y;
    let carry = 0;
    for (const i of e.path) {
      const qx = w.xOf(i) + 0.5;
      const qy = w.yOf(i) + 0.5;
      const d = Math.hypot(qx - px, qy - py);
      for (let s = 0.3 - carry; s < d; s += 0.3) {
        const t = s / d;
        ctx.beginPath();
        ctx.arc((px + (qx - px) * t) * tp, (py + (qy - py) * t) * tp, Math.max(1.5, tp * 0.018), 0, PI2);
        ctx.fill();
      }
      carry = (carry + d) % 0.3;
      px = qx;
      py = qy;
    }
    const pulse = 0.5 + 0.5 * Math.sin(now * 4);
    ctx.strokeStyle = `rgba(201, 164, 92, ${0.6 + 0.3 * pulse})`;
    ctx.lineWidth = Math.max(2, tp * 0.02);
    ctx.beginPath();
    ctx.ellipse(px * tp, py * tp, tp * 0.2, tp * 0.12, 0, 0, PI2);
    ctx.stroke();
  }

  drawHover(ctx, h, now) {
    const g = this.game;
    const w = g.world;
    if (!w.inside(h.x, h.y) || g.state !== 'playing') return;
    const tp = this.tp;
    const wraith = this.wraithNear(h.fx, h.fy);
    if (wraith) {
      ctx.strokeStyle = UI.verdigris;
      ctx.lineWidth = Math.max(2, tp * 0.025);
      ctx.beginPath();
      ctx.arc(wraith.x * tp, (wraith.y - 0.25) * tp, tp * 0.32, 0, PI2);
      ctx.stroke();
      return;
    }
    ctx.strokeStyle = 'rgba(255, 245, 220, 0.55)';
    ctx.lineWidth = Math.max(1.5, tp * 0.015);
    ctx.beginPath();
    ctx.ellipse((h.x + 0.5) * tp, (h.y + 0.5) * tp, tp * 0.22, tp * 0.13, 0, 0, PI2);
    ctx.stroke();
  }

  wraithNear(fx, fy) {
    let best = null;
    let bd = 0.6;
    for (const c of this.game.creatures.list) {
      if (c.kind !== 'wraith' || !c.alive) continue;
      const d = Math.hypot(c.x - fx, c.y - 0.25 - fy);
      if (d < bd) {
        bd = d;
        best = c;
      }
    }
    return best;
  }

  // Everything that stands up, nearest-to-the-viewer last.
  drawStanding(ctx, now, x0, x1, y0, y1) {
    const g = this.game;
    const w = g.world;
    const tp = this.tp;
    const e = g.explorer;
    const items = [];
    for (let y = y0; y <= y1; y++) {
      for (let x = x0; x <= x1; x++) {
        const i = w.idx(x, y);
        if (i < 0) continue;
        for (const p of this.propsFor(i)) items.push({ y: p.y, p, i });
      }
    }
    const onTower = w.real[e.tile(w)] === T.TOWER;
    const towerProp = onTower ? this.propsFor(e.tile(w)).find((p) => p.kind === 'tower') : null;
    const climb = towerProp && towerProp.v !== 2 ? TOWER_HEIGHT[towerProp.v] - 0.04 : 0;
    items.push({ y: climb ? e.y + 1 : e.y, explorer: true, climb });
    for (const c of g.creatures.list) {
      if (c.kind === 'hound') {
        const i = w.at(c.x, c.y);
        if (i >= 0 && w.visible[i]) items.push({ y: c.y, creature: c });
      } else if (c.kind === 'wraith' || (c.kind === 'caravan' && !c.arrived) || c.kind === 'villager') {
        if (c.x > x0 - 1 && c.x < x1 + 2 && c.y > y0 - 1 && c.y < y1 + 2) items.push({ y: c.y, creature: c });
      }
    }
    for (const a of g.wildlife.list) items.push({ y: a.y + (a.z > 0 ? 3 : 0), animal: a });
    items.sort((a, b) => a.y - b.y);
    for (const it of items) {
      if (it.p) {
        this.sprites.draw(ctx, it.p, it.p.x * tp, it.p.y * tp);
        if (w.burn[it.i] > 0 && (it.p.kind === 'pine' || it.p.kind === 'oak')) this.drawFlames(ctx, it.p, now);
      } else if (it.explorer) {
        this.drawExplorer(ctx, now, 1, it.climb);
      } else if (it.animal) {
        this.drawAnimal(ctx, it.animal);
      } else {
        const c = it.creature;
        if (c.kind === 'hound') this.drawHound(ctx, c);
        else if (c.kind === 'villager') this.drawVillager(ctx, c);
        else if (c.kind === 'wraith') {
          const a = c.alive ? Math.min(1, 1 - Math.max(0, c.born)) : Math.max(0, c.dying / 0.6);
          drawWraith(ctx, c.x * tp, (c.y - 0.25 + Math.sin(c.phase * 2.2) * 0.03) * tp, tp * 0.42, c.phase, a);
        } else this.drawCaravan(ctx, c, now);
      }
    }
    this.climb = climb;
  }

  drawFlames(ctx, p, now) {
    const tp = this.tp;
    const x = p.x * tp;
    const y = p.y * tp;
    for (let k = 0; k < 3; k++) {
      const f = 0.6 + 0.4 * Math.sin(now * 18 + k * 2 + p.x * 7);
      const fx = x + (k - 1) * tp * 0.07;
      const fh = tp * (0.18 + 0.1 * f);
      const base = y - tp * 0.1;
      ctx.fillStyle = k === 1 ? '#ffd35a' : '#ff7a2a';
      ctx.beginPath();
      ctx.moveTo(fx - tp * 0.05, base);
      ctx.quadraticCurveTo(fx - tp * 0.04, base - fh * 0.6, fx, base - fh);
      ctx.quadraticCurveTo(fx + tp * 0.04, base - fh * 0.6, fx + tp * 0.05, base);
      ctx.closePath();
      ctx.fill();
    }
  }

  // The explorer: a small figure in a hat, map under the arm.
  drawExplorer(ctx, now, alpha = 1, climb = 0) {
    const e = this.game.explorer;
    const tp = this.tp;
    if (alpha === 1 && e.invuln > 0 && Math.floor(now * 12) % 2 === 0) return;
    const s = tp * 0.3;
    const x = e.x * tp;
    const feet = (e.y - climb) * tp;
    const y = feet - s * 0.34;
    const bob = e.moving ? Math.abs(Math.sin(e.walkPhase * Math.PI)) * s * 0.06 : 0;
    const step = e.moving ? Math.sin(e.walkPhase * Math.PI) * s * 0.1 : 0;
    ctx.globalAlpha = alpha;
    if (alpha === 1) {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
      ctx.beginPath();
      ctx.ellipse(x, feet, s * 0.26, s * 0.08, 0, 0, PI2);
      ctx.fill();
      ctx.strokeStyle = `rgba(230, 200, 135, ${0.55 + 0.25 * Math.sin(now * 3)})`;
      ctx.lineWidth = Math.max(1.5, tp * 0.012);
      ctx.beginPath();
      ctx.ellipse(x, feet, s * 0.42, s * 0.14, 0, 0, PI2);
      ctx.stroke();
    }
    ctx.save();
    ctx.translate(x, y - bob);
    ctx.scale(e.facing, 1);
    ctx.strokeStyle = '#3b2a1e';
    ctx.lineWidth = Math.max(1.5, s * 0.08);
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(-s * 0.07, s * 0.12);
    ctx.lineTo(-s * 0.07 - step, s * 0.34 + bob);
    ctx.moveTo(s * 0.07, s * 0.12);
    ctx.lineTo(s * 0.07 + step, s * 0.34 + bob);
    ctx.stroke();
    ctx.fillStyle = e.hurtFlash > 0 ? '#e25a3c' : '#7a4a2a';
    ctx.beginPath();
    ctx.moveTo(-s * 0.2, s * 0.2);
    ctx.lineTo(-s * 0.13, -s * 0.12);
    ctx.lineTo(s * 0.13, -s * 0.12);
    ctx.lineTo(s * 0.2, s * 0.2);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#c9a45c';
    ctx.fillRect(-s * 0.13, s * 0.02, s * 0.26, s * 0.04);
    ctx.fillStyle = '#f2e6c8';
    ctx.strokeStyle = '#3b2a1e';
    ctx.lineWidth = Math.max(1, s * 0.03);
    ctx.beginPath();
    ctx.rect(s * 0.1, -s * 0.06, s * 0.2, s * 0.15);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = '#e8c39e';
    ctx.beginPath();
    ctx.arc(0, -s * 0.2, s * 0.1, 0, PI2);
    ctx.fill();
    ctx.fillStyle = '#3b2a1e';
    ctx.beginPath();
    ctx.ellipse(0, -s * 0.26, s * 0.2, s * 0.05, 0, 0, PI2);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(-s * 0.1, -s * 0.27);
    ctx.lineTo(-s * 0.08, -s * 0.42);
    ctx.lineTo(s * 0.08, -s * 0.42);
    ctx.lineTo(s * 0.1, -s * 0.27);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#c9a45c';
    ctx.fillRect(-s * 0.095, -s * 0.31, s * 0.19, s * 0.03);
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  // A faint silhouette on top of everything, so trees and roofs never hide the explorer.
  drawExplorerGhost(ctx, now) {
    this.drawExplorer(ctx, now, 0.3, this.climb || 0);
  }

  // Townsfolk: smaller than the explorer's hat, but not by much.
  drawVillager(ctx, c) {
    const tp = this.tp;
    const s = tp * 0.29;
    const x = c.x * tp;
    const feet = c.y * tp;
    const y = feet - s * 0.34;
    const look = c.look;
    const coats = ['#3f6a8a', '#8a3f3f', '#5f7a3a', '#7a5a8a', '#a07a2a', '#4a4a4a'];
    const coat = coats[look % coats.length];
    const hair = ['#3a2a1a', '#7a4a20', '#c9a46a', '#d8d0c0', '#1a1410'][(look >> 3) % 5];
    const skin = ['#e8c39e', '#c99a6e', '#9a6a44', '#f0d2b0'][(look >> 5) % 4];
    const skirt = (look >> 2) % 2 === 0;
    const step = c.moving ? Math.sin(c.phase * 9) * s * 0.08 : 0;
    ctx.fillStyle = 'rgba(0, 0, 0, 0.28)';
    ctx.beginPath();
    ctx.ellipse(x, feet, s * 0.22, s * 0.07, 0, 0, PI2);
    ctx.fill();
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(c.facing, 1);
    ctx.strokeStyle = '#3b2a1e';
    ctx.lineWidth = Math.max(1.5, s * 0.07);
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(-s * 0.06, s * 0.14);
    ctx.lineTo(-s * 0.06 - step, s * 0.34);
    ctx.moveTo(s * 0.06, s * 0.14);
    ctx.lineTo(s * 0.06 + step, s * 0.34);
    ctx.stroke();
    ctx.fillStyle = coat;
    ctx.beginPath();
    if (skirt) {
      ctx.moveTo(-s * 0.2, s * 0.26);
      ctx.lineTo(-s * 0.11, -s * 0.12);
      ctx.lineTo(s * 0.11, -s * 0.12);
      ctx.lineTo(s * 0.2, s * 0.26);
    } else {
      ctx.moveTo(-s * 0.15, s * 0.16);
      ctx.lineTo(-s * 0.12, -s * 0.12);
      ctx.lineTo(s * 0.12, -s * 0.12);
      ctx.lineTo(s * 0.15, s * 0.16);
    }
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = 'rgba(255, 255, 255, 0.25)';
    ctx.fillRect(-s * 0.1, -s * 0.02, s * 0.2, s * 0.03);
    ctx.fillStyle = skin;
    ctx.beginPath();
    ctx.arc(0, -s * 0.2, s * 0.095, 0, PI2);
    ctx.fill();
    ctx.fillStyle = hair;
    ctx.beginPath();
    ctx.arc(0, -s * 0.23, s * 0.1, Math.PI, 0);
    ctx.fill();
    if ((look >> 4) % 3 === 0) {
      // A straw hat.
      ctx.fillStyle = '#d8b65a';
      ctx.beginPath();
      ctx.ellipse(0, -s * 0.27, s * 0.17, s * 0.04, 0, 0, PI2);
      ctx.fill();
      ctx.fillRect(-s * 0.07, -s * 0.35, s * 0.14, s * 0.08);
    }
    ctx.restore();
  }

  drawAnimal(ctx, a) {
    const tp = this.tp;
    const x = a.x * tp;
    const feet = a.y * tp;
    if (a.kind === 'bird') {
      const s = tp * 0.05;
      const y = feet - a.z * tp;
      if (a.z <= 0) {
        // Pecking on the ground.
        const peck = Math.sin(a.phase * 6) > 0.6 ? s * 0.3 : 0;
        ctx.fillStyle = ['#3b3530', '#6a5a4a', '#2b3b4a'][a.v];
        ctx.beginPath();
        ctx.ellipse(x, y - s * 0.6, s * 0.7, s * 0.45, 0, 0, PI2);
        ctx.arc(x + a.facing * s * 0.6, y - s * 0.9 + peck, s * 0.32, 0, PI2);
        ctx.fill();
        return;
      }
      const flap = Math.sin(a.phase * 16) * s * 0.9;
      ctx.strokeStyle = ['#2b2520', '#4a3a2a', '#1b2b3a'][a.v];
      ctx.lineWidth = Math.max(1.2, s * 0.35);
      ctx.beginPath();
      ctx.moveTo(x - s * 1.4, y - flap);
      ctx.quadraticCurveTo(x - s * 0.5, y - s * 0.3, x, y);
      ctx.quadraticCurveTo(x + s * 0.5, y - s * 0.3, x + s * 1.4, y - flap);
      ctx.stroke();
      return;
    }
    const fleeing = a.state === 'flee';
    const run = fleeing ? Math.sin(a.phase * 22) : 0;
    ctx.fillStyle = 'rgba(0, 0, 0, 0.22)';
    ctx.beginPath();
    ctx.ellipse(x, feet, tp * (a.kind === 'deer' ? 0.1 : 0.05), tp * 0.025, 0, 0, PI2);
    ctx.fill();
    ctx.save();
    ctx.translate(x, feet);
    ctx.scale(a.facing, 1);
    if (a.kind === 'deer') {
      const s = tp * 0.3;
      const graze = !fleeing && Math.sin(a.phase * 0.7) > 0.3;
      ctx.strokeStyle = '#6b4a2a';
      ctx.lineWidth = Math.max(1, s * 0.05);
      ctx.beginPath();
      for (const [lx, sw] of [[-0.2, 1], [-0.12, -1], [0.14, 1], [0.22, -1]]) {
        ctx.moveTo(s * lx, -s * 0.22);
        ctx.lineTo(s * lx + run * sw * s * 0.08, 0);
      }
      ctx.stroke();
      ctx.fillStyle = '#9a6a3a';
      ctx.beginPath();
      ctx.ellipse(0, -s * 0.3, s * 0.27, s * 0.11, 0, 0, PI2);
      ctx.fill();
      ctx.fillStyle = '#f2e6d0';
      ctx.beginPath();
      ctx.ellipse(-s * 0.27, -s * 0.33, s * 0.04, s * 0.04, 0, 0, PI2);
      ctx.fill();
      const hx = graze ? s * 0.34 : s * 0.3;
      const hy = graze ? -s * 0.12 : -s * 0.55;
      ctx.strokeStyle = '#9a6a3a';
      ctx.lineWidth = Math.max(1.5, s * 0.09);
      ctx.beginPath();
      ctx.moveTo(s * 0.2, -s * 0.34);
      ctx.lineTo(hx, hy);
      ctx.stroke();
      ctx.fillStyle = '#8a5a30';
      ctx.beginPath();
      ctx.ellipse(hx + s * 0.04, hy, s * 0.08, s * 0.05, 0.3, 0, PI2);
      ctx.fill();
      if (a.v === 0) {
        ctx.strokeStyle = '#5a4030';
        ctx.lineWidth = Math.max(1, s * 0.03);
        ctx.beginPath();
        ctx.moveTo(hx, hy - s * 0.04);
        ctx.lineTo(hx - s * 0.04, hy - s * 0.18);
        ctx.lineTo(hx - s * 0.1, hy - s * 0.24);
        ctx.moveTo(hx - s * 0.04, hy - s * 0.18);
        ctx.lineTo(hx + s * 0.02, hy - s * 0.25);
        ctx.stroke();
      }
    } else {
      const s = tp * 0.13;
      const hop = fleeing ? Math.abs(Math.sin(a.phase * 14)) * s * 0.6 : Math.max(0, Math.sin(a.phase * 2.5) - 0.9) * s * 3;
      ctx.translate(0, -hop);
      ctx.fillStyle = '#8a7a64';
      ctx.beginPath();
      ctx.ellipse(0, -s * 0.35, s * 0.42, s * 0.3, 0, 0, PI2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(s * 0.36, -s * 0.55, s * 0.2, 0, PI2);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(s * 0.3, -s * 0.92, s * 0.06, s * 0.24, -0.2, 0, PI2);
      ctx.ellipse(s * 0.42, -s * 0.9, s * 0.06, s * 0.22, 0.15, 0, PI2);
      ctx.fill();
      ctx.fillStyle = '#f2ece0';
      ctx.beginPath();
      ctx.arc(-s * 0.42, -s * 0.38, s * 0.1, 0, PI2);
      ctx.fill();
    }
    ctx.restore();
  }

  // Little signs over people and places nearby: someone to meet, someone to see.
  drawCues(ctx, now) {
    const g = this.game;
    const tp = this.tp;
    const waiting = new Set(g.objectives.filter((o) => o.done && o.giver && !o.thanked).map((o) => o.giver));
    for (const t of interactables(g, 7)) {
      const p = targetPos(t);
      let mark = '';
      if (t.kind === 'villager') {
        if (waiting.has(t.c.id)) mark = '!';
        else if (!t.c.chats) mark = '…';
      } else if (t.f.kind === 'cache' && !t.f.opened) {
        // A glint, now and then.
        const ph = (now * 0.6 + t.f.id * 0.37) % 1;
        if (ph < 0.25) {
          const a = Math.sin((ph / 0.25) * Math.PI);
          ctx.fillStyle = `rgba(255, 244, 200, ${a})`;
          const cx = (p.x + 0.05) * tp;

function visibleAny(g, pred) {
  return g.visibleList.some((i) => pred(g.world.real[i], i));
}

// Bridge tiles furthest from dry land: the middle of a span.
function spanMiddle(g, count) {
  const w = g.world;
  const bridges = [];
  for (let i = 0; i < w.n; i++) if (w.real[i] === T.BRIDGE) bridges.push(i);
  const dry = (t) => t !== T.WATER && t !== T.RIVER && t !== T.BRIDGE;
  const depth = (i) => {
    let best = Infinity;
    for (let j = 0; j < w.n; j++) if (dry(w.real[j])) best = Math.min(best, Math.abs(w.xOf(i) - w.xOf(j)) + Math.abs(w.yOf(i) - w.yOf(j)));
    return best;
  };
  return bridges
    .map((i) => ({ i, d: depth(i) }))
    .sort((a, b) => b.d - a.d)
    .slice(0, count)
    .map((b) => b.i);
}

    const f = g.flags;

    if (f.step === 'walk' && g.explorer.x > 13 && visibleAny(g, (t) => t === T.WATER)) {
      f.step = 'shore';
      g.setTool('bridge');
      g.setHint(
        'No boat, no bridge. But your map is no ordinary map. Press **M** (or **Take out map**) to unroll it, and draw a bridge across the water. Whatever you draw on the map becomes real.',
      );

      f.brushHint = true;
      g.setHint('The **Bridge** brush is ready. Drag from the shore out across the water, on the map.');
    } else if (f.step === 'shore' && g.stats.written >= 1) {
      f.step = 'building';
      g.setHint(
        'There it stands. Ink only takes on ground you have charted, and you chart what you see. Put the map away (**M**), walk out along your bridge to see farther, then draw the rest. Your **ink** trickles back on its own.',
      );
    } else if (f.step === 'storm-wait') {
      f.timer -= dt;
      if (f.timer <= 0) this.storm(g);
    } else if (f.step === 'repair') {
      if (!f.recordedGap && f.broken.some((i) => w.real[i] === T.WATER && w.map[i] === T.WATER)) {
        // They recorded the gap instead of mending it: fine, but now the map agrees the planks are gone.
        f.recordedGap = true;
        g.setTool('bridge');
        g.setHint(
          'You **recorded** the gap: now your map agrees the planks are gone, and no path leads home. That is what recording does, it accepts the land as it is. Take out your map and draw the missing planks again with the **Bridge** brush.',
        );
      }
      if (f.broken.every((i) => !w.mismatch(i)) && f.broken.every((i) => w.real[i] === T.BRIDGE)) {
        f.step = 'tremor';
        g.setHint(
          'Your map is trembling: something changed near the camp, where you could not see it. The arrows at the edge of your view point that way, and on the map a **?** ripple shows roughly where. Go back and look.',
        );
      }
    } else if (f.step === 'tremor' && f.crept.some((i) => w.visible[i] && w.mismatch(i))) {
      f.step = 'record';
      g.setHint(
        'The forest crept forward while you were away; the floating scraps show what your map still claims. Press **Space** to record the land as it is now. (Reasserting on the map would push the trees back instead, for more ink.)',
      );
    }
  },

  onObjective(g, o) {
    if (o.id === 'lighthouse') {
      g.flags.step = 'storm-wait';
      g.flags.timer = 3.5;
      g.setHint('From the top of the lighthouse you can see right across the lake. The sky is darkening…');
    }
  },

  storm(g) {
    const w = g.world;
    const f = g.flags;
    f.step = 'repair';
    const broken = spanMiddle(g, 2);
    for (const i of broken) w.setReal(i, T.WATER, 'storm');
    f.broken = broken;
    const crept = [];
    for (const [x, y] of [[4, 13], [3, 13], [5, 14], [2, 13]]) {
      const i = w.idx(x, y);
      if (w.real[i] === T.GRASS && w.map[i] === T.GRASS) {
        w.setReal(i, T.FOREST, 'creep');
        crept.push(i);
      }
    }
    f.crept = crept;
    g.addFx({ type: 'rain', x: 22, y: 11, r: 5, t: 5 });
    g.addFx({ type: 'lightning', x: 23, y: 9, t: 0.5 });
    g.reportEvent('storm', broken, 'A squall tears across the lake and rips planks out of your bridge!');
    g.reportEvent('creep', crept, 'The forest creeps outward.');
    g.unlockTool('quill');
    g.unlockTool('reassert');
    g.addObjective({ id: 'true', type: 'accurate', hold: 1.5, label: 'Make your map true again' });
    g.addObjective({ id: 'camp', type: 'reachPoint', x: 4, y: 11, r: 1.6, label: 'Return to camp' });
    g.victoryLocked = false;
    g.setTool('reassert');
    g.setHint(
      'The storm broke your bridge, and now the land **contradicts** your map. Over each break floats a scrap of the map, showing what it still claims, ringed in red. The ring fills with strain; if it closes, the map **tears**, and the world tears with it. Take out your map: **Reassert** is ready. Paint over the broken planks to make the map true again.',
    );
  },
};
