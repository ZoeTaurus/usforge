<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Fish Life</title>
<style>
  /* One screen: the 320x180 pixel canvas, centred on a deep-sea ground and scaled up in whole pixels. */
  :root {
    --sea-night: #07060f;   /* page ground: the same ink that frames the game */
    --glow: #2ce8f5;        /* keyboard focus ring: the game's highlight cyan */
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    margin: 0;
    box-sizing: border-box;
    padding-inline: 16px;
    padding-block: 8px;
    background: var(--sea-night);
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    -webkit-user-select: none;
    user-select: none;
  }
  /* Nearest-neighbour scaling keeps every pixel a crisp, chunky pixel. */
  #game {
    display: block;
    max-width: 100%;
    image-rendering: -moz-crisp-edges;
    image-rendering: crisp-edges;
    image-rendering: pixelated;
    touch-action: none;
    outline: none;
    cursor: none;
  }
  #game:focus-visible { outline: 2px solid var(--glow); outline-offset: 3px; }
</style>
<canvas id="game" width="320" height="180" tabindex="0" aria-label="Fish Life, a pixel art game. Click the game, then use the arrow keys, Space and Enter."></canvas>
<script src="js/engine.js"></script>
<script src="js/sound.js"></script>
<script src="js/art.js"></script>
<script src="js/title.js"></script>
<script src="js/sea.js"></script>
<script src="js/story.js"></script>
<script src="js/minigames.js"></script>
<script src="js/apartment.js"></script>
<script src="js/bowl.js"></script>
<script src="js/ending.js"></script>
<script src="js/main.js"></script>

</body></html>
