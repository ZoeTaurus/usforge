<style>
  /* One deliberate look: a dark arcade cabinet around a letterboxed 16:9 canvas. */
  :root {
    color-scheme: dark;
    --cabinet: #140c1f;
    --screen: #1d1428;
  }
  html, body { height: 100%; overflow: hidden; }
  body { margin: 0; background: var(--cabinet); touch-action: none; -webkit-user-select: none; user-select: none; }
  #game { position: absolute; display: block; background: var(--screen); outline: none; }
  #fontwarm, #fontwarm2 { position: absolute; left: -999px; top: -999px; color: var(--screen); }
  #fontwarm { font-family: 'Luckiest Guy', system-ui, sans-serif; }
  #fontwarm2 { font-family: 'Fredoka', system-ui, sans-serif; font-weight: 700; }
</style>
