<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Game · UsForge</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='4' y='4' width='8' height='8' rx='1.5' fill='%234d8cf7' transform='rotate(45 8 8)'/%3E%3C/svg%3E">
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0a0c11"><link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800;900&family=Geist+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="style.css?v=50">
<script>/* THEME_BOOT */try{var m=localStorage.getItem('usforge-theme')||'auto',h=new Date().getHours();document.documentElement.dataset.theme=m==='auto'?(h>=7&&h<19?'light':'dark'):m}catch(e){}</script>
<script src="icons.js?v=3"></script>
<script src="site.js?v=36"></script>
</head>
<body>

<!-- the game page: picture, description, Play -->
<div class="wrap">
  <header class="top">
    <a class="mark" href="./"><span class="spark"></span>UsForge</a>
    <nav><a href="./">Games</a><a href="add.html">Share your game</a><a href="upload.html">Upload</a><a href="credits.html">Credits</a><a class="nav-support" href="support.html" data-support hidden>Support <span data-icon="heart"></span></a><span data-theme-switch></span></nav>
  </header>
  <main id="page"></main>
  <footer class="foot">
    <span>UsForge · by Lazy Studios</span>
    <a href="./">Back to the games →</a>
  </footer>
</div>

<!-- the game itself, full screen, once you press Play -->
<div class="player" id="player" hidden>
  <header class="bar">
    <button class="btn" id="back" type="button">← Back</button>
    <span class="title" id="title"></span>
    <button class="btn hide-sm" id="restart" type="button">Restart</button>
    <a class="btn hide-sm" id="alone" href="#" target="_blank" rel="noopener">Open alone ↗</a>
    <button class="btn hot" id="full" type="button">Fullscreen</button>
  </header>
  <form class="score-bar" id="scoreBar" hidden>
    <span id="scoreText"></span>
    <input id="scoreName" maxlength="16" placeholder="Your nickname" aria-label="Nickname for the leaderboard" autocomplete="nickname">
    <button class="btn hot" type="submit">Save score</button>
    <button class="btn" type="button" id="scoreSkip">No thanks</button>
  </form>
  <main class="stage" id="stage"></main>
</div>

<script src="embers.js?v=20"></script>
<script src="eggs.js?v=20"></script>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const slug = new URLSearchParams(location.search).get('g') || '';

  const hue = s => [...s].reduce((h, c) => (h * 31 + c.charCodeAt(0)) % 360, 7);
  const coverOf = (g, named) => g.cover ? `<img src="${esc(g.cover)}" alt="">` : `<div class="blank${named ? ' named' : ''}" style="--h:${hue(g.title)}">${esc(named ? g.title : g.title.split(/\s+/).slice(0, 2).map(w => w[0]).join('').toUpperCase())}</div>`;
  const ago = s => { if (!s) return ''; const d = Math.floor((Date.now() / 1000 - s) / 86400); return d < 1 ? 'Added today' : d === 1 ? 'Added yesterday' : d < 30 ? `Added ${d} days ago` : `Added ${new Date(s * 1000).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' })}`; };

  let game = null, frame = null;
  function detail(games) {
    const g = games.find(x => x.slug === slug);
    if (!g) { $('page').innerHTML = `<section class="intro"><h1>Game not found</h1><p>It may have been renamed or removed.</p></section>`; return; }
    game = g;
    document.title = `${g.title} · UsForge`;
    const rel = games.filter(x => !x.dev), others = games.filter(x => x !== g);
    const byThem = others.filter(x => x.author === g.author), rest = others.filter(x => x.author !== g.author);
    const more = [...byThem, ...rest].slice(0, 4);
    $('page').innerHTML = `
      <section class="detail">
        <div class="cover${g.pixel ? ' pixel' : ''}">${coverOf(g, true)}</div>
        <div>
          ${g.dev ? `<span class="devflag">${g.build ? 'In development · early build' : 'In development · coming soon'}</span>` : ''}
          <h1>${esc(g.title)}</h1>
          <a class="by" href="maker.html?n=${encodeURIComponent(g.author)}">by ${esc(g.author)}</a>
          ${g.genres?.length ? `<div class="gtags big">${g.genres.map(x => `<a class="gtag" href="./?genre=${encodeURIComponent(x)}">${esc(x)}</a>`).join('')}</div>` : ''}
          ${g.blurb ? `<p class="desc">${esc(g.blurb)}</p>` : ''}
          ${g.dev && g.progress != null ? `<div class="devprog"><span class="progress"><i style="width:${g.progress}%"></i></span><span class="progress-n">${g.progress}% done</span></div>` : ''}
          ${g.dev && g.next ? `<p class="next"><span>Next up:</span> ${esc(g.next)}</p>` : ''}
          <div class="facts"><span>${ago(g.added)}</span>${g.updated ? `<span>${ago(g.updated).replace('Added', 'Updated')}</span>` : ''}<span id="pickFact" hidden></span><span class="live-fact" data-live="${esc(g.slug)}" data-now hidden></span><span id="plays" hidden></span><span id="stokes" hidden></span>${g.dev ? '' : `<span>Game ${rel.length - rel.indexOf(g)} of ${rel.length}</span>`}${g.url ? '<span>Opens on another site</span>' : ''}</div>
          ${g.whatsnew?.text ? `<p class="whatsnew"><b>What’s new:</b> ${esc(g.whatsnew.text)} <time>${ago(g.whatsnew.at).replace('Added', 'Updated')}</time></p>` : ''}
          <div class="acts">
            ${g.build === false ? `<span class="soon">Nothing to play yet. ${esc(g.author)} is still making it.</span>` : g.url ? `<a class="big-play" href="${esc(g.url)}" target="_blank" rel="noopener">Play ↗</a>` : `<button class="big-play" id="playBtn" type="button">${UsForgeIcon('play')} ${g.dev ? 'Play early build' : 'Play'}</button>`}
            ${g.build === false ? '' : `<button class="stoke" id="stokeBtn" type="button" title="Stoke the fire: tell ${esc(g.author)} you love this game">${UsForge.FLAME}<span id="stokeLbl">Stoke</span><b id="stokeN"></b></button>`}
            <button class="btn-l fav-btn" id="favBtn" type="button" aria-pressed="false"><span data-icon="heart"></span> Favorite</button>
            <button class="btn-l" id="shareBtn" type="button">Share</button>
            <a class="btn-l" id="randomBtn" href="./" title="Another random game"><span data-icon="dice"></span> Another game</a>
            ${g.url || g.build === false ? '' : `<a class="btn-l" href="games/${encodeURIComponent(g.slug)}/" target="_blank" rel="noopener">Open in a new tab ↗</a>`}
          </div>
          ${g.build === false ? '' : `<form class="feedback" id="feedback">
            <span class="fb-q">What did you think of ${esc(g.title)}?</span>
            <span class="fb-votes"><button type="button" class="fb-vote" data-vote="up" aria-pressed="false" aria-label="I liked it">${UsForgeIcon('thumbUp')}</button><button type="button" class="fb-vote" data-vote="down" aria-pressed="false" aria-label="Not for me">${UsForgeIcon('thumbDown')}</button></span>
            <textarea id="fbNote" maxlength="280" rows="2" placeholder="Anything to tell ${esc(g.author)}? (optional)"></textarea>
            <span class="fb-row"><button class="btn-l" type="submit" id="fbSend">Send to ${esc(g.author)}</button><span class="fb-hint">Only ${esc(g.author)} and the founders can read this.</span></span>
            <p class="fb-msg" id="fbMsg" role="status"></p>
          </form>`}
          <p class="tipline" data-support hidden>Enjoying ${esc(g.title)}? <a href="support.html">Support Lazy Studios ${UsForgeIcon('heart')}</a></p>
        </div>
        ${g.shots?.length ? `<div class="shots" aria-label="Screenshots">${g.shots.map((src, k) => `<button type="button" class="shot" data-k="${k}" aria-label="Screenshot ${k + 1} of ${g.shots.length}"><img src="${esc(src)}" alt="" loading="lazy"></button>`).join('')}</div>` : ''}
        <section class="board" id="board" hidden>
          <div class="shelf-head"><h2>Leaderboard</h2><span class="shelf-note" id="boardNote"></span></div>
          <ol class="board-list" id="boardList"></ol>
        </section>
      </section>
      ${more.length ? `<section class="more"><h3>${byThem.length ? `More from ${esc(g.author)} and friends` : 'More games'}</h3>
        <div class="grid">${more.map(o => `<article><a class="card tilt" data-cover href="play.html?g=${encodeURIComponent(o.slug)}"><div class="cover${o.pixel ? ' pixel' : ''}">${coverOf(o)}<span class="glint" aria-hidden="true"></span></div></a>
          <div class="meta"><b>${esc(o.title)}</b><span class="by">by ${esc(o.author)}</span></div></article>`).join('')}</div></section>` : ''}`;
    UsForgeIcon.fill();   // (draw the icons in what was just built)
    for (const b of document.querySelectorAll('.shot')) b.onclick = () => openShot(+b.dataset.k);
    $('playBtn')?.addEventListener('click', () => { history.pushState({ playing: true }, '', location.href); play(); });
    document.querySelector('.big-play[href]')?.addEventListener('click', () => { countPlay(); UsForge.played(game.slug); });   // link-only games count when you head off to play
    for (const el of document.querySelectorAll('.tipline')) el.hidden = !UsForge.supportUrl;
    UsForge.paintLive();
    // favorite
    const paintFav = () => { const on = UsForge.isFav(g.slug); $('favBtn').setAttribute('aria-pressed', String(on)); $('favBtn').innerHTML = `${UsForgeIcon(on ? 'heartFill' : 'heart')} ${on ? 'Favorited' : 'Favorite'}`; };
    $('favBtn').onclick = () => { const on = UsForge.toggleFav(g.slug); paintFav(); UsForge.toast(on ? `Added <b>${esc(g.title)}</b> to your favorites.` : 'Removed from favorites.'); };
    paintFav();
    // another random game
    const pool = games.filter(x => x.slug !== g.slug && !x.dev && x.build !== false);
    if (pool.length) $('randomBtn').href = `play.html?g=${encodeURIComponent(pool[Math.floor(Math.random() * pool.length)].slug)}`; else $('randomBtn').hidden = true;
    loadBoard();
    // founder pick?
    fetch('picks.json', { cache: 'no-cache' }).then(r => r.ok ? r.json() : []).then(p => { const k = (p || []).find(x => x.slug === g.slug); if (k) { $('pickFact').innerHTML = `<b class="pick-chip">${UsForgeIcon('starFill')} Founder pick</b>`; $('pickFact').hidden = false; } }).catch(() => {});
    // feedback: one per game per browser
    const fb = $('feedback');
    if (fb) {
      const key = 'usforge-fb:' + g.slug; let vote = null, sent = false;
      try { sent = !!localStorage.getItem(key); } catch (e) {}
      const done = text => { fb.innerHTML = `<p class="fb-done">${text}</p>`; };
      if (sent) done(`You sent ${esc(g.author)} your thoughts on this game. Thanks!`);
      else {
        for (const b of fb.querySelectorAll('.fb-vote')) b.onclick = () => { vote = vote === b.dataset.vote ? null : b.dataset.vote; for (const x of fb.querySelectorAll('.fb-vote')) x.setAttribute('aria-pressed', String(x.dataset.vote === vote)); };
        fb.onsubmit = async e => {
          e.preventDefault();
          const note = $('fbNote').value.trim();
          if (!vote && !note) { $('fbMsg').textContent = 'Pick thumbs up or down, or write a note.'; return; }
          $('fbSend').disabled = true; $('fbMsg').textContent = 'Sending…';
          try {
            const r = await fetch('/api/feedback?g=' + encodeURIComponent(g.slug), { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ vote, note }) });
            const d = await r.json().catch(() => ({}));
            if (!r.ok) throw new Error(d.error || 'That didn’t send. Try again in a moment.');
            try { localStorage.setItem(key, '1'); } catch (e) {}
            done(`Sent! ${esc(g.author)} will see it on their Upload page.`);
          } catch (err) { $('fbMsg').textContent = err.message; $('fbSend').disabled = false; }
        };
      }
    }
    UsForge.stats().then(st => { if (st) { showPlays(st.plays); showStokes(st.stokes); } });
    $('stokeBtn')?.addEventListener('click', doStoke);
    // share: the phone's share sheet where there is one, otherwise copy the link
    $('shareBtn').onclick = async () => {
      const link = `${location.origin}/play?g=${encodeURIComponent(g.slug)}`;
      if (navigator.share && matchMedia('(pointer: coarse)').matches) { try { await navigator.share({ title: g.title, text: `${g.title} by ${g.author} on UsForge`, url: link }); return; } catch (e) { if (e.name === 'AbortError') return; } }
      try { await navigator.clipboard.writeText(link); UsForge.toast(`Link copied. Paste it to a friend!`); }
      catch (e) { UsForge.toast(`Copy this link: <b>${esc(link)}</b>`, 6000); }
    };
    if (location.hash === '#play' && !g.url && g.build !== false) { history.replaceState(null, '', location.pathname + location.search); history.pushState({ playing: true }, '', location.href); play(); }
    setTimeout(() => $('playBtn')?.focus(), 50);
    if (history.state?.playing) play();   // came back to a page that was playing
  }

  // ---------- play counter (once per game per visit, so refreshing doesn't pad it) ----------
  function showPlays(counts) {
    if (!counts || !game || !$('plays')) return;
    const n = counts[game.slug] || 0;
    $('plays').innerHTML = `${UsForgeIcon('play')} ${n.toLocaleString()} play${n === 1 ? '' : 's'}`; $('plays').hidden = false;
  }
  // stoking: one per game per browser — the flame flares, the count goes up
  function showStokes(counts) {
    if (!counts || !game || !$('stokeBtn')) return;
    const n = counts[game.slug] || 0, mine = UsForge.stoked(game.slug);
    $('stokeN').textContent = n ? n.toLocaleString() : '';
    $('stokeLbl').textContent = mine ? 'Stoked' : 'Stoke';
    $('stokeBtn').title = mine ? 'Click to take your stoke back' : `Stoke the fire: tell ${game.author} you love this game`;
    $('stokeBtn').classList.toggle('done', mine); $('stokeBtn').setAttribute('aria-pressed', String(mine));
    $('stokes').textContent = `${n.toLocaleString()} stoke${n === 1 ? '' : 's'}`; $('stokes').hidden = false;
  }
  async function doStoke() {
    if (!game) return;
    const b = $('stokeBtn'), was = +($('stokeN').textContent.replace(/\D/g, '') || 0);
    if (UsForge.stoked(game.slug)) {   // unstoke
      const pending = UsForge.stoke(game.slug);
      showStokes({ [game.slug]: Math.max(0, was - 1) });
      const res = await pending; if (res) showStokes(res.stokes);
      UsForge.toast(`Stoke taken back from <b>${esc(game.title)}</b>.`);
      return;
    }
    b.classList.remove('pop'); void b.offsetWidth; b.classList.add('pop');
    const r = b.getBoundingClientRect(); window.UsForgeEggs?.burst(r.left + 26, r.top + r.height / 2, 26, 260);
    const pending = UsForge.stoke(game.slug);   // (remembers this browser stoked it right away)
    showStokes({ [game.slug]: was + 1 });   // straight away; the real number follows
    const res = await pending;
    if (res) showStokes(res.stokes);
    UsForge.toast(`You stoked <b>${esc(game.title)}</b>. ${esc(game.author)} will be pleased.`);
  }

  function countPlay() {
    const key = 'usforge-played:' + game.slug;
    try { if (sessionStorage.getItem(key)) return; sessionStorage.setItem(key, '1'); } catch (e) {}
    fetch('/api/plays?g=' + encodeURIComponent(game.slug), { method: 'POST', keepalive: true })
      .then(r => r.ok ? r.json() : null).then(showPlays).catch(() => {});
  }

  // ---------- playing ----------
  // ---------- screenshots: click one to see it big (arrows / swipe-free buttons to flip through) ----------
  function openShot(k) {
    const list = game.shots || []; if (!list.length) return;
    let d = $('lightbox');
    if (!d) {
      d = document.createElement('dialog'); d.id = 'lightbox'; d.className = 'lightbox';
      d.innerHTML = `<img alt=""><button type="button" class="lb-prev" aria-label="Previous screenshot">‹</button><button type="button" class="lb-next" aria-label="Next screenshot">›</button><button type="button" class="lb-close" aria-label="Close">${UsForgeIcon('close')}</button><span class="lb-n"></span>`;
      document.body.append(d);
      d.addEventListener('click', e => { if (e.target === d) d.close(); });
      d.querySelector('.lb-close').onclick = () => d.close();
      d.querySelector('.lb-prev').onclick = () => show(d.k - 1);
      d.querySelector('.lb-next').onclick = () => show(d.k + 1);
      d.addEventListener('keydown', e => { if (e.key === 'ArrowLeft') show(d.k - 1); if (e.key === 'ArrowRight') show(d.k + 1); });
    }
    const show = n => { d.k = (n + list.length) % list.length; d.querySelector('img').src = list[d.k]; d.querySelector('.lb-n').textContent = `${d.k + 1} / ${list.length}`; for (const b of d.querySelectorAll('.lb-prev, .lb-next')) b.hidden = list.length < 2; };
    show(k); d.showModal();
  }

  // ---------- play time (while the game is open and the tab is visible) ----------
  setInterval(() => { if (frame && !document.hidden && game) UsForge.addTime(game.slug, 10); }, 10000);

  // ---------- leaderboard ----------
  // unit 'time' = seconds, shown as a clock (38:12, or 1:02:05)
  const clock = s => { s = Math.max(0, Math.round(s)); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = String(s % 60).padStart(2, '0'); return h ? `${h}:${String(m).padStart(2, '0')}:${x}` : `${m}:${x}`; };
  const fmt = (n, unit) => unit === 'time' ? clock(n) : `${Number(n).toLocaleString()}${unit ? ' ' + esc(unit) : ''}`;
  async function loadBoard(highlight) {
    try {
      const b = await (await fetch('/api/scores?g=' + encodeURIComponent(game.slug), { cache: 'no-store' })).json();
      if (!b.list?.length) {
        if (!game.leaderboard) return;
        $('board').hidden = false; $('boardNote').textContent = '';
        $('boardList').innerHTML = `<li class="empty-board">No scores yet. Finish a game to be the first on the board!</li>`;
        return;
      }
      $('board').hidden = false;
      $('boardNote').textContent = b.unit === 'time' ? (b.order === 'low' ? 'fastest wins' : 'longest wins') : b.order === 'low' ? 'lowest wins' : 'top 10';
      $('boardList').innerHTML = b.list.map((e, i) => `<li class="${e.id === highlight ? 'me' : ''}"><span class="rank">${i < 3 ? UsForgeIcon('medal', 'medal-' + (i + 1)) : i + 1}</span><b>${esc(e.name)}</b><span class="score">${fmt(e.score, b.unit)}</span></li>`).join('');
    } catch (e) {}
  }
  let pendingScore = null;
  addEventListener('message', e => {   // a game says: { usforge: 'score', score: 1234, order?: 'low', unit?: 'points' }
    if (!frame || e.source !== frame.contentWindow || e.data?.usforge !== 'score' || !Number.isFinite(Number(e.data.score))) return;
    pendingScore = { score: Number(e.data.score), order: e.data.order === 'low' ? 'low' : 'high', unit: String(e.data.unit || '') };
    $('scoreText').innerHTML = `Score: <b>${fmt(pendingScore.score, pendingScore.unit)}</b>. Put it on the leaderboard?`;
    try { $('scoreName').value = localStorage.getItem('usforge-nick') || ''; } catch (err) {}
    $('scoreBar').hidden = false;
  });
  $('scoreSkip').onclick = () => { $('scoreBar').hidden = true; pendingScore = null; frame?.focus(); };
  $('scoreBar').onsubmit = async e => {
    e.preventDefault();
    const name = $('scoreName').value.trim();
    if (!/^[A-Za-z0-9 _-]{2,16}$/.test(name)) { UsForge.toast('Nicknames: 2–16 letters, numbers, spaces, - or _. No real full names!'); return; }
    try { localStorage.setItem('usforge-nick', name); } catch (err) {}
    const r = await fetch('/api/score?g=' + encodeURIComponent(game.slug), { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ name, ...pendingScore }) }).catch(() => null);
    const d = await r?.json().catch(() => ({}));
    $('scoreBar').hidden = true; pendingScore = null; frame?.focus();
    if (!r?.ok) { UsForge.toast(d?.error || 'Couldn’t save the score. Try again later.'); return; }
    try { const mine = JSON.parse(localStorage.getItem('usforge-myscores') || '{}'); mine[game.slug] = { name, at: Math.floor(Date.now() / 1000) }; localStorage.setItem('usforge-myscores', JSON.stringify(mine)); } catch (err) {}
    if (d.rank) { UsForge.flag('hs'); UsForge.toast(d.improved ? `You’re <b>#${d.rank}</b> on the leaderboard!` : `Your best is still #${d.rank}. Keep trying!`); }
    else UsForge.toast('Saved! Not in the top 10 yet. Keep going!');
    loadBoard(d.board?.list?.[d.rank - 1]?.id);
  };

  function play() {
    const g = game; if (!g || g.url || g.build === false) return;
    countPlay(); UsForge.played(g.slug); UsForge.setPlaying(g.slug);
    const src = `games/${encodeURIComponent(g.slug)}/`;
    $('title').innerHTML = `<b>${esc(g.title)}</b> by ${esc(g.author)}`;
    $('alone').href = src;
    if (!frame) {
      frame = document.createElement('iframe');
      frame.title = g.title;
      // scripts and saves work; the game can go fullscreen and use a gamepad
      frame.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-pointer-lock allow-forms allow-modals allow-popups');
      frame.allow = 'fullscreen; autoplay; gamepad';
      frame.addEventListener('load', () => frame.focus());   // so the keyboard goes straight to the game
      frame.src = src;
      $('stage').append(frame);
    }
    $('player').hidden = false; document.body.classList.add('playing'); frame.focus(); window.UsForge?.refreshScroll();
  }
  function stop() {   // back to the game page (the game is removed so it stops making noise)
    $('player').hidden = true; document.body.classList.remove('playing');
    frame?.remove(); frame = null; window.UsForge?.refreshScroll(); UsForge.setPlaying(null);
    setTimeout(() => $('playBtn')?.focus(), 50);
  }
  $('back').onclick = () => history.state?.playing ? history.back() : stop();
  addEventListener('popstate', () => { if (history.state?.playing) play(); else stop(); });
  $('restart').onclick = () => { if (frame) frame.src = frame.src; };
  $('full').onclick = () => (frame?.requestFullscreen?.() || frame?.webkitRequestFullscreen?.())?.catch?.(() => {});
  $('stage').addEventListener('pointerdown', () => frame?.focus());

  fetch('games.json', { cache: 'no-cache' }).then(r => r.json()).then(detail)
    .catch(() => { $('page').innerHTML = '<section class="intro"><h1>Couldn’t load</h1><p>The game list didn’t load. Try refreshing.</p></section>'; });
})();
</script>
</body>
</html>
