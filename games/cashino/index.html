];

// ---------------------------------------------------------------------
//  luck: every random outcome in the casino can be "fortune rolled" -
//  with probability q the game rolls twice and keeps the better result.
// ---------------------------------------------------------------------
const Luck = {
  // richer players get a little less lucky (tuned with tools/sim.js)
  base(m) {
    const d = Math.max(1, m / 100);
    return U.clamp(0.7 - 0.025 * Math.log10(Math.max(1, d / 5)), 0.42, 0.7);
  },
  q() { return U.clamp(this.base(State.money) + State.charmLuck() + State.buffLuck() + (State.flags.owner ? 0.1 : 0), 0, 0.85); },
  // gen() makes an outcome, score(outcome) = how good it is for the player
  pick(gen, score) {
    let a = gen();
    if (U.rand() < this.q()) {
      const b = gen();
      if (score(b) > score(a)) a = b;
    }
    return a;
  },
  level() { return Math.round((this.q() / 0.85) * 100); },
};

// ---------------------------------------------------------------------
//  global banners ("RANK UP!", events)
// ---------------------------------------------------------------------
const Toasts = {
  q: [], cur: null,
  push(text, sub, c = C.yellow, dur = 2.6) { this.q.push({ text, sub, c, dur, t: 0 }); },
  draw(dt) {
    if (!this.cur && this.q.length) this.cur = this.q.shift();
    const m = this.cur;
    if (!m) return;
    m.t += dt;
    if (m.t > m.dur) { this.cur = null; return; }
    const inT = Math.min(1, m.t / 0.25), outT = Math.min(1, Math.max(0, (m.dur - m.t) / 0.25));
    const k = Ease.outBack(Math.min(inT, outT));
    const w = Math.max(Font.width(m.text) + 24, m.sub ? Font.width(m.sub, 's') + 16 : 0);
    const h = m.sub ? 22 : 14;
    const y = Math.round(-h + (h + 16) * k);
    const x = Math.round(W / 2 - w / 2);
    panel(x, y, w, h, C.night, m.c);
    for (let i = 0; i < 3; i++) P(x + 3 + ((Math.floor(m.t * 12) + i * 2) % (w - 6)), y + 1, C.white);
    Font.draw(m.text, W / 2, y + 4, { c: m.c, a: 'c', sh: C.ink });
    if (m.sub) Font.draw(m.sub, W / 2, y + 13, { c: C.lav, a: 'c', f: 's' });
  },
};

// ---------------------------------------------------------------------
//  casino-wide events
// ---------------------------------------------------------------------
const EVENTS = {
  happy: { name: 'HAPPY HOUR!', sub: 'ALL WINS PAY DOUBLE', dur: 60, c: C.pink },
  lucky: { name: 'LUCKY STREAK!', sub: '+25 LUCK FOR EVERYONE', dur: 60, c: C.lime },
  rain: { name: 'GEM RAIN!', sub: 'GEMS ARE FALLING ON THE FLOOR', dur: 30, c: C.yellow },
  hot: { name: 'HOT MACHINE!', sub: 'ONE GAME PAYS TRIPLE - FIND THE FIRE', dur: 90, c: C.orange },
};

const State = {
  ready: false,

  init(hotSave) {
    this.reset();
    let data = hotSave || null;
    if (!data) { try { data = JSON.parse(localStorage.getItem('cashino_save_v1') || 'null'); } catch (e) { data = null; } }
    this.saved = data && data.v === 1 ? data : null;
    this.ready = true;
  },

  reset() {
    this.money = gems(5);
    this.owned = {};          // item id -> true
    this.outfit = 'tee';
    this.wear = { shades: false, chain: false, slick: false, hat: null };
    this.buffs = [];          // {name, amt, t}
    this.flags = {};
    this.stats = { rounds: 0, wagered: 0, won: 0, bigWin: 0, bigWinGame: '', peak: gems(5), time: 0, jackpots: 0, broke: 0, games: {}, bestRank: 1 };
    this.pos = null;
    this.jackpot = gems(250000000);
    this.event = null; this.eventNext = 60; this.hotTarget = null;
    this.saveT = 0;
    this.inGame = false;
  },

  hasSave() { return !!this.saved; },
  newGame() { this.reset(); this.flags.started = true; this.beginnersLuck(); this.save(); Wallet.snap(); },
  beginnersLuck() { this.addBuff("BEGINNER'S LUCK", 0.3, 300); },
  continueGame() { if (this.saved) this.load(this.saved); Wallet.snap(); },

  serialize() {
    return {
      v: 1, money: this.money, owned: this.owned, outfit: this.outfit, wear: this.wear,
      buffs: this.buffs, flags: this.flags, stats: this.stats, pos: this.pos, jackpot: this.jackpot,
    };
  },
  load(d) {
    this.reset();
    this.money = Math.max(0, Math.round(d.money || 0));
    Object.assign(this.owned, d.owned || {});
    this.outfit = OUTFITS[d.outfit] ? d.outfit : 'tee';
    Object.assign(this.wear, d.wear || {});
    this.buffs = Array.isArray(d.buffs) ? d.buffs.filter(b => b && b.t > 0) : [];
    Object.assign(this.flags, d.flags || {});
    Object.assign(this.stats, d.stats || {});
    this.pos = d.pos || null;
    this.jackpot = d.jackpot || this.jackpot;
  },
  save() {
    if (!this.ready || !this.flags.started) return;
    const d = this.serialize();
    this.saved = d;
    try { localStorage.setItem('cashino_save_v1', JSON.stringify(d)); } catch (e) { /* storage blocked */ }
  },
  wipe() { try { localStorage.removeItem('cashino_save_v1'); } catch (e) { /* ignore */ } this.saved = null; },

  tick(dt) {
    if (!this.flags.started) return;
    this.stats.time += dt;
    for (const b of this.buffs) b.t -= dt;
    this.buffs = this.buffs.filter(b => b.t > 0);
    if (this.money > this.stats.peak) this.stats.peak = this.money;
    this.saveT += dt;
    if (this.saveT > 8) { this.saveT = 0; this.save(); }
    if (this.inGame) this.tickEvents(dt);
  },

  // ------------------------------------------------------------ money
  canAfford(c) { return this.money >= c; },
  take(c) { this.money = Math.max(0, this.money - Math.round(c)); Wallet.bump(false); },
  give(c) { if (c > 0) { this.money += Math.round(c); Wallet.bump(true); this.checkRank(); } },
  // apply event multipliers to a winning payout
  boost(payout, bet, key) {
    if (payout <= bet) return payout;
    let m = 1;
    if (this.event && this.event.type === 'happy') m *= 2;
    if (this.event && this.event.type === 'hot' && key && this.hotTarget === key) m *= 3;
    return Math.round(bet + (payout - bet) * m);
  },
  multLabel(key) {
    if (this.event && this.event.type === 'happy') return 'x2 HAPPY HOUR';
    if (this.event && this.event.type === 'hot' && key && this.hotTarget === key) return 'x3 HOT MACHINE';
    return null;
  },
  // record a finished round
  settle(game, bet, payout) {
    const st = this.stats;
    st.rounds++; st.wagered += bet; st.won += payout;
    st.games[game] = (st.games[game] || 0) + 1;
    const net = payout - bet;
    if (net > st.bigWin) { st.bigWin = net; st.bigWinGame = game; }
    const before = this.money - net;
    if (net < 0 && before > 0 && -net >= before * 0.25 && before > gems(2)) {
      this.addBuff('BAD BEAT', 0.1, 45);
      Toasts.push('BAD BEAT BONUS', '+10 LUCK FOR 45 SECONDS', C.lime);
    }
    this.checkRank();
  },

  // ------------------------------------------------------------- luck
  charmLuck() { let l = 0; for (const k in CHARMS) if (this.owned[k]) l += CHARMS[k].luck; return l; },
  buffLuck() { let l = 0; for (const b of this.buffs) l += b.amt; if (this.event && this.event.type === 'lucky') l += 0.25; return Math.min(0.5, l); },
  addBuff(name, amt, dur) {
    const b = this.buffs.find(x => x.name === name);
    if (b) { b.t = Math.max(b.t, dur); b.amt = Math.max(b.amt, amt); } else this.buffs.push({ name, amt, t: dur, dur });
  },

  // ------------------------------------------------------------ ranks
  rankIdx(m = this.money) { let r = 0; RANKS.forEach((rk, i) => { if (m >= rk[0]) r = i; }); return r; },
  rank() { return this.flags.owner ? 'CASINO OWNER' : RANKS[this.rankIdx()][1]; },
  checkRank() {
    const r = this.rankIdx();
    if (r > (this.stats.bestRank || 0)) {
      this.stats.bestRank = r;
      if (r >= 2) { Toasts.push('RANK UP: ' + RANKS[r][1], 'YOU ARE MOVING UP IN THE WORLD', C.yellow, 3); Snd.play('rankup'); }
      if (r >= 7 && !this.flags.millionaire) this.flags.millionaire = 'pending';
      if (r >= 10 && !this.flags.billionaire) this.flags.billionaire = 'pending';
    }
  },

  // ------------------------------------------------------------ look
  look() {
    const o = OUTFITS[this.outfit] || OUTFITS.tee;
    const lk = Object.assign({ style: this.wear.slick ? 'slick' : 'short', hair: C.brown, hairS: C.woodD }, o.look);
    lk.extras = { shades: !!this.wear.shades, chain: !!this.wear.chain };
    if (this.wear.hat) {
      lk.extras.hat = this.wear.hat;
      if (this.wear.hat === 'fedora') { lk.extras.hatC = C.charcoal; lk.extras.hatS = C.ink; lk.extras.hatA = C.red; }
      if (this.wear.hat === 'tophat') { lk.extras.hatC = C.ink; lk.extras.hatS = C.black; lk.extras.hatA = C.crimson; }
    }
    return lk;
  },
  netWorth() {
    let n = this.money;
    for (const cat of [OUTFITS, EXTRAS, CHARMS, LUXURY]) for (const k in cat) if (this.owned[k]) n += cat[k].price;
    return n;
  },

  // ------------------------------------------------------------ events
  tickEvents(dt) {
    if (this.event) {
      this.event.t -= dt;
      if (this.event.t <= 0) { this.event = null; this.hotTarget = null; this.eventNext = U.range(110, 170); }
      return;
    }
    this.eventNext -= dt;
    if (this.eventNext <= 0 && this.stats.time > 45) {
      this.startEvent(this.stats.events ? U.pick(['happy', 'lucky', 'rain', 'hot']) : 'happy');
      this.stats.events = (this.stats.events || 0) + 1;
    }
  },
  startEvent(type) {
    const e = EVENTS[type];
    this.event = { type, t: e.dur, dur: e.dur };
    if (type === 'hot' && typeof World !== 'undefined') this.hotTarget = World.pickHotTarget();
    Toasts.push(e.name, e.sub, e.c, 3.5);
    Snd.play('ding');
  },
};

  // used by the HOT MACHINE event: pick a playable object the player can reach
  pickHotTarget() {

    const o = U.pick(ok);
    return o ? o.id : null;
  },
  canUseZone(o) {
    const z = this.tile(o.x, o.y + o.h);
    if (z === 'G') return !!State.flags.highOpen;
    if (z === 'D' || z === 'O') return !!State.flags.diamondOpen;
    return true;
  },
  objById(id) { return this.objs.find(o => o.id === id); },

  // ---------------------------------------------------------------
  //  static layer: floors & walls pre-rendered once
  // ---------------------------------------------------------------
  renderLayer() {
    const cv = Gfx.canvas(this.MW * TILE, this.MH * TILE);
    Gfx.into(cv, () => {
      for (let y = 0; y < this.MH; y++) {
        for (let x = 0; x < this.MW; x++) {
          const t = this.map[y][x];
          ctx.save(); ctx.translate(x * TILE, y * TILE);
          if (t === ' ') R(0, 0, 16, 16, C.black);
          else if (t === '#') this.drawWall(x, y);
          else this.drawFloor(t, x, y);
          ctx.restore();
        }
      }
    });
    this.layer = cv;
  },

  floorTile(t, v) {
    const key = t + v;
    if (this.tileCv[key]) return this.tileCv[key];
    const c = Gfx.canvas(16, 16);
    Gfx.into(c, () => FLOORS[t](v));
    return (this.tileCv[key] = c);
  },

  drawFloor(t, x, y) {
    const v = t === 'L' ? (x + y) % 2 : ((x * 7 + y * 13) % 4);
    spr(this.floorTile(t, v), 0, 0);
    // borders for runner / rugs
    if (t === 'C' || t === 'O') {
      const edge = t === 'C' ? C.gold : C.gold, inner = t === 'C' ? C.bronze : C.bronze;
      const same = (dx, dy) => this.tile(x + dx, y + dy) === t;
      if (!same(-1, 0)) { R(0, 0, 2, 16, edge); R(2, 0, 1, 16, inner); }
      if (!same(1, 0)) { R(14, 0, 2, 16, edge); R(13, 0, 1, 16, inner); }
      if (!same(0, -1) && !this.isWall(x, y - 1)) { R(0, 0, 16, 2, edge); R(0, 2, 16, 1, inner); }
      if (!same(0, 1) && !this.isWall(x, y + 1)) { R(0, 14, 16, 2, edge); R(0, 13, 16, 1, inner); }
    }
    // soft shadow under walls
    if (this.isWall(x, y - 1)) { alpha(0.35); R(0, 0, 16, 3, C.black); alpha(0.18); R(0, 3, 16, 2, C.black); alpha(1); }
    if (this.isWall(x - 1, y)) { alpha(0.2); R(0, 0, 2, 16, C.black); alpha(1); }
  },

  drawWall(x, y) {
    const below = this.tile(x, y + 1);
    if (below !== '#' && below !== ' ') {
      const z = ZONES[below] ? ZONES[below].wall : 'main';
      WALLS[z](x, y);
      return;
    }
    // wall top
    R(0, 0, 16, 16, C.night);
    if ((x + y) % 2 === 0) P(5, 6, C.plum);
    const fl = (dx, dy) => { const t = this.tile(x + dx, y + dy); return t !== '#' && t !== ' '; };
    if (fl(-1, 0)) R(0, 0, 1, 16, C.grape);
    if (fl(1, 0)) R(15, 0, 1, 16, C.grape);
    if (fl(0, -1)) { R(0, 0, 16, 2, C.grape); R(0, 2, 16, 1, C.plum); }
  },
};

  M: v => {

    R(2, 7, 1, 2, C.teal); R(13, 7, 1, 2, C.teal);

    if (v === 1) { P(4, 1, C.gold); P(11, 14, C.gold); }

  Y: v => {

      () => { P(6, 12, C.lilac); P(7, 13, C.lilac); P(8, 12, C.lilac); P(9, 13, C.lilac); },

  R: v => {
    R(0, 0, 16, 16, C.forest);
    for (let i = 0; i < 16; i += 4) { R(i, 0, 1, 16, '#10573a'); }
    if (v % 2 === 0) { P(7, 6, C.gold); P(8, 6, C.gold); P(6, 7, C.gold); P(9, 7, C.gold); P(6, 8, C.gold); P(9, 8, C.gold); }

  G: v => {

  D: v => {

    // art-deco fan
    for (let r = 2; r <= 6; r += 2) for (let a = 0; a <= 8; a++) { const t = Math.PI + (a / 8) * Math.PI; P(8 + Math.round(Math.cos(t) * r), 9 + Math.round(Math.sin(t) * r), r === 6 ? C.gold : C.bronze); }
    R(7, 9, 3, 1, C.gold);
    if (v === 2) { P(2, 13, C.cyan); P(13, 13, C.cyan); }
  },
  O: v => {
    R(0, 0, 16, 16, C.wine);

  L: v => {

  C: v => {

// ---- js/scenes/title.js
'use strict';
// =====================================================================
//  CASHINO - title screen: a slot machine hitting JACKPOOOOT on loop,
//  and the intro that follows NEW GAME.
// =====================================================================

class TitleScene extends Scene {
  constructor() {
    super();
    this.cycle = 0;           // time inside the spin/celebrate loop
    this.phase = 'party';     // 'spin' | 'party'
    this.stopped = [true, true, true];
    this.reelPos = [0, 0, 0];
    this.lever = 0;
    this.partyT = 2.5;        // start mid-celebration so the first frame is complete
    this.textIn = 1;
    this.menuOpen = false;
    this.ui = new Group();
    this.bokeh = Array.from({ length: 18 }, () => ({ x: U.range(0, W), y: U.range(0, H), r: U.int(2, 6), c: U.pick([C.pink, C.lilac, C.yellow, C.cyan, C.tang]), s: U.range(3, 10), ph: U.range(0, TAU) }));
    this.stars = Array.from({ length: 40 }, () => ({ x: U.int(0, W), y: U.int(0, 110), ph: U.range(0, TAU), sp: U.range(1, 4) }));
    this.win = 1000000; this.winShown = 1000000;
    this.strip = ['cherry', 'bell', 'seven', 'lemon', 'bar', 'star', 'seven', 'grape', 'diamond', 'orange', 'bar3', 'seven', 'clover', 'crown'];
    for (let i = 0; i < 40; i++) this.fx.gems(160, 140, 1, { spread: 1.1, min: 80, max: 190 });
  }

  enter() {
    Music.play('title');
    Wallet.snap();
  }
  resume() { Music.play('title'); }

  buildMenu() {
    this.ui.clear();
    const hasSave = State.hasSave();
    const y = 163, h = 13;
    const items = [
      { label: 'NEW GAME', w: 72, fn: () => this.newGame() },
      { label: 'CONTINUE', w: 72, fn: () => this.cont(), enabled: hasSave },
      { label: 'HOW TO PLAY', w: 86, fn: () => this.help() },
      { label: Snd.musOn ? 'SOUND ON' : 'SOUND OFF', w: 70, fn: b => { const on = !(Snd.musOn || Snd.sfxOn); Snd.setMusic(on); Snd.setSfx(on); Settings.save(); b.label = on ? 'SOUND ON' : 'SOUND OFF'; if (on) Music.play('title', true); } },
    ];
    const total = items.reduce((s, it) => s + it.w, 0) + (items.length - 1) * 4;
    let x = Math.round(W / 2 - total / 2);
    for (const it of items) {
      this.ui.add({ x, y, w: it.w, h, label: it.label, enabled: it.enabled !== false, onPress: it.fn, style: it.label === 'NEW GAME' ? 'red' : 'std' });
      x += it.w + 4;
    }
    this.ui.focus = hasSave ? this.ui.items[1] : this.ui.items[0];
  }

  newGame() {
    const go = () => Game.go(() => { State.newGame(); Game.set(new IntroScene()); });
    if (State.hasSave()) ask('START A NEW GAME? YOUR CURRENT SAVE (' + U.money(State.saved.money) + ') WILL BE LOST.', [{ label: 'START OVER', fn: go }, { label: 'CANCEL' }], { who: 'CASHINO' });
    else go();
  }
  cont() { Game.go(() => { State.continueGame(); Game.set(new Overworld()); }); }
  help() {
    say([
      { who: 'HOW TO PLAY', text: 'MOVE WITH ARROWS OR WASD. HOLD SHIFT TO RUN. OR JUST CLICK / TAP WHERE YOU WANT TO GO.' },
      { who: 'HOW TO PLAY', text: 'WALK UP TO A MACHINE OR TABLE AND PRESS Z, SPACE OR ENTER TO PLAY. X OR BACKSPACE GOES BACK.' },
      { who: 'HOW TO PLAY', text: 'ESC OPENS THE MENU. M MUTES THE MUSIC. YOUR PROGRESS SAVES AUTOMATICALLY.' },
      { who: 'HOW TO PLAY', text: 'YOU START WITH 5 GEMS. WIN BIG, UNLOCK THE HIGH LIMIT ROOMS, BUY FANCY STUFF... AND ONE DAY, BUY THE CASINO ITSELF.' },
    ]);
  }

  spinAgain() {
    this.phase = 'spin'; this.cycle = 0; this.stopped = [false, false, false]; this.lever = 1;
    Snd.play('lever');
    this.winShown = 0;
  }

  land(i) {
    this.stopped[i] = true;
    this.reelPos[i] = 0;
    Snd.play('reelStop');
    Gfx.shake(1, 0.1);
    if (i === 2) this.jackpot();
  }

  jackpot() {
    this.phase = 'party'; this.partyT = 0; this.textIn = 0;
    Gfx.flash(C.white, 0.25); Gfx.shake(4, 0.6);
    Snd.play('jackpot');
    this.fx.gems(160, 138, 60, { spread: 1.2, min: 90, max: 230 });
    this.fx.confetti(160, 70, 80, { power: 220 });
    this.winShown = 0;
  }

  update(dt) {
    super.update(dt);
    this.cycle += dt;
    this.lever = Math.max(0, this.lever - dt * 3);
    if (this.phase === 'spin') {
      for (let i = 0; i < 3; i++) if (!this.stopped[i]) this.reelPos[i] += dt * 22;
      const stops = [1.0, 1.5, 2.1];
      for (let i = 0; i < 3; i++) if (!this.stopped[i] && this.cycle > stops[i]) this.land(i);
      if (this.cycle % 0.06 < dt) Snd.play('reel');
    } else {
      this.partyT += dt;
      this.textIn = Math.min(1, this.textIn + dt * 2.5);
      if (this.partyT < 5 && Math.random() < 0.5) this.fx.gems(160, 138, 1, { spread: 0.9, min: 70, max: 180 });
      if (Math.random() < 0.25) this.fx.rain(1);
      if (this.partyT > 9) this.spinAgain();
      this.winShown = Math.min(this.win, this.winShown + dt * this.win * 0.8);
    }
    if (Math.random() < 0.3) this.fx.sparkle(U.range(10, 310), U.range(10, 170), U.pick([C.white, C.lemon, C.aqua]));

    if (!this.menuOpen) {
      if (Input.pressed('a') || Input.pressed('b') || Input.mouse.pressed || Input.typed.length) {
        Input.eatAll();
        this.menuOpen = true;
        this.buildMenu();
        Snd.play('select');
        Music.play('title');
      }
    } else {
      this.ui.update(dt);
    }
  }

  draw() {
    const t = this.t;
    // background: rotating sunburst + bands
    const party = this.phase === 'party' ? Math.max(0, 1 - this.partyT / 4) : 0;
    Burst.draw(160, 96, 18, t * 0.25, party > 0.5 ? C.violet : C.plum, party > 0.5 ? C.grape : C.night);
    alpha(0.55); vgrad(0, 0, W, H, ['#12091f', '#1a0e2e', '#24123f', '#321650', '#43185c']); alpha(1);
    for (const s of this.stars) { const b = Math.sin(t * s.sp + s.ph); if (b > 0.3) P(s.x, s.y, b > 0.85 ? C.white : C.lav); }
    for (const b of this.bokeh) {
      const y = (b.y - t * b.s + 400) % (H + 20) - 10;
      alpha(0.12 + 0.06 * Math.sin(t + b.ph)); circ(b.x + Math.sin(t * 0.5 + b.ph) * 6, y, b.r, b.c); alpha(1);
    }
    // floor glow
    alpha(0.35); ell(160, 162, 120, 14, C.magenta); alpha(1);

    this.drawTreasure(t);
    this.drawMachine(100, 46, t);

    // JACKPOOOOT!
    const k = Ease.outBack(this.textIn);
    drawJackpotText(W / 2, 4 + Math.sin(t * 3) * 1.5, 3 + (1 - k) * 3, t, k);

    this.fx.draw();

    // bottom
    if (!this.menuOpen) {
      if (Math.floor(t * 2) % 2 === 0) Font.draw('PRESS START', W / 2, 163, { c: C.white, a: 'c', ol: C.ink });
      Font.draw('Z / SPACE / CLICK', W / 2, 173, { c: C.lav, a: 'c', f: 's' });
    } else {
      this.ui.draw();
    }
  }

  drawTreasure(t) {
    // gem piles and loot on both sides of the machine
    const pile = (cx, by, rows) => {
      for (let r = 0; r < rows; r++) {
        const n = rows - r;
        for (let i = 0; i < n; i++) {
          const k = i * 3 + r * 5 + cx, f = (k * 7 + Math.floor(t * 8)) % 30; // a glint now and then
          spr(Spr.gemSets[k % Spr.gemSets.length][f < 6 ? f : 5], cx - n * 3 + i * 6 - 1, by - r * 4 - 1);
        }
      }
    };
    // gold bars
    const bar = (x, y) => { R(x + 1, y, 12, 1, C.lemon); R(x, y + 1, 14, 4, C.gold); R(x, y + 5, 14, 1, C.bronze); R(x + 2, y + 2, 4, 1, C.lemon); };
    for (const [x, y] of [[20, 150], [34, 150], [48, 150], [27, 144], [41, 144], [34, 138]]) bar(x, y);
    pile(78, 152, 5);
    spr(Spr.sym.bag, 56, 126);
    spr(Spr.sym.diamond, 12, 128);
    pile(244, 152, 5);
    for (const [x, y] of [[262, 150], [276, 150], [290, 150], [269, 144], [283, 144]]) bar(x, y);
    spr(Spr.sym.crown, 284, 122);
    spr(Spr.sym.bag, 244, 110);
    // glints
    const g = Math.floor(t * 2) % 6;
    if (g < 3) { const [gx, gy] = [[40, 139], [274, 145], [58, 128]][g]; R(gx - 2, gy, 5, 1, C.white); R(gx, gy - 2, 1, 5, C.white); }
  }

  drawMachine(x, y, t) {
    const w = 120;
    const party = this.phase === 'party';
    // beacon
    const bc = party ? (Math.floor(t * 8) % 2 ? C.red : C.yellow) : C.crimson;
    if (party) glow(x + w / 2, y - 2, 14, bc, 0.5);
    R(x + w / 2 - 6, y - 7, 12, 7, bc); R(x + w / 2 - 7, y - 1, 14, 2, C.silver); R(x + w / 2 - 4, y - 6, 3, 2, C.white);
    // marquee arch
    const my = y + 1;
    for (let j = 0; j < 22; j++) {
      const half = Math.round(58 * Math.sqrt(1 - Math.pow(Math.max(0, 14 - j) / 14, 2)));
      R(x + w / 2 - half, my + j, half * 2, 1, j < 2 ? C.gold : C.night);
    }
    R(x + 2, my + 21, w - 4, 2, C.gold);
    // bulbs around the arch
    for (let i = 0; i < 26; i++) {
      const a = Math.PI + (i / 25) * Math.PI;
      const bx = x + w / 2 + Math.cos(a) * 55, by = my + 16 + Math.sin(a) * 14.5;
      const on = party ? Math.floor(t * 10 + i) % 2 === 0 : Math.floor(t * 6 - i) % 5 === 0;
      R(bx - 1, by - 1, 2, 2, on ? C.lemon : C.bronze);
      if (on) P(bx - 1, by - 1, C.white);
    }
    Font.draw('CASHINO', x + w / 2, my + 7, { c: C.yellow, a: 'c', s: 2, ol: C.ink, ex: C.bronze, exn: 1, hi: C.lemon });
    // glint across the logo
    const gx = x + 12 + ((t * 60) % 180);
    if (gx < x + w - 12) { alpha(0.8); R(gx, my + 7, 2, 14, C.white); R(gx + 3, my + 7, 1, 14, C.white); alpha(1); }

    // body
    const by = my + 23, bh = 84;
    R(x + 4, by, w - 8, bh, C.crimson);
    R(x + 4, by, 4, bh, C.wine); R(x + w - 8, by, 4, bh, C.wine);
    R(x + 8, by, w - 16, 1, C.red);
    R(x + 2, by, 2, bh, C.gold); R(x + w - 4, by, 2, bh, C.gold);
    // reel window
    const rx = x + 16, ry = by + 5, rw = w - 32, rh = 42;
    box(rx - 3, ry - 3, rw + 6, rh + 6, C.ink, C.gold);
    for (let i = 0; i < 3; i++) this.drawReel(i, rx + i * 30, ry, 28, rh);
    // payline
    const ly = ry + rh / 2;
    R(rx - 2, ly, rw + 4, 1, party && Math.floor(t * 8) % 2 ? C.yellow : C.red);
    Font.draw('▶', rx - 7, ly - 3, { c: C.red, f: 's' });
    Font.draw('◀', rx + rw + 4, ly - 3, { c: C.red, f: 's' });
    // LED display
    const dy = ry + rh + 5;
    box(rx - 3, dy, rw + 6, 12, C.black, C.bronze);
    const led = party ? (Math.floor(t * 3) % 2 ? 'JACKPOT!!!' : 'WIN ' + U.moneyShort(Math.floor(this.winShown) * 100)) : 'GOOD LUCK!';
    Font.draw(led, x + w / 2, dy + 3, { c: party ? C.yellow : C.cherry, a: 'c', f: 's' });
    // buttons
    const btnY = dy + 15;
    [C.red, C.yellow, C.lime, C.sky, C.pink].forEach((c, i) => { R(x + 22 + i * 16, btnY, 10, 5, C.ink); R(x + 22 + i * 16, btnY, 10, 4, c); R(x + 23 + i * 16, btnY, 4, 1, C.white); });
    // gem tray
    const ty = by + bh - 12;
    R(x + 18, ty, w - 36, 10, C.ink); R(x + 18, ty, w - 36, 1, C.charcoal);
    R(x + 14, ty + 9, w - 28, 3, C.silver); R(x + 14, ty + 11, w - 28, 1, C.gray);
    for (let i = 0; i < 12; i++) spr(Spr.gemSets[(i * 3) % Spr.gemSets.length][(i * 3 + Math.floor(t * 4)) % 6 === 0 ? 2 : 5], x + 21 + i * 6.5, ty + 2 + (i % 2) * 2);
    // base
    R(x, by + bh, w, 6, C.charcoal); R(x, by + bh, w, 1, C.gray);
    // lever
    const lk = this.lever;
    const lx = x + w + 2, top = y + 44 + lk * 24;
    R(lx, y + 62, 6, 16, C.charcoal); R(lx + 1, y + 63, 4, 14, C.gray);
    R(lx + 2, top + 4, 2, (y + 70) - top - 4, C.silver);
    ball(lx + 3, top + 2, 4, C.red, C.crimson, C.salmon);
  }

  drawReel(i, x, y, w, h) {
    R(x, y, w, h, C.cream);
    const spinning = !this.stopped[i];
    const cell = 24;
    const pos = spinning ? this.reelPos[i] : 0;
    const base = Math.floor(pos), frac = pos - base;
    ctx.save();
    ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
    for (let k = -2; k <= 2; k++) {
      let name;
      if (!spinning) name = k === 0 ? 'seven' : this.strip[(k + 5 + i * 3) % this.strip.length];
      else name = this.strip[((base - k) % this.strip.length + this.strip.length) % this.strip.length];
      const sy = y + h / 2 - 11 + k * cell + (spinning ? frac * cell : 0);
      if (spinning) { alpha(0.5); spr(Spr.sym[name], x + 3, sy - 5); alpha(1); }
      spr(Spr.sym[name], x + 3, sy);
    }
    ctx.restore();
    // cylinder shading
    alpha(0.35); R(x, y, w, 7, C.ink); R(x, y + h - 7, w, 7, C.ink); alpha(0.2); R(x, y + 7, w, 5, C.ink); R(x, y + h - 12, w, 5, C.ink); alpha(1);
    R(x + w, y, 2, h, C.ink);
    if (this.phase === 'party' && Math.floor(this.t * 6) % 2 === 0) { box(x, y + h / 2 - 12, w, 24, null, C.yellow); }
  }
}

  update(dt) {
    super.update(dt);
    this.bt += dt;
    const line = this.beats[this.i];
    if (this.i < this.beats.length) {
      const before = Math.floor(this.chars);
      this.chars = Math.min(line.length, this.chars + dt * 26);
      if (Math.floor(this.chars) !== before && line[Math.floor(this.chars) - 1] !== ' ') Snd.play('talk', 0.9);
    }
    const adv = Input.pressed('a') || Input.pressed('b') || Input.mouse.pressed;
    if (adv) Input.eatAll();
    if (this.i >= this.beats.length) {
      if (adv || this.bt > 3.2) this.finish();
      return;
    }
    if (adv) {
      if (this.chars < line.length) this.chars = line.length;
      else this.next();
    } else if (this.chars >= line.length && this.bt > line.length / 26 + 1.8) this.next();
  }
  next() {
    this.i++; this.chars = 0; this.bt = 0;
    Snd.play('blip');
    if (this.i === this.beats.length) { Snd.play('jackpot'); Gfx.flash(C.yellow, 0.4); this.fx.gems(160, 120, 50, { min: 100, max: 220 }); this.fx.confetti(160, 80, 60); }
  }
  finish() {
    if (this.leaving) return;
    this.leaving = true;
    State.flags.intro = true;
    Game.go(() => Game.set(new Overworld(true)));
  }
  draw() {
    R(0, 0, W, H, C.black);
    const t = this.t;
    if (this.i >= 1) { alpha(0.25); circ(160, 78, 34 + Math.sin(t * 2) * 2, C.grape); alpha(1); }
    // the player, big
    const s = Spr.char(this.look);
    const fr = s.d[0];
    if (this.i < this.beats.length) {
      sprS(fr, 160 - 24, 30, 3);
      if (this.i >= 2) {
        const bob = Math.sin(t * 5) * 2;
        spr(Spr.bigGem, 184, 62 + bob);
        Font.draw('5', 202, 66 + bob, { c: C.yellow, ol: C.ink });
      }
      const line = this.beats[this.i];
      Font.draw(line.slice(0, Math.floor(this.chars)), W / 2, 140, { c: this.i === 3 ? C.yellow : C.white, a: 'c', sh: C.plum });
    } else {
      Burst.draw(160, 90, 16, t * 0.4, C.crimson, C.wine);
      alpha(0.4); R(0, 0, W, H, C.black); alpha(1);
      Font.draw('WELCOME TO', W / 2, 44, { c: C.white, a: 'c', ol: C.ink });
      const k = Ease.outBack(Math.min(1, this.bt * 2));
      const cv = this.logo || (this.logo = Font.bake('CASHINO', { c: C.yellow, ol: C.ink, ex: C.bronze, exn: 2, hi: C.lemon }));
      const sc = 4 * k;
      if (sc > 0.1) ctx.drawImage(cv, Math.round(W / 2 - cv.width * sc / 2), Math.round(92 - cv.height * sc / 2), Math.round(cv.width * sc), Math.round(cv.height * sc));
    }
    this.fx.draw();
    if (Math.floor(t * 2) % 2 === 0) Font.draw('Z / CLICK', W - 4, H - 8, { c: C.slate, a: 'r', f: 's' });
  }
}

// Giant rainbow "JACKPOOOOT!" - each letter baked once per color and waved.
const JackpotText = { cache: new Map() };
function drawJackpotText(cx, y, s, t, k = 1, txt = 'JACKPOOOOT!') {
  const ph = Math.floor(t * 10);
  let total = 0;
  const ws = [...txt].map(ch => Font.width(ch));
  total = ws.reduce((a, b) => a + b, 0) + (txt.length - 1);
  let x = cx - (total * s) / 2;
  for (let i = 0; i < txt.length; i++) {
    const ch = txt[i], col = RAINBOW[(i + ph) % RAINBOW.length];
    const key = ch + col;
    let cv = JackpotText.cache.get(key);
    if (!cv) { cv = Font.bake(ch, { c: col, ol: C.ink, ex: C.wine, exn: 2, hi: C.white }); JackpotText.cache.set(key, cv); }
    const wy = Math.sin(t * 6 + i * 0.7) * 3 * k;
    const pad = 5;
    ctx.drawImage(cv, Math.round(x - pad * s), Math.round(y + wy - pad * s), Math.round(cv.width * s), Math.round(cv.height * s));
    x += (ws[i] + 1) * s;
  }
}

// ---------------------------------------------------------------------
class Actor {
  constructor(x, y, look) { this.x = x; this.y = y; this.dir = 'd'; this.animT = 0; this.moving = false; this.setLook(look); }
  setLook(look) { this.look = look; this.spr = Spr.char(look); }
  frame() { return this.spr[this.dir][this.moving ? 1 + (Math.floor(this.animT * 7) % 2) : 0]; }
  draw(cx, cy) {
    alpha(0.3); ell(this.x - cx, this.y - cy, 5, 2, C.black); alpha(1);
    spr(this.frame(), this.x - 8 - cx, this.y - 31 - cy);
  }
}

class NPC extends Actor {
  constructor(d) {
    const look = LOOKS[d.look] || LOOKS.guy;
    super(d.x * TILE + 8, d.y * TILE + 11, look);
    Object.assign(this, d);
    this.x = d.x * TILE + 8; this.y = d.y * TILE + 11;
    this.dir = d.dir || 'd';
    this.wait = U.range(0.5, 4);
    this.path = null; this.stuck = 0;
    this.chatT = U.range(4, 20);
    this.bubble = null;
    this.home = { x: d.x, y: d.y };
    this.hidden = false;
  }
  get tx() { return Math.floor(this.x / TILE); }
  get ty() { return Math.floor((this.y - 2) / TILE); }
}

// ---------------------------------------------------------------------
function bfs(sx, sy, isGoal, pass, max = 6000) {
  const MW = World.MW, MH = World.MH;
  const prev = new Int32Array(MW * MH).fill(-2);
  const start = sy * MW + sx;
  prev[start] = -1;
  const q = [start];
  for (let qi = 0; qi < q.length && qi < max; qi++) {
    const cur = q[qi], cx = cur % MW, cy = (cur / MW) | 0;
    if (isGoal(cx, cy)) {
      const path = [];
      for (let c = cur; c !== -1; c = prev[c]) path.push([c % MW, (c / MW) | 0]);
      return path.reverse();
    }
    for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const nx = cx + dx, ny = cy + dy;
      if (nx < 0 || ny < 0 || nx >= MW || ny >= MH) continue;
      const n = ny * MW + nx;
      if (prev[n] !== -2 || !pass(nx, ny)) continue;
      prev[n] = cur;
      q.push(n);
    }
  }
  return null;
}

class Overworld extends Scene {
  constructor(fresh) {
    super();
    World.build();
    this.applyGates();
    const p = State.pos;
    const sx = p ? p.x : 24.5 * TILE + 0, sy = p ? p.y : 51 * TILE + 11;
    this.player = new Actor(sx, sy, State.look());
    this.player.dir = p ? p.dir : 'u';
    this.npcs = World.npcDefs.map(d => new NPC(d));
    this.staticNpc = new Set(this.npcs.filter(n => n.kind !== 'wander').map(n => n.ty * World.MW + n.tx));
    for (const n of this.npcs) if (n.kind === 'sit') { const o = World.objs.find(ob => ob.x === n.tx && ob.y + ob.h === n.ty); if (o) n.machine = o; }
    for (const n of this.npcs) if (n.role === 'bouncer') this.placeBouncer(n);
    // never spawn a wanderer on top of the player (e.g. after loading a save)
    for (const n of this.npcs) {
      if (n.kind !== 'wander' || Math.abs(n.x - this.player.x) > 20 || Math.abs(n.y - this.player.y) > 20) continue;
      for (const [dx, dy] of [[3, 0], [-3, 0], [0, 3], [0, -3], [4, 2], [-4, -2]]) {
        const tx = n.tx + dx, ty = n.ty + dy;
        if (!World.blocked(tx, ty) && World.tile(tx, ty) === n.zone) { n.x = tx * TILE + 8; n.y = ty * TILE + 11; break; }
      }
    }
    this.cam = { x: 0, y: 0 };
    this.snapCam();
    this.gems = [];
    this.gemT = 20;
    this.path = null; this.goal = null;
    this.zone = null; this.banner = null;
    this.focus = null;
    this.fresh = fresh;
    this.stepT = 0;
    this.hotFx = 0;
    this.menuBtn = { x: W - 30, y: 14, w: 27, h: 11 };
  }

  enter() {
    State.inGame = true;
    Wallet.snap();
    this.updateZone(true);
    if (this.fresh) {
      this.fresh = false;
      this.tl.after(0.6, () => say([{ who: 'TONY', text: 'HEY, WELCOME TO CASHINO! FIRST TIME? START SMALL: THE PENNY ARCADE IS JUST TO THE WEST.' }, { who: 'TONY', text: 'WALK UP TO ANY MACHINE AND PRESS Z (OR TAP IT) TO PLAY. ESC OPENS YOUR MENU. GOOD LUCK, PAL!' }], { voice: 0.8 }));
    }
  }
  resume() {
    State.inGame = true;
    this.player.setLook(State.look());
    this.updateZone(true);
    State.save();
    this.checkMilestones();
  }
  exit() { super.exit(); this.savePos(); }
  savePos() { State.pos = { x: Math.round(this.player.x), y: Math.round(this.player.y), dir: this.player.dir }; }

  // ------------------------------------------------------------- gates
  applyGates() {
    for (const o of World.objs) {
      if (o.t === 'rope') {
        const open = o.gate === 'high' ? State.flags.highOpen : State.flags.diamondOpen;
        o.hidden = !!open;
        World.solid[o.y][o.x] = !open;
      }
    }
  }
  placeBouncer(n) {
    const open = n.gate === 'high' ? State.flags.highOpen : State.flags.diamondOpen;
    n.dir = open ? 'l' : 'd';
  }
  talkBouncer(n) {
    const high = n.gate === 'high';
    const need = high ? gems(10000) : gems(1000000);
    const flag = high ? 'highOpen' : 'diamondOpen';
    const room = high ? 'THE HIGH LIMIT LOUNGE' : 'THE DIAMOND CLUB';
    if (State.flags[flag]) { say([{ who: n.name, text: high ? 'GO ON IN, HIGH ROLLER.' : 'WELCOME BACK TO THE TOP, BOSS.' }]); return; }
    if (State.money >= need) {
      say([{ who: n.name, text: high ? 'WELL, WELL. LOOK WHO GOT RICH. GO ON IN, HIGH ROLLER.' : 'A MILLIONAIRE, HUH? THE DIAMOND CLUB IS ALL YOURS. MIND THE CAT.' }], {
        done: () => {
          State.flags[flag] = true;
          this.applyGates();
          this.placeBouncer(n);
          Snd.play('unlock');
          Toasts.push(room + ' UNLOCKED', high ? 'BETS UP TO ' + U.money(gems(100000)) : 'NO LIMITS. NONE.', C.yellow, 3);
          this.fx.confetti(n.x - this.cam.x, n.y - 20 - this.cam.y, 40);
          State.save();
        },
      });
    } else {
      say([{ who: n.name, text: high ? 'HIGH ROLLERS ONLY, PAL. COME BACK WHEN YOU HAVE 10,000 GEMS.' : 'DIAMOND CLUB. MILLIONAIRES ONLY. COME BACK WITH 1,000,000 GEMS.' }, { who: n.name, text: 'YOU HAVE ' + U.money(State.money) + '. NOT EVEN CLOSE. ...OKAY, MAYBE A LITTLE CLOSE.' }]);
    }
  }

  // ------------------------------------------------------------- camera
  snapCam() {
    const mw = World.MW * TILE, mh = World.MH * TILE;
    this.cam.x = U.clamp(this.player.x - W / 2, 0, mw - W);
    this.cam.y = U.clamp(this.player.y - 12 - H / 2, 0, mh - H);
  }

  // ------------------------------------------------------------- collision
  blockedAt(x, y, self) {
    const x0 = Math.floor((x - 5) / TILE), x1 = Math.floor((x + 4.99) / TILE);
    const y0 = Math.floor((y - 4) / TILE), y1 = Math.floor((y + 0.99) / TILE);
    for (let ty = y0; ty <= y1; ty++) for (let tx = x0; tx <= x1; tx++) if (World.blocked(tx, ty)) return true;
    // actors block each other, but two that already overlap may always move apart
    const hits = (a) => Math.abs(a.x - x) < 10 && Math.abs(a.y - y) < 6;
    const overlapNow = (a) => self && Math.abs(a.x - self.x) < 10 && Math.abs(a.y - self.y) < 6;
    for (const n of this.npcs) if (n !== self && !n.hidden && hits(n) && !overlapNow(n)) return true;
    if (self !== this.player && hits(this.player) && !overlapNow(this.player)) return true;
    return false;
  }

  moveActor(a, dx, dy, dist) {
    let moved = false;
    if (dx) {
      const nx = a.x + dx * dist;
      if (!this.blockedAt(nx, a.y, a)) { a.x = nx; moved = true; }
      else if (!dy) { // corner assist
        for (const off of [2, -2, 4, -4, 6, -6]) if (!this.blockedAt(nx, a.y + off, a) && !this.blockedAt(a.x, a.y + Math.sign(off), a)) { a.y += Math.sign(off) * Math.min(Math.abs(off), dist); moved = true; break; }
      }
    }
    if (dy) {
      const ny = a.y + dy * dist;
      if (!this.blockedAt(a.x, ny, a)) { a.y = ny; moved = true; }
      else if (!dx) {
        for (const off of [2, -2, 4, -4, 6, -6]) if (!this.blockedAt(a.x + off, ny, a) && !this.blockedAt(a.x + Math.sign(off), a.y, a)) { a.x += Math.sign(off) * Math.min(Math.abs(off), dist); moved = true; break; }
      }
    }
    return moved;
  }

  // ------------------------------------------------------------- update
  update(dt) {
    super.update(dt);
    const p = this.player;

    if (Input.pressed('pause') || (Input.mouse.pressed && Input.inRect(this.menuBtn.x, this.menuBtn.y, this.menuBtn.w, this.menuBtn.h))) {
      Input.eatAll();
      this.openMenu();
      return;
    }
    if (Input.pressed('mute')) { const on = !Snd.musOn; Snd.setMusic(on); Settings.save(); Toasts.push(on ? 'MUSIC ON' : 'MUSIC OFF', null, C.lav, 1.2); if (on) this.updateZone(true); }

    // ---- movement
    const ax = Input.axis();
    const run = Input.isDown('run');
    const speed = run ? 108 : 66;
    p.moving = false;
    if (ax.x || ax.y) {
      this.path = null; this.goal = null;
      const n = ax.x && ax.y ? Math.SQRT1_2 : 1;
      if (ax.x && !ax.y) p.dir = ax.x > 0 ? 'r' : 'l';
      else if (ax.y && !ax.x) p.dir = ax.y > 0 ? 'd' : 'u';
      else if (!((p.dir === 'r' && ax.x > 0) || (p.dir === 'l' && ax.x < 0) || (p.dir === 'd' && ax.y > 0) || (p.dir === 'u' && ax.y < 0))) p.dir = ax.y > 0 ? 'd' : 'u';
      p.moving = this.moveActor(p, ax.x * n, ax.y * n, speed * dt) || true;
    } else if (this.path) {
      this.followPath(dt, run ? 108 : 80);
    }
    if (p.moving) { p.animT += dt; this.stepT -= dt; if (this.stepT <= 0) { Snd.play('step'); this.stepT = run ? 0.2 : 0.28; } } else p.animT = 0;

    // ---- pointer: tap to walk / interact
    if (Input.mouse.pressed && Input.mouse.over && Input.mouse.y > 12) this.tapAt(Input.mouse.x + this.cam.x, Input.mouse.y + this.cam.y);

    // ---- interaction
    this.focus = this.findFocus();
    if (Input.pressed('a') && this.focus) { Input.eat('a'); this.interact(this.focus); }

    // ---- world
    for (const n of this.npcs) this.updateNpc(n, dt);
    this.updateGems(dt);
    this.updateZone();
    this.checkBroke();
    if (State.event && State.event.type === 'hot') this.hotFx += dt;

    // camera (smooth)
    const mw = World.MW * TILE, mh = World.MH * TILE;
    const tx = U.clamp(p.x - W / 2, 0, mw - W), ty = U.clamp(p.y - 12 - H / 2, 0, mh - H);
    this.cam.x += (tx - this.cam.x) * Math.min(1, dt * 10);
    this.cam.y += (ty - this.cam.y) * Math.min(1, dt * 10);
    if (Math.abs(tx - this.cam.x) < 0.5) this.cam.x = tx;
    if (Math.abs(ty - this.cam.y) < 0.5) this.cam.y = ty;
    if (this.banner) { this.banner.t += dt; if (this.banner.t > 2.6) this.banner = null; }
  }

  followPath(dt, speed) {
    const p = this.player;
    if (!this.path.length) {
      this.path = null;
      const g = this.goal; this.goal = null;
      if (g) {
        p.dir = g.face || p.dir;
        const target = g.npc ? { npc: g.npc } : g.obj ? { obj: g.obj } : null;
        if (target) this.interact(target);
      }
      return;
    }
    const [tx, ty] = this.path[0];
    const wx = tx * TILE + 8, wy = ty * TILE + 11;
    const dx = wx - p.x, dy = wy - p.y, d = Math.hypot(dx, dy);
    if (d < 1.5) { p.x = wx; p.y = wy; this.path.shift(); this.stuck = 0; this.bestD = undefined; return; }
    const step = Math.min(d, speed * dt);
    p.dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'r' : 'l') : (dy > 0 ? 'd' : 'u');
    this.moveActor(p, dx / d, dy / d, step);
    p.moving = true;
    // stuck = no real progress toward the waypoint for a moment
    const nd = Math.hypot(wx - p.x, wy - p.y);
    if (this.bestD === undefined || nd < this.bestD - 0.5) { this.bestD = nd; this.stuck = 0; }
    else { this.stuck = (this.stuck || 0) + dt; if (this.stuck > 0.4) { this.stuck = 0; this.bestD = undefined; this.shoo(tx, ty); this.repath(); } }
  }

  // ask anyone standing on (or next to) this tile to move along
  shoo(tx, ty) {
    for (const n of this.npcs) if (n.kind === 'wander' && Math.abs(n.tx - tx) <= 1 && Math.abs(n.ty - ty) <= 1 && !(n.path && n.path.length)) n.wait = 0;
  }

  // BFS from the player to any goal tile. avoid = treat NPC-occupied tiles as walls.
  route(goal, avoid) {
    const p = this.player, MW = World.MW;
    const ptx = Math.floor(p.x / TILE), pty = Math.floor((p.y - 2) / TILE);
    const busy = new Set(this.staticNpc);
    if (avoid) for (const n of this.npcs) if (!n.hidden) busy.add(n.ty * MW + n.tx);
    busy.delete(pty * MW + ptx);
    const path = bfs(ptx, pty, (x, y) => goal.map.has(y * MW + x), (x, y) => !World.blocked(x, y) && !busy.has(y * MW + x));
    if (path) { const last = path[path.length - 1]; goal.face = goal.map.get(last[1] * MW + last[0]) || null; }
    return path;
  }

  // blocked on the way (usually by someone walking by): try another route
  repath() {
    const g = this.goal;
    this.repaths = (this.repaths || 0) + 1;
    if (!g || this.repaths > 6) { this.path = null; this.goal = null; return; }
    const path = this.route(g, true) || this.route(g, false);
    if (path) this.path = path.slice(1); else { this.path = null; this.goal = null; }
  }

  tapAt(wx, wy) {
    const tx = Math.floor(wx / TILE), ty = Math.floor(wy / TILE), MW = World.MW;
    let npc = this.npcs.find(n => !n.hidden && Math.abs(n.x - wx) < 8 && wy > n.y - 26 && wy < n.y + 3);
    if (npc && npc.role === 'dealer') npc = null;
    let obj = null;
    if (!npc) obj = World.objs.find(o => !o.hidden && this.objUsable(o) && this.objHit(o, wx, wy));
    let tiles = null;
    if (npc) tiles = [[npc.tx, npc.ty + 1, 'u'], [npc.tx, npc.ty - 1, 'd'], [npc.tx - 1, npc.ty, 'r'], [npc.tx + 1, npc.ty, 'l']];
    else if (obj) tiles = this.useTiles(obj);
    else if (!World.blocked(tx, ty)) tiles = [[tx, ty, null]];
    if (!tiles) return;
    const goal = { map: new Map(tiles.map(([x, y, f]) => [y * MW + x, f])), npc, obj, face: null };
    this.repaths = 0;
    const path = this.route(goal, false) || this.route(goal, true);
    if (!path) { if (npc || obj) Snd.play('error'); return; }
    this.path = path.slice(1);
    this.goal = goal;
    if (!this.path.length) this.followPath(0, 0);
  }

  objHit(o, wx, wy) {
    const d = OBJ[o.t];
    const x0 = o.x * TILE, y0 = o.y * TILE + (d.oy < 0 ? d.oy : 0);
    return wx >= x0 && wx < x0 + o.w * TILE && wy >= y0 && wy < (o.y + o.h) * TILE;
  }
  objUsable(o) { const d = OBJ[o.t]; return !!(d.game || d.use || o.vendor || o.gate); }
  useTiles(o) {
    const d = OBJ[o.t], out = [];
    for (let x = o.x; x < o.x + o.w; x++) out.push([x, o.y + o.h, 'u']);
    if (d.use === 'fountain' || d.use === 'cat' || d.use === 'sign' || d.use === 'piano') {
      for (let x = o.x; x < o.x + o.w; x++) out.push([x, o.y - 1, 'd']);
      for (let y = o.y; y < o.y + o.h; y++) { out.push([o.x - 1, y, 'r']); out.push([o.x + o.w, y, 'l']); }
    }
    if (d.use === 'door') { out.length = 0; for (let x = o.x; x < o.x + o.w; x++) out.push([x, o.y - 1, 'd']); }
    if (o.gate) { out.length = 0; out.push([o.x, o.y + 1, 'u'], [o.x, o.y - 1, 'd']); }
    return out;
  }

  // what's in front of the player?
  findFocus() {
    const p = this.player;
    const off = { u: [0, -13], d: [0, 11], l: [-12, -3], r: [12, -3] }[p.dir];
    const qx = p.x + off[0], qy = p.y + off[1];
    for (const n of this.npcs) if (!n.hidden && Math.abs(n.x - qx) < 8 && Math.abs(n.y - 3 - qy) < 9 && n.role !== 'dealer') return { npc: n };
    const tx = Math.floor(qx / TILE), ty = Math.floor(qy / TILE);
    for (const o of World.objs) {
      if (o.hidden && !o.gate) continue;
      if (tx < o.x || tx >= o.x + o.w || ty < o.y || ty >= o.y + o.h) continue;
      if (!this.objUsable(o)) continue;
      const d = OBJ[o.t];
      const anySide = ['fountain', 'cat', 'sign', 'piano'].includes(d.use);
      if (d.use === 'door' && p.dir !== 'd') continue;
      if (!anySide && d.use !== 'door' && !o.gate && p.dir !== 'u') continue;
      if (o.gate && o.hidden) continue;
      // machine taken by a sitter?
      if (d.game && this.npcs.some(n => n.machine === o)) return { busy: o };
      return { obj: o };
    }
    return null;
  }

  interact(f) {
    if (f.busy) { Snd.play('error'); return; }
    this.path = null;
    if (f.npc) return this.talk(f.npc);
    const o = f.obj;
    if (o.gate) { const b = this.npcs.find(n => n.gate === o.gate); if (b) this.talkBouncer(b); return; }
    const d = OBJ[o.t];
    if (d.game) return this.launch(o);
    if (o.vendor) return Vendors.open(o.vendor, this, o);
    if (d.use) return Vendors.use(d.use, this, o);
  }

  launch(o) {
    const make = GAMES[OBJ[o.t].game];
    if (!make) { say('THIS MACHINE IS BEING SERVICED. TRY ANOTHER ONE!'); return; }
    Snd.play('select');
    this.savePos();
    State.save();
    Game.go(() => Game.push(make(o)));
  }

  talk(n) {
    const p = this.player;
    if (n.kind === 'wander') n.dir = { u: 'd', d: 'u', l: 'r', r: 'l' }[p.dir];
    if (n.role === 'bouncer') return this.talkBouncer(n);
    if (n.role === 'owner') return Vendors.open('owner', this);
    if (n.role === 'waitress') return Vendors.waitress(n);
    let lines = n.lines;
    if (!lines) {
      const pool = n.look === 'granny' || n.look === 'granny2' ? CHATTER.granny : n.look.startsWith('rich') ? CHATTER.rich : n.role === 'guard' ? CHATTER.guard : CHATTER.gambler;
      lines = [U.pick(pool)];
    }
    say(lines.map(t => ({ who: n.name || (n.role === 'guard' ? 'SECURITY' : 'GAMBLER'), text: t })), { voice: n.look.includes('granny') ? 1.3 : n.look.includes('F') || n.look.includes('lady') ? 1.25 : 0.9 });
  }

  // ------------------------------------------------------------- npcs
  updateNpc(n, dt) {
    if (n.bubble) { n.bubble.t -= dt; if (n.bubble.t <= 0) n.bubble = null; }
    if (n.kind === 'sit') {
      n.chatT -= dt;
      if (n.machine) n.machine.busy = Math.max(0, (n.machine.busy || 0) - dt);
      if (n.chatT <= 0) {
        n.chatT = U.range(5, 14);
        if (n.machine) n.machine.busy = 1.2;
        this.tl.after(1.3, () => {
          const r = U.rand();
          if (r < 0.3) { n.bubble = { text: U.pick(['WOO!', 'YES!!', 'JACKPOT! ...OH, 2 GEMS.', 'COME ON!']), t: 1.6 }; if (n.machine) this.fx.gems(n.machine.x * TILE + 8 - this.cam.x, n.machine.y * TILE - this.cam.y, 5, { min: 30, max: 70, floor: n.machine.y * TILE + 14 - this.cam.y }); }
          else if (r < 0.5) n.bubble = { text: U.pick(['#@$%!', 'AW, NUTS.', 'SO CLOSE!', 'ONE MORE...']), t: 1.4 };
        });
      }
      return;
    }
    if (n.kind === 'stand') {
      n.chatT -= dt;
      if (n.chatT <= 0 && n.role === 'dealer') { n.chatT = U.range(8, 20); if (this.near(n, 110)) n.bubble = { text: U.pick(['PLACE YOUR BETS!', 'WHO FEELS LUCKY?', 'TABLE IS OPEN!', 'NO MORE BETS... KIDDING!']), t: 1.8 }; }
      return;
    }
    // wanderer
    if (n.path && n.path.length) {
      const [tx, ty] = n.path[0];
      const wx = tx * TILE + 8, wy = ty * TILE + 11;
      const dx = wx - n.x, dy = wy - n.y, d = Math.hypot(dx, dy);
      if (d < 1) { n.x = wx; n.y = wy; n.path.shift(); return; }
      n.dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'r' : 'l') : (dy > 0 ? 'd' : 'u');
      const moved = this.moveActor(n, dx / d, dy / d, Math.min(d, 30 * dt));
      n.moving = moved;
      if (moved) { n.animT += dt; n.stuck = 0; } else { n.stuck += dt; if (n.stuck > 1.2) { n.path = null; n.moving = false; n.wait = U.range(0.5, 2); } }
      return;
    }
    n.moving = false;
    n.wait -= dt;
    n.chatT -= dt;
    if (n.chatT <= 0) {
      n.chatT = U.range(10, 25);
      if (this.near(n, 120)) {
        const pool = n.role === 'guard' ? CHATTER.guard : n.look.startsWith('rich') ? CHATTER.rich : CHATTER.gambler;
        n.bubble = { text: n.role === 'waitress' ? 'DRINKS! LUCKY DRINKS!' : U.pick(pool).split('.')[0].slice(0, 40), t: 2.5 };
      }
    }
    if (n.wait <= 0) {
      n.wait = U.range(1.5, 5);
      const tx0 = n.tx, ty0 = n.ty;
      let gx, gy, tries = 0;
      const open = (x, y) => !World.blocked(x, y) && World.tile(x, y) === n.zone && !this.staticNpc.has(y * World.MW + x);
      // idle spots must not be doorways or corridors (all four neighbours open)
      const roomy = (x, y) => open(x, y) && open(x + 1, y) && open(x - 1, y) && open(x, y + 1) && open(x, y - 1);
      do { gx = tx0 + U.int(-6, 6); gy = ty0 + U.int(-5, 5); tries++; }
      while (tries < 20 && !roomy(gx, gy));
      if (tries >= 20) return;
      const path = bfs(tx0, ty0, (x, y) => x === gx && y === gy, (x, y) => !World.blocked(x, y) && World.tile(x, y) === n.zone && !this.staticNpc.has(y * World.MW + x), 800);
      if (path && path.length < 16) n.path = path.slice(1);
    }
  }
  near(n, d) { return Math.abs(n.x - this.player.x) < d && Math.abs(n.y - this.player.y) < d * 0.7; }

  // ------------------------------------------------------------- floor gems
  updateGems(dt) {
    const broke = State.money < 10;
    const rain = State.event && State.event.type === 'rain';
    this.gemT -= dt;
    if (rain) {
      if (this.gemT <= 0 || this.gemT > 0.35) this.gemT = Math.min(this.gemT, 0.35);
      if (this.gemT <= 0) { this.gemT = 0.35; this.spawnGem(true); }
    } else if (this.gemT <= 0) {
      this.gemT = broke ? U.range(4, 7) : U.range(25, 45);
      if (this.gems.length < (broke ? 6 : 3)) this.spawnGem(false);
    }
    const p = this.player;
    for (const c of this.gems) {
      c.t += dt;
      if (c.drop > 0) { c.drop = Math.max(0, c.drop - dt * 180); }
      if (!c.drop && Math.abs(c.x - p.x) < 9 && Math.abs(c.y - p.y) < 8) {
        c.got = true;
        State.give(c.v);
        Snd.play('pickup');
        this.fx.text('+' + U.moneyShort(c.v), c.x - this.cam.x, c.y - 16 - this.cam.y, C.yellow, { f: 's' });
      }
    }
    this.gems = this.gems.filter(c => !c.got && c.t < (c.rain ? 20 : 120));
  }

  spawnGem(rain) {
    let tx, ty, tries = 0;
    const p = this.player;
    do {
      if (rain) { tx = Math.floor(p.x / TILE) + U.int(-9, 9); ty = Math.floor(p.y / TILE) + U.int(-5, 5); }
      else { tx = U.int(1, World.MW - 2); ty = U.int(1, World.MH - 2); }
      tries++;
    } while (tries < 40 && (World.blocked(tx, ty) || !this.zoneOpen(World.tile(tx, ty))));
    if (tries >= 40) return;
    let v;
    if (rain) v = Math.max(25, Math.round(State.money * U.range(0.002, 0.006)));
    else v = U.pick([10, 25, 25, 50, 100]);
    this.gems.push({ x: tx * TILE + U.int(4, 12), y: ty * TILE + U.int(6, 13), v, t: 0, rain, drop: rain ? U.range(40, 90) : 0, gs: U.int(0, Spr.gemSets.length - 1) });
  }
  zoneOpen(z) {
    if (z === 'G') return !!State.flags.highOpen;
    if (z === 'D' || z === 'O') return !!State.flags.diamondOpen;
    return !!ZONES[z];
  }

  // ------------------------------------------------------------- zones & checks
  updateZone(force) {
    const z = World.zoneAt(this.player.x, this.player.y - 2);
    if (!z) return;
    const name = ZONES[z].name;
    if (force || name !== (this.zone && ZONES[this.zone].name)) {
      if (!force || !this.zone) this.banner = { text: name, t: 0 };
      if (force && this.zone) this.banner = null;
      this.zone = z;
      Music.play(ZONES[z].music);
    }
    this.zone = z;
  }

  checkBroke() {
    if (State.money >= 10 || this.brokeShown) return;
    if (this.gems.some(c => !c.rain)) return;
    this.brokeShown = true;
    State.stats.broke++;
    ask([{ who: 'UH OH', text: "YOU'RE BROKE! NOT A SINGLE GEM LEFT." }, { who: 'UH OH', text: 'PEOPLE DROP GEMS ON THE FLOOR ALL THE TIME... OR YOU COULD START FRESH WITH 5 GEMS.' }], [
      { label: 'LOOK FOR GEMS', fn: () => { this.gemT = 1; } },
      { label: 'SELL MY STUFF', fn: () => Vendors.open('cashier', this) },
      { label: 'START OVER', fn: () => Game.go(() => { State.newGame(); Game.set(new Overworld(true)); }) },
    ]);
  }

  checkMilestones() {
    const bil = () => { State.flags.billionaire = true; Game.push(new Celebrate("YOU'RE A BILLIONAIRE!", 'MR. WHISKERS WANTS TO TALK BUSINESS...')); };
    if (State.flags.millionaire === 'pending') {
      State.flags.millionaire = true;
      const after = State.flags.billionaire === 'pending' ? bil : null;
      this.tl.after(0.5, () => Game.push(new Celebrate("YOU'RE A MILLIONAIRE!", 'THE DIAMOND CLUB UPSTAIRS WELCOMES YOU.', after)));
    } else if (State.flags.billionaire === 'pending') this.tl.after(0.5, bil);
    if (State.money >= 10) this.brokeShown = false;
  }

  openMenu() { Snd.play('select'); this.savePos(); Game.push(new PauseMenu(this)); }

  // ------------------------------------------------------------- draw
  draw() {
    const cx = Math.round(this.cam.x), cy = Math.round(this.cam.y);
    const t = this.t;
    ctx.drawImage(World.layer, cx, cy, W, H, 0, 0, W, H);
    // wall decorations
    for (const s of World.signs) this.drawSign(s, cx, cy, t);
    // floor gems
    for (const c of this.gems) {
      const x = c.x - cx, y = c.y - cy - (c.drop || 0);
      if (x < -8 || y < -8 || x > W + 8 || y > H + 8) continue;
      if (!c.drop) { alpha(0.3); ell(x, c.y - cy + 2, 3, 1, C.black); alpha(1); }
      spr(Spr.gemSets[c.gs || 0][Math.floor(t * 8 + c.x) % 6], x - 4, y - 5);
      if (Math.floor(t * 3 + c.x) % 5 === 0) { P(x + 3, y - 6, C.white); P(x + 3, y - 7, C.white); P(x + 2, y - 6, C.white); P(x + 4, y - 6, C.white); P(x + 3, y - 5, C.white); }
    }
    // depth-sorted actors & furniture
    const list = [];
    for (const o of World.objs) {
      if (o.hidden) continue;
      const d = OBJ[o.t];
      const sx = o.x * TILE - cx, sy = o.y * TILE - cy;
      if (sx > W + 8 || sx + o.w * TILE < -8 || sy + o.h * TILE < -8 || sy + (d.oy || 0) > H + 8) continue;
      list.push({ y: (o.y + o.h) * TILE - (o.t === 'door' ? 100 : 0), o, sx, sy });
    }
    for (const n of this.npcs) if (!n.hidden && Math.abs(n.x - cx - W / 2) < W / 2 + 16 && Math.abs(n.y - cy - H / 2) < H / 2 + 40) list.push({ y: n.y, a: n });
    list.push({ y: this.player.y + 0.1, a: this.player });
    list.sort((a, b) => a.y - b.y);
    for (const it of list) {
      if (it.a) it.a.draw(cx, cy);
      else {
        const o = it.o, d = OBJ[o.t];
        if (!o.cv) o.cv = d.bake(o);
        spr(o.cv, it.sx + (d.ox || 0), it.sy + (d.oy || 0));
        if (d.anim) d.anim(o, it.sx, it.sy, t);
        if (State.event && State.event.type === 'hot' && State.hotTarget === o.id) this.drawHot(o, it.sx, it.sy + (d.oy || 0));
      }
    }
    // bubbles
    for (const n of this.npcs) if (n.bubble && !n.hidden) UI.bubble(n.bubble.text, n.x - cx, n.y - 30 - cy, { maxW: 90 });
    this.fx.draw();
    this.drawPrompt(cx, cy);
    this.drawHotArrow(cx, cy);
    this.drawHud();
  }

  drawSign(s, cx, cy, t) {
    const x = s.x * TILE - cx, y = s.y * TILE - cy;
    if (x > W || x + s.w * TILE < 0 || y > H || y < -16) return;
    if (s.hidden) return;
    if (s.kind === 'bottles') {
      R(x + 2, y + 5, s.w * 16 - 4, 2, C.woodD); R(x + 2, y + 11, s.w * 16 - 4, 2, C.woodD);
      const cs = s.fancy ? [C.gold, C.lemon, C.white, C.gold] : [C.lime, C.red, C.sky, C.yellow, C.pink, C.orange];
      for (let i = 0; i < s.w * 4; i++) { const c = cs[i % cs.length]; R(x + 4 + i * 4, y + 1 + (i % 2), 2, 4 - (i % 2), c); R(x + 4 + i * 4, y + 8, 2, 3, cs[(i + 2) % cs.length]); }
      return;
    }
    if (s.kind === 'tv') {
      for (let i = 0; i < s.w; i += 2) {
        const sx = x + i * 16 + 2;
        box(sx, y + 1, 28, 14, C.ink, C.gray);
        R(sx + 1, y + 2, 26, 12, C.felt); R(sx + 1, y + 9, 26, 1, C.lime);
        for (let h = 0; h < 3; h++) { const hx = sx + 2 + ((t * (8 + h * 3 + i) + h * 9) % 22); R(hx, y + 5 + h * 3, 3, 2, [C.wood, C.ink, C.cream][h]); }
      }
      return;
    }
    if (s.kind === 'painting') {
      box(x + 8, y + 1, s.w * 16 - 16, 13, C.navy, C.gold);
      R(x + 10, y + 3, s.w * 16 - 20, 9, C.sky);
      ell(x + s.w * 8, y + 9, 6, 3, C.green); circ(x + s.w * 8 + 12, y + 6, 2, C.yellow);
      Font.draw('MR. W', x + s.w * 8, y + 5, { f: 's', c: C.ink, a: 'c' });
      return;
    }
    // neon text sign on a dark plate
    const flick = Math.sin(t * 7 + s.x * 3) > 0.97;
    const cxm = x + (s.w * TILE) / 2;
    const f = s.big ? 'm' : 's';
    const tw = Font.width(s.text, f) + 8, th = s.big ? 11 : 9;
    const yy = y + (s.top ? 1 : 4);
    box(Math.round(cxm - tw / 2), yy - 2, tw, th, C.ink, Gfx.mix(s.c, C.ink, 0.55));
    if (!flick) { alpha(0.18); R(cxm - tw / 2 - 2, yy - 4, tw + 4, th + 4, s.c); alpha(1); }
    Font.draw(s.text, cxm, yy, { c: flick ? C.slate : s.c, a: 'c', f });
  }

  drawHot(o, x, y) {
    const cx = x + o.w * 8;
    for (let i = 0; i < 3; i++) {
      const k = (this.hotFx * 2 + i / 3) % 1;
      const fx = cx + Math.sin(this.hotFx * 5 + i * 2) * 3;
      const fy = y - 2 - k * 10;
      circ(fx, fy, Math.round((1 - k) * 3), k < 0.4 ? C.yellow : k < 0.7 ? C.orange : C.red);
    }
    Font.draw('x3', cx, y - 18, { c: C.yellow, a: 'c', f: 's', ol: C.crimson });
  }

  drawHotArrow(cx, cy) {
    if (!State.event || State.event.type !== 'hot') return;
    const o = World.objById(State.hotTarget);
    if (!o) return;
    const ox = o.x * TILE + 8 - cx, oy = o.y * TILE - cy;
    if (ox > 0 && ox < W && oy > 14 && oy < H) return;
    const ax = U.clamp(ox, 10, W - 10), ay = U.clamp(oy, 22, H - 10);
    if (Math.floor(this.t * 4) % 2) return;
    circ(ax, ay, 5, C.orange); circ(ax, ay, 4, C.red);
    Font.draw('x3', ax, ay - 2, { c: C.yellow, a: 'c', f: 's' });
  }

  drawPrompt(cx, cy) {
    const f = this.focus;
    if (!f || Game.top !== this) return;
    let text, x, y;
    if (f.npc) { const n = f.npc; text = (Input.last === 'mouse' ? 'TAP' : 'Z') + ': TALK' + (n.name ? ' TO ' + n.name : ''); x = n.x - cx; y = n.y - 34 - cy; }
    else {
      const o = f.obj || f.busy;
      const d = OBJ[o.t];
      x = o.x * TILE + (o.w * TILE) / 2 - cx; y = o.y * TILE + (d.oy || 0) - cy - 4;
      if (f.busy) text = 'OCCUPIED';
      else if (o.gate) text = 'Z: TALK TO BOUNCER';
      else if (d.game) { const info = gameInfo(o); text = 'Z: ' + info.name + (info.limits ? '  ' + info.limits : ''); }
      else if (o.vendor) text = 'Z: ' + VENDOR_NAMES[o.vendor];
      else text = 'Z: ' + ({ fountain: 'TOSS A GEM', cat: 'PET THE LUCKY CAT', sign: 'READ', door: 'LEAVE', piano: 'PLAY' })[d.use];
      if (Input.last === 'mouse') text = text.replace('Z: ', '');
    }
    const w = Font.width(text, 's') + 8;
    const bx = U.clamp(Math.round(x - w / 2), 2, W - w - 2), by = U.clamp(Math.round(y - 10), 16, H - 12);
    box(bx, by, w, 10, C.night, f.busy ? C.slate : C.yellow);
    Font.draw(text, bx + 4, by + 3, { c: f.busy ? C.gray : C.white, f: 's' });
  }

  drawHud() {
    // money
    R(0, 0, W, 13, C.ink); alpha(0.9); R(0, 13, W, 1, C.bronze); alpha(1);
    const wd = Wallet.draw(3, 3, 'l');
    Font.draw(State.rank(), wd.x + wd.w + 6, 4, { c: C.lav, f: 's' });
    // luck meter
    const q = Luck.q(), segs = 10, lit = Math.round((q / 0.85) * segs);
    const lx = W - 94;
    spr(Spr.icon.clover, lx - 10, 2);
    Font.draw('LUCK', lx, 4, { c: C.lime, f: 's' });
    for (let i = 0; i < segs; i++) R(lx + 18 + i * 4, 4, 3, 5, i < lit ? (i >= 7 ? C.yellow : C.lime) : C.plum);
    if (State.buffs.length) Font.draw('+', lx + 60, 4, { c: C.yellow, f: 's' });
    // menu button
    const mb = this.menuBtn;
    box(W - 30, 1, 28, 11, C.plum, Input.inRect(W - 30, 1, 28, 11) ? C.yellow : C.violet);
    Font.draw('MENU', W - 16, 4, { c: C.lav, f: 's', a: 'c' });
    this.menuBtn = { x: W - 30, y: 1, w: 28, h: 11 };
    // event timer
    if (State.event) {
      const e = EVENTS[State.event.type];
      const txt = e.name.replace('!', '') + ' ' + Math.ceil(State.event.t) + 'S';
      const w = Font.width(txt, 's') + 8;
      box(W - w - 2, 15, w, 10, C.night, e.c);
      Font.draw(txt, W - w + 2, 18, { c: e.c, f: 's' });
    }
    // zone banner
    if (this.banner) {
      const b = this.banner, k = Math.min(1, b.t * 4, (2.6 - b.t) * 4);
      const w = Font.width(b.text) + 20;
      const y = 18 + Math.round((1 - k) * -10);
      alpha(Math.max(0, k));
      panel(W / 2 - w / 2, y, w, 13, C.night, C.gold);
      Font.draw(b.text, W / 2, y + 3, { c: C.yellow, a: 'c' });
      alpha(1);
    }
    if (Input.last === 'key' && this.t < 8 && !State.flags.movedOnce) Font.draw('ARROWS/WASD: MOVE   Z: USE   ESC: MENU', W / 2, H - 9, { c: C.lav, f: 's', a: 'c', ol: C.ink });
    if (Input.axis().x || Input.axis().y) State.flags.movedOnce = true;
  }
}

class Celebrate extends Scene {
  constructor(title, sub, done) { super(); this.opaque = false; this.title = title; this.sub = sub; this.done = done; }
  enter() {
    Snd.play('jackpot'); Gfx.flash(C.yellow, 0.4); Gfx.shake(3, 0.5);
    this.fx.gems(160, 150, 60, { min: 120, max: 260, spread: 1.3 });
    this.fx.confetti(160, 60, 100, { power: 240 });
  }
  update(dt) {
    super.update(dt);
    if (Math.random() < 0.4) this.fx.rain(1);
    if (this.t > 1.2 && (Input.pressed('a') || Input.pressed('b') || Input.mouse.pressed)) { Input.eatAll(); Game.pop(); if (this.done) this.done(); }
  }
  draw() {
    alpha(0.6); R(0, 0, W, H, C.black); alpha(1);
    alpha(0.5); Burst.draw(160, 90, 20, this.t * 0.5, C.gold, C.orange); alpha(1);
    alpha(0.45); R(0, 0, W, H, C.black); alpha(1);
    const k = Ease.outBack(Math.min(1, this.t * 2));
    const words = this.title.split(' ');
    const half = Math.ceil(words.length / 2);
    const l1 = words.slice(0, half).join(' '), l2 = words.slice(half).join(' ');
    drawJackpotText(W / 2, 34, 2 + k, this.t, k, l1);
    drawJackpotText(W / 2, 72, 2 + k, this.t + 0.3, k, l2);
    this.fx.draw();
    if (this.t > 0.8) Font.draw(this.sub, W / 2, 132, { c: C.white, a: 'c', ol: C.ink });
    if (this.t > 1.2 && Math.floor(this.t * 2) % 2) Font.draw('PRESS Z', W / 2, 150, { c: C.lemon, a: 'c', f: 's' });
  }
}

// bet ladder in 1/100 gem: 0.10 ... 50B gems
const LADDER = (() => {
  const out = [10, 25, 50];
  for (let e = 100; e <= 5e12; e *= 10) out.push(e, e * 2.5, e * 5);
  return out.filter(v => v <= 5e12);
})();

class BetPicker {
  constructor(key, min, max) {
    this.key = key; this.min = min; this.max = max;
    State.lastBet = State.lastBet || {};
    this.value = U.clamp(State.lastBet[key] || min, min, max);
    this.snapToLadder();
  }
  steps() { return LADDER.filter(v => v >= this.min && v <= this.max); }
  snapToLadder() { const s = this.steps(); let best = s[0]; for (const v of s) if (v <= this.value) best = v; this.value = best; }
  up() { const s = this.steps(); const i = s.indexOf(this.value); if (i < s.length - 1) { this.value = s[i + 1]; this.save(); return true; } return false; }
  down() { const s = this.steps(); const i = s.indexOf(this.value); if (i > 0) { this.value = s[i - 1]; this.save(); return true; } return false; }
  setMax() { const s = this.steps().filter(v => v <= State.money); this.value = s.length ? s[s.length - 1] : this.min; this.save(); }
  // keep the bet affordable
  fit() { if (this.value > State.money) { const s = this.steps().filter(v => v <= State.money); if (s.length) { this.value = s[s.length - 1]; this.save(); } } }
  save() { State.lastBet[this.key] = this.value; }
  get ok() { return State.money >= this.value; }
}

  finish(game, bet, payout, x = W / 2, y = 90, opts = {}) {

    State.settle(game, bet, payout);
    this.celebrate(bet, payout, x, y, opts);

  }
  celebrate(bet, payout, x, y, opts = {}) {

    const wx = 250, wy = 5;

    this.fx.fly(x, y, wx, wy, n);
    if (net === 0) { Snd.play('push'); this.fx.text('PUSH', x, y - 10, C.silver); return; }
    if (net < 0) { Snd.play('winSmall'); this.fx.text('+' + U.moneyShort(payout), x, y - 10, C.lemon); return; }
    this.fx.text('+' + U.moneyShort(payout), x, y - 10, C.yellow);
    if (opts.jackpot || mult >= 100) {
      State.stats.jackpots = (State.stats.jackpots || 0) + 1;
      Game.push(new JackpotScene(payout));
    } else if (mult >= 25) {
      Snd.play('bigwin'); Gfx.shake(3, 0.5); Gfx.flash(C.yellow, 0.2);

      this.fx.gems(x, y, 22, { min: 70, max: 180 });
    } else {
      Snd.play('win');
      this.fx.gems(x, y, 6, { min: 40, max: 110 });
    }
  }
}

// mini (11x11) versions of 22x22 slot symbols for pay tables
const Mini = {
  cache: {},
  get(name) {
    if (this.cache[name]) return this.cache[name];
    const src = Spr.sym[name], sd = src.getContext('2d').getImageData(0, 0, 22, 22).data;
    const c = Gfx.canvas(11, 11), x = c.getContext('2d');
    for (let j = 0; j < 11; j++) for (let i = 0; i < 11; i++) {
      const counts = new Map();
      for (const [dx, dy] of [[0, 0], [1, 0], [0, 1], [1, 1]]) {
        const k = ((j * 2 + dy) * 22 + (i * 2 + dx)) * 4;
        if (sd[k + 3] === 0) continue;
        const col = (sd[k] << 16) | (sd[k + 1] << 8) | sd[k + 2];
        const ink = col === parseInt(C.ink.slice(1), 16);
        counts.set(col, (counts.get(col) || 0) + (ink ? 0.9 : 1));
      }
      let best = null, bc = 0;
      for (const [col, n] of counts) if (n > bc) { bc = n; best = col; }
      if (best !== null && bc >= 1) { x.fillStyle = '#' + best.toString(16).padStart(6, '0'); x.fillRect(i, j, 1, 1); }
    }
    return (this.cache[name] = c);
  },
};

const Cards = {
  RANKS: ['', 'A', '2', '3', '4', '5', '6', '7', '8', '9', 'T', 'J', 'Q', 'K'],
  SUITS: ['♠', '♥', '♦', '♣'],
  deck(n = 1) {
    const d = [];
    for (let k = 0; k < n; k++) for (const s of this.SUITS) for (let r = 1; r <= 13; r++) d.push({ r, s });
    return U.shuffle(d);
  },
  bj(cards) {
    let t = 0, aces = 0;
    for (const c of cards) { t += c.r === 1 ? 11 : Math.min(10, c.r); if (c.r === 1) aces++; }
    while (t > 21 && aces) { t -= 10; aces--; }
    return { total: t, soft: aces > 0 };
  },
  label(c) { return this.RANKS[c.r] === 'T' ? '10' : this.RANKS[c.r]; },
};

class TableCard {

    const sw = Math.max(1, Math.round(img.width * this.fl));
    alpha(0.3); R(this.x + dx + 2 + (img.width - sw) / 2, this.y + dy + 2, sw, img.height, C.black); alpha(1);
    ctx.drawImage(img, Math.round(this.x + dx + (img.width - sw) / 2), Math.round(this.y + dy), sw, img.height);
  }
}

// chip denominations for a table
function chipSet(min, max, n = 5) {
  const nice = [10, 25, 100, 500, 2500, 10000, 50000, 100000, 500000, 1e6, 5e6, 1e7, 5e7, 1e8, 5e8, 1e9, 5e9, 1e10, 5e10];
  const out = nice.filter(v => v >= min && v <= max);
  if (out[0] !== min) out.unshift(min);
  return out.slice(0, n);
}

// draw a stack of chips representing an amount
function chipStack(amount, x, y, r = 6, maxChips = 8) {
  const vals = [1e10, 5e9, 1e9, 5e8, 1e8, 5e7, 1e7, 5e6, 1e6, 5e5, 1e5, 5e4, 1e4, 2500, 500, 100, 25, 10];
  let left = amount, n = 0;
  const list = [];
  for (const v of vals) while (left >= v && list.length < maxChips) { list.push(v); left -= v; }
  if (!list.length && amount > 0) list.push(10);
  list.reverse();
  for (const v of list) { spr(Spr.chip(v, r), x - r - 1, y - r - 1 - n * 2); n++; }
}

// spread symbol counts evenly around a reel strip
function makeStrip(counts, shift = 0) {
  const items = [];
  Object.entries(counts).forEach(([s, n], i) => {
    for (let k = 0; k < n; k++) items.push({ s, p: (k + 0.5 + ((i * 0.37 + shift) % 1) * 0.6) / n });
  });
  items.sort((a, b) => a.p - b.p);
  return items.map(x => x.s);
}

// pay rules: ['3', sym, x] three of a kind | ['any', [syms], x] all three from set
//            ['n', sym, count, x] at least count of sym on the line | ['jackpot', sym] progressive

for (const k in SLOTS) {
  const m = SLOTS[k];
  m.strips = [0, 1, 2].map(i => makeStrip(m.reels[i] || m.reels[0], i * 0.29));
}
const JACKPOT_SEED = gems(250000000);

const SlotMath = {
  line(m, stops) { return stops.map((s, i) => m.strips[i][s]); },
  // returns {mult, rule, jackpot}
  evaluate(m, line) {
    const wild = m.wild;
    const nw = wild ? line.filter(s => s === wild).length : 0;
    for (const r of m.pays) {
      if (r[0] === 'jackpot') { if (line.every(s => s === r[1])) return { mult: 0, rule: r, jackpot: true }; continue; }
      if (r[0] === '3') {
        const ok = line.every(s => s === r[1] || s === wild);
        if (ok && !(nw === 3 && r[1] !== wild)) return { mult: r[2] * (wild && r[1] !== wild ? Math.pow(2, nw) : 1), rule: r };
      } else if (r[0] === 'any') {
        if (line.every(s => r[1].includes(s) || s === wild) && nw < 3) return { mult: r[2] * (wild ? Math.pow(2, nw) : 1), rule: r };
      } else if (r[0] === 'n') {
        // consecutive from the left reel; wilds help but need one real symbol
        let n = 0, real = 0, wu = 0;
        for (const s of line) { if (s === r[1]) { n++; real++; } else if (s === wild) { n++; wu++; } else break; }
        if (real > 0 && n >= r[2]) return { mult: r[3] * Math.pow(2, wu), rule: r };
      }
    }
    return { mult: 0, rule: null };
  },
  randStops(m) { return m.strips.map(s => Math.floor(U.rand() * s.length)); },
  value(m, stops, bet, jackpot) {
    const e = this.evaluate(m, this.line(m, stops));
    return e.jackpot ? jackpot * (bet / m.max) : e.mult * bet;
  },
};

class SlotsScene extends GameScene {
  constructor(obj) {
    const m = SLOTS[obj.cfg === 'penny' && obj.cab === 'lou' ? 'lou' : obj.cfg] || SLOTS.penny;
    super(obj, m.name);
    this.m = m;
    this.th = CAB[m.cab];
    this.bp = new BetPicker('slots:' + m.name, m.min, m.max);
    this.bp.fit();
    this.reels = [0, 1, 2].map(i => ({ pos: U.int(0, m.strips[i].length - 1), v: 0, spinning: false, target: 0, tw: null, glow: 0 }));
    this.lever = 0; this.win = 0; this.winLine = null; this.flashT = 0; this.auto = false; this.slam = false;
    this.leverRect = { x: 232, y: 46, w: 16, h: 60 };
    this.build();
  }

  build() {
    const g = this.ui;
    this.bet = addBetButtons(this, this.bp, 96, 160);
    this.maxBtn = g.add({ x: 176, y: 160, w: 26, h: 13, label: 'MAX', font: 's', onPress: () => this.bp.setMax(), sound: 'move' });
    this.spinBtn = g.add({ x: 206, y: 157, w: 46, h: 17, label: 'SPIN', style: 'red', onPress: () => this.spin(), silent: true });
    this.autoBtn = g.add({ x: 256, y: 160, w: 34, h: 13, label: 'AUTO', font: 's', onPress: () => { this.auto = !this.auto; this.autoBtn.style = this.auto ? 'green' : 'std'; if (this.auto && !this.busy) this.spin(); } });
    g.focus = this.spinBtn;
  }

  canLeave() { return !this.busy; }

  async spin() {
    if (this.busy) { this.slam = true; return; }
    const m = this.m, bet = this.bp.value;
    if (!this.bp.ok) {
      this.auto = false; this.autoBtn.style = 'std';
      Snd.play('error');
      this.say(State.money < m.min ? 'NOT ENOUGH GEMS FOR THIS MACHINE' : 'LOWER YOUR BET!', C.cherry);
      this.bp.fit();
      return;
    }
    this.busy = true; this.slam = false; this.win = 0; this.winLine = null;
    State.take(bet);
    if (m.progressive) State.jackpot += Math.round(bet * 0.03);
    this.lever = 1; Snd.play('lever');
    // decide the outcome now (luck may re-roll once, keeping the better spin)
    const jp = State.jackpot;
    const stops = Luck.pick(() => SlotMath.randStops(m), st => SlotMath.value(m, st, bet, jp));
    const line = SlotMath.line(m, stops);
    const ev = SlotMath.evaluate(m, line);
    for (const r of this.reels) { r.spinning = true; r.v = 0; r.tw = null; }
    await this.tl.wait(0.35);
    // anticipation when the first two reels line up something good
    const hot = (line[0] === line[1] || (m.wild && (line[0] === m.wild || line[1] === m.wild))) && ['seven', 'bag', 'diamond', 'mega', 'star', 'crown', 'bell'].includes(line[0] === m.wild ? line[1] : line[0]);
    for (let i = 0; i < 3; i++) {
      let t = i === 0 ? 0.55 : 0.32;
      if (i === 2 && hot) { t = 1.6; this.reels[2].glow = 1; }
      await this.waitOrSlam(t, i === 2 && hot);
      await this.stopReel(i, stops[i]);
    }
    this.reels[2].glow = 0;
    // pay
    let pay = ev.jackpot ? Math.round(jp * (bet / m.max)) : ev.mult * bet;
    if (ev.jackpot) State.jackpot = JACKPOT_SEED;
    this.winLine = pay > 0 ? line : null;
    this.flashT = pay > 0 ? 2 : 0;
    const paid = this.finish('slots', bet, pay, 160, 78, { jackpot: ev.jackpot || ev.mult >= 250 });
    this.win = paid;
    if (paid >= bet * 20) { this.auto = false; this.autoBtn.style = 'std'; }
    this.busy = false;
    this.bp.fit();
    if (this.auto) {
      await this.tl.wait(paid > 0 ? 0.9 : 0.45);
      if (this.auto && !this.dead && Game.top === this) this.spin();
    }
  }

  async waitOrSlam(t, tension) {
    let e = 0, k = 0;
    while (e < t && !(this.slam && !tension)) {
      await this.tl.wait(0.05); e += 0.05;
      if (tension && Math.floor(e / 0.1) > k) { k = Math.floor(e / 0.1); Snd.play('tension', k); }
      if (this.dead) return;
    }
  }

  stopReel(i, stop) {
    const r = this.reels[i], n = this.m.strips[i].length;
    let f = Math.floor(r.pos) + 3;
    while (((f % n) + n) % n !== stop) f++;
    r.spinning = false;
    r.tw = null;
    return this.tl.tween(r, { pos: f }, 0.32, 'outBack').then(() => { r.pos = stop; Snd.play('reelStop'); Gfx.shake(1, 0.06); });
  }

  update(dt) {
    if (super.update(dt)) return;
    this.lever = Math.max(0, this.lever - dt * 2.5);
    this.flashT = Math.max(0, this.flashT - dt);
    for (const r of this.reels) {
      if (r.spinning) { r.v = Math.min(18, r.v + dt * 60); r.pos += r.v * dt; if (Math.random() < dt * 14) Snd.play('reel'); }
    }
    if (!this.busy) {
      if (Input.repeat('up')) { this.bp.up(); Snd.play('move'); }
      if (Input.repeat('down')) { this.bp.down(); Snd.play('move'); }
    }
    // lever by mouse
    const lr = this.leverRect, m = Input.mouse;
    if (m.pressed && Input.inRect(lr.x - 4, lr.y - 8, lr.w + 8, lr.h + 16)) { this.spin(); return; }
    if (this.busy && (Input.pressed('a') || m.pressed)) { this.slam = true; Input.eatAll(); }
    if (this.auto && (Input.pressed('b'))) { this.auto = false; this.autoBtn.style = 'std'; }
    this.ui.update(dt);
  }

  drawReel(i, x, y, w, h) {
    const r = this.reels[i], strip = this.m.strips[i], n = strip.length, cell = 24;
    R(x, y, w, h, C.cream);
    ctx.save(); ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
    const base = Math.floor(r.pos), frac = r.pos - base;
    const fast = r.spinning && r.v > 8;
    for (let k = -2; k <= 2; k++) {
      const idx = (((base - k) % n) + n) % n;
      const sy = y + h / 2 - 11 + (k + frac) * cell;
      const img = Spr.sym[strip[idx]];
      if (fast) { alpha(0.35); spr(img, x + 3, sy - 6); spr(img, x + 3, sy + 6); alpha(0.8); spr(img, x + 3, sy); alpha(1); }
      else spr(img, x + 3, sy);
    }
    ctx.restore();
    alpha(0.3); R(x, y, w, 8, C.ink); R(x, y + h - 8, w, 8, C.ink); alpha(0.15); R(x, y + 8, w, 6, C.ink); R(x, y + h - 14, w, 6, C.ink); alpha(1);
    if (r.glow && Math.floor(this.t * 10) % 2) box(x - 1, y - 1, w + 2, h + 2, null, C.yellow);
    if (this.winLine && this.flashT > 0 && Math.floor(this.flashT * 6) % 2) box(x, y + h / 2 - 12, w, 24, null, C.yellow);
  }

  draw() {
    const th = this.th, t = this.t;
    // backdrop: dim casino with bokeh lights
    R(0, 0, W, H, C.ink);
    for (let i = 0; i < 16; i++) { const x = (i * 53 + 17) % W, y = 20 + ((i * 37) % 140); alpha(0.08 + 0.05 * Math.sin(t * 1.5 + i)); circ(x, y, 3 + (i % 4), [th.light, th.trim, C.pink, C.yellow][i % 4]); alpha(1); }
    // paytable panel
    this.drawPays(4, 16);
    // cabinet
    const cx = 92, cy = 15, cw = 136, ch = 138;
    R(cx + 3, cy + 3, cw, ch, C.black);
    R(cx, cy, cw, ch, th.body); R(cx, cy, 3, ch, th.bodyL); R(cx + cw - 3, cy, 3, ch, th.bodyD);
    // marquee with chasing bulbs
    R(cx + 6, cy + 4, cw - 12, 22, th.marquee === C.ink ? C.ink : th.bodyD);
    for (let i = 0; i < 26; i++) {
      const per = 2 * (cw - 14) + 2 * 20;
      const d = (i / 26) * per;
      let bx, by;
      if (d < cw - 14) { bx = cx + 7 + d; by = cy + 5; } else if (d < cw - 14 + 20) { bx = cx + cw - 8; by = cy + 5 + (d - (cw - 14)); } else if (d < 2 * (cw - 14) + 20) { bx = cx + cw - 8 - (d - (cw - 14) - 20); by = cy + 25; } else { bx = cx + 7; by = cy + 25 - (d - 2 * (cw - 14) - 20); }
      const on = this.flashT > 0 ? Math.floor(t * 14 + i) % 2 === 0 : Math.floor(t * 8 - i) % 4 === 0;
      P(bx, by, on ? C.white : th.trim);
    }
    Font.draw(this.m.name, cx + cw / 2, cy + 12, { c: this.flashT > 0 ? RAINBOW[Math.floor(t * 12) % 8] : C.yellow, a: 'c', ol: C.ink });
    // reel window
    const rx = cx + 22, ry = cy + 32, rw = 28, rh = 72;
    box(rx - 4, ry - 4, 3 * rw + 2 * 3 + 8, rh + 8, C.ink, th.trim);
    for (let i = 0; i < 3; i++) this.drawReel(i, rx + i * (rw + 3), ry, rw, rh);
    const ly = ry + rh / 2;
    R(rx - 3, ly, 3 * rw + 12, 1, this.flashT > 0 && Math.floor(t * 8) % 2 ? C.yellow : C.red);
    Font.draw('▶', rx - 9, ly - 3, { c: C.red, f: 's' }); Font.draw('◀', rx + 3 * rw + 12, ly - 3, { c: C.red, f: 's' });
    // LED display
    const dy = ry + rh + 7;
    box(cx + 12, dy, cw - 24, 13, C.black, C.bronze);
    let led;
    if (this.busy) led = 'GOOD LUCK!';
    else if (this.win > 0) led = 'WIN ' + U.money(this.win);
    else led = 'BET ' + U.money(this.bp.value);
    Font.draw(led, cx + cw / 2, dy + 3, { c: this.win > 0 && !this.busy ? C.lime : C.cherry, a: 'c' });
    // tray
    R(cx + 20, cy + ch - 12, cw - 40, 8, C.ink); R(cx + 20, cy + ch - 12, cw - 40, 1, C.charcoal);
    for (let i = 0; i < 9; i++) spr(Spr.gemSets[(i * 3) % Spr.gemSets.length][5], cx + 25 + i * 10, cy + ch - 12 + (i % 2));
    // lever
    const lk = this.lever, lr = this.leverRect;
    R(lr.x, lr.y + 34, 8, 18, C.charcoal); R(lr.x + 1, lr.y + 35, 6, 16, C.gray);
    const top = lr.y + 2 + lk * 34;
    R(lr.x + 3, top + 4, 2, lr.y + 42 - top - 4, C.silver);
    ball(lr.x + 4, top + 2, 5, C.red, C.crimson, C.salmon);
    if (!this.busy && Input.inRect(lr.x - 4, lr.y - 8, lr.w + 8, lr.h + 16) && Input.last === 'mouse') Font.draw('PULL!', lr.x + 4, lr.y - 12, { c: C.yellow, f: 's', a: 'c' });
    // side info
    this.drawSide(252, 20);
    this.bet.draw();
    this.ui.draw();
    this.drawTop();
    this.fx.draw();
    UI.drawPops(this, 1 / 60);
    this.drawMsg(136);
  }

  drawPays(x, y) {
    panel(x, y, 84, 138, C.night, C.bronze);
    Font.draw('PAYS', x + 42, y + 3, { c: C.lemon, a: 'c', f: 's' });
    let yy = y + 11;
    for (const r of this.m.pays) {
      if (yy > y + 128) break;
      let label;
      if (r[0] === '3' || r[0] === 'jackpot') { for (let k = 0; k < 3; k++) spr(Mini.get(r[1]), x + 3 + k * 11, yy); label = r[0] === 'jackpot' ? 'JACKPOT' : r[2] + 'x'; }
      else if (r[0] === 'any') { Font.draw('ANY', x + 4, yy + 3, { f: 's', c: C.lav }); spr(Mini.get(r[1][0]), x + 18, yy); spr(Mini.get(r[1][Math.min(1, r[1].length - 1)]), x + 25, yy); label = r[2] + 'x'; }
      else { for (let k = 0; k < r[2]; k++) spr(Mini.get(r[1]), x + 3 + k * 11, yy); label = r[3] + 'x'; }
      const hit = this.winLine && this.flashT > 0 && SlotMath.evaluate(this.m, this.winLine).rule === r;
      Font.draw(label, x + 80, yy + 3, { f: 's', c: hit && Math.floor(this.t * 8) % 2 ? C.white : r[0] === 'jackpot' ? C.pink : C.yellow, a: 'r' });
      yy += 13;
    }
    if (this.m.wild) Font.draw('♦ = WILD x2', x + 42, y + 128, { f: 's', c: C.cyan, a: 'c' });
  }

  drawSide(x, y) {

      panel(x - 2, y, 66, 34, C.night, C.pink);

      Font.draw(U.moneyShort(State.jackpot), x + 31, y + 12, { c: Math.floor(this.t * 4) % 2 ? C.yellow : C.lemon, a: 'c' });
      Font.draw('AT MAX BET', x + 31, y + 23, { f: 's', c: C.gray, a: 'c' });

    }
