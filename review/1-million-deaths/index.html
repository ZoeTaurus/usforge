  },

  drawBubble(Wd, cx, cy) {
    const b = Wd.bubble;
    const P = Wd.P;
    let ax, ay;
    if (b.who) { ax = b.who.x - cx; ay = b.who.y - cy; }
    else { ax = P.x + P.fx.dx - cx; ay = P.y + P.fx.dy - 24 - cy; }

    let y = Math.round(ay - h - 6);
    if (y < 30) y = 30;
    const pop = Math.min(1, b.t / 0.12);

    rect(x, y, w, h, '#181425');
    rect(x + 1, y + 1, w - 2, h - 2, '#ffffff');
    // tail
    const tx = Math.round(clamp(ax, x + 4, x + w - 5));
    rect(tx - 2, y + h - 1, 5, 1, '#ffffff'); rect(tx - 1, y + h, 3, 2, '#ffffff'); rect(tx, y + h + 2, 1, 2, '#ffffff');
    px(tx - 3, y + h - 1, '#181425'); px(tx + 3, y + h - 1, '#181425'); px(tx - 2, y + h, '#181425'); px(tx + 2, y + h, '#181425'); px(tx - 1, y + h + 2, '#181425'); px(tx + 1, y + h + 2, '#181425'); px(tx, y + h + 4, '#181425');
    lines.forEach((ln, i) => text(ln, x + 5, y + 3 + i * 10, { color: '#181425' }));
  },

  menuRect(m) {
    const o = m.obj;
    const items = m.items;
    const w = Math.max(textWidth(o.name || '', 'small') + 10, ...items.map((it) => textWidth(it.label, 'big') + 22));
    const h = 14 + items.length * 11 + 2;

    let y = Math.round(o.y - o.h - World.cam.y - h - 8);
    x = clamp(x, 3, W - w - 3);
    y = clamp(y, 32, H - h - 3);
    return { x, y, w, h };
  },
  menuItemRect(box, i) { return { x: box.x + 2, y: box.y + 13 + i * 11, w: box.w - 4, h: 11 }; },

  drawMenu(m) {
    const box = this.menuRect(m);
    const k = ease.outBack(Math.min(1, m.t / 0.15));
    const hh = Math.max(4, Math.round(box.h * k));
    this.panel(box.x, box.y, box.w, hh, { edge: '#fee761' });
    if (k < 0.95) return;
    text(m.obj.name || '', box.x + 5, box.y + 4, { font: 'small', color: '#feae34' });
    m.items.forEach((it, i) => {
      const r = this.menuItemRect(box, i);
      const sel = i === m.sel;
      if (sel) rect(r.x, r.y, r.w, r.h, '#a22633');
      const col = !it.death ? '#8b9bb4' : sel ? '#fee761' : '#ffffff';
      if (sel) text('→', r.x + 2, r.y + 2, { color: '#ffffff' });
      text(it.label, r.x + 10, r.y + 2, { color: col });
      if (it.done) text('☠', r.x + r.w - 8, r.y + 3, { font: 'small', color: sel ? '#ffffff' : '#e43b44' });
    });
  },

  // ------------------------------------------------------------ death card
  openCard(id, res, P, life) {

    if (res.unlocked) setTimeout(() => Sound.play('unlock'), 1400);
  },

  updateCard(dt) {
    const c = this.card;
    if (!c) return;
    c.t += dt;
    const d = DEATHS[c.id];
    const before = Math.floor(c.typed);
    c.typed = Math.min(d.desc.length, c.typed + dt * 60);
    if (Math.floor(c.typed) !== before && Math.floor(c.typed) % 3 === 0 && c.typed < d.desc.length) Sound.play('talk');
    if (c.t > 0.7 && (Input.pressed.confirm || Input.pressed.action || Input.pressed.jump || Input.mouse.clicked)) {
      if (c.typed < d.desc.length) { c.typed = d.desc.length; return; }
      this.card = null;
      World.respawn();
      return;

    if (c.t > 0.5 && Input.pressed.dex) Game.openDex('card');
  },

  drawCard() {
    const c = this.card;

    text('TOTAL DEATHS', rx + 104, sy, { font: 'small', color: '#5a6988' }); text(fmtNum(res.total), rx + rw, sy, { font: 'small', align: 'right', color: '#f6757a' });
    text('FOUND', rx + 104, sy + 8, { font: 'small', color: '#5a6988' }); text(res.found + '/' + deathIds().length, rx + rw, sy + 8, { font: 'small', align: 'right', color: '#fee761' });

    }
    // prompt
    if (t > 0.8 && Math.floor(t * 2.5) % 2 === 0) {
      text(this.confirmWord() + ' TO REINCARNATE', W / 2, 166, { font: 'small', align: 'center', color: '#ffffff', outline: '#181425' });

  drawTomb(x, y, c) {
    // big tombstone with the unfortunate human's details
    const w = 76, h = 84;
    rect(x + 4, y + h - 2, w - 8, 4, '#3e8948');
    for (let i = 0; i < w; i += 3) rect(x + i, y + h - 4 - (i % 2), 2, 3, '#63c74d');
    rect(x + 6, y + 8, w - 12, h - 10, '#5a6988');
    ellipse(x + w / 2, y + 12, (w - 12) / 2, 12, '#5a6988');
    rect(x + 8, y + 10, w - 16, h - 14, '#8b9bb4');
    ellipse(x + w / 2, y + 13, (w - 16) / 2, 10, '#8b9bb4');
    rect(x + 9, y + 12, 2, h - 20, '#c0cbdc');
    text('R.I.P.', x + w / 2, y + 12, { align: 'center', color: '#3a4466' });
    const nameLines = wrapText(c.name, w - 20, 'small');
    nameLines.forEach((ln, i) => text(ln, x + w / 2, y + 26 + i * 7, { font: 'small', align: 'center', color: '#262b44' }));
    const ly = y + 28 + nameLines.length * 7;
    rect(x + 18, ly, w - 36, 1, '#5a6988');
    text(fmtClock(c.life), x + w / 2, ly + 4, { font: 'small', align: 'center', color: '#3a4466' });
    // tiny portrait of the deceased
    const pc = playerVariant(c.look, 'stand', 'dead', null, false);
    spr(null, x + w / 2, ly + 14 + 10, { canvas: pc, anchor: 'c' });
    // flowers
    spr('flower', x + 2, y + h - 10);
    spr('flower', x + w - 10, y + h - 9);
  },
};

function fmtClock(sec) {
  const m = Math.floor(sec / 60), s = Math.floor(sec % 60), cs = Math.floor((sec % 1) * 100);
  return 'AGE ' + (m ? m + ':' : '') + String(s).padStart(m ? 2 : 1, '0') + '.' + String(cs).padStart(2, '0') + 's';
}

function zoneLabel(z) {
  if (z === 'secret') return 'SECRET';
  return ZONES[z] ? ZONES[z].name : z.toUpperCase();
}

      for (let x = 0; x < w; x++) {
        const h = 22 + noise(x * 0.012 + 100) * 26;
        rect(x, 150 - h, 1, h + 40, '#3e2731');
      }
      // dead tree on the hill
      const tx = 84, ty = 150 - (22 + noise(84 * 0.012 + 100) * 26);
      rect(tx, ty - 30, 3, 32, '#181425');
      line(tx + 1, ty - 20, tx - 12, ty - 34, '#181425'); line(tx + 1, ty - 22, tx - 11, ty - 35, '#181425');
      line(tx + 2, ty - 26, tx + 14, ty - 40, '#181425'); line(tx + 2, ty - 27, tx + 13, ty - 41, '#181425');
      line(tx - 6, ty - 28, tx - 9, ty - 40, '#181425'); line(tx + 9, ty - 34, tx + 20, ty - 35, '#181425');
      // crows
      for (const [cx, cy] of [[tx - 11, ty - 36], [tx + 13, ty - 42]]) { rect(cx - 1, cy - 2, 3, 2, '#181425'); px(cx + 2, cy - 2, '#feae34'); }
    });
    // graveyard ground
    this.ground = mk((w) => {
      rect(0, 146, w, 34, '#262b44');
      for (let x = 0; x < w; x += 2) rect(x, 145 - ((x * 7) % 3 === 0 ? 1 : 0), 2, 2, '#3a4466');
      const r = mulberry32(9);
      // fence
      for (let x = 4; x < w; x += 7) { rect(x, 126, 2, 20, '#181425'); px(x, 125, '#181425'); }
      rect(0, 131, w, 1, '#181425'); rect(0, 140, w, 1, '#181425');
      // tombstones of the fallen
      for (let x = 10; x < w - 10; x += 22 + Math.floor(r() * 18)) {
        const kind = Math.floor(r() * 3), hgt = 12 + Math.floor(r() * 8);
        const c1 = '#5a6988', c2 = '#8b9bb4';
        if (kind === 0) { rect(x, 146 - hgt, 10, hgt, c1); ellipse(x + 5, 146 - hgt, 5, 3, c1); rect(x + 1, 146 - hgt + 1, 2, hgt - 2, c2); rect(x + 3, 146 - hgt + 4, 5, 1, '#3a4466'); }
        else if (kind === 1) { rect(x + 4, 146 - hgt, 3, hgt, c1); rect(x, 146 - hgt + 3, 11, 3, c1); px(x + 4, 146 - hgt, c2); }
        else { rect(x, 146 - hgt + 4, 12, hgt - 4, c1); rect(x + 2, 146 - hgt + 2, 8, 2, c1); rect(x + 1, 146 - hgt + 5, 2, hgt - 6, c2); }
        // grass tufts
        rect(x - 1, 145, 1, 1, '#3e8948'); rect(x + 11, 144, 1, 2, '#3e8948');
      }
    });
    const rs = mulberry32(5);
    for (let i = 0; i < 70; i++) this.stars.push({ x: Math.floor(rs() * W), y: Math.floor(rs() * 70), p: rs() * TAU, s: rs() < 0.15 ? 2 : 1 });
  },
  draw(t, scroll) {
    if (!this.built) this.build();
    const g = Gfx.g;
    g.drawImage(this.sky, 0, 0);
    for (const s of this.stars) {
      const tw = Math.sin(t * 2 + s.p);
      if (tw > -0.3) {
        px(s.x, s.y, tw > 0.7 ? '#ffffff' : '#c0cbdc');
        if (s.s === 2 && tw > 0.8) { px(s.x - 1, s.y, '#8b9bb4'); px(s.x + 1, s.y, '#8b9bb4'); px(s.x, s.y - 1, '#8b9bb4'); px(s.x, s.y + 1, '#8b9bb4'); }
      }
    }
    // drifting clouds
    for (let i = 0; i < 4; i++) {
      const cx = ((i * 97 + t * (4 + i)) % (W + 80)) - 40, cy = 30 + i * 13;
      ellipse(cx, cy, 16 + i * 3, 3, '#b55088'); ellipse(cx + 6, cy - 2, 9, 3, '#f6757a');
    }
    const sc = (c, p) => { const w = c.width - W; g.drawImage(c, -Math.round((scroll * p) % w), 0); };
    sc(this.far, 0.2);
    sc(this.near, 0.45);
    sc(this.ground, 1);
    // ground fog: soft drifting lens shapes
    for (let i = 0; i < 5; i++) {
      const fx = ((i * 83 + t * (5 + i)) % (W + 140)) - 70;
      const fy = 134 + (i % 3) * 4;
      dither(fx + 10, fy, 50, 1, '#c0cbdc', 2);
      dither(fx, fy + 1, 70, 2, '#c0cbdc', 3);
      dither(fx + 8, fy + 3, 54, 1, '#c0cbdc', 2);
    }
    // fireflies / lost souls
    for (let i = 0; i < 9; i++) {
      const fx = (i * 37 + Math.sin(t * 0.7 + i) * 18 + t * 3) % W;
      const fy = 112 + Math.sin(t * 1.3 + i * 2) * 10 + (i % 3) * 7;
      if (Math.sin(t * 3 + i * 1.7) > -0.2) { px(fx, fy, '#fee761'); if (Math.sin(t * 3 + i * 1.7) > 0.7) { px(fx - 1, fy, '#feae34'); px(fx + 1, fy, '#feae34'); } }
    }
  },
};

// ------------------------------------------------------------ the logo
function drawLogo(x, y, t, drop = 0, fallRot = 0) {
  const g = Gfx.g;
  g.save();
  g.translate(Math.round(x), Math.round(y + drop + Math.sin(t * 1.6) * 1.5));
  if (fallRot) g.rotate(fallRot);
  // "ONE MILLION" with a bouncy wave
  const l1 = 'ONE MILLION';
  const s1 = 2;
  const w1 = textWidth(l1, 'big', s1);
  const wave = (i) => Math.sin(t * 3 + i * 0.6) * 0.9;
  text(l1, -Math.floor(w1 / 2), -46, { scale: s1, color: '#ffffff', outline: '#181425', shadow: '#68386c', wave });
  // "DEATHS" huge, with a hot gradient
  const l2 = 'DEATHS';
  const s2 = 4;
  const w2 = textWidth(l2, 'big', s2);
  const x2 = -Math.floor(w2 / 2), y2 = -18;
  for (const [dx, dy] of [[0, 4], [2, 4], [-2, 4], [0, 6]]) text(l2, x2 + dx, y2 + dy, { scale: s2, color: '#3e2731' });
  text(l2, x2, y2, { scale: s2, color: '#181425', outline: '#181425' });
  const cols = ['#fee761', '#feae34', '#f77622', '#e43b44', '#a22633'];
  const bands = [[0, 8], [8, 8], [16, 6], [22, 6], [28, 8]];
  bands.forEach(([by, bh], b) => {
    g.save();
    g.beginPath(); g.rect(x2 - 4, y2 + by, w2 + 8, bh); g.clip();
    text(l2, x2, y2, { scale: s2, color: cols[b] });
    g.restore();
  });
  // a glint that sweeps across now and then
  const shine = (t * 70) % 420 - 40;
  if (shine > -10 && shine < w2 + 10) {
    g.save(); g.beginPath();
    g.moveTo(x2 + shine, y2 - 2); g.lineTo(x2 + shine + 6, y2 - 2); g.lineTo(x2 + shine - 8, y2 + 30); g.lineTo(x2 + shine - 14, y2 + 30);
    g.closePath(); g.clip();
    text(l2, x2, y2, { scale: s2, color: '#ffffff' });
    g.restore();
  }
  // goo dripping off the letters (x offsets line up with the bottom strokes)
  const drips = [[8, 0.0], [34, 0.37], [50, 0.71], [82, 0.19], [113, 0.55], [128, 0.9]];
  for (const [dx, ph] of drips) {
    const cyc = (t * 0.35 + ph) % 1;
    const len = Math.floor(ease.inQuad(Math.min(1, cyc * 1.4)) * 9);
    const bx = x2 + dx, by = y2 + 28;
    rect(bx, by, 3, len, '#a22633'); rect(bx + 1, by, 1, len, '#e43b44');
    if (len > 1) circle(bx + 1, by + len, 1.5, '#a22633');
    if (cyc > 0.72) { const fy = by + 9 + (cyc - 0.72) * 90; rect(bx + 1, fy, 1, 2, '#e43b44'); }
  }
  g.restore();
}

// ------------------------------------------------------------ attract mode (demo human dying on the title)
const Attract = {
  x: -20, y: 146, look: null, state: 'walk', t: 0, fx: null, prop: null, kind: null, ghostY: 0,
  kinds: ['anvil', 'piano', 'bolt', 'ufo', 'safe', 'meteor', 'cow', 'hole', 'balloon'],
  reset() { this.x = -20; this.look = randomLook(); this.state = 'walk'; this.t = 0; this.kind = choice(this.kinds); this.target = rand(40, 280); this.prop = null; },
  update(dt) {
    if (!this.look) this.reset();
    this.t += dt;
    if (this.state === 'walk') {
      this.x += 26 * dt;
      if (this.x >= this.target) { this.state = 'doom'; this.t = 0; }
    } else if (this.state === 'doom') {
      if (this.t > 1.6) { this.state = 'dead'; this.t = 0; this.ghostY = 0; }
    } else if (this.state === 'dead') {
      if (this.t > 2.4) { this.state = 'gone'; this.t = 0; }
    } else if (this.state === 'gone') {
      if (this.t > 1.2) this.reset();
    }
  },
  draw(titleDrop) {
    if (!this.look) return;
    const t = this.t;
    const k = this.kind;
    const walkFrame = Math.floor(Game.t * 8) % 4;
    if (this.state === 'walk') {
      const c = playerVariant(this.look, walkFrame === 1 ? 'walk1' : walkFrame === 3 ? 'walk2' : 'stand', 'normal', null, false);
      spr(null, this.x, this.y, { canvas: c, anchor: 'bc' });
      return;
    }
    if (this.state === 'doom') {
      const c = playerVariant(this.look, 'stand', t > 0.5 ? 'scared' : 'look_up', null, false);
      if (k === 'hole') {
        const g = Gfx.g;
        ellipse(this.x, this.y, 8, 2, '#181425');
        g.save(); g.beginPath(); g.rect(0, 0, W, this.y); g.clip();
        spr(null, this.x, this.y + Math.max(0, t - 0.7) * Math.max(0, t - 0.7) * 300, { canvas: c, anchor: 'bc' });
        g.restore();
        if (t > 0.6 && t < 0.65) Sound.play('whistle', 1);
        return;
      }
      if (k === 'balloon') {
        const up = Math.max(0, t - 0.3) * 40;
        spr(null, this.x, this.y - up, { canvas: c, anchor: 'bc' });
        for (let i = 0; i < 5; i++) { const bx = this.x - 8 + i * 4, by = this.y - up - 34 - (i % 2) * 4; line(this.x, this.y - up - 12, bx, by + 3, '#c0cbdc'); circle(bx, by, 3, ['#e43b44', '#fee761', '#0099db', '#63c74d', '#b55088'][i]); }
        return;
      }
      spr(null, this.x, this.y, { canvas: c, anchor: 'bc' });
      if (k === 'bolt') { if (t > 1.2) { bolt(this.x + 10, 0, this.x, this.y - 12); dither(0, 0, W, H, '#ffffff', 3); } return; }
      if (k === 'ufo') {
        const uy = Math.min(40, t * 60);
        spr(Math.floor(Game.t * 10) % 2 ? 'ufo1' : 'ufo2', this.x, uy, { anchor: 'bc' });
        return;
      }
      const name = { anvil: 'anvil', piano: 'piano', safe: 'safe', meteor: 'meteor', cow: 'cow' }[k];
      const s = sprSize(name);
      const fy = -s.h + Math.max(0, t - 0.9) * Math.max(0, t - 0.9) * 700;
      shadowAt(this.x, this.y, Math.min(s.w / 2, t * 10), 6);
      spr(name, this.x, Math.min(fy + s.h, this.y), { anchor: 'bc' });
      if (fy + s.h >= this.y - 2 && !this.hit) { this.hit = true; }
      return;
    }
    if (this.state === 'dead') {
      if (t < 0.05 && !this.sfxDone) { this.sfxDone = true; }
      const ghostY = this.y - 8 - t * 22;
      const c = playerVariant(this.look, 'stand', 'dead', k === 'bolt' ? 'char' : null, false);
      if (k === 'hole') { ellipse(this.x, this.y, 8, 2, '#181425'); }
      else if (k === 'ufo') { spr(Math.floor(Game.t * 10) % 2 ? 'ufo1' : 'ufo2', this.x + t * 200, 40 - t * 30, { anchor: 'bc' }); return; }
      else if (k === 'balloon') {
        spr('p_star', this.x + 10, 20 + Math.sin(t * 5), { anchor: 'c', alpha: t < 1.5 ? 1 : 0 });
        return;
      } else if (k === 'bolt') { spr(null, this.x, this.y, { canvas: c, anchor: 'bc' }); }
      else {
        const name = { anvil: 'anvil', piano: 'piano', safe: 'safe', meteor: 'meteor', cow: 'cow' }[k];
        spr(null, this.x, this.y, { canvas: c, anchor: 'bc', sx: 1.8, sy: 0.16 });
        spr(name, this.x, this.y, { anchor: 'bc' });
      }
      spr('ghost', this.x + Math.sin(t * 4) * 3, ghostY, { anchor: 'bc', alpha: Math.max(0, 0.85 - t * 0.3) });
      spr('halo', this.x + Math.sin(t * 4) * 3, ghostY - 15, { anchor: 'bc', alpha: Math.max(0, 0.85 - t * 0.3) });
    }
  },
};

    text('SOUND ON  ♪', W / 2, 132, { font: 'small', align: 'center', color: '#8b9bb4' });
  },

SCENES.title = {
  items: ['PLAY', 'DEATHDEX', 'OPTIONS', 'CREDITS'],
  enter() {
    this.t = 0;
    this.sel = 0;
    this.splash = choice(SPLASHES);
    this.drop = 0; this.dropV = 0; this.dropping = false; this.clicks = 0;
    Music.play('title');
    Attract.reset();
    this.items[0] = Game.save.total > 0 ? 'CONTINUE' : 'PLAY';
  },
  itemRect(i) { return { x: W / 2 - 50, y: 92 + i * 12, w: 100, h: 11 }; },
  update(dt) {
    this.t += dt;
    Attract.update(dt);
    const n = this.items.length;
    if (Input.pressed.up) { this.sel = (this.sel + n - 1) % n; Sound.play('blip'); }
    if (Input.pressed.down) { this.sel = (this.sel + 1) % n; Sound.play('blip'); }
    for (let i = 0; i < n; i++) {
      const r = this.itemRect(i);
      if (Input.mouse.moved && Input.hoverIn(r.x, r.y, r.w, r.h) && this.sel !== i) { this.sel = i; Sound.play('blip'); }
      if (Input.clickIn(r.x, r.y, r.w, r.h)) { this.sel = i; this.choose(); return; }
    }
    // clicking the logo too many times makes it fall
    if (Input.clickIn(W / 2 - 75, 8, 150, 62) && !this.dropping) {
      this.clicks++;
      Sound.play('bonk');
      if (this.clicks >= 10) { this.dropping = true; this.dropV = 0; Sound.play('whistle', 0.6); }
    }
    if (this.dropping) {
      this.dropV += 500 * dt; this.drop += this.dropV * dt;
      if (this.drop > 60 && !this.landed) {
        this.landed = true; Sound.play('crash'); FX.shake(6, 0.5);
        this.titleDeathT = 0;
      }
    }
    if (this.landed) {
      this.titleDeathT += dt;
      if (this.titleDeathT > 1.2 && !this.recorded) {
        this.recorded = true;
        const res = Game.recordDeath('title_drop', 0, 1);
        this.dropRes = res;
        Sound.play(res.isNew ? 'fanfare' : 'trombone');
      }
      if (this.titleDeathT > 3.5) { this.dropping = false; this.landed = false; this.recorded = false; this.drop = 0; this.clicks = 0; }
    }
    if (Input.pressed.confirm && this.t > 0.2) this.choose();
    FX.update(dt);
  },
  choose() {
    const it = this.items[this.sel];
    Sound.play('select');
    if (it === 'PLAY' || it === 'CONTINUE') Game.startPlaying();
    else if (it === 'DEATHDEX') Game.setScene('dex', 'title');
    else if (it === 'OPTIONS') Game.setScene('options', 'title');
    else if (it === 'CREDITS') Game.setScene('credits');
  },
  draw() {
    const t = this.t;
    const [sx, sy] = FX.offset();
    const g = Gfx.g;
    g.save(); g.translate(-sx, -sy);
    TitleBG.draw(Game.t, Game.t * 8);
    Attract.draw();
    // logo
    drawLogo(W / 2, 56, Game.t, this.drop, this.landed ? 0.12 : 0);
    if (this.landed && this.titleDeathT > 0.3) {
      spr('ghost', 150 + Math.sin(this.titleDeathT * 4) * 3, 130 - this.titleDeathT * 20, { anchor: 'bc', alpha: 0.8 });
      if (this.recorded) text(this.dropRes.isNew ? 'NEW DEATH: TITLE DROP!' : 'TITLE DROP (AGAIN)', W / 2, 88, { align: 'center', color: '#fee761', outline: '#181425' });
    }
    // splash text
    if (!this.dropping) {
      const bounce = Math.round(Math.abs(Math.sin(Game.t * 4)) * -2);
      text(this.splash, W / 2, 78 + bounce, { font: 'small', align: 'center', color: Math.floor(Game.t * 4) % 2 ? '#fee761' : '#ffffff', outline: '#3e2731' });
    }
    // menu
    if (!this.dropping) {
      const top = this.itemRect(0).y - 4, bot = this.itemRect(this.items.length - 1).y + 14;
      rect(W / 2 - 54, top, 108, bot - top, 'rgba(24,20,37,0.55)');
      rect(W / 2 - 52, top - 1, 104, 1, 'rgba(24,20,37,0.55)'); rect(W / 2 - 52, bot, 104, 1, 'rgba(24,20,37,0.55)');
      for (let i = 0; i < this.items.length; i++) {
        const r = this.itemRect(i);
        const sel = i === this.sel;
        const label = this.items[i];
        const bob = sel ? Math.round(Math.sin(Game.t * 6)) : 0;
        if (sel) {
          const w = textWidth(label, 'big') + 20;
          rect(W / 2 - w / 2, r.y - 1 + bob, w, 11, 'rgba(24,20,37,0.7)');
          spr('skull', W / 2 - w / 2 - 4, r.y + bob);
          spr('skull', W / 2 + w / 2 - 3, r.y + bob);
        }
        text(label, W / 2, r.y + 1 + bob, { align: 'center', color: sel ? '#fee761' : '#c0cbdc', outline: '#181425' });
      }
    }
    g.restore();
    // footer: odometer of doom
    const tot = String(Math.min(Game.save.total, 9999999)).padStart(7, '0');
    const label = '/1,000,000';
    const lw = textWidth(label, 'small');
    const ox = W - 6 - lw - 4 - tot.length * 7;
    rect(ox - 3, H - 15, tot.length * 7 + 5, 13, '#181425'); rect(ox - 3, H - 15, tot.length * 7 + 5, 1, '#3a4466');
    for (let i = 0; i < tot.length; i++) {
      rect(ox + i * 7, H - 13, 6, 9, i >= tot.length - 3 ? '#a22633' : '#262b44');
      text(tot[i], ox + i * 7 + 3, H - 11, { font: 'small', align: 'center', color: i < tot.length - 3 ? '#c0cbdc' : '#ffffff' });
    }
    text(label, W - 5, H - 11, { font: 'small', align: 'right', color: '#c0cbdc', outline: '#181425' });
    text('DEATHS', ox - 6, H - 11, { font: 'small', align: 'right', color: '#f6757a', outline: '#181425' });
    text('FOUND ' + Game.foundCount() + '/' + deathIds().length, 4, H - 11, { font: 'small', color: '#fee761', outline: '#181425' });
    if (Game.save.finished) text('★ ONE MILLION ACHIEVED ★', W / 2, 142, { font: 'small', align: 'center', color: Math.floor(Game.t * 3) % 2 ? '#fee761' : '#ffffff', outline: '#181425' });
    FX.drawPops(0, 0);
    FX.drawFlash();
  },
};

SCENES.play = {

// ------------------------------------------------------------ pause
SCENES.pause = {
  enter(arg, prev) {
    if (prev === 'play' || !this.items) { this.sel = 0; }
    this.t = 0;
    this.confirmQuit = false;
    this.travel = false;
  },
  list() {
    if (this.travel) {
      return ZONE_ORDER.filter((z) => Game.save.unlocked[z] && ZONES[z]).map((z) => ({ label: ZONES[z].name, zone: z })).concat([{ label: 'BACK', back: true }]);
    }
    return [
      { label: 'RESUME', id: 'resume' }, { label: 'DEATHDEX', id: 'dex' }, { label: 'TRAVEL', id: 'travel' },
      { label: 'OPTIONS', id: 'options' }, { label: 'JUST DIE', id: 'die' }, { label: 'QUIT TO TITLE', id: 'quit' },
    ];
  },
  update(dt) {
    this.t += dt;
    const items = this.list();
    const n = items.length;
    if (this.sel >= n) this.sel = 0;
    if (Input.pressed.up) { this.sel = (this.sel + n - 1) % n; Sound.play('blip'); }
    if (Input.pressed.down) { this.sel = (this.sel + 1) % n; Sound.play('blip'); }
    let clicked = -1;
    for (let i = 0; i < n; i++) {
      const r = { x: W / 2 - 60, y: 58 + i * 13, w: 120, h: 12 };
      if (Input.mouse.moved && Input.hoverIn(r.x, r.y, r.w, r.h)) this.sel = i;
      if (Input.clickIn(r.x, r.y, r.w, r.h)) clicked = i;
    }
    if ((Input.pressed.back || Input.pressed.pause) && this.t > 0.1) {
      if (this.travel) { this.travel = false; this.sel = 2; return; }
      Game.setScene('play'); Sound.play('back'); return;
    }
    if (clicked >= 0) this.sel = clicked;
    if ((Input.pressed.confirm || clicked >= 0) && this.t > 0.1) {
      const it = items[this.sel];
      Sound.play('select');
      if (this.travel) {
        if (it.back) { this.travel = false; this.sel = 2; return; }
        Game.setScene('play');
        if (it.zone !== World.zoneId) World.beginTransition(it.zone, null);
        return;
      }
      if (it.id === 'resume') Game.setScene('play');
      else if (it.id === 'dex') Game.setScene('dex', 'pause');
      else if (it.id === 'travel') { this.travel = true; this.sel = 0; }
      else if (it.id === 'options') Game.setScene('options', 'pause');
      else if (it.id === 'die') { Game.setScene('play'); World.startDeath('menu_death', null); }
      else if (it.id === 'quit') { Game.persist(); Game.setScene('title'); }
    }
  },
  draw() {
    World.draw();
    dither(0, 0, W, H, '#181425', 11);
    text(this.travel ? 'TRAVEL TO...' : 'PAUSED', W / 2, 30, { scale: 2, align: 'center', color: '#fee761', outline: '#181425', shadow: '#a22633' });
    const items = this.list();
    items.forEach((it, i) => {
      const sel = i === this.sel;
      const y = 58 + i * 13;

SCENES.dex = {
  enter(from) {
    this.from = from || 'title';
    this.t = 0;
    this.tabs = ZONE_ORDER.filter((z) => ZONES[z]).concat(['secret']);
    const cur = World.zoneId && this.tabs.includes(World.zoneId) ? World.zoneId : this.tabs[0];
    this.tab = Math.max(0, this.tabs.indexOf(cur));
    this.sel = 0;
  },
  ids() { return zoneDeaths(this.tabs[this.tab]); },
  cols: 8,
  cell(i) { const c = i % this.cols, r = Math.floor(i / this.cols); return { x: 24 + c * 35, y: 44 + r * 30, w: 32, h: 27 }; },
  back() {
    Sound.play('back');
    if (this.from === 'pause') Game.setScene('pause');
    else if (this.from === 'play') Game.setScene('play');
    else if (this.from === 'card') Game.setScene('play');
    else Game.setScene('title');
  },
  update(dt) {
    this.t += dt;
    const ids = this.ids();
    const n = ids.length;
    const cols = this.cols;
    const switchTab = (d) => { this.tab = (this.tab + d + this.tabs.length) % this.tabs.length; this.sel = 0; Sound.play('blip'); };
    if (Input.pressed.back || (Input.pressed.dex && this.t > 0.2)) { this.back(); return; }
    if (Input.pressed.left) { if (this.sel % cols === 0) switchTab(-1); else { this.sel--; Sound.play('blip'); } }
    if (Input.pressed.right) { if (this.sel % cols === cols - 1 || this.sel === n - 1) switchTab(1); else { this.sel++; Sound.play('blip'); } }
    if (Input.pressed.up && this.sel - cols >= 0) { this.sel -= cols; Sound.play('blip'); }
    if (Input.pressed.down && this.sel + cols < n) { this.sel += cols; Sound.play('blip'); }
    // tabs by mouse
    const tw = Math.floor((W - 16) / this.tabs.length);
    for (let i = 0; i < this.tabs.length; i++) if (Input.clickIn(8 + i * tw, 24, tw - 2, 12)) { this.tab = i; this.sel = 0; Sound.play('blip'); }
    for (let i = 0; i < n; i++) {
      const c = this.cell(i);
      if ((Input.mouse.moved || Input.mouse.clicked) && Input.hoverIn(c.x, c.y, c.w, c.h)) { if (this.sel !== i) Sound.play('blip'); this.sel = i; }
    }
    if (Input.clickIn(4, 2, 40, 14)) this.back();
    this.sel = clamp(this.sel, 0, Math.max(0, n - 1));
  },
  draw() {
    gradientV(0, 0, W, H, ['#181425', '#262b44', '#3a4466'], Gfx.g, 4);
    for (let i = 0; i < 20; i++) px((i * 53) % W, (i * 29) % 40, '#5a6988');
    text('DEATHDEX', W / 2, 5, { scale: 2, align: 'center', color: '#fee761', outline: '#181425', shadow: '#a22633' });
    text('← BACK', 6, 6, { font: 'small', color: '#8b9bb4' });
    const total = deathIds().length, found = Game.foundCount();
    text(found + '/' + total, W - 6, 6, { font: 'small', align: 'right', color: '#ffffff' });
    rect(W - 60, 13, 54, 3, '#181425'); rect(W - 60, 13, Math.round(54 * found / total), 3, '#e43b44');
    // tabs
    const tw = Math.floor((W - 16) / this.tabs.length);
    this.tabs.forEach((z, i) => {
      const x = 8 + i * tw, act = i === this.tab;
      const ids = zoneDeaths(z);
      const f = ids.filter((id) => Game.save.found[id]).length;
      const unlocked = z === 'secret' || Game.save.unlocked[z];
      rect(x, 24, tw - 2, 13, act ? '#a22633' : '#262b44');
      const label = unlocked ? (z === 'secret' ? 'SECRET' : ZONES[z].short || z.toUpperCase()) : '???';
      text(label, x + (tw - 2) / 2, 26, { font: 'small', align: 'center', color: act ? '#ffffff' : unlocked ? '#c0cbdc' : '#5a6988' });
      text(f + '/' + ids.length, x + (tw - 2) / 2, 32, { font: 'small', align: 'center', color: f === ids.length && ids.length ? '#63c74d' : act ? '#f6757a' : '#5a6988' });
      if (z === 'secret') { /* nothing */ }
    });
    // grid
    const ids = this.ids();
    ids.forEach((id, i) => {
      const c = this.cell(i);
      const d = DEATHS[id];
      const got = !!Game.save.found[id];
      const sel = i === this.sel;
      rect(c.x, c.y, c.w, c.h, sel ? '#fee761' : '#181425');
      rect(c.x + 1, c.y + 1, c.w - 2, c.h - 2, got ? '#3a4466' : '#262b44');
      // mini tombstone
      const tx = c.x + 5, ty = c.y + 4;
      rect(tx, ty + 3, 22, 18, got ? '#8b9bb4' : '#3a4466'); ellipse(tx + 11, ty + 4, 11, 4, got ? '#8b9bb4' : '#3a4466');
      if (got) {
        dexIcon(d.icon, tx + 11, ty + 12, 18, 14);
      } else {
        text('?', tx + 11, ty + 7, { align: 'center', color: '#5a6988' });
      }
      text(String(deathNumber(id)).padStart(3, '0'), c.x + c.w - 2, c.y + c.h - 6, { font: 'small', align: 'right', color: got ? '#ffffff' : '#5a6988', outline: '#181425' });
    });
    if (!ids.length) text('NOTHING HERE YET', W / 2, 90, { align: 'center', color: '#8b9bb4' });
    // detail panel
    const id = ids[this.sel];
    rect(0, 136, W, 44, '#181425'); rect(0, 136, W, 1, '#5a6988');
    if (id) {
      const d = DEATHS[id];
      const got = Game.save.found[id];
      if (got) {
        text(d.title, 8, 141, { color: '#fee761' });
        text('x' + got, W - 8, 141, { font: 'small', align: 'right', color: '#f6757a' });
        textBlock(d.desc, 8, 153, W - 16, { color: '#c0cbdc', lineHeight: 10 });
      } else {
        text('???', 8, 141, { color: '#5a6988' });
        textBlock('HINT: ' + d.hint, 8, 153, W - 16, { color: '#8b9bb4', lineHeight: 10 });
      }
    }
  },
};

// fit an icon sprite into a box (integer downscale keeps it crisp-ish)
function dexIcon(name, cx, cy, maxW, maxH) {
  if (!name || !SPR[name]) { spr('skull', cx, cy, { anchor: 'c' }); return; }
  const s = sprSize(name);
  let k = Math.min(1, maxW / s.w, maxH / s.h);
  if (k < 1) k = k >= 0.5 ? 0.5 : k >= 0.34 ? 1 / 3 : 0.25;
  spr(name, cx, cy, { anchor: 'c', sx: k, sy: k });
}

      { label: 'MUSIC: ' + (s.music ? 'ON' : 'OFF'), id: 'music' },

  update(dt) {
    this.t += dt;
    const items = this.items();
    const n = items.length;
    if (Input.pressed.up) { this.sel = (this.sel + n - 1) % n; Sound.play('blip'); this.confirmWipe = false; }
    if (Input.pressed.down) { this.sel = (this.sel + 1) % n; Sound.play('blip'); this.confirmWipe = false; }
    let clicked = -1;
    for (let i = 0; i < n; i++) {
      const r = { x: W / 2 - 80, y: 56 + i * 14, w: 160, h: 12 };
      if (Input.mouse.moved && Input.hoverIn(r.x, r.y, r.w, r.h)) this.sel = i;
      if (Input.clickIn(r.x, r.y, r.w, r.h)) clicked = i;
    }
    if (Input.pressed.back) { this.leave(); return; }
    if (clicked >= 0) this.sel = clicked;
    if ((Input.pressed.confirm || clicked >= 0) && this.t > 0.1) {
      const it = items[this.sel];
      const s = Game.save;
      Sound.play('select');
      if (it.id === 'music') { s.music = !s.music; Sound.musicOn = s.music; Sound.applyVolumes(); }
      else if (it.id === 'sfx') { s.sfx = !s.sfx; Sound.sfxOn = s.sfx; Sound.applyVolumes(); }
      else if (it.id === 'shake') { s.shake = !s.shake; FX.shakeEnabled = s.shake; FX.shake(4, 0.3); }
      else if (it.id === 'full') {
        try {
          if (document.fullscreenElement) document.exitFullscreen();
          else document.documentElement.requestFullscreen().catch(() => {});
        } catch (e) { /* not allowed here */ }
      } else if (it.id === 'wipe') {
        if (!this.confirmWipe) this.confirmWipe = true;
        else { Game.resetSave(); this.confirmWipe = false; Sound.play('explode'); FX.flash('#e43b44', 0.3); }
      } else if (it.id === 'back') { this.leave(); return; }
      Game.persist();
    }
  },
  leave() { Sound.play('back'); Game.setScene(this.from === 'pause' ? 'pause' : 'title'); },
  draw() {
    if (this.from === 'pause') { World.draw(); dither(0, 0, W, H, '#181425', 12); }
    else { TitleBG.draw(Game.t, Game.t * 8); dither(0, 0, W, H, '#181425', 10); }
    text('OPTIONS', W / 2, 26, { scale: 2, align: 'center', color: '#fee761', outline: '#181425', shadow: '#a22633' });
    this.items().forEach((it, i) => {
      const sel = i === this.sel;
      const y = 56 + i * 14;
      if (sel) rect(W / 2 - 80, y - 1, 160, 11, it.id === 'wipe' && this.confirmWipe ? '#e43b44' : '#a22633');
      text(it.label, W / 2, y + 1, { align: 'center', color: sel ? '#ffffff' : '#c0cbdc', outline: '#181425' });
    });
    FX.drawFlash();
  },
};

// ------------------------------------------------------------ THE ENDING: the Million Machine
SCENES.ending = {
  enter() {
    this.t = 0;
    this.phase = 'intro';
    this.start = Game.save.total;
    this.count = this.start;
    this.target = 1000000;
    this.humans = [];
    this.ghosts = [];
    this.spawnAcc = 0;
    this.stampT = 0;
    this.fireworks = [];
    this.finalLook = World.P ? World.P.look : randomLook();
    this.finalName = World.P ? World.P.name : Game.currentName();
    this.boomed = false;
    FX.clear();
    Music.stop();
    Sound.play('rumble');
    if (!ZONES.heaven._built) { ZONES.heaven.layers = ZONES.heaven.build(ZONES.heaven); ZONES.heaven._built = true; }
  },
  mx: 150,
  update(dt) {
    this.t += dt;
    const t = this.t;
    FX.update(dt);
    const hopX = this.mx - 2;
    if (this.phase === 'intro') {
      if (t > 2.5) { this.phase = 'run'; Sound.play('engine'); }
    } else if (this.phase === 'run') {
      const u = clamp((t - 2.5) / 12, 0, 1);
      const f = (Math.exp(6 * u) - 1) / (Math.exp(6) - 1);
      this.count = Math.min(this.target - 1, Math.floor(this.start + (this.target - 1 - this.start) * f));
      const rate = 1.5 + u * u * 40;
      this.spawnAcc += dt * rate;
      while (this.spawnAcc > 1 && this.humans.length < 40) { this.spawnAcc -= 1; this.humans.push({ x: -10 - rand(20), look: randomLook(), speed: 40 + u * 260 }); }
      FX.shake(1 + u * 4, 0.1);
      if (u >= 1) { this.phase = 'last'; this.lastT = t; this.humans = []; this.count = this.target - 1; Sound.play('denied'); }
    } else if (this.phase === 'last') {
      const k = t - this.lastT;
      if (!this.lastHuman) this.lastHuman = { x: -10, look: this.finalLook, speed: 28, last: true };
      if (k > 0.2 && !this.said) { this.said = true; Sound.play('talk'); }
      if (this.lastHuman) {
        this.lastHuman.x += this.lastHuman.speed * dt;
        if (this.lastHuman.x >= hopX) { this.lastHuman = null; this.kachunk(true); this.phase = 'boom'; this.boomT = t; }
      }
    } else if (this.phase === 'boom') {
      if (!this.boomed) {
        this.boomed = true;
        this.count = this.target;
        Game.save.total = Math.max(Game.save.total, this.target);
        Game.save.finished = true;
        Game.persist();
        FX.flash('#ffffff', 0.6); FX.shake(10, 1);
        Sound.play('bigboom'); Sound.play('fanfare');
        FX.confetti(this.mx + 48, 100, 120);
        setTimeout(() => Music.play('ending'), 900);
      }
      if (t - this.boomT > 2.2) this.phase = 'congrats';
    }
    // conveyor people
    for (let i = this.humans.length - 1; i >= 0; i--) {
      const h = this.humans[i];
      h.x += h.speed * dt;
      if (h.x >= hopX) { this.humans.splice(i, 1); this.kachunk(false); }
    }
    for (const g of this.ghosts) { g.y -= g.vy * dt; g.x += Math.sin(t * 3 + g.p) * 10 * dt; }
    this.ghosts = this.ghosts.filter((g) => g.y > -20);
    if (this.stampT > 0) this.stampT -= dt;
    // fireworks after the boom
    if (this.phase === 'boom' || this.phase === 'congrats') {
      if (Math.random() < dt * 3) {
        const x = rand(30, W - 30), y = rand(20, 80);
        FX.burst(x, y, 30, { type: 'px', colors: [choice(['#e43b44', '#fee761', '#63c74d', '#2ce8f5', '#b55088', '#ffffff'])], speed: 70, speedMin: 30, life: 1.2, grav: 40, drag: 1.5, size: 1 });
        Sound.play('pop');
      }
    }
    if (this.phase === 'congrats' && t - this.boomT > 3.5 && (Input.anyPressed)) {
      Sound.play('select');
      Game.setScene('credits', 'ending');
    }
  },
  kachunk(last) {
    this.stampT = 0.12;
    if (Math.random() < (last ? 1 : 0.5)) Sound.play('hammer');
    if (this.ghosts.length < 30 || last) this.ghosts.push({ x: this.mx + 76, y: 150 - 92, vy: rand(20, 40), p: rand(TAU) });
    if (last) { FX.shake(6, 0.4); Sound.play('crash'); }
  },
  draw() {
    const t = this.t;
    const g = Gfx.g;
    const [sx, sy] = FX.offset();
    g.save(); g.translate(-sx, -sy);
    const z = ZONES.heaven;
    g.drawImage(z._sky, 0, 0);
    drawClouds(t, 0, { n: 7, y: 20, h: 90, c2: '#fee761', speed: 6 });
    rect(0, 150, W, 30, '#ffffff');
    for (let x = 0; x < W; x += 18) { circle(x + 9, 150, 10, '#ffffff'); circle(x + 4, 156, 7, '#c0cbdc'); }
    // conveyor belt
    rect(0, 146, this.mx + 4, 5, '#3a4466'); rect(0, 146, this.mx + 4, 1, '#8b9bb4');
    const belt = Math.floor(t * (this.phase === 'run' ? 60 + 400 * clamp((t - 2.5) / 12, 0, 1) : 20)) % 8;
    for (let x = -8 + belt; x < this.mx; x += 8) rect(x, 148, 3, 1, '#5a6988');
    for (let x = 6; x < this.mx; x += 24) { circle(x, 152, 3, '#262b44'); px(x, 152, '#8b9bb4'); }
    // humans marching to their doom
    for (const h of this.humans) {
      const c = playerVariant(h.look, Math.floor(t * 10 + h.x) % 2 ? 'walk1' : 'walk2', 'happy', null, false);
      spr(null, h.x, 146, { canvas: c, anchor: 'bc' });
    }
    if (this.lastHuman) {
      const h = this.lastHuman;
      const c = playerVariant(h.look, Math.floor(t * 6) % 2 ? 'walk1' : 'walk2', 'normal', null, false);
      spr(null, h.x, 146, { canvas: c, anchor: 'bc' });
      text(this.finalName, h.x, 116, { font: 'small', align: 'center', color: '#181425' });
      const msg = 'Well... here goes!';
      const w = textWidth(msg) + 8;
      rect(h.x - w / 2, 100, w, 13, '#181425'); rect(h.x - w / 2 + 1, 101, w - 2, 11, '#ffffff');
      text(msg, h.x, 103, { align: 'center', color: '#181425' });
    }
    // the machine (with a pounding stamp)
    const power = this.phase === 'intro' ? clamp(t / 2.5, 0, 1) : 1;
    if (this.phase !== 'boom' && this.phase !== 'congrats') {
      drawMillionMachine(this.mx, 150 + (this.stampT > 0 ? 2 : 0), t, this.count, power);
      const sy2 = 150 - 60 + (this.stampT > 0 ? 10 : 0);
      rect(this.mx + 2, sy2 - 20, 6, 20, '#8b9bb4');
      rect(this.mx - 2, sy2, 14, 6, '#3a4466');
    } else {
      // what's left of the machine
      rect(this.mx + 8, 138, 80, 12, '#3e2731');
      for (let i = 0; i < 6; i++) FX.smoke(this.mx + 10 + i * 14, 138, 0);
      if (Math.random() < 0.2) FX.smoke(this.mx + rand(10, 80), 136, 1, '#5a6988');
    }
    for (const gh of this.ghosts) { spr('ghost', gh.x, gh.y, { alpha: 0.8 }); spr('halo', gh.x + 5, gh.y - 3, { alpha: 0.8 }); }
    FX.draw();
    g.restore();
    // captions
    if (this.phase === 'intro') {
      text('THE MILLION MACHINE', W / 2, 20, { scale: 2, align: 'center', color: '#fee761', outline: '#181425', shadow: '#a22633' });
      text('FUELLED BY ' + Game.foundCount() + ' WAYS TO DIE', W / 2, 42, { font: 'small', align: 'center', color: '#181425' });
    }
    if (this.phase === 'run' || this.phase === 'last') {
      const s = String(fmtNum(this.count));
      rect(W / 2 - 70, 8, 140, 24, '#181425'); rect(W / 2 - 68, 10, 136, 20, '#3a0e16');
      text(s, W / 2, 12, { scale: 2, align: 'center', color: '#ff0044' });
      text('DEATHS', W / 2, 34, { font: 'small', align: 'center', color: '#181425' });
      if (this.phase === 'last') text('JUST ONE MORE...', W / 2, 44, { align: 'center', color: '#a22633', outline: '#ffffff' });
    }
    if (this.phase === 'congrats' || this.phase === 'boom') {
      const k = ease.outBack(clamp((t - this.boomT) / 0.6, 0, 1));
      const y = Math.round(lerp(-40, 16, k));
      text('1,000,000', W / 2, y, { scale: 3, align: 'center', color: '#fee761', outline: '#181425', shadow: '#a22633', wave: (i) => Math.sin(t * 5 + i * 0.7) * 1 });
      text('DEATHS!', W / 2, y + 30, { scale: 2, align: 'center', color: '#ffffff', outline: '#181425', shadow: '#a22633' });
      if (this.phase === 'congrats') {
        const s = Game.save;
        const lines = [
          'CONGRATULATIONS! YOU HAVE DIED ONE MILLION TIMES.',
          'THAT IS MORE THAN ANYONE, EVER. PROBABLY.',
          '',
          'WAYS TO DIE FOUND: ' + Game.foundCount() + ' / ' + deathIds().length,
          'LONGEST LIFE: ' + fmtTime(s.longest || 0),
          'TIME PLAYED: ' + fmtTime(s.playTime || 0),
        ];
        rect(20, 84, W - 40, 64, 'rgba(24,20,37,0.8)');
        lines.forEach((ln, i) => text(ln, W / 2, 88 + i * 9, { font: 'small', align: 'center', color: i < 2 ? '#fee761' : '#ffffff' }));
        if (t - this.boomT > 3.5 && Math.floor(t * 2) % 2) text('PRESS ANY KEY', W / 2, 160, { align: 'center', color: '#181425', outline: '#ffffff' });
      }
    }
    FX.drawPops(0, 0);
    FX.drawFlash();
  },
};

  'DOLORES', 'HANK', 'IRMA', 'LLOYD', 'MAVIS', 'NED', 'OPAL', 'PERCY', 'RHONDA', 'STAN', 'TRUDY', 'VERN', 'WANDA', 'BORIS',
  'AGNES', 'CLIFF', 'DENISE', 'ELMER', 'FLO', 'GORDON', 'HAZEL', 'IGOR', 'JUNE', 'KARL', 'LOIS', 'MARV', 'NORA', 'OTIS',
  'PEGGY', 'RALPH', 'SHIRLEY', 'TED', 'URSULA', 'VINCE', 'YOLANDA', 'BOB', 'DAVE', 'SUE', 'JIM', 'PAT', 'FRANK', 'MARGE'];

const Game = {
  scene: null,
  sceneName: '',
  save: null,
  t: 0,
  scenes: {},

  newSave() {
    return {
      v: 1, name: choice(NAMES), total: 0, found: {}, zone: 'home', unlocked: { home: true }, announced: {},
      music: true, sfx: true, shake: true, finished: false, playTime: 0, longest: 0, shortest: null, titleClicks: 0,
    };
  },

  load() {
    const s = Store.load();
    this.save = Object.assign(this.newSave(), s || {});
    // forget deaths that no longer exist (older saves)
    for (const id in this.save.found) if (!DEATHS[id]) delete this.save.found[id];
    Sound.musicOn = this.save.music;
    Sound.sfxOn = this.save.sfx;
    FX.shakeEnabled = this.save.shake;
  },
  persist() { Store.save(this.save); },
  resetSave() {
    const keep = { music: this.save.music, sfx: this.save.sfx, shake: this.save.shake };
    Store.wipe();
    this.save = Object.assign(this.newSave(), keep);
    this.persist();
    World.P = null;
  },

  foundCount() { let n = 0; for (const id in this.save.found) if (DEATHS[id]) n++; return n; },

  currentName() {
    const n = this.save.total + 1;
    if (n === 1) return this.save.name;
    const r = roman(n);
    return this.save.name + ' ' + (r || '#' + fmtNum(n));
  },

  recordDeath(id, life, multi = 1) {
    const s = this.save;
    const isNew = !s.found[id];
    const before = this.foundCount();
    s.found[id] = (s.found[id] || 0) + 1;
    s.total += multi || 1;
    let unlocked = null;
    const after = this.foundCount();
    for (const z of ZONE_ORDER) {
      if (!s.announced[z] && TOLLS[z] > 0 && before < TOLLS[z] && after >= TOLLS[z]) { unlocked = z; s.announced[z] = true; }
    }
    s.longest = Math.max(s.longest || 0, life || 0);
    s.shortest = s.shortest === null ? life : Math.min(s.shortest, life);
    this.persist();
    return { isNew, total: s.total, found: after, count: s.found[id], unlocked, multi: multi || 1 };
  },

  // ------------------------------------------------------------ scenes
  setScene(name, arg) {
    const prev = this.sceneName;
    this.sceneName = name;
    this.scene = this.scenes[name];
    if (this.scene.enter) this.scene.enter(arg, prev);
  },

  startPlaying() {
    const zone = this.save.zone && ZONES[this.save.zone] ? this.save.zone : 'home';
    if (!World.zone || World.zoneId !== zone || !World.P) {
      World.P = null;
      World.enterZone(zone, null);
    } else {
      Music.play(World.zone.music || 'play');
    }
    this.setScene('play');
  },

  openPause() { Sound.play('back'); this.setScene('pause'); },
  openDex(from) { Sound.play('select'); this.setScene('dex', from); },

  // ------------------------------------------------------------ loop
  init() {
    Gfx.init();
    Input.init();
    this.load();
    this.scenes = SCENES;
    this.setScene('boot');
    let last = performance.now();
    const frame = (now) => {
      const dt = Math.min(0.05, Math.max(0, (now - last) / 1000));
      last = now;
      if (!this.manual) this.step(dt);
      requestAnimationFrame(frame);
    };
    requestAnimationFrame(frame);
    document.addEventListener('visibilitychange', () => {
      if (document.hidden && this.sceneName === 'play' && World.mode === 'play') this.setScene('pause');
    });
    window.addEventListener('pointerdown', (e) => { if (e.pointerType === 'touch') document.body.classList.add('touch'); Gfx.resize(); }, { once: false });
    if (matchMedia('(pointer: coarse)').matches) { document.body.classList.add('touch'); Gfx.resize(); }
  },

  step(dt) {
    this.t += dt;
    Input.update();
    if (Input.pressed.mute) {
      this.save.music = !this.save.music;
      Sound.musicOn = this.save.music; Sound.applyVolumes(); this.persist();
    }
    if (this.sceneName === 'play') this.save.playTime += dt;
    this.scene.update(dt);
    const g = Gfx.g;
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.globalAlpha = 1;
    this.scene.draw();
  },
};

if (document.readyState === 'complete') Game.init(); else window.addEventListener('load', () => Game.init());

</script>
