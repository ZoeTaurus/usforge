    const a = this.aimA;
    pline(g, x, y - 9, x + Math.cos(a) * 9, y - 9 + Math.sin(a) * 9, PAL.black);
    pline(g, x, y - 10, x + Math.cos(a) * 9, y - 10 + Math.sin(a) * 9, PAL.slate);
    if (this.flash > 0) { pcircle(g, x, y - 9, 4, PAL.white); }
    // lifetime bar
    prect(g, x - 6, y + 1, 12, 1, PAL.black); prect(g, x - 6, y + 1, Math.round(12 * this.life / 840), 1, PAL.sky);
  }
}

'use strict';

const G = { save: null };
const MAP_CACHE = new Map();
function getMap(id) {
  if (MAP_CACHE.has(id)) { const m = MAP_CACHE.get(id); MAP_CACHE.delete(id); MAP_CACHE.set(id, m); return m; }
  const m = new GameMap(id);
  MAP_CACHE.set(id, m);
  while (MAP_CACHE.size > 2) MAP_CACHE.delete(MAP_CACHE.keys().next().value);
  return m;
}

function attackHits(at, a) {
  const bx = a.x, by = a.y - (a.bodyY !== undefined ? a.bodyY : Math.min(12, (a.height || 16) * 0.42)) - (a.z || 0) * 0.5, br = a.bodyR || 6;
  switch (at.shape) {
    case 'circle': return dist(at.x, at.y, bx, by) <= at.r + br;
    case 'arc': {
      const d = dist(at.x, at.y, bx, by);
      if (d > at.r + br) return false;
      if (d < br + 5) return true;
      const ang = Math.atan2(by - at.y, bx - at.x);
      return Math.abs(angDiff(at.a, ang)) <= at.spread + Math.atan2(br, d);
    }
    case 'line': {
      const vx = at.x2 - at.x, vy = at.y2 - at.y, l2 = vx * vx + vy * vy;
      let t = l2 ? ((bx - at.x) * vx + (by - at.y) * vy) / l2 : 0;
      t = clamp(t, 0, 1);
      return dist(at.x + vx * t, at.y + vy * t, bx, by) <= at.r + br;
    }
    case 'ring': {
      const t = 1 - at.life / at.maxLife;
      const r = lerp(at.r, at.r1, easeOut(t));
      const d = dist(at.x, at.y, bx, by);
      return Math.abs(d - r) <= at.th / 2 + br;
    }
  }
  return false;
}

const World = {
  map: null, ents: [], actors: [], attacks: [], fx: [], hazards: [], player: null,

  processAttacks() {

// difficulty per map (enemy hp/dmg scaling)
const DIFFICULTY = { beach: 1, town: 1.1, cliffs: 1.1, mistwood: 1.3, ironrock: 1.45, fortflint: 1.6, galepoint: 1.75, feast: 1.9, rustbolt: 2.05, echoes: 2.2, smuggler: 2.35, fortress: 2.6 };

// ---------- ambience: lighting, weather, fog ----------

  const t = w.t;

    // drifting cloud shadows (dithered)

      const cx = ((i * 211 + t * 0.12) % (w.map.pxW + 300)) - 150 - cam.x;
      const cy = ((i * 137) % Math.max(1, w.map.pxH)) - cam.y + Math.sin(t * 0.002 + i) * 20;

      for (let y = -30; y <= 30; y += 2) for (let x = -80; x <= 80; x += 2) {

        if (d > 1) continue;
        const px2 = Math.round(cx + x) & ~1, py2 = Math.round(cy + y) & ~1;
        const th = (BAYER4[((py2 >> 1) & 3) * 4 + ((px2 >> 1) & 3)] + 0.5) / 16;

  }
  // darkness + lights (indoor / dusk / night / fog etc.)

  const dark = cfg[0];

    if (!LIGHT_BUF.c) { LIGHT_BUF.c = makeCanvas(W / 2, H / 2); LIGHT_BUF.img = LIGHT_BUF.c.g.createImageData(W / 2, H / 2); LIGHT_BUF.d = new Uint32Array(LIGHT_BUF.img.data.buffer); }

    const addL = (x, y, r, k = 1) => { const sx = x - cam.x, sy = y - cam.y; if (sx > -r && sx < W + r && sy > -r && sy < H + r) lights.push([sx / 2, sy / 2, r / 2, k]); };
    for (const p of w.map.props) {
      if (p.type === 'lamp') addL(p.x, p.y - 26, 46);
      else if (p.anim === 'campfire') addL(p.x, p.y - 6, 60 + Math.sin(t * 0.3) * 3);
      else if (p.anim === 'torch') addL(p.x, p.y - 18, 44 + Math.sin(t * 0.4 + p.x) * 2);
      else if (p.anim === 'candle') addL(p.x, p.y - 5, 34 + Math.sin(t * 0.5) * 2);
      else if (p.type === 'fireplace') addL(p.x, p.y - 12, 78 + Math.sin(t * 0.3) * 3);
      else if (p.type === 'house' && p.house.lit) addL(p.x, p.y - 20, 50);
      else if (p.type === 'lighthouse') addL(p.x, p.y - 76, 80);
      else if (p.type === 'crystal') addL(p.x, p.y - 8, 34);
      else if (p.light) addL(p.x, p.y - (p.lightY || 10), p.light);
    }
    const pl = w.player;
    addL(pl.x, pl.y - 8, amb === 'indoor' ? 56 : 64, 0.8);
    for (const e of w.ents) if (e.kind === 'fire' || (e.def && e.def.sprite === 'wisp')) addL(e.x, e.y - 8, 24);
    for (const f of w.fx) if (f.t === 'bolt' && f.life > 6) addL(f.x, f.y, 90, 1.2);
    if (w.map.def.lights) for (const L of w.map.def.lights) addL(L[0] * TS, L[1] * TS, L[2]);
    const d = LIGHT_BUF.d, BW = W / 2, BH = H / 2;
    const base = hexToRgb(cfg[1]);
    // stepped light rings: 4 brightness levels (classic pixel-art lighting), tiny dither on ring edges
    const levels = [dark, dark * 0.62, dark * 0.3, 0];
    const cols = levels.map(a => ((Math.round(a * 255) << 24) | (base[2] << 16) | (base[1] << 8) | base[0]) >>> 0);
    for (let y = 0; y < BH; y++) for (let x = 0; x < BW; x++) {
      let lit = 0;
      for (const L of lights) {
        const dx = x - L[0], dy = (y - L[1]) * 1.15, rr = L[2];
        const q = (dx * dx + dy * dy) / (rr * rr);
        if (q < 1) { lit = Math.max(lit, (1 - q) * L[3]); if (lit >= 1) break; }
      }
      const th = (BAYER4[(y & 3) * 4 + (x & 3)] + 0.5) / 16;
      const lv = Math.min(3, Math.floor(lit * 3.6 + (th - 0.5) * 0.35));
      d[y * BW + x] = cols[Math.max(0, lv)];
    }
    LIGHT_BUF.c.g.putImageData(LIGHT_BUF.img, 0, 0);
    g.drawImage(LIGHT_BUF.c, 0, 0, W, H);
    // warm glow tint around lights
    for (const L of lights) if (L[3] >= 1 && L[2] > 20) { g.globalAlpha = 0.06; pcircle(g, L[0] * 2, L[1] * 2, L[2] * 1.2, PAL.gold); g.globalAlpha = 1; }
  }
  if (amb === 'storm') {
    g.fillStyle = 'rgba(192,203,220,0.55)';
    for (let i = 0; i < 70; i++) {
      const x = (hash2(i, 1, 3) * (W + 60) + t * 3.2 + i * 7) % (W + 60) - 30;
      const y = (hash2(i, 2, 3) * H + t * 6.5 * (0.8 + hash2(i, 5, 3) * 0.4)) % (H + 20) - 10;
      g.fillRect(Math.round(x), Math.round(y), 1, 4); g.fillRect(Math.round(x) - 1, Math.round(y) + 4, 1, 2);
    }
    if (w.lightningT === undefined) w.lightningT = 300;
    if (--w.lightningT <= 0) { w.lightningT = irnd(300, 700); w.flashWhite = 10; setTimeout(() => AudioSys.sfx('thunder'), 250); }
  }
  if (amb === 'fog' || amb === 'ghost' || w.map.def.fog) {
    for (let i = 0; i < 5; i++) {
      const cx = ((i * 173 + t * (0.15 + i * 0.03)) % (W + 240)) - 120, cy = (i * 47 + Math.sin(t * 0.004 + i) * 30) % H;
      for (let y = -24; y <= 24; y += 2) for (let x = -90; x <= 90; x += 2) {
        const dd = (x * x) / 8100 + (y * y) / 576;
        if (dd > 1) continue;
        const px2 = Math.round(cx + x), py2 = Math.round(cy + y);
        if (((px2 >> 1) + (py2 >> 1)) % 2 !== 0 && dd > 0.4) continue;
        g.fillStyle = amb === 'ghost' ? 'rgba(189,246,255,0.10)' : 'rgba(220,230,230,0.12)'; g.fillRect(px2, py2, 2, 2);
      }
    }
  }
  if (w.map.def.embers) {
    for (let i = 0; i < 30; i++) {
      const x = (hash2(i, 7, 1) * W + Math.sin(t * 0.02 + i) * 10) % W;
      const y = H - ((hash2(i, 8, 1) * H + t * 0.5 * (0.5 + hash2(i, 9, 1))) % H);
      g.fillStyle = i % 3 ? PAL.orange : PAL.yellow; g.fillRect(Math.round(x), Math.round(y), 1, 1);
    }
  }
}

'use strict';
// =============================================================
//  Dialogue box + generator-based cutscene scripting
// =============================================================

const NPC_INFO = {}; // filled by story.js: id -> {name, char, blip}

function speakerInfo(who) {
  if (who && typeof who === 'object') return who;
  if (!who || who === 'narr') return { name: null, char: null, blip: 0.9 };
  if (who === 'cap') return { name: G.save ? G.save.capName : 'Rook', char: G.save && G.save.flags.hatEarned ? 'captainHat' : 'captain', blip: 1.05 };
  if (CREW_DEFS[who]) return { name: CREW_DEFS[who].name, char: CREW_DEFS[who].char, blip: CREW_DEFS[who].blip };
  if (NPC_INFO[who]) return NPC_INFO[who];
  return { name: who, char: null, blip: 1 };
}
function fmtText(s) {
  if (!G.save) return s;
  return s.replace(/\{cap\}/g, G.save.capName).replace(/\{crew\}/g, G.save.crewName).replace(/\{CREW\}/g, G.save.crewName.toUpperCase()).replace(/\{CAP\}/g, G.save.capName.toUpperCase());
}

class DialogBox {
  constructor(lines, opts = {}) {
    this.lines = lines; this.i = 0; this.done = false; this.choice = -1; this.t = 0; this.opts = opts;
    this.startLine();
  }
  startLine() {
    const L = this.lines[this.i];
    this.L = L;
    this.info = speakerInfo(L.who);
    this.portrait = this.info.char ? getPortrait(this.info.char, L.expr || 'normal') : null;
    const text = fmtText(L.text);
    const maxW = this.portrait ? 250 : 296;
    this.rows = fixHighlightLines(wrapText(text, maxW));
    if (this.rows.length > 4) this.rows = this.rows.slice(0, 4);
    this.total = this.rows.reduce((s, r) => s + r.replace(/\^/g, '').length, 0);
    this.shown = 0; this.pause = 0; this.choosing = false; this.sel = 0; this.lt = 0;
    this.shake = L.shake ? 12 : 0;
    if (L.sfx) AudioSys.sfx(L.sfx);
    if (L.onShow) L.onShow();
  }
  update() {
    this.t++; this.lt++;
    if (this.shake > 0) this.shake--;
    const L = this.L;
    if (this.choosing) {
      if (this.choiceRect) for (const tp of Touch.taps) {
        const r = this.choiceRect;
        L.choices.forEach((o, i) => { if (tp.x >= r.x && tp.x <= r.x + r.w && tp.y >= r.y + 4 + i * 11 && tp.y < r.y + 15 + i * 11) { this.sel = i; this.choice = i; AudioSys.sfx('select'); this.next(); } });
        if (this.choice >= 0) return;
      }
      if (Input.nav('up')) { this.sel = (this.sel + L.choices.length - 1) % L.choices.length; AudioSys.sfx('move'); }
      if (Input.nav('down')) { this.sel = (this.sel + 1) % L.choices.length; AudioSys.sfx('move'); }
      if (Input.pressed('confirm')) { this.choice = this.sel; AudioSys.sfx('select'); this.next(); }
      return;
    }
    if (this.shown < this.total) {
      if (Input.pressed('confirm') && this.lt > 3) { this.shown = this.total; return; }
      if (this.pause > 0) { this.pause--; return; }
      const speed = L.slow ? 0.5 : 1.5;
      const before = Math.floor(this.shown);
      this.shown = Math.min(this.total, this.shown + speed);
      const after = Math.floor(this.shown);
      if (after > before) {
        const ch = this.charAt(after - 1);
        if (ch && ch !== ' ' && (after % 2 === 0)) AudioSys.sfx('blip', this.info.blip * (0.95 + Math.random() * 0.1));
        if ('.!?'.includes(ch) && after < this.total && this.charAt(after) === ' ') this.pause = 9;
        else if (ch === ',') this.pause = 4;
      }
    } else {
      if (L.choices) { this.choosing = true; return; }
      if (L.auto) { if (this.lt > L.auto) this.next(); return; }
      if (Input.pressed('confirm') || (Input.pressed('back') && this.opts.skippable)) this.next();
    }
  }
  charAt(n) {
    for (const r of this.rows) { const s = r.replace(/\^/g, ''); if (n < s.length) return s[n]; n -= s.length; }
    return null;
  }
  next() {
    this.i++;
    if (this.i >= this.lines.length) { this.done = true; return; }
    this.startLine();
  }
  render(g) {
    const bx = 4, by = H - 54, bw = W - 8, bh = 50;
    const sx = this.shake ? Math.round(rnd(-2, 2)) : 0;
    drawPanel(g, bx + sx, by, bw, bh, 'wood');
    let tx = bx + 9;
    if (this.portrait) {
      drawPanel(g, bx + 4 + sx, by + 4, 44, 44, 'dark');
      g.drawImage(this.portrait, bx + 6 + sx, by + 6);
      tx = bx + 54;
    }
    if (this.info.name) {
      const nw = textWidth(this.info.name) + 12;
      drawPanel(g, tx - 4 + sx, by - 12, nw, 16, 'gold');
      drawText(g, this.info.name, tx + 2 + sx, by - 8, PAL.yellow, { shadow: PAL.black });
    }
    // typed text
    let left = Math.floor(this.shown);
    this.rows.forEach((r, i) => {
      if (left <= 0) return;
      let out = '', vis = 0;
      for (const ch of r) { if (ch === '^') { out += ch; continue; } if (vis >= left) break; out += ch; vis++; }
      left -= vis;
      if ((out.match(/\^/g) || []).length % 2) out += '^';
      drawText(g, out, tx + sx, by + 7 + i * 10, this.info.name ? PAL.beige : PAL.white, { shadow: PAL.black, hl: PAL.gold });
    });
    if (this.shown >= this.total && !this.L.choices && !this.L.auto) {
      if (Math.floor(this.t / 16) % 2 === 0) drawText(g, '▼', bx + bw - 14, by + bh - 12, PAL.gold);
    }
    if (this.choosing) {
      const opts = this.L.choices;
      const cw = Math.max(...opts.map(o => textWidth(fmtText(o)))) + 22, ch = opts.length * 11 + 10;
      const cx = W - cw - 6, cy = by - ch - 4;
      this.choiceRect = { x: cx, y: cy, w: cw, h: ch };
      drawPanel(g, cx, cy, cw, ch, 'paper');
      opts.forEach((o, i) => {
        const sel = i === this.sel;
        if (sel) drawText(g, '▶', cx + 6 + (Math.floor(this.t / 10) % 2), cy + 6 + i * 11, PAL.crimson);
        drawText(g, fmtText(o), cx + 14, cy + 6 + i * 11, sel ? PAL.crimson : PAL.dbrown);
      });
    }
  }
}

// ---------- scripts ----------
class Script {
  constructor(gen, opts = {}) {
    this.gen = gen; this.waitFn = null; this.done = false; this.opts = opts; this.ret = undefined;
    if (opts.cutscene !== false) World.cutscene = true;
    this.step();
  }
  update() {
    if (this.done) return;
    if (this.waitFn) { if (!this.waitFn()) return; this.waitFn = null; }
    this.step();
  }
  step() {
    for (let guard = 0; guard < 200; guard++) {
      let r;
      try { r = this.gen.next(this.ret); }
      catch (e) { console.error('Script error', e); this.finish(); return; }
      this.ret = undefined;
      if (r.done) { this.finish(); return; }
      const v = r.value;
      if (v === undefined || v === null) { let n = 1; this.waitFn = () => --n < 0; return; }
      if (typeof v === 'number') { let n = v; this.waitFn = () => --n <= 0; return; }
      if (typeof v === 'function') { if (v()) continue; this.waitFn = v; return; }
    }
  }
  finish() {
    this.done = true;
    if (this.opts.cutscene !== false) World.cutscene = false;
    World.camTarget = null;
    if (this.opts.onDone) this.opts.onDone();
  }
}
function runScript(genFn, opts) {
  const s = new Script(genFn(), opts);
  if (!s.done) World.script = s;
  return s;
}

// ---------- script helpers (use with yield*) ----------
function* say(who, text, expr, extra) {
  const d = new DialogBox([Object.assign({ who, text, expr }, extra || {})]);
  World.dialog = d;
  yield () => d.done;
}
function* talk(lines) {
  // lines: [[who, text, expr?], ...]
  const d = new DialogBox(lines.map(l => Array.isArray(l) ? { who: l[0], text: l[1], expr: l[2], shake: l[3] === 'shake', sfx: l[4] } : l));
  World.dialog = d;
  yield () => d.done;
}
function* ask(who, text, choices, expr) {
  const d = new DialogBox([{ who, text, expr, choices }]);
  World.dialog = d;
  yield () => d.done;
  return d.choice;
}
function* wait(n) { yield n; }
function* walkTo(actor, tx, ty, speed = 0.9, noclip = false) {
  actor.walkTo = { x: tx, y: ty, speed, noclip };
  yield () => !actor.walkTo || actor.dead;
}
function walkBg(actor, tx, ty, speed = 0.9, noclip = false) { actor.walkTo = { x: tx, y: ty, speed, noclip }; }
function* playerWalk(tx, ty, speed = 1.1) {
  const p = World.player;
  let stuck = 0, best = Infinity;
  yield () => {
    const dx = tx - p.x, dy = ty - p.y, d = Math.hypot(dx, dy);
    if (d <= speed || stuck > 45) { p.x = tx; p.y = ty; p.moving = false; return true; }
    if (d < best - 0.4) { best = d; stuck = 0; } else stuck++;
    p.move(World, dx / d * speed, dy / d * speed, { nudge: true });
    p.moving = true; p.animT++;
    if (Math.abs(dx) > 0.3) p.facing = sign(dx);
    return false;
  };
}
function* camTo(x, y, speed = 0.06, frames = 50) {
  World.camTarget = { x, y, speed };
  yield frames;
}
function camRelease() { World.camTarget = null; }
function* fadeOut(sp = 0.06) { let done = false; Fade.out(() => { done = true; }, sp); yield () => done; }
function* fadeIn(sp = 0.06) { Fade.in(sp); yield () => Fade.level <= 0; }
function* waitFight() { yield () => World.countEnemies() === 0 && !World.enemies().length; }
function* waitBoss(e) { yield () => e.dead || e.defeated || e.hp <= 0 && !e.dying; }
function emote(actor, sym, life) { World.emote(actor, sym, life); }
function npc(id) { return World.actors.find(a => a.npcId === id); }
function crewEnt(id) { return World.actors.find(a => a.crewId === id); }

// banner helpers
function showBanner(text, sub, style = 'area', life = 200) { World.banner = { text, sub, style, t: 0, life }; }
function* bigBanner(text, sub, style = 'recruit', life = 220) {
  World.banner = { text, sub, style, t: 0, life };
  yield life - 30;
}

'use strict';
// =============================================================
//  HUD, banners and in-game menus (pause, crew roster, shop)
// =============================================================

function drawBar(g, x, y, w, h, frac, col, back = PAL.dpurple, hl) {
  g.fillStyle = PAL.black; g.fillRect(x - 1, y - 1, w + 2, h + 2);
  g.fillStyle = back; g.fillRect(x, y, w, h);
  const fw = Math.round(w * clamp(frac, 0, 1));
  g.fillStyle = col; g.fillRect(x, y, fw, h);
  if (hl && fw > 0) { g.fillStyle = hl; g.fillRect(x, y, fw, 1); }
}
function coinIcon(g, x, y) { prect(g, x, y + 1, 5, 5, PAL.black); prect(g, x + 1, y, 3, 7, PAL.black); prect(g, x + 1, y + 1, 3, 5, PAL.gold); px(g, x + 1, y + 1, PAL.yellow); px(g, x + 2, y + 1, PAL.yellow); }

const SKILL_ICONS = {};
function skillIcon(id) {
  if (SKILL_ICONS[id]) return SKILL_ICONS[id];
  const b = new PixelBuf(14, 14);
  if (id === 'whirl') { for (let i = 0; i < 40; i++) { const a = i * 0.4, r = 1 + i * 0.14; b.set(Math.round(7 + Math.cos(a) * r), Math.round(7 + Math.sin(a) * r), i > 20 ? PAL.white : PAL.lblue); } }
  if (id === 'dash') { b.line(2, 7, 11, 7, PAL.white); b.line(8, 4, 11, 7, PAL.white); b.line(8, 10, 11, 7, PAL.white); b.line(2, 4, 6, 4, PAL.lblue); b.line(2, 10, 6, 10, PAL.lblue); }
  if (id === 'tide') { for (let x = 1; x < 13; x++) { const y = Math.round(8 + Math.sin(x * 0.9) * 2); b.set(x, y, PAL.white); b.set(x, y + 1, PAL.cyan); b.set(x, y + 2, PAL.sky); } b.line(7, 1, 7, 5, PAL.yellow); b.set(6, 4, PAL.yellow); b.set(8, 4, PAL.yellow); }
  return SKILL_ICONS[id] = b.toCanvas();
}

function renderHUD(g, w) {
  if (w.hideHud) return;

  const cut = w.cutscene;

  if (!cut || w.lock) {
    drawPanel(g, 2, 2, 104, 30, 'dark');
    g.drawImage(p.F.icon, 5, 5);
    const hpF = p.hp / p.maxHp;
    drawBar(g, 22, 6, 58, 5, hpF, hpF < 0.3 && (w.t % 20 < 10) ? PAL.orange : PAL.red2, PAL.dpurple, PAL.salmon);
    drawText(g, Math.ceil(p.hp) + '', 83, 4, PAL.white, { shadow: PAL.black });
    drawBar(g, 22, 14, 58, 3, p.sp / p.maxSp, PAL.cyan, PAL.navy, PAL.white);
    coinIcon(g, 22, 21);
    drawText(g, String(G.save.gold), 30, 21, PAL.gold, { shadow: PAL.black });
    // skills
    let sx = 60;
    SKILLS.forEach((S, i) => {
      if (!p.skillUnlocked(i)) return;
      const ok = p.sp >= S.cost;
      const ic = skillIcon(S.id);
      g.globalAlpha = ok ? 1 : 0.4; g.drawImage(ic, sx, 18); g.globalAlpha = 1;
      if (!Touch.enabled) drawText(g, S.key, sx + 11, 24, ok ? PAL.yellow : PAL.dgray, { shadow: PAL.black });
      sx += 15;
    });
    // --- crew row (top right) ---

  // --- objective (bottom-left) ---

    w.objT = (w.objT || 0) + 1;

    drawPanel(g, 2, oy, tw, 16, flash ? 'gold' : 'paper'); // tall enough for descenders (g, y, p)
    drawText(g, '\u25B6', 7, oy + 4, flash ? PAL.yellow : PAL.crimson);
    drawText(g, obj, 14, oy + 4, flash ? PAL.yellow : PAL.dbrown);
  }
  // --- boss bar ---
  if (w.boss && !w.boss.dead) {
    const b = w.boss;

    if (b.def.title) drawText(g, b.def.title, bx + bw, by - 9, PAL.lgray, { align: 'right', shadow: PAL.black });
    w.bossShown = w.bossShown === undefined ? b.hp : lerp(w.bossShown, b.hp, 0.08);
    drawBar(g, bx, by, bw, 5, w.bossShown / b.maxHp, PAL.salmon, PAL.dpurple);
    drawBar(g, bx, by, bw, 5, b.hp / b.maxHp, b.phase2 ? PAL.orange : PAL.red2, 'rgba(0,0,0,0)', PAL.salmon);
  } else w.bossShown = undefined;
  // --- banner ---
  if (w.banner && !(w.dialog && (w.banner.style || 'area') === 'area')) renderBanner(g, w.banner);
  // --- touch hint ---
}

function renderBanner(g, b) {
  const life = b.life || 200;
  const t = b.t;
  const a = t < 20 ? t / 20 : t > life - 30 ? (life - t) / 30 : 1;
  if (a <= 0) return;
  if (b.style === 'area' || !b.style) {
    const y = 44;
    const tw = textWidth(b.text, 2);
    const off = Math.round((1 - a) * 12);
    dimFill(g, 0, y - 6, W, 34, PAL.black, 0.5 * a);
    g.fillStyle = PAL.gold; g.fillRect(Math.round(W / 2 - tw / 2 - 20 + off), y + 21, Math.round((tw + 40) * a), 1);
    drawText(g, b.text, W / 2, y + off * 0, PAL.white, { align: 'center', scale: 2, outline: PAL.black });
    if (b.sub) drawText(g, b.sub, W / 2, y + 24, PAL.beige, { align: 'center', shadow: PAL.black });
  } else if (b.style === 'recruit' || b.style === 'skill' || b.style === 'chapter' || b.style === 'victory') {
    const col = b.style === 'recruit' ? PAL.gold : b.style === 'skill' ? PAL.cyan : b.style === 'victory' ? PAL.yellow : PAL.white;
    const y = 58;
    dimFill(g, 0, y - 12, W, 56, PAL.black, 0.62 * a);
    g.fillStyle = col; g.fillRect(0, y - 12, W, 1); g.fillRect(0, y + 43, W, 1);
    const sc = textWidth(b.text, 2) > W - 20 ? 1 : 2;
    const pop = t < 12 ? 1 + (12 - t) / 24 : 1;
    drawText(g, b.text, W / 2, y + (sc === 1 ? 6 : 0), col, { align: 'center', scale: sc, outline: PAL.black });
    if (b.sub) drawText(g, b.sub, W / 2, y + 24, PAL.white, { align: 'center', shadow: PAL.black });
    // sparkles
    for (let i = 0; i < 8; i++) {
      const sx = (hash2(i, 1, 9) * W + t * (i % 2 ? 0.5 : -0.5)) % W;
      const sy = y - 8 + hash2(i, 2, 9) * 48;

// ---------------- helpers ----------------
const F = () => G.save.flags;
function setFlag(k, v = true) { G.save.flags[k] = v; }
function tileXY(x, y) { return [x * TS, y * TS]; }
function spawnEnemy(type, tx, ty, opts = {}) {
  const w = World;
  const sp = w.findFree(tx * TS, ty * TS, 10, 5);
  const e = new Enemy(sp.x, sp.y, type, Object.assign({ aggro: true, diff: w.diff, spawnFx: true }, opts));
  w.addEnt(e);
  FX.poof(w, e.x, e.y - 6, PAL.lgray);
  return e;
}
function lockArena(rects) { World.map.dyn = rects.map(r => ({ x: r[0] * TS, y: r[1] * TS, w: r[2] * TS, h: r[3] * TS, on: true })); World.lock = { on: true }; }
function unlockArena() { World.map.dyn = []; World.lock = null; }
function* fight(list, opts = {}) {
  const w = World;
  if (opts.music !== false) AudioSys.music(opts.music || 'battle');
  const made = [];
  for (const item of list) {
    const [type, tx, ty, o] = item;
    made.push(spawnEnemy(type, tx, ty, o));
    if (opts.stagger) yield opts.stagger;
  }
  w.cutscene = false;
  const extra = opts.also || [];
  yield () => made.every(e => e.dead || e.defeated) && extra.every(e => e.dead || e.defeated);
  w.cutscene = true;
  if (opts.music !== false && w.player.alive) {
    // second wind: catch your breath between waves
    const p = w.player;
    if (p.hp < p.maxHp) p.heal(w, Math.round(p.maxHp * 0.25));
    p.sp = Math.min(p.maxSp, p.sp + 30);
  }
  return made;
}
function* bossFight(type, tx, ty, opts = {}) {
  const w = World;
  const e = opts.entity || spawnEnemy(type, tx, ty, { spawnFx: !opts.noFx });
  e.aggro = true;
  w.boss = e;
  AudioSys.music(opts.music || 'boss');
  w.cutscene = false;
  yield () => e.dead || e.defeated;
  w.cutscene = true;
  // clean up leftover minions
  for (const a of w.actors) if (a.team === 'enemy' && a !== e && !a.dead) { a.dying = true; a.dieT = 0; a.dropMul = 0; }
  w.boss = null;
  return e;
}
function checkpoint(spawn) {
  if (spawn) G.save.spawn = spawn;
  saveGame();
}
function* victory(text = 'VICTORY!') {
  AudioSys.jingle('victory');

}
function recruit(id, fromNpc) {
  const w = World;
  if (!G.save.crew.includes(id)) G.save.crew.push(id);
  setFlag('rec_' + id);
  let x = w.player.x, y = w.player.y, face = 1;
  if (fromNpc) { x = fromNpc.x; y = fromNpc.y; face = fromNpc.facing; fromNpc.dead = true; }
  const old = w.actors.find(a => a.crewId === id);
  if (old) { old.guest = false; old.slot = G.save.crew.indexOf(id); saveGame(); return old; }
  const c = new Crew(id, x, y, { slot: G.save.crew.indexOf(id) });
  c.facing = face;
  w.addEnt(c);
  saveGame();
  return c;
}

function* learnSkill(id) {

function hideNpcs(ids) { for (const a of World.actors) if (a instanceof NPC && (!ids || ids.includes(a.npcId))) a.hidden = true, a.dead = true; }
function crewAll() { return World.actors.filter(a => a.isCrew); }

const STORY = {
  ambientFor(id) {
    if (id === 'galepoint') return recruited('wren') ? 'day' : 'storm';
    if (id === 'echoes') return recruited('lyra') ? 'night' : 'ghost';
    return null;
  },
  objective() {
    const f = F();
    const isl = ISLAND_STORY[World.mapId];
    if (isl && isl.objective) { const o = isl.objective(); if (o) return o; }
    if (!f.beachAmbush) return 'Head north up the jungle road';
    if (!f.townArrived) return 'Reach Barnacle Bay (north)';
    if (!f.rec_silas) return 'Find a crew at the tavern';
    if (!f.trainingDone) return World.mapId === 'cliffs' ? 'Complete Silas\'s training' : 'Train with Silas on the Windy Cliffs (east)';
    if (!f.grittDefeated) return 'Hurry! Save Barnacle Bay!';
    if (!f.hasShip) return 'Talk to the Harbor Master';
    for (const is of ISLANDS) { if (is.who && islandUnlocked(is) && !f['rec_' + is.who]) return 'Sail to ' + is.name + ' (ship at the pier)'; }
    if (!f.blackmawDefeated) return 'Sail to Blackmaw\'s Fortress!';
    return 'You are the strongest pirate!';
  },
  musicFor(id) {
    const f = F();
    if (id === 'town' && f.trainingDone && !f.grittDefeated) return 'battle';
    return (ISLAND_STORY[id] && ISLAND_STORY[id].music && ISLAND_STORY[id].music()) || MAPS[id].music;
  },
  npcVisible(mapId, id) {
    const f = F();
    if (mapId === 'tavern' && id === 'silas') return !f.rec_silas;
    if (mapId === 'town' && f.trainingDone && !f.grittDefeated) return false;
    if (ISLAND_STORY[mapId] && ISLAND_STORY[mapId].npcVisible) return ISLAND_STORY[mapId].npcVisible(id);
    return true;
  },
  crewHidden(id) { return false; },
  canExit(w, ex) {
    const f = F();
    if (w.mapId === 'town' && f.trainingDone && !f.grittDefeated) return false;
    if (w.mapId === 'cliffs' && f.rec_silas && !f.trainingDone) return false;
    return true;
  },
  onMapLoad(w, id, spawn, opts) {
    const f = F();
    // ship at the pier after it's been given
    if (id === 'town' && f.hasShip) addShipAtPier(w);
    if (ISLAND_STORY[id] && ISLAND_STORY[id].onLoad) { ISLAND_STORY[id].onLoad(w, spawn, opts); }
    if (id === 'beach' && opts.intro && !f.introDone) runScript(beachIntro);
    else if (id === 'town' && !f.townArrived) runScript(townArrival);
    else if (id === 'town' && f.trainingDone && !f.grittDefeated) runScript(townAttack);
    else if (id === 'cliffs' && f.rec_silas && !f.trainingDone) runScript(training);
    else if (id === 'tavern' && !f.tavernIntro) runScript(tavernIntro);
  },
  trigger(w, id) {
    const f = F();
    if (id === 'campAmbush' && !f.beachAmbush && !w.script) runScript(campAmbush);
    if (ISLAND_STORY[w.mapId] && ISLAND_STORY[w.mapId].trigger) ISLAND_STORY[w.mapId].trigger(w, id);
  },
  talk(w, n) {
    const fn = (ISLAND_STORY[w.mapId] && ISLAND_STORY[w.mapId].talk && ISLAND_STORY[w.mapId].talk[n.npcId]) || TALK[n.npcId];
    n.talking = true;
    const done = () => { n.talking = false; };
    if (fn) runScript(() => fn(w, n), { onDone: done });
    else runScript(function* () { yield* say({ name: n.name, char: n.charId, blip: 1 }, 'Ahoy there!'); }, { onDone: done });
  },
  onEnemyDefeated(w, e) { },
};

function addShipAtPier(w, x = 25.5 * TS + 50, y = 3 * TS, ix = 25.5 * TS, iy = 3.6 * TS) {

function* beachIntro() {

function* training() {
  const w = World, p = w.player;
  const s = crewEnt('silas');
  if (!s) return;
  s.frozen = true;
  w.noDeath = true;
  AudioSys.music('adventure');
  yield 20;
  yield* walkTo(s, 18 * TS, 7.5 * TS, 1.3);
  s.facing = -1;
  yield* playerWalk(14 * TS, 11 * TS);
  p.facing = 1;
  yield* talk([
    ['silas', 'This is where the Captain and I used to train. Feel that wind? It keeps you awake.', 'closed'],
    ['cap', 'The view is AMAZING! You can see the whole sea from up here!', 'happy'],
    ['silas', 'Enjoy it later. Lesson one: your blade.', 'normal'],
    ['silas', 'Destroy those training dummies. Chain your swings together - three strikes, then a heavy finisher.', 'normal'],
  ]);
  yield* say('narr', Touch.enabled ? 'Tap ATK repeatedly for a 3-hit combo!' : 'Press J / Z repeatedly for a 3-hit combo! The third hit is a heavy finisher.');
  yield* fight([['dummy', 15, 9, { spawnFx: true }], ['dummy', 18, 12], ['dummy', 21, 9]], { music: false });
  yield 20;
  yield* talk([
    ['silas', 'Sloppy. But there\'s real power in there.', 'smirk'],
    ['silas', 'Lesson two: a pirate who gets hit is a dead pirate. Dodge.', 'normal'],
    ['silas', 'I\'m going to throw stones at you. Roll through them - you can\'t be hurt while rolling.', 'normal'],
  ]);
  yield* say('narr', Touch.enabled ? 'Tap ROLL to dodge-roll through the stones!' : 'Press K, X or Space to dodge-roll. You are invincible during the roll!');
  w.cutscene = false;
  // stone throwing
  let hitsTaken = 0;
  const hpBefore = p.hp;
  for (let i = 0; i < 10; i++) {
    const a = angTo(s.x, s.y, p.x, p.y);
    const pj = new Projectile({ x: s.x, y: s.y - 1, z: 8, vx: Math.cos(a) * 2.6, vy: Math.sin(a) * 2.6, kind: 'ball', team: 'enemy', dmg: 2, kb: 1, owner: s, life: 120, col: PAL.gray });
    pj.onHitActor = (ww, act) => { if (act.hurt(ww, 2, pj.x, pj.y, 1)) hitsTaken++; };
    w.addEnt(pj);
    s.pose = 'attack'; AudioSys.sfx('dodge');
    yield 38 - i * 1.5;
  }
  yield 60;
  w.cutscene = true;
  p.hp = Math.max(p.hp, hpBefore);
  if (hitsTaken <= 2) yield* say('silas', 'Only ' + hitsTaken + ' hits. Not bad at all. You\'ve got good instincts.', 'smirk');
  else yield* say('silas', hitsTaken + ' hits? Blackmaw\'s cannons would have turned you into soup. We\'ll practice more on the road.', 'normal');
  yield* talk([
    ['silas', 'Lesson three. The techniques of the Redtide crew. Watch closely, Captain.', 'normal'],
  ]);
  // demonstration
  s.pose = 'attack';
  FX.slash(w, s, 0, 26, Math.PI, 10, PAL.white); FX.slash(w, s, Math.PI, 26, Math.PI, 10, PAL.lblue); AudioSys.sfx('whirl');
  yield 30;
  yield* learnSkill('whirl');
  yield* say('silas', 'Whirlwind. Spin with your whole body and cut everything around you. Try it on these.', 'normal');
  yield* say('narr', Touch.enabled ? 'Skills use SP (the blue bar). SP refills over time and when you land hits.' : 'Skills use SP (the blue bar under your HP). SP refills over time and when you land hits.');
  const ring = [];
  for (let i = 0; i < 6; i++) { const a = i / 6 * Math.PI * 2; ring.push(['dummy', p.x / TS + Math.cos(a) * 1.7, p.y / TS + Math.sin(a) * 1.3]); }
  yield* fight(ring, { music: false });
  yield 20;
  yield* say('silas', 'Good! Next - the Gale Dash. Cut through your enemies faster than they can blink.', 'smirk');
  yield* learnSkill('dash');
  yield* say('silas', 'Those dummies over there are too far to reach by walking. Dash through them.', 'normal');
  yield* fight([['dummy', 26, 8], ['dummy', 28, 10], ['dummy', 30, 12]], { music: false });
  yield 30;
  yield* talk([
    ['silas', '...Not bad. You learn fast. Almost as fast as he did.', 'smirk'],
    ['silas', 'Final lesson. Come at me with everything you\'ve got.', 'normal'],
    ['cap', 'Wait, you want me to fight YOU?!', 'shock'],
    ['silas', 'Don\'t worry. I\'ll go easy on you.', 'smirk'],
    ['silas', '...Maybe.', 'closed'],
  ]);
  // sparring match
  s.dead = true;
  const spar = spawnEnemy('silasSpar', s.x / TS, s.y / TS, { spawnFx: false });
  spar.dmg = 5;
  yield* bossFight('silasSpar', 0, 0, { entity: spar, music: 'battle', noFx: true });
  yield 20;
  // silas is back to crew form
  spar.dead = true;
  const s2 = recruit('silas');
  s2.x = spar.x; s2.y = spar.y; s2.frozen = true;
  yield* talk([
    ['silas', '...Heh.', 'smirk'],
    ['silas', 'You actually landed some real hits on me. Nobody\'s done that in ten years.', 'happy'],
    ['cap', 'Hehe... you were holding back, weren\'t you?', 'happy'],
    ['silas', 'Kid. If I fought you for real, this cliff would be two cliffs.', 'smirk'],
    ['cap', '...Noted. Never making you angry.', 'shock'],
  ]);
  yield 20;
  // alarm!
  AudioSys.sfx('bell');
  w.shake = 3;
  yield 40;
  AudioSys.sfx('bell');
  const finn = addNPC('sailor', 'sailor', 1, 12.5, 'Sailor Finn', 1);
  finn.scripted = true;
  yield* walkTo(finn, 9 * TS, 12 * TS, 2);
  yield* talk([
    ['sailor', 'SILAS! Kid! Th-there you are! *huff* *huff*', 'shock'],
    ['sailor', 'OUTLAWS are attacking Barnacle Bay! A whole army of them! Their boss is some huge guy with an iron jaw!', 'shock', 'shake'],
    ['cap', 'An iron jaw...? That\'s GRITT! The boss those outlaws were talking about!', 'shock'],
    ['silas', 'Gritt "Rustjaw". He\'s been bullying these islands for years.', 'angry'],
    ['silas', 'Well, Captain? Your first real battle. We fight side by side.', 'normal'],
    ['cap', 'Let\'s GO! Nobody messes with my town!', 'angry', 'shake'],
  ]);
  finn.dead = true;
  s2.frozen = false;
  w.noDeath = false;
  setFlag('trainingDone');
  AudioSys.music('battle');
  saveGame();
}

// ---------------- shared island helpers ----------------
function islandArrive(w, id) {
  const def = MAPS[id];
  if (def.ship) addShipAtPier(w, def.ship.x, def.ship.y, def.ship.use[0] * TS, def.ship.use[1] * TS);
}
function spawnGuest(id, tx, ty) {
  const w = World;
  let c = w.actors.find(a => a.crewId === id);
  if (c) return c;
  c = new Crew(id, tx * TS, ty * TS, { guest: true, slot: G.save.crew.length });
  w.addEnt(c);
  return c;
}
function guestFromNpc(id) {
  const n = npc(id);
  const c = spawnGuest(id, n ? n.x / TS : World.player.x / TS, n ? n.y / TS : World.player.y / TS);
  if (n) { c.facing = n.facing; n.dead = true; }
  return c;
}
function recruited(id) { return G.save.crew.includes(id); }
function* crewReact(lines) { yield* talk(lines.filter(l => recruited(l[0]) || l[0] === 'cap' || !CREW_DEFS[l[0]])); }

'use strict';
// =============================================================
//  Title screen: sunset sea, rookie relaxing on the ship deck
// =============================================================

const TitleArt = {
  built: false,
  build() {
    if (this.built) return;
    this.built = true;
    this.sky = this.buildSky();
    this.ship = this.buildShip();
    this.rookie = [0, 1, 2].map(f => this.buildRookie(f));
    this.rookieHat = [0, 1, 2].map(f => this.buildRookie(f, true));
    this.clouds = [
      this.buildCloud(90, 10, 11), this.buildCloud(60, 7, 23), this.buildCloud(120, 12, 37),
      this.buildCloud(46, 6, 41), this.buildCloud(74, 8, 53),
    ];
    this.logo = this.buildLogo();
  },
  HORIZON: 100,
  buildSky() {
    const c = makeCanvas(W, this.HORIZON + 1), g = c.g;
    const stops = [
      [0, '#1a1730'], [14, PAL.navy], [28, PAL.dpurple], [42, PAL.purple], [56, PAL.magenta],
      [70, PAL.salmon], [84, '#fb9a5b'], [94, PAL.gold], [99, PAL.yellow],
    ];
    // dithered band transitions
    for (let y = 0; y <= this.HORIZON; y++) {
      let i = 0; while (i < stops.length - 2 && y >= stops[i + 1][0]) i++;
      const [y0, c0] = stops[i], [y1, c1] = stops[i + 1];
      const t = clamp((y - y0) / (y1 - y0), 0, 1);
      for (let x = 0; x < W; x++) {
        const th = (BAYER4[(y % 4) * 4 + (x % 4)] + 0.5) / 16;
        g.fillStyle = t > th ? c1 : c0;
        g.fillRect(x, y, 1, 1);
      }
    }
    // sun glow halo (dithered)
    const sx = 104, sy = this.HORIZON - 2;
    for (let y = 40; y <= this.HORIZON; y++) for (let x = 40; x < 170; x++) {
      const d = Math.hypot(x - sx, (y - sy) * 1.25);
      const th = (BAYER4[(y % 4) * 4 + (x % 4)] + 0.5) / 16;
      if (d < 44 && d > 24 && (1 - (d - 24) / 20) * 0.6 > th) { g.fillStyle = y > 82 ? PAL.yellow : '#fb9a5b'; g.fillRect(x, y, 1, 1); }
    }
    // sun disc
    for (let y = sy - 22; y <= this.HORIZON; y++) for (let x = sx - 22; x <= sx + 22; x++) {
      const d = Math.hypot(x - sx, y - sy);
      if (d <= 20) { g.fillStyle = d < 15 ? '#fff6c9' : PAL.yellow; g.fillRect(x, y, 1, 1); }
    }
    // horizontal cloud stripes across sun (retro)
    g.fillStyle = PAL.salmon;
    [[sy - 12, 1], [sy - 6, 1], [sy - 1, 2]].forEach(([yy, hh]) => {
      for (let x = sx - 22; x <= sx + 22; x++) {
        if (Math.hypot(x - sx, yy - sy) <= 20) g.fillRect(x, yy, 1, hh);
      }
    });
    // distant islands
    const isl = (x0, w, h, seed) => {
      const r = mulberry32(seed);
      for (let x = x0; x < x0 + w; x++) {
        const t = (x - x0) / w;
        const hh = Math.round(Math.sin(t * Math.PI) * h + (r() - 0.5) * 1.5);
        g.fillStyle = PAL.dpurple; g.fillRect(x, this.HORIZON - hh, 1, hh + 1);
      }
      // a couple of palm silhouettes
      for (let k = 0; k < 2; k++) {
        const px = x0 + Math.round(w * (0.3 + k * 0.35)), base = this.HORIZON - Math.round(Math.sin((px - x0) / w * Math.PI) * h);
        g.fillStyle = PAL.dpurple;
        for (let j = 0; j < 9; j++) g.fillRect(px + Math.round(j * 0.25 * (k ? -1 : 1)), base - j, 1, 1);
        const tx = px + Math.round(9 * 0.25 * (k ? -1 : 1)), ty = base - 9;
        [[-3, 1], [-2, 0], [-1, 0], [0, 0], [1, 0], [2, 0], [3, 1], [-4, 2], [4, 2], [-1, -1], [1, -1], [0, -1]].forEach(([dx, dy]) => g.fillRect(tx + dx, ty + dy, 1, 1));
      }
    };
    isl(8, 44, 7, 3); isl(232, 30, 5, 9); isl(270, 52, 9, 12);
    return c;
  },
  buildCloud(w, h, seed) {
    const r = mulberry32(seed);
    const b = new PixelBuf(w, h + 2);
    const blobs = [];
    for (let i = 0; i < 6; i++) blobs.push([r() * w * 0.8 + w * 0.1, h * 0.55 + r() * h * 0.3, w * (0.12 + r() * 0.16), h * (0.35 + r() * 0.3)]);
    for (let y = 0; y < h + 2; y++) for (let x = 0; x < w; x++) {
      let inside = false;
      for (const [cx, cy, rx, ry] of blobs) { const dx = (x - cx) / rx, dy = (y - cy) / ry; if (dx * dx + dy * dy <= 1) { inside = true; break; } }
      if (y >= h * 0.72 && x > w * 0.08 && x < w * 0.92) inside = true; // flat bottom
      if (y > h) inside = false;
      if (!inside) continue;
      const t = y / h;
      const th = (BAYER4[(y % 4) * 4 + (x % 4)] + 0.5) / 16;
      let c = PAL.purple;
      if (t > 0.45) c = t - 0.45 > th * 0.3 ? PAL.magenta : PAL.purple;
      if (t > 0.72) c = PAL.salmon;
      if (t > 0.86) c = PAL.gold;
      b.set(x, y, c);
    }
    return b.toCanvas();
  },
  buildShip() {
    // side view ship facing right; canvas 212x152, waterline at y=138, main deck surface y=104
    const b = new PixelBuf(212, 152);
    const WL = 138, DECK = 104;
    const DK = PAL.ddbrown, MID = PAL.dbrown, LT = PAL.brown, HL = PAL.tan;
    const top = x => {
      if (x < 44) return DECK - 18 + Math.max(0, (6 - x) * 0.8);      // raised stern castle
      if (x < 50) return DECK - 18 + (x - 44) * 3;                       // step down
      if (x < 158) return DECK;                                           // main deck
      return DECK - Math.pow((x - 158) / 30, 2) * 16;                      // rising bow
    };
    const bot = x => {
      const t = (x - 4) / 184;
      return 120 + Math.sin(t * Math.PI) * 22 - (x > 160 ? (x - 160) * 1.1 : 0);
    };
    this.shipTop = top;
    for (let x = 4; x <= 188; x++) {
      const y0 = Math.round(top(x)), y1 = Math.min(Math.round(bot(x)), WL + 1);
      for (let y = y0; y <= y1; y++) {
        const rel = y - y0;
        let c = MID;
        if (rel <= 1) c = LT;
        else if (rel === 2) c = HL;
        else if ((y - DECK) % 6 === 0) c = DK;
        else if ((y - DECK) % 6 === 1) c = PAL.brown;
        // plank butt joints
        if ((y - DECK) % 6 > 1 && (x + Math.floor((y - DECK) / 6) * 17) % 34 === 0) c = DK;
        if (y >= WL - 1) c = DK;
        b.set(x, y, c);
      }
    }
    // gold wale
    for (let x = 8; x <= 184; x++) {
      const y = Math.round(top(x)) + 8;
      if (y < bot(x) - 3) { b.set(x, y, PAL.yellow); b.set(x, y + 1, PAL.gold); b.set(x, y + 2, PAL.gold2); }
    }
    // gun ports
    for (let px = 62; px <= 150; px += 22) {
      const y = DECK + 14;
      b.rect(px, y, 9, 8, PAL.gold2); b.rect(px + 1, y + 1, 7, 6, PAL.black); b.rect(px + 1, y + 1, 7, 2, PAL.crimson);
      b.rect(px + 2, y + 4, 5, 2, PAL.slate); // cannon muzzle
    }
    // stern cabin windows (warm light)
    for (let i = 0; i < 4; i++) {
      const wx = 10 + i * 8, wy = DECK - 8;
      b.rect(wx, wy, 6, 7, PAL.gold2); b.rect(wx + 1, wy + 1, 4, 5, PAL.gold); b.rect(wx + 1, wy + 1, 2, 2, '#fff6c9'); b.vline(wx + 3, wy + 1, wy + 5, PAL.gold2);
    }
    // deck surfaces (seen from slightly above)
    const deckStrip = (x0, x1, y0) => {
      for (let x = x0; x <= x1; x++) for (let y = y0 - 5; y < y0; y++) {
        let c = (y === y0 - 5) ? HL : LT;
        if ((x + (y % 2) * 5) % 13 === 0) c = MID;
        b.set(x, y, c);
      }
    };
    deckStrip(50, 170, DECK); deckStrip(4, 44, DECK - 18);
    // far railing
    for (let x = 50; x <= 168; x++) { b.set(x, DECK - 12, MID); b.set(x, DECK - 13, LT); }
    for (let x = 52; x <= 168; x += 7) b.vline(x, DECK - 11, DECK - 6, MID);
    for (let x = 4; x <= 44; x++) { b.set(x, DECK - 30, MID); b.set(x, DECK - 31, LT); }
    for (let x = 6; x <= 44; x += 7) b.vline(x, DECK - 29, DECK - 24, MID);
    // mast
    const mx = 104;
    b.rect(mx, 4, 5, DECK - 4, MID); b.vline(mx, 4, DECK - 1, LT); b.vline(mx + 1, 4, DECK - 1, HL); b.vline(mx + 4, 4, DECK - 1, DK);
    for (let y = 30; y < DECK; y += 18) { b.hline(mx - 1, mx + 5, y, DK); } // mast bands
    // crow's nest
    b.rect(mx - 6, 14, 17, 6, MID); b.hline(mx - 6, mx + 10, 14, HL); b.hline(mx - 6, mx + 10, 19, DK);
    for (let x = mx - 5; x <= mx + 9; x += 3) b.set(x, 16, DK);
    // yards
    b.rect(mx - 36, 26, 77, 3, DK); b.hline(mx - 36, mx + 40, 26, LT);
    // furled top sail on upper yard
    b.rect(mx - 22, 8, 49, 2, DK); b.hline(mx - 22, mx + 26, 8, LT);
    for (let x = mx - 20; x <= mx + 24; x++) { b.set(x, 10, PAL.beige); b.set(x, 11, x % 5 === 0 ? PAL.tan : PAL.beige); }
    // bowsprit
    b.line(180, 90, 211, 74, MID); b.line(180, 91, 211, 75, DK); b.line(180, 89, 211, 73, LT);
    // rigging & ratlines
    b.line(mx + 3, 6, 210, 74, PAL.ddbrown);
    b.line(mx, 6, 6, DECK - 32, PAL.ddbrown);
    b.line(mx, 20, 26, DECK - 32, PAL.ddbrown);
    b.line(mx + 4, 20, 166, DECK - 13, PAL.ddbrown);
    for (let k = 1; k < 7; k++) { const t = k / 7; const x0 = Math.round(lerp(mx, 26, t)), y0 = Math.round(lerp(20, DECK - 32, t)); const x1 = Math.round(lerp(mx, 6, t)), y1 = Math.round(lerp(6, DECK - 32, t)); b.line(x0, y0, x1, y1, PAL.ddbrown); }
    // stern lantern
    b.vline(4, DECK - 50, DECK - 31, DK); b.hline(4, 9, DECK - 50, DK);
    b.rect(7, DECK - 49, 6, 8, PAL.gold2); b.rect(8, DECK - 48, 4, 6, PAL.yellow); b.rect(9, DECK - 47, 2, 2, '#fff6c9');
    // ship's wheel on the stern castle
    const wx = 30, wy = DECK - 27;
    b.circle(wx, wy, 5, MID); b.circle(wx, wy, 3, 0); for (let a = 0; a < 8; a++) { b.set(Math.round(wx + Math.cos(a * Math.PI / 4) * 6), Math.round(wy + Math.sin(a * Math.PI / 4) * 6), LT); }
    b.set(wx, wy, HL); b.vline(wx, wy + 5, DECK - 19, DK);
    // cargo near the bow: barrels, crate, cannon, rope
    const barrel = (x, y) => { b.rect(x, y, 9, 11, PAL.brown); b.vline(x, y, y + 10, PAL.dbrown); b.vline(x + 8, y, y + 10, PAL.dbrown); b.hline(x, x + 8, y + 2, DK); b.hline(x, x + 8, y + 8, DK); b.vline(x + 2, y + 1, y + 9, HL); };
    barrel(140, DECK - 14); barrel(149, DECK - 13);
    b.rect(126, DECK - 11, 11, 9, PAL.tan); b.rect(127, DECK - 10, 9, 7, PAL.brown); b.line(127, DECK - 10, 135, DECK - 4, PAL.tan); b.line(135, DECK - 10, 127, DECK - 4, PAL.tan);
    // deck cannon
    b.rect(160, DECK - 8, 12, 4, PAL.slate); b.hline(160, 171, DECK - 8, PAL.dgray); b.rect(171, DECK - 9, 2, 6, PAL.slate);
    b.circle(162, DECK - 3, 2.2, PAL.dbrown); b.circle(169, DECK - 3, 2.2, PAL.dbrown);
    // coiled rope near the mast
    b.ellipse(117, DECK - 3, 5, 2, PAL.tan); b.ellipse(117, DECK - 3, 3, 1, PAL.beige); b.set(117, DECK - 3, PAL.brown);
    // anchor on the bow hull
    const ax = 168, ay = DECK + 6;
    b.vline(ax, ay, ay + 9, PAL.dgray); b.hline(ax - 2, ax + 2, ay + 1, PAL.dgray); b.line(ax - 4, ay + 6, ax, ay + 10, PAL.dgray); b.line(ax + 4, ay + 6, ax, ay + 10, PAL.dgray); b.set(ax, ay - 1, PAL.lgray);
    b.outline(PAL.black);
    return b.toCanvas();
  },
  buildRookie(frame, hat = false) {
    // Lying on his back on the deck, head to the left resting on one hand, other hand on belly,
    // one knee up with the other leg crossed over it. Parts are outlined separately so they read clearly.
    // frame: 0 rest, 1 breathe in, 2 foot tap
    const Wd = 56, Ht = 30, D = 27; // D = deck contact row
    const out = new PixelBuf(Wd, Ht);
    const O = PAL.black;
    const skin = PAL.skin, skinS = PAL.skin2, vest = PAL.blue, vestS = PAL.navy, shirt = PAL.beige, shirtS = PAL.tan;
    const pants = PAL.tan, pantsS = PAL.brown, boot = PAL.dbrown, bootS = PAL.ddbrown;
    const breath = frame === 1 ? 1 : 0, tap = frame === 2 ? 2 : 0;
    const part = () => new PixelBuf(Wd, Ht);
    const thick = (pb, x0, y0, x1, y1, w, c) => {
      const n = Math.ceil(Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0)) * 2) + 1;
      for (let i = 0; i <= n; i++) { const t = i / n; pb.circle(lerp(x0, x1, t), lerp(y0, y1, t), w / 2, c); }
    };
    const put = pb => { pb.outline(O); out.draw(pb, 0, 0); };
    // --- far arm, tucked behind the head (only the elbow pokes out) ---
    let p = part();
    thick(p, 13, D - 10, 5, D - 20, 3.4, shirt);
    thick(p, 5, D - 20, 8, D - 8, 3, skin);
    thick(p, 6, D - 19, 12, D - 11, 1, shirtS);
    put(p);
    // --- bent leg (knee up), boot flat on the deck ---
    p = part();
    thick(p, 36, D - 6, 42, D - 17, 4.4, pants);
    thick(p, 42, D - 17, 45, D - 5, 3.8, pants);
    thick(p, 43.5, D - 16, 46, D - 5, 1.3, pantsS);
    p.rect(43, D - 5, 8, 5, boot); p.hline(43, 50, D - 1, bootS); p.rect(48, D - 4, 3, 3, boot); p.set(44, D - 4, PAL.brown);
    put(p);
    // --- crossed leg resting over the knee; boot dangles and taps ---
    p = part();
    thick(p, 36, D - 9, 42, D - 18, 4, pants);
    thick(p, 42, D - 18, 49, D - 15 - tap * 0.5, 3.6, pants);
    thick(p, 43, D - 16, 49, D - 13.5 - tap * 0.5, 1.2, pantsS);
    const bx = 49, by = D - 20 - tap;
    p.rect(bx, by + 1, 4, 6, boot); p.rect(bx + 2, by - 1, 3, 4, boot); p.set(bx + 4, by - 1, bootS); p.vline(bx, by + 1, by + 6, bootS); p.set(bx + 1, by + 2, PAL.brown);
    put(p);
    // --- torso ---
    p = part();
    for (let x = 18; x <= 36; x++) {
      const topY = D - 11 - (x > 20 && x < 31 ? breath : 0) + (x < 20 ? 1 : 0) + (x > 33 ? 1 : 0);
      for (let y = topY; y < D; y++) p.set(x, y, y >= D - 2 ? vestS : vest);
    }
    // shirt V-opening (from the neck along the chest)
    for (let x = 18; x <= 27; x++) { const h = Math.max(0, Math.round(3.5 - (x - 18) * 0.38)); for (let k = 0; k < h; k++) p.set(x, D - 10 + (x < 20 ? 1 : 0) - (x > 20 ? breath : 0) + k, k === h - 1 ? shirtS : shirt); }
    // belt + buckle
    for (let y = D - 10; y < D; y++) { p.set(34, y, PAL.ddbrown); p.set(35, y, PAL.ddbrown); }
    p.rect(34, D - 6, 2, 2, PAL.gold);
    // vest lapel detail
    p.line(27, D - 10 - breath, 31, D - 3, vestS);
    put(p);
    // --- head (profile facing the sky: crown left, chin right) ---
    p = part();
    p.ellipse(11.5, D - 8, 7.2, 6.6, skin);
    // neck
    p.rect(17, D - 8, 3, 6, skin); p.set(17, D - 3, skinS); p.set(18, D - 3, skinS);
    // shading on the back of the head (bottom)
    for (let x = 6; x <= 17; x++) { if (p.has(x, D - 2)) p.set(x, D - 2, skinS); }
    // spiky hair around the crown (left) and the back (bottom)
    const hair = PAL.dbrown, hairD = PAL.ddbrown;
    for (let y = D - 14; y <= D - 1; y++) for (let x = 3; x <= 8; x++) {
      if (Math.hypot(x + 0.5 - 11.5, (y + 0.5 - (D - 8)) * 1.08) < 7.4 && x < 8 - Math.max(0, (D - 14 + 3) - y)) p.set(x, y, (x + y) % 3 === 0 ? hairD : hair);
    }
    for (let x = 5; x <= 15; x++) { if (p.has(x, D - 1)) p.set(x, D - 1, hair); }
    [[2, D - 13], [1, D - 11], [2, D - 10], [1, D - 8], [2, D - 7], [1, D - 5], [2, D - 4], [3, D - 2], [4, D - 1]].forEach(([x, y]) => { p.set(x, y, hair); p.set(x + 1, y, hair); });
    [[0, D - 12], [0, D - 9], [0, D - 6], [1, D - 3]].forEach(([x, y]) => p.set(x, y, hairD));
    // bandana across the forehead/crown
    for (let y = D - 15; y <= D - 3; y++) {
      const cx = 7 - (y - (D - 15)) * 0.28;
      for (let x = Math.round(cx) - 1; x <= Math.round(cx) + 1; x++) if (p.has(x, y) || y === D - 15) p.set(x, y, x === Math.round(cx) + 1 ? PAL.crimson : PAL.red2);
    }
    // knot + tails at the back of the head
    p.set(2, D - 2, PAL.red2); p.set(1, D - 1, PAL.red2); p.set(0, D - 1, PAL.crimson); p.set(1, D - 2, PAL.crimson);
    // face along the top edge
    p.set(14, D - 15, skin); p.set(15, D - 15, skin); p.set(14, D - 16, skin);      // nose
    p.hline(10, 12, D - 13, PAL.black); p.set(9, D - 14, PAL.black);                // closed, content eye
    p.hline(9, 11, D - 15, PAL.dbrown);                                               // eyebrow
    p.set(16, D - 13, PAL.skin2); p.set(17, D - 12, PAL.skin2);                      // smile
    p.set(12, D - 11, PAL.salmon); p.set(13, D - 11, PAL.salmon);                    // blush
    p.set(10, D - 8, skinS); p.set(11, D - 8, skinS); p.set(10, D - 7, skinS);       // ear
    put(p);
    // --- near arm resting on the belly ---
    p = part();
    thick(p, 20, D - 4, 29, D - 7 - breath, 3.2, shirt);
    thick(p, 20, D - 3, 28, D - 5.5 - breath, 1, shirtS);
    p.ellipse(31, D - 7.5 - breath, 2.2, 1.8, skin); p.set(32, D - 7 - breath, skinS);
    put(p);
    if (hat) {
      // Redtide's crimson tricorn resting over his face (the classic pirate nap)
      p = part();
      const lift = frame === 1 ? 1 : 0;
      p.ellipse(11.5, D - 14 - lift, 9.5, 2.6, PAL.crimson);
      p.ellipse(11.5, D - 17 - lift, 5.5, 3.6, PAL.crimson);
      p.ellipse(10.5, D - 18 - lift, 3, 1.6, PAL.red2);
      p.hline(3, 20, D - 13 - lift, '#6e1a2a');
      // upturned tricorn corners
      p.set(2, D - 15 - lift, PAL.crimson); p.set(2, D - 16 - lift, PAL.crimson); p.set(3, D - 16 - lift, PAL.red2);
      p.set(21, D - 15 - lift, PAL.crimson); p.set(21, D - 16 - lift, PAL.crimson); p.set(20, D - 16 - lift, PAL.red2);
      p.hline(5, 18, D - 15 - lift, PAL.gold);
      p.set(10, D - 18 - lift, PAL.white); p.set(11, D - 18 - lift, PAL.white); p.set(12, D - 18 - lift, PAL.white); p.set(10, D - 17 - lift, PAL.white); p.set(12, D - 17 - lift, PAL.white);
      put(p);
      return out.toCanvas();
    }
    // --- straw in the mouth ---
    const sy = frame === 1 ? 1 : 0;
    out.line(17, D - 14, 23, D - 22 + sy, PAL.yellow); out.set(23, D - 22 + sy, PAL.gold); out.set(22, D - 21 + sy, PAL.gold);
    out.set(17, D - 13, PAL.gold);
    return out.toCanvas();
  },
  buildLogo() {
    const txt1 = 'PIRATE', txt2 = 'MADNESS', S = 3;
    const w1 = textWidth(txt1, S), w2 = textWidth(txt2, S);
    const w = Math.max(w1, w2) + 16, h = 9 * S * 2 + 14;
    const mk = (txt, bands) => {
      const tw = textWidth(txt, S);
      const c = makeCanvas(tw, 9 * S);
      drawText(c.g, txt, 0, 0, '#fff', { scale: S });
      c.g.globalCompositeOperation = 'source-atop';
      bands.forEach(([y0, col]) => { c.g.fillStyle = col; c.g.fillRect(0, y0, tw, 9 * S - y0); });
      return c;
    };
    const t1 = mk(txt1, [[0, PAL.yellow], [8, PAL.gold], [14, '#fb9a5b'], [18, PAL.orange]]);
    const t2 = mk(txt2, [[0, '#ff6b6b'], [8, PAL.red2], [14, PAL.crimson], [18, '#6e1a2a']]);
    const out = makeCanvas(w, h);
    const place = (t, x, y) => {
      // thick outline
      const sil = silhouette(t, PAL.black);
      for (let dx = -2; dx <= 2; dx++) for (let dy = -2; dy <= 3; dy++) if (Math.abs(dx) + Math.abs(dy) <= 3) out.g.drawImage(sil, x + dx, y + dy);
      const sh = silhouette(t, PAL.ddbrown);
      out.g.drawImage(sh, x + 1, y + 2);
      out.g.drawImage(t, x, y);
      // top highlight line
    };
    place(t1, Math.round((w - w1) / 2), 3);
    place(t2, Math.round((w - w2) / 2), 9 * S + 7);
    return out;
  },
};

const TitleScene = {
  t: 0, state: 'press', sel: 0, gulls: [], sparkles: [], fish: null, showControls: false,
  enter() {
    TitleArt.build();
    this.t = 0; this.state = 'press'; this.sel = 0; this.showControls = false; this.showCredits = false;
    const sv = Store.get(SAVE_KEY);
    this.hasSave = !!sv;
    this.champion = !!(sv && sv.flags && sv.flags.hatEarned);

      { label: 'SET SAIL', act: () => this.newGame() },
      { label: 'CONTINUE', act: () => this.cont(), disabled: () => !this.hasSave },
      { label: 'CONTROLS', act: () => { this.showControls = true; } },
      { label: 'CREDITS', act: () => { this.showCredits = true; } },
    ];
    if (this.hasSave) this.sel = 1;
    this.gulls = [];
    for (let i = 0; i < 4; i++) this.gulls.push({ x: rnd(0, W), y: rnd(30, 80), s: rnd(0.15, 0.35), ph: rnd(0, 6), dir: Math.random() < 0.5 ? 1 : -1 });

  newGame() {
    AudioSys.sfx('select');

  },
  cont() {
    AudioSys.sfx('select');
    this.state = 'leaving';
    Fade.out(() => { loadGame(); }, 0.05);
  },
  update() {
    this.t++;
    AudioSys.update();
    for (const gl of this.gulls) { gl.x += gl.s * gl.dir; gl.ph += 0.12; if (gl.x > W + 10) gl.x = -10; if (gl.x < -10) gl.x = W + 10; }

    if (!this.fish && Math.random() < 0.004) this.fish = { x: rnd(20, 140), y: 0, vy: -1.6, t: 0, base: rnd(120, 160) };
    if (this.fish) { const f = this.fish; f.t++; f.y += f.vy; f.vy += 0.08; if (f.y > 0 && f.t > 5) { this.sparkles.push({ x: f.x + f.t * 0.4, y: f.base, t: 0 }); this.fish = null; } }
    this.sparkles = this.sparkles.filter(s => ++s.t < 30);
    if (this.state === 'leaving') return;
    if (this.state === 'press') {
      if (this.t > 20 && (Input.anyPressed())) { this.state = 'menu'; AudioSys.sfx('select'); Input.clearAll(); }

      });

  },
  tapAware() { return this.state === 'menu' && !this.showControls && !this.showCredits; },
  moveSel(d) {

  },
  renderSea(g) {
    const HZ = TitleArt.HORIZON, t = this.t;
    // sea gradient bands (reflecting sky) - static, cached once
    if (!TitleArt.seaBase) {
      const c = makeCanvas(W, H);
      const bands = [[HZ, '#f09a6e'], [HZ + 3, PAL.salmon], [HZ + 8, PAL.magenta], [HZ + 16, PAL.purple], [HZ + 30, PAL.dpurple], [HZ + 48, PAL.navy], [HZ + 70, '#1a1730']];
      for (let y = HZ + 1; y < H; y++) {
        let i = 0; while (i < bands.length - 2 && y >= bands[i + 1][0]) i++;
        const [y0, c0] = bands[i], [y1, c1] = bands[i + 1];
        const tt = clamp((y - y0) / (y1 - y0), 0, 1);
        const th = (BAYER4[(y % 4) * 4] + 0.5) / 16;
        c.g.fillStyle = tt > th ? c1 : c0;
        c.g.fillRect(0, y, W, 1);
      }
      TitleArt.seaBase = c;
    }
    g.drawImage(TitleArt.seaBase, 0, 0);
    // wave highlight dashes
    for (let i = 0; i < 70; i++) {
      const r1 = hash2(i, 1, 7), r2 = hash2(i, 2, 7);
      const y = HZ + 3 + Math.floor(r1 * r1 * (H - HZ - 3));
      const depth = (y - HZ) / (H - HZ);
      const len = 2 + Math.floor(depth * 9 * r2 + 1);
      const x = ((r2 * W * 3 + t * (0.05 + depth * 0.25) * (i % 2 ? 1 : -1)) % (W + 20) + W + 20) % (W + 20) - 10;
      const ph = Math.sin(t * 0.05 + i);

      g.fillStyle = depth < 0.2 ? PAL.lpink : depth < 0.5 ? PAL.salmon : PAL.magenta;
      g.fillRect(Math.round(x), y, len, 1);

    // sun reflection column

    for (let y = HZ + 1; y < H - 4; y += 2) {

      const wbase = 20 * (1 - depth * 0.55);
      const wob = Math.sin(y * 0.7 + t * 0.08) * 3 + Math.sin(y * 1.3 - t * 0.05) * 2;
      const w2 = Math.max(2, wbase * (0.5 + 0.5 * Math.sin(y * 2.1 + t * 0.1)));
      g.fillStyle = depth < 0.15 ? '#fff6c9' : depth < 0.45 ? PAL.yellow : PAL.gold;
      g.fillRect(Math.round(sx - w2 / 2 + wob), y, Math.round(w2), 1);
      if ((y + (t >> 3)) % 6 === 0) { g.fillStyle = PAL.white; g.fillRect(Math.round(sx + wob * 2 - 1), y, 2, 1); }
    }
  },
  render(g) {
    const t = this.t;

    // stars

      const tw = Math.sin(t * 0.04 + i * 1.7);

    });
    this.renderSea(g);

      if (up) { g.fillRect(x - 2, y - 1, 1, 1); g.fillRect(x - 1, y, 1, 1); g.fillRect(x, y, 1, 1); g.fillRect(x + 1, y, 1, 1); g.fillRect(x + 2, y - 1, 1, 1); }
      else { g.fillRect(x - 2, y + 1, 1, 1); g.fillRect(x - 1, y, 1, 1); g.fillRect(x, y, 1, 1); g.fillRect(x + 1, y, 1, 1); g.fillRect(x + 2, y + 1, 1, 1); }
    }

    }
    for (const s of this.sparkles) { const r = s.t / 4; g.fillStyle = PAL.lpink; g.fillRect(Math.round(s.x - r), s.y, 1, 1); g.fillRect(Math.round(s.x + r), s.y, 1, 1); if (s.t < 10) g.fillRect(Math.round(s.x), s.y - 2 - (s.t >> 2), 1, 1); }

    // ---- ship ----
    const shipX = 124, bobY = Math.round(Math.sin(t * 0.035) * 1.5), shipY = 14 + bobY;
    const WLs = shipY + 138; // waterline on screen
    // reflection of ship (dark, wobbly)

    }
    // main sail (animated billow) with skull emblem & patch
    const mx = shipX + 104;
    const bill = Math.sin(t * 0.05) * 1.5;
    const sailTop = shipY + 29, sailH = 50;
    for (let y = 0; y < sailH; y++) {
      const yy = sailTop + y, tt = y / (sailH - 1);
      const bulge = Math.sin(tt * Math.PI) * (9 + bill);
      const x0 = mx - 33 + Math.round(bulge * 0.35), x1 = mx + 38 + Math.round(bulge);
      for (let x = x0; x <= x1; x++) {
        const rel = (x - x0) / (x1 - x0);
        let c = PAL.beige;
        if (rel < 0.07) c = PAL.sand2;

    }
    // patch (sewn, rookie ship!)
    const pxp = mx - 24, pyp = sailTop + 30;

    g.fillStyle = PAL.brown; for (let i = 0; i < 9; i += 2) { g.fillRect(pxp + i, pyp - 1, 1, 1); g.fillRect(pxp + i, pyp + 8, 1, 1); }
    // skull & crossbones on the sail
    const ex = mx + 4 + Math.round(bill * 0.6), ey = sailTop + 20;
    const bone = (x0, y0, x1, y1) => { pline(g, x0, y0, x1, y1, PAL.black); pline(g, x0, y0 + 1, x1, y1 + 1, PAL.black); prect(g, x0 - 1, y0 - 1, 2, 2, PAL.black); prect(g, x1, y1 - 1, 2, 2, PAL.black); prect(g, x0 - 1, y0 + 1, 2, 2, PAL.black); prect(g, x1, y1 + 1, 2, 2, PAL.black); };
    bone(ex - 9, ey + 3, ex + 9, ey + 13); bone(ex - 9, ey + 13, ex + 9, ey + 3);
    prect(g, ex - 5, ey - 6, 11, 9, PAL.black); prect(g, ex - 4, ey - 7, 9, 1, PAL.black); prect(g, ex - 3, ey + 3, 7, 3, PAL.black);
    prect(g, ex - 3, ey - 3, 3, 3, PAL.beige); prect(g, ex + 1, ey - 3, 3, 3, PAL.beige); px(g, ex, ey + 1, PAL.beige);
    px(g, ex - 2, ey + 4, PAL.beige); px(g, ex, ey + 4, PAL.beige); px(g, ex + 2, ey + 4, PAL.beige);
    g.drawImage(TitleArt.ship, shipX, shipY);
    // flag (waving) at the masthead
    for (let x = 0; x < 20; x++) {
      const wy = Math.round(Math.sin(t * 0.15 - x * 0.45) * (x / 20) * 2.5);
      for (let y = 0; y < 12; y++) {
        let c = PAL.black;
        if (x >= 7 && x <= 12 && y >= 2 && y <= 6 && !(y === 4 && (x === 8 || x === 11))) c = PAL.white;
        if (y === 7 && (x === 8 || x === 10 || x === 12) ) c = PAL.white;
        if ((y === 9 || y === 1) && (x === 5 || x === 14)) c = PAL.lgray;
        if (x === 19 || y === 11) c = '#0d0a14';
        g.fillStyle = c; g.fillRect(mx + 5 + x, shipY - 8 + y + wy, 1, 1);
      }
    }
    prect(g, mx + 1, shipY - 10, 4, 3, PAL.gold);
    // the relaxing rookie on deck
    const rf = (t % 200 < 24) ? (Math.floor(t / 6) % 2 ? 2 : 0) : (Math.floor(t / 80) % 2);
    g.drawImage((this.champion ? TitleArt.rookieHat : TitleArt.rookie)[rf], shipX + 48, shipY + 104 - 28);
    // floating music note (he's humming)
    const zt = t % 170;
    if (zt < 110) {
      const zy = shipY + 66 - zt * 0.28, zx = shipX + 70 + Math.sin(zt * 0.09) * 4;
      drawText(g, this.champion ? 'z' : '♪', zx, zy, zt < 80 ? PAL.white : PAL.lpink, { shadow: PAL.purple });
    }
    // foam at the waterline
    for (let x = 0; x < 184; x += 2) {
      const yy = WLs + Math.round(Math.sin(x * 0.35 + t * 0.12));
      g.fillStyle = (x + (t >> 2)) % 10 < 5 ? PAL.lpink : PAL.salmon;
      g.fillRect(shipX + 6 + x, yy, 2, 1);
    }
    // bow wake sparkles
    for (let i = 0; i < 4; i++) {
      const ph = (t * 0.6 + i * 12) % 48;
      g.fillStyle = PAL.lpink; g.fillRect(Math.round(shipX + 186 + ph * 0.6), Math.round(WLs - 1 + ph * 0.25), 2, 1);
    }

    // ---- logo ----
    const lg = TitleArt.logo;
    const ly = 8 + Math.round(Math.sin(t * 0.04) * 1.5);
    const LCX = 84;
    g.drawImage(lg, Math.round(LCX - lg.width / 2), ly);
    // glint sweep
    const gx = ((t * 2) % 600) - 100;
    if (gx > 0 && gx < lg.width) {
      g.save(); g.globalAlpha = 0.9;
      g.fillStyle = '#fff';
      g.restore();
    }
    drawText(g, this.champion ? '~ The Strongest Pirate ~' : '~ Rise of the Rookie ~', LCX, ly + lg.height - 1, this.champion ? PAL.yellow : PAL.beige, { align: 'center', outline: PAL.dpurple });

    // ---- menu / prompt ----
    if (this.state === 'press') {
      if (Math.floor(t / 30) % 2 === 0) drawText(g, Touch.enabled ? 'TAP TO START' : 'CLICK OR PRESS ANY KEY', 62, 136, PAL.white, { align: 'center', outline: PAL.black });
    } else {
      const mx0 = 18, my0 = 116;
      drawPanel(g, mx0 - 8, my0 - 7, 96, this.items.length * 12 + 12, 'wood');
      this.items.forEach((it, i) => {
        const dis = it.disabled && it.disabled();
        const selc = i === this.sel;
        const y = my0 + i * 12;
        const col = dis ? PAL.dgray : selc ? PAL.yellow : PAL.beige;
        const bob = selc ? Math.round(Math.sin(t * 0.2)) : 0;
        if (selc) drawText(g, '▶', mx0 - 1 + bob, y, PAL.gold);
        drawText(g, it.label, mx0 + 8, y, col, { shadow: PAL.black });
      });
    }
    drawText(g, 'v1.0', W - 3, H - 10, PAL.dgray, { align: 'right' });
    if (this.showControls) renderControlsPanel(g);
    if (this.showCredits) renderCreditsPanel(g);
  },
};

'use strict';
// =============================================================
//  Scenes: naming, intro, game over, ending + sea chart overlay
// =============================================================

const CREW_SUGGEST = ['Sea Wolves', 'Salt Kings', 'Storm Riders', 'Crimson Gulls', 'Wave Breakers', 'Iron Tide', 'Kraken Kids', 'Sunset Sharks', 'Rowdy Rovers', 'Thunder Tails', 'Salty Hearts', 'Golden Anchors'];
const CAP_SUGGEST = ['Rook', 'Kai', 'Finn', 'Marlo', 'Nami', 'Skye', 'Jax', 'Rio', 'Lulu', 'Ash'];

function renderSeaBackdrop(g, t, dark = 0.55) {
  TitleArt.build();
  g.drawImage(TitleArt.sky, 0, 0);
  TitleScene.t = t;
  TitleScene.renderSea(g);
  dimFill(g, 0, 0, W, H, PAL.black, dark);
}

// ---------------------------------------------------------------
const NamingScene = {
  enter() {
    this.step = 0; this.t = 0;
    this.cap = ''; this.crew = '';
    this.capDefault = 'Rook'; this.crewDefault = pick(CREW_SUGGEST);
    this.si = 0;
    this.grid = ['ABCDEFGHIJ', 'KLMNOPQRST', 'UVWXYZ-\'!.', 'abcdefghij', 'klmnopqrst', 'uvwxyz &  '];
    this.gx = 0; this.gy = 0; this.special = -1; // special row: SPACE DEL RANDOM DONE
    Input.textMode = true;
    AudioSys.music('title');
    Fade.in(0.05);
  },
  exit() { Input.textMode = false; },
  tapAware() { return true; },
  get value() { return this.step === 0 ? this.cap : this.crew; },
  set value(v) { if (this.step === 0) this.cap = v; else this.crew = v; },
  get maxLen() { return this.step === 0 ? 10 : 16; },
  typeChar(ch) {
    if (this.value.length >= this.maxLen) { AudioSys.sfx('deny'); return; }
    if (ch === ' ' && (!this.value.length || this.value.endsWith(' '))) return;
    this.value = this.value + ch; AudioSys.sfx('blip', 1.2);
  },
  confirm() {
    let v = this.value.trim().replace(/\s+/g, ' ');
    if (!v) v = this.step === 0 ? this.capDefault : this.crewDefault;
    if (v === v.toLowerCase()) v = v.replace(/(^|[\s-])([a-z])/g, (m, a, b) => a + b.toUpperCase());
    this.value = v;
    AudioSys.sfx('select');
    if (this.step === 0) { this.step = 1; this.si = 0; }
    else {
      Input.textMode = false;
      newGame(this.cap, this.crew);
      Fade.out(() => setScene(IntroScene), 0.04);
      this.step = 2;
    }
  },
  update() {
    this.t++;
    AudioSys.update();
    if (this.step === 2 || Fade.busy) return;
    for (const ch of Input.typed) {
      if (ch === '\b') { this.value = this.value.slice(0, -1); AudioSys.sfx('back'); }
      else if (/^[A-Za-z0-9 '\-!.&]$/.test(ch)) this.typeChar(ch);
    }
    if (Input.just.has('Enter')) { this.confirm(); return; }
    if (Input.just.has('Escape')) {
      if (this.step === 1) { this.step = 0; AudioSys.sfx('back'); }
      else { Input.textMode = false; AudioSys.sfx('back'); setScene(TitleScene); }
      return;
    }
    // grid navigation (arrows / pad / taps)
    const rows = this.grid.length;
    const mv = (dx, dy) => {
      AudioSys.sfx('move');
      if (this.special >= 0) {
        if (dy < 0) { this.special = -1; this.gy = rows - 1; }
        else if (dx) this.special = (this.special + dx + 4) % 4;
        return;
      }
      if (dy > 0 && this.gy === rows - 1) { this.special = Math.min(3, Math.floor(this.gx / 2.5)); return; }
      this.gx = (this.gx + dx + 10) % 10; this.gy = clamp(this.gy + dy, 0, rows - 1);
    };
    if (Input.nav('left')) mv(-1, 0);
    if (Input.nav('right')) mv(1, 0);
    if (Input.nav('up')) mv(0, -1);
    if (Input.nav('down')) mv(0, 1);
    // gamepad A (button 0) selects the highlighted key; B deletes
    const padA = Input.just.has('pad0'), padB = Input.just.has('pad1');
    if (padB) { this.value = this.value.slice(0, -1); AudioSys.sfx('back'); }
    if (padA) this.pressKey();
    for (const tp of Touch.taps || []) this.tap(tp.x, tp.y);
  },
  pressKey() {
    if (this.special >= 0) {
      if (this.special === 0) this.typeChar(' ');
      else if (this.special === 1) { this.value = this.value.slice(0, -1); AudioSys.sfx('back'); }
      else if (this.special === 2) { const arr = this.step === 0 ? CAP_SUGGEST : CREW_SUGGEST; this.value = arr[this.si++ % arr.length]; AudioSys.sfx('select'); }
      else this.confirm();
      return;
    }
    const ch = this.grid[this.gy][this.gx];
    if (ch && ch !== ' ') this.typeChar(ch); else if (ch === ' ') this.typeChar(' ');
  },
  keyRect(gx, gy) { return { x: 62 + gx * 20, y: 70 + gy * 11, w: 18, h: 10 }; },
  specRect(i) { return { x: 62 + i * 50, y: 70 + this.grid.length * 11 + 3, w: 46, h: 12 }; },
  tap(x, y) {
    for (let gy = 0; gy < this.grid.length; gy++) for (let gx = 0; gx < 10; gx++) {
      const r = this.keyRect(gx, gy);
      if (x >= r.x && x < r.x + r.w && y >= r.y && y < r.y + r.h) { this.gx = gx; this.gy = gy; this.special = -1; this.pressKey(); return; }
    }
    for (let i = 0; i < 4; i++) { const r = this.specRect(i); if (x >= r.x && x < r.x + r.w && y >= r.y && y < r.y + r.h) { this.special = i; this.pressKey(); return; } }
  },
  render(g) {
    renderSeaBackdrop(g, this.t, 0.6);
    const step = Math.min(this.step, 1);
    drawPanel(g, 30, 8, W - 60, H - 16, 'wood');
    const title = step === 0 ? 'What\'s your name, rookie?' : 'Name your pirate crew!';
    drawText(g, title, W / 2, 16, PAL.gold, { align: 'center', shadow: PAL.black });
    if (step === 1) drawText(g, 'Every legend starts with a name.', W / 2, 27, PAL.lgray, { align: 'center' });
    else drawText(g, 'Type it in, or use the letters below.', W / 2, 27, PAL.lgray, { align: 'center' });
    // name field
    const val = this.value;
    const shown = val.length ? val : (step === 0 ? this.capDefault : this.crewDefault);
    const prefix = step === 1 ? 'The ' : 'Captain ';
    drawPanel(g, 60, 36, W - 120, 24, 'paper');
    const full = prefix + shown;
    const tw = textWidth(full, 2) > W - 136 ? 1 : 2;
    drawText(g, full, W / 2, tw === 2 ? 40 : 45, val.length ? PAL.crimson : PAL.tan, { align: 'center', scale: tw });
    if (val.length && Math.floor(this.t / 20) % 2 === 0) { const cw = textWidth(full, tw); g.fillStyle = PAL.crimson; g.fillRect(Math.round(W / 2 + cw / 2 + 2), tw === 2 ? 40 : 45, tw, 7 * tw); }
    drawText(g, val.length + '/' + this.maxLen, W - 64, 61, PAL.lgray, { align: 'right' });
    // letter grid
    this.grid.forEach((row, gy) => {
      for (let gx = 0; gx < 10; gx++) {
        const ch = row[gx]; const r = this.keyRect(gx, gy);
        const sel = this.special < 0 && gx === this.gx && gy === this.gy;
        if (sel) { g.fillStyle = PAL.gold2; g.fillRect(r.x, r.y, r.w, r.h); }
        drawText(g, ch === ' ' ? '_' : ch, r.x + r.w / 2, r.y + 1, sel ? PAL.white : PAL.beige, { align: 'center' });
      }
    });
    ['SPACE', 'DEL', 'RANDOM', 'DONE'].forEach((lab, i) => {
      const r = this.specRect(i); const sel = this.special === i;
      drawPanel(g, r.x, r.y, r.w, r.h + 2, sel ? 'gold' : 'dark');

function islandUnlocked(is) { return is.always || !!G.save.flags[is.unlock]; }

class SeaChart {
  constructor(fromId) {
    this.t = 0;
    this.list = ISLANDS.filter(islandUnlocked);
    const cur = ISLANDS.find(i => i.map === fromId) || ISLANDS[0];
    this.from = cur;
    // default selection: the newest unlocked island not yet visited
    const next = [...this.list].reverse().find(i => i.who && !G.save.crew.includes(i.who)) || this.list.find(i => i.final) || cur;
    this.sel = Math.max(0, this.list.indexOf(next));
    this.sailing = null;
  }
  update(w) {
    this.t++;
    if (this.sailing) {
      this.sailing.t++;
      if (this.sailing.t === 150) {
        const to = this.sailing.to;
        w.menu = null;
        G.save.flags['visited_' + to.id] = true;
        w.goto(to.map, to.spawn);
      }
      return;
    }
    if (Input.pressed('back') || Input.pressed('pause')) { AudioSys.sfx('back'); w.menu = null; return; }
    if (Input.nav('left') || Input.nav('up')) { this.sel = (this.sel + this.list.length - 1) % this.list.length; AudioSys.sfx('move'); }
    if (Input.nav('right') || Input.nav('down')) { this.sel = (this.sel + 1) % this.list.length; AudioSys.sfx('move'); }
    for (const tp of (Touch.taps || [])) { this.list.forEach((is, i) => { if (dist(tp.x, tp.y, is.x, is.y) < 14) { if (this.sel === i) this.go(); else { this.sel = i; AudioSys.sfx('move'); } } }); }
    if (Input.pressed('confirm')) this.go();
  }
  go() {
    const to = this.list[this.sel];
    if (to === this.from) { AudioSys.sfx('deny'); return; }
    if (to.final && G.save.crew.length < 9) { AudioSys.sfx('deny'); return; }
    AudioSys.sfx('select'); AudioSys.music('sea');
    this.sailing = { to, t: 0 };
  }
  render(g, w) {
    // parchment
    g.fillStyle = PAL.dbrown; g.fillRect(0, 0, W, H);
    g.fillStyle = PAL.beige; g.fillRect(4, 4, W - 8, H - 8);
    for (let y = 4; y < H - 4; y += 2) for (let x = 4; x < W - 4; x += 2) {
      const e = Math.min(x - 4, y - 4, W - 4 - x, H - 4 - y);
      const n = hash2(x >> 1, y >> 1, 12);
      if (e < 12 && n < (12 - e) / 16) { g.fillStyle = PAL.tan; g.fillRect(x, y, 2, 2); }
      else if (n < 0.02) { g.fillStyle = PAL.sand2; g.fillRect(x, y, 2, 2); }
    }
    // wave marks
    g.fillStyle = PAL.tan;
    for (let i = 0; i < 40; i++) { const x = 10 + hash2(i, 1, 5) * (W - 30), y = 10 + hash2(i, 2, 5) * (H - 30); const o = (this.t >> 4) % 2; g.fillRect(Math.round(x), Math.round(y) + o, 2, 1); g.fillRect(Math.round(x) + 2, Math.round(y) - 1 + o, 2, 1); g.fillRect(Math.round(x) + 4, Math.round(y) + o, 2, 1); }
    // compass
    const cx = 30, cy = 150;
    pring(g, cx, cy, 11, PAL.brown); pline(g, cx, cy - 14, cx, cy + 14, PAL.dbrown); pline(g, cx - 14, cy, cx + 14, cy, PAL.dbrown);
    drawText(g, 'N', cx, cy - 23, PAL.crimson, { align: 'center' });
    // routes between unlocked islands in order
    const vis = this.list;
    for (let i = 0; i < ISLANDS.length - 1; i++) {
      const a = ISLANDS[i], b = ISLANDS[i + 1];
      if (!islandUnlocked(b)) continue;
      const from = i === 0 ? ISLANDS[0] : a;
      const n = Math.floor(dist(from.x, from.y, b.x, b.y) / 5);
      for (let k = 1; k < n; k++) if (k % 2 === 0) px(g, Math.round(lerp(from.x, b.x, k / n)), Math.round(lerp(from.y, b.y, k / n)), PAL.brown);
    }
    // islands
    ISLANDS.forEach((is, i) => {
      const un = islandUnlocked(is);
      const r = mulberry32(i * 31 + 7);
      const blob = (col, s) => { for (let k = 0; k < 5; k++) pcircle(g, is.x + (r() - 0.5) * 12 * s, is.y + (r() - 0.5) * 6 * s, (4 + r() * 3) * s, col); };
      if (!un) { const rr = mulberry32(i * 31 + 7); for (let k = 0; k < 5; k++) pcircle(g, is.x + (rr() - 0.5) * 12, is.y + (rr() - 0.5) * 6, 4 + rr() * 3, PAL.tan); drawText(g, '?', is.x, is.y - 4, PAL.brown, { align: 'center' }); return; }
      const rr = mulberry32(i * 31 + 7);
      const pts = []; for (let k = 0; k < 5; k++) pts.push([is.x + (rr() - 0.5) * 12, is.y + (rr() - 0.5) * 6, 4 + rr() * 3]);
      for (const [x, y, rad] of pts) pcircle(g, x, y, rad + 1, PAL.dbrown);
      for (const [x, y, rad] of pts) pcircle(g, x, y, rad, is.final ? PAL.dgray : PAL.green);
      for (const [x, y, rad] of pts) pcircle(g, x - 1, y - 1, rad * 0.5, is.final ? PAL.gray : PAL.lgreen);
      if (is.final) { prect(g, is.x - 3, is.y - 9, 6, 6, PAL.navy); prect(g, is.x - 1, is.y - 12, 2, 3, PAL.crimson); }
      const done = is.who && G.save.crew.includes(is.who);
      if (done) drawText(g, '★', is.x + 7, is.y - 10, PAL.gold, { outline: PAL.dbrown });
      else if (is.who) drawText(g, '!', is.x + 7, is.y - 11, PAL.crimson, { outline: PAL.beige });
    });
    // selection + labels
    const s = this.list[this.sel];
    if (!this.sailing) {
      const pulse = 11 + Math.floor(this.t / 8) % 2;
      pring(g, s.x, s.y, pulse, PAL.crimson);
      const lab = s.name;
      const lw = textWidth(lab) + 10;
      const lx = clamp(s.x - lw / 2, 6, W - lw - 6), ly = s.y + 12 > H - 30 ? s.y - 26 : s.y + 12;
      drawPanel(g, lx, ly, lw, 15, 'wood');
      drawText(g, lab, lx + 5, ly + 3, PAL.yellow);
    }
    // ship icon
    let sx = this.from.x, sy = this.from.y;
    if (this.sailing) { const p = easeInOut(Math.min(1, this.sailing.t / 130)); sx = lerp(this.from.x, this.sailing.to.x, p); sy = lerp(this.from.y, this.sailing.to.y, p); }
    const bob = Math.round(Math.sin(this.t * 0.15));
    prect(g, sx - 5, sy + 2 + bob, 11, 3, PAL.dbrown); prect(g, sx - 4, sy + 5 + bob, 9, 1, PAL.ddbrown);
    prect(g, sx, sy - 7 + bob, 1, 9, PAL.ddbrown); prect(g, sx + 1, sy - 6 + bob, 4, 5, PAL.white); prect(g, sx - 3, sy - 5 + bob, 3, 4, PAL.white);
    prect(g, sx, sy - 9 + bob, 3, 2, PAL.black);
    // header & info
    drawPanel(g, 8, 6, 132, 16, 'wood');
    drawText(g, 'SEA CHART', 14, 10, PAL.gold);
    drawText(g, fmtText('{crew}'), 70, 10, PAL.beige);
    const info = this.sailing ? 'Setting sail for ' + this.sailing.to.name + '...' :
      (s.final && G.save.crew.length < 9) ? 'You need a full crew of 9 to face Blackmaw!' :
        s === this.from ? 'You are here.' : (s.who && !G.save.crew.includes(s.who)) ? 'Rumor has it someone strong lives here...' : 'Press ' + (Touch.enabled ? 'A' : 'Enter') + ' to set sail!';
    drawPanel(g, 60, H - 20, W - 68, 16, 'paper');
    drawText(g, info, 66, H - 16, PAL.dbrown);
  }
}

'use strict';
// =============================================================
//  Boot, save/load
// =============================================================
const SAVE_KEY = 'pm_save_v1';
let CHECKPOINT = null;

function newGame(capName, crewName) {
  G.save = {
    v: 1, capName: capName || 'Rook', crewName: crewName || 'Sea Wolves',
    flags: {}, crew: [], gold: 0,
    upgrades: { blade: 0, coat: 0, boots: 0, drill: 0 },
    skills: { whirl: false, dash: false, tide: false },
    map: 'beach', spawn: 'start',
    stats: { kills: 0, time: 0 },
  };
  saveGame();
}
function saveGame() {
  if (!G.save) return;
  CHECKPOINT = JSON.stringify(G.save);
  Store.set(SAVE_KEY, G.save);
}
function loadGame() {
  const s = Store.get(SAVE_KEY) || (CHECKPOINT ? JSON.parse(CHECKPOINT) : null);
  if (!s) { setScene(TitleScene); return; }
  G.save = s;
  G.save.upgrades = Object.assign({ blade: 0, coat: 0, boots: 0, drill: 0 }, G.save.upgrades);
  G.save.skills = Object.assign({ whirl: false, dash: false, tide: false }, G.save.skills);
  G.save.stats = G.save.stats || { kills: 0, time: 0 };
  setScene(World, { map: G.save.map, spawn: G.save.spawn });
  Fade.in(0.05);
}
function restoreCheckpoint() {
  const s = CHECKPOINT ? JSON.parse(CHECKPOINT) : Store.get(SAVE_KEY);
  if (s) { G.save = s; }
  setScene(World, { map: G.save.map, spawn: G.save.spawn });
  Fade.in(0.05);
}

// debug hooks (used by automated tests): ?debug=1
const DEBUG = /[?&]debug=1/.test(location.search);
window.PM = {
  World, G, setScene, Input, Fade, AudioSys,
  start(capName = 'Rook', crewName = 'Sea Wolves', map = 'beach', spawn = 'start', flags = {}, crew = []) {
    newGame(capName, crewName);
    Object.assign(G.save.flags, flags);
    G.save.crew = crew.slice();
    for (const c of crew) G.save.flags['rec_' + c] = true;
    setScene(World, { map, spawn });
    Fade.level = 0; Fade.target = 0;
  },
  killAll() { for (const e of World.actors) if (e.team === 'enemy' && e.alive) { e.spawnT = 0; e.iframes = 0; e.invuln = false; e.phaseOut = false; e.hurt(World, 99999, e.x, e.y, 0); } },
  auto(on = true, opts = {}) {
    clearInterval(this._auto);
    if (!on) return;
    this._auto = setInterval(() => {
      if (SCENE !== World) { Input.queue.push('Enter'); return; }
      if (World.menu && World.menu.constructor.name === 'SeaChart') return;
      if (World.menu) { Input.queue.push('Escape'); return; }
      if (World.dialog) { Input.queue.push('Enter'); return; }
      if (!opts.noKill && !World.cutscene && World.enemies().some(e => e.aggro || e.isBoss || World.lock)) this.killAll();
    }, 90);
  },
  state() { const w = World; return { map: w.mapId, cut: w.cutscene, dlg: w.dialog && w.dialog.L.text, script: !!w.script, en: w.enemies().map(e => e.type), boss: w.boss && w.boss.type, hp: Math.round(w.player.hp), flags: Object.keys(G.save.flags).join(','), crew: G.save.crew.join(','), menu: w.menu && w.menu.constructor.name }; },
  press(code, frames = 2) { Input.queue.push(code); Input.held.add(code); setTimeout(() => Input.held.delete(code), frames * 17); },
};

Touch.init();
window.addEventListener('resize', fitCanvas);
fitCanvas();
// mouse: clicking focuses the game (needed when embedded), advances text and selects menu items
screenCanvas.addEventListener('pointerdown', e => {
  AudioSys.unlock(); screenCanvas.focus();
  if (e.pointerType === 'touch') return; // the touch layer handles fingers
  const r = screenCanvas.getBoundingClientRect();
  Touch.taps.push({ x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H });
  const aware = SCENE && SCENE.tapAware && SCENE.tapAware();
  const inGame = SCENE === World && !World.dialog && !World.menu && !World.cutscene;
  if (!inGame && !aware) Input.queue.push('Click');
});
// boot (when hosted as an artifact, keep an in-progress voyage across page updates)
function boot(data) {
  try {
    if (data && data.save && data.save.capName) {
      G.save = data.save;
      CHECKPOINT = JSON.stringify(G.save);
      setScene(World, { map: G.save.map, spawn: G.save.spawn });
    } else setScene(TitleScene);
  } catch (e) { setScene(TitleScene); }
  requestAnimationFrame(loop);
}
const HOT = window.claude && window.claude.hot;
try { if (HOT && HOT.snapshot) HOT.snapshot(() => ({ save: SCENE === World && G.save ? G.save : null })); } catch (e) { }
if (HOT && HOT.ready) HOT.ready(boot);
else boot((HOT && HOT.data) || {});

</script>
