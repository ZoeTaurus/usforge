<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Credits · UsForge</title>
<meta name="description" content="The people behind UsForge and Lazy Studios.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='4' y='4' width='8' height='8' rx='1.5' fill='%234d8cf7' transform='rotate(45 8 8)'/%3E%3C/svg%3E">
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0a0c11"><link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800;900&family=Geist+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="style.css?v=47">
<script>/* THEME_BOOT */try{var m=localStorage.getItem('usforge-theme')||'auto',h=new Date().getHours();document.documentElement.dataset.theme=m==='auto'?(h>=7&&h<19?'light':'dark'):m}catch(e){}</script>
<script src="icons.js?v=3"></script>
<script src="site.js?v=34"></script>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="mark" href="./"><span class="spark"></span>UsForge</a>
    <nav><a href="./">Games</a><a href="add.html">Share your game</a><a href="upload.html">Upload</a><a href="credits.html" aria-current="page">Credits</a><a class="nav-support" href="support.html" data-support hidden>Support <span data-icon="heart"></span></a><span data-theme-switch></span></nav>
  </header>

  <section class="intro">
    <h1>Credits</h1>
    <p class="studio">UsForge was started by <b>Lazy Studios</b>, four friends making games, mostly in an afternoon. Now it’s a community.</p>
  </section>

  <h2 class="credits-head">Founders</h2>
  <main class="credits" id="people"></main>
  <section id="communityWrap" hidden>
    <h2 class="credits-head">Community</h2>
    <p class="studio">Makers who joined after the founders.</p>
    <div class="members" id="community"></div>
  </section>

  <footer class="foot">
    <span>UsForge · by Lazy Studios</span>
    <a href="./">Back to the games →</a>
  </footer>
</div>

<script src="embers.js?v=20"></script>
<script src="eggs.js?v=20"></script>
<script>
(() => {
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const TEAM = UsForge.TEAM;   // (the team list lives in site.js, shared with the maker pages)
  const paint = (games = []) => {
    document.getElementById('people').innerHTML = TEAM.map(p => {
      const mine = games.filter(g => g.author.toLowerCase() === p.name.toLowerCase());
      return `<article class="person">
        <span class="initial${emo(p.name) ? ' emoji' : ''}" aria-hidden="true">${emo(p.name) ? UsForgeIcon(emo(p.name)) : esc(p.name[0])}</span>
        <h2><a class="person-link" href="maker.html?n=${encodeURIComponent(p.name)}">${esc(p.name)}</a></h2>
        <div class="roles">${p.roles.map((r, i) => `<span class="role${i < (p.lead || 0) ? ' lead' : ''}"${r === 'Potato' ? ' data-potato title="Click me" style="cursor:pointer"' : ''}>${esc(r)}</span>`).join('')}</div>
        ${st ? UsForge.levelChip(UsForge.levelOf(UsForge.makerPoints(p.name, games, st))) : ''}
        ${mine.length ? `<a href="maker.html?n=${encodeURIComponent(p.name)}">${mine.length} game${mine.length === 1 ? '' : 's'} on UsForge →</a>` : '<span class="role" style="border-style:dashed;width:fit-content">first game coming soon</span>'}
      </article>`;
    }).join('');
  };
  // everyone else who has posted a game
  const community = (games = [], members = []) => {
    const founders = new Set(TEAM.map(p => p.name.toLowerCase())), seen = new Map();
    for (const m of members) if (!founders.has(m.toLowerCase())) seen.set(m, 0);   // everyone with an account…
    for (const g of games) if (!founders.has(g.author.toLowerCase())) { const k = [...seen.keys()].find(x => x.toLowerCase() === g.author.toLowerCase()) || g.author; seen.set(k, (seen.get(k) || 0) + 1); }   // …and everyone who has posted a game
    document.getElementById('communityWrap').hidden = !seen.size;
    // small tiles (no roles), so a big community still fits neatly
    document.getElementById('community').innerHTML = [...seen].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0])).map(([name, n]) =>
      `<a class="member" href="maker.html?n=${encodeURIComponent(name)}"><span class="mini${emo(name) ? ' emoji' : ''}" aria-hidden="true">${emo(name) ? UsForgeIcon(emo(name)) : esc(name[0])}</span><span class="member-name">${esc(name)}</span><span class="member-n">${n ? `${n} game${n === 1 ? '' : 's'}` : 'New member'}${st && n ? UsForge.levelChip(UsForge.levelOf(UsForge.makerPoints(name, games, st))) : ''}</span></a>`).join('');
  };
  let profiles = {}, st = null;   // (st: plays + stokes, for levels)
  const emo = name => { const i = (profiles[Object.keys(profiles).find(k => k.toLowerCase() === String(name).toLowerCase())] || {}).icon; return UsForgeIcon.avatars.includes(i) ? i : ''; };
  paint();
  Promise.all([fetch('games.json', { cache: 'no-cache' }).then(r => r.json()), fetch('profiles.json', { cache: 'no-cache' }).then(r => r.ok ? r.json() : {}).catch(() => ({})),
    fetch('/api/members').then(r => r.ok ? r.json() : []).catch(() => []), UsForge.stats()])
    .then(([g, p, m, s2]) => { profiles = p || {}; st = s2; paint(g); community(g, Array.isArray(m) ? m : []); }).catch(() => {});
})();
</script>
</body>
</html>
