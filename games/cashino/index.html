'use strict';
// =====================================================================
//  CASHINO - scratch tickets. Buy a ticket, scratch the silver off
//  (drag the pointer, or move the gem with arrows and hold Z).
//  Match three amounts to win that amount.
// =====================================================================

const TICKETS = [
  { name: 'LUCKY GEM', price: gems(1), c: C.lime, d: C.forest, sym: 'clover' },
  { name: 'GOLD RUSH', price: gems(10), c: C.yellow, d: C.bronze, sym: 'bag' },
  { name: 'DIAMOND DIG', price: gems(100), c: C.cyan, d: C.teal, sym: 'diamond' },
  { name: 'ROYAL TREASURE', price: gems(1000), c: C.lilac, d: C.grape, sym: 'crown' },
  { name: 'MEGA GEMS', price: gems(10000), c: C.pink, d: C.magenta, sym: 'mega' },
  { name: 'SUPER STAR', price: gems(100000), c: C.orange, d: C.rust, sym: 'star' },
  { name: 'BILLIONAIRE', price: gems(1000000), c: C.gold, d: C.bronze, sym: 'seven' },
];
const SCRATCH = {
  PRIZES: [[500, 1 / 20000], [100, 1 / 2000], [20, 1 / 250], [10, 1 / 60], [5, 1 / 25], [2, 1 / 8], [1, 1 / 6]],
  POOL: [1, 2, 5, 10, 20, 100, 500],
  prize() { let r = U.rand(); for (const [m, p] of this.PRIZES) { if (r < p) return m; r -= p; } return 0; },
  grid(m) {
    const cells = [], counts = {};
    if (m) { cells.push(m, m, m); counts[m] = 3; }
    const w = [5, 5, 4, 3, 2, 1.5, 1];
    let guard = 0;
    while (cells.length < 9 && guard++ < 500) {
      const v = this.POOL[U.weighted(w)];
      if ((counts[v] || 0) >= 2 || v === m) continue;
      counts[v] = (counts[v] || 0) + 1;
      cells.push(v);
    }
    return U.shuffle(cells);
  },
};

class ScratchScene extends GameScene {
  constructor(obj) {
    super(obj, 'SCRATCH TICKETS');
    this.phase = 'shop';
    this.sel = 0;
    State.lastBet = State.lastBet || {};
    const last = State.lastBet.scratch;
    if (last !== undefined) this.sel = last;
    this.cur = { x: 160, y: 104 };
    this.spots = [];
    this.scratchT = 0;
    this.build();
  }

  canLeave() { return this.phase !== 'scratch'; }

  build() {
    const g = this.ui;
    g.clear();
    if (this.phase === 'shop') {
      TICKETS.forEach((tk, i) => g.add({ x: 40, y: 30 + i * 18, w: 240, h: 16, i, draw: (b, f) => this.drawTicketRow(b, f), onPress: () => this.buy(i), silent: true }));
      g.focus = g.items[Math.min(this.sel, TICKETS.length - 1)];
    } else if (this.phase === 'scratch') {
      this.allBtn = g.add({ x: 262, y: 60, w: 54, h: 26, label: 'SCRATCH', sub: 'ALL', style: 'gold', onPress: () => this.revealAll() });
    } else {
      const tk = TICKETS[this.sel];
      g.add({ x: 262, y: 60, w: 54, h: 26, label: 'AGAIN', sub: U.moneyShort(tk.price), style: 'red', onPress: () => this.buy(this.sel), enabled: State.money >= tk.price });
      g.add({ x: 262, y: 92, w: 54, h: 16, label: 'TICKETS', font: 's', onPress: () => { this.phase = 'shop'; this.build(); } });
      g.focus = g.items[0];
    }
  }

  buy(i) {
    const tk = TICKETS[i];
    if (State.money < tk.price) { Snd.play('error'); this.say('NOT ENOUGH GEMS FOR THIS TICKET', C.cherry); return; }
    State.take(tk.price);
    Snd.play('register');
    this.sel = i; State.lastBet.scratch = i;
    const m = Luck.pick(() => SCRATCH.prize(), x => x);
    this.prize = m;
    const cells = SCRATCH.grid(m);
    this.spots = cells.map((v, k) => {
      const x = 73 + (k % 3) * 60, y = 58 + Math.floor(k / 3) * 32;
      const cv = Gfx.canvas(54, 28);
      Gfx.into(cv, () => {
        R(0, 0, 54, 28, C.silver);
        for (let d = -28; d < 54; d += 5) line(d, 27, d + 27, 0, C.gray);
        Font.draw(GEM, 27, 10, { c: C.white, a: 'c', mono: true });
        Font.draw(GEM, 28, 11, { c: C.slate, a: 'c', mono: true });
        box(0, 0, 54, 28, null, C.gray);
      });
      return { v, x, y, w: 54, h: 28, cv, mask: new Uint8Array(54 * 28).fill(1), left: 54 * 28, open: false };
    });
    this.won = false;
    this.phase = 'scratch';
    this.cur = { x: 160, y: 104 };
    this.build();
  }

  scratchAt(px, py) {
    let hitAny = false;
    for (const s of this.spots) {
      if (s.open) continue;
      if (px < s.x - 4 || px > s.x + s.w + 4 || py < s.y - 4 || py > s.y + s.h + 4) continue;
      const c = s.cv.getContext('2d');
      for (let dy = -3; dy <= 3; dy++) for (let dx = -3; dx <= 3; dx++) {
        if (dx * dx + dy * dy > 10) continue;
        const lx = Math.floor(px - s.x + dx), ly = Math.floor(py - s.y + dy);
        if (lx < 0 || ly < 0 || lx >= s.w || ly >= s.h) continue;
        const k = ly * s.w + lx;
        if (!s.mask[k]) continue;
        s.mask[k] = 0; s.left--; c.clearRect(lx, ly, 1, 1); hitAny = true;
      }
      if (s.left < s.w * s.h * 0.45) this.openSpot(s);
    }
    if (hitAny) {
      this.scratchT -= 1;
      if (this.scratchT <= 0) { Snd.play('scratch'); this.scratchT = 3; }
      if (Math.random() < 0.4) this.fx.add({ type: 'dot', x: px + U.range(-2, 2), y: py, vx: U.range(-20, 20), vy: U.range(-30, 0), g: 200, life: 0.5, c: U.pick([C.silver, C.gray, C.white]) });
    }
  }

  openSpot(s) {
    if (s.open) return;
    s.open = true;
    s.cv.getContext('2d').clearRect(0, 0, s.w, s.h);
    s.pop = 0.3;
    Snd.play('pop');
    this.fx.burst(s.x + s.w / 2, s.y + s.h / 2, 10, [C.silver, C.white, C.gray], 60);
    if (this.spots.every(x => x.open)) this.done();
  }

  async revealAll() {
    for (const s of this.spots) { if (!s.open) { this.openSpot(s); await this.tl.wait(0.08); } }
  }

  done() {
    if (this.phase !== 'scratch') return;
    const tk = TICKETS[this.sel];
    const pay = this.prize * tk.price;
    this.phase = 'done';
    this.tl.after(0.4, () => {
      this.win = this.finish('scratch', tk.price, pay, 160, 100, { jackpot: this.prize >= 100 });
      if (!pay) this.say('NO LUCK THIS TIME...', C.lav, 2.2);
      else if (this.prize === 1) this.say('FREE TICKET! YOUR GEMS BACK', C.lime, 2.2);
      this.build();
    });
    this.build();
    this.ui.clear();
  }

  update(dt) {
    if (super.update(dt)) return;
    for (const s of this.spots) if (s.pop) s.pop = Math.max(0, s.pop - dt);
    if (this.phase === 'scratch') {
      const m = Input.mouse;
      // keyboard gem cursor
      const ax = Input.axis();
      if (ax.x || ax.y) { this.cur.x = U.clamp(this.cur.x + ax.x * 110 * dt, 60, 318); this.cur.y = U.clamp(this.cur.y + ax.y * 110 * dt, 20, 175); this.kb = true; }
      if (m.moved) { this.cur.x = m.x; this.cur.y = m.y; this.kb = false; }
      // buttons (mouse or gem cursor + Z)
      const onBtn = this.ui.hit(this.cur.x, this.cur.y);
      if ((m.pressed && this.ui.hit(m.x, m.y)) || (Input.pressed('a') && onBtn)) { this.ui.press(m.pressed ? this.ui.hit(m.x, m.y) : onBtn); return; }
      if (m.down) {
        const px = this.last ? this.last.x : m.x, py = this.last ? this.last.y : m.y;
        const d = Math.max(1, Math.hypot(m.x - px, m.y - py));
        for (let i = 0; i <= d; i += 2) this.scratchAt(px + (m.x - px) * i / d, py + (m.y - py) * i / d);
        this.last = { x: m.x, y: m.y };
      } else this.last = null;
      if (Input.isDown('a')) { this.scratchAt(this.cur.x, this.cur.y); this.scratchAt(this.cur.x + U.range(-1, 1), this.cur.y + U.range(-1, 1)); }
      return;
    }
    this.ui.update(dt);
  }

  drawTicketRow(b, f) {
    const tk = TICKETS[b.i], ok = State.money >= tk.price;
    box(b.x, b.y, b.w, b.h, f ? tk.d : C.night, f ? C.yellow : tk.d);
    spr(Mini.get(tk.sym), b.x + 3, b.y + 3);
    Font.draw(tk.name, b.x + 18, b.y + 5, { c: ok ? (f ? C.white : tk.c) : C.slate });
    Font.draw('WIN UP TO ' + U.moneyShort(tk.price * 500), b.x + 150, b.y + 6, { c: ok ? C.lav : C.slate, f: 's', a: 'c' });
    Font.draw(U.moneyShort(tk.price), b.x + b.w - 4, b.y + 5, { c: ok ? C.yellow : C.slate, a: 'r' });
  }

  drawTicket() {
    const tk = TICKETS[this.sel];
    const x = 64, y = 16, w = 192, h = 158;
    R(x + 3, y + 3, w, h, C.black);
    R(x, y, w, h, tk.c);
    for (let yy = y + 2; yy < y + h; yy += 6) for (let xx = x + ((yy / 6) % 2) * 3 + 2; xx < x + w; xx += 6) P(xx, yy, tk.d);
    box(x, y, w, h, null, tk.d);
    box(x + 2, y + 2, w - 4, h - 4, null, C.white);
    R(x + 6, y + 6, w - 12, 22, tk.d);
    Font.draw(tk.name, x + w / 2, y + 9, { c: C.white, a: 'c', ol: C.ink, s: tk.name.length > 10 ? 1 : 2 });
    spr(Spr.sym[tk.sym], x + 6, y + 6); spr(Spr.sym[tk.sym], x + w - 28, y + 6);
    Font.draw('MATCH 3 AMOUNTS TO WIN THAT AMOUNT!', x + w / 2, y + 32, { c: C.ink, a: 'c', f: 's' });
    for (const s of this.spots) {
      const win = this.phase === 'done' && this.prize && s.v === this.prize;
      box(s.x - 1, s.y - 1, s.w + 2, s.h + 2, win && Math.floor(this.t * 6) % 2 ? C.yellow : C.white, C.ink);
      const txt = U.moneyShort(s.v * tk.price);
      const big = s.v >= 100;
      Font.draw(txt, s.x + s.w / 2, s.y + 10 - (s.pop ? 2 : 0), { c: big ? C.crimson : C.ink, a: 'c' });
      if (s.v === 500) Font.draw('TOP PRIZE', s.x + s.w / 2, s.y + 20, { c: C.crimson, a: 'c', f: 's' });
      if (!s.open) spr(s.cv, s.x, s.y);
    }
    Font.draw('TOP PRIZE ' + U.moneyShort(tk.price * 500), x + w / 2, y + h - 11, { c: C.ink, a: 'c', f: 's' });
  }

  draw() {
    R(0, 0, W, H, C.plum);
    for (let i = 0; i < 12; i++) { alpha(0.12); circ((i * 83) % W, 20 + (i * 47) % 150, 6 + i % 4, [C.pink, C.yellow, C.cyan][i % 3]); alpha(1); }
    if (this.phase === 'shop') {
      panel(34, 16, 252, 152, C.night, C.gold);
      Font.draw('CHOOSE A TICKET', 160, 20, { c: C.lemon, a: 'c' });
      this.ui.draw();
      Font.draw('MATCH 3 AMOUNTS TO WIN. TOP PRIZE: 500x THE TICKET!', 160, 160, { c: C.lav, f: 's', a: 'c' });
    } else {
      this.drawTicket();
      Font.draw('DRAG TO', 30, 60, { c: C.lav, f: 's', a: 'c' });
      Font.draw('SCRATCH', 30, 67, { c: C.lav, f: 's', a: 'c' });
      Font.draw('OR ARROWS', 30, 82, { c: C.gray, f: 's', a: 'c' });
      Font.draw('+ HOLD Z', 30, 89, { c: C.gray, f: 's', a: 'c' });
      this.ui.draw();
      if (this.phase === 'scratch' && (this.kb || Input.last === 'key' || Input.mouse.over)) {
        spr(Spr.bigGem, this.cur.x - 8, this.cur.y - 8); // a diamond scratches anything
      }
      if (this.phase === 'done' && this.win > 0) { Font.draw('YOU', 289, 118, { c: C.yellow, a: 'c', ol: C.ink }); Font.draw('WON', 289, 128, { c: C.yellow, a: 'c', ol: C.ink }); Font.draw(U.moneyShort(this.win), 289, 140, { c: C.lime, a: 'c', ol: C.ink }); }
    }
    this.drawTop();
    this.fx.draw();
    UI.drawPops(this, 1 / 60);
    this.drawMsg(150);
  }
}

GAMES.scratch = obj => new ScratchScene(obj);
GAME_INFO.scratch = () => ({ name: 'SCRATCH TICKETS', limits: U.moneyShort(TICKETS[0].price) + '-' + U.moneyShort(TICKETS[TICKETS.length - 1].price) });

// ---- js/games/wheel.js
'use strict';
// =====================================================================
//  CASHINO - the Big Wheel. Bet on a multiplier, spin the wheel, the
//  flapper clacks on every peg. The cat segment means the house wins.
// =====================================================================

const WHEEL_CFG = {
  main: { name: 'BIG WHEEL', min: gems(1), max: gems(2000) },
  high: { name: 'HIGH ROLLER WHEEL', min: gems(100), max: gems(200000) },
  diamond: { name: 'GOLDEN WHEEL', min: gems(10000), max: gems(200000000) },
};
const WHEEL = {
  // 0 = house (cat). 25 segments, every bet returns 96%
  SEGS: [24, 2, 4, 2, 8, 2, 4, 2, 12, 2, 4, 2, 0, 2, 4, 2, 8, 2, 12, 2, 4, 2, 8, 2, 4],
  BETS: [2, 4, 8, 12, 24],
  COLORS: { 2: C.yellow, 4: C.sky, 8: C.lime, 12: C.pink, 24: C.red, 0: C.ink },
  DARK: { 2: C.gold, 4: C.blue, 8: C.green, 12: C.magenta, 24: C.crimson, 0: C.black },
  payout(bets, seg) { const m = this.SEGS[seg]; return m ? (bets[m] || 0) * m : 0; },
};

class WheelScene extends GameScene {
  constructor(obj) {
    const cfg = WHEEL_CFG[obj.cfg] || WHEEL_CFG.main;
    super(obj, cfg.name);
    this.cfg = cfg;
    this.bets = {}; this.undo = [];
    this.chips = chipSet(cfg.min, cfg.max, 5);
    this.chip = this.chips[0];
    State.lastBet = State.lastBet || {};
    this.last = State.lastBet['wh:' + obj.cfg] || null;
    this.cx = 88; this.cy = 98; this.R = 74;
    this.wa = 0; this.flap = 0; this.lastPeg = 0; this.result = null; this.resultT = 0;
    this.cv = Gfx.canvas(this.R * 2 + 1, this.R * 2 + 1);
    this.img = this.cv.getContext('2d').createImageData(this.R * 2 + 1, this.R * 2 + 1);
    this.buf = new Uint32Array(this.img.data.buffer);
    const D = this.R * 2 + 1;
    this.lr = new Float32Array(D * D); this.la = new Float32Array(D * D);
    for (let j = 0; j < D; j++) for (let i = 0; i < D; i++) { const dx = i - this.R, dy = j - this.R; this.lr[j * D + i] = Math.hypot(dx, dy); this.la[j * D + i] = Math.atan2(dy, dx); }
    this.u = {}; for (const k in WHEEL.COLORS) { this.u[k] = Gfx.u32(WHEEL.COLORS[k]); this.u['d' + k] = Gfx.u32(WHEEL.DARK[k]); }
    Object.assign(this.u, { gold: Gfx.u32(C.gold), goldL: Gfx.u32(C.lemon), bronze: Gfx.u32(C.bronze), white: Gfx.u32(C.white), wood: Gfx.u32(C.crimson), woodD: Gfx.u32(C.wine) });
    this.build();
  }
  canLeave() { return !this.busy && !Object.keys(this.bets).length; }
  leave() { if (!this.busy && this.undo.length) { this.popChip(); return; } super.leave(); }
  total() { let t = 0; for (const k in this.bets) t += this.bets[k]; return t; }

  build() {
    const g = this.ui;
    g.clear();
    WHEEL.BETS.forEach((m, i) => g.add({ x: 176 + (i % 3) * 47, y: 20 + Math.floor(i / 3) * 38, w: 44, h: 34, m, draw: (b, f) => this.drawBetBox(b, f), onPress: () => this.place(m), silent: true }));
    this.chips.forEach((v, i) => g.add({ x: 178 + i * 27, y: 100, w: 25, h: 24, value: v, draw: (b, f) => { drawChipBtn(b, f); if (this.chip === v) R(b.x + b.w / 2 - 1, b.y - 3, 3, 1, C.yellow); }, onPress: () => { this.chip = v; }, sound: 'chip' }));
    this.spinBtn = g.add({ x: 246, y: 134, w: 70, h: 24, label: 'SPIN!', style: 'red', onPress: () => this.spin() });
    g.add({ x: 176, y: 134, w: 32, h: 11, label: 'UNDO', font: 's', onPress: () => this.popChip(), silent: true });
    g.add({ x: 210, y: 134, w: 32, h: 11, label: 'REBET', font: 's', onPress: () => this.rebet() });
    g.add({ x: 176, y: 147, w: 66, h: 11, label: 'CLEAR', font: 's', onPress: () => { if (!this.busy) { this.bets = {}; this.undo = []; Snd.play('chips'); } } });
    g.focus = this.spinBtn;
  }

  place(m) {
    if (this.busy) return;
    const v = this.chip;
    if (this.total() + v > this.cfg.max) { Snd.play('error'); this.say('TABLE MAX ' + U.moneyShort(this.cfg.max), C.cherry); return; }
    if (this.total() + v > State.money) { Snd.play('error'); this.say('NOT ENOUGH GEMS', C.cherry); return; }
    this.bets[m] = (this.bets[m] || 0) + v; this.undo.push([m, v]); Snd.play('chip');
  }
  popChip() { if (this.busy || !this.undo.length) return; const [m, v] = this.undo.pop(); this.bets[m] -= v; if (this.bets[m] <= 0) delete this.bets[m]; Snd.play('chip'); }
  rebet() {
    if (this.busy || !this.last) return;
    let s = 0; for (const k in this.last) s += this.last[k];
    if (s > State.money) { Snd.play('error'); return; }
    this.bets = Object.assign({}, this.last); this.undo = Object.entries(this.bets).map(([k, v]) => [+k, v]); Snd.play('chips');
  }

  async spin() {
    if (this.busy) return;
    if (!this.total() && this.last) this.rebet();
    const bet = this.total();
    if (!bet) { Snd.play('error'); this.say('BET ON A MULTIPLIER FIRST', C.cherry); return; }
    this.busy = true;
    this.last = Object.assign({}, this.bets); State.lastBet['wh:' + this.obj.cfg] = this.last;
    State.take(bet);
    this.result = null;
    const bets = this.bets, n = WHEEL.SEGS.length, seg = TAU / n;
    const idx = Luck.pick(() => U.int(0, n - 1), s => WHEEL.payout(bets, s));
    // pointer at the top: wheel angle must end at -(idx + 0.5 + jitter) * seg
    const jitter = U.range(-0.35, 0.35);
    const goal = -(idx + 0.5 + jitter) * seg;
    const start = this.wa;
    let delta = ((goal - start) % TAU + TAU) % TAU + TAU * U.int(3, 4);
    const dur = U.range(5, 6.2);
    this.spinning = { t: 0, dur, start, delta };
    Snd.play('lever');
    while (this.spinning) { await this.tl.wait(0.05); if (this.dead) return; }
    this.result = idx; this.resultT = 0;
    const m = WHEEL.SEGS[idx];
    if (m === 0) { Snd.play('meow'); this.say('MR. WHISKERS WINS! THE HOUSE TAKES IT ALL', C.cherry, 2.4); }
    const pay = WHEEL.payout(bets, idx);
    this.finish('wheel', bet, pay, 88, 98, { quiet: m === 0 });
    await this.tl.wait(1.5);
    this.bets = {}; this.undo = [];
    this.busy = false;
  }

  update(dt) {
    if (this.busy && Input.pressed('b')) Input.eat('b');
    if (super.update(dt)) return;
    this.resultT += dt;
    const s = this.spinning;
    if (s) {
      s.t += dt;
      const k = Math.min(1, s.t / s.dur);
      this.wa = s.start + s.delta * Ease.outQuart(k);
      if (k >= 1) { this.spinning = null; this.wa = s.start + s.delta; }
    } else if (!this.busy) this.wa += dt * 0.15;
    // flapper: count pegs passing the pointer
    const n = WHEEL.SEGS.length, seg = TAU / n;
    const peg = Math.floor(this.wa / seg);
    if (peg !== this.lastPeg) { if (this.spinning) Snd.play('clack'); this.flap = 1; this.lastPeg = peg; }
    this.flap = Math.max(0, this.flap - dt * 10);
    this.ui.update(dt);
  }

  drawWheel() {
    const D = this.R * 2 + 1, buf = this.buf, u = this.u, n = WHEEL.SEGS.length, seg = TAU / n;
    const RAD = this.R, wa = this.wa;
    const blinkIdx = this.result !== null && Math.floor(this.resultT * 6) % 2 === 0 ? this.result : -1;
    for (let p = 0; p < D * D; p++) {
      const r = this.lr[p];
      if (r > RAD + 0.5) { buf[p] = 0; continue; }
      if (r > RAD - 5) { buf[p] = r > RAD - 1.5 ? u.woodD : u.wood; continue; }
      if (r > RAD - 7) { buf[p] = u.gold; continue; }
      // angle measured clockwise from the top, in wheel space
      let a = this.la[p] + Math.PI / 2 - wa;
      a = ((a % TAU) + TAU) % TAU;
      const f = a / seg, i = Math.floor(f), fr = f - i;
      if (r < 13) { buf[p] = r < 10 ? (r < 4 ? u.goldL : u.gold) : u.bronze; continue; }
      if (fr < 0.035 || fr > 0.965) { buf[p] = u.gold; continue; }
      const m = WHEEL.SEGS[i];
      buf[p] = i === blinkIdx ? u.white : (r < 24 ? u['d' + m] : u[m]);
    }
    this.cv.getContext('2d').putImageData(this.img, 0, 0);
    ctx.drawImage(this.cv, this.cx - RAD, this.cy - RAD);
    // pegs + labels
    for (let i = 0; i < n; i++) {
      const a0 = wa + i * seg - Math.PI / 2;
      P(this.cx + Math.cos(a0) * (RAD - 3), this.cy + Math.sin(a0) * (RAD - 3), C.white);
      const ac = a0 + seg / 2, m = WHEEL.SEGS[i];
      const lx = this.cx + Math.cos(ac) * (RAD - 22), ly = this.cy + Math.sin(ac) * (RAD - 22);
      if (m) Font.draw('x' + m, lx, ly - 2, { c: C.white, f: 's', a: 'c', ol: C.ink, sp: 0 });
      else { spr(Spr.icon.cat, lx - 2, ly - 3); }
    }
    Font.draw(GEM, this.cx, this.cy - 4, { a: 'c' });
    // flapper at the top
    const fx = this.cx, fy = this.cy - RAD - 4, tilt = Math.round(this.flap * 3);
    R(fx - 5, fy - 6, 11, 5, C.charcoal);
    for (let k = 0; k < 9; k++) { const w = Math.max(0, 4 - Math.floor(k / 2)); R(fx - w + (k > 3 ? tilt : 0), fy - 1 + k, w * 2 + 1, 1, C.yellow); }
    P(fx, fy + 8, C.white);
  }

  drawBetBox(b, f) {
    const m = b.m, c = WHEEL.COLORS[m], has = this.bets[m];
    const hit = this.result !== null && WHEEL.SEGS[this.result] === m && this.resultT < 3 && Math.floor(this.resultT * 6) % 2 === 0;
    box(b.x, b.y, b.w, b.h, hit ? C.white : WHEEL.DARK[m], f ? C.yellow : c);
    Font.draw('x' + m, b.x + b.w / 2, b.y + 4, { c: hit ? C.ink : c, a: 'c', ol: hit ? null : C.ink });
    Font.draw('PAYS ' + (m - 1) + ':1', b.x + b.w / 2, b.y + 14, { c: C.white, f: 's', a: 'c' });
    if (has) { chipStack(has, b.x + 12, b.y + 29, 4, 5); Font.draw(U.moneyShort(has), b.x + b.w - 3, b.y + 25, { c: C.lemon, f: 's', a: 'r' }); }
  }

  draw() {
    R(0, 0, W, H, C.night);
    for (let x = 0; x < W; x += 12) R(x, 13, 6, H, C.plum);
    // stand
    R(this.cx - 6, this.cy + this.R - 4, 12, 20, C.gray);
    circ(this.cx + 3, this.cy + 4, this.R + 2, C.black);
    this.drawWheel();
    // info
    Font.draw('BET ' + U.moneyShort(this.total()), 178, 164, { c: C.yellow });
    Font.draw('LIMIT ' + U.moneyShort(this.cfg.max), 316, 165, { c: C.gray, f: 's', a: 'r' });
    const cb = { x: 176 + 2 * 47, y: 58, w: 44, h: 34 };
    box(cb.x, cb.y, cb.w, cb.h, C.ink, C.slate);
    spr(Spr.icon.cat, cb.x + 20, cb.y + 4);
    Font.draw('HOUSE', cb.x + 22, cb.y + 14, { c: C.gray, f: 's', a: 'c' });
    Font.draw('WINS', cb.x + 22, cb.y + 21, { c: C.gray, f: 's', a: 'c' });
    this.ui.draw();
    this.drawTop();
    this.fx.draw();
    UI.drawPops(this, 1 / 60);
    this.drawMsg(150);
  }
}

GAMES.wheel = obj => new WheelScene(obj);
GAME_INFO.wheel = cfg => { const c = WHEEL_CFG[cfg] || WHEEL_CFG.main; return { name: c.name, limits: U.moneyShort(c.min) + '-' + U.moneyShort(c.max) }; };

// ---- js/games/rocket.js
'use strict';
// =====================================================================
//  CASHINO - the Rocket. The multiplier climbs while the rocket flies;
//  cash out before it blows up. Crash point: P(M >= m) = 0.97 / m.
// =====================================================================

const ROCKET_CFG = {
  moon: { name: 'TO THE MOON', min: 10, max: gems(10) },
  mars: { name: 'ROCKET TO MARS', min: gems(1), max: gems(1000) },
  high: { name: 'GALAXY ROCKET', min: gems(100), max: gems(200000) },
};
const ROCKET = {
  K: 0.16, // growth rate: m(t) = e^(K t)
  crash() { const u = 1 - U.rand(); return Math.min(1000, Math.max(1, Math.floor((0.97 / u) * 100) / 100)); },
  at(t) { return Math.exp(this.K * t); },
  timeFor(m) { return Math.log(m) / this.K; },
  AUTO: [0, 1.5, 2, 3, 5, 10, 25, 100],
};

class RocketScene extends GameScene {
  constructor(obj) {
    const cfg = ROCKET_CFG[obj.cfg] || ROCKET_CFG.mars;
    super(obj, cfg.name);
    this.cfg = cfg;
    this.bp = new BetPicker('rocket:' + obj.cfg, cfg.min, cfg.max);
    this.bp.fit();
    State.lastBet = State.lastBet || {};
    this.autoIdx = State.lastBet['rocket-auto'] || 0;
    this.phase = 'ready'; // ready | fly | boom
    this.m = 1; this.ft = 0; this.alt = 0;
    this.hist = [];
    this.stars = Array.from({ length: 50 }, () => ({ x: U.range(0, W), y: U.range(0, H), z: U.range(0.3, 1) }));
    this.shakeY = 0;
    this.build();
  }
  canLeave() { return this.phase !== 'fly'; }

  build() {
    const g = this.ui;
    g.clear();
    if (this.phase === 'fly') {
      this.cashBtn = g.add({ x: 104, y: 150, w: 112, h: 24, label: this.cashed ? 'CASHED OUT' : 'CASH OUT', style: 'green', onPress: () => this.cashOut(), enabled: !this.cashed });
      g.focus = this.cashBtn;
      return;
    }
    this.bet = addBetButtons(this, this.bp, 6, 160);
    g.add({ x: 88, y: 160, w: 58, h: 13, label: 'AUTO ' + (ROCKET.AUTO[this.autoIdx] ? ROCKET.AUTO[this.autoIdx] + 'x' : 'OFF'), font: 's', onPress: b => { this.autoIdx = (this.autoIdx + 1) % ROCKET.AUTO.length; State.lastBet['rocket-auto'] = this.autoIdx; b.label = 'AUTO ' + (ROCKET.AUTO[this.autoIdx] ? ROCKET.AUTO[this.autoIdx] + 'x' : 'OFF'); }, sound: 'move' });
    this.goBtn = g.add({ x: 236, y: 154, w: 80, h: 22, label: 'LAUNCH!', style: 'red', onPress: () => this.launch() });
    g.focus = this.goBtn;
  }

  launch() {
    if (this.phase === 'fly') return;
    const bet = this.bp.value;
    if (State.money < bet) { Snd.play('error'); this.say(State.money < this.cfg.min ? 'NOT ENOUGH GEMS' : 'LOWER YOUR BET', C.cherry); this.bp.fit(); return; }
    State.take(bet);
    this.stake = bet;
    this.crashAt = Luck.pick(() => ROCKET.crash(), x => x);
    this.auto = ROCKET.AUTO[this.autoIdx];
    this.phase = 'fly'; this.cashed = false; this.cashM = 0;
    this.ft = 0; this.m = 1; this.alt = 0;
    this.engineT = 0;
    Snd.play('fire');
    this.build();
    if (this.crashAt <= 1) { this.ft = 0; this.explode(); }
  }

  cashOut() {
    if (this.phase !== 'fly' || this.cashed) return;
    this.cashed = true;
    this.cashM = Math.floor(this.m * 100) / 100;
    const pay = Math.floor(this.stake * this.cashM);
    Snd.play('cashout');
    this.win = this.finish('rocket', this.stake, pay, 160, 70, { quiet: true, jackpot: this.cashM >= 100 });
    this.build();
  }

  explode() {
    this.phase = 'boom';
    this.boomT = 0;
    Snd.play('boom'); Gfx.shake(5, 0.6); Gfx.flash(C.orange, 0.25);
    const rx = 160, ry = 96 + this.shakeY;
    this.fx.burst(rx, ry, 60, [C.yellow, C.orange, C.red, C.white], 140);
    this.fx.smoke(rx, ry, 12, C.gray);
    this.hist.unshift(this.crashAt); if (this.hist.length > 8) this.hist.pop();
    if (!this.cashed) { State.settle('rocket', this.stake, 0); this.say('BOOM! CRASHED AT ' + this.crashAt.toFixed(2) + 'x', C.cherry, 2); }
    else this.say('IT CRASHED AT ' + this.crashAt.toFixed(2) + 'x - YOU GOT OUT AT ' + this.cashM.toFixed(2) + 'x', C.lime, 2.4);
    this.tl.after(1.2, () => { this.phase = 'ready'; this.bp.fit(); this.build(); });
  }

  update(dt) {
    if (super.update(dt)) return;
    if (this.phase === 'fly') {
      this.ft += dt;
      this.m = Math.min(ROCKET.at(this.ft), this.crashAt);
      this.engineT -= dt;
      if (this.engineT <= 0) { Snd.play('engine'); this.engineT = 0.14; }
      if (Math.floor(this.m * 10) !== Math.floor(ROCKET.at(this.ft - dt) * 10) && this.m < 10) Snd.play('tick', 0.6 + this.m * 0.1);
      if (this.auto && !this.cashed && this.m >= this.auto) { this.m = this.auto; this.cashOut(); }
      if (ROCKET.at(this.ft) >= this.crashAt) this.explode();
      if (Math.random() < 0.7) this.fx.smoke(160 + U.range(-2, 2), 118 + this.shakeY, 1, C.silver);
    }
    if (this.phase === 'ready') {
      if (Input.repeat('up')) { this.bp.up(); Snd.play('move'); }
      if (Input.repeat('down')) { this.bp.down(); Snd.play('move'); }
    }
    // starfield speed follows the climb
    const sp = this.phase === 'fly' ? 20 + this.m * 12 : 6;
    for (const s of this.stars) { s.y += sp * s.z * dt; if (s.y > H) { s.y = 12; s.x = U.range(0, W); } }
    this.alt += (this.phase === 'fly' ? sp : 0) * dt;
    this.shakeY = this.phase === 'fly' ? Math.round(Math.sin(this.t * 40) * (this.m > 5 ? 1 : 0.5)) : 0;
    this.ui.update(dt);
  }

  draw() {
    // sky gets darker as we climb
    const h = Math.min(1, this.alt / 900);
    const sky = h < 0.2 ? ['#3f74f0', '#5a8ef5', '#8fb4ff'] : h < 0.5 ? ['#1b2a6b', '#2542b8', '#3f74f0'] : [C.ink, C.night, C.navy];
    vgrad(0, 13, W, H - 13, sky);
    for (const s of this.stars) { if (h > 0.25 || s.z > 0.8) P(s.x, s.y, s.z > 0.7 ? C.white : C.lav); if (this.phase === 'fly' && this.m > 3) P(s.x, s.y - 1, C.slate); }
    // planets drift past at milestones
    const drawPlanet = (m0, x, r, c, dc, ring) => {
      if (this.phase !== 'fly' && this.phase !== 'boom') return;
      const k = (this.m - m0) / (m0 * 0.8);
      if (k < -0.2 || k > 1.3) return;
      const y = 10 + k * 190;
      circ(x, y, r, dc); circ(x - 1, y - 1, r - 1, c);
      if (ring) { for (let i = -r - 5; i <= r + 5; i++) P(x + i, y + Math.round(i * 0.25), C.lemon); }
    };
    drawPlanet(3, 60, 12, C.silver, C.gray);
    drawPlanet(8, 262, 16, C.orange, C.rust);
    drawPlanet(25, 70, 20, C.tang, C.bronze, true);
    drawPlanet(80, 250, 24, C.cyan, C.teal);
    // ground at launch
    if (h < 0.3) { const gy = 150 + this.alt * 0.6; if (gy < H) { R(0, gy, W, H - gy, C.forest); R(0, gy, W, 2, C.green); R(140, gy - 4, 40, 4, C.gray); } }
    // the rocket
    if (this.phase !== 'boom' || this.boomT < 0) this.drawRocket(160, 96 + this.shakeY);
    this.fx.draw();
    // multiplier
    const m = this.phase === 'ready' ? (this.hist.length ? this.hist[0] : 1) : this.m;
    const col = this.phase === 'boom' || (this.phase === 'ready' && this.hist.length) ? C.cherry : m < 2 ? C.white : m < 5 ? C.yellow : m < 10 ? C.tang : m < 50 ? C.pink : RAINBOW[Math.floor(this.t * 10) % 8];
    Font.draw(m.toFixed(2) + 'x', 160, 24, { c: col, a: 'c', s: 3, ol: C.ink });
    if (this.cashed) Font.draw('CASHED OUT AT ' + this.cashM.toFixed(2) + 'x  +' + U.moneyShort(this.win), 160, 50, { c: C.lime, a: 'c', ol: C.ink });
    else if (this.phase === 'fly') Font.draw('WIN ' + U.moneyShort(Math.floor(this.stake * this.m)), 160, 50, { c: C.white, a: 'c', ol: C.ink });
    else if (this.phase === 'ready') Font.draw('SET A BET AND LAUNCH', 160, 50, { c: C.white, a: 'c', ol: C.ink, f: 's' });
    // history
    this.hist.forEach((v, i) => { const c = v >= 10 ? C.pink : v >= 2 ? C.lime : C.cherry; Font.draw(v.toFixed(2) + 'x', 312, 18 + i * 8, { c, f: 's', a: 'r', ol: C.ink }); });
    if (this.phase !== 'fly') {
      R(0, 150, W, H - 150, C.ink); R(0, 150, W, 1, C.bronze);
      this.bet.draw();
      Font.draw('AUTO CASH OUT', 117, 153, { c: C.gray, f: 's', a: 'c' });
    }
    this.ui.draw();
    this.drawTop();
    UI.drawPops(this, 1 / 60);
    this.drawMsg(64);
  }

  drawRocket(x, y) {
    // flame
    const fl = Math.floor(this.t * 20) % 3;
    if (this.phase === 'fly') {
      const len = 8 + fl * 2 + Math.min(10, this.m);
      for (let i = 0; i < len; i++) { const w = Math.max(1, 4 - Math.floor(i / 3)); R(x - w, y + 14 + i, w * 2 + 1, 1, i < 3 ? C.white : i < 7 ? C.yellow : i < 12 ? C.orange : C.red); }
    }
    // fins
    R(x - 8, y + 6, 3, 9, C.red); R(x + 6, y + 6, 3, 9, C.red); R(x - 8, y + 14, 3, 1, C.crimson); R(x + 6, y + 14, 3, 1, C.crimson);
    // body
    R(x - 5, y - 8, 11, 22, C.white); R(x + 3, y - 8, 3, 22, C.silver);
    R(x - 4, y - 12, 9, 4, C.white); R(x - 3, y - 15, 7, 3, C.red); R(x - 2, y - 17, 5, 2, C.red); P(x, y - 18, C.red);
    circ(x, y - 2, 3, C.gray); circ(x, y - 2, 2, C.sky); P(x - 1, y - 3, C.white);
    R(x - 5, y + 8, 11, 2, C.red);
    R(x - 3, y + 14, 7, 2, C.gray);
  }
}

GAMES.rocket = obj => new RocketScene(obj);
GAME_INFO.rocket = cfg => { const c = ROCKET_CFG[cfg] || ROCKET_CFG.mars; return { name: c.name, limits: U.moneyShort(c.min) + '-' + U.moneyShort(c.max) }; };

// ---- js/games/hilo.js
'use strict';
// =====================================================================
//  CASHINO - Hi-Lo. Will the next card be higher or lower? Every right
//  guess multiplies the pot (ties lose). Cash out whenever you like.
// =====================================================================

const HILO_CFG = {
  penny: { name: 'HI-LO', min: 25, max: gems(25) },
  main: { name: 'HI-LO DELUXE', min: gems(1), max: gems(2500) },
};
const HILO = {
  p(r, dir) { return dir === 'hi' ? (13 - r) / 13 : (r - 1) / 13; },
  mult(r, dir) { const p = this.p(r, dir); return p > 0 ? Math.floor((0.97 / p) * 100) / 100 : 0; },
  card() { return { r: U.int(1, 13), s: U.pick(Cards.SUITS) }; },
  right(prev, next, dir) { return dir === 'hi' ? next.r > prev.r : next.r < prev.r; },
};

class HiLoScene extends GameScene {
  constructor(obj) {
    const cfg = HILO_CFG[obj.cfg] || HILO_CFG.penny;
    super(obj, cfg.name);
    this.cfg = cfg;
    this.bp = new BetPicker('hilo:' + obj.cfg, cfg.min, cfg.max);
    this.bp.fit();
    this.phase = 'bet'; // bet | guess | busy
    this.pot = 0; this.streak = 0;
    this.cur = null; this.trail = [];
    this.build();
  }
  canLeave() { return this.phase === 'bet'; }

  build() {
    const g = this.ui;
    g.clear();
    if (this.phase === 'bet') {
      this.bet = addBetButtons(this, this.bp, 94, 158);
      this.dealBtn = g.add({ x: 184, y: 155, w: 60, h: 20, label: 'DEAL', style: 'red', onPress: () => this.deal() });
      g.focus = this.dealBtn;
    } else if (this.phase === 'guess') {
      const r = this.cur.c.r;
      const mh = HILO.mult(r, 'hi'), ml = HILO.mult(r, 'lo');
      const hi = g.add({ x: 212, y: 40, w: 88, h: 26, label: 'HIGHER', sub: mh ? 'x' + mh.toFixed(2) : '-', style: 'green', onPress: () => this.guess('hi'), enabled: mh > 0 });
      const lo = g.add({ x: 212, y: 72, w: 88, h: 26, label: 'LOWER', sub: ml ? 'x' + ml.toFixed(2) : '-', style: 'blue', onPress: () => this.guess('lo'), enabled: ml > 0 });
      g.add({ x: 212, y: 104, w: 88, h: 14, label: 'SKIP CARD', font: 's', onPress: () => this.skip() });
      g.add({ x: 20, y: 150, w: 110, h: 22, label: 'CASH OUT', sub: U.moneyShort(this.pot), style: 'gold', onPress: () => this.cashOut(), enabled: this.streak > 0 });
      g.focus = mh >= ml ? hi : lo;
    }
  }

  async deal() {
    const bet = this.bp.value;
    if (State.money < bet) { Snd.play('error'); this.say(State.money < this.cfg.min ? 'NOT ENOUGH GEMS' : 'LOWER YOUR BET', C.cherry); this.bp.fit(); return; }
    State.take(bet);
    this.stake = bet; this.pot = bet; this.streak = 0; this.trail = [];
    this.phase = 'busy'; this.build();
    await this.newCard(HILO.card());
    this.phase = 'guess'; this.build();
  }

  async newCard(c) {
    if (this.cur) {
      this.trail.push(this.cur);
      if (this.trail.length > 5) this.trail.shift();
      this.trail.forEach((tc, i) => this.tl.tween(tc, { x: 20 + i * 12, y: 60 }, 0.2));
    }
    const tc = new TableCard(c, 150, 20, false, 'l');
    this.cur = tc;
    Snd.play('card');
    await this.tl.tween(tc, { x: 128, y: 56 }, 0.2, 'outQuad');
    await tc.flip(this.tl);
  }

  async guess(dir) {
    if (this.phase !== 'guess') return;
    this.phase = 'busy'; this.build();
    const prev = this.cur.c;
    const next = Luck.pick(() => HILO.card(), c => (HILO.right(prev, c, dir) ? 1 : 0));
    await this.newCard(next);
    if (HILO.right(prev, next, dir)) {
      this.pot = Math.floor(this.pot * HILO.mult(prev.r, dir));
      this.streak++;
      Snd.play('winSmall');
      this.fx.text('x' + HILO.mult(prev.r, dir).toFixed(2), 144, 50, C.lime);
      this.phase = 'guess'; this.build();
    } else {
      Snd.play('lose');
      this.say(next.r === prev.r ? 'SAME CARD - TIES LOSE!' : 'WRONG! THE POT IS GONE', C.cherry, 2);
      State.settle('hilo', this.stake, 0);
      await this.tl.wait(1.2);
      this.reset();
    }
  }

  async skip() {
    if (this.phase !== 'guess') return;
    this.phase = 'busy'; this.build();
    await this.newCard(HILO.card());
    this.phase = 'guess'; this.build();
  }

  cashOut() {
    if (this.phase !== 'guess' || !this.streak) return;
    this.win = this.finish('hilo', this.stake, this.pot, 60, 150);
    this.reset();
  }

  reset() { this.phase = 'bet'; this.cur = null; this.trail = []; this.pot = 0; this.streak = 0; this.bp.fit(); this.build(); }

  update(dt) {
    if (super.update(dt)) return;
    if (this.phase === 'bet') {
      if (Input.repeat('up')) { this.bp.up(); Snd.play('move'); }
      if (Input.repeat('down')) { this.bp.down(); Snd.play('move'); }
    }
    this.ui.update(dt);
  }

  draw() {
    R(0, 0, W, H, C.forest);
    for (let y = 16; y < H; y += 6) for (let x = (y % 12 ? 3 : 0); x < W; x += 6) P(x, y, '#10573a');
    // deck
    for (let i = 0; i < 4; i++) spr(Spr.cardBack('l'), 150 + i, 16 - i);
    for (const tc of this.trail) tc.draw();
    if (this.cur) {
      box(122, 50, 44, 56, null, C.yellow);
      this.cur.draw();
    }
    if (this.phase === 'bet') {
      Font.draw('GUESS HIGHER OR LOWER.', 160, 110, { c: C.white, a: 'c' });

      box(14, 118, 122, 26, C.ink, C.gold);

      Font.draw('A LOW   K HIGH', 256, 124, { c: C.mint, f: 's', a: 'c' });
    }
    this.ui.draw();
    this.drawTop();
    this.fx.draw();
    UI.drawPops(this, 1 / 60);
    this.drawMsg(24);
  }
}

// ---- js/games/dice.js
'use strict';
// =====================================================================
//  CASHINO - Lucky 7 dice. Bet on the total of two dice, then throw
//  them against the back wall. Hold ROLL to shake them first.
// =====================================================================

const DICE_CFG = {
  main: { name: 'LUCKY 7 DICE', min: gems(1), max: gems(2500), felt: C.felt, feltL: C.feltL, feltD: C.forest },
  high: { name: 'HIGH ROLLER DICE', min: gems(100), max: gems(250000), felt: C.grape, feltL: C.violet, feltD: C.plum },
};
const DICE_BETS = [
  { k: 'under', label: 'UNDER 7', sub: '2 TO 6', m: 2.3, win: (a, b) => a + b < 7 },
  { k: 'seven', label: 'LUCKY 7', sub: 'EXACTLY 7', m: 5.8, win: (a, b) => a + b === 7 },
  { k: 'over', label: 'OVER 7', sub: '8 TO 12', m: 2.3, win: (a, b) => a + b > 7 },
  { k: 'doubles', label: 'DOUBLES', sub: 'ANY PAIR', m: 5.8, win: (a, b) => a === b },
  { k: 'snake', label: 'SNAKE EYES', sub: '1 AND 1', m: 34, win: (a, b) => a === 1 && b === 1 },
  { k: 'box', label: 'BOXCARS', sub: '6 AND 6', m: 34, win: (a, b) => a === 6 && b === 6 },
];
const DiceMath = {
  payout(bets, a, b) { let p = 0; for (const d of DICE_BETS) if (bets[d.k] && d.win(a, b)) p += bets[d.k] * d.m; return Math.round(p); },
  roll() { return [U.int(1, 6), U.int(1, 6)]; },
};

class DiceScene extends GameScene {
  constructor(obj) {
    const cfg = DICE_CFG[obj.cfg] || DICE_CFG.main;
    super(obj, cfg.name);
    this.cfg = cfg;
    this.bets = {}; this.undo = [];
    this.chips = chipSet(cfg.min, cfg.max, 5);
    this.chip = this.chips[0];
    State.lastBet = State.lastBet || {};
    this.last = State.lastBet['dice:' + obj.cfg] || null;
    this.dice = [{ x: 120, y: 60, f: 3 }, { x: 140, y: 64, f: 4 }];
    this.result = null; this.resultT = 0; this.shaking = false; this.shakeT = 0;
    this.build();
  }
  canLeave() { return !this.busy && !this.undo.length; }
  leave() { if (!this.busy && this.undo.length) { this.popChip(); return; } super.leave(); }
  total() { let t = 0; for (const k in this.bets) t += this.bets[k]; return t; }

  build() {
    const g = this.ui;
    g.clear();
    DICE_BETS.forEach((d, i) => g.add({ x: 6 + (i % 3) * 72, y: 86 + Math.floor(i / 3) * 30, w: 70, h: 28, d, draw: (b, f) => this.drawBetBox(b, f), onPress: () => this.place(d.k), silent: true }));
    this.chips.forEach((v, i) => g.add({ x: 6 + i * 27, y: 150, w: 25, h: 24, value: v, draw: (b, f) => { drawChipBtn(b, f); if (this.chip === v) R(b.x + b.w / 2 - 1, b.y - 3, 3, 1, C.yellow); }, onPress: () => { this.chip = v; }, sound: 'chip' }));
    this.rollBtn = g.add({ x: 226, y: 86, w: 88, h: 34, label: 'ROLL!', sub: 'HOLD TO SHAKE', style: 'red', onPress: () => this.startShake(), silent: true });
    g.add({ x: 226, y: 124, w: 42, h: 13, label: 'UNDO', font: 's', onPress: () => this.popChip(), silent: true });
    g.add({ x: 272, y: 124, w: 42, h: 13, label: 'REBET', font: 's', onPress: () => this.rebet() });
    g.add({ x: 226, y: 140, w: 88, h: 13, label: 'CLEAR', font: 's', onPress: () => { if (!this.busy) { this.bets = {}; this.undo = []; Snd.play('chips'); } } });
    g.focus = this.rollBtn;
  }

  place(k) {
    if (this.busy) return;
    const v = this.chip;
    if (this.total() + v > this.cfg.max) { Snd.play('error'); this.say('TABLE MAX ' + U.moneyShort(this.cfg.max), C.cherry); return; }
    if (this.total() + v > State.money) { Snd.play('error'); this.say('NOT ENOUGH GEMS', C.cherry); return; }
    this.bets[k] = (this.bets[k] || 0) + v; this.undo.push([k, v]); Snd.play('chip');
  }
  popChip() { if (this.busy || !this.undo.length) return; const [k, v] = this.undo.pop(); this.bets[k] -= v; if (this.bets[k] <= 0) delete this.bets[k]; Snd.play('chip'); }
  rebet() {
    if (this.busy || !this.last) return;
    let s = 0; for (const k in this.last) s += this.last[k];
    if (s > State.money) { Snd.play('error'); this.say('NOT ENOUGH GEMS TO REBET', C.cherry); return; }
    this.bets = Object.assign({}, this.last); this.undo = Object.entries(this.bets); Snd.play('chips');
  }

  startShake() {
    if (this.busy) return;
    if (!this.total() && this.last) this.rebet();
    if (!this.total()) { Snd.play('error'); this.say('PUT A CHIP ON A BET FIRST', C.cherry); return; }
    if (this.total() > State.money) { Snd.play('error'); return; }
    this.shaking = true; this.shakeT = 0;
  }

  throwDice() {
    this.shaking = false;
    this.busy = true;
    const bet = this.total();
    this.last = Object.assign({}, this.bets); State.lastBet['dice:' + this.obj.cfg] = this.last;
    State.take(bet);
    this.stake = bet;
    const bets = this.bets;
    this.final = Luck.pick(() => DiceMath.roll(), r => DiceMath.payout(bets, r[0], r[1]));
    this.result = null;
    this.dice = [0, 1].map(i => ({ x: 24 + i * 10, y: 74 - i * 4, vx: U.range(170, 230), vy: U.range(-220, -170), f: U.int(1, 6), ft: 0, moving: true, bounces: 0 }));
    this.throwT = 0;
    Snd.play('dice');
  }

  settle() {
    const [a, b] = this.final;
    this.dice[0].f = a; this.dice[1].f = b;
    this.result = { a, b, sum: a + b }; this.resultT = 0;
    const pay = DiceMath.payout(this.bets, a, b);
    this.finish('dice', this.stake, pay, (this.dice[0].x + this.dice[1].x) / 2, 50);
    this.tl.after(1.6, () => { this.bets = {}; this.undo = []; this.busy = false; });
  }

  update(dt) {
    if (this.busy && Input.pressed('b')) Input.eat('b');
    if (super.update(dt)) return;
    this.resultT += dt;
    if (this.shaking) {
      this.shakeT += dt;
      if (Math.floor(this.shakeT / 0.11) !== Math.floor((this.shakeT - dt) / 0.11)) Snd.play('rattle');
      if (!Input.isDown('a') && !Input.mouse.down) this.throwDice();
      else if (this.shakeT > 3) this.throwDice();
    }
    if (this.busy && !this.result) {
      this.throwT += dt;
      let moving = false;
      for (let i = 0; i < 2; i++) {
        const d = this.dice[i];
        if (!d.moving) continue;
        d.x += d.vx * dt; d.y += d.vy * dt;
        if (d.y < 18) { d.y = 18; d.vy = Math.abs(d.vy) * 0.62; d.vx *= 0.8; Snd.play('thud'); d.bounces++; }
        if (d.y > 70) { d.y = 70; d.vy = -Math.abs(d.vy) * 0.45; }
        if (d.x > 296) { d.x = 296; d.vx = -Math.abs(d.vx) * 0.5; Snd.play('thud'); }
        if (d.x < 8) { d.x = 8; d.vx = Math.abs(d.vx) * 0.5; }
        const fr = 1 - Math.min(1, 1.5 * dt);
        d.vx *= fr; d.vy *= fr;
        d.ft -= dt;
        if (d.ft <= 0) { d.f = U.int(1, 6); d.ft = 0.06; }
        if ((Math.hypot(d.vx, d.vy) < 12 && this.throwT > 0.6) || this.throwT > 3) { d.moving = false; d.f = this.final[i]; Snd.play('thud'); }
        else moving = true;
      }
      // keep the two dice apart
      const [p, q] = this.dice;
      if (Math.abs(p.x - q.x) < 13 && Math.abs(p.y - q.y) < 13) { const s = p.x < q.x ? -1 : 1; p.x += s * 0.8; q.x -= s * 0.8; }
      if (!moving) this.settle();
    }
    this.ui.update(dt);
  }

  drawBetBox(b, f) {
    const d = b.d, has = this.bets[d.k];
    const hit = this.result && d.win(this.result.a, this.result.b) && this.resultT < 3 && Math.floor(this.resultT * 6) % 2 === 0;
    box(b.x, b.y, b.w, b.h, hit ? C.yellow : this.cfg.feltD, f ? C.yellow : C.white);
    Font.draw(d.label, b.x + b.w / 2, b.y + 3, { c: hit ? C.ink : C.white, a: 'c', f: d.label.length > 8 ? 's' : 'm' });
    Font.draw(d.sub, b.x + b.w / 2, b.y + 12, { c: hit ? C.ink : this.cfg.feltL, f: 's', a: 'c' });
    Font.draw('x' + d.m, b.x + 4, b.y + 20, { c: hit ? C.crimson : C.yellow, f: 's' });
    if (has) { chipStack(has, b.x + b.w - 10, b.y + b.h - 6, 4, 5); Font.draw(U.moneyShort(has), b.x + b.w - 18, b.y + 20, { c: C.lemon, f: 's', a: 'r' }); }
  }

  draw() {
    const cfg = this.cfg;
    R(0, 0, W, H, cfg.felt);
    // back wall with rubber pyramids
    R(0, 13, W, 8, C.woodD);
    for (let x = 0; x < W; x += 4) { P(x, 15, C.charcoal); P(x + 2, 18, C.charcoal); }
    R(0, 21, W, 1, C.gold);
    // throwing area
    R(0, 22, W, 60, cfg.felt);
    Font.draw('LUCKY', 160, 36, { c: cfg.feltL, a: 'c', s: 2 });
    Font.draw('7', 160, 52, { c: cfg.feltD, a: 'c', s: 2 });
    R(0, 81, W, 3, C.woodL); R(0, 81, W, 1, C.lemon);
    // dice
    for (const d of this.dice) {
      alpha(0.35); R(d.x + 2, d.y + 3, 12, 12, C.black); alpha(1);
      spr(Spr.die(d.f, 12), d.x, d.y);
    }
    if (this.shaking) {
      const sx = 34 + Math.round(Math.sin(this.t * 40) * 2), sy = 64;
      spr(Spr.die(U.int(1, 6), 12), sx, sy); spr(Spr.die(U.int(1, 6), 12), sx + 13, sy - 2);
      Font.draw('SHAKE SHAKE...', 60, 44, { c: C.yellow, f: 's', a: 'c', ol: C.ink });
    }
    if (this.result) {
      const k = Math.min(1, this.resultT * 4);
      Font.draw(String(this.result.sum), 270, 34 - 6 * (1 - Ease.outBack(k)), { c: this.result.sum === 7 ? C.yellow : C.white, a: 'c', s: 3, ol: C.ink });
    }
    Font.draw('BET ' + U.moneyShort(this.total()), 226, 160, { c: C.yellow });
    Font.draw('LIMIT ' + U.moneyShort(cfg.max), 314, 170, { c: cfg.feltL, f: 's', a: 'r' });
    this.ui.draw();
    this.drawTop();
    this.fx.draw();
    UI.drawPops(this, 1 / 60);
    this.drawMsg(64);
  }
}

GAMES.dice = obj => new DiceScene(obj);
GAME_INFO.dice = cfg => { const c = DICE_CFG[cfg] || DICE_CFG.main; return { name: c.name, limits: U.moneyShort(c.min) + '-' + U.moneyShort(c.max) }; };

// ---- js/games/horses.js
'use strict';
// =====================================================================
//  CASHINO - the race book. Pick a horse from the race card, then
//  watch six pixel ponies thunder down the track at CASHINO DOWNS.
// =====================================================================

const HORSE_NAMES = ['SIR GALLOPS', 'HOOF HEARTED', 'NEIGH SAYER', 'PONY SOPRANO', 'MANE EVENT', 'BET THE FARM', 'STABLE GENIUS', 'OAT CHASER',
  'SEABISCUIT JR', 'LUCKY HOOVES', 'GLUE FACTORY', 'HAY GIRL', 'TROTSKY', 'HORSEY MCHORSE', 'GALLOPING GUS', 'WINS DAY', 'RUBY TUESDAY',
  'NAG-A-SAKI', 'BLING BLING', 'SPUD', 'LATE BLOOMER', 'LAST PLACE LARRY', 'MR. WHISKERS II', 'JACKPOT JOE', 'CARROT TOP', 'THUNDER BUNS'];
const SILKS = [C.red, C.blue, C.yellow, C.lime, C.pink, C.orange];
const COATS = [[C.wood, C.woodD], [C.woodL, C.wood], [C.charcoal, C.ink], [C.silver, C.gray], [C.brown, C.woodD], [C.tang, C.rust]];
const ODDS = [[0.5, '1-2'], [0.8, '4-5'], [1, 'EVEN'], [1.5, '3-2'], [2, '2-1'], [2.5, '5-2'], [3, '3-1'], [4, '4-1'], [5, '5-1'], [6, '6-1'], [8, '8-1'], [10, '10-1'], [12, '12-1'], [15, '15-1'], [20, '20-1'], [30, '30-1'], [50, '50-1']];
const RACE_LIMITS = { min: gems(1), max: gems(20000) };

const HorseMath = {
  race(num) {
    const names = U.shuffle(HORSE_NAMES.slice()).slice(0, 6);
    const str = names.map(() => Math.pow(U.range(0.45, 1.6), 2.2));
    const sum = str.reduce((a, b) => a + b, 0);
    const horses = names.map((name, i) => {
      const p = str[i] / sum;
      const fair = (1 / p) * 0.9 - 1;
      let od = ODDS[0];
      for (const o of ODDS) if (o[0] <= fair) od = o;
      return { i, name, p, odds: od[0], oddsLabel: od[1], silk: SILKS[i], coat: COATS[U.int(0, COATS.length - 1)] };
    });
    const order = horses.slice().sort((a, b) => b.p - a.p);
    order.forEach((h, k) => { h.form = Math.max(1, 5 - Math.floor(k * 0.9)); });
    return { num, horses, len: 1200 };
  },
  winner(race) { return U.weighted(race.horses.map(h => h.p)); },
  payout(race, pick, bet, w) { return pick === w ? Math.round(bet * (1 + race.horses[w].odds)) : 0; },
};

// procedural galloping horse frames (26x20), silks on the jockey
const HorseArt = {
  cache: new Map(),
  frames(coat, silk) {
    const key = coat[0] + silk;
    if (this.cache.has(key)) return this.cache.get(key);
    const legs = [[4, -3, 3, -4], [1, 2, -2, 3], [-3, -1, 3, 1], [2, 4, 0, -3]];
    const out = legs.map((L, f) => {
      const c = Gfx.canvas(28, 22);
      Gfx.into(c, () => {
        const [body, dark] = coat;
        // legs (behind body)
        const leg = (x, dx, col) => { line(x, 13, x + Math.round(dx / 2), 16, col); line(x + Math.round(dx / 2), 16, x + dx, 19, col); P(x + dx, 20, C.ink); };
        leg(19, L[0], dark); leg(8, L[2], dark);
        // tail
        line(5, 9, 2, 11 + (f % 2), dark); line(4, 9, 1, 12 - (f % 2), dark);
        // body
        ell(12, 11, 8, 4, body); R(6, 13, 13, 1, dark);
        // neck & head
        for (let i = 0; i < 5; i++) R(18 + i, 9 - i, 3, 3, body);
        R(22, 3, 5, 3, body); R(25, 5, 2, 2, dark); P(23, 2, dark); P(23, 4, C.ink);
        // front legs over body
        leg(17, L[1], body); leg(10, L[3], body);
        // jockey
        R(11, 3, 5, 5, silk); R(12, 1, 3, 2, silk); P(15, 2, C.skin); R(15, 4, 3, 1, silk);
        R(10, 7, 3, 3, C.white);
      });
      return outline(c, C.ink);
    });
    this.cache.set(key, out);
    return out;
  },
};

class HorsesScene extends GameScene {
  constructor(obj) {
    super(obj, 'RACE BOOK');
    State.lastBet = State.lastBet || {};
    this.raceNum = (State.flags.raceNum || 6) + 1;
    State.flags.raceNum = this.raceNum;
    this.race = HorseMath.race(this.raceNum);
    this.pick = 0;
    this.bp = new BetPicker('race', RACE_LIMITS.min, RACE_LIMITS.max);
    this.bp.fit();
    this.phase = 'card';
    this.cam = 0; this.crowd = Array.from({ length: 120 }, (_, i) => ({ x: i * 6 + U.int(0, 3), c: U.pick([C.red, C.yellow, C.sky, C.pink, C.lime, C.white, C.tang, C.lilac]), ph: U.range(0, TAU) }));
    this.ticker = ''; this.tickT = 0;
    this.build();
  }
  canLeave() { return this.phase !== 'race'; }

  build() {
    const g = this.ui;
    g.clear();
    if (this.phase === 'card') {
      this.race.horses.forEach((h, i) => g.add({ x: 10, y: 28 + i * 17, w: 206, h: 16, i, draw: (b, f) => this.drawRow(b, f), onPress: () => { this.pick = i; }, sound: 'move' }));
      this.bet = addBetButtons(this, this.bp, 226, 70);
      this.goBtn = g.add({ x: 226, y: 92, w: 88, h: 26, label: 'BET & RACE', sub: 'ON #' + (this.pick + 1), style: 'red', onPress: () => this.start() });
      g.focus = g.items[this.pick];
    } else if (this.phase === 'result') {
      g.add({ x: 110, y: 150, w: 100, h: 20, label: 'NEXT RACE', style: 'red', onPress: () => this.nextRace() });
      g.focus = g.items[0];
    }
  }

  start() {
    const bet = this.bp.value;
    if (State.money < bet) { Snd.play('error'); this.say(State.money < RACE_LIMITS.min ? 'NOT ENOUGH GEMS' : 'LOWER YOUR BET', C.cherry); this.bp.fit(); return; }
    State.take(bet);
    this.stake = bet;
    const race = this.race, pick = this.pick;
    this.winner = Luck.pick(() => HorseMath.winner(race), w => HorseMath.payout(race, pick, bet, w));
    // finishing times: the winner is fastest; the rest trail by a little
    const Tw = U.range(10.5, 12);
    const photo = U.chance(0.25);
    const others = race.horses.map(h => h.i).filter(i => i !== this.winner);
    U.shuffle(others);
    this.runners = race.horses.map(h => {
      let T;
      if (h.i === this.winner) T = Tw;
      else { const rank = others.indexOf(h.i); T = Tw * (1 + (photo && rank === 0 ? U.range(0.002, 0.006) : U.range(0.012, 0.03) + rank * U.range(0.01, 0.025))); }
      return { h, T, a1: U.range(-0.1, 0.1), a2: U.range(-0.04, 0.04), a3: U.range(-0.02, 0.02), prog: 0, x: 0, anim: U.range(0, 4), done: false, place: 0 };
    });
    this.photo = photo;
    this.rt = -2.2; // countdown before the gates open
    this.finishOrder = [];
    this.leader = -1;
    this.said = {};
    this.phase = 'race';
    this.ui.clear();
    Snd.play('bugle');
    this.setTicker('THE HORSES ARE AT THE GATE...');
  }

  setTicker(t) { this.ticker = t; this.tickT = 0; }

  update(dt) {
    if (super.update(dt)) return;
    this.tickT += dt;
    if (this.phase === 'card') {
      const f = this.ui.focus;
      if (f && f.i !== undefined && f.i !== this.pick) { this.pick = f.i; this.goBtn.sub = 'ON #' + (this.pick + 1); }
      this.ui.update(dt);
      return;
    }
    if (this.phase === 'race') {
      const speed = Input.isDown('a') || Input.mouse.down ? 3 : 1;
      this.rt += dt * speed;
      const L = this.race.len;
      let lead = -1, leadX = -1;
      for (const r of this.runners) {
        if (this.rt <= 0) { r.prog = 0; }
        else {
          const u = Math.min(1, this.rt / r.T);
          r.prog = Math.min(1, u + r.a1 * Math.sin(Math.PI * u) + r.a2 * Math.sin(2 * Math.PI * u) + r.a3 * Math.sin(3 * Math.PI * u));
          if (u >= 1 && !r.done) { r.done = true; this.finishOrder.push(r.h.i); r.place = this.finishOrder.length; if (r.place === 1) this.onWin(r); }
          r.anim += dt * speed * 10;
        }
        r.x = r.prog * L;
        if (r.x > leadX) { leadX = r.x; lead = r.h.i; }
      }
      if (this.rt > 0 && !this.said.off) { this.said.off = true; this.setTicker("AND THEY'RE OFF!"); Snd.play('cheer'); }
      if (this.rt > 0 && lead !== this.leader && leadX > 80 && !this.finishOrder.length) {
        this.leader = lead;
        const nm = this.race.horses[lead].name;
        this.setTicker(U.pick([nm + ' TAKES THE LEAD!', nm + ' MOVES TO THE FRONT!', 'HERE COMES ' + nm + '!', nm + ' SURGES AHEAD!']));
      }
      if (leadX > L * 0.72 && !this.said.stretch) { this.said.stretch = true; this.setTicker('DOWN THE STRETCH THEY COME!'); Snd.play('cheer'); }
      if (this.rt > 0 && Math.floor(this.rt * 3) !== Math.floor((this.rt - dt * speed) * 3)) Snd.play('gallop');
      this.cam = U.clamp(leadX - 200, 0, L + 70 - W);
      if (this.finishOrder.length === 6 && !this.endT) this.endT = 1.2;
      if (this.endT) { this.endT -= dt; if (this.endT <= 0) this.finishRace(); }
      for (const r of this.runners) if (this.rt > 0 && !r.done && Math.random() < 0.3) this.fx.add({ type: 'dot', x: this.sx(r.x) - 12, y: this.laneY(r.h.i) + U.range(-1, 2), vx: -U.range(10, 30), vy: -U.range(5, 20), g: 60, life: 0.4, c: C.tang });
    }
    if (this.phase === 'result') this.ui.update(dt);
  }

  onWin(r) {
    const nm = r.h.name;
    this.setTicker(this.photo ? 'PHOTO FINISH!!! ... ' + nm + ' WINS IT!' : nm + ' WINS IT!');
    Snd.play('cheer');
    if (this.photo) Gfx.flash(C.white, 0.3);
  }

  finishRace() {
    this.endT = 0;
    this.phase = 'result';
    const pay = HorseMath.payout(this.race, this.pick, this.stake, this.winner);
    this.win = this.finish('horses', this.stake, pay, 160, 90, { jackpot: pay >= this.stake * 50 });
    this.build();
  }

  nextRace() {
    this.raceNum++; State.flags.raceNum = this.raceNum;
    this.race = HorseMath.race(this.raceNum);
    this.phase = 'card'; this.runners = null; this.cam = 0;
    this.bp.fit();
    this.build();
  }

  sx(x) { return Math.round(x - this.cam + 30); }
  laneY(i) { return 76 + i * 14; }

  drawRow(b, f) {
    const h = this.race.horses[b.i], picked = this.pick === b.i;
    box(b.x, b.y, b.w, b.h, picked ? C.grape : C.night, f ? C.yellow : picked ? C.lilac : C.plum);
    R(b.x + 3, b.y + 3, 10, 10, h.silk); Font.draw(String(b.i + 1), b.x + 8, b.y + 5, { c: C.ink, f: 's', a: 'c' });
    Font.draw(h.name, b.x + 17, b.y + 5, { c: picked ? C.white : C.lav });
    for (let k = 0; k < 5; k++) Font.draw('★', b.x + 130 + k * 5, b.y + 6, { c: k < h.form ? C.yellow : C.plum, f: 's' });
    Font.draw(h.oddsLabel, b.x + b.w - 4, b.y + 5, { c: C.lime, a: 'r' });
  }

  drawTrack() {
    const cam = this.cam, t = this.t;
    // sky & grandstand
    vgrad(0, 13, W, 30, [C.sky, '#8fb4ff']);
    R(0, 34, W, 24, C.plum); R(0, 34, W, 2, C.gold);
    for (const p of this.crowd) {
      const x = ((p.x - cam * 0.5) % 720 + 720) % 720 - 40;
      if (x < -4 || x > W + 4) continue;
      const cheer = this.phase === 'race' && this.rt > 0 ? Math.round(Math.sin(t * 8 + p.ph)) : 0;
      R(x, 41 - cheer + (p.x % 12 > 5 ? 6 : 0), 3, 3, p.c);
      P(x + 1, 39 - cheer + (p.x % 12 > 5 ? 6 : 0), C.skin);
    }
    R(0, 55, W, 3, C.woodD);
    Font.draw('CASHINO DOWNS', 160 - ((cam * 0.5) % 400) + 100, 36, { c: C.yellow, f: 's', a: 'c' });
    // rail
    R(0, 60, W, 2, C.white);
    for (let x = -((cam) % 16); x < W; x += 16) R(x, 60, 2, 8, C.white);
    // dirt
    R(0, 68, W, 90, '#b07a45');
    for (let i = 0; i < 80; i++) { const x = ((i * 37 - cam) % W + W) % W, y = 70 + (i * 23) % 86; P(x, y, C.wood); }
    for (let i = 1; i < 6; i++) { for (let x = -((cam) % 12); x < W; x += 12) R(x, 69 + i * 14, 6, 1, '#c98a4b'); }
    R(0, 158, W, 2, C.white);
    for (let x = -((cam) % 16); x < W; x += 16) R(x, 156, 2, 6, C.white);
    // distance markers & finish line
    const L = this.race.len;
    for (let d = 200; d < L; d += 200) {
      const x = this.sx(d);
      if (x > -10 && x < W + 10) { R(x, 50, 2, 12, C.red); Font.draw(String(L - d), x + 1, 44, { c: C.white, f: 's', a: 'c', ol: C.ink }); }
    }
    const fx = this.sx(L);
    if (fx > -12 && fx < W + 12) {
      for (let y = 68; y < 158; y += 4) { R(fx, y, 2, 2, C.white); R(fx + 2, y + 2, 2, 2, C.white); R(fx + 2, y, 2, 2, C.ink); R(fx, y + 2, 2, 2, C.ink); }
      R(fx + 1, 40, 2, 22, C.silver); R(fx - 3, 36, 10, 5, C.red);
    }
  }

  draw() {
    if (this.phase === 'card') {
      R(0, 0, W, H, C.forest);
      for (let y = 16; y < H; y += 8) for (let x = (y % 16 ? 4 : 0); x < W; x += 8) P(x, y, '#10573a');
      panel(6, 15, 214, 132, C.ink, C.gold);
      Font.draw('RACE ' + this.race.num + ' - 1200M - PICK YOUR HORSE', 113, 18, { c: C.lemon, a: 'c', f: 's' });
      Font.draw('FORM', 152, 150, { c: C.lav, f: 's', a: 'c' }); Font.draw('ODDS', 204, 150, { c: C.lav, f: 's', a: 'c' });
      Font.draw('WIN PAYS ODDS + YOUR BET BACK', 113, 160, { c: C.mint, f: 's', a: 'c' });
      const h = this.race.horses[this.pick];
      panel(222, 15, 94, 46, C.night, h.silk);
      spr(HorseArt.frames(h.coat, h.silk)[Math.floor(this.t * 8) % 4], 256, 20);
      Font.draw(h.name, 269, 43, { c: C.white, f: 's', a: 'c' });
      Font.draw('PAYS ' + U.moneyShort(Math.round(this.bp.value * (1 + h.odds))), 269, 51, { c: C.yellow, f: 's', a: 'c' });
      this.bet.draw();
      this.ui.draw();
      this.drawTop();
      this.fx.draw();
      this.drawMsg(130);
      return;
    }
    this.drawTrack();
    // horses, back lanes first
    for (const r of this.runners) {
      const x = this.sx(r.x), y = this.laneY(r.h.i);
      const fr = this.rt > 0 && !r.done ? Math.floor(r.anim) % 4 : r.done ? Math.floor(r.anim) % 4 : 0;
      alpha(0.3); ell(x - 12, y + 9, 9, 2, C.black); alpha(1);
      spr(HorseArt.frames(r.h.coat, r.h.silk)[fr], x - 26, y - 11);
      R(x - 16, y - 3, 5, 5, C.white); Font.draw(String(r.h.i + 1), x - 13, y - 3, { c: C.ink, f: 's', a: 'c' });
      if (r.h.i === this.pick) { Font.draw('YOU', x - 13, y - 19, { c: C.yellow, f: 's', a: 'c', ol: C.ink }); }
    }
    this.fx.draw();
    // standings
    R(0, 13, W, 9, C.ink);
    const order = this.runners.slice().sort((a, b) => (a.place || 99) - (b.place || 99) || b.x - a.x);
    Font.draw('RACE ' + this.race.num, 4, 15, { c: C.lemon, f: 's' });
    order.forEach((r, k) => { R(60 + k * 16, 14, 12, 7, r.h.silk); Font.draw(String(r.h.i + 1), 66 + k * 16, 15, { c: C.ink, f: 's', a: 'c' }); });
    Font.draw('YOUR #' + (this.pick + 1) + ' ' + U.moneyShort(this.stake), 316, 15, { c: C.yellow, f: 's', a: 'r' });
    // countdown
    if (this.rt < 0) Font.draw(this.rt < -1.4 ? 'READY...' : this.rt < -0.6 ? 'SET...' : 'GO!', 160, 100, { c: C.yellow, a: 'c', s: 2, ol: C.ink });
    // commentary ticker
    R(0, 162, W, 18, C.ink); R(0, 162, W, 1, C.bronze);
    const shown = this.ticker.slice(0, Math.floor(this.tickT * 40));
    Font.draw(shown, 160, 168, { c: C.white, a: 'c' });
    if (this.phase === 'race' && this.rt > 0) Font.draw('HOLD Z: FAST', 316, 173, { c: C.slate, f: 's', a: 'r' });
    if (this.phase === 'result') {
      panel(70, 40, 180, 96, C.night, C.gold);
      Font.draw('RESULTS', 160, 44, { c: C.lemon, a: 'c' });
      this.finishOrder.slice(0, 3).forEach((i, k) => {
        const h = this.race.horses[i];
        R(80, 58 + k * 14, 10, 10, h.silk); Font.draw(String(i + 1), 85, 60 + k * 14, { c: C.ink, f: 's', a: 'c' });
        Font.draw(['1ST', '2ND', '3RD'][k] + ' ' + h.name, 96, 60 + k * 14, { c: i === this.pick ? C.yellow : C.white });
      });
      const won = this.winner === this.pick;
      Font.draw(won ? 'YOU WIN ' + U.money(this.win) + '!' : 'YOUR HORSE LOST. NEXT TIME!', 160, 106, { c: won ? C.lime : C.cherry, a: 'c' });
      Font.draw('PAID ' + this.race.horses[this.winner].oddsLabel, 160, 118, { c: C.lav, f: 's', a: 'c' });
      this.ui.draw();
    }
    this.drawTop();
    UI.drawPops(this, 1 / 60);
    this.drawMsg(130);
  }
}

  update(dt) {

    for (const f of this.works) {

        for (let i = 0; i < 28; i++) { const a = (i / 28) * TAU, sp = U.range(50, 80); this.fx.add({ type: 'dot', x: f.x, y: f.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, g: 40, drag: 1.2, life: U.range(0.8, 1.4), c: i % 3 ? f.c : C.white, s: 1 }); }

    if (this.t > 6 && (Input.pressed('a') || Input.mouse.pressed)) {

    // the casino building

      }
    }
  }
}

// ---- js/main.js
'use strict';
// =====================================================================
//  CASHINO - scene stack, transitions and the main loop
// =====================================================================

const Game = {
  stack: [], t: 0, trans: null, frame: 0,

  get top() { return this.stack[this.stack.length - 1]; },
  push(s) { this.stack.push(s); s.enter(); },
  pop() {
    const s = this.stack.pop();
    if (s) s.exit();
    const t = this.top;
    if (t) t.resume();
    return s;
  },
  // replace the whole stack with one scene
  set(s) { while (this.stack.length) this.pop(); this.push(s); },
  find(cls) { return this.stack.find(s => s instanceof cls); },

  // pixel diamond wipe; fn runs when the screen is fully covered
  go(fn, color = C.ink) {
    if (this.trans) return;
    this.trans = { t: 0, dur: 0.7, mid: false, fn, color };
    Snd.play('whoosh');
  },

  update(dt) {
    this.t += dt;
    this.frame++;
    Input.update(dt);
    Wallet.update(dt);
    const tr = this.trans;
    if (tr) {
      tr.t += dt;
      if (!tr.mid && tr.t >= tr.dur / 2) { tr.mid = true; tr.fn(); Input.eatAll(); }
      if (tr.t >= tr.dur) this.trans = null;
    }
    const top = this.top;
    if (top && !(tr && !tr.mid)) top.update(dt);
    if (typeof State !== 'undefined' && State.ready) State.tick(dt);
    Input.endFrame();
  },

  draw(dt) {
    Gfx.beginFrame(dt);
    let i = this.stack.length - 1;
    while (i > 0 && !this.stack[i].opaque) i--;
    for (; i < this.stack.length; i++) { ctx.globalAlpha = 1; this.stack[i].draw(); }
    ctx.globalAlpha = 1;
    if (this.trans) this.drawTrans();
    if (typeof Toasts !== 'undefined') Toasts.draw(dt);
    Gfx.endFrame(dt);
  },

  drawTrans() {
    const tr = this.trans, k = tr.t / tr.dur;
    // 0..0.5 cover, 0.5..1 reveal
    const cover = k < 0.5 ? k * 2 : (1 - k) * 2;
    const S = 16;
    ctx.fillStyle = tr.color;
    for (let gy = 0; gy <= H / S; gy++) {
      for (let gx = 0; gx <= W / S; gx++) {
        const d = (gx / (W / S)) * 0.5 + (gy / (H / S)) * 0.5;
        const local = U.clamp(cover * 2 - d, 0, 1);
        const r = Math.ceil(local * S * 0.75);
        if (r > 0) diamond(gx * S, gy * S, r, tr.color);
      }
    }
  },
};

// ---------------------------------------------------------------------
//  boot
// ---------------------------------------------------------------------
function boot(hotData) {
  Gfx.init();
  Input.init(Gfx.cv);
  Settings.load();
  Spr.init();
  if (typeof State !== 'undefined') State.init(hotData && hotData.save);
  Game.set(new TitleScene());
  Gfx.cv.focus();

  let last = performance.now(), acc = 0;
  const STEP = 1 / 60;
  function frame(now) {
    let dt = (now - last) / 1000;
    last = now;
    if (dt > 0.25) dt = 0.25;
    acc += dt;
    let steps = 0;
    while (acc >= STEP && steps < 5) { Game.update(STEP); acc -= STEP; steps++; }
    if (steps === 5) acc = 0;
    try { Game.draw(dt); } catch (e) { console.error(e); }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // keep progress if the page is being hidden/closed
  addEventListener('visibilitychange', () => { if (document.hidden && typeof State !== 'undefined') State.save(); });
  addEventListener('pagehide', () => { if (typeof State !== 'undefined') State.save(); });
}

// persistent settings (sound)
const Settings = {
  load() {
    try {
      const s = JSON.parse(localStorage.getItem('cashino_settings') || '{}');
      if (s.music === false) Snd.musOn = false;
      if (s.sfx === false) Snd.sfxOn = false;
    } catch (e) { /* storage blocked - defaults */ }
  },
  save() {
    try { localStorage.setItem('cashino_settings', JSON.stringify({ music: Snd.musOn, sfx: Snd.sfxOn })); } catch (e) { /* ignore */ }
  },
};

// development hooks used by the screenshot/test tools
window.DBG = {
  play(o = {}) {
    State.newGame();
    if (o.money !== undefined) State.money = o.money;
    Object.assign(State.flags, o.flags || {});
    if (o.pos) State.pos = o.pos;
    if (o.owned) for (const k of o.owned) State.owned[k] = true;
    if (o.outfit) State.outfit = o.outfit;
    if (o.wear) Object.assign(State.wear, o.wear);
    Wallet.snap();
    Game.set(new Overworld(false));
    if (o.game) { const obj = World.objs.find(ob => ob.t === o.game.t && (!o.game.cfg || ob.cfg === o.game.cfg)); Game.push(GAMES[OBJ[obj.t].game](obj)); }
    return 'ok';
  },
};

(function start() {
  // When hosted as a Claude artifact, keep the save across live page updates.
  const hot = window.claude && window.claude.hot;
  try { if (hot && hot.snapshot) hot.snapshot(() => ({ save: typeof State !== 'undefined' && State.ready ? State.serialize() : null })); } catch (e) { /* optional */ }
  let booted = false;
  const go = data => { if (booted) return; booted = true; boot(data || {}); };
  if (hot && hot.ready) {
    try { hot.ready(go); } catch (e) { /* fall through */ }
    setTimeout(() => go(hot.data), 1500); // never wait forever on the host
    return;
  }
  go(hot && hot.data);
})();
