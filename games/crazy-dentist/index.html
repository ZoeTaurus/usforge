<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Crazy Dentist</title>
<style>
  /* Layout: one centered, integer-scaled 320x180 pixel canvas on a deep arcade-night backdrop */
  :root {
    --bg: #181425;      /* palette black */
    --frame: #3a4466;   /* palette slate */
    --ink: #c0cbdc;     /* palette light gray */
    --glow: #0099db;    /* palette sky */
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); overflow: hidden; font: 13px/1.4 ui-monospace, Menlo, Consolas, monospace; }
  #stage { box-sizing: border-box; width: 100%; height: 100%; padding-block: 12px; padding-inline: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; }
  #screen { position: relative; line-height: 0; box-shadow: 0 0 0 2px var(--frame), 0 0 40px rgba(0, 153, 219, 0.18); max-width: 100%; }
  #game { display: block; image-rendering: pixelated; image-rendering: crisp-edges; cursor: none; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  #crt { position: absolute; inset: 0; pointer-events: none; background-image: linear-gradient(rgba(24, 20, 37, 0) 50%, rgba(24, 20, 37, 0.22) 50%); }
  .hint { display: none; margin: 0; color: var(--ink); text-align: center; }
  @media (orientation: portrait) and (max-width: 700px) { .hint { display: block; } }
  @media (prefers-reduced-motion: reduce) { #screen { box-shadow: 0 0 0 2px var(--frame); } }
</style>
<div id="stage">
  <div id="screen">
    <canvas id="game" width="320" height="180" aria-label="Crazy Dentist game screen" tabindex="0"></canvas>
    <div id="crt" hidden></div>
  </div>
  <p class="hint">Turn your phone sideways for a bigger screen.</p>
</div>
<script src="js/core.js"></script>
<script src="js/audio.js"></script>
<script src="js/art.js"></script>
<script src="js/face.js"></script>
<script src="js/mouth.js"></script>
<script src="js/macro.js"></script>
<script src="js/scenes.js"></script>
<script src="js/menus.js"></script>
<script src="js/gadgets.js"></script>
<script src="js/main.js"></script>

</body></html>
