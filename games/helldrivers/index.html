<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HELLDRIVE</title>
    <link rel="stylesheet" href="./src/style.css" />
    <script>
      // If this page was opened by double-clicking the file, the game code
      // can't load. Explain what to do instead of showing a blank page.
      if (location.protocol === 'file:') {
        document.addEventListener('DOMContentLoaded', function () {
          if (document.querySelector('script[type=module]:not([src])')) return; // packed version: fine
          document.body.innerHTML = '<div style="font:18px/1.6 system-ui,sans-serif;max-width:640px;margin:60px auto;padding:24px;color:#222">' +
            '<h1 style="color:#c22">HELLDRIVE can\'t start from this file</h1>' +
            '<p>This <b>index.html</b> is the developer version and needs the local server.</p>' +
            '<p><b>Easiest:</b> double-click <b>HELLDRIVE.html</b> in the same folder instead.</p>' +
            '<p><b>Or:</b> open a terminal in this folder and run <code>npm install &amp;&amp; npm start</code>.</p></div>';
        });
      }
    </script>
  </head>
  <body>
    <div id="hud"></div>
    <div id="start">
      <h1>HELLDRIVE</h1>
      <p class="region">Loading…</p>
      <p class="click">CLICK TO START YOUR ENGINE</p>
      <p class="sub">Milestone 4 · Bits fall off (press E for scrap)</p>
    </div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
